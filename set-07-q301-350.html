<title>EPS-TOPIK Vocabulary Quiz — Set 07 (Q301–Q350)</title>
<style>
  :root {
    --primary: #a78bfa;
    --primary-dark: #c4b5fd;
    --primary-soft: rgba(124,58,237,.22);
    --accent: #6366f1;
    --accent-soft: rgba(99,102,241,.18);

    --bg: #0b0b16;

    --text: #f2f1fa;
    --muted: #9d9db4;
    --border: rgba(255,255,255,.09);
    --shadow: 0 2px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans KR", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(700px 340px at 50% -5%, rgba(99,102,241,.14), transparent 60%); background-attachment: fixed; color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); color: #d6c9ff; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,.12); margin-bottom: 14px; transition: all .15s; }
  .back-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  header { background: #312e81; color: #fff; padding: 20px 16px 16px; position: relative; border-bottom: 1px solid rgba(255,255,255,.1); box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.4rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  header p { opacity: .92; font-size: .9rem; margin-top: 4px; }
  .progress-wrap { margin-top: 14px; background: rgba(0,0,0,.35); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .progress-bar { height: 100%; background: #a5b4fc; width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(165,180,252,.6); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { position: relative; background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; background: #6366f1; border-radius: 0 0 6px 6px; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: rgba(167,139,250,.55); }
  .q-card.answered::after { content: "✓"; position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: #059669; color: #fff; font-weight: 800; font-size: .95rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .q-num { display: inline-block; font-size: .92rem; font-weight: 800; color: #fff; background: #4f46e5; padding: 7px 18px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(79,70,229,.4); }
  .q-text { font-size: 1.16rem; white-space: pre-line; margin: 14px 0 18px; line-height: 1.85; font-weight: 500; color: #f2f1fa; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 16px 18px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid rgba(255,255,255,.09); border-radius: 14px; margin-bottom: 0; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #1e1e30; color: #f2f1fa; }
  .options label:hover { border-color: #8b5cf6; background: #232338; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,.3); }
  .options label::before { content: ""; flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid #7c7ca0; background: transparent; transition: all .15s; }
  .options label.selected { background: var(--accent-soft); border-color: #a78bfa; box-shadow: 0 4px 18px rgba(99,102,241,.4); }
  .options label.selected::before { border-color: #a78bfa; background: #a78bfa; box-shadow: inset 0 0 0 4px #1e1e30; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #a5b4fc; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 700; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .btn-primary { background: #4f46e5; color: #fff; box-shadow: 0 4px 18px rgba(79,70,229,.4); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 8px 24px rgba(79,70,229,.45); }
  .btn-primary:disabled { background: #2a2a3d; color: #77778e; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: rgba(255,255,255,.06); color: #d6c9ff; border: 2px solid rgba(255,255,255,.12); }
  .btn-ghost:hover { border-color: #8b5cf6; background: rgba(124,58,237,.2); }
  .submit-bar { position: sticky; bottom: 0; background: rgba(11,11,22,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 24px rgba(0,0,0,.5); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: #1e1b3a; border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; line-height: 1.05; color: #a5b4fc; }
  .score-card .pct { font-size: 1.15rem; color: #c9c6e0; margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: #e6e4f5; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: #4f46e5; color: #fff; border-color: transparent; box-shadow: 0 2px 12px rgba(79,70,229,.35); }
  .review-card { background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: #059669; }
  .verdict.no { background: #e11d48; }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; background: #1e1e30; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #12101f; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; color: #d9d7ea; }
  .explain b { color: #d6c9ff; }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; }
  .explain-stem { background: rgba(99,102,241,.18); border-left: 4px solid #a78bfa; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; color: #f2f1fa; }
  .exp-line { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.07); line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: #34d399; }
  .exp-mark.no { color: #fb7185; }
  .exp-note { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.4); border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; color: #fde9c8; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }

</style>

<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">&larr; Back to All Sets</a>
    <h1>EPS-TOPIK 문제은행 Quiz</h1>
    <p>Set 7 of 11 &bull; Questions 301–350 &bull; 50 questions &bull; EPS-TOPIK Vocabulary &mdash; answers are AI-generated (no answer key in the book) &mdash; check with a teacher &bull; Explanations in Nepali</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

</header>

<main id="quizView">

  </div>
</main>

<div class="submit-bar" id="submitBar">

</div>

<main id="resultView" class="hidden">

  <div class="filters">
    <button class="btn-ghost active" data-filter="all">All questions</button>
    <button class="btn-ghost" data-filter="wrong">Wrong only</button>
    <button class="btn-ghost" data-filter="correct">Correct only</button>
  </div>
  <div id="reviewList"></div>
</main>

<script>
const QUESTIONS = [{"n": "301", "q": "물체의 길이나 높이 등을 재는 도구로, 띠 모양의 눈금이 있는 유연한 재질로 만들어져 있고 건축, 재봉, 일상 생활 등 다양한 곳에서 사용합니다.", "options": ["자", "줄자", "저울", "캘리퍼스"], "answer": 1, "explain": "प्रश्नको अर्थ: यो सामानको लम्बाइ वा उचाइ नाप्न प्रयोग गरिने साधन हो। यो लचिलो हुन्छ र यसमा नाप्ने चिन्हहरू हुन्छन्।\nपहिलो विकल्प 자 (फिता वा स्केल) हो, जुन छोटो लम्बाइ नाप्न प्रयोग गरिन्छ तर लचिलो फिताको रूपमा हुँदैन। दोस्रो विकल्प 줄자 (जुल्जा) हो, जुन लम्बाइ वा उचाइ नाप्ने फिता आकारको लचिलो औजार हो र यसलाई निर्माण, वास्तुकला र दैनिक जीवनमा प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 저울 (तराजु) हो, जसले तौल नाप्छ। चौथो विकल्प 캘리퍼스 (क्यालिपर्स) हो, जसले वस्तुको सूक्ष्म आकार नाप्छ। सही उत्तर विकल्प २ (줄자) हो।"}, {"n": "302", "q": "물체의 안지름, 바깥지름, 깊이 등을 정밀하게 재는 측정 도구이다. 주로 과학 실험이나 공학 분야에서 사용되며, 눈금이 정밀하게 나뉘어 있어 작은 단위까지 측정할 수 있다.", "options": ["줄자", "전자 저울", "접시 저울", "버니어 캘리퍼스"], "answer": 3, "explain": "प्रश्नको अर्थ: यो सामानको भित्री वा बाहिरी गोलाइ र गहिराइ एकदम मसिनो गरी नाप्ने औजार हो। यो धेरैजसो विज्ञान वा इन्जिनियरिङको काममा प्रयोग गरिन्छ।\n① 줄자 भनेको नाप्ने फिता हो, यसले लम्बाइ नाप्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 전자 저울 भनेको डिजिटल तराजु हो, यसले तौल नाप्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 접시 저울 भनेको थाली तराजु हो, यसले पनि सामानको तौल नाप्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 버니어 캘리퍼스 भनेको भर्नियर क्यालिपर हो, यसले वस्तुको भित्री व्यास, बाहिरी व्यास र गहिराइ सूक्ष्म रूपमा नाप्ने भएकाले यो विवरणसँग एकदम मिल्छ। ✓"}, {"n": "303", "q": "환경을 오염시키지 않고 자연에서 얻을 수 있는 에너지입니다. 태양광, 풍력, 수력, 지열 등이 있으며, 탄소 배출이 적어 지구를 보호하는 데 도움이 됩니다.", "options": ["친환경 자동차", "친환경 에너지", "친환경 건물", "친환경 농업"], "answer": 1, "explain": "प्रश्नको अर्थ: यो वातावरणलाई नोक्सान नपुर्याई प्रकृतिबाट पाइने शक्ति वा ऊर्जा हो। घाम, हावा र पानी जस्ता स्रोतबाट यस्तो ऊर्जा बनाइन्छ।\n① 친환경 자동차 (वातावरणमैत्री गाडी) हो, जुन सवारी साधन हो। ✗\n② 친환경 에너지 (वातावरणमैत्री ऊर्जा) हो, जुन प्रकृतिबाट प्राप्त हुने, प्रदूषण नगर्ने र कार्बन उत्सर्जन कम गर्ने ऊर्जा हो ✓\n③ 친환경 건물 (वातावरणमैत्री भवन) हो, जुन भवनसँग सम्बन्धित छ। ✗\n④ 친환경 농업 (वातावरणमैत्री कृषि) हो, जुन खेतीकिसानीसँग सम्बन्धित छ। ✗"}, {"n": "304", "q": "오랜 시간에 걸쳐 지구의 평균 기온이나 강수량 등이 변하는 현상입니다. 주로 인간의 활동으로 인한 온실가스 증가가 원인이며, 이상기후, 해수면 상승 등을 일으킵니다.", "options": ["기후 변화", "환경 파괴", "지구 온난화", "친환경 정책"], "answer": 0, "explain": "प्रश्नको अर्थ: यो लामो समयको क्रममा पृथ्वीको औसत तापमान वा पानी पर्ने मात्रामा परिवर्तन आउने प्रक्रिया हो। मानिसका गतिविधिले गर्दा मौसम बिग्रँदै जाने समस्या यसमा हुन्छ।\n① 기후 변화 भनेको जलवायु परिवर्तन हो। लामो समयमा पृथ्वीको औसत तापक्रम र वर्षाको मात्रा परिवर्तन हुने प्रक्रियालाई यसले जनाउँछ ✓\n② 환경 파괴 भनेको वातावरण विनाश हो। यो प्राकृतिक वातावरण नष्ट हुने अवस्था हो, त्यसैले यो होइन। ✗\n③ 지구 온난화 भनेको पृथ्वीको तापक्रम वृद्धि हो। यो तापक्रम बढ्ने कुरा मात्र हो ✗\n④ 친환경 정책 भनेको वातावरणमैत्री नीति हो। यो वातावरण जोगाउन बनाइने नियम हो, त्यसैले यो होइन। ✗"}, {"n": "305", "q": "자연의 자원과 생태계를 심각하게 손상하는 현상입니다. 산림 벌채, 오염물질 배출, 무분별한 개발 등이 주요 원인으로, 이는 생물 다양성 감소와 지구 온난화 등 심각한 문제를 일으킵니다.", "options": ["기후 변화", "환경 파괴", "풍력 에너지", "ESG 경영"], "answer": 1, "explain": "प्रश्नको अर्थ: यो रुख काट्ने र फोहोर फाल्ने कार्यले गर्दा प्रकृति र वातावरण नष्ट हुने अवस्था हो। यसले जीवजन्तु र पृथ्वीलाई ठूलो असर पार्छ।\n① 기후 변화 (जलवायु परिवर्तन) हो। ✗\n② 환경 파괴 (वातावरण विनाश) हो, जसले प्राकृतिक स्रोत र पारिस्थितिक प्रणालीलाई गम्भीर रूपमा नोक्सान पुर्‍याउँछ र वन फँडानी यसको मुख्य कारण हो ✓\n③ 풍력 에너지 (वायु ऊर्जा) हो। ✗\n④ ESG 경영 (ESG व्यवस्थापन) हो। ✗"}, {"n": "306", "q": "이산화탄소, 메탄, 아산화질소 같은 대기 중에 존재하는 가스로, 지구의 열을 가두어 기온을 상승시키는 역할을 합니다.", "options": ["화석 연료", "기후 변화", "환경 오염", "온실 가스"], "answer": 3, "explain": "प्रश्नको अर्थ: यो हावामा पाइने यस्तो ग्यास हो जसले पृथ्वीको तापक्रम बढाउन मद्दत गर्छ। यसले वातावरणको गर्मीलाई बाहिर जान नदिई थुनेर राख्छ।\n① 화석 연료 (फसिल इन्धन) हो। ✗\n② 기후 변화 (जलवायु परिवर्तन) हो। ✗\n③ 환경 오염 (वातावरण प्रदूषण) हो। ✗\n④ 온실 가스 (ग्रिनहाउस ग्यास) हो, जुन वायुमण्डलमा पाइने कार्बनडाइअक्साइड, मिथेन आदि ग्यास हुन् जसले पृथ्वीको तापक्रम बढाउँछन् ✓"}, {"n": "307", "q": "해에서 나오는 빛과 열을 이용해 전기를 생산하는 에너지입니다. 환경에 미치는 영향이 적고 재생 가능하여 친환경적인 에너지로 주목받고 있습니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 0, "explain": "प्रश्नको अर्थ: यो घामको प्रकाश र तापलाई प्रयोग गरेर बिजुली निकाल्ने शक्ति हो। यसले वातावरणलाई सफा राख्न मद्दत गर्छ।\n① 태양광 에너지 (सौर्य ऊर्जा) हो, जसले सूर्यबाट आउने प्रकाश र तातो प्रयोग गरेर बिजुली उत्पादन गर्छ ✓\n② 풍력 에너지 (वायु ऊर्जा) हो। ✗\n③ 수력 에너지 (जलविद्युत ऊर्जा) हो। ✗\n④ 해양 에너지 (समुद्री ऊर्जा) हो। ✗\nशिक्षकको उत्तर-पत्र: ④ 해양 에너지 — मेरो उत्तर: ① 태양광 에너지। प्रश्न: '해에서 나오는 빛과 열' — सूर्यको प्रकाश र तापबाट बिजुली — सौर्य ऊर्जा, स्पष्ट छ; 해양 त समुद्र हो।"}, {"n": "308", "q": "대기 중 온실가스 증가로 인해 지구의 평균 기온이 상승하는 현상입니다. 이로 인해 생태계와 인간 생활에 심각한 영향을 미칩니다.", "options": ["글로벌화", "산업화", "지구 온난화", "단순화"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पृथ्वीको तापक्रम बिस्तारै तातो हुँदै जाने वा बढ्दै जाने समस्या हो। यसले गर्दा मौसममा नराम्रो असर पर्छ।\n① 글로벌화 भनेको विश्वव्यापीकरण हो। यो व्यापार र संस्कृति संसारभरि फैलिनु हो, त्यसैले यो होइन। ✗\n② 산업화 भनेको औद्योगिकीकरण हो। यो उद्योग र कारखानाहरूको विकास हुनु हो ✗\n③ 지구 온난화 भनेको पृथ्वीको तापक्रम वृद्धि हो। वायुमण्डलमा हरितगृह ग्यास बढेर पृथ्वीको औसत तापक्रम बढ्ने प्रक्रियालाई यसले जनाउँछ ✓\n④ 단순화 भनेको सरलीकरण हो। यो जटिल कुरालाई सजिलो बनाउनु हो, त्यसैले यो होइन। ✗"}, {"n": "309", "q": "석탄, 석유, 천연가스 같은 에너지원으로 많이 사용되지만, 환경 오염과 온실가스 배출의 주요 원인입니다.", "options": ["기후 변화", "재생에어지", "화석 연료", "온난화"], "answer": 2, "explain": "प्रश्नको अर्थ: यो कोइला वा खनिज तेल जस्ता जमिनमुनिबाट निकालिने इन्धन हो। यसलाई बाल्दा वातावरण प्रदूषण हुन्छ।\n① 기후 변화 भनेको जलवायु परिवर्तन हो। यो मौसम र वातावरणमा आउने फेरबदल हो, त्यसैले यो होइन। ✗\n② 재생에어지 भनेको नवीकरणीय ऊर्जा हो। यो प्रदूषण नगर्ने ऊर्जाको स्रोत हो ✗\n③ 화석 연료 भनेको जीवाश्म इन्धन हो। कोइला, खनिज तेल र प्राकृतिक ग्यास जस्ता वातावरण प्रदूषण गर्ने ऊर्जा स्रोतलाई यसले जनाउँछ ✓\n④ 온난화 भनेको तापक्रम वृद्धि हो। यो न्यानो हुने प्रक्रिया हो, इन्धन होइन, त्यसैले यो होइन। ✗"}, {"n": "310", "q": "물이 흐르거나 떨어지는 힘을 이용해 전기를 만드는 에너지입니다. 주로 댐이나 강에서 물의 흐름을 이용하여 발전하며, 재생 가능하고 친환경적인 에너지원으로 널리 사용됩니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 2, "explain": "प्रश्नको अर्थ: यो बग्ने वा माथिबाट खस्ने पानीको शक्ति प्रयोग गरेर बिजुली उत्पादन गर्ने तरिका हो। यो नदी वा बाँधमा प्रयोग गरिन्छ।\n① 태양광 에너지 (सौर्य ऊर्जा) हो। ✗\n② 풍력 에너지 (वायु ऊर्जा) हो। ✗\n③ 수력 에너지 (जलविद्युत ऊर्जा) हो, जसले पानी बग्ने वा खस्ने शक्ति प्रयोग गरेर बिजुली उत्पादन गर्छ ✓\n④ 해양 에너지 (समुद्री ऊर्जा) हो। ✗"}, {"n": "311", "q": "쓰레기를 버릴 때 재활용 가능한 자원과 일반 쓰레기를 구별하여 배출하는 것을 의미합니다. 이를 통해 재활용률을 높이고 환경 오염을 줄일 수 있습니다.", "options": ["환경보호", "재고관리", "정리정돈", "분리수거"], "answer": 3, "explain": "प्रश्नको अर्थ: यो फोहोर फ्याँक्दा पुनः प्रयोग गर्न सकिने र नसकिने सामानलाई छुट्टाछुट्टै छुट्याएर राख्ने काम हो। यसले वातावरण सफा राख्छ।\n① 환경보호 (वातावरण संरक्षण) हो। ✗\n② 재고관리 (स्टक व्यवस्थापन) हो। ✗\n③ 정리정돈 (व्यवस्थापन तथा सफाइ) हो। ✗\n④ 분리수거 (सामाग्री वर्गीकरण गरी फ्याँक्ने काम) हो, जसले फोहोर फ्याँक्दा पुनप्रयोग गर्न मिल्ने र साधारण फोहोर छुट्याएर फाल्ने बुझाउँछ ✓"}, {"n": "312", "q": "바람의 힘을 이용해 전기를 만드는 에너지입니다. 재생 가능하고 친환경적인 에너지원으로 주목받고 있습니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 1, "explain": "प्रश्नको अर्थ: यो चल्ने हावाको शक्तिलाई प्रयोग गरेर बिजुली बनाउने तरिका हो। यो कहिल्यै नसकिने प्राकृतिक शक्ति हो।\n① 태양광 에너지 (सौर्य ऊर्जा) हो। ✗\n② 풍력 에너지 (वायु ऊर्जा) हो, जसले हावाको शक्ति प्रयोग गरेर बिजुली उत्पादन गर्छ र यो नवीकरणीय तथा वातावरणमैत्री ऊर्जा हो ✓\n③ 수력 에너지 (जलविद्युत ऊर्जा) हो। ✗\n④ 해양 에너지 (समुद्री ऊर्जा) हो। ✗"}, {"n": "313", "q": "천이나 옷감을 만들기 전에 사용하는 실의 기본 재료입니다. 면, 나일론, 폴리에스터 같은 섬유를 뽑아서 만든 실로, 이것을 엮어서 천을 만듭니다.", "options": ["원사", "옷장", "옷걸이", "재봉기"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कपडा वा लुगा बुन्नका लागि प्रयोग गरिने धागो हो। यसलाई धेरै प्रकारका रेशाबाट बनाइन्छ।\n① 원사 (धागो/कच्चा धागो) हो, जुन कपडा वा लुगा बनाउनु अगाडि प्रयोग हुने धागोको आधारभूत सामग्री हो ✓\n② 옷장 (दराज) हो। ✗\n③ 옷걸이 (ह्याङ्गर) हो। ✗\n④ 재봉기 (सिलाई मेसिन) हो। ✗"}, {"n": "314", "q": "자연에서 얻을 수 있고, 시간이 지나도 다시 만들어지는 에너지입니다. 태양광, 풍력, 수력, 해양 에너지 등이 있으며, 환경을 오염시키지 않고 계속 사용할 수 있는 것이 특징입니다.", "options": ["환경 오염", "재생에너지", "지구 온난화", "친환경 정책"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कहिल्यै नसकिने र प्रकृतिबाट पटक-पटक प्राप्त भइरहने शक्ति हो। यसले प्रदूषण गराउँदैन।\n① 환경 오염 भनेको वातावरणीय प्रदूषण हो। यो वातावरण फोहोर र खराब हुने अवस्था हो, त्यसैले यो होइन। ✗\n② 재생에너지 भनेको नवीकरणीय ऊर्जा हो। प्रकृतिबाट पाइने र पुन: प्रयोग गर्न सकिने सफा ऊर्जालाई यसले जनाउँछ ✓\n③ 지구 온난화 भनेको पृथ्वीको तापक्रम वृद्धि हो। यो वातावरण तातिने समस्या हो ✗\n④ 친환경 정책 भनेको वातावरणमैत्री नीति हो। यो सरकार वा संस्थाले बनाउने नियम हो, त्यसैले यो होइन। ✗"}, {"n": "315", "q": "공기 속에 들어 있는 수증기(물기)의 양을 나타내는 정도입니다. 이것이 높으면 공기가 축축하고 덥게 느껴지고, 낮으면 건조하게 느껴집니다.", "options": ["계절", "하늘", "바람", "습도"], "answer": 3, "explain": "प्रश्नको अर्थ: यो हावामा भएको भिजेको भाग वा पानीको मात्रालाई जनाउने कुरा हो। यो धेरै भएमा ओसिलो र कम भएमा सुक्खा महसुस हुन्छ।\n① 계절 (ऋतु) हो। ✗\n② 하늘 (आकाश) हो। ✗\n③ 바람 (हावा) हो। ✗\n④ 습도 (आर्द्रता/चिस्यान) हो, जसले हावामा रहेको पानीको बाफको मात्रालाई बुझाउँछ र यसले हावालाई ओसिलो वा सुख्खा बनाउँछ ✓"}, {"n": "316", "q": "어떤 길이, 무게, 시간, 온도 같은 것을 수치로 재는 것을 말합니다. 예를 들어, 자로 길이를 재거나 저울로 무게를 재는 것이 모두 이에 해당합니다.", "options": ["관리", "측정", "재고", "보관"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कुनै सामानको लम्बाइ, तौल वा तापक्रम अङ्कमा नाप्ने वा जाँच्ने क्रिया हो।\n① 관리 भनेको व्यवस्थापन गर्नु वा हेरचाह गर्नु हो ✗\n② 측정 भनेको लम्बाइ, तौल, समय, तापक्रम आदि नाप्नु वा तौलनु हो ✓\n③ 재고 भनेको मौज्दात वा सामानको बाँकी मात्रा हो ✗\n④ 보관 भनेको सामान भण्डारण गर्नु वा सुरक्षित राख्नु हो ✗"}, {"n": "317", "q": "어떤 물건이나 정보, 사람 등을 체계적으로 기록하고 관리하는 문서나 책입니다. 주로 학교, 회사, 공공기관 등에서 물건이나 작업을 잘 관리하기 위해 사용합니다.", "options": ["작업대", "판금 가위", "관리 대장", "주문서"], "answer": 2, "explain": "प्रश्नको अर्थ: यो सामान, मानिस वा कामको विवरण मिलाएर लेखिने कागजात वा कापी हो। कार्यालय वा कारखानामा व्यवस्थापन गर्न यसको प्रयोग गरिन्छ।\n① 작업대 भनेको काम गर्ने टेबल हो ✗\n② 판금 가위 भनेको पाना काट्ने कैंची हो ✗\n③ 관리 대장 भनेको कुनै पनि वस्तु, जानकारी वा व्यक्तिलाई व्यवस्थित रूपमा रेकर्ड गरेर व्यवस्थापन गर्ने कागजात वा किताब हो ✓\n④ 주문서 भनेको अर्डर फारम वा माग फारम हो ✗"}, {"n": "318", "q": "옷감이나 실 등에 색을 입히는 작업을 말합니다. 이 과정을 통해 천에 다양한 색을 내고, 무늬를 만들거나 멋을 더할 수 있습니다.", "options": ["염색 가공", "변색 가공", "관리 대장", "창고 관리"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कपडा वा धागोमा विभिन्न रङ लगाउने प्रक्रिया हो। यसबाट कपडालाई सुन्दर बनाइन्छ।\n① 염색 가공 भनेको कपडा वा धागोमा रङ लगाउने प्रशोधन प्रक्रिया हो ✓\n② 변색 가공 भनेको रङ फेरिने वा बदलिने प्रशोधन हो ✗\n③ 관리 대장 भनेको व्यवस्थापन खाता वा रेकर्ड पुस्तिका हो ✗\n④ 창고 관리 भनेको गोदाम व्यवस्थापन हो ✗"}, {"n": "319", "q": "자연에서 얻은 재료로 만든 실이나 천을 말합니다. 면, 모, 견 등이 있으며, 피부에 부드럽고 환경에 좋은 섬유입니다.", "options": ["합성 섬유", "천연 섬유", "기계 가공", "원사 가공"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कपास वा पशम जस्ता प्राकृतिक वस्तुबाट बनाइने रेशा वा कपडा हो। यो छालाका लागि राम्रो र नरम हुन्छ।\n① 합성 섬유 भनेको सिंथेटिक वा कृत्रिम फाइबर हो ✗\n② 천연 섬유 भनेको प्रकृतिबाट प्राप्त सामग्रीबाट बनेको धागो वा कपडा हो, जसलाई प्राकृतिक फाइबर भनिन्छ ✓\n③ 기계 가공 भनेको मेसिन प्रशोधन हो ✗\n④ 원사 가공 भनेको कच्चा धागो प्रशोधन हो ✗"}, {"n": "320", "q": "석유 같은 화학 물질로 만든 인공 섬유입니다. 나일론, 폴리에스터, 아크릴 등이 있으며, 질기고 잘 마르며 주름이 잘 생기지 않는 특징이 있습니다.", "options": ["합성 섬유", "천연 섬유", "기계 가공", "원사 가공"], "answer": 0, "explain": "प्रश्नको अर्थ: यो रसायन वा खनिज तेल प्रयोग गरेर मानिसले बनाएको कृत्रिम रेशा हो। यो बलियो हुन्छ र छिटै सुक्छ।\n① 합성 섬유 भनेको रासायनिक पदार्थबाट बनेको कृत्रिम फाइबर हो ✓\n② 천연 섬유 भनेको प्राकृतिक फाइबर हो ✗\n③ 기계 가공 भनेको मेसिन प्रशोधन हो ✗\n④ 원사 가공 भनेको कच्चा धागो प्रशोधन हो ✗"}, {"n": "321", "q": "어떤 물질에 섞여 있는 원래와 다른 성분이나 더러운 것을 말합니다. 예를 들어, 깨끗한 물에 섞인 먼지나 기름 같은 것입니다.", "options": ["음식재료", "불순물", "음료수", "돌출물"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कुनै वस्तु वा सफा पानीमा मिसिएको फोहोर वा फरक तत्वलाई बुझाउँछ। यसले मुख्य वस्तुलाई धमिलो वा अशुद्ध बनाउँछ।\n① 음식재료 भनेको खानेकुरा बनाउने सामग्री हो ✗\n② 불순물 भनेको कुनै पनि पदार्थमा मिसाइएको वा मिसिएको मौलिक नभएको अशुद्ध तत्त्व वा फोहर हो ✓\n③ 음료수 भनेको पिउने पानी वा पेय पदार्थ हो ✗\n④ 돌출물 भनेको बाहिर निस्केको वस्तु हो ✗"}, {"n": "322", "q": "길고 가느다란 나무나 쇠, 플라스틱 등의 막대 모양 물체를 말합니다. 장난감, 도구, 운동기구 등 다양한 곳에서 쓰이며, 손으로 잡기 쉬운 형태입니다.", "options": ["연필", "빗자루", "막대기", "대걸레"], "answer": 2, "explain": "प्रश्नको अर्थ: यो काठ, फलाम वा प्लास्टिकबाट बनेको लामो र पातलो वस्तु हो। यसलाई हातले सजिलैसँग समात्न सकिन्छ र धेरै प्रकारका औजार वा सामानमा प्रयोग गरिन्छ।\n① 연필 भनेको पेन्सिल हो ✗\n② 빗자루 भनेको कुचो हो ✗\n③ 막대기 भनेको लामो र पातलो काठ, फलाम वा प्लास्टिकको छडी वा लठ्ठी हो ✓\n④ 대걸레 भनेको भुइँ पुछ्ने मप हो ✗"}, {"n": "323", "q": "건축물을 짓거나 가구 따위를 만들 때 필요한 기본적인 나무로 된 재료입니다.", "options": ["벽돌", "목재", "철근", "모래"], "answer": 1, "explain": "प्रश्नको अर्थ: यो घर वा भवन बनाउँदा र फर्निचर तयार पार्दा चाहिने काठको मुख्य कच्चा पदार्थ हो। निर्माण कार्यमा यसको ठूलो महत्त्व हुन्छ।\n① 벽돌 भनेको इँटा हो ✗\n② 목재 भनेको भवन बनाउँदा वा फर्निचर बनाउँदा चाहिने आधारभूत काठको सामग्री हो ✓\n③ 철근 भनेको स्टिलको रड हो ✗\n④ 모래 भनेको बालुवा हो ✗"}, {"n": "324", "q": "가구를 만들 때 가장 먼저 하는 일로, 원목을 용도에 맞게 정확한 크기로 재는 것을 말합니다.", "options": ["샌딩", "도색", "재단", "조립"], "answer": 2, "explain": "प्रश्नको अर्थ: यो फर्निचर बनाउने क्रममा काठलाई आवश्यक आकार र साइज अनुसार नाप्ने र काट्ने पहिलो काम हो। यसले सामानलाई सही नापमा बनाउन मद्दत गर्छ।\n① 샌딩 भनेको सिरिष कागजले घोटेर चिल्लो पार्ने काम हो। यो काठलाई सम्म बनाउने काम हो, त्यसैले यो होइन। ✗\n② 도색 भनेको रङ लगाउने काम हो। यो सामानमा रङ पोख्ने वा लगाउने काम हो ✗\n③ 재단 भनेको नापेर काट्ने काम हो। फर्निचर बनाउँदा काठलाई चाहिएको आकारमा सही नाप लिएर काट्नुलाई जनाउँछ ✓\n④ 조립 भनेको जोड्ने काम हो। छुटिएका भागहरूलाई मिलाएर सामान बनाउनु हो, त्यसैले यो होइन। ✗"}, {"n": "325", "q": "목재의 표면을 평평하게 하고 두께를 줄이며, 매끄러운 표면을 부여하는 데 사용합니다.", "options": ["갈퀴", "망치", "대패", "바이스"], "answer": 2, "explain": "प्रश्नको अर्थ: यो काठको बाहिरी भागलाई चेप्टो, चिल्लो र सम्म बनाउन प्रयोग गरिने एउटा औजार हो। यसले काठको बाक्लो भागलाई घटाउन पनि सघाउँछ।\n① 갈퀴 भनेको घाँस वा पात बटुल्ने औजार हो ✗\n② 망치 भनेको हथौडा हो ✗\n③ 대패 भनेको काठको सतह चिल्लो बनाउन, मोटाइ घटाउन र चिल्लो सतह प्रदान गर्न प्रयोग गरिने रन्दा (प्लेन) हो ✓\n④ 바이스 भनेको भाइस (पकड्ने औजार) हो ✗"}, {"n": "326", "q": "나무나 금속을 깎거나 파낼 때 쓰는 도구입니다. 끝이 날카롭고 손잡이가 달려 있어, 망치와 함께 사용하기도 합니다.", "options": ["톱", "축", "줄", "끌"], "answer": 3, "explain": "प्रश्नको अर्थ: यो काठ वा धातुलाई ताछ्न र दुलो पार्न प्रयोग गरिने तिखो औजार हो। यसमा समात्ने बिँड हुन्छ र कहिलेकाहीँ हथौडासँग मिलाएर प्रयोग गरिन्छ।\n① 톱 भनेको आरा हो ✗\n② 축 भनेको अक्ष (एक्सिस) हो ✗\n③ 줄 भनेको रेती हो ✗\n④ 끌 भनेको काठ वा धातु काट्ने वा खोप्ने छेनी हो, जसको टुप्पो तिखो हुन्छ र ह्यामरसँग पनि प्रयोग गरिन्छ ✓"}, {"n": "327", "q": "물건을 꽉 잡아 고정시키는 도구입니다. 목공, 금속 작업, 공예 등에서 두 물체를 움직이지 않게 붙잡아 줄 때 사용합니다.", "options": ["작업대", "클램프", "바이스", "장도리"], "answer": 1, "explain": "प्रश्नको अर्थ: यो काम गर्दा दुईवटा सामानलाई नहल्लिने गरी बलियोसँग समातेर राख्ने औजार हो। काठ र फलामको काम गर्दा वस्तुलाई स्थिर राख्न यसको प्रयोग हुन्छ।\n① 작업대 भनेको काम गर्ने टेबल हो ✗\n② 클램프 भनेको दुईवटा वस्तुलाई हल्लाउन नदिई च्यापेर कस्ने वा स्थिर बनाउने क्ल्याम्प हो ✓\n③ 바이스 भनेको भाइस हो ✗\n④ 장도리 भनेको नङ्ग्रा भएको हथौडा हो ✗"}, {"n": "328", "q": "가구의 표면을 매끄럽게 만들기 위해 문지르는 작업입니다. 사포나 기계를 사용해 거친 부분이나 흠집을 없애고, 페인트나 바니시를 잘 칠할 수 있도록 준비합니다.", "options": ["도장 작업", "가구 연마", "가구 판매", "밀링 작업"], "answer": 1, "explain": "प्रश्नको अर्थ: यो फर्निचरको खस्रो भाग र खोट हटाएर चिल्लो बनाउन घोट्ने काम हो। रङ लगाउनु भन्दा पहिले सामानलाई तयार पार्न यो काम गरिन्छ।\n① 도장 작업 भनेको पेन्टिङ वा कोटिंगको काम हो ✗\n② 가구 연마 भनेको फर्निचरको सतह चिल्लो बनाउनको लागि स्यान्डपेपर वा मेसिन प्रयोग गरेर घोट्ने काम हो ✓\n③ 가구 판매 भनेको फर्निचर बिक्री हो ✗\n④ 밀링 작업 भनेको मिलिङ मेसिनको काम हो ✗"}, {"n": "329", "q": "물체의 표면에 페인트나 니스 같은 재료를 칠하는 일입니다. 주로 보호하거나 색을 입히고, 보기 좋게 만들기 위해 가구, 건물, 금속 등에 칠합니다.", "options": ["가구 연마", "선반 기계", "도장 작업", "염색 작업"], "answer": 2, "explain": "प्रश्नको अर्थ: यो सामान, भवन वा फर्निचरलाई सुरक्षित राख्न र सुन्दर देखाउन रङ वा पालिस लगाउने काम हो। यसले वस्तुलाई सजिलै बिग्रन दिँदैन।\n① 가구 연마 भनेको फर्निचर घोट्ने काम हो ✗\n② 선반 기계 भनेको लेथ मेसिन हो ✗\n③ 도장 작업 भनेको वस्तुको सतहमा पेन्ट वा वार्निश जस्ता सामग्री लगाउने काम हो ✓\n④ 염색 작업 भनेको रङ लगाउने काम (कपडा आदिको) हो ✗"}, {"n": "330", "q": "물이나 약품 등을 가늘게 뿌릴 수 있게 만든 도구입니다. 식물에 물을 주거나, 청소, 도장 작업 등에 사용하며, 손으로 누르거나 압력을 이용해 작동합니다.", "options": ["분무기", "열풍기", "선풍기", "환풍기"], "answer": 0, "explain": "प्रश्नको अर्थ: यो पानी वा औषधि मसिनो गरी छर्कन प्रयोग गरिने औजार हो। बोटबिरुवामा पानी हाल्न र सरसफाइ गर्न यसको प्रयोग गरिन्छ।\n① 분무기 भनेको पानी वा औषधि आदि मसिनो गरी छर्कन मिल्ने गरी बनाएको स्प्रेयर (फुहारा) हो ✓\n② 열풍기 भनेको हिटर वा तातो हावा फाल्ने मेसिन हो ✗\n③ 선풍기 भनेको पङ्खा हो ✗\n④ 환풍기 भनेको भेन्टिलेटर वा हावा फेर्ने पङ्खा हो ✗"}, {"n": "331", "q": "작업을 시작하기 전에 각 부품에 이상이 없는지 기계를 작동시켜 확인해 보는 것입니다.", "options": ["재단", "포장", "사포질", "공회전"], "answer": 3, "explain": "प्रश्नको अर्थ: यो काम सुरु गर्नु भन्दा अगाडि मेसिनका भागहरू सही छन् कि छैनन् भनेर खाली चलाएर हेर्ने काम हो। यसले काम गर्दा हुने दुर्घटनाबाट बचाउँछ।\n① 재단 भनेको कपडा वा काठ काट्ने काम हो ✗\n② 포장 भनेको प्याकिङ गर्ने काम हो ✗\n③ 사포질 भनेको स्यान्डपेपरले घस्ने काम हो ✗\n④ 공회전 भनेको काम सुरु गर्नु अघि मेसिन चलाएर ठीक भए नभएको जाँच्ने काम हो ✓"}, {"n": "332", "q": "물체의 표면을 갈아서 매끄럽게 만들거나 거친 부분을 제거하는 도구입니다. 작은 모래 알갱이처럼 거친 입자가 붙어 있어 나무나 금속 등을 다듬을 때 사용합니다.", "options": ["망치", "사포", "펜치", "가위"], "answer": 1, "explain": "प्रश्नको अर्थ: यो काठ वा धातुको खस्रो भागलाई घोटेर चिल्लो बनाउन प्रयोग गरिने कागज वा औजार हो। यसको सतहमा मसिनो बालुवा जस्तै खस्रो वस्तु टाँसिएको हुन्छ।\n① 망치 भनेको हथौडा हो ✗\n② 사포 भनेको स्यान्डपेपर हो जुन वस्तुको सतह चिल्लो बनाउन प्रयोग गरिन्छ ✓\n③ 펜치 भनेको पेंचर वा चिम्टा हो ✗\n④ 가위 भनेको कैँची हो ✗"}, {"n": "333", "q": "가구, 벽, 자동차 등의 틈이나 구멍을 메우고 평평하게 만들기 위해 쓰는 반죽 같은 재료입니다.", "options": ["사포", "홈", "퍼티", "붓"], "answer": 2, "explain": "प्रश्नको अर्थ: यो काठ, भित्ता वा गाडीका साना प्वाल र फुटेका ठाउँ भर्न प्रयोग गरिने बाक्लो लेदो जस्तो पदार्थ हो। यसले सतहलाई सम्म बनाउन मद्दत गर्छ।\n① 사포 भनेको स्यान्डपेपर हो ✗\n② 홈 भनेको खोल्सा वा काप हो ✗\n③ 퍼티 भनेको प्वाल वा खाडल भर्ने पेस्टजस्तो सामग्री हो ✓\n④ 붓 भनेको पेन्ट गर्ने ब्रस हो ✗"}, {"n": "334", "q": "페인트나 색칠을 잘 먹게 하기 위해 표면에 먼저 바르는 하얀 밑칠용 재료입니다. 나무, 종이, 플라스틱 등에 칠해서 색이 잘 붙고 오래 유지되도록 도와줍니다.", "options": ["바니시", "롤러", "퍼티", "젯소"], "answer": 3, "explain": "प्रश्नको अर्थ: यो रङ राम्रोसँग टाँसियोस् भनेर मुख्य रङ लगाउनु भन्दा अघि लगाइने सेतो जग रङ हो। यसले काठ वा प्लाष्टिकमा रङलाई लामो समयसम्म टिकाउँछ।\n① 바니시 भनेको वार्निश हो ✗\n② 롤러 भनेको रोलर हो ✗\n③ 퍼티 भनेको पुट्टी हो ✗\n④ 젯소 भनेको रङ लगाउनु अघि लगाइने सेतो बेस कोट हो ✓"}, {"n": "335", "q": "뜨거운 바람을 내보내는 기계로, 물건을 건조시킬 때 사용합니다. 페인트나 퍼티를 빨리 말리거나, 작업장에서 따뜻한 바람으로 난방할 때도 쓰입니다.", "options": ["선풍기", "열풍기", "환풍기", "소화기"], "answer": 1, "explain": "प्रश्नको अर्थ: यो तातो हावा फालेर वस्तुहरू छिटो सुकाउन प्रयोग गरिने मेसिन हो। रङ सुकाउन वा काम गर्ने ठाउँलाई न्यानो पार्न यसको प्रयोग गरिन्छ।\n① 선풍기 भनेको पङ्खा हो ✗\n② 열풍기 भनेको तातो हावा फाल्ने हिटर मेसिन हो ✓\n③ 환풍기 भनेको भेन्टिलेटर वा हावा फेर्ने पंखा हो ✗\n④ 소화기 भनेको अग्नििनियन्त्रक यन्त्र हो ✗"}, {"n": "336", "q": "집이나 건물 구조에 고정되어 설치된 가구를 말합니다. 이런 가구를 사용하면 공간을 효율적으로 활용할 수 있습니다.", "options": ["빌트인 가구", "사무용 가구", "조립식 가구", "이동식 가구"], "answer": 0, "explain": "प्रश्नको अर्थ: यो घर वा कोठाको भित्तामा स्थायी रूपमा जोडिएर बनाइएको फर्निचर हो। यसले कोठाको ठाउँ बचाउन धेरै मद्दत गर्छ।\n① 빌트인 가구 भनेको भित्ता वा संरचनामा फिट गरिएको बिल्ट-इन फर्निचर हो ✓\n② 사무용 가구 भनेको अफिसको फर्निचर हो ✗\n③ 조립식 가구 भनेको जोडिने फर्निचर हो ✗\n④ 이동식 가구 भनेको सार्न मिल्ने फर्निचर हो ✗"}, {"n": "337", "q": "물건을 정리하고 보관하는 데 쓰는 장입니다. 옷, 책, 식기, 생활용품 등을 깔끔하게 넣어두기 좋으며, 서랍이나 문이 있는 형태가 많습니다.", "options": ["옷장", "책장", "수납장", "장식장"], "answer": 2, "explain": "प्रश्नको अर्थ: यो लुगा, किताब वा घरायसी सामानहरू मिलाएर राख्न प्रयोग गरिने घरको दराज वा दराज जस्तै फर्निचर हो। यसमा ढोका वा घर्राहरू हुन्छन्।\n① 옷장 भनेको दराज (वार्डरोब) हो ✗\n② 책장 भनेको पुस्तकको दराज हो ✗\n③ 수납장 भनेको सामान मिलाएर राख्ने भण्डारण क्याबिनेट हो ✓\n④ 장식장 भनेको सजावटको दराज हो ✗"}, {"n": "338", "q": "철로 만든 막대기를 뜻하며, 보통 콘크리트 구조물에 보강재로 쓰이는 강철봉을 말합니다.", "options": ["자갈", "철근", "벽돌", "전선"], "answer": 1, "explain": "प्रश्नको अर्थ: यो घर वा पुल बनाउँदा ढलानलाई बलियो बनाउन प्रयोग गरिने फलामको डन्डी हो। यसले सिमेन्टको संरचनालाई मजबुत बनाउँछ।\n① 자갈 भनेको गिट्टी हो ✗\n② 철근 भनेको स्टिलको रड हो ✓\n③ 벽돌 भनेको इँटा हो ✗\n④ 전선 भनेको बिजुलीको तार हो ✗"}, {"n": "339", "q": "철근을 서로 묶는 철사로 철근이 움직이지 않도록 고정해 줍니다. 주로 얇고 잘 구부러지는 철사로 만들어집니다.", "options": ["장도리", "절단기", "결속선", "결속 핸들"], "answer": 2, "explain": "प्रश्नको अर्थ: यो निर्माण कार्यमा फलामका डन्डीहरूलाई नहल्लिने गरी आपसमा बाँध्न प्रयोग गरिने पातलो तार हो। यो सजिलैसँग मोड्न सकिन्छ।\n① 장도리 भनेको ह्यामर हो ✗\n② 절단기 भनेको काट्ने मेसिन हो ✗\n③ 결속선 भनेको स्टिलको रड बाँध्ने तार हो ✓\n④ 결속 핸들 भनेको बाँध्ने ह्यान्डल हो ✗"}, {"n": "340", "q": "어두운 곳에서 앞을 잘 볼 수 있도록 손에 들고 사용하는 작은 전등입니다. 전기로 빛을 내며, 건전지를 넣어 사용하는 경우가 많고, 야간 활동 등에 자주 쓰입니다.", "options": ["전구", "형광등", "충전기", "손전등"], "answer": 3, "explain": "प्रश्नको अर्थ: यो अँध्यारोमा बाटो वा वस्तु देख्न हातमा लिएर हिँडिने सानो बत्ती हो। यसमा ब्याट्री हालेर राति हिँड्दा वा काम गर्दा प्रयोग गरिन्छ।\n① 전구 भनेको बल्ब हो ✗\n② 형광등 भनेको फ्लोरोसेन्ट लाइट हो ✗\n③ 충전기 भनेको चार्जर हो ✗\n④ 손전등 भनेको टर्चलाइट हो ✓"}, {"n": "341", "q": "두 개 이상의 선이나 물체가 만나는 곳을 말합니다. 예를 들어, 철근 공사에서는 철근 두 개가 서로 만나서 X자처럼 겹치는 부분입니다.", "options": ["교차점", "종착점", "결속선", "장단점"], "answer": 0, "explain": "प्रश्नको अर्थ: यो दुई वा सोभन्दा बढी रेखा वा वस्तुहरू आपसमा भेटिने ठाउँ हो। जस्तै निर्माण काममा दुईवटा फलामका रडहरू आपसमा भेटिएर काटाकाटी हुने भागलाई जनाउँछ।\n① 교차점 भनेको काटिने बिन्दु वा क्रसिङ हो ✓\n② 종착점 भनेको अन्तिम गन्तव्य हो ✗\n③ 결속선 भनेको बाँध्ने तार हो ✗\n④ 장단점 भनेको फाइदा र बेफाइदा हो, त्यसैले यो मिल्दैन। किताबमा दोस्रो विकल्प '종작점' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '종착점' हो। ✗"}, {"n": "342", "q": "보통 콘크리트, 철근, 철강 등 강한 재료로 만들어지며, 건물이나 다리, 교량 등에서 중요한 지지대 역할을 합니다.", "options": ["철근", "기둥", "지붕", "마당"], "answer": 1, "explain": "प्रश्नको अर्थ: यो सामान्यतया कङ्क्रिट र फलाम जस्ता बलिया सामग्रीबाट बनाइन्छ। यसले घर वा पुललाई लड्न नदिई अड्याएर राख्ने मुख्य खम्बाको काम गर्छ।\n① 철근 भनेको स्टिलको रड हो ✗\n② 기둥 भनेको पिलर वा खाँबो हो ✓\n③ 지붕 भनेको छानो हो ✗\n④ 마당 भनेको आँगन हो ✗"}, {"n": "343", "q": "건물, 시설물 등을 새로 짓거나 오래된 건물, 시설물들을 처리하는 곳입니다.", "options": ["공장", const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-07';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Renders the explanation as a structured list: the explanation string is
// lines separated by "\n" — first line is the question's own meaning
// ("प्रश्नको अर्थ: ..."), then one line per option ("① <word> ... ✓/✗").
// Lines render as separate rows; the ✓ line gets a green tint and the ✓/✗
// marker is coloured. Explanations without line breaks (fallback prose)
// render as a single paragraph, exactly as before. Uses text nodes only,
// never innerHTML, so explanation text is never parsed as markup.
function renderExplain(box, explain) {
  const lines = (explain || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length <= 1) {
    const b = document.createElement('b');
    b.textContent = 'किन? ';
    box.appendChild(b);
    const s = document.createElement('span');
    s.textContent = explain;
    box.appendChild(s);
    return;
  }
  const label = document.createElement('div');
  label.className = 'explain-label';
  label.textContent = 'व्याख्या';
  box.appendChild(label);
  lines.forEach((ln, li) => {
    const d = document.createElement('div');
    if (li === 0 && ln.indexOf('प्रश्नको अर्थ') === 0) {
      d.className = 'explain-stem';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    if (ln.indexOf('शिक्षकको उत्तर-पत्र:') === 0) {
      d.className = 'exp-note';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    const mark = ln.endsWith('✓') ? '✓' : (ln.endsWith('✗') ? '✗' : '');
    const body = mark ? ln.slice(0, -1).trim() : ln;
    d.className = 'exp-line' + (mark === '✓' ? ' exp-ok' : '');
    d.appendChild(document.createTextNode(body + (mark ? ' ' : '')));
    if (mark) {
      const m = document.createElement('span');
      m.className = 'exp-mark ' + (mark === '✓' ? 'ok' : 'no');
      m.textContent = mark;
      d.appendChild(m);
    }
    box.appendChild(d);
  });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    renderExplain(card.querySelector('.explain'), q.explain);
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
