<!DOCTYPE html>

<head>

<title>EPS-TOPIK Vocabulary Quiz — Set 07 (Q301–Q350)</title>
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --green: #188038;
    --green-bg: #e6f4ea;
    --red: #d93025;
    --red-bg: #fce8e6;
    --bg: #f0f4f9;
    --card: #ffffff;
    --text: #1f1f1f;
    --muted: #5f6368;
    --border: #dadce0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--primary); font-weight: 700; font-size: .95rem; padding: 10px 20px; border-radius: 999px; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.18); margin-bottom: 12px; transition: transform .15s, box-shadow .15s; }
  .back-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.22); }
  header { background: var(--primary); color: #fff; padding: 20px 16px 16px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .header-inner { max-width: 760px; margin: 0 auto; }
  header h1 { font-size: 1.35rem; line-height: 1.3; }
  header p { opacity: .9; font-size: .9rem; margin-top: 2px; }
  .progress-wrap { margin-top: 12px; background: rgba(255,255,255,.25); border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-bar { height: 100%; background: #fff; width: 0%; transition: width .3s; }
  .progress-text { font-size: .82rem; margin-top: 6px; opacity: .95; }
  .autosave-note { font-size: .78rem; margin-top: 4px; opacity: .85; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 80px; }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .q-card.answered { border-left: 4px solid var(--primary); }
  .q-num { font-size: .8rem; font-weight: 700; color: var(--primary); letter-spacing: .02em; }
  .q-text { font-size: 1.08rem; white-space: pre-line; margin: 8px 0 14px; line-height: 1.8; }
  .options label { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: background .15s, border-color .15s; font-size: 1.02rem; }
  .options label:hover { background: #f8f9fa; border-color: var(--primary); }
  .options input { margin-top: 5px; accent-color: var(--primary); width: 18px; height: 18px; flex: none; }
  .options label.selected { background: #e8f0fe; border-color: var(--primary); }
  .ul { text-decoration: underline; text-underline-offset: 2px; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 600; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 11px 22px; font-weight: 600; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: #a8c7fa; cursor: not-allowed; }
  .btn-ghost { background: #fff; color: var(--primary); border: 1px solid var(--border); }
  .submit-bar { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,.08); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 20px; text-align: center; margin-bottom: 20px; }
  .score-card .big { font-size: 2.6rem; font-weight: 800; color: var(--primary); line-height: 1.1; }
  .score-card .pct { font-size: 1.1rem; color: var(--muted); margin-top: 4px; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 8px 16px; }
  .filters button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .review-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 14px; }
  .review-card.correct { border-left: 5px solid var(--green); }
  .review-card.wrong { border-left: 5px solid var(--red); }
  .verdict { font-weight: 700; font-size: .95rem; margin-bottom: 6px; }
  .verdict.ok { color: var(--green); }
  .verdict.no { color: var(--red); }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; }
  .rev-opt-correct { background: var(--green-bg); border-color: var(--green); }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: var(--red); }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: var(--green); color: #fff; }
  .badge-mine { background: var(--green); color: #fff; }
  .badge-mine-wrong { background: var(--red); color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #f8f9fa; border-radius: 8px; padding: 12px 14px; margin-top: 10px; font-size: .96rem; }
  .explain b { color: var(--primary-dark); }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.15rem; }
    .q-text { font-size: 1rem; }
    .submit-bar .hint { display: none; }
  }
  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    .back-btn { padding: 6px 14px; font-size: .85rem; margin-bottom: 8px; }
    header h1 { font-size: 1.05rem; line-height: 1.25; }
    header p { font-size: .78rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .75rem; margin-top: 4px; }
    .autosave-note { font-size: .7rem; margin-top: 2px; }
  }
</style>

</main>

<script>
const QUESTIONS = [{"n": "301", "q": "물체의 길이나 높이 등을 재는 도구로, 띠 모양의 눈금이 있는 유연한 재질로 만들어져 있고 건축, 재봉, 일상 생활 등 다양한 곳에서 사용합니다.", "options": ["자", "줄자", "저울", "캘리퍼스"], "answer": 1, "explain": "पहिलो विकल्प 자 (फिता वा स्केल) हो, जुन छोटो लम्बाइ नाप्न प्रयोग गरिन्छ तर लचिलो फिताको रूपमा हुँदैन। दोस्रो विकल्प 줄자 (जुल्जा) हो, जुन लम्बाइ वा उचाइ नाप्ने फिता आकारको लचिलो औजार हो र यसलाई निर्माण, वास्तुकला र दैनिक जीवनमा प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 저울 (तराजु) हो, जसले तौल नाप्छ। चौथो विकल्प 캘리퍼스 (क्यालिपर्स) हो, जसले वस्तुको सूक्ष्म आकार नाप्छ। सही उत्तर विकल्प २ (줄자) हो।"}, {"n": "302", "q": "물체의 안지름, 바깥지름, 깊이 등을 정밀하게 재는 측정 도구이다. 주로 과학 실험이나 공학 분야에서 사용되며, 눈금이 정밀하게 나뉘어 있어 작은 단위까지 측정할 수 있다.", "options": ["줄자", "전자 저울", "접시 저울", "버니어 캘리퍼스"], "answer": 3, "explain": "1. 줄자 भनेको नाप्ने फिता हो, यसले लम्बाइ नाप्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। 2. 전자 저울 भनेको डिजिटल तराजु हो, यसले तौल नाप्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। 3. 접시 저울 भनेको थाली तराजु हो, यसले पनि सामानको तौल नाप्छ त्यसैले यो विवरणसँग मिल्दैन। 4. 버니어 캘리퍼스 भनेको भर्नियर क्यालिपर हो, यसले वस्तुको भित्री व्यास, बाहिरी व्यास र गहिराइ सूक्ष्म रूपमा नाप्ने भएकाले यो विवरणसँग एकदम मिल्छ। त्यसैले सही उत्तर 4 नम्बरको 버니어 캘리퍼스 हो, जसको अर्थ भर्नियर क्यालिपर हुन्छ।"}, {"n": "303", "q": "환경을 오염시키지 않고 자연에서 얻을 수 있는 에너지입니다. 태양광, 풍력, 수력, 지열 등이 있으며, 탄소 배출이 적어 지구를 보호하는 데 도움이 됩니다.", "options": ["친환경 자동차", "친환경 에너지", "친환경 건물", "친환경 농업"], "answer": 1, "explain": "पहिलो विकल्प 친환경 자동차 (वातावरणमैत्री गाडी) हो, जुन सवारी साधन हो। दोस्रो विकल्प 친환경 에너지 (वातावरणमैत्री ऊर्जा) हो, जुन प्रकृतिबाट प्राप्त हुने, प्रदूषण नगर्ने र कार्बन उत्सर्जन कम गर्ने ऊर्जा हो, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 친환경 건물 (वातावरणमैत्री भवन) हो, जुन भवनसँग सम्बन्धित छ। चौथो विकल्प 친환경 농업 (वातावरणमैत्री कृषि) हो, जुन खेतीकिसानीसँग सम्बन्धित छ। सही उत्तर विकल्प २ (친환경 에너지) हो।"}, {"n": "304", "q": "오랜 시간에 걸쳐 지구의 평균 기온이나 강수량 등이 변하는 현상입니다. 주로 인간의 활동으로 인한 온실가스 증가가 원인이며, 이상기후, 해수면 상승 등을 일으킵니다.", "options": ["기후 변화", "환경 파괴", "지구 온난화", "친환경 정책"], "answer": 0, "explain": "'기후 변화' भनेको जलवायु परिवर्तन हो। लामो समयमा पृथ्वीको औसत तापक्रम र वर्षाको मात्रा परिवर्तन हुने प्रक्रियालाई यसले जनाउँछ, त्यसैले यो सही उत्तर हो। '환경 파괴' भनेको वातावरण विनाश हो। यो प्राकृतिक वातावरण नष्ट हुने अवस्था हो, त्यसैले यो होइन। '지구 온난화' भनेको पृथ्वीको तापक्रम वृद्धि हो। यो तापक्रम बढ्ने कुरा मात्र हो, त्यसैले यो मिल्दैन। '친환경 정책' भनेको वातावरणमैत्री नीति हो। यो वातावरण जोगाउन बनाइने नियम हो, त्यसैले यो होइन। त्यसैले सही उत्तर १ नम्बरको '기후 변화' (जलवायु परिवर्तन) हो।"}, {"n": "305", "q": "자연의 자원과 생태계를 심각하게 손상하는 현상입니다. 산림 벌채, 오염물질 배출, 무분별한 개발 등이 주요 원인으로, 이는 생물 다양성 감소와 지구 온난화 등 심각한 문제를 일으킵니다.", "options": ["기후 변화", "환경 파괴", "풍력 에너지", "ESG 경영"], "answer": 1, "explain": "पहिलो विकल्प 기후 변화 (जलवायु परिवर्तन) हो। दोस्रो विकल्प 환경 파괴 (वातावरण विनाश) हो, जसले प्राकृतिक स्रोत र पारिस्थितिक प्रणालीलाई गम्भीर रूपमा नोक्सान पुर्‍याउँछ र वन फँडानी यसको मुख्य कारण हो, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 풍력 에너지 (वायु ऊर्जा) हो। चौथो विकल्प ESG 경영 (ESG व्यवस्थापन) हो। सही उत्तर विकल्प २ (환경 파괴) हो।"}, {"n": "306", "q": "이산화탄소, 메탄, 아산화질소 같은 대기 중에 존재하는 가스로, 지구의 열을 가두어 기온을 상승시키는 역할을 합니다.", "options": ["화석 연료", "기후 변화", "환경 오염", "온실 가스"], "answer": 3, "explain": "पहिलो विकल्प 화석 연료 (फसिल इन्धन) हो। दोस्रो विकल्प 기후 변화 (जलवायु परिवर्तन) हो। तेस्रो विकल्प 환경 오염 (वातावरण प्रदूषण) हो। चौथो विकल्प 온실 가스 (ग्रिनहाउस ग्यास) हो, जुन वायुमण्डलमा पाइने कार्बनडाइअक्साइड, मिथेन आदि ग्यास हुन् जसले पृथ्वीको तापक्रम बढाउँछन्, त्यसैले यो सही उत्तर हो। सही उत्तर विकल्प ४ (온실 가스) हो।"}, {"n": "307", "q": "해에서 나오는 빛과 열을 이용해 전기를 생산하는 에너지입니다. 환경에 미치는 영향이 적고 재생 가능하여 친환경적인 에너지로 주목받고 있습니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 0, "explain": "पहिलो विकल्प 태양광 에너지 (सौर्य ऊर्जा) हो, जसले सूर्यबाट आउने प्रकाश र तातो प्रयोग गरेर बिजुली उत्पादन गर्छ, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 풍력 에너지 (वायु ऊर्जा) हो। तेस्रो विकल्प 수력 에너지 (जलविद्युत ऊर्जा) हो। चौथो विकल्प 해양 에너지 (समुद्री ऊर्जा) हो। सही उत्तर विकल्प १ (태양광 에너지) हो।"}, {"n": "308", "q": "대기 중 온실가스 증가로 인해 지구의 평균 기온이 상승하는 현상입니다. 이로 인해 생태계와 인간 생활에 심각한 영향을 미칩니다.", "options": ["글로벌화", "산업화", "지구 온난화", "단순화"], "answer": 2, "explain": "'글로벌화' भनेको विश्वव्यापीकरण हो। यो व्यापार र संस्कृति संसारभरि फैलिनु हो, त्यसैले यो होइन। '산업화' भनेको औद्योगिकीकरण हो। यो उद्योग र कारखानाहरूको विकास हुनु हो, त्यसैले यो मिल्दैन। '지구 온난화' भनेको पृथ्वीको तापक्रम वृद्धि हो। वायुमण्डलमा हरितगृह ग्यास बढेर पृथ्वीको औसत तापक्रम बढ्ने प्रक्रियालाई यसले जनाउँछ, त्यसैले यो सही उत्तर हो। '단순화' भनेको सरलीकरण हो। यो जटिल कुरालाई सजिलो बनाउनु हो, त्यसैले यो होइन। त्यसैले सही उत्तर ३ नम्बरको '지구 온난화' (पृथ्वीको तापक्रम वृद्धि) हो।"}, {"n": "309", "q": "석탄, 석유, 천연가스 같은 에너지원으로 많이 사용되지만, 환경 오염과 온실가스 배출의 주요 원인입니다.", "options": ["기후 변화", "재생에어지", "화석 연료", "온난화"], "answer": 2, "explain": "'기후 변화' भनेको जलवायु परिवर्तन हो। यो मौसम र वातावरणमा आउने फेरबदल हो, त्यसैले यो होइन। '재생에어지' भनेको नवीकरणीय ऊर्जा हो। यो प्रदूषण नगर्ने ऊर्जाको स्रोत हो, त्यसैले यो मिल्दैन। '화석 연료' भनेको जीवाश्म इन्धन हो। कोइला, खनिज तेल र प्राकृतिक ग्यास जस्ता वातावरण प्रदूषण गर्ने ऊर्जा स्रोतलाई यसले जनाउँछ, त्यसैले यो सही उत्तर हो। '온난화' भनेको तापक्रम वृद्धि हो। यो न्यानो हुने प्रक्रिया हो, इन्धन होइन, त्यसैले यो होइन। त्यसैले सही उत्तर ३ नम्बरको '화석 연료' (जीवाश्म इन्धन) हो।"}, {"n": "310", "q": "물이 흐르거나 떨어지는 힘을 이용해 전기를 만드는 에너지입니다. 주로 댐이나 강에서 물의 흐름을 이용하여 발전하며, 재생 가능하고 친환경적인 에너지원으로 널리 사용됩니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 2, "explain": "पहिलो विकल्प 태양광 에너지 (सौर्य ऊर्जा) हो। दोस्रो विकल्प 풍력 에너지 (वायु ऊर्जा) हो। तेस्रो विकल्प 수력 에너지 (जलविद्युत ऊर्जा) हो, जसले पानी बग्ने वा खस्ने शक्ति प्रयोग गरेर बिजुली उत्पादन गर्छ, त्यसैले यो सही उत्तर हो। चौथो विकल्प 해양 에너지 (समुद्री ऊर्जा) हो। सही उत्तर विकल्प ३ (수력 에너지) हो।"}, {"n": "311", "q": "쓰레기를 버릴 때 재활용 가능한 자원과 일반 쓰레기를 구별하여 배출하는 것을 의미합니다. 이를 통해 재활용률을 높이고 환경 오염을 줄일 수 있습니다.", "options": ["환경보호", "재고관리", "정리정돈", "분리수거"], "answer": 3, "explain": "पहिलो विकल्प 환경보호 (वातावरण संरक्षण) हो। दोस्रो विकल्प 재고관리 (स्टक व्यवस्थापन) हो। तेस्रो विकल्प 정리정돈 (व्यवस्थापन तथा सफाइ) हो। चौथो विकल्प 분리수거 (सामाग्री वर्गीकरण गरी फ्याँक्ने काम) हो, जसले फोहोर फ्याँक्दा पुनप्रयोग गर्न मिल्ने र साधारण फोहोर छुट्याएर फाल्ने बुझाउँछ, त्यसैले यो सही उत्तर हो। सही उत्तर विकल्प ४ (분리수거) हो।"}, {"n": "312", "q": "바람의 힘을 이용해 전기를 만드는 에너지입니다. 재생 가능하고 친환경적인 에너지원으로 주목받고 있습니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 1, "explain": "पहिलो विकल्प 태양광 에너지 (सौर्य ऊर्जा) हो। दोस्रो विकल्प 풍력 에너지 (वायु ऊर्जा) हो, जसले हावाको शक्ति प्रयोग गरेर बिजुली उत्पादन गर्छ र यो नवीकरणीय तथा वातावरणमैत्री ऊर्जा हो, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 수력 에너지 (जलविद्युत ऊर्जा) हो। चौथो विकल्प 해양 에너지 (समुद्री ऊर्जा) हो। सही उत्तर विकल्प २ (풍력 에너지) हो।"}, {"n": "313", "q": "천이나 옷감을 만들기 전에 사용하는 실의 기본 재료입니다. 면, 나일론, 폴리에스터 같은 섬유를 뽑아서 만든 실로, 이것을 엮어서 천을 만듭니다.", "options": ["원사", "옷장", "옷걸이", "재봉기"], "answer": 0, "explain": "पहिलो विकल्प 원사 (धागो/कच्चा धागो) हो, जुन कपडा वा लुगा बनाउनु अगाडि प्रयोग हुने धागोको आधारभूत सामग्री हो, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 옷장 (दराज) हो। तेस्रो विकल्प 옷걸이 (ह्याङ्गर) हो। चौथो विकल्प 재봉기 (सिलाई मेसिन) हो। सही उत्तर विकल्प १ (원사) हो।"}, {"n": "314", "q": "자연에서 얻을 수 있고, 시간이 지나도 다시 만들어지는 에너지입니다. 태양광, 풍력, 수력, 해양 에너지 등이 있으며, 환경을 오염시키지 않고 계속 사용할 수 있는 것이 특징입니다.", "options": ["환경 오염", "재생에너지", "지구 온난화", "친환경 정책"], "answer": 1, "explain": "'환경 오염' भनेको वातावरणीय प्रदूषण हो। यो वातावरण फोहोर र खराब हुने अवस्था हो, त्यसैले यो होइन। '재생에너지' भनेको नवीकरणीय ऊर्जा हो। प्रकृतिबाट पाइने र पुन: प्रयोग गर्न सकिने सफा ऊर्जालाई यसले जनाउँछ, त्यसैले यो सही उत्तर हो। '지구 온난화' भनेको पृथ्वीको तापक्रम वृद्धि हो। यो वातावरण तातिने समस्या हो, त्यसैले यो मिल्दैन। '친환경 정책' भनेको वातावरणमैत्री नीति हो। यो सरकार वा संस्थाले बनाउने नियम हो, त्यसैले यो होइन। त्यसैले सही उत्तर २ नम्बरको '재생에너지' (नवीकरणीय ऊर्जा) हो।"}, {"n": "315", "q": "공기 속에 들어 있는 수증기(물기)의 양을 나타내는 정도입니다. 이것이 높으면 공기가 축축하고 덥게 느껴지고, 낮으면 건조하게 느껴집니다.", "options": ["계절", "하늘", "바람", "습도"], "answer": 3, "explain": "पहिलो विकल्प 계절 (ऋतु) हो। दोस्रो विकल्प 하늘 (आकाश) हो। तेस्रो विकल्प 바람 (हावा) हो। चौथो विकल्प 습도 (आर्द्रता/चिस्यान) हो, जसले हावामा रहेको पानीको बाफको मात्रालाई बुझाउँछ र यसले हावालाई ओसिलो वा सुख्खा बनाउँछ, त्यसैले यो सही उत्तर हो। सही उत्तर विकल्प ४ (습도) हो।"}, {"n": "316", "q": "어떤 길이, 무게, 시간, 온도 같은 것을 수치로 재는 것을 말합니다. 예를 들어, 자로 길이를 재거나 저울로 무게를 재는 것이 모두 이에 해당합니다.", "options": ["관리", "측정", "재고", "보관"], "answer": 1, "explain": "१. 관리 भनेको व्यवस्थापन गर्नु वा हेरचाह गर्नु हो, त्यसैले यो मिल्दैन। २. 측정 भनेको लम्बाइ, तौल, समय, तापक्रम आदि नाप्नु वा तौलनु हो, त्यसैले यो सही उत्तर हो। ३. 재고 भनेको मौज्दात वा सामानको बाँकी मात्रा हो, त्यसैले यो मिल्दैन। ४. 보관 भनेको सामान भण्डारण गर्नु वा सुरक्षित राख्नु हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 측정 हो जसको अर्थ नाप वा मापन हो।"}, {"n": "317", "q": "어떤 물건이나 정보, 사람 등을 체계적으로 기록하고 관리하는 문서나 책입니다. 주로 학교, 회사, 공공기관 등에서 물건이나 작업을 잘 관리하기 위해 사용합니다.", "options": ["작업대", "판금 가위", "관리 대장", "주문서"], "answer": 2, "explain": "१. 작업대 भनेको काम गर्ने टेबल हो, त्यसैले यो मिल्दैन। २. 판금 가위 भनेको पाना काट्ने कैंची हो, त्यसैले यो मिल्दैन। ३. 관리 대장 भनेको कुनै पनि वस्तु, जानकारी वा व्यक्तिलाई व्यवस्थित रूपमा रेकर्ड गरेर व्यवस्थापन गर्ने कागजात वा किताब हो, त्यसैले यो सही उत्तर हो। ४. 주문서 भनेको अर्डर फारम वा माग फारम हो, त्यसैले यो मिल्दैन। सही उत्तर 3 नम्बरको 관리 대장 हो जसको अर्थ व्यवस्थापन खाता वा रेकर्ड पुस्तिका हो।"}, {"n": "318", "q": "옷감이나 실 등에 색을 입히는 작업을 말합니다. 이 과정을 통해 천에 다양한 색을 내고, 무늬를 만들거나 멋을 더할 수 있습니다.", "options": ["염색 가공", "변색 가공", "관리 대장", "창고 관리"], "answer": 0, "explain": "१. 염색 가공 भनेको कपडा वा धागोमा रङ लगाउने प्रशोधन प्रक्रिया हो, त्यसैले यो सही उत्तर हो। २. 변색 가공 भनेको रङ फेरिने वा बदलिने प्रशोधन हो, त्यसैले यो मिल्दैन। ३. 관리 대장 भनेको व्यवस्थापन खाता वा रेकर्ड पुस्तिका हो, त्यसैले यो मिल्दैन। ४. 창고 관리 भनेको गोदाम व्यवस्थापन हो, त्यसैले यो मिल्दैन। सही उत्तर 1 नम्बरको 염색 가공 हो जसको अर्थ रङ लगाउने प्रशोधन हो।"}, {"n": "319", "q": "자연에서 얻은 재료로 만든 실이나 천을 말합니다. 면, 모, 견 등이 있으며, 피부에 부드럽고 환경에 좋은 섬유입니다.", "options": ["합성 섬유", "천연 섬유", "기계 가공", "원사 가공"], "answer": 1, "explain": "१. 합성 섬유 भनेको सिंथेटिक वा कृत्रिम फाइबर हो, त्यसैले यो मिल्दैन। २. 천연 섬유 भनेको प्रकृतिबाट प्राप्त सामग्रीबाट बनेको धागो वा कपडा हो, जसलाई प्राकृतिक फाइबर भनिन्छ, त्यसैले यो सही उत्तर हो। ३. 기계 가공 भनेको मेसिन प्रशोधन हो, त्यसैले यो मिल्दैन। ४. 원사 가공 भनेको कच्चा धागो प्रशोधन हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 천연 섬유 हो जसको अर्थ प्राकृतिक फाइबर हो।"}, {"n": "320", "q": "석유 같은 화학 물질로 만든 인공 섬유입니다. 나일론, 폴리에스터, 아크릴 등이 있으며, 질기고 잘 마르며 주름이 잘 생기지 않는 특징이 있습니다.", "options": ["합성 섬유", "천연 섬유", "기계 가공", "원사 가공"], "answer": 0, "explain": "१. 합성 섬유 भनेको रासायनिक पदार्थबाट बनेको कृत्रिम फाइबर हो, त्यसैले यो सही उत्तर हो। २. 천연 섬유 भनेको प्राकृतिक फाइबर हो, त्यसैले यो मिल्दैन। ३. 기계 가공 भनेको मेसिन प्रशोधन हो, त्यसैले यो मिल्दैन। ४. 원사 가공 भनेको कच्चा धागो प्रशोधन हो, त्यसैले यो मिल्दैन। सही उत्तर 1 नम्बरको 합성 섬유 हो जसको अर्थ सिंथेटिक फाइबर (कृत्रिम फाइबर) हो।"}, {"n": "321", "q": "어떤 물질에 섞여 있는 원래와 다른 성분이나 더러운 것을 말합니다. 예를 들어, 깨끗한 물에 섞인 먼지나 기름 같은 것입니다.", "options": ["음식재료", "불순물", "음료수", "돌출물"], "answer": 1, "explain": "१. 음식재료 भनेको खानेकुरा बनाउने सामग्री हो, त्यसैले यो मिल्दैन। २. 불순물 भनेको कुनै पनि पदार्थमा मिसाइएको वा मिसिएको मौलिक नभएको अशुद्ध तत्त्व वा फोहर हो, त्यसैले यो सही उत्तर हो। ३. 음료수 भनेको पिउने पानी वा पेय पदार्थ हो, त्यसैले यो मिल्दैन। ४. 돌출물 भनेको बाहिर निस्केको वस्तु हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 불순물 हो जसको अर्थ अशुद्ध वस्तु वा मिसावट हो।"}, {"n": "322", "q": "길고 가느다란 나무나 쇠, 플라스틱 등의 막대 모양 물체를 말합니다. 장난감, 도구, 운동기구 등 다양한 곳에서 쓰이며, 손으로 잡기 쉬운 형태입니다.", "options": ["연필", "빗자루", "막대기", "대걸레"], "answer": 2, "explain": "१. 연필 भनेको पेन्सिल हो, त्यसैले यो मिल्दैन। २. 빗자루 भनेको कुचो हो, त्यसैले यो मिल्दैन। ३. 막대기 भनेको लामो र पातलो काठ, फलाम वा प्लास्टिकको छडी वा लठ्ठी हो, त्यसैले यो सही उत्तर हो। ४. 대걸레 भनेको भुइँ पुछ्ने मप हो, त्यसैले यो मिल्दैन। सही उत्तर 3 नम्बरको 막대기 हो जसको अर्थ छडी वा लठ्ठी हो।"}, {"n": "323", "q": "건축물을 짓거나 가구 따위를 만들 때 필요한 기본적인 나무로 된 재료입니다.", "options": ["벽돌", "목재", "철근", "모래"], "answer": 1, "explain": "१. 벽돌 भनेको इँटा हो, त्यसैले यो मिल्दैन। २. 목재 भनेको भवन बनाउँदा वा फर्निचर बनाउँदा चाहिने आधारभूत काठको सामग्री हो, त्यसैले यो सही उत्तर हो। ३. 철근 भनेको स्टिलको रड हो, त्यसैले यो मिल्दैन। ४. 모래 भनेको बालुवा हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 목재 हो जसको अर्थ काठ वा काठको सामग्री हो।"}, {"n": "324", "q": "가구를 만들 때 가장 먼저 하는 일로, 원목을 용도에 맞게 정확한 크기로 재는 것을 말합니다.", "options": ["샌딩", "도색", "재단", "조립"], "answer": 2, "explain": "'샌딩' भनेको सिरिष कागजले घोटेर चिल्लो पार्ने काम हो। यो काठलाई सम्म बनाउने काम हो, त्यसैले यो होइन। '도색' भनेको रङ लगाउने काम हो। यो सामानमा रङ पोख्ने वा लगाउने काम हो, त्यसैले यो मिल्दैन। '재단' भनेको नापेर काट्ने काम हो। फर्निचर बनाउँदा काठलाई चाहिएको आकारमा सही नाप लिएर काट्नुलाई जनाउँछ, त्यसैले यो सही उत्तर हो। '조립' भनेको जोड्ने काम हो। छुटिएका भागहरूलाई मिलाएर सामान बनाउनु हो, त्यसैले यो होइन। त्यसैले सही उत्तर ३ नम्बरको '재단' (नापेर काट्ने काम) हो।"}, {"n": "325", "q": "목재의 표면을 평평하게 하고 두께를 줄이며, 매끄러운 표면을 부여하는 데 사용합니다.", "options": ["갈퀴", "망치", "대패", "바이스"], "answer": 2, "explain": "१. 갈퀴 भनेको घाँस वा पात बटुल्ने औजार हो, त्यसैले यो मिल्दैन। २. 망치 भनेको हथौडा हो, त्यसैले यो मिल्दैन। ३. 대패 भनेको काठको सतह चिल्लो बनाउन, मोटाइ घटाउन र चिल्लो सतह प्रदान गर्न प्रयोग गरिने रन्दा (प्लेन) हो, त्यसैले यो सही उत्तर हो। ४. 바이스 भनेको भाइस (पकड्ने औजार) हो, त्यसैले यो मिल्दैन। सही उत्तर 3 नम्बरको 대패 हो जसको अर्थ काठ छुल्काउने रन्दा हो।"}, {"n": "326", "q": "나무나 금속을 깎거나 파낼 때 쓰는 도구입니다. 끝이 날카롭고 손잡이가 달려 있어, 망치와 함께 사용하기도 합니다.", "options": ["톱", "축", "줄", "끌"], "answer": 3, "explain": "१. 톱 भनेको आरा हो, त्यसैले यो मिल्दैन। २. 축 भनेको अक्ष (एक्सिस) हो, त्यसैले यो मिल्दैन। ३. 줄 भनेको रेती हो, त्यसैले यो मिल्दैन। ४. 끌 भनेको काठ वा धातु काट्ने वा खोप्ने छेनी हो, जसको टुप्पो तिखो हुन्छ र ह्यामरसँग पनि प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको 끌 हो जसको अर्थ छेनी हो।"}, {"n": "327", "q": "물건을 꽉 잡아 고정시키는 도구입니다. 목공, 금속 작업, 공예 등에서 두 물체를 움직이지 않게 붙잡아 줄 때 사용합니다.", "options": ["작업대", "클램프", "바이스", "장도리"], "answer": 1, "explain": "१. 작업대 भनेको काम गर्ने टेबल हो, त्यसैले यो मिल्दैन। २. 클램프 भनेको दुईवटा वस्तुलाई हल्लाउन नदिई च्यापेर कस्ने वा स्थिर बनाउने क्ल्याम्प हो, त्यसैले यो सही उत्तर हो। ३. 바이스 भनेको भाइस हो, त्यसैले यो मिल्दैन। ४. 장도리 भनेको नङ्ग्रा भएको हथौडा हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 클램프 हो जसको अर्थ क्ल्याम्प हो।"}, {"n": "328", "q": "가구의 표면을 매끄럽게 만들기 위해 문지르는 작업입니다. 사포나 기계를 사용해 거친 부분이나 흠집을 없애고, 페인트나 바니시를 잘 칠할 수 있도록 준비합니다.", "options": ["도장 작업", "가구 연마", "가구 판매", "밀링 작업"], "answer": 1, "explain": "१. 도장 작업 भनेको पेन्टिङ वा कोटिंगको काम हो, त्यसैले यो मिल्दैन। २. 가구 연마 भनेको फर्निचरको सतह चिल्लो बनाउनको लागि स्यान्डपेपर वा मेसिन प्रयोग गरेर घोट्ने काम हो, त्यसैले यो सही उत्तर हो। ३. 가구 판매 भनेको फर्निचर बिक्री हो, त्यसैले यो मिल्दैन। ४. 밀링 작업 भनेको मिलिङ मेसिनको काम हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 가구 연마 हो जसको अर्थ फर्निचर घोट्ने वा चिल्लो पार्ने काम हो।"}, {"n": "329", "q": "물체의 표면에 페인트나 니스 같은 재료를 칠하는 일입니다. 주로 보호하거나 색을 입히고, 보기 좋게 만들기 위해 가구, 건물, 금속 등에 칠합니다.", "options": ["가구 연마", "선반 기계", "도장 작업", "염색 작업"], "answer": 2, "explain": "१. 가구 연마 भनेको फर्निचर घोट्ने काम हो, त्यसैले यो मिल्दैन। २. 선반 기계 भनेको लेथ मेसिन हो, त्यसैले यो मिल्दैन। ३. 도장 작업 भनेको वस्तुको सतहमा पेन्ट वा वार्निश जस्ता सामग्री लगाउने काम हो, त्यसैले यो सही उत्तर हो। ४. 염색 작업 भनेको रङ लगाउने काम (कपडा आदिको) हो, त्यसैले यो मिल्दैन। सही उत्तर 3 नम्बरको 도장 작업 हो जसको अर्थ पेन्टिङ वा रंगरोगनको काम हो।"}, {"n": "330", "q": "물이나 약품 등을 가늘게 뿌릴 수 있게 만든 도구입니다. 식물에 물을 주거나, 청소, 도장 작업 등에 사용하며, 손으로 누르거나 압력을 이용해 작동합니다.", "options": ["분무기", "열풍기", "선풍기", "환풍기"], "answer": 0, "explain": "१. 분무기 भनेको पानी वा औषधि आदि मसिनो गरी छर्कन मिल्ने गरी बनाएको स्प्रेयर (फुहारा) हो, त्यसैले यो सही उत्तर हो। २. 열풍기 भनेको हिटर वा तातो हावा फाल्ने मेसिन हो, त्यसैले यो मिल्दैन। ३. 선풍기 भनेको पङ्खा हो, त्यसैले यो मिल्दैन। ४. 환풍기 भनेको भेन्टिलेटर वा हावा फेर्ने पङ्खा हो, त्यसैले यो मिल्दैन। सही उत्तर 1 नम्बरको 분무기 हो जसको अर्थ स्प्रेयर वा छर्कने यन्त्र हो।"}, {"n": "331", "q": "작업을 시작하기 전에 각 부품에 이상이 없는지 기계를 작동시켜 확인해 보는 것입니다.", "options": ["재단", "포장", "사포질", "공회전"], "answer": 3, "explain": "१. 재단 भनेको कपडा वा काठ काट्ने काम हो, त्यसैले यो मिल्दैन। २. 포장 भनेको प्याकिङ गर्ने काम हो, त्यसैले यो मिल्दैन। ३. 사포질 भनेको स्यान्डपेपरले घस्ने काम हो, त्यसैले यो मिल्दैन। ४. 공회전 भनेको काम सुरु गर्नु अघि मेसिन चलाएर ठीक भए नभएको जाँच्ने काम हो, त्यसैले यो सही उत्तर हो। सही उत्तर 공회전 हो जसको अर्थ खाली घुमाउनु वा मेसिन जाँच गर्नु हो।"}, {"n": "332", "q": "물체의 표면을 갈아서 매끄럽게 만들거나 거친 부분을 제거하는 도구입니다. 작은 모래 알갱이처럼 거친 입자가 붙어 있어 나무나 금속 등을 다듬을 때 사용합니다.", "options": ["망치", "사포", "펜치", "가위"], "answer": 1, "explain": "१. 망치 भनेको हथौडा हो, त्यसैले यो मिल्दैन। २. 사포 भनेको स्यान्डपेपर हो जुन वस्तुको सतह चिल्लो बनाउन प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। ३. 펜치 भनेको पेंचर वा चिम्टा हो, त्यसैले यो मिल्दैन। ४. 가위 भनेको कैँची हो, त्यसैले यो मिल्दैन। सही उत्तर 사포 हो जसको अर्थ स्यान्डपेपर हो।"}, {"n": "333", "q": "가구, 벽, 자동차 등의 틈이나 구멍을 메우고 평평하게 만들기 위해 쓰는 반죽 같은 재료입니다.", "options": ["사포", "홈", "퍼티", "붓"], "answer": 2, "explain": "१. 사포 भनेको स्यान्डपेपर हो, त्यसैले यो मिल्दैन। २. 홈 भनेको खोल्सा वा काप हो, त्यसैले यो मिल्दैन। ३. 퍼티 भनेको प्वाल वा खाडल भर्ने पेस्टजस्तो सामग्री हो, त्यसैले यो सही उत्तर हो। ४. 붓 भनेको पेन्ट गर्ने ब्रस हो, त्यसैले यो मिल्दैन। सही उत्तर 퍼티 हो जसको अर्थ पुट्टी हो।"}, {"n": "334", "q": "페인트나 색칠을 잘 먹게 하기 위해 표면에 먼저 바르는 하얀 밑칠용 재료입니다. 나무, 종이, 플라스틱 등에 칠해서 색이 잘 붙고 오래 유지되도록 도와줍니다.", "options": ["바니시", "롤러", "퍼티", "젯소"], "answer": 3, "explain": "१. 바니시 भनेको वार्निश हो, त्यसैले यो मिल्दैन। २. 롤러 भनेको रोलर हो, त्यसैले यो मिल्दैन। ३. 퍼티 भनेको पुट्टी हो, त्यसैले यो मिल्दैन। ४. 젯소 भनेको रङ लगाउनु अघि लगाइने सेतो बेस कोट हो, त्यसैले यो सही उत्तर हो। सही उत्तर 젯소 हो जसको अर्थ जेसो हो।"}, {"n": "335", "q": "뜨거운 바람을 내보내는 기계로, 물건을 건조시킬 때 사용합니다. 페인트나 퍼티를 빨리 말리거나, 작업장에서 따뜻한 바람으로 난방할 때도 쓰입니다.", "options": ["선풍기", "열풍기", "환풍기", "소화기"], "answer": 1, "explain": "१. 선풍기 भनेको पङ्खा हो, त्यसैले यो मिल्दैन। २. 열풍기 भनेको तातो हावा फाल्ने हिटर मेसिन हो, त्यसैले यो सही उत्तर हो। ३. 환풍기 भनेको भेन्टिलेटर वा हावा फेर्ने पंखा हो, त्यसैले यो मिल्दैन। ४. 소화기 भनेको अग्नििनियन्त्रक यन्त्र हो, त्यसैले यो मिल्दैन। सही उत्तर 열풍기 हो जसको अर्थ तातो हावा दिने मेसिन हो।"}, {"n": "336", "q": "집이나 건물 구조에 고정되어 설치된 가구를 말합니다. 이런 가구를 사용하면 공간을 효율적으로 활용할 수 있습니다.", "options": ["빌트인 가구", "사무용 가구", "조립식 가구", "이동식 가구"], "answer": 0, "explain": "१. 빌트인 가구 भनेको भित्ता वा संरचनामा फिट गरिएको बिल्ट-इन फर्निचर हो, त्यसैले यो सही उत्तर हो। २. 사무용 가구 भनेको अफिसको फर्निचर हो, त्यसैले यो मिल्दैन। ३. 조립식 가구 भनेको जोडिने फर्निचर हो, त्यसैले यो मिल्दैन। ४. 이동식 가구 भनेको सार्न मिल्ने फर्निचर हो, त्यसैले यो मिल्दैन। सही उत्तर 빌트인 가구 हो जसको अर्थ बिल्ट-इन फर्निचर हो।"}, {"n": "337", "q": "물건을 정리하고 보관하는 데 쓰는 장입니다. 옷, 책, 식기, 생활용품 등을 깔끔하게 넣어두기 좋으며, 서랍이나 문이 있는 형태가 많습니다.", "options": ["옷장", "책장", "수납장", "장식장"], "answer": 2, "explain": "१. 옷장 भनेको दराज (वार्डरोब) हो, त्यसैले यो मिल्दैन। २. 책장 भनेको पुस्तकको दराज हो, त्यसैले यो मिल्दैन। ३. 수납장 भनेको सामान मिलाएर राख्ने भण्डारण क्याबिनेट हो, त्यसैले यो सही उत्तर हो। ४. 장식장 भनेको सजावटको दराज हो, त्यसैले यो मिल्दैन। सही उत्तर 수납장 हो जसको अर्थ भण्डारण क्याबिनेट हो।"}, {"n": "338", "q": "철로 만든 막대기를 뜻하며, 보통 콘크리트 구조물에 보강재로 쓰이는 강철봉을 말합니다.", "options": ["자갈", "철근", "벽돌", "전선"], "answer": 1, "explain": "१. 자갈 भनेको गिट्टी हो, त्यसैले यो मिल्दैन। २. 철근 भनेको स्टिलको रड हो, त्यसैले यो सही उत्तर हो। ३. 벽돌 भनेको इँटा हो, त्यसैले यो मिल्दैन। ४. 전선 भनेको बिजुलीको तार हो, त्यसैले यो मिल्दैन। सही उत्तर 철근 हो जसको अर्थ स्टिलको रड हो।"}, {"n": "339", "q": "철근을 서로 묶는 철사로 철근이 움직이지 않도록 고정해 줍니다. 주로 얇고 잘 구부러지는 철사로 만들어집니다.", "options": ["장도리", "절단기", "결속선", "결속 핸들"], "answer": 2, "explain": "१. 장도리 भनेको ह्यामर हो, त्यसैले यो मिल्दैन। २. 절단기 भनेको काट्ने मेसिन हो, त्यसैले यो मिल्दैन। ३. 결속선 भनेको स्टिलको रड बाँध्ने तार हो, त्यसैले यो सही उत्तर हो। ४. 결속 핸들 भनेको बाँध्ने ह्यान्डल हो, त्यसैले यो मिल्दैन। सही उत्तर 결속선 हो जसको अर्थ बाइन्डिङ वायर (बाँध्ने तार) हो।"}, {"n": "340", "q": "어두운 곳에서 앞을 잘 볼 수 있도록 손에 들고 사용하는 작은 전등입니다. 전기로 빛을 내며, 건전지를 넣어 사용하는 경우가 많고, 야간 활동 등에 자주 쓰입니다.", "options": ["전구", "형광등", "충전기", "손전등"], "answer": 3, "explain": "१. 전구 भनेको बल्ब हो, त्यसैले यो मिल्दैन। २. 형광등 भनेको फ्लोरोसेन्ट लाइट हो, त्यसैले यो मिल्दैन। ३. 충전기 भनेको चार्जर हो, त्यसैले यो मिल्दैन। ४. 손전등 भनेको टर्चलाइट हो, त्यसैले यो सही उत्तर हो। सही उत्तर 손전등 हो जसको अर्थ टर्चलाइट हो।"}, {"n": "341", "q": "두 개 이상의 선이나 물체가 만나는 곳을 말합니다. 예를 들어, 철근 공사에서는 철근 두 개가 서로 만나서 X자처럼 겹치는 부분입니다.", "options": ["교차점", "종착점", "결속선", "장단점"], "answer": 0, "explain": "१. 교차점 भनेको काटिने बिन्दु वा क्रसिङ हो, त्यसैले यो सही उत्तर हो। २. 종착점 भनेको अन्तिम गन्तव्य हो, त्यसैले यो मिल्दैन। ३. 결속선 भनेको बाँध्ने तार हो, त्यसैले यो मिल्दैन। ४. 장단점 भनेको फाइदा र बेफाइदा हो, त्यसैले यो मिल्दैन। सही उत्तर 교차점 हो जसको अर्थ काटिने बिन्दु वा क्रसिङ हो। किताबमा दोस्रो विकल्प '종작점' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '종착점' हो।"}, {"n": "342", "q": "보통 콘크리트, 철근, 철강 등 강한 재료로 만들어지며, 건물이나 다리, 교량 등에서 중요한 지지대 역할을 합니다.", "options": ["철근", "기둥", "지붕", "마당"], "answer": 1, "explain": "१. 철근 भनेको स्टिलको रड हो, त्यसैले यो मिल्दैन। २. 기둥 भनेको पिलर वा खाँबो हो, त्यसैले यो सही उत्तर हो। ३. 지붕 भनेको छानो हो, त्यसैले यो मिल्दैन। ४. 마당 भनेको आँगन हो, त्यसैले यो मिल्दैन। सही उत्तर 기둥 हो जसको अर्थ पिलर वा खाँबो हो।"}, {"n": "343", "q": "건물, 시설물 등을 새로 짓거나 오래된 건물, 시설물들을 처리하는 곳입니다.", "options": ["공장", "농장", "사업장", "공사장"], "answer": 3, "explain": "१. 공장 भनेको कारखाना हो, त्यसैले यो मिल्दैन। २. 농장 भनेको फार्म हो, त्यसैले यो मिल्दैन। ३. 사업장 भनेको कार्यस्थल हो, त्यसैले यो मिल्दैन। ४. 공사장 भनेको निर्माण स्थल हो, त्यसैले यो सही उत्तर हो। सही उत्तर 공사장 हो जसको अर्थ निर्माण स्थल हो।"}, {"n": "344", "q": "사람이나 차량이 쉽게 건너도록 도와주며, 보통 콘크리트, 철강, 철근 등 강한 재료로 만들어집니다. 도로, 철도, 하수도 등 다양한 용도로 사용되며, 두 지역을 연결하는 중요한 역할을 합니다.", "options": ["육교", "지하", "교량", "신호등"], "answer": 2, "explain": "१. 육교 भनेको ओभरहेड ब्रिज (आकाशे पुल) हो, त्यसैले यो मिल्दैन। २. 지하 भनेको भूमिगत हो, त्यसैले यो मिल्दैन। ३. 교량 भनेको पुल (ब्रिज) हो, त्यसैले यो सही उत्तर हो। ४. 신호등 भनेको ट्रफिक लाइट हो, त्यसैले यो मिल्दैन। सही उत्तर 교량 हो जसको अर्थ पुल हो।"}, {"n": "345", "q": "공사를 할 때 땅이나 암석 따위를 파거나 파낸 것을 처리하는 기계입니다.", "options": ["불도저", "굴착기", "화물차", "굴착기"],  지게차 भनेको फोर्कलिफ्ट हो र यो यहाँ मिल्दैन। ४. 굴착기 भनेको खन्ने मेसिन हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 불도저 (बुल्डोजर) हो।"}, {"n": "350", "q": "농촌에서 무거운 짐이나 농기계를 끌 때 사용하는 중장비입니다.", "options": ["화물차", "트렉터", "콤바인", "크레인"], "answer": 1, "explain": "१. 화물차 भनेको कार्गो ट्रक हो र यो यहाँ मिल्दैन। २. 트렉터 भनेको ट्र्याक्टर हो, जसले ग्रामीण क्षेत्रमा भारी सामान वा कृषियन्त्रहरू तान्न प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। ३. 콤바인 भनेको धान काट्ने मेसिन हो र यो यहाँ मिल्दैन। ४. 크레인 भनेको क्रेन हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 트렉터 (ट्र्याक्टर) हो।"}];

const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-07';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"><b>किन?</b> <span></span></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    card.querySelector('.explain span').textContent = q.explain;
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
