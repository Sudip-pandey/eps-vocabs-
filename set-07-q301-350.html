<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>EPS-TOPIK Vocabulary Quiz — Set 07 (Q301–Q350)</title>
<style>
  :root {
    --primary: #a78bfa;
    --primary-dark: #c4b5fd;
    --primary-soft: rgba(124,58,237,.22);
    --accent: #6366f1;
    --accent-soft: rgba(99,102,241,.18);
    --green: #34d399;
    --green-bg: rgba(16,185,129,.16);
    --red: #fb7185;
    --red-bg: rgba(244,63,94,.14);
    --bg: #0b0b16;
    --card: #171725;
    --text: #f2f1fa;
    --muted: #9d9db4;
    --border: rgba(255,255,255,.09);
    --shadow: 0 2px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans KR", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(700px 340px at 50% -5%, rgba(99,102,241,.14), transparent 60%); background-attachment: fixed; color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); color: #d6c9ff; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,.12); margin-bottom: 14px; transition: all .15s; }
  .back-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  header { background: #312e81; color: #fff; padding: 20px 16px 16px; position: relative; border-bottom: 1px solid rgba(255,255,255,.1); box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.4rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  header p { opacity: .92; font-size: .9rem; margin-top: 4px; }
  .progress-wrap { margin-top: 14px; background: rgba(0,0,0,.35); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .progress-bar { height: 100%; background: #a5b4fc; width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(165,180,252,.6); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { position: relative; background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; background: #6366f1; border-radius: 0 0 6px 6px; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: rgba(167,139,250,.55); }
  .q-card.answered::after { content: "✓"; position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: #059669; color: #fff; font-weight: 800; font-size: .95rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .q-num { display: inline-block; font-size: .92rem; font-weight: 800; color: #fff; background: #4f46e5; padding: 7px 18px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(79,70,229,.4); }
  .q-text { font-size: 1.16rem; white-space: pre-line; margin: 14px 0 18px; line-height: 1.85; font-weight: 500; color: #f2f1fa; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 16px 18px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid rgba(255,255,255,.09); border-radius: 14px; margin-bottom: 0; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #1e1e30; color: #f2f1fa; }
  .options label:hover { border-color: #8b5cf6; background: #232338; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,.3); }
  .options label::before { content: ""; flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid #7c7ca0; background: transparent; transition: all .15s; }
  .options label.selected { background: var(--accent-soft); border-color: #a78bfa; box-shadow: 0 4px 18px rgba(99,102,241,.4); }
  .options label.selected::before { border-color: #a78bfa; background: #a78bfa; box-shadow: inset 0 0 0 4px #1e1e30; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #a5b4fc; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 700; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .btn-primary { background: #4f46e5; color: #fff; box-shadow: 0 4px 18px rgba(79,70,229,.4); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 8px 24px rgba(79,70,229,.45); }
  .btn-primary:disabled { background: #2a2a3d; color: #77778e; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: rgba(255,255,255,.06); color: #d6c9ff; border: 2px solid rgba(255,255,255,.12); }
  .btn-ghost:hover { border-color: #8b5cf6; background: rgba(124,58,237,.2); }
  .submit-bar { position: sticky; bottom: 0; background: rgba(11,11,22,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 24px rgba(0,0,0,.5); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: #1e1b3a; border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; line-height: 1.05; color: #a5b4fc; }
  .score-card .pct { font-size: 1.15rem; color: #c9c6e0; margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: #e6e4f5; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: #4f46e5; color: #fff; border-color: transparent; box-shadow: 0 2px 12px rgba(79,70,229,.35); }
  .review-card { background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: #059669; }
  .verdict.no { background: #e11d48; }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; background: #1e1e30; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #12101f; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; color: #d9d7ea; }
  .explain b { color: #d6c9ff; }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; }
  .explain-stem { background: rgba(99,102,241,.18); border-left: 4px solid #a78bfa; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; color: #f2f1fa; }
  .exp-line { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.07); line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: #34d399; }
  .exp-mark.no { color: #fb7185; }
  .exp-note { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.4); border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; color: #fde9c8; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }

</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">&larr; Back to All Sets</a>
    <h1>EPS-TOPIK 문제은행 Quiz</h1>
    <p>Set 7 of 12 &bull; Questions 301–350 &bull; 50 questions &bull; EPS-TOPIK Vocabulary &mdash; answers are AI-generated (no answer key in the book) &mdash; check with a teacher &bull; Explanations in Nepali</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">0 / 50 answered</div>
    <div class="autosave-note">Progress will be auto-saved.</div>
  </div>
</header>

<main id="quizView">
  <div id="questionList"></div>
  <div class="pager">
    <button class="btn-ghost" id="prevBtn">&larr; Previous</button>
    <span class="page-info" id="pageInfo"></span>
    <button class="btn-ghost" id="nextBtn">Next &rarr;</button>
  </div>
</main>

<div class="submit-bar" id="submitBar">
  <div class="inner">
    <span class="hint" id="submitHint">Answer all 50, then submit.</span>
    <div style="display:flex; gap:8px; flex:none;">
      <button class="btn-ghost" id="clearBtn" style="padding:11px 16px;">Clear all</button>
      <button class="btn-primary" id="submitBtn">Submit Quiz</button>
    </div>
  </div>
</div>

<main id="resultView" class="hidden">
  <div class="score-card">
    <div class="big" id="scoreBig"></div>
    <div class="pct" id="scorePct"></div>
    <div class="msg" id="scoreMsg"></div>
    <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-primary" id="retryBtn">Try Again</button>
      <button class="btn-ghost" id="reviewTopBtn">Back to top</button>
    </div>
  </div>
  <div class="filters">
    <button class="btn-ghost active" data-filter="all">All questions</button>
    <button class="btn-ghost" data-filter="wrong">Wrong only</button>
    <button class="btn-ghost" data-filter="correct">Correct only</button>
  </div>
  <div id="reviewList"></div>
</main>

<script>
const QUESTIONS = [{"n": "301", "q": "서로의 말이 맞지 않아서 감정이 상하고 다투는 것을 말합니다. 보통 화가 나거나 의견이 달라서 생기며, 조심하지 않으면 사이가 멀어질 수 있습니다.", "options": ["오해", "짜증", "잔소리", "말다툼"], "answer": 3, "explain": "प्रश्नको अर्थ: यो भनाइले एकअर्काको कुरा नमिल्दा मन दुखाएर झगडा गर्ने अवस्थालाई जनाउँछ। विचार नमिल्दा वा रिसाउँदा यस्तो हुन्छ।\n① 오해 भनेको गलत बुझाइ (भ्रम) हो, त्यसैले यो भनाभन गर्ने कार्य होइन। ✗\n② 짜증 भनेको झर्को वा दिक्क लाग्नु हो ✗\n③ 잔소리 भनेको किचकिच वा गनगन गर्नु हो, त्यसैले यो भनाभनसँग मिल्दैन। ✗\n④ 말다툼 भने고 भनाभन वा मुखामुख गरेर झगडा गर्नु हो, त्यसैले यो विवरणसँग पूर्ण रूपमा मिल्छ र सही उत्तर हो। ✓"}, {"n": "302", "q": "어떤 말이나 행동을 잘못 이해해서 생기는 착각이나 잘못된 판단을 말합니다. 이것은 사람 사이에 갈등을 만들 수 있어서, 정확히 듣고 말하는 것이 중요합니다.", "options": ["화", "오해", "화해", "짜증"], "answer": 1, "explain": "प्रश्नको अर्थ: कुनै कुरालाई गलत तरिकाले बुझेर हुने भ्रम वा गलत बुझाइलाई यसले जनाउँछ। यसले मानिसहरूबीच समस्या ल्याउन सक्छ।\n1. 화 भनेको रिस हो, त्यसैले यो गलत बुझाइसँग मिल्दैन। 2. 오해 भनेको कसैको कुरा वा व्यवहारलाई गलत तरिकाले बुझ्नु (भ्रम वा गलत बुझाइ) हो, त्यसैले यो विवरणसँग पूर्ण रूपमा मिल्छ र सही उत्तर हो। 3. 화해 भनेको मेलमिलाप हो, त्यसैले यो मिल्दैन। 4. 짜증 भनेको झर्को हो, त्यसैले यो मिल्दैन। त्यसैले सही उत्तर 2. 오해 (गलत बुझाइ) हो।"}, {"n": "303", "q": "같은 말을 자꾸 반복해서 하는 것을 말합니다. 주로 걱정이나 충고 때문에 하지만, 듣는 사람은 귀찮거나 불편하게 느낄 수 있습니다.", "options": ["축하", "인사", "논의", "잔소리"], "answer": 3, "explain": "प्रश्नको अर्थ: एउटै कुरा बारम्बार दोहोर्याएर भनिरहने बानीलाई यसले बुझाउँछ। यस्तो सुन्दा मानिसलाई अल्छी वा दिक्क लाग्न सक्छ।\n① 축하 भनेको बधाई दिनु हो ✗\n② 인사 भनेको अभिवादन हो ✗\n③ 논의 भनेको छलफल हो, त्यसैले यो एउटै कुरा दोहोर्याउनेसँग मिल्दैन। ✗\n④ 잔소리 भनेको एउटै कुरा पटक-पटक दोहोर्याएर किचकिच वा गनगन गर्नु हो, त्यसैले यो विवरणसँग पूर्ण रूपमा मिल्छ र सही उत्तर हो। ✓"}, {"n": "304", "q": "회사 동료들과 함께 단순히 술과 음식을 즐기는 것을 넘어 직장 생활에 연장선상으로 인식되는 특별한 자리입니다.", "options": ["인사예절", "술자리 예절", "회식문화", "일상생활"], "answer": 2, "explain": "प्रश्नको अर्थ: कार्यालयका साथीहरूसँग सँगै बसेर खानपान गर्ने र कामसँग जोडिएको विशेष जमघटलाई यसले बुझाउँछ।\n① 인사예절 भनेको अभिवादनको शिष्टाचार हो, त्यसैले यो रक्सी-खानाको भोजसँग मिल्दैन। ✗\n② 술자리 예절 भनेको रक्सी खाने ठाउँको शिष्टाचार हो, तर यसले सम्पूर्ण कम्पनी भोजको संस्कृतिलाई समेट्दैन। ✗\n③ 회식문화 भनेको सहकर्मीहरूसँग रक्सी/खाना खाँदै कार्यस्थलकै एक अंगको रूपमा लिइने कम्पनी भोजको संस्कृति (ह्वेशिक संस्कृति) हो ✓\n④ 일상생활 भनेको दैनिक जीवन हो ✗"}, {"n": "305", "q": "표정이나 행위 또는 불필요한 소리로 남의 일을 간섭하거나 피해를 끼치는 일입니다.", "options": ["방해", "싸움", "경고", "오해"], "answer": 0, "explain": "प्रश्नको अर्थ: यो शब्दले अरूको काममा बाधा पुर्याउने वा अनावश्यक रूपमा हस्तक्षेप गर्ने कामलाई बुझाउँछ। यसले अरूलाई समस्या वा असर पार्न सक्छ।\n① 방해 भनेको अरूको काममा दखल दिने वा बाधा पुऱ्याउने कार्य हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n② 싸움 भनेको मानिसहरूबीच हुने झगडा हो ✗\n③ 경고 भनेको गल्ती नगर्न वा सचेत गराउन दिइने चेतावनी हो ✗\n④ 오해 भनेको कुरा नबुझी गलत सोच्ने वा बुझ्ने काम हो ✗"}, {"n": "306", "q": "성적인 언어나 행동으로 상대방을 불쾌하게 만들거나 괴롭히는 행동을 말합니다. 이는 직장, 학교 등 여러 곳에서 발생할 수 있으며, 법적으로 처벌을 받을 수 있습니다.", "options": ["성희롱", "성차별", "양성평등", "신고서"], "answer": 0, "explain": "प्रश्नको अर्थ: यो विषयले कार्यलय वा विद्यालयमा अवाञ्छित यौनजन्य व्यवहार वा कुराकानीबाट अरूलाई दुःखी बनाउने कामलाई जनाउँछ। यसरी कसैलाई हैरान पार्नु कानुन विपरीत हुन्छ।\n① 성희롱 भनेको यौनजन्य शब्द वा व्यवहारले अरूलाई असहज, दुःखी वा दुःखी बनाउने काम हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n② 성차별 भनेको लिङ्गको आधारमा मानिसलाई भेदभाव गर्ने काम हो ✗\n③ 양성평등 भनेको पुरुष र महिला दुवैलाई समान अधिकार दिनु हो ✗\n④ 신고서 भनेको कुनै घटना वा निवेदनको उजुरी फारम हो ✗"}, {"n": "307", "q": "어떤 일이나 상황이 마음에 들지 않아 기분이 나쁘거나 불편한 감정을 말합니다. 예를 들어, 예의 없는 말이나 행동을 받았을 때 느낌이 들 수 있습니다.", "options": ["수치심", "불쾌감", "거부감", "피해자"], "answer": 1, "explain": "प्रश्नको अर्थ: यो भावनाले कुनै कुरा चित्त नबुझ्दा वा अमर्यादित व्यवहार पाउँदा उत्पन्न हुने नराम्रो अनुभवलाई जनाउँछ। यसले मानिसलाई असहज महसुस गराउँछ।\n① 수치심 भनेको लाज वा शर्म लाग्ने भावना हो ✗\n② 불쾌감 भनेको कुनै कुरा मन नपरेर नराम्रो वा असहज महसुस हुने भावना हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n③ 거부감 भनेको स्वीकार गर्न मन नलाग्ने वा अस्वीकार गर्ने भावना हो ✗\n④ 피해자 भनेको हानी वा नोक्सानी बेहोरेको व्यक्ति (पीडित) हो ✗"}, {"n": "308", "q": "성별에 따른 불평등이나 차별을 인식하고, 그 문제를 해결하려는 태도나 의식을 말합니다. 성별에 관계없이 모든 사람이 동등하게 대우받아야 한다는 의미입니다.", "options": ["양성평등", "성차별", "성별 차이", "성 인지 감수성"], "answer": 3, "explain": "प्रश्नको अर्थ: यो कुराले सबै मानिसलाई लिङ्गको आधारमा भेदभाव नगरी समान रूपमा व्यवहार गर्नुपर्छ भन्ने सोचलाई बुझाउँछ। यसले समाजमा समानता ल्याउन मद्दत गर्छ।\n① 양성평등 भनेको पुरुष र महिलालाई समान अधिकार र अवसर दिने अवस्था हो ✗\n② 성차별 भनेको लिङ्गको आधारमा असमान व्यवहार वा भेदभाव गर्नु हो ✗\n③ 성별 차이 भनेको पुरुष र महिला बीचको शारीरिक वा सामाजिक भिन्नता हो ✗\n④ 성 인지 감수성 भनेको लिङ्गका आधारमा हुने असमानता वा भेदभावलाई पहिचान गरेर त्यसलाई समाधान गर्ने सोच वा दृष्टिकोण हो, त्यसैले यो विवरणसँग मिल्छ। ✓"}, {"n": "309", "q": "남성과 여성, 또는 모든 성별이 동등하게 대우받고, 권리와 기회에서 차별이 없도록 하는 것을 의미합니다.", "options": ["양성평등", "성차별", "성별 차이", "가해자"], "answer": 0, "explain": "प्रश्नको अर्थ: यो प्रश्नले पुरुष र महिलालाई समान व्यवहार गर्ने र अवसरहरूमा भेदभाव नहुने कुरा बुझाउँछ।\n① 양성평등 भनेको पुरुष र महिला वा सबै लिङ्गले समान अधिकार र अवसर पाउने कुरा हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n② 성차별 भनेको लिङ्गको आधारमा अन्याय वा भेदभाव गर्नु हो ✗\n③ 성별 차이 भनेको पुरुष र महिला बीचको भिन्नता हो ✗\n④ 가해자 भनेको अरूलाई हानी वा नोक्सानी पुऱ्याउने व्यक्ति (पीडक) हो ✗"}, {"n": "310", "q": "어떤 사실이나 주장이 사실임을 입증할 수 있는 자료나 정보입니다. 예를 들어, 사건이 일어난 시간, 장소, 사람 등을 증명할 수 있는 물건 등이 이에 해당합니다.", "options": ["가해자", "피해자", "증인", "증거"], "answer": 3, "explain": "प्रश्नको अर्थ: यो प्रश्नले कुनै कुरा सत्य हो भनेर प्रमाणित गर्न प्रयोग हुने प्रमाण वा जानकारीलाई बुझाउँछ। यसले घटनाको वास्तविकता देखाउँछ।\n① 가해자 भनेको अरूलाई हानि पुऱ्याउने मानिस हो, त्यसैले यो होइन। ✗\n② 피해자 भनेको हानि वा चोट भोगेको पीडित मानिस हो, त्यसैले यो होइन। ✗\n③ 증인 भनेको घटना देख्ने साक्षी मानिस हो, त्यसैले यो होइन। ✗\n④ 증거 भनेको कुनै तथ्य वा घटना सत्य हो भनेर प्रमाणित गर्ने प्रमाण वा सामग्री हो, त्यसैले यो सही उत्तर हो। यो प्रश्नका विकल्पहरू किताबमा छापिएका छैनन्, शिक्षकले दिनुभएको हो। ✓"}, {"n": "311", "q": "공장이나 사무실 같은 물리적인 공간으로, 사람들이 일정한 작업이나 업무를 수행하는 장소를 말합니다.", "options": ["작업대", "작업장", "작업 관리", "작업 순서"], "answer": 1, "explain": "प्रश्नको अर्थ: मानिसहरूले काम गर्ने भौतिक ठाउँ वा कारखानालाई बुझाउँछ।\n① 작업대 भनेको काम गर्ने टेबल हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 작업장 भनेको कार्यस्थल वा काम गर्ने ठाउँ हो, जसले मानिसहरूले निश्चित काम गर्ने भौतिक ठाउँलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 작업 관리 भनेको कामको व्यवस्थापन हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 작업 순서 भनेको कामको क्रम हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "312", "q": "작업을 할 때 나무나 금속 조각과 같은 물건을 단단히 고정시켜 도구를 사용할 수 있는 테이블입니다.", "options": ["작업대", "서랍장", "손수레", "옷장"], "answer": 0, "explain": "प्रश्नको अर्थ: काम गर्दा सामानलाई बलियोसँग समात्न प्रयोग गरिने टेबुल हो।\n① 작업대 भनेको काम गर्ने टेबल (वर्कबेञ्च) हो, जसले काठ वा धातुका टुक्राहरूलाई कच्याककुचुक नगरी कडासँग अड्याएर औजार प्रयोग गर्न मिल्ने टेबल बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n② 서랍장 भनेको दराज हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 손수레 भनेको हाते ठेला हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 옷장 भनेको कपडा राख्ने दराज हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "313", "q": "물건이나 자재 등을 보관하기 위한 공간 또는 건물을 말하며 상품, 식료품, 기계 부품 등을 보관합니다.", "options": ["창고", "복도", "기숙사", "관리소"], "answer": 0, "explain": "प्रश्नको अर्थ: सामान वा सामग्रीहरू सुरक्षित राख्ने ठाउँ वा गोदामलाई बुझाउँछ।\n① 창고 भनेको सामान, खाद्यान्न वा पार्टपुर्जा भण्डार गर्ने गोदाम हो, त्यसैले यो विवरणसँग मिल्छ र सही उत्तर हो। ✓\n② 복도 भनेको हिँड्ने बाटो वा बरण्डा हो, सामान राख्ने ठाउँ होइन। ✗\n③ 기숙사 भनेको कामदारहरू बस्ने होस्टेल हो, सामान भण्डार गर्ने ठाउँ होइन। ✗\n④ 관리소 भनेको भवन वा क्षेत्रको हेरचाह गर्ने कार्यालय हो, सामान राख्ने गोदाम होइन। ✗"}, {"n": "314", "q": "어떤 일이나 업무를 맡아 책임지고 수행하는 사람을 말합니다. 고객 상담을 맡은 직원이나 창고 관리 책임자 등 이에 해당합니다.", "options": ["공장장", "담당자", "과장", "반장"], "answer": 1, "explain": "प्रश्नको अर्थ: कुनै जिम्मा लिएर काम पूरा गर्ने व्यक्तिलाई बुझाउँछ।\n① 공장장 भनेको कारखाना प्रमुख हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 담당자 भनेको जिम्मेवार व्यक्ति वा सम्पर्क व्यक्ति हो, जसले कुनै कामको जिम्मेवारी लिएर त्यसलाई पूरा गर्ने व्यक्तिलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 과장 भनेको विभाग प्रमुख (कावा) हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 반장 भनेको बान्जाङ (समूह नेता) हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "315", "q": "물체나 공간이 얼마나 따뜻하거나 차가운지를 나타내는 물리적인 양입니다. 섭씨(°C)나 화씨(°F) 단위로 측정하며, 열의 세기와 관련이 있습니다.", "options": ["날씨", "계절", "온도", "환경"], "answer": 2, "explain": "प्रश्नको अर्थ: कुनै ठाउँ वा वस्तु कति तातो वा चिसो छ भन्ने नाप्ने एकाइ हो।\n① 날씨 भनेको मौसम हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 계절 भनेको ऋतु हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 온도 भनेको तापक्रम हो, जसले बस्तु वा ठाउँ कति तातो वा चिसो छ भन्ने भौतिक मात्रालाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n④ 환경 भनेको वातावरण हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "316", "q": "한 나라나 지역의 경제에서 각 산업(농업, 제조업, 서비스업 등)이 차지하는 비중과 이들 사이의 상호 관계를 나타내는 개념입니다.", "options": ["산업 개발", "산업 경제", "산업 관리", "산업 구조"], "answer": 3, "explain": "प्रश्नको अर्थ: यो देशको अर्थतन्त्रमा विभिन्न उद्योगहरूको हिस्सा र तिनको आपसी सम्बन्ध बुझाउने कुरा हो।\n① 산업 개발 भनेको उद्योग विकास हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 산업 경제 भनेको औद्योगिक अर्थतन्त्र हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 산업 관리 भनेको उद्योग व्यवस्थापन हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 산업 구조 भनेको औद्योगिक संरचना हो, जसले देशको अर्थतन्त्रमा विभिन्न उद्योगहरूको हिस्सा र सम्बन्धलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। किताबमा दोस्रो विकल्प '산업 계제' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '산업 경제' हो। ✓"}, {"n": "317", "q": "전 세계가 정치, 경제, 사회, 문화 등 여러 측면에서 서로 밀접하게 연결되고 영향을 주고받는 현상을 말합니다.", "options": ["글로벌화", "산업화", "도시화", "온난화"], "answer": 0, "explain": "प्रश्नको अर्थ: यो शब्दले संसारभरका देशहरू राजनीति, अर्थतन्त्र र संस्कृतिमा एक आपससँग जोडिने अवस्थालाई जनाउँछ। यो एउटा आधुनिक विश्वको मुख्य विशेषता हो।\n① 글로벌화 भनेको विश्वव्यापीकरण (ग्लोबललाइजेसन) हो, जसले संसारभरका देशहरू राजनीति, अर्थतन्त्र र संस्कृतिमा जोडिने प्रक्रियालाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n② 산업화 भनेको औद्योगिकीकरण हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 도시화 भनेको सहरीकरण हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 온난화 भनेको तापक्रम वृद्धि (ग्लोबल वार्मिङ) हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "318", "q": "제품을 보호하기 위해 충격이나 진동을 흡수하고 분산시키는 역할을 하는 포장 재료입니다.", "options": ["라벨", "밀봉", "완충재", "테이프"], "answer": 2, "explain": "प्रश्नको अर्थ: यो सामानलाई चोट वा हल्चाइबाट जोगाउन र प्रभाव कम गर्न प्रयोग हुने प्याकेजिङ सामग्री हो।\n① 라벨 भनेको सामानको विवरण लेखिएको लेबल हो, धक्का सोस्ने सामग्री होइन। ✗\n② 밀봉 भनेको बाकस वा पोका हावा नछिर्ने गरी बन्द गर्ने काम हो, सामग्री होइन। ✗\n③ 완충재 भनेको सामान फुट्न वा बिग्रन नदिन धक्का र कम्पन सोस्ने प्याकिङ सामग्री हो ✓\n④ 테이프 भनेको बाकस टाँस्न प्रयोग गरिने टेप हो, धक्का सोस्ने सामग्री होइन। ✗"}, {"n": "319", "q": "금속 제품이 녹슬지 않도록 포장 처리가 된 종이로, 금속을 포장할 때 사용하는 특수 포장재입니다.", "options": ["완충재", "방청지", "절단기", "용접봉"], "answer": 1, "explain": "प्रश्नको अर्थ: यो फलामका सामानहरूमा खिया लाग्न नदिन प्रयोग गरिने विशेष प्रकारको कागज हो।\n① 완충재 भनेको बफर सामग्री हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 방청지 भनेको खिया प्रतिरोधी कागज हो, जसले धातुका उत्पादनहरूमा खिया लाग्न नदिन प्रयोग गरिने विशेष प्याकेजिङ कागजलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 절단기 भनेको काट्ने मेशिन हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 용접봉 भनेको वेल्डिङ रड हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "320", "q": "물품을 쌓아 올리고 지게차나 핸드리프트로 쉽게 운반할 수 있도록 만든 바닥용 받침대입니다. 물류 창고나 공장에서 상품을 운반할 때 사용되며, 나무, 플라스틱, 금속 등의 재질이 있습니다.", "options": ["대차", "일륜차", "트렉터", "파렛트"], "answer": 3, "explain": "प्रश्नको अर्थ: यो सामानहरू राखेर सजिलै बोक्न र सार्न मिल्ने काठ वा प्लास्टिकको चौटा हो।\n① 대차 भनेको ट्रली हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 일륜차 भनेको एक चक्के ठेला (व्हीलबारो) हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 트렉터 भनेको ट्र्याक्टर हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 파렛트 भनेको प्यालेट (सामान राख्ने काठ वा प्लास्टिकको प्लेटर) हो, जसले सामानहरू थुपार्न र फोर्कलिफ्टले सजिलै ओसार्न मद्दत गर्ने भुईँको आधारलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓"}, {"n": "321", "q": "앞부분에 포크형의 두 개 철판이 나와 있어 이것을 상하로 움직여 짐을 운반하거나 하역합니다.", "options": ["크레인", "콤바인", "화물차", "지게차"], "answer": 3, "explain": "प्रश्नको अर्थ: अगाडि दुइटा फलामको काँटा जस्तो भाग भएको र त्यसलाई माथि-तल गरेर सामान ओसार्न वा झार्न प्रयोग गरिने मेसिनको वर्णन गरिएको छ।\n① 크레인 भनेको ठूला र भारी सामानहरू माथि उचालेर टाढा लैजाने क्रेन हो ✗\n② 콤바인 भनेको धान वा गहुँ काट्ने र थ्रेसिंग गर्ने कृषि मेसिन हो ✗\n③ 화물차 भनेको सामान बोक्ने ट्रक हो ✗\n④ 지게차 भनेको अगाडि फोर्क जस्तो फलामको प्लेट भएको र त्यसलाई माथि तल सार्दै सामान बोक्ने वा अनलोड गर्ने फोर्कलिफ्ट हो ✓"}, {"n": "322", "q": "파렛트에 적재된 물품을 사람이 직접 밀거나 당겨서 운반할 수 있도록 만든 수동 운반 장비입니다. 지게차 없이 좁은 공간에서 물건을 옮길 때 주로 사용됩니다.", "options": ["핸드 파렛트", "핸드 카트", "일륜차", "손수레"], "answer": 0, "explain": "प्रश्नको अर्थ: मानिसले आफैं धकेलेर वा तानेर सामान राखिएको काठको फ्ल्याक वा सामान सानो ठाउँमा ओसार्न प्रयोग गर्ने हातले चलाउने उपकरणलाई जनाउँछ।\n① 핸드 파렛트 भनेको प्यालेटमा राखिएका सामानहरू मानिसले आफैँ ठेलेर वा तानेर लैजान सक्ने गरी बनाएको ह्यान्ड प्यालेट ट्रक हो ✓\n② 핸드 카트 भनेको सामान्य हातले गुडाउने कार्ट हो ✗\n③ 일륜차 भनेको एक पाङ्ग्रे ठेलागाडी हो ✗\n④ 손수레 भनेको हातले गुडाउने ठेलागाडी हो ✗"}, {"n": "323", "q": "물건을 싣고 이동시키기 위한 바퀴 달린 운반 장비로, 주로 공장, 창고, 물류 현장에서 사용됩니다. 무거운 짐을 실어 나를 때 사용하는 평평한 판 위에 바퀴가 달린 운반 수레입니다.", "options": ["대차", "트렉터", "파렛트", "지게차"], "answer": 0, "explain": "प्रश्नको अर्थ: कारखाना वा गोदाममा गहु्रङ्गो सामान राखेर गुडाउन सजिलो होस् भनी मुनि पाङ्ग्रा राखिएको तेर्सो सम्म परेको सामान ओसार्ने साधनको बारेमा भनिएको छ।\n① 대차 भनेको सामान बोकेर लैजान पाङ्ग्रा भएको समथल प्लेट वा ट्रली हो ✓\n② 트렉터 भनेको ट्र्याक्टर हो ✗\n③ 파렛트 भनेको सामान राख्ने प्यालेट हो ✗\n④ 지게차 भनेको फोर्कलिफ्ट हो ✗"}, {"n": "324", "q": "다른 나라로부터 상품이나 기술 따위를 국내로 사들이는 절차를 말합니다.", "options": ["수출", "무역", "수입", "소득"], "answer": 2, "explain": "प्रश्नको अर्थ: विदेशबाट सामान वा प्रविधि आफ्नो देशभित्र किनेर ल्याउने व्यापारिक प्रक्रियालाई बुझाउँछ।\n① 수출 भनेको विदेशमा सामान पठाउनु वा निर्यात गर्नु हो ✗\n② 무역 भनेको दुई देशबीच सामान किनबेच गर्नु वा व्यापार गर्नु हो ✗\n③ 수입 भनेको विदेशबाट सामान वा प्रविधि देश भित्र भित्र्याउनु वा आयात गर्नु हो ✓\n④ 소득 भनेको आम्दानी हो ✗"}, {"n": "325", "q": "자연에서 인간의 노력 없이 얻을 수 있는 자원으로, 산업과 생활에 활용되는 물, 공기, 석유, 석탄, 산림, 광물 같은 자원입니다.", "options": ["수자원", "문화유산", "천연자원", "산림 재산"], "answer": 2, "explain": "प्रश्नको अर्थ: मानिसको प्रयास बिना प्रकृतिबाटै पाइने र जीवन तथा उद्योगमा प्रयोग हुने पानी, हावा, तेल, खनिज जस्ता वस्तुहरूलाई जनाउँछ।\n① 수자원 भनेको पानीका स्रोतहरू हुन् ✗\n② 문화유산 भनेको सांस्कृतिक सम्पदा हो ✗\n③ 천연자원 भनेको प्रकृतिबाट मानिसको प्रयास बिना प्राप्त हुने पानी, हावा, खनिज जस्ता प्राकृतिक स्रोतहरू हुन् ✓\n④ 산림 재산 भनेको वनसम्बन्धी सम्पत्ति हो ✗"}, {"n": "326", "q": "국가 간에 상품이나 서비스를 사고파는 경제 활동을 말합니다. 예를 들어 한국이 외국에 자동차를 수출하고, 밀이나 석유를 수입하는 것입니다.", "options": ["소득", "무역", "임금", "재산"], "answer": 1, "explain": "प्रश्नको अर्थ: विभिन्न देशहरूबीच सामान वा सेवा खरिद र बिक्री गर्ने आर्थिक कार्यको वर्णन गरिएको छ।\n① 소득 भनेको आम्दानी हो ✗\n② 무역 भनेको देशहरूबीच सामान वा सेवाहरूको किनबेच गर्ने आर्थिक गतिविधि वा व्यापार हो ✓\n③ 임금 भनेको ज्याला वा तलब हो ✗\n④ 재산 भनेको सम्पत्ति हो ✗"}, {"n": "327", "q": "한 나라가 자국의 상품이나 서비스를 다른 나라에 보내어 판매하는 경제 활동입니다.", "options": ["비용", "수입", "수출", "세금"], "answer": 2, "explain": "प्रश्नको अर्थ: आफ्नो देशमा बनेका सामान वा सेवाहरू विदेशी बजारमा लगेर बेच्ने कार्यको बारेमा बताइएको छ।\n① 비용 भनेको खर्च हो ✗\n② 수입 भनेको आयात हो ✗\n③ 수출 भनेको आफ्नो देशको सामान वा सेवा अर्को देशमा पठाएर बिक्री गर्ने आर्थिक गतिविधि वा निर्यात हो ✓\n④ 세금 भनेको कर हो ✗"}, {"n": "328", "q": "지하에서 뽑아낸 정제되지 않은 천연 상태의 기름으로, 석유 제품의 원료가 됩니다. 휘발유, 경유, 플라스틱 등을 만드는 데 사용됩니다.", "options": ["원유", "재료", "장비", "전기"], "answer": 0, "explain": "प्रश्नको अर्थ: जमिनमुनिबाट निकालिएको प्राकृतिक तेल जसलाई प्रशोधन गरेर पेट्रोल, डिजेल वा प्लास्टिक बनाउन कच्चा पदार्थको रूपमा प्रयोग गरिन्छ।\n① 원유 भनेको जमिनमुनिबाट निकालिएको प्रशोधन नगरिएको प्राकृतिक तेल वा कच्चा तेल हो ✓\n② 재료 भनेको सामग्री हो ✗\n③ 장비 भनेको उपकरण हो ✗\n④ 전기 भनेको बिजुली हो ✗"}, {"n": "329", "q": "기계, 장비, 차량 등에서 부품이나 장치를 설치하거나 부착하는 과정을 의미합니다. 이 과정은 부품이 원활히 작동하도록 연결하거나 고정하는 중요한 작업입니다.", "options": ["작동", "관리", "재고", "장착"], "answer": 3, "explain": "प्रश्नको अर्थ: मेसिन, गाडी वा उपकरणहरूमा कुनै भाग वा सामान सही ठाउँमा जोड्ने र अड्याउने कामलाई जनाउँछ।\n① 작동 भनेको मेसिन चल्नु वा सञ्चालन हुनु हो ✗\n② 관리 भनेको व्यवस्थापन वा रेखदेख गर्नु हो ✗\n③ 재고 भनेको बाँकी सामान वा स्टक हो ✗\n④ 장착 भनेको मेसिन वा सवारी साधनमा पार्टपुर्जा वा यन्त्र जडान गर्नु वा फिट गर्नु हो ✓"}, {"n": "330", "q": "어떤 기계나 구조물을 분해하거나 분리하는 과정을 말합니다. 이는 부품을 하나씩 나누거나, 원래의 형태에서 분해하는 작업을 포함합니다.", "options": ["용접", "절단", "해체", "회전"], "answer": 2, "explain": "प्रश्नको अर्थ: कुनै मेसिन वा संरचनाका भागहरूलाई छुट्ट्याएर अलग-अलग पार्ने वा फुकाल्ने कामको वर्णन गरिएको छ।\n① 용접 भनेको वेल्डिङ गर्ने काम हो, त्यसैले यो मेसिन वा संरचना फुकाल्नेसँग मिल्दैन। ✗\n② 절단 भनेको सामान काट्ने काम हो, त्यसैले यो विवरणसँग मेल खाँदैन। ✗\n③ 해체 भनेको खोलकल गर्ने वा विघटन गर्ने काम हो, जसले विवरणमा भनिए झैँ मेसिन वा संरचनाका भागहरू छुट्याउने कामलाई बुझाउँछ। ✓\n④ 회전 भनेको घुम्ने वा घुमाउने कार्य हो, त्यसैले यो खोलकल गर्नेसँग मिल्दैन। ✗"}, {"n": "331", "q": "본래 있어야 할 물질과 다른 물질이 섞여 있는 상태를 말합니다. 주로 원하지 않거나 불필요한 물질을 지칭합니다.", "options": ["재질", "수물질", "이물질", "화학물질"], "answer": 2, "explain": "प्रश्नको अर्थ: कुनै शुद्ध वस्तुमा मिसिएको अनावश्यक वा नचाहिने बाहिरी पदार्थलाई जनाउँछ।\n① 재질 भनेको सामानको किसिम वा गुण हो, त्यसैले यो बाहिरबाट मिसिने नचाहिने वस्तु होइन। ✗\n② 수물질 भनेको पानीजन्य वा असम्बन्धित शब्द हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 이물질 भनेको नचाहिने बाहिरी पदार्थ हो, जसले सक्कली वस्तुमा अर्कै नचाहिने चीज मिसिएको अवस्थालाई बुझाउँछ। ✓\n④ 화학물질 भनेको रासायनिक पदार्थ हो, त्यसैले यो नचाहिने तत्त्व मिसिएको विवरणसँग मिल्दैन। दोस्रो विकल्प '수물질' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "332", "q": "실내의 탁한 공기를 밖으로 내보내고 신선한 공기를 들여오는 기계 장치입니다. 욕실, 주방, 공장 등에서 공기 순환과 환기를 위해 사용됩니다.", "options": ["환풍기", "선풍기", "에어컨", "온돌"], "answer": 0, "explain": "प्रश्नको अर्थ: कोठा, भान्सा वा कारखानाभित्रको नराम्रो वा फोहर हावा बाहिर फालेर ताजा हावा भित्र ल्याउने उपकरणको बारेमा भनिएको छ।\n① 환풍기 भनेको कोठाको फोहोर हावा बाहिर फालेर ताजा हावा भित्र ल्याउने भेन्टिलेटर वा एक्जस्ट फ्यान हो ✓\n② 선풍기 भनेको पङ्खा (बिजुलीको पंखा) हो ✗\n③ 에어컨 भनेको एयर कन्डिसनर हो ✗\n④ 온돌 भनेको कोरियाली तातो भुइँ प्रणाली हो ✗"}, {"n": "333", "q": "회전하는 절삭공구에 가공물을 이송하여 원하는 형상으로 가공하는 공작 기계로 특히 가공물을 절단하고 깎을 때 사용합니다.", "options": ["선반 기계", "밀링 기계", "용접 기계", "프레스 기계"], "answer": 1, "explain": "प्रश्नको अर्थ: घुम्ने औजारको मद्दतले धातु वा वस्तुलाई काटेर वा तासेर चाहेको आकार बनाउन प्रयोग गरिने मेसिनको वर्णन गरिएको छ।\n① 선반 기계 भनेको लेथ मेसिन हो जसले धातु वा काठलाई घुमाएर काट्छ ✗\n② 밀링 기계 भनेको घुम्ने कटरको माध्यमबाट वर्कपिसलाई काटेर, कुँदेर वा सेप दिने मिलिङ मेसिन हो ✓\n③ 용접 기계 भनेको वेल्डिङ मेसिन हो ✗\n④ 프레스 기계 भनेको प्रेस मेसिन हो ✗"}, {"n": "334", "q": "금속, 나무, 돌 따위를 회전시켜서 갈거나 파내거나 도려내는 데 쓰는 공작 기계입니다.", "options": ["밀링 기계", "밴딩 기계", "선반 기계", "용접 기계"], "answer": 2, "explain": "प्रश्नको अर्थ: धातु, काठ वा ढुंगालाई घुमाएर तास्न, खोप्न वा गोलो आकार दिन प्रयोग गरिने औजार मेसिनको बारेमा भनिएको हो।\n① 밀링 기계 भनेको मिलिङ मेसिन हो ✗\n② 밴딩 기계 भनेको बेन्डिङ मेसिन हो ✗\n③ 선반 기계 भनेको धातु, काठ वा ढुङ्गालाई घुमाएर छिलेर, खोपेर वा काटेर आकार निकाल्ने लेथ मेसिन हो ✓\n④ 용접 기계 भनेको वेल्डिङ मेसिन हो ✗"}, {"n": "335", "q": "두 개 이상의 금속 물체나 재료를 열로 녹여서 접합시키는 기계입니다.", "options": ["밀링 기계", "용접 기계", "선반 기계", "프레스 기계"], "answer": 1, "explain": "प्रश्नको अर्थ: दुई वा सोभन्दा बढी फलाम वा धातुका टुक्राहरूलाई तापले पगालेर आपसमा जोड्न प्रयोग गरिने मेसिनलाई जनाउँछ।\n① 밀링 기계 भनेको मिलिङ मेसिन हो ✗\n② 용접 기계 भनेको दुई वा दुईभन्दा बढी धातुका वस्तु वा सामग्रीहरूलाई तापको सहायताले पगालेर जोड्ने वेल्डिङ मेसिन हो ✓\n③ 선반 기계 भनेको लेथ मेसिन हो ✗\n④ 프레스 기계 भनेको प्रेस मेसिन हो ✗"}, {"n": "336", "q": "붙이는 작업을 할 때 아주 뜨거운 불꽃이 튈 수 있어서 다치지 않도록 조심해서 일해야 하는 기계입니다.", "options": ["선반기계", "프레스기계", "밀링기계", "전기용접기"], "answer": 3, "explain": "प्रश्नको अर्थ: धातु जोड्ने काम गर्दा तातो झिल्काहरू निस्कने भएकाले सुरक्षाको ध्यान दिएर चलाउनुपर्ने विद्युतीय मेसिनको वर्णन गरिएको छ।\n① 선반기계 भनेको धातुलाई घुमाएर काट्ने मेसिन हो ✗\n② 프레스기계 भनेको धातुमा दबाब दिने मेसिन हो ✗\n③ 밀링기계 भनेको मिलिङ गर्ने मेसिन हो ✗\n④ 전기용접기 भनेको बिजुलीको आगोले धातु जोड्ने मेसिन हो जसमा आगोको फुल्लिङ उड्न सक्छ ✓"}, {"n": "337", "q": "금속이나 기타 재료에 큰 압력을 가해 절단, 성형, 구멍 뚫기 등의 작업을 수행하는 산업용 기계입니다.", "options": ["선반기계", "프레스기계", "밀링기계", "전기용접기"], const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-07';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Renders the explanation as a structured list: the explanation string is
// lines separated by "\n" — first line is the question's own meaning
// ("प्रश्नको अर्थ: ..."), then one line per option ("① <word> ... ✓/✗").
// Lines render as separate rows; the ✓ line gets a green tint and the ✓/✗
// marker is coloured. Explanations without line breaks (fallback prose)
// render as a single paragraph, exactly as before. Uses text nodes only,
// never innerHTML, so explanation text is never parsed as markup.
function renderExplain(box, explain) {
  const lines = (explain || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length <= 1) {
    const b = document.createElement('b');
    b.textContent = 'किन? ';
    box.appendChild(b);
    const s = document.createElement('span');
    s.textContent = explain;
    box.appendChild(s);
    return;
  }
  const label = document.createElement('div');
  label.className = 'explain-label';
  label.textContent = 'व्याख्या';
  box.appendChild(label);
  lines.forEach((ln, li) => {
    const d = document.createElement('div');
    if (li === 0 && ln.indexOf('प्रश्नको अर्थ') === 0) {
      d.className = 'explain-stem';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    if (ln.indexOf('शिक्षकको उत्तर-पत्र:') === 0) {
      d.className = 'exp-note';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    const mark = ln.endsWith('✓') ? '✓' : (ln.endsWith('✗') ? '✗' : '');
    const body = mark ? ln.slice(0, -1).trim() : ln;
    d.className = 'exp-line' + (mark === '✓' ? ' exp-ok' : '');
    d.appendChild(document.createTextNode(body + (mark ? ' ' : '')));
    if (mark) {
      const m = document.createElement('span');
      m.className = 'exp-mark ' + (mark === '✓' ? 'ok' : 'no');
      m.textContent = mark;
      d.appendChild(m);
    }
    box.appendChild(d);
  });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    renderExplain(card.querySelector('.explain'), q.explain);
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
