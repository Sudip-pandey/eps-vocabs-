<title>EPS-TOPIK Vocabulary Quiz — Set 10 (Q451–Q500)</title>
<style>
  :root {

  }

  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); color: #d6c9ff; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,.12); margin-bottom: 14px; transition: all .15s; }
  .back-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  header { background: #312e81; color: #fff; padding: 20px 16px 16px; position: relative; border-bottom: 1px solid rgba(255,255,255,.1); box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.4rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.25); }

  .progress-wrap { margin-top: 14px; background: rgba(0,0,0,.35); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .progress-bar { height: 100%; background: #a5b4fc; width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(165,180,252,.6); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { position: relative; background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; background: #6366f1; border-radius: 0 0 6px 6px; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: rgba(167,139,250,.55); }
  .q-card.answered::after { content: "✓"; position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: #059669; color: #fff; font-weight: 800; font-size: .95rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .q-num { display: inline-block; font-size: .92rem; font-weight: 800; color: #fff; background: #4f46e5; padding: 7px 18px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(79,70,229,.4); }
  .q-text { font-size: 1.16rem; white-space: pre-line; margin: 14px 0 18px; line-height: 1.85; font-weight: 500; color: #f2f1fa; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 16px 18px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid rgba(255,255,255,.09); border-radius: 14px; margin-bottom: 0; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #1e1e30; color: #f2f1fa; }
  .options label:hover { border-color: #8b5cf6; background: #232338; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,.3); }
  .options label::before { content: ""; flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid #7c7ca0; background: transparent; transition: all .15s; }
  .options label.selected { background: var(--accent-soft); border-color: #a78bfa; box-shadow: 0 4px 18px rgba(99,102,241,.4); }
  .options label.selected::before { border-color: #a78bfa; background: #a78bfa; box-shadow: inset 0 0 0 4px #1e1e30; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #a5b4fc; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 700; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .btn-primary { background: #4f46e5; color: #fff; box-shadow: 0 4px 18px rgba(79,70,229,.4); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 8px 24px rgba(79,70,229,.45); }
  .btn-primary:disabled { background: #2a2a3d; color: #77778e; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: rgba(255,255,255,.06); color: #d6c9ff; border: 2px solid rgba(255,255,255,.12); }
  .btn-ghost:hover { border-color: #8b5cf6; background: rgba(124,58,237,.2); }
  .submit-bar { position: sticky; bottom: 0; background: rgba(11,11,22,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 24px rgba(0,0,0,.5); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .score-card { background: #1e1b3a; border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; line-height: 1.05; color: #a5b4fc; }
  .score-card .pct { font-size: 1.15rem; color: #c9c6e0; margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: #e6e4f5; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: #4f46e5; color: #fff; border-color: transparent; box-shadow: 0 2px 12px rgba(79,70,229,.35); }
  .review-card { background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: #059669; }
  .verdict.no { background: #e11d48; }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; background: #1e1e30; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #12101f; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; color: #d9d7ea; }
  .explain b { color: #d6c9ff; }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; }
  .explain-stem { background: rgba(99,102,241,.18); border-left: 4px solid #a78bfa; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; color: #f2f1fa; }
  .exp-line { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.07); line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: #34d399; }
  .exp-mark.no { color: #fb7185; }
  .exp-note { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.4); border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; color: #fde9c8; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }

</style>

<script>
const QUESTIONS = [{"n": "451", "q": "풀을 자르거나 깎는 데 사용하는 기계로 주로 논, 밭, 과수원, 도로 주변, 공원 등에서 자란 잔디나 잡초를 정리할 때 사용합니다.", "options": ["수준기", "예초기", "정수기", "경운기"], "answer": 1, "explain": "प्रश्नको अर्थ: यो खेत, बगैँचा वा पार्कहरूमा उम्रेका घाँस र झाडीहरू काट्न प्रयोग गरिने मेसिनको विवरण हो।\n① 수준기 भनेको लेभल मिलाउने औजार हो, यो घाँस काट्ने मेसिन होइन त्यसैले मिलेन। ✗\n② 예초기 भनेको घाँस वा बुट्यान काट्ने मेसिन हो ✓\n③ 정수기 भनेको पानी फिल्टर गर्ने मेसिन हो, यो घाँस काट्ने होइन त्यसैले मिलेन। ✗\n④ 경운기 भनेको हाते ट्र्याक्टर हो, यो घाँस काट्ने मेसिन होइन त्यसैले मिलेन। 예초기 भनेको घाँस काट्ने मेसिन हो। ✗"}, {"n": "452", "q": "땅을 파거나 고를 때 사용하는 농기구입니다. 끝이 날카로운 쇠로 되어 있고, 손잡이를 잡고 흔들어 흙을 팔 때 사용합니다.", "options": ["삽", "괭이", "망치", "곡괭이"], "answer": 1, "explain": "प्रश्नको अर्थ: यो माटो खन्न वा ढिक्का फुटाउन प्रयोग गरिने फलामको धारिलो औजारको विवरण हो। यसको बिँड समातेर माटो खन्ने गरिन्छ।\n1. 삽 भनेको माटो काट्ने साबेल हो, यो कुटो होइन त्यसैले मिलेन। 2. 괭이 भनेको माटो खन्ने वा गोडमेल गर्ने कुटो हो, त्यसैले यो सही उत्तर हो। 3. 망치 भनेको हथौडा हो, यो कृषि औजार होइन त्यसैले मिलेन। 4. 곡괭이 भनेको गैंची हो, यो कुटोभन्दा फरक हुन्छ त्यसैले यो होइन। 괭이 भनेको माटो खन्ने कुटो हो।"}, {"n": "453", "q": "밭에서 풀을 뽑거나 흙을 고를 때 사용하는 작은 농기구입니다. 한 손으로 쓸 수 있는 도구로, 끝이 휘어져 있어서 흙을 긁거나 파기에 좋고, 잡초를 쉽게 제거할 수 있습니다.", "options": ["호미", "괭이", "갈퀴", "낫"], "answer": 0, "explain": "प्रश्नको अर्थ: यो बारीमा एक हातले समातेर झार उखेल्न र माटो कोस्रन प्रयोग गरिने सानो औजारको विवरण हो।\n① 호미 भनेको सानो कुटो हो, यो एक हातले घाँस उखेल्न र माटो सोहर्न प्रयोग गरिने औजार भएकाले विवरणसँग सही मिल्छ। ✓\n② 괭이 भनेको कुदालो हो, यो दुवै हातले प्रयोग गरिने अलि ठूलो औजार भएकाले विवरणसँग मिल्दैन। ✗\n③ 갈퀴 भनेको सोहर्ने दाँती हो, यो घाँस वा पात सोहर्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 낫 भनेको हँसिया हो, यो बाली वा घाँस काट्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "454", "q": "씨앗을 뿌려 모를 키우는 작은 밭이나 판입니다. 주로 벼농사에서 많이 사용되며, 모판에서 모를 일정 크기로 키운 뒤, 본논에 옮겨 심는 방식으로 농사를 짓습니다.", "options": ["수레", "분뇨", "상자", "모판"], "answer": 3, "explain": "प्रश्नको अर्थ: यो धानको बीउ छरेर बेउरा वा बीउ हुर्काउने सानो ठाउँ वा बाकसको विवरण हो। यहाँ बेउरा हुर्केपछि मुख्य खेतमा सारिन्छ।\n① 수레 भनेको ठेलागाडी हो, यो बेर्ना हुर्काउने ठाउँ होइन त्यसैले मिलेन। ✗\n② 분뇨 भनेको मलमूत्र हो, यो बेर्ना राख्ने ठाउँ होइन त्यसैले मिलेन। ✗\n③ 상자 भनेको बक्स हो, यो बेर्ना राख्ने ठाउँसँग मिल्दैन। ✗\n④ 모판 भनेको धान वा तरकारीको बेर्ना उमार्ने ब्याड (प्लाष्टिक वा काठको ट्रे) हो, त्यसैले यो सही उत्तर हो। 모판 भनेको बेर्ना उमार्ने ठाउँ वा ब्याड हो। ✓"}, {"n": "455", "q": "토지의 생산력을 높이고 식물에 생장을 돕기 위해 땅에 뿌리는 물질입니다.", "options": ["씨앗", "비료", "사료", "모종, 바종"], "answer": 1, "explain": "प्रश्नको अर्थ: यो माटोको उर्वरा शक्ति बढाउन र बिरुवालाई राम्ररी हुर्काउन माटोमा हालिने पोषक तत्त्वको विवरण हो।\n① 씨앗 भनेको बीउ हो, यो माटोमा हालिने रासायनिक वा प्रांगारिक पदार्थ होइन त्यसैले मिलेन। ✗\n② 비료 भनेको माटोको उर्वराशक्ति बढाउन र बिरुवाको वृद्धिका लागि प्रयोग गरिने मल (खेतीमा हाल्ने मल) हो ✓\n③ 사료 भनेको दाना (जनावरलाई खुवाउने) हो, यो माटोमा हाल्ने होइन त्यसैले मिलेन। ✗\n④ 모종, 바종 भनेको बेर्ना र बीउ छर्ने काम हो, यो मल होइन त्यसैले मिलेन। 비료 भनेको मल वा फर्टिलाइजर हो। चौथो विकल्प '모종, 바종' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "456", "q": "나무를 심고, 가꾸고, 수확하는 작업이 이루어지며, 과일 생산을 위한 전문적인 농업 공간입니다.", "options": ["농장", "공원", "정원", "과수원"], "answer": 3, "explain": "प्रश्नको अर्थ: यो विभिन्न प्रकारका फलफूलका रुखहरू हुर्काएर फल उत्पादन गरिने विशेष ठाउँ वा बगैँचाको विवरण हो।\n① 농장 भनेको समग्र बालीनाला लगाउने र जनावर पाल्ने फार्म हो ✗\n② 공원 भनेको मानिसहरू आराम गर्ने पार्क हो ✗\n③ 정원 भनेको बगैंचा हो ✗\n④ 과수원 भनेको फलफूल उत्पादन गर्ने बगैंचा वा फार्म हो ✓"}, {"n": "457", "q": "가축들이 먹는 먹이를 말하며 주로 곡물, 풀, 콩, 비타민 등으로 만들어지며, 가축이 건강하게 자라고 고기나 우유, 달걀 등을 잘 생산할 수 있도록 도와줍니다.", "options": ["비료", "분뇨", "사료", "건초"], "answer": 2, "explain": "प्रश्नको अर्थ: यो गाईवस्तु, सुँगुर वा कुखुरा जस्ता पशुपन्छीलाई खुवाइने ताकतिलो दाना वा आहारको विवरण हो।\n① 비료 भनेको मल हो ✗\n② 분뇨 भनेको पशुपक्षीको मलमूत्र हो ✗\n③ 사료 भनेको जनावरलाई खुवाउने दाना (आहारा) हो ✓\n④ 건초 भनेको सुकेको घाँस हो ✗"}, {"n": "458", "q": "가축에게 사료를 주는 기계나 도구입니다. 이 기계는 자동 또는 수동으로 작동하며, 일정한 양의 사료를 정해진 시간에 가축에게 공급해 줍니다.", "options": ["바가지", "사료조", "급이기", "계량컵"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पशुपन्छीलाई तोकिएको समयमा निश्चित मात्रामा दाना वा खाना दिने मेसिन वा उपकरणको विवरण हो।\n① 바가지 भनेको पानी वा दाना तान्ने बाटा वा कचौरा हो ✗\n② 사료조 भनेको दाना राख्ने भाँडो वा डुँड हो ✗\n③ 급이기 भनेको पशुलाई स्वचालित वा हाते तरिकाले दाना खुवाउने यन्त्र (फीडर) हो ✓\n④ 계량컵 भनेको नाप्ने कप हो ✗"}, {"n": "459", "q": "가축에게 사료를 담아주는 그릇이나 통입니다. 주로 가축들이 사료를 먹을 수 있도록 담아두는 용기로, 플라스틱, 철, 시멘트 등 다양한 재료로 만들어집니다.", "options": ["주전자", "사료조", "급이기", "저울"], "answer": 1, "explain": "प्रश्नको अर्थ: यो पशुहरूले सजिलै दाना खान सकून् भनेर दाना हालिदिने भाँडो वा कुँडको विवरण हो।\n① 주전자 भनेको चिया वा पानी उमाल्ने वा राख्ने भाँडो हो ✗\n② 사료조 भनेको पशुलाई दाना राख्ने भाँडो वा डुँड हो ✓\n③ 급이기 भनेको दाना खुवाउने यन्त्र हो ✗\n④ 저울 भनेको तराजु हो ✗"}, {"n": "460", "q": "건초나 풀처럼 가축에게 먹이는 거친 사료를 말합니다. 주로 소나 양 같은 초식 가축에게 주며, 예를 들어 볏짚, 건초, 옥수수 줄기, 청초 등이 있습니다.", "options": ["조사료", "미네랄", "습사료", "곡물"], "answer": 0, "explain": "प्रश्नको अर्थ: यो गाई र भेडा जस्ता शाकाहारी पशुहरूलाई खुवाइने सुकेको घाँस, पराल वा ढोड जस्ता घाँसजन्य आहारको विवरण हो।\n① 조사료 भनेको खस्रो आहारा (घाँस, पराल आदि) हो ✓\n② 미네랄 भनेको खनिज पदार्थ हो ✗\n③ 습사료 भनेको ओसिलो वा झोलयुक्त दाना हो ✗\n④ 곡물 भनेको अन्नबाली हो ✗"}, {"n": "461", "q": "자루가 달려 있는 그릇이나 도구로, 물건을 담거나 퍼내는 데 사용하는 도구입니다. 주로 물이나 곡물, 사료 등을 퍼내거나 담는 데 사용됩니다.", "options": ["양동이", "바가지", "손수레", "프라이팬"], "answer": 1, "explain": "प्रश्नको अर्थ: यो समात्ने बिँड भएको भाँडो वा औजार हो, जसले पानी, अन्न वा दाना उघाउन वा हाल्न प्रयोग गरिन्छ।\n① 양동이 भनेको बाल्टी हो ✗\n② 바가지 भनेको पानी वा दाना उघाउने डुडुल्को वा पहेँलो बाटाजस्तो भाँडो हो ✓\n③ 손수레 भनेको हाते ठेला हो ✗\n④ 프라이팬 भनेको कराैँ (तवा) हो ✗"}, {"n": "462", "q": "가축을 기르는 건물이나 공간을 의미합니다. 보통 소, 돼지, 양, 닭 등 가축을 키우기 위해 만들어진 건물로, 가축들이 편하게 지낼 수 있도록 설계됩니다.", "options": ["농장", "공장", "축사", "과수원"], "answer": 2, "explain": "प्रश्नको अर्थ: यो गाई, सुँगुर, भेडा वा कुखुरा जस्ता पाल्तु जनावरहरूलाई पाल्न र राख्न बनाइएको ठाउँ वा भवन हो।\n① 농장 भनेको कृषि फर्म हो ✗\n② 공장 भनेको कारखाना हो ✗\n③ 축사 भनेको पशुपक्षी पाल्ने गोठ (खोर) हो ✓\n④ 과수원 भनेको फलफूल बगैंचा हो ✗"}, {"n": "463", "q": "보통 물고기를 잡을 때 쓰는 수단으로 노끈이나 실, 쇠줄 따위로 여러 구멍이 나게 엮은 물건입니다.", "options": ["통발", "그물", "갈퀴", "밧줄"], "answer": 1, "explain": "प्रश्नको अर्थ: यो धागो वा डोरीलाई धेरै प्वाल हुने गरी बुनेर माछा समात्न प्रयोग गरिने साधन हो।\n① 통발 भनेको माछा समात्ने थुन्से आकारको पासो हो ✗\n② 그물 भनेको माछा समात्ने जालो हो ✓\n③ 갈퀴 भनेको घाँस वा पात बटुलुवा हो ✗\n④ 밧줄 भनेको डोरी हो ✗"}, {"n": "464", "q": "어업에서 물고기를 잡는 그물을 걷어올리는데 사용되는 기계입니다.", "options": ["집어등", "양망기", "바늘대", "밧줄"], "answer": 1, "explain": "प्रश्नको अर्थ: यो माछा मार्ने काममा पानीबाट माछा परेको साधनलाई माथि तान्न वा उठाउन प्रयोग गरिने मेसिन हो।\n① 집어등 भनेको माछा तान्ने बत्ती हो ✗\n② 양망기 भनेको माछा मार्ने जालो तान्ने मेसिन हो ✓\n③ 바늘대 भनेको बत्तीको सिन्का वा सुई राख्ने साधन हो ✗\n④ 밧줄 भनेको डोरी हो ✗"}, {"n": "465", "q": "물고기나 해양 생물을 잡는 그물 형태의 덫입니다. 보통 원통 모양으로 생겼고, 입구가 좁아 생물이 들어가면 나오기 어렵도록 설계되어 있습니다.", "options": ["닻", "뜰채", "부표", "통발"], "answer": 3, "explain": "प्रश्नको अर्थ: यो ढोका साँघुरो भएको बेलनाकार पासो हो, जसमा माछा वा जलचर पसेपछि बाहिर निस्कन गाह्रो हुन्छ।\n① 닻 भनेको लङ्गर हो, यो जहाजलाई एकै ठाउँमा रोक्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 뜰채 भनेको हात जाली हो, यो पानीबाट माछा उठाउन प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 부표 भनेको तैरिने भुवा हो, यो स्थान जनाउन प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 통발 भनेको ढडिया हो, यो बेलनाकार आकारको माछा समात्ने पासो भएकाले विवरणसँग सही मिल्छ। ✓"}, {"n": "466", "q": "물속에서 물고기나 다른 수생 생물을 잡는 도구입니다. 주로 연못이나 작은 호수에서 물고기를 잡을 때 사용되며, 낚시나 수산업에서 자주 사용됩니다.", "options": ["뜰채", "밧줄", "그물", "바늘대"], "answer": 0, "explain": "प्रश्नको अर्थ: यो पोखरी वा सानो तालमा पानीभित्रका माछाहरूलाई उघारेर वा समातेर निकाल्न प्रयोग गरिने औजार हो।\n① 뜰채 भनेको सानो जाली वा छिपो हो जसले पानीभित्रका जीवहरू समात्छ ✓\n② 밧줄 भनेको डोरी हो ✗\n③ 그물 भनेको ठूलो जाल हो ✗\n④ 바늘대 भनेको सुई हो ✗"}, {"n": "467", "q": "햇빛이나 강한 조명을 차단하여 실내 온도 조절이나 눈부심 방지에 사용하는 막입니다. 주로 비닐하우스, 창문, 어업용 어 등에 활용됩니다.", "options": ["갑판", "부표", "바늘대", "차광막"], "answer": 3, "explain": "प्रश्नको अर्थ: यो घामको कडा प्रकाशलाई रोकेर भित्री तापमान मिलाउन वा आँखा तिर्मिराउन नदिन प्रयोग गरिने पर्दा वा ओझेल हो।\n① 갑판 भनेको जहाजको डेक हो ✗\n② 부표 भनेको पानीमा तैरिने बुइो हो ✗\n③ 바늘대 भनेको सुई वा सोसम्बन्धी साधन हो ✗\n④ 차광막 भनेको घाम छेक्ने जाली (शेड नेट) हो ✓"}, {"n": "468", "q": "보통 그물을 칠 때 사용하는 실이나 줄을 한쪽 끝에 걸어서 날 속으로 들여 지르는 가늘고 길쭉한 막대기입니다.", "options": ["닻", "고리", "도르래", "바늘대"], "answer": 3, "explain": "प्रश्नको अर्थ: यो माछा मार्ने साधन बुन्दा वा मर्मत गर्दा धागो छिराउन प्रयोग गरिने पातलो र लामो सिन्का हो।\n① 닻 भनेको लंगर हो ✗\n② 고리 भनेको रिङ वा कडी हो ✗\n③ 도르래 भनेको घिर्नी हो ✗\n④ 바늘대 भनेको जाल बुन्ने वा छिराउने सिन्का वा साधन हो ✓"}, {"n": "469", "q": "물이나 약제를 높은 압력으로 뿌려 세척, 농약 살포 등에 사용하는 장비입니다. 강한 압력 덕분에 먼지, 오염물, 해충 등을 효과적으로 제거할 수 있습니다.", "options": ["양망기", "차광막", "고압 호스", "고압 분사기"], "answer": 3, "explain": "प्रश्नको अर्थ: यो ठूलो बलका साथ पानी वा औषधि छर्केर सफा गर्न वा कीटनाशक हाल्न प्रयोग गरिने उपकरण हो।\n① 양망기 भनेको जाल तान्ने मेसिन हो ✗\n② 차광막 भनेको घाम छेक्ने जाली हो ✗\n③ 고압 호스 भनेको उच्च चापको पाइप हो ✗\n④ 고압 분사기 भनेको उच्च चापमा पानी वा औषधि छ्याप्ने यन्त्र हो ✓"}, {"n": "470", "q": "물고기, 조개, 해조류 등을 인공적으로 기르기 위해 바다나 강, 호수 등에 설치한 시설입니다. 어업에서 안정적인 수산물 생산을 위해 중요한 역할을 합니다.", "options": ["농장", "닭장", "양식장", "양계장"], "answer": 2, "explain": "प्रश्नको अर्थ: यो समुद्र, नदी वा तालमा माछा वा अन्य जलचरहरूलाई कृत्रिम रूपमा हुर्काउन बनाइएको संरचना हो।\n① 농장 भनेको कृषि फर्म हो ✗\n② 닭장 भनेको कुखुराको खोर हो ✗\n③ 양식장 भनेको माछा वा सामुद्रिक जीव पालन गर्ने केन्द्र (फिश फार्म) हो ✓\n④ 양계장 भनेको कुखुरा पालन फर्म हो ✗"}, {"n": "471", "q": "어업에서 양식장 위치나 어망 설치 지점을 표시하기 위해 사용하는 해상 표지입니다. 부력을 이용해 물 위에 떠 있으며 어선의 작업 효율과 안전을 돕습니다.", "options": ["그물", "갑판", "부표", "밧줄"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पानीमा तैरिएर काम गर्ने ठाउँ वा साधन राखिएको स्थान देखाउन प्रयोग गरिने सङ्केत हो।\n① 그물 भनेको जाल हो, यो माछा समात्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 갑판 भनेको जहाजको डेक हो, यो मानिस उभिने वा सामान राख्ने सतह हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 부표 भनेको तैरिने सङ्केत हो, यो पानीमा तैरिएर स्थान वा दिशा देखाउन प्रयोग गरिने भएकाले विवरणसँग सही मिल्छ। ✓\n④ 밧줄 भनेको डोरी हो, यो सामान बाँध्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "472", "q": "물고기나 해산물을 기르거나 보관하기 위해 사용하는 물탱크 형태의 용기입니다. 양식장이나 실내 사육 시설에서 주로 사용됩니다.", "options": ["구조", "수조", "부표", "통발"], "answer": 1, "explain": "प्रश्नको अर्थ: यो माछा वा जलचर जीवहरूलाई पाल्न वा सुरक्षित राख्न प्रयोग गरिने पानीको ट्याङ्की जस्तो भाँडो हो।\n① 구조 भनेको उद्धार हो, यो खतराबाट बचाउने कार्य हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 수조 भनेको पानीको ट्याङ्की हो, यो माछा वा सामुद्रिक जीव पाल्न र राख्न प्रयोग गरिने भाँडो भएकाले विवरणसँग सही मिल्छ। ✓\n③ 부표 भनेको तैरिने सङ्केत हो, यो पानीमा तैरिएर स्थान देखाउन प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 통발 भनेको ढडिया हो, यो माछा समात्ने पासो हो, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "473", "q": "어류나 해산물이 자라는 양식장에서 물 속에 산소를 공급하여 생물들이 건강하게 자랄 수 있도록 돕는 장비입니다.", "options": ["양식장", "산소 공급기", "고압 분사기", "낚시 바늘"], "answer": 1, "explain": "प्रश्नको अर्थ: यो पानीभित्र माछाहरूलाई सास फेर्न चाहिने हावा पठाएर हुर्काउन मद्दत गर्ने उपकरण हो।\n① 양식장 भनेको माछा पालन गर्ने फार्म हो ✗\n② 산소 공급기 भनेको अक्सिजन आपूर्ति गर्ने यन्त्र हो जसले पानीमा अक्सिजन दिन्छ ✓\n③ 고압 분사기 भनेको उच्च दबाबको पानी छ्याप्ने मेसिन हो ✗\n④ 낚시 바늘 भनेको बल्छिको काँटी हो ✗"}, {"n": "474", "q": "체온이나 물의 온도를 측정하는 도구로 주로 병원, 가정, 또는 양식장이나 어업에서 사용됩니다.", "options": ["계산기", "청소기", "온도계", "체중계"], "answer": 2, "explain": "प्रश्नको अर्थ: यो शरीर वा पानीको तातोपन कति छ भनेर नाप्न प्रयोग गरिने उपकरण हो।\n① 계산기 भनेको क्याल्कुलेटर हो ✗\n② 청소기 भनेको भ्याकुम क्लिनर हो ✗\n③ 온도계 भनेको तापक्रम नाप्ने थर्मामिटर हो ✓\n④ 체중계 भनेको तौल नाप्ने मेसिन हो ✗"}, {"n": "475", "q": "선박을 설계하고 건조하는 산업으로, 상선, 어선, 군함 등 다양한 종류의 배를 제작합니다. 강한 기술력과 정밀한 공정이 요구되며, 해운과 수산업 발전에 중요한 역할을 합니다.", "options": ["농업", "제조업", "조선업", "축산업"], "answer": 2, "explain": "प्रश्नको अर्थ: यो विभिन्न प्रकारका ठूला तथा साना पानीजहाजहरू निर्माण गर्ने उद्योग हो।\n① 농업 भनेको कृषि हो ✗\n② 제조업 भनेको उत्पादन उद्योग हो ✗\n③ 조선업 भनेको जहाज निर्माण गर्ने उद्योग हो ✓\n④ 축산업 भनेको पशुपालन हो ✗"}, {"n": "476", "q": "선박의 항로를 조정하는 곳으로, 선박의 운항을 관리하는 공간입니다. 선장과 조타수가 항해 중 선박의 방향을 조정하고 운항을 통제하는 중요한 역할을 합니다.", "options": ["조타실", "선원실", "선수부", "중앙부"], "answer": 0, "explain": "प्रश्नको अर्थ: यो पानीजहाजको दिशा मिलाउन र यात्रा सञ्चालन गर्न कप्तानले प्रयोग गर्ने मुख्य कोठा हो।\n① 조타실 भनेको जहाजको स्टेयरिङ कक्ष वा ह्वील हाउस हो जहाँबाट जहाजको दिशा नियन्त्रण गरिन्छ ✓\n② 선원실 भनेको नाविकहरूको कोठा हो ✗\n③ 선수부 भनेको जहाजको अगाडिको भाग हो ✗\n④ 중앙부 भनेको मध्य भाग हो ✗"}, {"n": "477", "q": "선박에서 선원들이 생활하는 공간입니다. 주로 숙소 역할을 하며, 선원들이 휴식, 식사, 개인적인 시간을 보내는 장소로 사용됩니다.", "options": ["조타실", "선원실", "선수부", "중앙부"], "answer": 1, "explain": "प्रश्नको अर्थ: यो पानीजहाजमा काम गर्ने कामदारहरू बस्न, सुत्न र आराम गर्नका लागि बनाइएको कोठा हो।\n① 조타실 भनेको जहाज चलाउने कक्ष हो ✗\n② 선원실 भनेको नाविकहरू बस्ने, सुत्ने र आराम गर्ने कोठा हो ✓\n③ 선수부 भनेको जहाजको अगाडिको भाग हो ✗\n④ 중앙부 भनेको मध्य भाग हो ✗"}, {"n": "478", "q": "선박의 뒷부분을 의미합니다. 선박의 추진기나 조타 장치가 위치해 있으며, 항해 중 선박의 방향을 조정하는 중요한 역할을 합니다.", "options": ["양망기", "통발", "선미부", "도료 호스"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पानीजहाजको पछाडिको भाग हो, जहाँ दिशा मिलाउने र अगाडि बढाउने यन्त्रहरू हुन्छन्।\n① 양망기 भनेको जाल तान्ने मेसिन हो, त्यसैले यो जहाजको पछाडिको भाग होइन। ✗\n② 통발 भनेको माछा समात्ने ढोक्सी हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 선미부 भनेको जहाजको पछाडिको भाग हो, जुन दिशा मोड्ने र पछाडि रहने भागको विवरणसँग एकदम मिल्छ। ✓\n④ 도료 호스 भनेको रङ लगाउने पाइप हो, त्यसैले यो सही उत्तर होइन। ✗"}, {"n": "479", "q": "선박의 중간 부분을 말합니다. 선박의 균형을 맞추는 데 중요한 역할을 하며, 화물 공간이나 승객실이 위치할 수 있습니다.", "options": ["중앙부", "그물", "선체", "갑판"], "answer": 0, "explain": "प्रश्नको अर्थ: यो पानीजहाजको बीचको भाग हो, जसले जहाजको सन्तुलन कायम राख्न मद्दत गर्छ।\n① 중앙부 भनेको मध्य भाग हो, जुन जहाजको बीचको भाग भन्ने विवरणसँग एकदम मिल्छ। ✓\n② 그물 भनेको माछा मार्ने जाल हो, त्यसैले यो जहाजको भाग होइन। ✗\n③ 선체 भनेको जहाजको मुख्य जिउ वा ढाँचा हो, त्यसैले यसले बीचको भागलाई मात्र जनाउँदैन। ✗\n④ 갑판 भनेको जहाजको डेक वा भुइँ हो, त्यसैले यो बीचको भाग भन्ने विवरणसँग मिल्दैन। ✗"}, {"n": "480", "q": "선박이나 항공기의 추진력을 생성하는 장치로, 회전하면서 물이나 공기를 밀어내어 이동을 돕습니다. 선박에서는 엔진의 동력을 받아 회전하며, 선박을 앞으로 나가게 합니다.", "options": ["조타실", "프로펠러", "양망기", "비계기둥"], "answer": 1, "explain": "प्रश्नको अर्थ: यो घुमेर पानी वा हावालाई पछाडि धकेल्दै जहाजलाई अगाडि बढाउने पाङ्ग्रा जस्तो यन्त्र हो।\n① 조타실 भनेको जहाज चलाउने कोठा हो ✗\n② 프로펠러 भनेको प्रोपेलर वा पंखा हो जसले पानी वा हावा धकेलेर जहाजलाई अगाडि बढाउँछ ✓\n③ 양망기 भनेको जालो तान्ने यन्त्र हो ✗\n④ 비계기둥 भनेको मचानको खाम्बा हो ✗"}, {"n": "481", "q": "어떤 물체나 구조물의 표면이 갈라져 금이 가는 상태입니다. 주로 건축물, 도로, 유리, 땅 등의 표면에 생기는 좁고 길게 벌어진 틈을 가리킵니다.", "options": ["균열", "물기", "부식", "녹"], "answer": 0, "explain": "प्रश्नको अर्थ: यो भवन, बाटो वा सिसाको सतहमा आउने सानो र लामो चिरिएको भाग वा फाटेको ठाउँलाई जनाउँछ। यसले कुनै वस्तु फुट्न वा फाट्न थालेको अवस्थालाई बुझाउँछ।\n① 균열 भनेको चर्किएको वा फुटेको भाग हो, जुन सतहमा मसिनो रेखा जस्तै फाट्ने विवरणसँग एकदम मिल्छ। ✓\n② 물기 भनेको ओस वा पानीको मात्रा हो, त्यसैले यो चर्किएको अवस्था होइन। ✗\n③ 부식 भनेको धातु खिइने वा नष्ट हुने प्रक्रिया हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 녹 भनेको फलाममा लाग्ने खिया हो, त्यसैले यो पनि सही होइन। ✗"}, {"n": "482", "q": "산화되어 생긴 부식물로, 주로 철이나 강철에서 발생합니다. 이를 방지하기 위해 정기적인 청소와 방청 처리가 필요합니다.", "options": ["면적", "물기", "폭", "녹"], "answer": 3, "explain": "प्रश्नको अर्थ: यो फलाम वा अन्य धातुमा हावा र पानीको सम्पर्कले गर्दा लाग्ने रातो वा खैरो पदार्थ हो। यसबाट जोगाउन फलामलाई नियमित सफा गर्ने र मर्मत गर्ने गरिन्छ।\n① 면적 भनेको क्षेत्रफल हो, त्यसैले यो फलाममा लाग्ने वस्तु होइन। ✗\n② 물기 भनेको ओस वा पानीको मात्रा हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 폭 भनेको चौडाइ हो, त्यसैले यो पनि सही उत्तर होइन। ✗\n④ 녹 भनेको फलाममा लाग्ने खिया हो, जुन अक्सिजन र पानीको सम्पर्कले हुने खियाको विवरणसँग एकदम मिल्छ। ✓"}, {"n": "483", "q": "선박이나 다른 시설에서 안전을 위해 설치된 보호용 장치입니다. 주로 선박의 갑판이나 계단, 출입구 등에 설치되어 승객이나 선원이 떨어지는 사고를 방지하는 역할을 합니다.", "options": ["프로펠러", "도료 호스", "안전난간", "작업발판"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पानीजहाज वा अग्लो ठाउँमा मानिसहरू लड्न वा खस्न नदिन बारको रूपमा हालिने सुरक्षा साधन हो। यसले कामदार वा यात्रीहरूलाई तल खस्नबाट जोगाउँछ।\n① 프로펠러 भनेको जहाज गुडाउने पंखा हो, त्यसैले यो सुरक्षा बार होइन। ✗\n② 도료 호스 भनेको रङ लगाउने पाइप हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 안전난간 भनेको सुरक्षा बार हो, जुन मानिसहरू तल खस्नबाट जोगाउने सुरक्षा उपकरणको विवरणसँग एकदम मिल्छ। ✓\n④ 작업발판 भनेको काम गर्दा उभिने प्लेटफर्म हो, त्यसैले यो सुरक्षा बार होइन। ✗"}, {"n": "484", "q": "선박이나 건설 현장 등에서 작업자가 안전하게 작업을 할 수 있도록 설치된 평평한 표면입니다. 작업 중에 대 위에 서서 작업할 수 있도록 줍니다.", "options": ["비계기둥", "밑둥잡이", "안전난간", "작업발판"], "answer": 3, "explain": "प्रश्नको अर्थ: यो निर्माण क्षेत्र वा जहाजमा कामदारहरू उभिएर सुरक्षित रूपमा काम गर्न बनाइएको समतल ठाउँ हो। यसले अग्लो वा असजिलो ठाउँमा उभिन सजिलो बनाउँछ।\n① 비계기둥 भनेको स्काफोल्डिङको खम्बा हो, यो टेकेर उभिने समथर भाग होइन। ✗\n② 밑둥잡이 भनेको तल्लो भाग अड्याउने काठ वा खाँबो हो, यो कामदार उभिने ठाउँ होइन। ✗\n③ 안전난간 भनेको सुरक्षा रेलिङ हो, यसले खस्नबाट जोगाउँछ तर उभिने सतह होइन। ✗\n④ 작업발판 भनेको काम गर्ने फल्याक वा समथर प्लेटफर्म हो, जसमा उभिएर कामदारले सुरक्षित रूपमा काम गर्न सक्छन्, त्यसैले यो सही विवरण हो। ✓"}, {"n": "485", "q": "작업 현장이나 선박 등에서 작업자의 안전과 편의를 위해 바닥에 까는 단단하고 평평한 판입니다. 미끄럼 방지나 충격 완화, 바닥 보호 등의 역할을 합니다.", "options": ["가세", "깔판", "띠장", "면적"], "answer": 1, "explain": "प्रश्नको अर्थ: यो काम गर्ने ठाउँको भुइँमा बिछ्याइने बलियो र समतल पाता हो। यसले चिप्लिनबाट रोक्छ र भुइँको सुरक्षा गर्छ।\n① 가세 भनेको तिरछा टेको हो, जसले संरचनालाई अड्याउँछ तर भुइँमा ओछ्याउने पाटा होइन। ✗\n② 깔판 भनेको भुइँमा ओछ्याउने म्याट वा पाटा हो, जसले चिप्लिनबाट जोगाउँछ र भुइँको रक्षा गर्छ, त्यसैले यो सही विवरण हो। ✓\n③ 띠장 भनेको तेर्सो बीम हो, यो भुइँमा ओछ्याउने पाटा होइन। ✗\n④ 면적 भनेको क्षेत्रफल हो, यो कुनै ओछ्याउने सामग्री होइन। ✗"}, {"n": "486", "q": "구조물의 강도를 보강하거나 외부 충격을 분산시키기 위해 설치하는 가로막대 또는 지지재입니다. 선박이나 건설 구조물에서 자주 사용되며, 안정성과 내구성을 높이는 역할을 합니다.", "options": ["기둥", "깔판", "띠장", "장선"], "answer": 2, "explain": "प्रश्नको अर्थ: यो कुनै बनावट वा संरचनालाई ढल्न नदिन र अझ बलियो बनाउन तेर्सो पारिने काठ वा फलामको बार हो। यसले बाहिरी धक्कालाई थाम्ने काम गर्छ।\n① 기둥 भनेको खम्भा हो, यो ठाडो भार थाम्न प्रयोग हुन्छ र वर्णन गरिएको तेर्सो बार होइन। ✗\n② 깔판 भनेको भुइँमा राख्ने फट्टा वा म्याट हो, यो बलियो बनाउने तेर्सो बार वा सपोर्ट होइन। ✗\n③ 띠장 भनेको संरचनाको बलियोपन बढाउन वा बाह्य धक्का छर्रन राखिने तेर्सो बार वा सपोर्ट हो ✓\n④ 장선 भनेको ढलान वा फ्लोर जोइस्ट हो, यो मुख्यतया फ्लोरको भार थाम्न हुन्छ। ✗"}, {"n": "487", "q": "선박의 뼈대를 이루는 구조 부재로, 바닥(갑판)을 지지하기 위해 가로 방향으로 설치됩니다. 선체의 강도를 높이고, 갑판 하중을 고르게 분산시키는 역할을 합니다.", "options": ["가세", "난간", "균열", "장선"], "answer": 3, "explain": "प्रश्नको अर्थ: यो पानीजहाजको भुइँलाई थाम्ने र जहाजको ढाँचालाई बलियो बनाउन तेर्सो गरी राखिने मुख्य भाग हो। यसले जहाजको तौललाई बराबर बाँड्न मद्दत गर्छ।\n① 가세 भनेको छड्के टेको (ब्रेस) हो, यो तेर्सो दिशामा राखिने डेक सपोर्ट होइन। ✗\n② 난간 भनेको रेलिङ हो, यो सुरक्षाका लागि छेउमा राखिन्छ। ✗\n③ 균열 भनेको चिरा वा धाँजा (क्र्याक) हो, यो संरचनात्मक भाग होइन। ✗\n④ 장선 भनेको जहाज वा निर्माणमा भुइँ वा डेकलाई टेवा दिन तेर्सो दिशामा राख지는 स्ट्रक्चरल मेम्बर हो ✓"}, {"n": "488", "q": "구조물의 강도를 보강하기 위해 설치하는 보조 부재입니다. 선박에서는 장선이나 기둥 등이 받는 힘을 분산시키고 구조적 안정성을 높이기 위해 사용됩니다.", "options": ["가세", "깔판", "띠장", "면적"], "answer": 0, "explain": "प्रश्नको अर्थ: यो खम्बा वा संरचनालाई थप मजबुत बनाउन छड्के वा सहायताको रूपमा राखिने बलियो साधन हो। यसले बनावटको सन्तुलन कायम राख्न सहयोग गर्छ।\n① 가세 भनेको संरचनाको शक्ति बढाउन राखिने सहायक सदस्य वा छड्के टेको (ब्रेस) हो ✓\n② 깔판 भनेको आधारमा राखिने फट्टा वा म्याट हो। ✗\n③ 띠장 भनेको तेर्सो बार हो। ✗\n④ 면적 भनेको क्षेत्रफल हो। ✗"}, {"n": "489", "q": "재배할 때, 외부 환경(온도, 습도, 바람 등)으로부터 보호하기 위해 비닐을 씌워 만든 임시 또는 반영구적인 구조물입니다.", "options": ["비닐하우스", "울타리망", "방열복", "차광막"], "answer": 0, "explain": "प्रश्नको अर्थ: यो बिरुवा वा तरकारीलाई जाडो, हावा र पानीबाट जोगाउन प्लास्टिकले ढाकेर बनाइएको संरचना हो। यसभित्र कृषिका लागि उपयुक्त वातावरण तयार गरिन्छ।\n① 비닐하우스 भनेको बिरुवा खेती गर्दा बाह्य वातावरणबाट बचाउन प्लास्टिकले छोपेर बनाइएको संरचना हो ✓\n② 울타리망 भनेको बार वा जाली हो। ✗\n③ 방열복 भनेको तातोबाट बचाउने पोसाक हो। ✗\n④ 차광막 भनेको घाम छेक्ने जाली हो। ✗"}, {"n": "490", "q": "구조물이나 장비를 안정적으로 버티고 지탱하기 위해 설치하는 부재입니다. 선박에서는 장비 고정, 작업 안정, 구조물 보강 등 다양한 용도로 사용됩니다.", "options": ["지지대", "대각선", "구조물", "중앙부"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कुनै सामान वा संरचनालाई नढल्ने गरी अड्याउन र सहारा दिन प्रयोग गरिने साधन हो। यसले मेसिन वा बनावटलाई एकै ठाउँमा स्थिर राख्छ।\n① 지지대 भनेको संरचना वा उपकरणलाई स्थिर रूपमा थाम्न राखिने टेको वा सपोर्ट हो ✓\n② 대각선 भनेको कर्णाकार वा छड्के रेखा हो। ✗\n③ 구조물 भनेको संरचना हो। ✗\n④ 중앙부 भनेको केन्द्रीय भाग हो। ✗"}, {"n": "491", "q": "땅속에서 캐내는 소중한 자원으로, 암석이나 금속처럼 쓸모 있는 것입니다. 예를 들면 철, 금, 석탄 같은 것이 있고, 이것들은 공장이나 건설, 전기 만들기에 쓰입니다.", "options": ["삼림 보호", "광물 자원", "온실 가스", "천연자원"], "answer": 1, "explain": "प्रश्नको अर्थ: यो जमिनमुनिबाट खनेर निकालिने फलाम, सुन वा कोइला जस्ता बहुमूल्य प्राकृतिक वस्तु हो। यसलाई कारखाना र निर्माण कार्यमा व्यापक रूपमा प्रयोग गरिन्छ।\n① 삼림 보호 भनेको जङ्गल संरक्षण हो। ✗\n② 광물 자원 भनेको खनिज साधन हो, जुन जमिनमुनिबाट निकालिने फलाम, सुन, कोइला जस्ता उपयोगी वस्तु हुन् ✓\n③ 온실 가스 भनेको हरितगृह ग्यास हो। ✗\n④ 천연자원 भनेको प्राकृतिक स्रोत हो (यो अलि फराकिलो अर्थ हुन्छ तर खनिजलाई विशेष रूपमा 광물 자원 भनिन्छ)। ✗"}, {"n": "492", "q": "갱도의 입구로, 즉 땅속으로 들어가는 통로나 문을 말합니다. 작업자나 장비가 드나들고, 공기가 드나드는 중요한 장소입니다.", "options": ["광부", "수갱", "갱구", "갱도"], "answer": 2, "explain": "प्रश्नको अर्थ: यो जमिनमुनिको खानीभित्र छिर्ने वा बाहिर निस्कने मुख्य ढोका वा बाटो हो। यहाँबाट कामदार, मेसिन र हावा आउने-जाने गर्छ।\n① 광부 भनेको खानी मजदुर हो। ✗\n② 수갱 भनेको ठाडो सुरुङ हो। ✗\n③ 갱구 भनेको सुरुङको मुख वा प्रवेशद्वार हो, जहाँबाट मानिस, उपकरण र हावा आवतजावत गर्छ ✓\n④ 갱도 भनेको सुरुङ हो। ✗"}, {"n": "493", "q": "지하에서 물을 퍼내거나, 지하수를 채굴하기 위해 파는 구멍이나 갱도를 말합니다. 주로 광산이나 건설 현장에서 지하수 문제를 해결하기 위해 사용됩니다.", "options": ["사갱", "수갱", "갱구", "광차"], "answer": 1, "explain": "प्रश्नको अर्थ: यो जमिनमुनिको पानी बाहिर फाल्न वा पानी निकाल्न खनिएको विशेष खाल्डो वा सुरुङ हो। यसले ख const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-10';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Renders the explanation as a structured list: the explanation string is
// lines separated by "\n" — first line is the question's own meaning
// ("प्रश्नको अर्थ: ..."), then one line per option ("① <word> ... ✓/✗").
// Lines render as separate rows; the ✓ line gets a green tint and the ✓/✗
// marker is coloured. Explanations without line breaks (fallback prose)
// render as a single paragraph, exactly as before. Uses text nodes only,
// never innerHTML, so explanation text is never parsed as markup.
function renderExplain(box, explain) {
  const lines = (explain || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length <= 1) {
    const b = document.createElement('b');
    b.textContent = 'किन? ';
    box.appendChild(b);
    const s = document.createElement('span');
    s.textContent = explain;
    box.appendChild(s);
    return;
  }
  const label = document.createElement('div');
  label.className = 'explain-label';
  label.textContent = 'व्याख्या';
  box.appendChild(label);
  lines.forEach((ln, li) => {
    const d = document.createElement('div');
    if (li === 0 && ln.indexOf('प्रश्नको अर्थ') === 0) {
      d.className = 'explain-stem';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    if (ln.indexOf('शिक्षकको उत्तर-पत्र:') === 0) {
      d.className = 'exp-note';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    const mark = ln.endsWith('✓') ? '✓' : (ln.endsWith('✗') ? '✗' : '');
    const body = mark ? ln.slice(0, -1).trim() : ln;
    d.className = 'exp-line' + (mark === '✓' ? ' exp-ok' : '');
    d.appendChild(document.createTextNode(body + (mark ? ' ' : '')));
    if (mark) {
      const m = document.createElement('span');
      m.className = 'exp-mark ' + (mark === '✓' ? 'ok' : 'no');
      m.textContent = mark;
      d.appendChild(m);
    }
    box.appendChild(d);
  });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    renderExplain(card.querySelector('.explain'), q.explain);
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
