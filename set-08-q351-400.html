<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>EPS-TOPIK Vocabulary Quiz — Set 08 (Q351–Q400)</title>
<style>
  :root {
    --primary: #a78bfa;
    --primary-dark: #c4b5fd;
    --primary-soft: rgba(124,58,237,.22);
    --accent: #6366f1;
    --accent-soft: rgba(99,102,241,.18);
    --green: #34d399;
    --green-bg: rgba(16,185,129,.16);
    --red: #fb7185;
    --red-bg: rgba(244,63,94,.14);
    --bg: #0b0b16;
    --card: #171725;
    --text: #f2f1fa;
    --muted: #9d9db4;
    --border: rgba(255,255,255,.09);
    --shadow: 0 2px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans KR", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(700px 340px at 50% -5%, rgba(99,102,241,.14), transparent 60%); background-attachment: fixed; color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); color: #d6c9ff; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,.12); margin-bottom: 14px; transition: all .15s; }
  .back-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  header { background: #312e81; color: #fff; padding: 20px 16px 16px; position: relative; border-bottom: 1px solid rgba(255,255,255,.1); box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.4rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  header p { opacity: .92; font-size: .9rem; margin-top: 4px; }
  .progress-wrap { margin-top: 14px; background: rgba(0,0,0,.35); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .progress-bar { height: 100%; background: #a5b4fc; width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(165,180,252,.6); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { position: relative; background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; background: #6366f1; border-radius: 0 0 6px 6px; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: rgba(167,139,250,.55); }
  .q-card.answered::after { content: "✓"; position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: #059669; color: #fff; font-weight: 800; font-size: .95rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .q-num { display: inline-block; font-size: .92rem; font-weight: 800; color: #fff; background: #4f46e5; padding: 7px 18px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(79,70,229,.4); }
  .q-text { font-size: 1.16rem; white-space: pre-line; margin: 14px 0 18px; line-height: 1.85; font-weight: 500; color: #f2f1fa; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 16px 18px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid rgba(255,255,255,.09); border-radius: 14px; margin-bottom: 0; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #1e1e30; color: #f2f1fa; }
  .options label:hover { border-color: #8b5cf6; background: #232338; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,.3); }
  .options label::before { content: ""; flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid #7c7ca0; background: transparent; transition: all .15s; }
  .options label.selected { background: var(--accent-soft); border-color: #a78bfa; box-shadow: 0 4px 18px rgba(99,102,241,.4); }
  .options label.selected::before { border-color: #a78bfa; background: #a78bfa; box-shadow: inset 0 0 0 4px #1e1e30; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #a5b4fc; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 700; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .btn-primary { background: #4f46e5; color: #fff; box-shadow: 0 4px 18px rgba(79,70,229,.4); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 8px 24px rgba(79,70,229,.45); }
  .btn-primary:disabled { background: #2a2a3d; color: #77778e; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: rgba(255,255,255,.06); color: #d6c9ff; border: 2px solid rgba(255,255,255,.12); }
  .btn-ghost:hover { border-color: #8b5cf6; background: rgba(124,58,237,.2); }
  .submit-bar { position: sticky; bottom: 0; background: rgba(11,11,22,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 24px rgba(0,0,0,.5); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: #1e1b3a; border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; line-height: 1.05; color: #a5b4fc; }
  .score-card .pct { font-size: 1.15rem; color: #c9c6e0; margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: #e6e4f5; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: #4f46e5; color: #fff; border-color: transparent; box-shadow: 0 2px 12px rgba(79,70,229,.35); }
  .review-card { background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: #059669; }
  .verdict.no { background: #e11d48; }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; background: #1e1e30; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #12101f; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; color: #d9d7ea; }
  .explain b { color: #d6c9ff; }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; }
  .explain-stem { background: rgba(99,102,241,.18); border-left: 4px solid #a78bfa; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; color: #f2f1fa; }
  .exp-line { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.07); line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: #34d399; }
  .exp-mark.no { color: #fb7185; }
  .exp-note { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.4); border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; color: #fde9c8; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }

</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">&larr; Back to All Sets</a>
    <h1>EPS-TOPIK 문제은행 Quiz</h1>
    <p>Set 8 of 12 &bull; Questions 351–400 &bull; 50 questions &bull; EPS-TOPIK Vocabulary &mdash; answers are AI-generated (no answer key in the book) &mdash; check with a teacher &bull; Explanations in Nepali</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

    <div class="autosave-note">Progress will be auto-saved.</div>
  </div>
</header>

<main id="quizView">

    <button class="btn-ghost" id="prevBtn">&larr; Previous</button>
    <span class="page-info" id="pageInfo"></span>
    <button class="btn-ghost" id="nextBtn">Next &rarr;</button>
  </div>
</main>

<div class="submit-bar" id="submitBar">
  <div class="inner">
    <span class="hint" id="submitHint">Answer all 50, then submit.</span>
    <div style="display:flex; gap:8px; flex:none;">
      <button class="btn-ghost" id="clearBtn" style="padding:11px 16px;">Clear all</button>
      <button class="btn-primary" id="submitBtn">Submit Quiz</button>
    </div>
  </div>
</div>

<main id="resultView" class="hidden">
  <div class="score-card">
    <div class="big" id="scoreBig"></div>
    <div class="pct" id="scorePct"></div>
    <div class="msg" id="scoreMsg"></div>
    <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-primary" id="retryBtn">Try Again</button>
      <button class="btn-ghost" id="reviewTopBtn">Back to top</button>
    </div>
  </div>
  <div class="filters">
    <button class="btn-ghost active" data-filter="all">All questions</button>
    <button class="btn-ghost" data-filter="wrong">Wrong only</button>
    <button class="btn-ghost" data-filter="correct">Correct only</button>
  </div>
  <div id="reviewList"></div>
</main>

<script>
const QUESTIONS = [{"n": "351", "q": "볼트나 나사를 돌릴 때 사용하는 L 자 모양의 공구입니다. 작고 간단한 구조로 기계 조립이나 가구 조립에 자주 쓰입니다.", "options": ["전기 드릴", "판금 가위", "유각 렌치", "파이프 렌치"], "answer": 2, "explain": "प्रश्नको अर्थ: यो बोल्ट र पेच घुमाउनका लागि प्रयोग गरिने सानो औजार हो। मेसिन तथा फर्निचरका सामानहरू जोड्ने काममा यसको धेरै प्रयोग हुन्छ।\n① 전기 드릴 भनेको बिजुलीबाट चल्ने प्वाल पार्ने औजार हो, त्यसैले यो एल-आकारको औजार होइन। ✗\n② 판금 가위 भनेको पाता काट्ने कैँची हो, त्यसैले यो नट-बोल्ट घुमाउने औजार होइन। ✗\n③ 유각 렌치 भनेको एल-आकारको हेक्स रेन्च हो, जुन नट वा स्क्रू घुमाउन र फर्निचर वा मेसिन जोड्न प्रयोग गरिन्छ। ✓\n④ 파이프 렌치 भनेको पाइप समात्ने र घुमाउने रेन्च हो, त्यसैले यो एल-आकारको सानो औजार होइन। ✗"}, {"n": "352", "q": "점이 없는 나사 모양의 금속 물체로 너트를 사용하여 물건을 고정 시킵니다.", "options": ["볼트", "줄", "비트", "못"], "answer": 0, "explain": "प्रश्नको अर्थ: तिखो टुप्पो नभएको पेच जस्तै धातुको वस्तु हो, जसलाई नटसँग जोडेर सामानलाई बलियो गरी अड्काइन्छ।\n① 볼트 भनेको टाउकोमा बिन्दु नभएको र नटसँग प्रयोग हुने धातुको वस्तु हो ✓\n② 줄 भनेको फाइल (घोट्ने औजार) हो ✗\n③ 비트 भनेको ड्रिलको बिट हो ✗\n④ 못 भनेको किला हो ✗"}, {"n": "353", "q": "머리에는 드라이버로 돌릴 수 있도록 홈이 나 있는 못입니다. 보통 목재나 얇은 금속류 등을 접합시킬 때 사용합니다.", "options": ["용접봉", "나사못", "절곡기", "바이스"], "answer": 1, "explain": "प्रश्नको अर्थ: टाउकोमा पेचकसले घुमाउन मिल्ने धर्का भएको काँटी हो। काठ वा पातलो धातुलाई आपसमा जोड्न यसको प्रयोग गरिन्छ।\n① 용접봉 भनेको वेल्डिंग रड हो ✗\n② 나사못 भनेको स्क्रू नट (स्लाट भएको काठ वा धातुमा कस्ने किला) हो ✓\n③ 절곡기 भनेको पाता वा पाना झुकाउने मेसिन हो ✗\n④ 바이스 भनेको भाइस (पकड्ने औजार) हो ✗"}, {"n": "354", "q": "볼트와 함께 사용되어 부품을 단단히 고정하는 데 쓰입니다. 보통 금속으로 된 육각형 모양이며, 내부에 나사산이 있습니다.", "options": ["토치", "너트", "볼트", "리머"], "answer": 1, "explain": "प्रश्नको अर्थ: बोल्टसँगै प्रयोग गरेर सामानहरूलाई कस्ने धातुको वस्तु हो। यो प्रायः छ वटा पाना भएको आकारको हुन्छ र भित्र धर्काहरू हुन्छन्।\n① 토치 भनेको टर्च (वेल्डिंग वा तताउने औजार) हो ✗\n② 너트 भनेको बोल्टसँग प्रयोग हुने छकुने भाग भएको नट हो ✓\n③ 볼트 भनेको बोल्ट हो ✗\n④ 리머 भनेको प्वाल सफा गर्ने वा बढाउने औजार रीमर हो ✗"}, {"n": "355", "q": "나사를 조이거나 풀 때 사용하는 수공구입니다. 끝의 모양은 평평하고 마이너스 기호처럼 생기며, 손잡이가 달려 있습니다.", "options": ["일자 드라이버", "십자 드라이버", "금긋기 바늘", "전자 저울"], "answer": 0, "explain": "प्रश्नको अर्थ: पेचहरू कस्न वा फुकाउन प्रयोग गरिने हात औजार हो। यसको टुप्पो च्याप्टो र माइनस चिन्ह जस्तो आकारको हुन्छ।\n① 일자 드라이버 भनेको माइनस (-) चिन्ह जस्तो चप्टो मुख भएको स्क्रू ड्राइभर हो ✓\n② 십자 드라이버 भनेको प्लस (+) चिन्ह जस्तो मुख भएको स्क्रू ड्राइभर हो ✗\n③ 금긋기 바늘 भनेको रेखा कोर्ने सुई हो ✗\n④ 전자 저울 भनेको इलेक्ट्रोनिक तराजु हो ✗"}, {"n": "356", "q": "나사를 조이거나 풀 때 사용하는 공구입니다. 끝이 +자 형태이며, 손잡이가 달린 막대 모양입니다.", "options": ["일자 드라이버", "십자 드라이버", "배식대", "방청지"], "answer": 1, "explain": "प्रश्नको अर्थ: पेचहरू घुमाएर कस्न वा फुकाउन प्रयोग गरिने औजार हो। यसको टुप्पो प्लस चिन्ह जस्तो चारकुने आकारको हुन्छ।\n① 일자 드라이버 भनेको माइनस मुख भएको स्क्रू ड्राइभर हो ✗\n② 십자 드라이버 भनेको प्लस (+) आकारको मुख भएको स्क्रू ड्राइभर हो ✓\n③ 배식대 भनेको खाना वितरण गर्ने टेबल हो ✗\n④ 방청지 भनेको खिया लाग्नबाट बचाउने कागज हो ✗"}, {"n": "357", "q": "회전하는 부품이 매끄럽게 움직이도록 도와주는 부품입니다. 보통 둥근 링 안에 작은 강철 볼이 들어 있는 원형 모양입니다.", "options": ["바이스", "베어링", "수준기", "플라이어"], "answer": 1, "explain": "प्रश्नको अर्थ: घुम्ने पाटपुर्जाहरूलाई चिल्लो र सजिलैसँग घुम्न मद्दत गर्ने भाग हो। यसको गोलो रिङभित्र साना फलामका डल्लाहरू हुन्छन्।\n① 바이스 भनेको च्याप्प समात्ने भाइस औजार हो ✗\n② 베어링 भनेको घुम्ने भागहरू सहजै चल्न मद्दत गर्ने बियरिङ हो ✓\n③ 수준기 भनेको स्पिरिट लेभल (तेर्सो जाँच्ने औजार) हो ✗\n④ 플라이어 भनेको प्लायर्स हो ✗"}, {"n": "358", "q": "회전력을 전달하거나 속도와 방향을 조절할 때 사용하는 부품입니다. 테두리에 톱니가 있는 둥근 모양입니다.", "options": ["줄", "톱", "기어", "축"], "answer": 2, "explain": "प्रश्नको अर्थ: घुम्ने शक्तिलाई अरू ठाउँमा पठाउन वा गति मिलाउन प्रयोग गरिने भाग हो। यसको वरिपरि ससाना दाँतहरू हुन्छन्।\n① 줄 भनेको फाइल (घोट्ने औजार) हो ✗\n② 톱 भनेको आरा हो ✗\n③ 기어 भनेको दाँत भएको गोलो आकारको गिअर हो जसले शक्ति र गति सार्छ ✓\n④ 축 भनेको अक्ष (साफ्ट) हो ✗"}, {"n": "359", "q": "충격을 줄이거나 힘을 저장하는 데 쓰는 나선 모양으로 감긴 탄성 있는 금속입니다.", "options": ["접시 저울", "일자 드라이버", "코일 스프링", "유각 렌치"], "answer": 2, "explain": "प्रश्नको अर्थ: धक्का वा झट्का कम गर्न प्रयोग गरिने घुमाउरो धातुको सामान हो। यसलाई थिच्दा दबिने र छोड्दा पहिलेकै ठाउँमा आउने गुण हुन्छ।\n① 접시 저울 भनेको थाल भएको तराजु हो, त्यसैले यो लचकदार घुमाउरो धातु होइन। ✗\n② 일자 드라이버 भनेको माइनस पेचकस हो, त्यसैले यो धक्का सोस्ने स्प्रिङ होइन। ✗\n③ 코일 스프링 भनेको घुमाउरो बेरिएको स्प्रिङ हो, जसले धक्का कम गर्न र शक्ति सञ्चय गर्न काम गर्छ। ✓\n④ 유각 렌치 भनेको एल-आकारको रेन्च हो, त्यसैले यो स्प्रिङसँग मिल्दैन। ✗"}, {"n": "360", "q": "기계 부품을 안전하고 쉽게 빼낼 때 사용하는 도구로, 유압의 힘을 이용해 베어링이나 기어 등을 분해합니다. 세 개의 갈고리와 손잡이 레버가 달려 있어 작동이 간편합니다.", "options": ["기어", "너트", "볼트", "풀러"], "answer": 3, "explain": "प्रश्नको अर्थ: मेसिनका पाटपुर्जाहरूलाई सुरक्षितसाथ बाहिर निकाल्न प्रयोग गरिने औजार हो। यसमा भएका समात्ने हातहरूले घुम्ने भागहरूलाई सजिलै छुट्याउँछ।\n① 기어 भनेको गिअर हो ✗\n② 너트 भनेको नट हो ✗\n③ 볼트 भनेको बोल्ट हो ✗\n④ 풀러 भनेको बियरिङ वा गिअर सजिलै झिक्ने पुलर औजार हो ✓"}, {"n": "361", "q": "바닥이나 물건이 평평한지 또는 곧은지 보는 도구입니다. 안에 있는 작은 물방울이 가운데에 오면 수평이나 수직이 맞습니다.", "options": ["바이스", "베어링", "나사못", "수준기"], "answer": 3, "explain": "प्रश्नको अर्थ: यो कुनै सतह वा सामान समतल र सिधा छ कि छैन भनेर जाँच्ने औजार हो। यसभित्र भएको सानो पानीको थोपा बिचमा आउँदा तेर्सो वा ठाडो मिलेको थाहा हुन्छ।\n① 바이스 भनेको भाइस हो ✗\n② 베어링 भनेको बियरिङ हो ✗\n③ 나사못 भनेको स्क्रू हो ✗\n④ 수준기 भनेको सतह मिलेको नमिलेको जाँच्ने स्पिरिट लेभल हो ✓"}, {"n": "362", "q": "쇠붙이(철)를 끌어당기는 도구입니다. 이것을 가까이 대면 못이나 클립 같은 쇠가 붙습니다.", "options": ["펜치", "망치", "자석", "자재"], "answer": 2, "explain": "प्रश्नको अर्थ: यो फलामका वस्तुहरूलाई आफूतिर तान्ने औजार हो। यसको नजिक काँटी वा क्लिप जस्ता फलामका सामान ल्याउँदा ती टाँसिन्छन्।\n① 펜치 भनेको चिम्टा वा प्लायर्स हो ✗\n② 망치 भनेको हथौडा हो ✗\n③ 자석 भनेको फलाम तान्ने चुम्बक हो ✓\n④ 자재 भनेको निर्माण सामग्री हो ✗"}, {"n": "363", "q": "물체가 돌 때 중심이 되는 선이나 막대입니다. 바퀴나 선풍기처럼 도는 물건은 이것을 중심으로 돕니다.", "options": ["축", "줄", "톱", "칼"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कुनै वस्तु घुम्दा बिचमा रहने मुख्य रेखा वा डन्डा हो। पाङ्ग्रा वा पङ्खा जस्ता घुम्ने वस्तुहरू यसैलाई केन्द्र बनाएर घुम्छन्।\n① 축 भनेको कुनै वस्तु घुम्दा केन्द्र हुने अक्ष वा साफ्ट हो ✓\n② 줄 भनेको फाइल हो ✗\n③ 톱 भनेको आरा हो ✗\n④ 칼 भनेको चक्कु हो ✗"}, {"n": "364", "q": "환경을 덜 오염시키는 자동차로 보통 전기차, 수소차, 하 이브리드차가 있습니다. 매연이 적거나 없어서 공기를 깨끗하게 합니다.", "options": ["친환경 자동차", "친환경 에너지", "친환경 건물", "친환경 농업"], "answer": 0, "explain": "प्रश्नको अर्थ: यो वातावरणलाई कम प्रदूषण गर्ने गाडी हो जसमा बिजुली वा हाइड्रोजनबाट चल्ने कारहरू पर्छन्। यसले धुवाँ कम वा पटक्कै ननिकाल्ने भएकाले हवा सफा राख्छ।\n① 친환경 자동차 भनेको वातावरणमैत्री गाडी (विद्युतीय वा हाइड्रोजन गाडी) हो ✓\n② 친환경 에너지 भनेको वातावरणमैत्री ऊर्जा हो ✗\n③ 친환경 건물 भनेको वातावरणमैत्री भवन हो ✗\n④ 친환경 농업 भनेको वातावरणमैत्री कृषि हो ✗"}, {"n": "365", "q": "쇠, 철 따위를 자르거나, 깎거나, 모양을 바꾸는 일을 의미하며 이렇게 해서 기계 부품이나 물건을 만듭니다.", "options": ["금속 염색", "금속 가공", "금속 판매", "금속 채굴"], "answer": 1, "explain": "प्रश्नको अर्थ: यो फलाम वा धातुलाई काट्ने, ताछ्ने वा आकार परिवर्तन गर्ने काम हो। यसरी मसिनका पार्टपुर्जा वा विभिन्न सामानहरू बनाइन्छ।\n① 금속 염색 भनेको धातु रङ्गाउने काम हो ✗\n② 금속 가공 भनेको धातुलाई काटेर, कुटेर वा आकार दिएर वस्तु बनाउने मेटल प्रोसेसिङ (धातु प्रशोधन) हो ✓\n③ 금속 판매 भनेको धातु बिक्री गर्ने काम हो ✗\n④ 금속 채굴 भनेको धातु खानीबाट निकाल्ने काम हो ✗"}, {"n": "366", "q": "무언가를 두드리거나 박을 때 쓰는 도구로 보통 손잡이가 있고, 끝에 무거운 쇠 부분이 있습니다.", "options": ["펜치", "드릴", "망치", "볼트"], "answer": 2, "explain": "प्रश्नको अर्थ: यो कुनै कुरा ठोक्न वा काँटी गाड्न प्रयोग गरिने औजार हो। यसको समात्ने बिँड हुन्छ र टुप्पामा गह्रौँ फलामको भाग हुन्छ।\n① 펜치 (पेन्च) हो, यो तार काट्न वा समात्न प्रयोग गरिन्छ तर यसमा हत्था र भारी फलामको भाग हुँदैन ✗\n② 드릴 (ड्रिल) हो, यो प्वाल पार्ने औजार हो ✗\n③ 망치 (हथौडा) हो, यो कुनै वस्तु ठोक्न वा गाड्न प्रयोग गरिने हत्था भएको र छेउमा भारी फलामको भाग भएको औजार हो ✓\n④ 볼트 (बोल्ट) हो, यो कस्ने वस्तु हो ✗"}, {"n": "367", "q": "금속이나 나무 등을 갈아서 모양을 다듬는 도구인데 작고 거친 날이 있어서 표면을 매끄럽게 만들거나 깎을 때 씁니다.", "options": ["칼", "축", "줄", "톱"], "answer": 2, "explain": "प्रश्नको अर्थ: यो धातु वा काठलाई खिपेर आकार मिलाउन प्रयोग गरिने औजार हो। यसमा साना र खस्रा धारहरू हुने भएकाले सतहलाई चिल्लो पार्न वा काट्न प्रयोग गरिन्छ।\n① 칼 भनेको चाकु हो, यसले काट्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 축 भनेको धुरी हो, यसले घुम्ने भागलाई अड्याउँछ त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 줄 भनेको रेती हो, यसले धातु वा काठलाई घसेर चिल्लो बनाउने वा आकार मिलाउने औजार भएकाले यो विवरणसँग एकदम मिल्छ। ✓\n④ 톱 भनेको करौँती हो, यसले काठ वा धातु काट्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "368", "q": "돌이나 쇠를 깎거나 깨뜨릴 때 쓰는 뾰족한 쇠 도구입니다. 보통 망치로 정을 쳐서 금속이나 돌을 자르거나 구멍을 낼 때 사용해요.", "options": ["축", "톱", "못", "정"], "answer": 3, "explain": "प्रश्नको अर्थ: यो ढुङ्गा वा फलाम ताछ्न र फुटाउन प्रयोग गरिने तिखो फलामको औजार हो। प्रायः हथौडाले हानेर धातु वा ढुङ्गा काट्न र दुलो पार्न यसको प्रयोग गरिन्छ।\n① 축 (अक्स) हो, यो मिल्दैन। ✗\n② 톱 (आरा) हो, यो काठ काट्ने औजार हो ✗\n③ 못 (किला) हो, यो ठोक्ने वस्तु हो ✗\n④ 정 (छिनो) हो, यो ढुङ्गा वा फलाम काट्न वा फुटाउन प्रयोग हुने तिखो फलामको औजार हो जसलाई हथौडाले हानेर प्रयोग गरिन्छ ✓"}, {"n": "369", "q": "구멍을 넓히거나 매끄럽게 다듬는 도구로 보통 기계 부품에 뚫린 구멍을 정확한 크기와 모양으로 정리할 때 사용합니다.", "options": ["쇠톱", "너트", "니퍼", "리머"], "answer": 3, "explain": "प्रश्नको अर्थ: यो मसिनका सामानमा पारिएका दुलोहरूलाई अझ फराकिलो वा चिल्लो पार्न प्रयोग गरिने औजार हो। यसले दुलोलाई एकदम सही आकार र साइजमा मिलाउन मद्दत गर्छ।\n① 쇠톱 (ह्याकस’) हो, यो फलाम काट्ने आरा हो ✗\n② 너트 (नट) हो, यो बोल्टसँग कस्ने वस्तु हो ✗\n③ 니퍼 (निप्पर) हो, यो तार काट्ने चिम्टाजस्तो औजार हो ✗\n④ 리머 (रीमर) हो, यो प्वाललाई फराकिलो वा चिल्लो पार्न मेसिनको भागमा प्रयोग गरिने औजार हो ✓"}, {"n": "370", "q": "함께 움직일 수 있는 두 개의 금속 블록이 있는 공구, 작업이 완료되는 동안 물건을 단단히 고정할 때 사용됩니다.", "options": ["바이스", "망치", "쇠지래", "괭이"], "answer": 0, "explain": "प्रश्नको अर्थ: यो दुईवटा फलामका खण्डहरू भएको औजार हो जसले काम गर्दा सामानलाई हलचल नगर्ने गरी कडासँग समातेर राख्छ।\n① 바이스 (भाइस) हो, यो सँगै चल्न सक्ने दुईवटा फलामको ब्लक हुने र काम गर्ने बेला वस्तुलाई दह्रोसँग च्यापेर राख्ने औजार हो ✓\n② 망치 (हथौडा) हो, यो ठोक्ने औजार हो ✗\n③ 쇠지래 (फलामको लिभर) हो, यो उचाल्ने वा भत्काउने औजार हो ✗\n④ 괭이 (कुटो) हो, यो खन्ने कृषियन्त्र हो त्यसैले यो मिल्दैन। तेस्रो विकल्प '쇠지래' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "371", "q": "두꺼운 금속판을 자를 때 사용하는 특수한 가위입니다. 강한 날카로운 칼날로 금속을 정확하게 자를 수 있습니다.", "options": ["용접봉", "유각 렌치", "전기 절단기", "판금 가위"], "answer": 3, "explain": "प्रश्नको अर्थ: यो बाक्लो धातुको पाता काट्न प्रयोग गरिने विशेष प्रकारको कैँची हो। यसको तिखो धारले फलामको पातालाई सजिलै काट्न सकिन्छ।\n① 용접봉 (वेल्डिंग रड) हो, यो वेल्डिंग गर्दा प्रयोग हुने छड हो ✗\n② 유각 렌치 (हेक्स रेन्च) हो, यो बोल्ट कस्ने औजार हो ✗\n③ 전기 절단기 (विद्युतीय काट्ने मेसिन) हो, यो समग्रमा काट्ने मेसिन हो ✗\n④ 판금 가위 (पाना काट्ने काइँची/मेटल शियर) हो, यो बाक्लो फलामको पट्टा वा पाना काट्न प्रयोग हुने धारिलो विशेष किसिमको काइँची हो ✓"}, {"n": "372", "q": "나무나 금속 재료를 일정한 사이즈나 두께의 조각으로 자르는 장치입니다.", "options": ["밴딩기", "절단기", "용접기", "정수기"], "answer": 1, "explain": "प्रश्नको अर्थ: यो काठ वा धातुका सामानहरूलाई तोकिएको आकार वा बाक्लोपनामा टुक्रा पार्न काट्ने मसिन हो।\n① 밴딩기 (बेन्डिङ मेसिन) हो, यो बेन्ड गर्ने मेसिन हो ✗\n② 절단기 (कटर/काट्ने मेसिन) हो, यो काठ वा धातुका सामाग्रीलाई निश्चित साइज वा मोटाइको टुक्रामा काट्ने मेसिन वा उपकरण हो ✓\n③ 용접기 (वेल्डिंग मेसिन) हो, यो जोड्ने मेसिन हो ✗\n④ 정수기 (पानी शुद्ध पार्ने मेसिन) हो, यो पिउने पानी सफा गर्ने मेसिन हो ✗"}, {"n": "373", "q": "집이나 사무실에서 빗자루를 사용하여 먼지나 쓰레기를 쓸어 담는 도구입니다.", "options": ["먼지털이", "쓰레받기", "청소함", "공구함"], "answer": 1, "explain": "प्रश्नको अर्थ: यो घर वा कार्यालयमा कुचोले बढाारेको धूलो र फोहर उठाएर राख्न प्रयोग गरिने औजार हो।\n① 먼지털이 (धुलो टार्ने कुचो) हो, यो धुलो टार्ने साधन हो ✗\n② 쓰레받기 (डस्टबिन/फोहोर उठ्ने सूप) हो, यो घर वा कार्यालयमा कुचो प्रयोग गरेर धुलो वा फोहोर बटुलि राख्ने वा उठाउने औजार हो ✓\n③ 청소함 (सरसफाइ बाकस) हो, यो सरसफाइका सामान राख्ने ठाउँ हो ✗\n④ 공구함 (औजार बाकस) हो, यो औजार राख्ने बक्स हो ✗"}, {"n": "374", "q": "화재 발생시 손으로 들고 가서 불을 끌 수 있는 이동식 도구입니다. 대개 복도나 작업장 벽에 둡니다.", "options": ["구급함", "공구함", "소화기", "소화전"], "answer": 2, "explain": "प्रश्नको अर्थ: यो आगो लाग्दा हातले बोकेर लगेर आगो निभाउन सकिने औजार हो। यसलाई प्रायः कोठा वा काम गर्ने ठाउँको भित्तामा राखिन्छ।\n① 구급함 (औषधि बाकस) हो, यो प्राथमिक उपचारको बक्स हो ✗\n② 공구함 (औजार बाकस) हो, यो औजार राख्ने बक्स हो ✗\n③ 소화기 (अग्नििनवारक यन्त्र) हो, यो आगलागी हुँदा हातले समातेर आगो निभाउन लैजान सकिने र करिडोर वा कार्यक्षेत्रको भित्तामा राखिने मोबाइल उपकरण हो ✓\n④ 소화전 (फायर हाइड्रन्ट) हो, यो भित्तामा जडान गरिएको पानी आउने धारा हो ✗"}, {"n": "375", "q": "기계나 장비의 작동 상태를 바꾸거나 맞추는 장치입니다. 예를 들어, 용접에서는 전류나 압력을 알맞게 설정하는 데 사용됩니다.", "options": ["세탁기", "계산기", "조절기", "소화기"], "answer": 2, "explain": "प्रश्नको अर्थ: यो मसिन वा उपकरणको काम गर्ने अवस्था मिलाउन वा परिवर्तन गर्न प्रयोग गरिने यन्त्र हो। यसले बिजुलीको प्रवाह वा चापलाई उपयुक्त स्तरमा मिलाउँछ।\n① 세탁기 (वाशिङ मेसिन) हो, यो लुगा धुने मेसिन हो ✗\n② 계산기 (क्यालकुलेटर) हो, यो हिसाब गर्ने यन्त्र हो ✗\n③ 조절기 (कन्ट्रोलर/नियन्त्रक) हो, यो मेसिन वा उपकरणको सञ्चालन अवस्था परिवर्तन वा मिलाउने यन्त्र हो जसले करेन्ट वा चाप मिलाउन मद्दत गर्छ ✓\n④ 소화기 (अग्निनवारक यन्त्र) हो, यो आगो निभाउने यन्त्र हो ✗"}, {"n": "376", "q": "금속, 돌, 나무 등의 재료를 갈거나 자르는 데 사용하는 전동 공구입니다. 주로 표면을 매끄럽게 하거나 불필요한 부분을 제거할 때 쓰입니다.", "options": ["절단기", "그라인더", "용접기", "밴딩기"], "answer": 1, "explain": "प्रश्नको अर्थ: यो धातु, ढुङ्गा वा काठ खियाउन र काट्न प्रयोग गरिने बिजुलीबाट चल्ने औजार हो। यसले सतह चिल्लो पार्न वा अनावश्यक भाग हटाउन मद्दत गर्छ।\n① 절단기 (कटर) हो, यो काट्ने मेसिन हो ✗\n② 그라인더 (ग्राइन्डर) हो, यो धातु, ढुङ्गा, काठ आदि सामाग्री घोट्न वा काट्न प्रयोग हुने तथा सतह चिल्लो पार्न वा अनावश्यक भाग हटाउन प्रयोग हुने विद्युतीय औजार हो ✓\n③ 용접기 (वेल्डिंग मेसिन) हो, यो जोड्ने मेसिन हो ✗\n④ 밴딩기 (बेन्डिङ मेसिन) हो, यो बेन्ड गर्ने मेसिन हो ✗"}, {"n": "377", "q": "품질에 문제가 있어 정상적으로 사용할 수 없는 제품을 생산되는 것을 말합니다.", "options": ["원재료", "불량품", "식료품", "생필품"], "answer": 1, "explain": "प्रश्नको अर्थ: यो गुणस्तरमा समस्या भएर सामान्य रूपमा प्रयोग गर्न नमिल्ने गरी बनेका सामानहरूलाई जनाउँछ।\n① 원재료 भनेको काँचो पदार्थ हो, यो सामान बनाउन प्रयोग गरिने सामग्री हो त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 불량품 भनेको खराब सामान हो, गुणस्तरमा समस्या भएर प्रयोग गर्न नसकिने उत्पादन भएकाले यो विवरणसँग एकदम मिल्छ। ✓\n③ 식료품 भनेको खाद्यान्न सामग्री हो, यो खानेकुरा हो त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 생필품 भनेको दैनिक उपभोग्य वस्तु हो, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "378", "q": "제품이나 물건을 만들기 위해 처음에 사용하는 가공되지 않은 기본 재료입니다.", "options": ["원재료", "수준기", "참기름", "밀가루"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कुनै सामान वा वस्तु बनाउनका लागि सुरुमा प्रयोग गरिने प्रशोधन नगरिएको मुख्य कच्चा पदार्थ हो।\n① 원재료 भनेको काँचो पदार्थ हो, यो सामान वा वस्तु बनाउन प्रयोग गरिने आधारभूत सामग्री भएकाले यो विवरणसँग एकदम मिल्छ। ✓\n② 수준기 भनेको सतह तेर्सो छ कि छैन नाप्ने औजार हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 참기름 भनेको तिलको तेल हो, यो खानेकुरा पकाउन प्रयोग गरिने तेल हो त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 밀가루 भनेको गहुँको पिठो हो, यो एउटा खानेकुरा बनाउने सामग्री हो त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "379", "q": "제품을 만들 때 기능을 더하거나 성질을 개선하기 위해 소량 넣는 물질입니다.", "options": ["불량품", "용접봉", "첨가제", "고추장"], "answer": 2, "explain": "प्रश्नको अर्थ: यो सामान बनाउँदा त्यसको गुणस्तर सुधार्न वा थप विशेषता दिनका लागि थोरै मात्रामा मिसाइने पदार्थ हो।\n① 불량품 भनेको खराब सामान हो, बिग्रेको उत्पादनलाई बुझाउने भएकाले यो विवरणसँग मिल्दैन। ✗\n② 용접봉 भनेको वेल्डिङ रड हो, धातु जोड्न प्रयोग गरिने भएकाले यो विवरणसँग मिल्दैन। ✗\n③ 첨가제 भनेको थपिने पदार्थ हो, वस्तुको गुणस्तर वा कार्य सुधार्न थोरै मिसाइने पदार्थ भएकाले यो विवरणसँग एकदम मिल्छ। ✓\n④ 고추장 भनेको खुर्सानीको पेस्ट हो, यो खानेकुरामा हालिने कोरियाली लेदो हो त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "380", "q": "두 가지 이상의 재료를 고르게 섞는 데 사용하는 기계나 장치입니다. 예를 들어, 원재료와 첨가제를 섞어 균일한 혼합물을 만들 때 사용됩니다.", "options": ["청소기", "계산기", "용접기", "혼합기"], "answer": 3, "explain": "प्रश्नको अर्थ: यो दुई वा सोभन्दा बढी पदार्थहरूलाई राम्ररी मिसाउन प्रयोग गरिने मसिन वा उपकरण हो।\n① 청소기 (भ्याकुम क्लिनर) हो, यो सरसफाइ गर्ने मेसिन हो ✗\n② 계산기 (क्यालकुलेटर) हो, यो हिसाब गर्ने यन्त्र हो ✗\n③ 용접기 (वेल्डिंग मेसिन) हो, यो वेल्डिंग गर्ने मेसिन हो ✗\n④ 혼합기 (मिक्सर/मिश्रण गर्ने मेसिन) हो, यो दुई वा बढी सामाग्रीलाई एकनासले मिसाउन प्रयोग गरिने मेसिन वा उपकरण हो जस्तै कच्चा पदार्थ र एडिटीभ मिसाएर एकनासको मिश्रण बनाउन प्रयोग गरिन्छ ✓"}, {"n": "381", "q": "물체의 길이나 높이 등을 재는 도구로, 띠 모양의 눈금이 있는 유연한 재질로 만들어져 있고 건축, 재봉, 일상 생활 등 다양한 곳에서 사용합니다.", "options": ["자", "줄자", "저울", "캘리퍼스"], "answer": 1, "explain": "प्रश्नको अर्थ: यो सामानको लम्बाइ वा उचाइ नाप्न प्रयोग गरिने साधन हो। यो लचिलो हुन्छ र यसमा नाप्ने चिन्हहरू हुन्छन्।\nपहिलो विकल्प 자 (फिता वा स्केल) हो, जुन छोटो लम्बाइ नाप्न प्रयोग गरिन्छ तर लचिलो फिताको रूपमा हुँदैन। दोस्रो विकल्प 줄자 (जुल्जा) हो, जुन लम्बाइ वा उचाइ नाप्ने फिता आकारको लचिलो औजार हो र यसलाई निर्माण, वास्तुकला र दैनिक जीवनमा प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 저울 (तराजु) हो, जसले तौल नाप्छ। चौथो विकल्प 캘리퍼스 (क्यालिपर्स) हो, जसले वस्तुको सूक्ष्म आकार नाप्छ। सही उत्तर विकल्प २ (줄자) हो।"}, {"n": "382", "q": "물체의 안지름, 바깥지름, 깊이 등을 정밀하게 재는 측정 도구이다. 주로 과학 실험이나 공학 분야에서 사용되며, 눈금이 정밀하게 나뉘어 있어 작은 단위까지 측정할 수 있다.", "options": ["줄자", "전자 저울", "접시 저울", "버니어 캘리퍼스"], "answer": 3, "explain": "प्रश्नको अर्थ: यो सामानको भित्री वा बाहिरी गोलाइ र गहिराइ एकदम मसिनो गरी नाप्ने औजार हो। यो धेरैजसो विज्ञान वा इन्जिनियरिङको काममा प्रयोग गरिन्छ।\n① 줄자 भनेको नाप्ने फिता हो, यसले लम्बाइ नाप्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 전자 저울 भनेको डिजिटल तराजु हो, यसले तौल नाप्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 접시 저울 भनेको थाली तराजु हो, यसले पनि सामानको तौल नाप्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 버니어 캘리퍼스 भनेको भर्नियर क्यालिपर हो, यसले वस्तुको भित्री व्यास, बाहिरी व्यास र गहिराइ सूक्ष्म रूपमा नाप्ने भएकाले यो विवरणसँग एकदम मिल्छ। ✓"}, {"n": "383", "q": "환경을 오염시키지 않고 자연에서 얻을 수 있는 에너지입니다. 태양광, 풍력, 수력, 지열 등이 있으며, 탄소 배출이 적어 지구를 보호하는 데 도움이 됩니다.", "options": ["친환경 자동차", "친환경 에너지", "친환경 건물", "친환경 농업"], "answer": 1, "explain": "प्रश्नको अर्थ: यो वातावरणलाई नोक्सान नपुर्याई प्रकृतिबाट पाइने शक्ति वा ऊर्जा हो। घाम, हावा र पानी जस्ता स्रोतबाट यस्तो ऊर्जा बनाइन्छ।\n① 친환경 자동차 (वातावरणमैत्री गाडी) हो, जुन सवारी साधन हो। ✗\n② 친환경 에너지 (वातावरणमैत्री ऊर्जा) हो, जुन प्रकृतिबाट प्राप्त हुने, प्रदूषण नगर्ने र कार्बन उत्सर्जन कम गर्ने ऊर्जा हो ✓\n③ 친환경 건물 (वातावरणमैत्री भवन) हो, जुन भवनसँग सम्बन्धित छ। ✗\n④ 친환경 농업 (वातावरणमैत्री कृषि) हो, जुन खेतीकिसानीसँग सम्बन्धित छ। ✗"}, {"n": "384", "q": "오랜 시간에 걸쳐 지구의 평균 기온이나 강수량 등이 변하는 현상입니다. 주로 인간의 활동으로 인한 온실가스 증가가 원인이며, 이상기후, 해수면 상승 등을 일으킵니다.", "options": ["기후 변화", "환경 파괴", "지구 온난화", "친환경 정책"], "answer": 0, "explain": "प्रश्नको अर्थ: यो लामो समयको क्रममा पृथ्वीको औसत तापमान वा पानी पर्ने मात्रामा परिवर्तन आउने प्रक्रिया हो। मानिसका गतिविधिले गर्दा मौसम बिग्रँदै जाने समस्या यसमा हुन्छ।\n① 기후 변화 भनेको जलवायु परिवर्तन हो। लामो समयमा पृथ्वीको औसत तापक्रम र वर्षाको मात्रा परिवर्तन हुने प्रक्रियालाई यसले जनाउँछ ✓\n② 환경 파괴 भनेको वातावरण विनाश हो। यो प्राकृतिक वातावरण नष्ट हुने अवस्था हो, त्यसैले यो होइन। ✗\n③ 지구 온난화 भनेको पृथ्वीको तापक्रम वृद्धि हो। यो तापक्रम बढ्ने कुरा मात्र हो ✗\n④ 친환경 정책 भनेको वातावरणमैत्री नीति हो। यो वातावरण जोगाउन बनाइने नियम हो, त्यसैले यो होइन। ✗"}, {"n": "385", "q": "자연의 자원과 생태계를 심각하게 손상하는 현상입니다. 산림 벌채, 오염물질 배출, 무분별한 개발 등이 주요 원인으로, 이는 생물 다양성 감소와 지구 온난화 등 심각한 문제를 일으킵니다.", "options": ["기후 변화", "환경 파괴", "풍력 에너지", "ESG 경영"], "answer": 1, "explain": "प्रश्नको अर्थ: यो रुख काट्ने र फोहोर फाल्ने कार्यले गर्दा प्रकृति र वातावरण नष्ट हुने अवस्था हो। यसले जीवजन्तु र पृथ्वीलाई ठूलो असर पार्छ।\n① 기후 변화 (जलवायु परिवर्तन) हो। ✗\n② 환경 파괴 (वातावरण विनाश) हो, जसले प्राकृतिक स्रोत र पारिस्थितिक प्रणालीलाई गम्भीर रूपमा नोक्सान पुर्‍याउँछ र वन फँडानी यसको मुख्य कारण हो ✓\n③ 풍력 에너지 (वायु ऊर्जा) हो। ✗\n④ ESG 경영 (ESG व्यवस्थापन) हो। ✗"}, {"n": "386", "q": "이산화탄소, 메탄, 아산화질소 같은 대기 중에 존재하는 가스로, 지구의 열을 가두어 기온을 상승시키는 역할을 합니다.", "options": ["화석 연료", "기후 변화", "환경 오염", "온실 가스"], "answer": 3, "explain": "प्रश्नको अर्थ: यो हावामा पाइने यस्तो ग्यास हो जसले पृथ्वीको तापक्रम बढाउन मद्दत गर्छ। यसले वातावरणको गर्मीलाई बाहिर जान नदिई थुनेर राख्छ।\n① 화석 연료 (फसिल इन्धन) हो। ✗\n② 기후 변화 (जलवायु परिवर्तन) हो। ✗\n③ 환경 오염 (वातावरण प्रदूषण) हो। ✗\n④ 온실 가스 (ग्रिनहाउस ग्यास) हो, जुन वायुमण्डलमा पाइने कार्बनडाइअक्साइड, मिथेन आदि ग्यास हुन् जसले पृथ्वीको तापक्रम बढाउँछन् ✓"}, {"n": "387", "q": "해에서 나오는 빛과 열을 이용해 전기를 생산하는 에너지입니다. 환경에 미치는 영향이 적고 재생 가능하여 친환경적인 에너지로 주목받고 있 const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Renders the explanation as a structured list: the explanation string is
// lines separated by "\n" — first line is the question's own meaning
// ("प्रश्नको अर्थ: ..."), then one line per option ("① <word> ... ✓/✗").
// Lines render as separate rows; the ✓ line gets a green tint and the ✓/✗
// marker is coloured. Explanations without line breaks (fallback prose)
// render as a single paragraph, exactly as before. Uses text nodes only,
// never innerHTML, so explanation text is never parsed as markup.
function renderExplain(box, explain) {
  const lines = (explain || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length <= 1) {
    const b = document.createElement('b');
    b.textContent = 'किन? ';
    box.appendChild(b);
    const s = document.createElement('span');
    s.textContent = explain;
    box.appendChild(s);
    return;
  }
  const label = document.createElement('div');
  label.className = 'explain-label';
  label.textContent = 'व्याख्या';
  box.appendChild(label);
  lines.forEach((ln, li) => {
    const d = document.createElement('div');
    if (li === 0 && ln.indexOf('प्रश्नको अर्थ') === 0) {
      d.className = 'explain-stem';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    if (ln.indexOf('शिक्षकको उत्तर-पत्र:') === 0) {
      d.className = 'exp-note';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    const mark = ln.endsWith('✓') ? '✓' : (ln.endsWith('✗') ? '✗' : '');
    const body = mark ? ln.slice(0, -1).trim() : ln;
    d.className = 'exp-line' + (mark === '✓' ? ' exp-ok' : '');
    d.appendChild(document.createTextNode(body + (mark ? ' ' : '')));
    if (mark) {
      const m = document.createElement('span');
      m.className = 'exp-mark ' + (mark === '✓' ? 'ok' : 'no');
      m.textContent = mark;
      d.appendChild(m);
    }
    box.appendChild(d);
  });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    renderExplain(card.querySelector('.explain'), q.explain);
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
