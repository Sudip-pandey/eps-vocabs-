<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<title>EPS-TOPIK Vocabulary Quiz — Set 08 (Q351–Q400)</title>
<style>
  :root {
    --primary: #7c3aed;
    --primary-dark: #5b21b6;
    --primary-soft: #f5f3ff;
    --pink: #db2777;
    --orange: #f97316;
    --grad: linear-gradient(135deg, #6d28d9 0%, #a21caf 48%, #db2777 78%, #f97316 100%);
    --grad-soft: linear-gradient(135deg, #f5f3ff, #fdf2f8);
    --green: #047857;
    --green-bg: #d1fae5;
    --red: #be123c;
    --red-bg: #ffe4e6;
    --bg: #faf8ff;
    --card: #ffffff;
    --text: #1e1b2e;
    --muted: #6b7280;
    --border: #e9e4fb;
    --shadow: 0 2px 6px rgba(109,40,217,.07), 0 10px 28px rgba(109,40,217,.08);
    --shadow-lg: 0 8px 24px rgba(109,40,217,.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans KR", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(600px 300px at 85% -5%, rgba(219,39,119,.12), transparent 60%), radial-gradient(500px 260px at -5% 10%, rgba(124,58,237,.12), transparent 60%); background-attachment: fixed; color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.94); color: #6d28d9; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; box-shadow: 0 2px 10px rgba(0,0,0,.2); margin-bottom: 14px; transition: transform .15s, box-shadow .15s; }
  .back-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.24); }
  header { background: var(--grad); color: #fff; padding: 26px 16px 20px; position: relative; box-shadow: 0 4px 24px rgba(109,40,217,.35); overflow: hidden; }
  header::before { content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28), transparent 65%); top: -160px; right: -60px; pointer-events: none; }
  header::after { content: ""; position: absolute; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.18), transparent 65%); bottom: -140px; left: -40px; pointer-events: none; }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.55rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.18); }
  header p { opacity: .94; font-size: .92rem; margin-top: 4px; }
  .progress-wrap { margin-top: 14px; background: rgba(255,255,255,.28); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.15); }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #fde68a, #ffffff); width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(255,255,255,.7); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .85; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: #c4b5fd; }
  .q-num { display: inline-block; font-size: .78rem; font-weight: 800; color: #fff; background: var(--grad); padding: 4px 14px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 8px rgba(219,39,119,.35); }
  .q-text { font-size: 1.12rem; white-space: pre-line; margin: 10px 0 16px; line-height: 1.85; font-weight: 500; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid var(--border); border-radius: 14px; margin-bottom: 9px; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #fff; }
  .options label:hover { border-color: #a78bfa; background: #fbf9ff; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(124,58,237,.12); }
  .options label::before { content: ""; flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; border: 2px solid #c7c2f5; background: #fff; transition: all .15s; }
  .options label.selected { background: var(--grad-soft); border-color: var(--primary); box-shadow: 0 4px 16px rgba(124,58,237,.18); }
  .options label.selected::before { border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 4px #fff; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #db2777; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 700; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 4px 16px rgba(219,39,119,.4); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 8px 22px rgba(219,39,119,.45); }
  .btn-primary:disabled { background: #d6d3f5; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: #fff; color: #6d28d9; border: 2px solid #e9e4fb; }
  .btn-ghost:hover { border-color: #a78bfa; background: #fbf9ff; }
  .submit-bar { position: sticky; bottom: 0; background: rgba(255,255,255,.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 20px rgba(109,40,217,.1); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: var(--grad); color: #fff; border: none; border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; color: #fff; line-height: 1.05; text-shadow: 0 2px 16px rgba(0,0,0,.2); }
  .score-card .pct { font-size: 1.15rem; color: rgba(255,255,255,.94); margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: rgba(255,255,255,.96); }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 2px 10px rgba(219,39,119,.35); }
  .review-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: linear-gradient(135deg, #059669, #10b981); }
  .verdict.no { background: linear-gradient(135deg, #e11d48, #f43f5e); }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #f8f6ff; border: 1px solid #e9e4fb; border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; }
  .explain b { color: var(--primary-dark); }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin-bottom: 10px; }
  .explain-stem { background: linear-gradient(135deg, #ede9fe, #fce7f3); border-left: 4px solid #7c3aed; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; }
  .exp-line { padding: 10px 12px; border-top: 1px solid #e9e4fb; line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: var(--green); }
  .exp-mark.no { color: var(--red); }
  .exp-note { background: linear-gradient(135deg, #fffbeb, #fef3c7); border: 1px solid #fcd34d; border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }

</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">&larr; Back to All Sets</a>
    <h1>EPS-TOPIK 문제은행 Quiz</h1>
    <p>Set 8 of 11 &bull; Questions 351–400 &bull; 50 questions &bull; EPS-TOPIK Vocabulary &mdash; answers are AI-generated (no answer key in the book) &mdash; check with a teacher &bull; Explanations in Nepali</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">0 / 50 answered</div>
    <div class="autosave-note">Progress will be auto-saved.</div>
  </div>
</header>

<main id="quizView">
  <div id="questionList"></div>
  <div class="pager">
    <button class="btn-ghost" id="prevBtn">&larr; Previous</button>
    <span class="page-info" id="pageInfo"></span>
    <button class="btn-ghost" id="nextBtn">Next &rarr;</button>
  </div>
</main>

<div class="submit-bar" id="submitBar">
  <div class="inner">
    <span class="hint" id="submitHint">Answer all 50, then submit.</span>
    <div style="display:flex; gap:8px; flex:none;">
      <button class="btn-ghost" id="clearBtn" style="padding:11px 16px;">Clear all</button>
      <button class="btn-primary" id="submitBtn">Submit Quiz</button>
    </div>
  </div>
</div>

<main id="resultView" class="hidden">
  <div class="score-card">
    <div class="big" id="scoreBig"></div>
    <div class="pct" id="scorePct"></div>
    <div class="msg" id="scoreMsg"></div>
    <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-primary" id="retryBtn">Try Again</button>
      <button class="btn-ghost" id="reviewTopBtn">Back to top</button>
    </div>
  </div>
  <div class="filters">
    <button class="btn-ghost active" data-filter="all">All questions</button>
    <button class="btn-ghost" data-filter="wrong">Wrong only</button>
    <button class="btn-ghost" data-filter="correct">Correct only</button>
  </div>
  <div id="reviewList"></div>
</main>

<script>
const QUESTIONS = [{"n": "351", "q": "건설 현장이나 항구에서 자주 사용되며, 큰 기계 팔이나 줄을 이용해 물건을 들어 올리고 이동시킵니다. 건물이나 구조물을 짓거나 수송할 때 중요한 역할을 합니다.", "options": ["화물차", "트렉터", "콤바인", "크레인"], "answer": 3, "explain": "१. 화물차 भनेको कार्गो ट्रक हो र यो यहाँ मिल्दैन। २. 트렉터 भनेको ट्र्याक्टर हो र यो यहाँ मिल्दैन। ३. 콤바인 भनेको धान काट्ने मेसिन हो र यो यहाँ मिल्दैन। ४. 크레인 भनेको क्रेन हो, जसले निर्माण स्थलमा ठूला मेसिन वा डोरीको प्रयोग गरी सामान उठाउने र सार्ने काम गर्छ, त्यसैले यो सही उत्तर हो। तसर्थ, सही उत्तर 크레인 (क्रेन) हो।"}, {"n": "352", "q": "흙이나 아스팔트 등의 재료를 압축하고 지면을 다지는 데 사용하는 장비입니다.", "options": ["불도저", "지게차", "로더", "롤러"], "answer": 3, "explain": "'불도저' भनेको माटो धकेल्ने मेसिन हो, त्यसैले यसले भुइँ थिच्ने काम गर्दैन। '지게차' भनेको सामान उचाल्ने मेसिन हो, त्यसैले यो भुइँ दरो बनाउने उपकरण होइन। '로더' भनेको माटो उचालेर लोड गर्ने मेसिन हो, त्यसैले यो विवरणसँग मिल्दैन। '롤러' भनेको माटो वा असफाल्ट थिचेर भुइँ सम्याउने रोलर हो, त्यसैले यो विवरणसँग मिल्छ। त्यसैले सही उत्तर विकल्प ४ को '롤러' हो।"}, {"n": "353", "q": "바다나 강, 호수의 바닥을 파서 깊이를 늘리거나, 퇴적물을 제거하는 작업입니다.", "options": ["준설", "도장", "염색", "운송"], "answer": 0, "explain": "१. 준설 भनेको ड्रेजिङ (नदी वा समुद्रको पिँध खनेर गहिराइ बढाउने वा लेदो हटाउने काम) हो, त्यसैले यो सही उत्तर हो। २. 도장 भनेको पेन्टिङ (रंग लगाउने काम) हो र यो यहाँ मिल्दैन। ३. 염색 भनेको रंगाउने काम हो र यो यहाँ मिल्दैन। ४. 운송 भनेको ढुवानी हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 준설 (ड्रेजिङ/पिँध खन्ने काम) हो।"}, {"n": "354", "q": "흙과 모래가 섞인 것을 말하며 건설 현장이나 하천 주변에서 자주 볼 수 있습니다.", "options": ["돌", "자갈", "토사", "콘크리트"], "answer": 2, "explain": "१. 돌 भनेको ढुङ्गा हो र यो यहाँ मिल्दैन। २. 자갈 भनेको गिट्टी हो र यो यहाँ मिल्दैन। ३. 토사 भनेको माटो र बालुवा मिसिएको लेदो वा माटो-बालुवा हो, जसलाई निर्माण स्थल वा खोला किनारमा प्रायः देख्न सकिन्छ, त्यसैले यो सही उत्तर हो। ४. 콘크리트 भनेको कंक्रिट हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 토사 (माटो र बालुवाको मिश्रण) हो।"}, {"n": "355", "q": "하천, 호수, 하수관 등에서 물이 천천히 흐를 때 무거운 물질들이 아래로 내려앉아 쌓이게 되는 것을 말합니다. 오랜 시간 쌓이면 물이 흐르는 길을 막거나 오염의 원인이 되기도 합니다.", "options": ["수하물", "침전물", "불순물", "분진물"], "answer": 1, "explain": "१. 수하물 भनेको ब्यागेज वा सामान हो र यो यहाँ मिल्दैन। २. 침전물 भनेको लेदो वा गेगर (पानीमा रहेका भारी पदार्थहरू तल थिग्रिएर बस्ने निक्षेप) हो, त्यसैले यो सही उत्तर हो। ३. 불순물 भनेको अशुद्धता हो र यो यहाँ मिल्दैन। ४. 분진물 भनेको धुलोका कणहरू हुन् र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 침전물 (गेगर/लेदो निक्षेप) हो।"}, {"n": "356", "q": "물이 흐르도록 만든 길이나 자연적으로 생긴 물길을 말합니다. 예를 들어, 강, 하천, 배수로 등이 모두 이에 해당합니다.", "options": ["토사", "바다", "폭포", "수로"], "answer": 3, "explain": "१. 토사 भनेको माटो र बालुवा हो र यो यहाँ मिल्दैन। २. 바다 भनेको समुद्र हो र यो यहाँ मिल्दैन। ३. 폭포 भनेको झरना हो र यो यहाँ मिल्दैन। ४. 수로 भनेको पानी बग्ने कुलो वा प्राकृतिक पानीको बाटो हो, त्यसैले यो सही उत्तर हो। तसर्थ, सही उत्तर 수로 (पानी बग्ने कुलो/बाटो) हो।"}, {"n": "357", "q": "집이나 건물에 깨끗한 물을 보내고, 더러운 물을 밖으로 빼내는 시설입니다.", "options": ["상하수도", "음용수", "배수구", "수도관"], "answer": 0, "explain": "१. 상하수도 भनेको खानेपानी र ढल निकास प्रणाली (वाटर सप्लाई र सेभेज सिस्टम) हो, जसले सफा पानी पठाउँछ र फोहोर पानी बाहिर लैजान्छ, त्यसैले यो सही उत्तर हो। २. 음용수 भनेको पिउने पानी हो र यो यहाँ मिल्दैन। ३. 배수구 भनेको ड्रेन वा पानी जाने प्वाल हो र यो यहाँ मिल्दैन। ४. 수도관 भनेको पानीको पाइप हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 상하수도 (खानेपानी तथा ढल निकास प्रणाली) हो।"}, {"n": "358", "q": "흙이나 모래 등을 단단하게 다질 때 사용하는 손도구입니다. 손잡이가 달린 작은 기계처럼 생겼고, 사람이 손으로 들어 올려 바닥을 여러 번 내리쳐서 땅을 눌러 단단하게 만드는 데 사용합니다.", "options": ["결속 핸들", "핸드 램머", "판금 가위", "유각 렌치"], "answer": 1, "explain": "१. 결속 핸들 भनेको बाइन्डिङ ह्यान्डल हो र यो यहाँ मिल्दैन। २. 핸드 램머 भनेको ह्यान्ड र्यामर (हातले उचालेर जमिन कुट्ने औजार) हो, त्यसैले यो सही उत्तर हो। ३. 판금 가위 भनेको पाना काट्ने कैंची हो र यो यहाँ मिल्दैन। ४. 유각 렌치 भनेको हेक्सागन रेन्च हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 핸드 램머 (ह्यान्ड र्यामर) हो।"}, {"n": "359", "q": "산이나 땅속을 파서 만든 터널로, 주로 도로, 철도, 수도, 전력선 등을 통과시키기 위해 사용됩니다.", "options": ["육상터널", "대교량", "현수교", "하역구"], "answer": 0, "explain": "१. 육상터널 भनेको जमिन वा पहाडभित्र बनाइने सुरुङ (टनेल) हो, त्यसैले यो सही उत्तर हो। २. 대교량 भनेको ठूलो पुल हो र यो यहाँ मिल्दैन। ३. 현수교 भनेको सस्पेन्शन ब्रिज (झुलाउने पुल) हो र यो यहाँ मिल्दैन। ४. 하역구 भनेको सामान लोड-अनलोड गर्ने ठाउँ हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 육상터널 (सुरुङ/टनेल) हो।"}, {"n": "360", "q": "쇠로 된 두 줄의 레일로 이루어져 있고, 기차나 전철 같은 열차가 이 레일 위를 달립니다. 사람이나 물건을 빠르게 멀리까지 옮길 수 있어서, 교통과 운송에 아주 중요한 역할을 합니다.", "options": ["도로", "육교", "철도", "교량"], "answer": 2, "explain": "१. 도로 भनेको सडक हो र यो यहाँ मिल्दैन। २. 육교 भनेको ओभरब्रिज (आकाशे पुल) हो र यो यहाँ मिल्दैन। ३. 철도 भनेको रेलमार्ग (ट्र्याक) हो, जसले दुईवटा फलामका लिकहरूमा रेल दौडाउँछ र यातायातमा महत्त्वपूर्ण भूमिका खेल्छ, त्यसैले यो सही उत्तर हो। ४. 교량 भनेको पुल हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 철도 (रेलमार्ग) हो।"}, {"n": "361", "q": "기둥(주탑)에서 여러 개의 줄(케이블)이 사선으로 연결되어 있는 다리입니다. 보기에도 멋지고, 튼튼하면서도 긴 거리를 연결할 수 있어 큰 강이나 바다 위에 자주 사용합니다.", "options": ["육상터널", "수상 교량", "현수교", "사장교"], "answer": 3, "explain": "'육상터널' भनेको जमिनमुनिको सुरुङ हो, त्यसैले यो पुल होइन। '수상 교량' भनेको पानीमाथिको सामान्य पुल हो, तर यसमा केबलको विशेष कुरा छैन। '현수교' भनेको झोलुङ्गे पुल हो, तर यसमा केबलहरू अर्कै तरिकाले टाँगिएका हुन्छन्। '사장교' भनेको मुख्य थामबाट केबलहरू छड्के रूपमा जोडिएको पुल हो, त्यसैले यो विवरणसँग मिल्छ। त्यसैले सही उत्तर विकल्प ४ को '사장교' हो। किताबमा ३ वटा मात्र विकल्पहरू छापिएका छन्, सही उत्तर साजाङ्ग्यो थपिएको हो।"}, {"n": "362", "q": "바다 바닥을 파고 들어가 만든 터널입니다. 이 터널은 바다 아래를 지나갈 수 있도록 만들어지며, 주로 도로, 철도, 수도, 전력선 등을 연결하는 데 사용됩니다.", "options": ["육상터널", "해저침매터널", "교통수단", "사장교"], "answer": 1, "explain": "1. 육상터널 भनेको जमिनमा बनाइने सुरुङ हो, यो समुद्रको फेदमा बनाइने सुरुङको वर्णन होइन त्यसैले मिलेन। 2. 해저침매터널 भनेको समुद्रको पिँध खनेर बनाइएको सुरुङ हो, त्यसैले यो सही उत्तर हो। 3. 교통수단 भनेको यातायातको साधन हो, यो सुरुङसँग सम्बन्धित छैन त्यसैले मिलेन। 4. 사장교 भनेको केबल प्रयोग गरिएको पुल हो, यो सुरुङ होइन त्यसैले मिलेन। 해저침매터널 भनेको समुद्रको सतहमुनि सुरुङ बनाउने विधि हो।"}, {"n": "363", "q": "나무, 철사, 플라스틱 등 다양한 재료로 만들어지며, 식물이 무너지지 않도록 돕고, 햇볕과 공기의 흐름을 좋게 유지하는 역할을 합니다.", "options": ["울타리망", "경운기", "지주대", "곡괭이"], "answer": 2, "explain": "1. 울타리망 भनेको बारे लगाउने जाली हो, यो बिरुवालाई अड्याउने साधन होइन त्यसैले मिलेन। 2. 경운기 भनेको हाते ट्र्याक्टर हो, यो बिरुवालाई अड्याउने साधन होइन त्यसैले मिलेन। 3. 지주대 भनेको बिरुवा ढल्न नदिन र हावापानीको आवतजावत राम्रो बनाउन प्रयोग गरिने खम्बा वा साहरा हो, त्यसैले यो सही उत्तर हो। 4. 곡괭이 भनेको कोदालो वा गैंची हो, यो बिरुवालाई अड्याउने साधन होइन त्यसैले मिलेन। 지주대 भनेको बिरुवालाई अड्याउन प्रयोग गरिने साधन हो।"}, {"n": "364", "q": "쇠로 서너 개의 발을 만들고 자루를 박아 갈퀴 모양으로 만든 농기구입니다. 땅을 파헤쳐 고르거나 두엄, 풀무덤 등을 쳐내는 데 씁니다.", "options": ["모종삽", "분무기", "곡괭이", "쇠스랑"], "answer": 3, "explain": "'모종삽' भनेको बिरुवा सार्ने सानो साबेल हो, त्यसैले यो काँढा भएको औजार होइन। '분무기' भनेको पानी वा औषधि छर्कने उपकरण हो, त्यसैले यो माटो पन्छाउने औजार होइन। '곡괭이' भनेको गैँती हो, तर यसमा तीन-चार वटा काँढा हुँदैनन्। '쇠스랑' भनेको फलामको काँढा भएको सोहोर्ने कृषि औजार हो, त्यसैले यो विवरणसँग मिल्छ। त्यसैले सही उत्तर विकल्प ४ को '쇠스랑' हो।"}, {"n": "365", "q": "모판에서 기른 어린 식물을 논이나 밭으로 옮겨 심을 때 사용하는 작업 도구입니다.", "options": ["뜰채", "갈퀴", "곡괭이", "모종삽"], "answer": 3, "explain": "1. 뜰채 भनेको जाली हो, यो बिरुवा सार्ने औजार होइन त्यसैले मिलेन। 2. 갈퀴 भनेको घाँस वा पात बटुलुने औजार हो, यो बिरुवा सार्ने होइन त्यसैले मिलेन। 3. 모종삽 भनेको बेर्ना सार्न प्रयोग गरिने सानो साबेल हो, त्यसैले यो सही उत्तर हो। 4. 곡괭이 भनेको कडा माटो खन्ने गैंची हो, यो बिरुवा सार्ने औजार होइन त्यसैले मिलेन। 모종삽 भनेको बेर्ना सार्ने औजार हो।"}, {"n": "366", "q": "곡괭이, 호미, 낫 등과 같이 논과 밭에서 곡식이나 채소 등을 재배할 때 사용하는 도구입니다.", "options": ["공구", "가구", "농기구", "보호구"], "answer": 2, "explain": "'공구' भनेको सामान्य काममा प्रयोग हुने औजार हो, तर यो विशेष गरी खेतीको होइन। '가구' भनेको घरको फर्निचर हो, त्यसैले यो खेती गर्ने औजार होइन। '농기구' भनेको खेतबारीमा अन्न वा तरकारी रोप्दा प्रयोग गरिने कृषि औजार हो, त्यसैले यो विवरणसँग मिल्छ। '보호구' भनेको शरीरको सुरक्षा गर्ने सामान हो, त्यसैले यो खेती गर्ने औजार होइन। त्यसैले सही उत्तर विकल्प ३ को '농기구' हो।"}, {"n": "367", "q": "긴 나무 자루에 길고 뾰족한 날을 붙여서 만든 것으로 단단한 땅을 파는 데 쓰는 농기구입니다.", "options": ["호미", "갈퀴", "모종삽", "곡괭이"], "answer": 3, "explain": "१. 호미 भनेको सानो कुटो हो, यो घाँस उखेल्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। २. 갈퀴 भनेको सोहर्ने दाँती हो, यो सुकेका पात सोहर्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ३. 모종삽 भनेको सानो बेल्चा हो, यो बिरुवा रोप्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ४. 곡괭이 भनेको गैँती हो, यो लामो काठको बिँड भएको कडा माटो खन्ने औजार भएकाले विवरणसँग सही मिल्छ। त्यसैले सही उत्तर ४ नम्बरको 곡괭이 हो।"}, {"n": "368", "q": "농업이나 건설 현장에서 땅을 파거나 흙을 옮길 때 사용하는 도구입니다.", "options": ["삽", "괭이", "호미", "대패"], "answer": 0, "explain": "1. 삽 भनेको माटो खन्न वा सार्न प्रयोग हुने साबेल हो, त्यसैले यो सही उत्तर हो। 2. 괭이 भनेको कुटो हो, यो साबेल होइन त्यसैले मिलेन। 3. 호미 भनेको सानो कुटो हो, यो माटो फ्याँक्ने साबेल होइन त्यसैले मिलेन। 4. 대패 भनेको काठ रन्दा लगाउने औजार हो, यो माटो खन्ने होइन त्यसैले मिलेन। 삽 भनेको माटो खन्ने वा बोक्ने साबेल हो।"}, {"n": "369", "q": "벼, 보리, 밀 같은 작물을 수확할 때 탈곡과 선별 작업을 동시에 할 수 있는 기계입니다.", "options": ["경운기", "예초기", "콤바인", "파종기"], "answer": 2, "explain": "1. 경운기 भनेको हाते ट्र्याक्टर हो, यो बाली काट्ने मेसिन होइन त्यसैले मिलेन। 2. 예초기 भनेको घाँस काट्ने मेसिन हो, यो बाली भित्र्याउने मेसिन होइन त्यसैले मिलेन। 3. 콤바인 भनेको धान, गहुँ जस्ता बाली एकैचोटि काट्ने र चुट्ने मेसिन (कम्बाइन) हो, त्यसैले यो सही उत्तर हो। 4. 파종기 भनेको बीउ रोप्ने मेसिन हो, यो बाली काट्ने मेसिन होइन त्यसैले मिलेन। 콤바인 भनेको बाली काट्ने र झार्ने काम एकैसाथ गर्ने मेसिन हो।"}, {"n": "370", "q": "농업에서 씨앗을 빠르고 효율적으로 심을 수 있도록 도와주는 기계로, 자동화된 시스템을 이용해 일정한 양의 씨앗을 고르게 뿌려서 노동을 덜어줍니다.", "options": ["경운기", "트렉터", "콤바인", "파종기"], "answer": 3, "explain": "1. 경운기 भनेको हाते ट्र्याक्टर हो, यो बीउ रोप्ने मेसिन होइन त्यसैले मिलेन। 2. 트렉터 भनेको ट्र्याक्टर हो, यो जोत्ने काममा आउँछ त्यसैले मिलेन। 3. 콤바인 भनेको बाली काट्ने मेसिन हो, यो बीउ रोप्ने होइन त्यसैले मिलेन। 4. 파종기 भनेको बीउ छर्ने वा रोप्ने मेसिन हो, त्यसैले यो सही उत्तर हो। 파종기 भनेको कृषिका लागि बीउ रोप्ने मेसिन हो।"}, {"n": "371", "q": "풀을 자르거나 깎는 데 사용하는 기계로 주로 논, 밭, 과수원, 도로 주변, 공원 등에서 자란 잔디나 잡초를 정리할 때 사용합니다.", "options": ["수준기", "예초기", "정수기", "경운기"], "answer": 1, "explain": "1. 수준기 भनेको लेभल मिलाउने औजार हो, यो घाँस काट्ने मेसिन होइन त्यसैले मिलेन। 2. 예초기 भनेको घाँस वा बुट्यान काट्ने मेसिन हो, त्यसैले यो सही उत्तर हो। 3. 정수기 भनेको पानी फिल्टर गर्ने मेसिन हो, यो घाँस काट्ने होइन त्यसैले मिलेन। 4. 경운기 भनेको हाते ट्र्याक्टर हो, यो घाँस काट्ने मेसिन होइन त्यसैले मिलेन। 예초기 भनेको घाँस काट्ने मेसिन हो।"}, {"n": "372", "q": "땅을 파거나 고를 때 사용하는 농기구입니다. 끝이 날카로운 쇠로 되어 있고, 손잡이를 잡고 흔들어 흙을 팔 때 사용합니다.", "options": ["삽", "괭이", "망치", "곡괭이"], "answer": 1, "explain": "1. 삽 भनेको माटो काट्ने साबेल हो, यो कुटो होइन त्यसैले मिलेन। 2. 괭이 भनेको माटो खन्ने वा गोडमेल गर्ने कुटो हो, त्यसैले यो सही उत्तर हो। 3. 망치 भनेको हथौडा हो, यो कृषि औजार होइन त्यसैले मिलेन। 4. 곡괭이 भनेको गैंची हो, यो कुटोभन्दा फरक हुन्छ त्यसैले यो होइन। 괭이 भनेको माटो खन्ने कुटो हो।"}, {"n": "373", "q": "밭에서 풀을 뽑거나 흙을 고를 때 사용하는 작은 농기구입니다. 한 손으로 쓸 수 있는 도구로, 끝이 휘어져 있어서 흙을 긁거나 파기에 좋고, 잡초를 쉽게 제거할 수 있습니다.", "options": ["호미", "괭이", "갈퀴", "낫"], "answer": 0, "explain": "१. 호미 भनेको सानो कुटो हो, यो एक हातले घाँस उखेल्न र माटो सोहर्न प्रयोग गरिने औजार भएकाले विवरणसँग सही मिल्छ। २. 괭이 भनेको कुदालो हो, यो दुवै हातले प्रयोग गरिने अलि ठूलो औजार भएकाले विवरणसँग मिल्दैन। ३. 갈퀴 भनेको सोहर्ने दाँती हो, यो घाँस वा पात सोहर्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ४. 낫 भनेको हँसिया हो, यो बाली वा घाँस काट्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। त्यसैले सही उत्तर १ नम्बरको 호미 हो।"}, {"n": "374", "q": "씨앗을 뿌려 모를 키우는 작은 밭이나 판입니다. 주로 벼농사에서 많이 사용되며, 모판에서 모를 일정 크기로 키운 뒤, 본논에 옮겨 심는 방식으로 농사를 짓습니다.", "options": ["수레", "분뇨", "상자", "모판"], "answer": 3, "explain": "1. 수레 भनेको ठेलागाडी हो, यो बेर्ना हुर्काउने ठाउँ होइन त्यसैले मिलेन। 2. 분뇨 भनेको मलमूत्र हो, यो बेर्ना राख्ने ठाउँ होइन त्यसैले मिलेन। 3. 상자 भनेको बक्स हो, यो बेर्ना राख्ने ठाउँसँग मिल्दैन। 4. 모판 भनेको धान वा तरकारीको बेर्ना उमार्ने ब्याड (प्लाष्टिक वा काठको ट्रे) हो, त्यसैले यो सही उत्तर हो। 모판 भनेको बेर्ना उमार्ने ठाउँ वा ब्याड हो।"}, {"n": "375", "q": "토지의 생산력을 높이고 식물에 생장을 돕기 위해 땅에 뿌리는 물질입니다.", "options": ["씨앗", "비료", "사료", "모종, 바종"], "answer": 1, "explain": "1. 씨앗 भनेको बीउ हो, यो माटोमा हालिने रासायनिक वा प्रांगारिक पदार्थ होइन त्यसैले मिलेन। 2. 비료 भनेको माटोको उर्वराशक्ति बढाउन र बिरुवाको वृद्धिका लागि प्रयोग गरिने मल (खेतीमा हाल्ने मल) हो, त्यसैले यो सही उत्तर हो। 3. 사료 भनेको दाना (जनावरलाई खुवाउने) हो, यो माटोमा हाल्ने होइन त्यसैले मिलेन। 4. 모종, 바종 भनेको बेर्ना र बीउ छर्ने काम हो, यो मल होइन त्यसैले मिलेन। 비료 भनेको मल वा फर्टिलाइजर हो। चौथो विकल्प '모종, 바종' किताबमा छापिएजस्तै राखिएको छ।"}, {"n": "376", "q": "나무를 심고, 가꾸고, 수확하는 작업이 이루어지며, 과일 생산을 위한 전문적인 농업 공간입니다.", "options": ["농장", "공원", "정원", "과수원"], "answer": 3, "explain": "१. 농장 भनेको समग्र बालीनाला लगाउने र जनावर पाल्ने फार्म हो, त्यसैले यो मिल्दैन। २. 공원 भनेको मानिसहरू आराम गर्ने पार्क हो, त्यसैले यो मिल्दैन। ३. 정원 भनेको बगैंचा हो, त्यसैले यो मिल्दैन। ४. 과수원 भनेको फलफूल उत्पादन गर्ने बगैंचा वा फार्म हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ नम्बरको 과수원 (फलफूल बगैंचा) हो।"}, {"n": "377", "q": "가축들이 먹는 먹이를 말하며 주로 곡물, 풀, 콩, 비타민 등으로 만들어지며, 가축이 건강하게 자라고 고기나 우유, 달걀 등을 잘 생산할 수 있도록 도와줍니다.", "options": ["비료", "분뇨", "사료", "건초"], "answer": 2, "explain": "१. 비료 भनेको मल हो, त्यसैले यो मिल्दैन। २. 분뇨 भनेको पशुपक्षीको मलमूत्र हो, त्यसैले यो मिल्दैन। ३. 사료 भनेको जनावरलाई खुवाउने दाना (आहारा) हो, त्यसैले यो सही उत्तर हो। ४. 건초 भनेको सुकेको घाँस हो, त्यसैले यो मिल्दैन। सही उत्तर ३ नम्बरको 사료 (पशु आहार) हो।"}, {"n": "378", "q": "가축에게 사료를 주는 기계나 도구입니다. 이 기계는 자동 또는 수동으로 작동하며, 일정한 양의 사료를 정해진 시간에 가축에게 공급해 줍니다.", "options": ["바가지", "사료조", "급이기", "계량컵"], "answer": 2, "explain": "१. 바가지 भनेको पानी वा दाना तान्ने बाटा वा कचौरा हो, त्यसैले यो मिल्दैन। २. 사료조 भनेको दाना राख्ने भाँडो वा डुँड हो, त्यसैले यो मिल्दैन। ३. 급이기 भनेको पशुलाई स्वचालित वा हाते तरिकाले दाना खुवाउने यन्त्र (फीडर) हो, त्यसैले यो सही उत्तर हो। ४. 계량컵 भनेको नाप्ने कप हो, त्यसैले यो मिल्दैन। सही उत्तर ३ नम्बरको 급이기 (दाना खुवाउने यन्त्र) हो।"}, {"n": "379", "q": "가축에게 사료를 담아주는 그릇이나 통입니다. 주로 가축들이 사료를 먹을 수 있도록 담아두는 용기로, 플라스틱, 철, 시멘트 등 다양한 재료로 만들어집니다.", "options": ["주전자", "사료조", "급이기", "저울"], "answer": 1, "explain": "१. 주전자 भनेको चिया वा पानी उमाल्ने वा राख्ने भाँडो हो, त्यसैले यो मिल्दैन। २. 사료조 भनेको पशुलाई दाना राख्ने भाँडो वा डुँड हो, त्यसैले यो सही उत्तर हो। ३. 급이기 भनेको दाना खुवाउने यन्त्र हो, त्यसैले यो मिल्दैन। ४. 저울 भनेको तराजु हो, त्यसैले यो मिल्दैन। सही उत्तर २ नम्बरको 사료조 (दाना राख्ने डुँड/भाँडो) हो।"}, {"n": "380", "q": "건초나 풀처럼 가축에게 먹이는 거친 사료를 말합니다. 주로 소나 양 같은 초식 가축에게 주며, 예를 들어 볏짚, 건초, 옥수수 줄기, 청초 등이 있습니다.", "options": ["조사료", "미네랄", "습사료", "곡물"], "answer": 0, "explain": "१. 조사료 भनेको खस्रो आहारा (घाँस, पराल आदि) हो, त्यसैले यो सही उत्तर हो। २. 미네랄 भनेको खनिज पदार्थ हो, त्यसैले यो मिल्दैन। ३. 습사료 भनेको ओसिलो वा झोलयुक्त दाना हो, त्यसैले यो मिल्दैन। ४. 곡물 भनेको अन्नबाली हो, त्यसैले यो मिल्दैन। सही उत्तर १ नम्बरको 조사료 (खस्रो आहारा) हो।"}, {"n": "381", "q": "자루가 달려 있는 그릇이나 도구로, 물건을 담거나 퍼내는 데 사용하는 도구입니다. 주로 물이나 곡물, 사료 등을 퍼내거나 담는 데 사용됩니다.", "options": ["양동이", "바가지", "손수레", "프라이팬"], "answer": 1, "explain": "१. 양동이 भनेको बाल्टी हो, त्यसैले यो मिल्दैन। २. 바가지 भनेको पानी वा दाना उघाउने डुडुल्को वा पहेँलो बाटाजस्तो भाँडो हो, त्यसैले यो सही उत्तर हो। ३. 손수레 भनेको हाते ठेला हो, त्यसैले यो मिल्दैन। ४. 프라이팬 भनेको कराैँ (तवा) हो, त्यसैले यो मिल्दैन। सही उत्तर २ नम्बरको 바가지 (उघाउने भाँडो) हो।"}, {"n": "382", "q": "가축을 기르는 건물이나 공간을 의미합니다. 보통 소, 돼지, 양, 닭 등 가축을 키우기 위해 만들어진 건물로, 가축들이 편하게 지낼 수 있도록 설계됩니다.", "options": ["농장", "공장", "축사", "과수원"], "answer": 2, "explain": "१. 농장 भनेको कृषि फर्म हो, त्यसैले यो मिल्दैन। २. 공장 भनेको कारखाना हो, त्यसैले यो मिल्दैन। ३. 축사 भनेको पशुपक्षी पाल्ने गोठ (खोर) हो, त्यसैले यो सही उत्तर हो। ४. 과수원 भनेको फलफूल बगैंचा हो, त्यसैले यो मिल्दैन। सही उत्तर ३ नम्बरको 축사 (गोठ/खोर) हो।"}, {"n": "383", "q": "보통 물고기를 잡을 때 쓰는 수단으로 노끈이나 실, 쇠줄 따위로 여러 구멍이 나게 엮은 물건입니다.", "options": ["통발", "그물", "갈퀴", "밧줄"], "answer": 1, "explain": "१. 통발 भनेको माछा समात्ने थुन्से आकारको पासो हो, त्यसैले यो मिल्दैन। २. 그물 भनेको माछा समात्ने जालो हो, त्यसैले यो सही उत्तर हो। ३. 갈퀴 भनेको घाँस वा पात बटुलुवा हो, त्यसैले यो मिल्दैन। ४. 밧줄 भनेको डोरी हो, त्यसैले यो मिल्दैन। सही उत्तर २ नम्बरको 그물 (जाल) हो।"}, {"n": "384", "q": "어업에서 물고기를 잡는 그물을 걷어올리는데 사용되는 기계입니다.", "options": ["집어등", "양망기", "바늘대", "밧줄"], "answer": 1, "explain": "१. 집어등 भनेको माछा तान्ने बत्ती हो, त्यसैले यो मिल्दैन। २. 양망기 भनेको माछा मार्ने जालो तान्ने मेसिन हो, त्यसैले यो सही उत्तर हो। ३. 바늘대 भनेको बत्तीको सिन्का वा सुई राख्ने साधन हो, त्यसैले यो मिल्दैन। ४. 밧줄 भनेको डोरी हो, त्यसैले यो मिल्दैन। सही उत्तर २ नम्बरको 양망기 (जाल तान्ने मेसिन) हो।"}, {"n": "385", "q": "물고기나 해양 생물을 잡는 그물 형태의 덫입니다. 보통 원통 모양으로 생겼고, 입구가 좁아 생물이 들어가면 나오기 어렵도록 설계되어 있습니다.", "options": ["닻", "뜰채", "부표", "통발"], "answer": 3, "explain": "१. 닻 भनेको लङ्गर हो, यो जहाजलाई एकै ठाउँमा रोक्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। २. 뜰채 भनेको हात जाली हो, यो पानीबाट माछा उठाउन प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ३. 부표 भनेको तैरिने भुवा हो, यो स्थान जनाउन प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ४. 통발 भनेको ढडिया हो, यो बेलनाकार आकारको माछा समात्ने पासो भएकाले विवरणसँग सही मिल्छ। त्यसैले सही उत्तर ४ नम्बरको 통발 हो।"}, {"n": "386", "q": "물속에서 물고기나 다른 수생 생물을 잡는 도구입니다. 주로 연못이나 작은 호수에서 물고기를 잡을 때 사용되며, 낚시나 수산업에서 자주 사용됩니다.", "options": ["뜰채", "밧줄", "그물", "바늘대"], "answer": 0, "explain": "१. 뜰채 भनेको सानो जाली वा छिपो हो जसले पानीभित्रका जीवहरू समात्छ, त्यसैले यो सही उत्तर हो। २. 밧줄 भनेको डोरी हो, त्यसैले यो मिल्दैन। ३. 그물 भनेको ठूलो जाल हो, त्यसैले यो मिल्दैन। ४. 바늘대 भनेको सुई हो, त्यसैले यो मिल्दैन। सही उत्तर १ नम्बरको 뜰채 (सानो जाली/छिपो) हो।"}, {"n": "387", "q": "햇빛이나 강한 조명을 차단하여 실내 온도 조절이나 눈부심 방지에 사용하는 막입니다. 주로 비닐하우스, 창문, 어업용 어 등에 활용됩니다.", "options": ["갑판", "부표", "바늘대", "차광막"], "answer": 3, "explain": "१. 갑판 भनेको जहाजको डेक हो, त्यसैले यो मिल्दैन। २. 부표 भनेको पानीमा तैरिने बुइो हो, त्यसैले यो मिल्दैन। ३. 바늘대 भनेको सुई वा सोसम्बन्धी साधन हो, त्यसैले यो मिल्दैन। ४. 차광막 भनेको घाम छेक्ने जाली (शेड नेट) हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ नम्बरको 차광막 (घाम छेक्ने जाली) हो।"}, {"n": "388", "q": "보통 그물을 칠 때 사용하는 실이나 줄을 한쪽 끝에 걸어서 날 속으로 들여 지르는 가늘고 길쭉한 막대기입니다.", "options": ["닻", "고리", "도르래", "바늘대"], "answer": 3, "explain": "१. 닻 भनेको लंगर हो, त्यसैले यो मिल्दैन। २. 고리 भनेको रिङ वा कडी हो, त्यसैले यो मिल्दैन। ३. 도르래 भनेको घिर्नी हो, त्यसैले यो मिल्दैन। ४. 바늘대 भनेको जाल बुन्ने वा छिराउने सिन्का वा साधन हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ नम्बरको 바늘대 (जाल बुन्ने/सिउने सिन्का) हो।"}, {"n": "389", "q": "물이나 약제를 높은 압력으로 뿌려 세척, 농약 살포 등에 사용하는 장비입니다. 강한 압력 덕분에 먼지, 오염물, 해충 등을 효과적으로 제거할 수 있습니다.", "options": ["양망기", "차광막", "고압 호스", "고압 분사기"], "answer": 3, "explain": "१. 양망기 भनेको जाल तान्ने मेसिन हो, त्यसैले यो मिल्दैन। २. 차광막 भनेको घाम छेक्ने जाली हो, त्यसैले यो मिल्दैन। ३. 고압 호스 भनेको उच्च चापको पाइप हो, त्यसैले यो मिल्दैन। ४. 고압 분사기 भनेको उच्च चापमा पानी वा औषधि छ्याप्ने यन्त्र हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ नम्बरको 고압 분사기 (उच्च चापको स्प्रेयर) हो।"}, {"n": "390", "q": "물고기, 조개, 해조류 등을 인공적으로 기르기 위해 바다나 강, 호수 등에 설치한 시설입니다. 어업에서 안정적인 수산물 생산을 위해 중요한 역할을 합니다.", "options": ["농장", "닭장", "양식장", "양계장"], "answer": 2, "explain": "१. 농장 भनेको कृषि फर्म हो, त्यसैले यो मिल्दैन। २. 닭장 भनेको कुखुराको खोर हो, त्यसैले यो मिल्दैन। ३. 양식장 भनेको माछा वा सामुद्रिक जीव पालन गर्ने केन्द्र (फिश फार्म) हो, त्यसैले यो सही उत्तर हो। ४. 양계장 भनेको कुखुरा पालन फर्म हो, त्यसैले यो मिल्दैन। सही उत्तर ३ नम्बरको 양식장 (जलचर पालन केन्द्र) हो।"}, {"n": "391", "q": "어업에서 양식장 위치나 어망 설치 지점을 표시하기 위해 사용하는 해상 표지입니다. 부력을 이용해 물 위에 떠 있으며 어선의 작업 효율과 안전을 돕습니다.", "options": ["그물", "갑판", "부표", "밧줄"], "answer": 2, "explain": "१. 그물 भनेको जाल हो, यो माछा समात्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। २. 갑판 भनेको जहाजको डेक हो, यो मानिस उभिने वा सामान राख्ने सतह हो, त्यसैले यो विवरणसँग मिल्दैन। ३. 부표 भनेको तैरिने सङ्केत हो, यो पानीमा तैरिएर स्थान वा दिशा देखाउन प्रयोग गरिने भएकाले विवरणसँग सही मिल्छ। ४. 밧줄 भनेको डोरी हो, यो सामान बाँध्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। त्यसैले सही उत्तर ३ नम्बरको 부표 हो।"}, {"n": "392", "q": "물고기나 해산물을 기르거나 보관하기 위해 사용하는 물탱크 형태의 용기입니다. 양식장이나 실내 사육 시설에서 주로 사용됩니다.", "options": ["구조", "수조", "부표", "통발"], "answer": 1, "explain": "१. 구조 भनेको उद्धार हो, const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-08';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Renders the explanation as a structured list: the explanation string is
// lines separated by "\n" — first line is the question's own meaning
// ("प्रश्नको अर्थ: ..."), then one line per option ("① <word> ... ✓/✗").
// Lines render as separate rows; the ✓ line gets a green tint and the ✓/✗
// marker is coloured. Explanations without line breaks (fallback prose)
// render as a single paragraph, exactly as before. Uses text nodes only,
// never innerHTML, so explanation text is never parsed as markup.
function renderExplain(box, explain) {
  const lines = (explain || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length <= 1) {
    const b = document.createElement('b');
    b.textContent = 'किन? ';
    box.appendChild(b);
    const s = document.createElement('span');
    s.textContent = explain;
    box.appendChild(s);
    return;
  }
  const label = document.createElement('div');
  label.className = 'explain-label';
  label.textContent = 'व्याख्या';
  box.appendChild(label);
  lines.forEach((ln, li) => {
    const d = document.createElement('div');
    if (li === 0 && ln.indexOf('प्रश्नको अर्थ') === 0) {
      d.className = 'explain-stem';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    if (ln.indexOf('शिक्षकको उत्तर-पत्र:') === 0) {
      d.className = 'exp-note';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    const mark = ln.endsWith('✓') ? '✓' : (ln.endsWith('✗') ? '✗' : '');
    const body = mark ? ln.slice(0, -1).trim() : ln;
    d.className = 'exp-line' + (mark === '✓' ? ' exp-ok' : '');
    d.appendChild(document.createTextNode(body + (mark ? ' ' : '')));
    if (mark) {
      const m = document.createElement('span');
      m.className = 'exp-mark ' + (mark === '✓' ? 'ok' : 'no');
      m.textContent = mark;
      d.appendChild(m);
    }
    box.appendChild(d);
  });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    renderExplain(card.querySelector('.explain'), q.explain);
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
