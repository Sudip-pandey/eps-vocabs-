<!DOCTYPE html>

<head>

<title>EPS-TOPIK Vocabulary Quiz — Set 12 (Q551–Q600)</title>
<style>
  :root {
    --primary: #a78bfa;
    --primary-dark: #c4b5fd;
    --primary-soft: rgba(124,58,237,.22);
    --accent: #6366f1;
    --accent-soft: rgba(99,102,241,.18);
    --green: #34d399;
    --green-bg: rgba(16,185,129,.16);

    --red-bg: rgba(244,63,94,.14);
    --bg: #0b0b16;
    --card: #171725;
    --text: #f2f1fa;
    --muted: #9d9db4;
    --border: rgba(255,255,255,.09);
    --shadow: 0 2px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans KR", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(700px 340px at 50% -5%, rgba(99,102,241,.14), transparent 60%); background-attachment: fixed; color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); color: #d6c9ff; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,.12); margin-bottom: 14px; transition: all .15s; }
  .back-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  header { background: #312e81; color: #fff; padding: 20px 16px 16px; position: relative; border-bottom: 1px solid rgba(255,255,255,.1); box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.4rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  header p { opacity: .92; font-size: .9rem; margin-top: 4px; }
  .progress-wrap { margin-top: 14px; background: rgba(0,0,0,.35); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .progress-bar { height: 100%; background: #a5b4fc; width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(165,180,252,.6); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { position: relative; background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; background: #6366f1; border-radius: 0 0 6px 6px; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: rgba(167,139,250,.55); }
  .q-card.answered::after { content: "✓"; position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: #059669; color: #fff; font-weight: 800; font-size: .95rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .q-num { display: inline-block; font-size: .92rem; font-weight: 800; color: #fff; background: #4f46e5; padding: 7px 18px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(79,70,229,.4); }
  .q-text { font-size: 1.16rem; white-space: pre-line; margin: 14px 0 18px; line-height: 1.85; font-weight: 500; color: #f2f1fa; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 16px 18px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid rgba(255,255,255,.09); border-radius: 14px; margin-bottom: 0; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #1e1e30; color: #f2f1fa; }
  .options label:hover { border-color: #8b5cf6; background: #232338; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,.3); }
  .options label::before { content: ""; flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid #7c7ca0; background: transparent; transition: all .15s; }
  .options label.selected { background: var(--accent-soft); border-color: #a78bfa; box-shadow: 0 4px 18px rgba(99,102,241,.4); }
  .options label.selected::before { border-color: #a78bfa; background: #a78bfa; box-shadow: inset 0 0 0 4px #1e1e30; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #a5b4fc; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 700; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .btn-primary { background: #4f46e5; color: #fff; box-shadow: 0 4px 18px rgba(79,70,229,.4); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 8px 24px rgba(79,70,229,.45); }
  .btn-primary:disabled { background: #2a2a3d; color: #77778e; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: rgba(255,255,255,.06); color: #d6c9ff; border: 2px solid rgba(255,255,255,.12); }
  .btn-ghost:hover { border-color: #8b5cf6; background: rgba(124,58,237,.2); }
  .submit-bar { position: sticky; bottom: 0; background: rgba(11,11,22,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 24px rgba(0,0,0,.5); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: #1e1b3a; border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; line-height: 1.05; color: #a5b4fc; }
  .score-card .pct { font-size: 1.15rem; color: #c9c6e0; margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: #e6e4f5; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: #4f46e5; color: #fff; border-color: transparent; box-shadow: 0 2px 12px rgba(79,70,229,.35); }
  .review-card { background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: #059669; }
  .verdict.no { background: #e11d48; }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; background: #1e1e30; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #12101f; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; color: #d9d7ea; }
  .explain b { color: #d6c9ff; }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; }
  .explain-stem { background: rgba(99,102,241,.18); border-left: 4px solid #a78bfa; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; color: #f2f1fa; }
  .exp-line { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.07); line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: #34d399; }
  .exp-mark.no { color: #fb7185; }
  .exp-note { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.4); border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; color: #fde9c8; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }

</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">&larr; Back to All Sets</a>
    <h1>EPS-TOPIK 문제은행 Quiz</h1>
    <p>Set 12 of 12 &bull; Questions 551–600 &bull; 50 questions &bull; EPS-TOPIK Vocabulary &mdash; answers are AI-generated (no answer key in the book) &mdash; check with a teacher &bull; Explanations in Nepali</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">0 / 50 answered</div>

<main id="quizView">

  </div>
</main>

<div class="submit-bar" id="submitBar">

    <span class="hint" id="submitHint">Answer all 50, then submit.</span>
    <div style="display:flex; gap:8px; flex:none;">
      <button class="btn-ghost" id="clearBtn" style="padding:11px 16px;">Clear all</button>
      <button class="btn-primary" id="submitBtn">Submit Quiz</button>
    </div>
  </div>
</div>

<main id="resultView" class="hidden">
  <div class="score-card">
    <div class="big" id="scoreBig"></div>
    <div class="pct" id="scorePct"></div>
    <div class="msg" id="scoreMsg"></div>
    <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-primary" id="retryBtn">Try Again</button>
      <button class="btn-ghost" id="reviewTopBtn">Back to top</button>
    </div>
  </div>
  <div class="filters">
    <button class="btn-ghost active" data-filter="all">All questions</button>
    <button class="btn-ghost" data-filter="wrong">Wrong only</button>
    <button class="btn-ghost" data-filter="correct">Correct only</button>
  </div>
  <div id="reviewList"></div>
</main>

<script>
const QUESTIONS = [{"n": "551", "q": "물에 빠졌을 때 사람의 몸이 물에 뜨도록 도와주는 안전 장비입니다. 물가에서 작업할 때, 또는 수난 구조 활동 시 착용하며, 익사를 예방하는 데 매우 중요합니다.", "options": ["구명조끼", "절연 장갑", "절연 장화", "무릎보호대"], "answer": 0, "explain": "प्रश्नको अर्थ: पानीमा खस्दा ज्यान जोगाउन र शरीरलाई पानीमा तैराउन मद्दत गर्ने सुरक्षा कपडा हो।\n① 구명조끼 भनेको ज्याकेट लाइफ ज्याकेट हो, यो पानीमा डुब्दा बचाउने हुनाले सही उत्तर हो। ✓\n② 절연 장갑 भनेको इन्सुलेटेड पन्जा हो ✗\n③ 절연 장화 भनेको इन्सुलेटेड जुत्ता हो ✗\n④ 무릎보호대 भनेको घुँडा रक्षक हो ✗"}, {"n": "552", "q": "갑작스러운 사고나 질병으로 다친 사람에게 의사가 오기 전 또는 병원에 가기 전까지 임시로 시행하는 절차를 말합니다.", "options": ["응급 상황", "응급 처치", "비상 상황", "비상 전화"], "answer": 1, "explain": "प्रश्नको अर्थ: अचानक बिरामी वा घाइते भएका व्यक्तिलाई अस्पताल लैजानुअघि तुरुन्तै गरिने प्रारम्भिक उपचार हो।\n① 응급 상황 भनेको आपतकालीन अवस्था हो ✗\n② 응급 처치 भनेको प्राथमिक उपचार हो, डाक्टर आउनु वा अस्पताल जानु अघि गरिने उपचार भएकोले सही उत्तर हो। ✓\n③ 비상 상황 भनेको आपतकालीन परिस्थिति हो ✗\n④ 비상 전화 भनेको आपतकालीन फोन हो ✗"}, {"n": "553", "q": "숨을 제대로 쉬지 못해 산소가 부족해지는 상태를 말하며, 기도가 막히거나 유해가스를 마셨을 때 발생할 수 있습니다.", "options": ["화재", "부상", "질식", "무의식"], "answer": 2, "explain": "प्रश्नको अर्थ: सास्ती वा विषालु ग्यासका कारण सास फेर्न गाह्रो भई अक्सिजनको कमी हुने अवस्था हो।\n① 화재 भनेको आगलागी हो ✗\n② 부상 भनेको चोटपटक हो ✗\n③ 질식 भनेको श्वासप्रश्वास रोकिनु वा दम घोटिनु हो, अक्सिजन नपुग्ने अवस्थालाई जनाउने हुनाले सही उत्तर हो। ✓\n④ 무의식 भनेको बेहोस हुनु हो ✗\nशिक्षकको उत्तर-पत्र: ④ 무의식 — मेरो उत्तर: ③ 질식। प्रश्न: सास फेर्न नसक्ने, अक्सिजन कमी, श्वासनली बन्द / हानिकारक ग्यास — त्यो निस्सासिनु (질식) हो; 무의식 (बेहोशी) त सम्भावित परिणाम हो, प्रश्नले भनेको अवस्था होइन।"}, {"n": "554", "q": "다친 사람이나 환자를 옮길 때 사용하는 이동용 침대입니다. 구조 현장이나 병원, 구급차에서 자주 사용되며 두 사람이 양쪽을 들어서 운반합니다.", "options": ["사다리", "비상구", "옷장", "들것"], "answer": 3, "explain": "प्रश्नको अर्थ: घाइते वा बिरामी व्यक्तिलाई एक ठाउँबाट अर्को ठाउँमा बोकेर लैजान प्रयोग गरिने साधन हो।\n① 사다리 भनेको भर्‍याङ हो ✗\n② 비상구 भनेको आपतकालीन ढोका हो ✗\n③ 옷장 भनेको दराज हो ✗\n④ 들것 भनेको स्ट्रेचर हो, बिरामी बोक्ने ओछ्यान भएकोले सही उत्तर हो। ✓"}, {"n": "555", "q": "내국인을 구하지 못하여 인력난을 겪고 있는 사업장에 일정한 요건하여 외국인 근로자를 합법적으로 고용할 수 있도록 허가해주는 제도입니다.", "options": ["고용허가제", "외국인 등록제", "최저임금제", "국가세금제"], "answer": 0, "explain": "प्रश्नको अर्थ: स्वदेशी कामदार नपाएका कम्पनीहरूले विदेशी कामदारलाई कानुनी रूपमा काममा राख्न पाउने नियम वा व्यवस्था हो।\n① 고용허가제 भनेको रोजगार अनुमति प्रणाली हो, विदेशी मजदुरलाई कानुनी रूपमा काम गर्न अनुमति दिने प्रणाली भएकोले सही उत्तर हो। ✓\n② 외국인 등록제 भनेको विदेशी दर्ता प्रणाली हो ✗\n③ 최저임금제 भनेको न्यूनतम ज्याला प्रणाली हो ✗\n④ 국가세금제 भनेको राष्ट्रिय कर प्रणाली हो ✗"}, {"n": "556", "q": "원자재나 부품을 가공하여 제품을 만드는 산업을 말합니다. 예를 들어, 자동차, 옷, 가전제품, 식품 등을 공장에서 만들어내는 활동이 모두 제조업에 해당합니다.", "options": ["조선업", "제조업", "건설업", "축산업"], "answer": 1, "explain": "प्रश्नको अर्थ: कच्चा पदार्थ र सामानहरू प्रयोग गरेर कारखानामा नयाँ वस्तुहरू उत्पादन गर्ने उद्योगलाई बुझाउँछ।\n① 조선업 भनेको जहाज निर्माण उद्योग हो ✗\n② 제조업 भनेको उत्पादनमूलक उद्योग हो, वस्तुहरू उत्पादन गर्ने उद्योग भएकोले सही उत्तर हो। ✓\n③ 건설업 भनेको निर्माण उद्योग हो ✗\n④ 축산업 भनेको पशुपालन उद्योग हो ✗"}, {"n": "557", "q": "나무를 심고 기르며 수확하는 산업으로, 산림 자원을 이용해 목재, 버섯, 약초 등을 생산합니다. 자연을 보호하면서 지속 가능한 자원 활용을 목표로 합니다.", "options": ["농업", "광업", "어업", "임업"], "answer": 3, "explain": "प्रश्नको अर्थ: रुख रोपेर हुर्काउने र जङ्गलका काठ तथा अन्य जडीबुटी उत्पादन गर्नेसँग सम्बन्धित क्षेत्र हो।\n① 농업 भनेको कृषि हो ✗\n② 광업 भनेको खानी उद्योग हो ✗\n③ 어업 भनेको माछापालन हो ✗\n④ 임업 भनेको वन पैदावार उद्योग हो, रुख रोक्ने र हुकाउने उद्योग भएकोले सही उत्तर हो। ✓"}, {"n": "558", "q": "땅속에서 석탄, 철, 금, 석유 같은 자원을 채굴하고 가공하는 산업입니다. 주로 광산이나 시추 시설에서 이루어지며, 제조업의 기초 자원을 제공합니다.", "options": ["콘도업", "광업", "어업", "임업"], "answer": 1, "explain": "प्रश्नको अर्थ: जमिनमुनिबाट कोइला, फलाम, सुन जस्ता प्राकृतिक खनिज पदार्थहरू निकाल्ने काम वा क्षेत्र हो।\n① 콘도업 भनेको कडो व्यवसाय हो ✗\n② 광업 भनेको खानी उद्योग हो, जमिनमुनिबाट खनिज निकाल्ने उद्योग भएकोले सही उत्तर हो। ✓\n③ 어업 भनेको माछापालन हो ✗\n④ 임업 भनेको वन उद्योग हो, त्यसैले यो मिल्दैन। (नोट: पुस्तकको फोटो अनुसार विकल्पहरू राखिएको छ।) ✗"}, {"n": "559", "q": "영리를 목적으로 물고기, 조개, 김, 미역 따위를 잡거나 기르는 산업입니다.", "options": ["광업", "농업", "어업", "서비스업"], "answer": 2, "explain": "प्रश्नको अर्थ: नदी, पोखरी वा समुद्रबाट माछा तथा अन्य जलचर प्राणीहरू समात्ने र पाल्ने व्यवसाय हो।\n① 광업 भनेको खानी उद्योग हो ✗\n② 농업 भनेको कृषि हो ✗\n③ 어업 भनेको माछा मार्ने वा पालन गर्ने उद्योग हो, माछा तथा सामुद्रिक जीव समात्ने वा हुकाउने कामलाई जनाउने हुनाले सही उत्तर हो। ✓\n④ 서비스업 भनेको सेवा उद्योग हो ✗"}, {"n": "560", "q": "벼, 밀, 채소, 과일 등 식물을 재배하여 식량이나 자원을 생산하는 산업입니다. 주로 밭이나 논에서 경작하는 활동을 말합니다.", "options": ["광업", "농업", "어업", "서비스업"], "answer": 1, "explain": "प्रश्नको अर्थ: खेतबारीमा धान, मकै, सागसब्जी र फलफूल उमारेर अन्नबाली उत्पादन गर्ने पेसा वा क्षेत्र हो।\n① 광업 भनेको खानी उद्योग हो ✗\n② 농업 भनेको कृषि उद्योग हो, बालीनाला खेती गर्ने उद्योग भएकोले सही उत्तर हो। ✓\n③ 어업 भनेको माछापालन हो ✗\n④ 서비스업 भनेको सेवा उद्योग हो ✗"}, {"n": "561", "q": "소, 돼지, 닭, 양 등 가축을 기르고 키워서 고기, 우유, 달걀 등을 생산하는 산업입니다. 농업 중에서도 동물을 사육하여 식품을 얻는 분야를 말합니다.", "options": ["제조업", "건설업", "축산업", "서비스업"], "answer": 2, "explain": "प्रश्नको अर्थ: गाई, सुँगुर, कुखुरा जस्ता जनावरहरू पालेर मासु, दूध र अण्डा उत्पादन गर्ने काम वा क्षेत्रलाई जनाउँछ।\n① 제조업 भनेको सामान उत्पादन गर्ने उद्योग हो ✗\n② 건설업 भनेको निर्माण गर्ने क्षेत्र हो ✗\n③ 축산업 भनेको पशुपालन गर्ने र पशुजन्य उत्पादन लिने क्षेत्र हो ✓\n④ 서비스업 भनेको सेवामूलक क्षेत्र हो ✗"}, {"n": "562", "q": "건물, 도로, 다리, 터널, 댐 등 구조물을 설계하고 짓는 산업입니다. 사람들이 살거나 일하는 공간과 사회 기반 시설을 만드는 데 중요한 역할을 합니다.", "options": ["건설업", "서비스업", "호텔업", "조선업"], "answer": 0, "explain": "प्रश्नको अर्थ: घर, बाटो, पुल र बाँध जस्ता संरचनाहरू निर्माण गर्ने र बनाउने कामलाई जनाउँछ।\n① 건설업 भनेको भवन, सडक, पुल आदि निर्माण गर्ने क्षेत्र हो ✓\n② 서비스업 भनेको सेवामूलक क्षेत्र हो ✗\n③ 호텔업 भनेको होटल व्यवसाय हो ✗\n④ 조선업 भनेको जहाज निर्माण गर्ने क्षेत्र हो ✗"}, {"n": "563", "q": "근로자와 사업주가 근로 조건을 명확히 정하고 서면으로 체결하는 공식 문서입니다. 노동자의 권리를 보호하고, 근로 조건에 대한 분쟁을 예방하기 위해 사용됩니다.", "options": ["근로계약서", "휴가 신청서", "취업 확인", "입국 신고서"], "answer": 0, "explain": "प्रश्नको अर्थ: कामदार र मालिकबिच कामका नियमहरू स्पष्ट पारेर सही गरिने आधिकारिक कागजातलाई जनाउँछ। यसले कामदारको अधिकार रक्षा गर्छ।\n① 근로계약서 भनेको कामदार र रोजगारदाताबीचको श्रम सम्झौता पत्र हो ✓\n② 휴가 신청서 भनेको बिदाको लागि निवेदन पत्र हो ✗\n③ 취업 확인 भनेको रोजगारी पुष्टि गर्ने कागजात हो ✗\n④ 입국 신고서 भनेको प्रवेश घोषणा पत्र हो ✗"}, {"n": "564", "q": "근로자가 일하고 있는 근무지를 바꾸는 것을 말합니다. 최대 3회까지 허용합니다.", "options": ["체류 기간 연장", "사업장 변경", "외국인 등록", "고용허가제"], "answer": 1, "explain": "प्रश्नको अर्थ: कामदारले आफूले काम गरिरहेको ठाउँ छाडेर अर्को ठाउँमा सर्नु वा फेर्नुलाई जनाउँछ।\n① 체류 기간 연장 भनेको बसोबास अवधि थप गर्नु हो ✗\n② 사업장 변경 भनेको काम गर्ने ठाउँ वा कम्पनी परिवर्तन गर्नु हो ✓\n③ 외국인 등록 भनेको विदेशी दर्ता हो ✗\n④ 고용허가제 भनेको रोजगार अनुमति प्रणाली हो ✗"}, {"n": "565", "q": "근로자와 사업주 간에 체결되는 임금, 근무시간, 휴일, 업무 내용 등을 포함합니다. 이것들은 근로계약서에 명시되어 있으며, 근로자의 권리 보호를 위해 중요합니다.", "options": ["근무 교대", "근무 수칙", "근무 변경", "근무 조건"], "answer": 3, "explain": "प्रश्नको अर्थ: तलब, काम गर्ने समय, बिदा र कामको विवरण जस्ता विषयहरूलाई बुझाउँछ।\n① 근무 교대 भनेको ड्युटी वा सिफ्ट फेर्ने काम हो ✗\n② 근무 수칙 भनेको कामको नियम हो ✗\n③ 근무 변경 भनेको काम परिवर्तन गर्ने हो ✗\n④ 근무 조건 भनेको तलब, काम गर्ने समय आदि काम गर्ने सर्तहरू हुन् ✓"}, {"n": "566", "q": "근로자가 회사에 취직하면 최대 3개월동안 연습으로 일하는 기간이 있습니다. 이 기간 중에는 임금의 90%만 지급받게 됩니다.", "options": ["근로기간", "수습기간", "계약기간", "유효기간"], "answer": 1, "explain": "प्रश्नको अर्थ: नयाँ काम सुरु गर्दा काम सिक्न र अभ्यास गर्न दिइने निश्चित समयलाई जनाउँछ।\n① 근로기간 भनेको श्रम अवधि हो, जसमा कामदारले काम गर्ने कुल समय बुझाउँछ, त्यसैले यो सही उत्तर होइन। ✗\n② 수습기간 भनेको परीक्षण काल हो, जहाँ नयाँ कामदारले अभ्यासको रूपमा काम गर्छ र ९० प्रतिशत तलब पाउँछ, त्यसैले यो विवरणसँग मिल्छ। ✓\n③ 계약기간 भनेको सम्झौता अवधि हो, जुन सम्झौतामा तोकिएको काम गर्ने समय हो, त्यसैले यो सही उत्तर होइन। ✗\n④ 유효기간 भनेको म्याद रहने समय हो, त्यसैले यो सही उत्तर होइन। ✗"}, {"n": "567", "q": "재직기간을 끝내고 본국에 돌아간 사람이 다시 취직하게 된 것을 말합니다.", "options": ["재발급", "재취업", "재활용", "재정착"], "answer": 1, "explain": "प्रश्नको अर्थ: स्वदेश फर्किसकेपछि दोहोर्याएर पुनः काममा लाग्ने अवस्थालाई जनाउँछ।\n① 재발급 भनेको पुनः जारी गर्नु हो ✗\n② 재취업 भनेको कार्यकाल सकिएर स्वदेश गएको व्यक्तिले पुनः रोजगारी पाउनु हो ✓\n③ 재활용 भनेको पुनः प्रयोग गर्नु हो ✗\n④ 재정착 भनेको पुनः बसोबास गर्नु हो ✗"}, {"n": "568", "q": "근로자가 일한 시간이나 일에 대해 지급되는 고정된 급여로, 수당이나 보너스를 제외한 임금을 말합니다.", "options": ["보험금", "지급액", "기본급", "공제액"], "answer": 2, "explain": "प्रश्नको अर्थ: थप भत्ता नजोडी काम गरेबापत पाइने तोकिएको निश्चित रकमलाई बुझाउँछ।\n① 보험금 भनेको बिमा रकम हो, जुन दुर्घटना वा क्षति हुँदा पाइने रकम हो, त्यसैले यो सही उत्तर होइन। ✗\n② 지급액 भनेको कुल भुक्तानी रकम हो, त्यसैले यो सही उत्तर होइन। ✗\n③ 기본급 भनेको आधारभूत तलब हो, जसमा भत्ता वा बोनस बाहेकको तोकिएको मुख्य तलब पर्दछ, त्यसैले यो विवरणसँग मिल्छ। ✓\n④ 공제액 भनेको कट्टी रकम हो, जुन तलबबाट काटिने रकम हो, त्यसैले यो सही उत्तर होइन। ✗"}, {"n": "569", "q": "개인이나 법인이 일정한 소득을 얻었을 때 내는 국세입니다. 근로자의 경우 월급에서 자동으로 공제되며, 소득이 많을수록 이것도 더 많아집니다.", "options": ["상여금", "주민세", "소득세", "공과금"], "answer": 2, "explain": "प्रश्नको अर्थ: मानिस वा कम्पनीले कमाएको आम्दानीबाट सरकारलाई बुझाउनुपर्ने करलाई जनाउँछ।\n① 상여금 भनेको बोनस हो ✗\n② 주민세 भनेको स्थानीय बासिन्दा कर हो ✗\n③ 소득세 भनेको आम्दानीमा लाग्ने कर हो, जसलाई तलबबाट काटिन्छ र आम्दानी धेरै भए यो पनि बढ्छ ✓\n④ 공과금 भनेको उपयोगिता शुल्क हो ✗"}, {"n": "570", "q": "고용자가 근로자에게 정해진 봉급 이외에 여러 제목에 추가 일한 것에 대해 따로 주는 보수금입니다.", "options": ["보너스", "수당", "세금", "월급"], "answer": 1, "explain": "प्रश्नको अर्थ: तोकिएको नियमित रकमबाहेक थप काम गरेबापत छुट्टै पाइने रकमलाई बुझाउँछ।\n1. 보너스 भनेको अतिरिक्त काम वा विशेष अवसरमा दिने थप रकम हो, तर यहाँ सु당 भन्न खोजिएको होइन। (नोट: यहाँ विकल्प 1 लाई बोनस भनिए पनि प्रश्नले अतिरिक्त कामको पारिश्रमिक अर्थात् 수당 बुझाउँछ)। 2. 수당 भनेको नियमित तलब बाहेक अतिरिक्त काम गरेबापत दिने भत्ता वा पारिश्रमिक हो, त्यसैले यो सही उत्तर हो। 3. 세금 भनेको कर हो, त्यसैले यो मिल्दैन। 4. 월급 भनेको मासिक तलब हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 수당 हो जसको अर्थ भत्ता वा अतिरिक्त परिश्रमिक हो।"}, {"n": "571", "q": "지방자치단체에 내는 세금으로, 해당 지역에 거주하거나 사업장을 둔 사람에게 부과됩니다.", "options": ["기본급", "주민세", "소득세", "공과금"], "answer": 1, "explain": "प्रश्नको अर्थ: आफू बसोबास गरेको वा काम गरेको स्थानीय क्षेत्रमा बुझाउनुपर्ने करलाई जनाउँछ।\n① 기본급 भनेको आधारभूत तलब हो ✗\n② 주민세 भनेको स्थानीय सरकारलाई तिर्ने कर हो जुन उक्त क्षेत्रमा बसोबास गर्ने वा व्यवसाय गर्नेलाई लगाइन्छ ✓\n③ 소득세 भनेको आम्दानी कर हो ✗\n④ 공과금 भनेको उपयोगिता शुल्क हो ✗"}, {"n": "572", "q": "한국인이나 외국인 모두 가입해야 하는 보험으로 의료비 부담을 덜고 1년에 한 번씩 건강검진도 받을 수 있습니다.", "options": ["산재보험", "고용보험", "건강보험", "보증보험"], "answer": 2, "explain": "प्रश्नको अर्थ: अस्पताल जाँदा लाग्ने उपचार खर्च कम गर्न र नियमित स्वास्थ्य जाँच गराउन सहयोग पुर्याउने व्यवस्थालाई जनाउँछ।\n① 산재보험 भनेको औद्योगिक दुर्घटना बिमा हो ✗\n② 고용보험 भनेको रोजगारी बिमा हो ✗\n③ 건강보험 भनेको स्वास्थ्य बिमा हो जसले उपचार खर्च कम गर्न र वर्षको एक पटक स्वास्थ्य परीक्षण गर्न मद्दत गर्छ ✓\n④ 보증보험 भनेको ग्यारेन्टी बिमा हो ✗"}, {"n": "573", "q": "월급의 총액에서 공제될 금액을 모두 뺀 다음 근로자가 실제로 받는 급여입니다.", "options": ["국민연금", "공제총액", "연말정산", "실수령액"], "answer": 3, "explain": "प्रश्नको अर्थ: कर र अन्य रकम कट्टी गरिसकेपछि कामदारले अन्तिममा हात पार्ने रकमलाई जनाउँछ।\n① 국민연금 भनेको राष्ट्रिय पेन्सन हो ✗\n② 공제총액 भनेको कट्टा गरिएको कुल रकम हो ✗\n③ 연말정산 भनेको वर्षको अन्त्यमा गर्ने कर फछ््यौट हो ✗\n④ 실수령액 भनेको कुल तलबबाट सबै कर र शुल्कहरू काटेपछि कामदारले वास्तवमा हातमा पाउने रकम हो ✓"}, {"n": "574", "q": "근로자에게 지급해야할 총액에서 보험과 세금 같은 일정한 금액이나 수량을 빼는 것입니다.", "options": ["월급", "가불", "공제", "보너스"], "answer": 2, "explain": "प्रश्नको अर्थ: कुल रकमबाट कर वा अन्य खर्चबापत रकम घटाउने वा काट्ने प्रक्रियालाई बुझाउँछ।\n① 월급 भनेको मासिक तलब हो ✗\n② 가불 भनेको पेस्की लिनु हो ✗\n③ 공제 भनेको कुल रकमबाट बिमा, कर जस्ता निश्चित रकम वा परिमाण काट्ने वा घटाउने काम हो ✓\n④ 보너스 भनेको बोनस हो ✗"}, {"n": "575", "q": "사고가 일어날 경우를 대비하여, 미리 일정한 돈을 적립해 두었다가 사고를 당한 사람에게 일정 금액을 주어 손해를 보상하는 제도입니다.", "options": ["월급", "보험", "세금", "수당"], "answer": 1, "explain": "प्रश्नको अर्थ: भविष्यमा हुन सक्ने दुर्घटना वा क्षतिपूर्तिको लागि पहिले नै पैसा जम्मा गरिने प्रणालीलाई जनाउँछ।\n① 월급 भनेको मासिक तलब हो, तर यसले दुर्घटना हुँदा क्षतिपूर्ति दिने प्रणालीलाई जनाउँदैन। ✗\n② 보험 भने कर कार्यालयबाट पाइने आधिकारिक दर्ता प्रमाणपत्रलाई जनाउँछ।\n① 근로계약서 भनेको श्रम सम्झौता पत्र हो ✗\n② 외국인등록증 भनेको विदेशी परिचय पत्र हो ✗\n③ 연말정산 भनेको वर्षको अन्त्यमा गरिने कर हिसाब मिलान हो ✗\n④ 사업자등록증 भनेको व्यवसाय दर्ता प्रमाणपत्र हो जसले कर कार्यालयमा व्यवसाय दर्ता गरेको कुरा प्रमाणित गर्छ, त्यसैले यो सही उत्तर हो। सहि उत्तर 사업자등록증 हो जसको अर्थ व्यवसाय दर्ता प्रमाणपत्र हो। किताबमा दोस्रो विकल्प '외국이등록증' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '외국인등록증' हो। ✓"}, {"n": "580", "q": "시청, 구청, 주민센터, 출입국관리사무소 같은 국가나 지방의 행정을 맡아 보는 여러 기관을 말합니다.", "options": ["관공서", "소방서", "경찰서", "여행사"], "answer": 0, "explain": "प्रश्नको अर्थ: सरकारी सेवा र प्रशासनिक कामहरू गर्ने विभिन्न कार्यालय वा निकायहरूलाई बुझाउँछ।\n① 관공서 भनेको सरकारी कार्यालय हो जसमा महानगरपालिका, वडा कार्यालय र अध्यागमन कार्यालय जस्ता प्रशासनिक निकायहरू पर्छन् ✓\n② 소방서 भनेको दमकल कार्यालय वा अग्नि नियन्त्रण कार्यालय हो ✗\n③ 경찰서 भनेको प्रहरी कार्यालय हो ✗\n④ 여행사 भनेको ट्राभल एजेन्सी वा यात्रा कम्पनी हो, त्यसैले यो मिल्दैन। सहि उत्तर 관공서 हो जसको अर्थ सरकारी कार्यालय हो। ✗"}, {"n": "581", "q": "외국인이 다른 나라에 머무를 수 있도록 허가받은 기간을 말합니다. 비자에 따라 정해지며, 이 기간이 지나면 출국하거나 연장 절차를 거쳐야 합니다.", "options": ["계약기간", "체류기간", "수습기간", "임명기간"], "answer": 1, "explain": "प्रश्नको अर्थ: विदेशी नागरिकलाई अर्को देशमा बस्नका लागि अनुमति दिइएको समयावधिलाई बुझाउँछ। यो अवधि सकिएपछि आफ्नो देश फर्कनुपर्छ वा म्याद थप्नुपर्छ।\n① 계약기간 भनेको सम्झौता अवधि हो ✗\n② 체류기간 भनेको विदेशीले देशमा बस्न पाउने अवधि वा भिसाको म्याद हो ✓\n③ 수습기간 भनेको काम सिक्ने वा परीक्षण अवधि हो ✗\n④ 임명기간 भनेको नियुक्ति अवधि हो, त्यसैले यो मिल्दैन। सहि उत्तर 체류기간 हो जसको अर्थ बसोबास अवधि वा बसाइको म्याद हो। ✗"}, {"n": "582", "q": "특별한 사정으로 운영하고 있는 사업이나 영업을 영구적으로 그만두는 것입니다.", "options": ["폐업", "휴업", "취업", "실업"], "answer": 0, "explain": "प्रश्नको अर्थ: विशेष कारणले गर्दा आफूले चलाइरहेको व्यापार वा कामलाई स्थायी रूपमा सधैँका लागि बन्द गर्ने कार्यलाई जनाउँछ।\n① 폐업 भनेको व्यवसाय वा पसल स्थायी रूपमा बन्द गर्नु हो ✓\n② 휴업 भनेको अस्थायी रूपमा व्यवसाय बन्द गर्नु हो ✗\n③ 취업 भनेको रोजगारी पाउनु वा काममा लाग्नु हो ✗\n④ 실업 भनेको बेरोजगार हुनु हो, त्यसैले यो मिल्दैन। सहि उत्तर 폐업 हो जसको अर्थ स्थायी रूपमा व्यवसाय बन्द गर्नु हो। ✗"}, {"n": "583", "q": "외국인이 한국에 90일 이상 체류할 경우 반드시 발급받아야 하는 신분증입니다. 이것에는 이름, 국적, 체류 자격, 체류 기간, 주소 등이 기재되어 있습니다.", "options": ["학생증", "사원증", "방문증", "외국인동록증"], "answer": 3, "explain": "प्रश्नको अर्थ: कोरियामा ९० दिनभन्दा बढी बस्ने विदेशीले अनिवार्य रूपमा बनाउनुपर्ने परिचयपत्र हो। यसमा नाम, राष्ट्रियता र ठेगाना जस्ता विवरणहरू लेखिएका हुन्छन्।\nपहिलो विकल्प 학생증 भनेको विद्यार्थी परिचय पत्र हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 사원증 भनेको कर्मचारी परिचय पत्र हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 방문증 भनेको आगन्तुक पास वा परिचय पत्र हो, त्यसैले यो मिल्दैन। चौथो विकल्प 외국인등록증 (बुकमा छाप्दा झुकिएर 외국인동록증 भएको) भनेको विदेशी दर्ता प्रमाणपत्र वा परिचय पत्र हो जुन ९० दिनभन्दा बढी बस्ने विदेशीलाई दिइन्छ, त्यसैले यो सही उत्तर हो। सहि उत्तर 외국인등록증 हो जसको अर्थ विदेशी परिचय पत्र हो।"}, {"n": "584", "q": "업무상 사유로 부상을 당하거나 질병에 걸린 근로자는 요양으로 일하지 못한 기간에 대해 평균 임금의 70%를 지급 받는 금액입니다.", "options": ["병원비", "휴업급여", "치료비", "장해 보상금"], "answer": 1, "explain": "प्रश्नको अर्थ: कामको सिलसिलामा चोटपटक लाग्दा वा बिरामी पर्दा उपचारका कारण काम गर्न नसकेको समयमा पाइने रकम हो। यसमा औसत तलबको निश्चित प्रतिशत रकम पाइन्छ।\n① 병원비 भनेको अस्पतालको खर्च हो ✗\n② 휴업급여 भनेको कामदारले काम गर्न नपाएको अवधिको लागि पाइने क्षतिपूर्ति वा ज्याला हो ✓\n③ 치료비 भनेको उपचार खर्च हो ✗\n④ 장해 보상금 भनेको अंगभंग क्षतिपूर्ति रकम हो, त्यसैले यो मिल्दैन। सहि उत्तर 휴업급여 हो जसको अर्थ काम गर्न नसकेको अवधिको क्षतिपूर्ति हो। ✗"}, {"n": "585", "q": "사업이나 영업, 작업 따위를 일시적으로 중단하는 것을 말합니다.", "options": ["폐업", "갱신", "휴업", "변경"], "answer": 2, "explain": "प्रश्नको अर्थ: कुनै व्यापार वा कामलाई स्थायी रूपमा नभई केही समयका लागि मात्र अस्थायी रूपमा रोक्ने कार्यलाई बुझाउँछ।\n① 폐업 भनेको स्थायी रूपमा व्यवसाय बन्द गर्नु हो ✗\n② 갱신 भनेको नवीकरण गर्नु हो ✗\n③ 휴업 भनेको अस्थायी रूपमा व्यवसाय वा काम बन्द गर्नु हो ✓\n④ 변경 भनेको परिवर्तन गर्नु हो, त्यसैले यो मिल्दैन। सहि उत्तर 휴업 हो जसको अर्थ अस्थायी रूपमा काम बन्द गर्नु हो। ✗"}, {"n": "586", "q": "늙거나 사고 등으로 일을 할 수 없을 때 납입한 보험금을 지급해 주는 사회 보장 제도로 외국인 근로자는 귀국 후 일시금으로 지급 받을 수 있는 보험입니다.", "options": ["건강보험", "고용보험", "국민연금", "산재보험"], "answer": 2, "explain": "प्रश्नको अर्थ: उमेर ढल्केपछि वा दुर्घटनाका कारण काम गर्न नसक्दा पहिले तिरेको रकम फिर्ता पाइने सामाजिक सुरक्षा योजना हो। विदेशी श्रमिकले आफ्नो देश फर्कँदा यो रकम एकैपटक पाउँछन्।\n① 건강보험 भनेको स्वास्थ्य बीमा हो ✗\n② 고용보험 भनेको रोजगारी बीमा हो ✗\n③ 국민연금 भनेको राष्ट्रिय पेन्सन हो जसमा बुढेसकाल वा दुर्घटनामा काम गर्न नसक्दा रकम पाइन्छ र विदेशी कामदारले स्वदेश फर्कँदा एकमुस्ट लिन सक्छन् ✓\n④ 산재보험 भनेको औद्योगिक दुर्घटना बीमा हो, त्यसैले यो मिल्दैन। सहि उत्तर 국민연금 हो जसको अर्थ राष्ट्रिय पेन्सन हो। ✗"}, {"n": "587", "q": "일하다가 업무상 재해에 대한 보상이나 요양을 위해 가입해야 하는 보험입니다.", "options": ["상해보험", "고용보험", "건강보험", "산재보험"], "answer": 3, "explain": "प्रश्नको अर्थ: काम गर्दा हुने दुर्घटना वा चोटपटकको क्षतिपूर्ति र उपचार खर्च पाउनका लागि अनिवार्य रूपमा लिनुपर्ने सुरक्षा योजना हो।\n① 상해보험 भनेको दुर्घटना बीमा हो ✗\n② 고용보험 भनेको रोजगारी बीमा हो ✗\n③ 건강보험 भनेको स्वास्थ्य बीमा हो ✗\n④ 산재보험 भनेको औद्योगिक दुर्घटना बीमा हो जुन काम गर्दा हुने दुर्घटनाको क्षतिपूर्ति र उपचारको लागि अनिवार्य हुन्छ, त्यसैले यो सही उत्तर हो। सहि उत्तर 산재보험 हो जसको अर्थ औद्योगिक दुर्घटना बीमा हो। ✓"}, {"n": "588", "q": "외국인 근로자의 업무상 재해 이외에 질병, 교통사고나 사망 등을 위하여 가입해야 하는 보험입니다.", "options": ["보증보험", "고용보험", "건강보험", "상해보험"], "answer": 3, "explain": "प्रश्नको अर्थ: कामको सिलसिलामा बाहेक अन्य व्यक्तिगत बिरामी, सवारी दुर्घटना वा मृत्यु जस्ता अवस्थामा क्षतिपूर्ति पाउनका लागि गरिने सुरक्षा योजना हो।\n① 보증보험 भनेको ग्यारेन्टी बीमा हो, जसले सम्झौता पूरा नगर्दा हुने नोक्सानीको सुरक्षा गर्छ, त्यसैले यो सही होइन। ✗\n② 고용보험 भनेको रोजगार बीमा हो, जसले बेरोजगारीको समयमा सहयोग गर्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 건강보험 भनेको स्वास्थ्य बीमा हो, जसले अस्पतालको उपचार खर्चमा सहयोग गर्छ, त्यसैले यो गैर-व्यावसायिक दुर्घटना वा मृत्युको बीमा होइन। ✗\n④ 상해보험 भनेको चोटपटक वा दुर्घटना बीमा हो, जसले काम बाहेकका रोग, सवारी दुर्घटना वा मृत्यु आदिको सुरक्षा दिन्छ ✓"}, {"n": "589", "q": "근로자가 실직했을 때 생계 안정을 지원하고, 재취업을 돕기 위해 국가가 운영하는 사회보험 제도입니다.", "options": ["보증보험", "고용보험", "건강보험", "상해보험"], "answer": 1, "explain": "प्रश्नको अर्थ: कामदारले रोजगार गुमाउँदा जीवनयापनमा सहयोग पुर्याउन र नयाँ काम खोज्न मद्दत गर्न सरकारले चलाएको सामाजिक सुरक्षा योजना हो।\n① 보증보험 भनेको ग्यारेन्टी बीमा हो ✗\n② 고용보험 भनेको रोजगारी बीमा हो जुन काम गुमाउँदा जीवन निर्वाहमा सहयोग गर्न र पुनः रोजगारी पाउन राज्यले चलाउने बीमा हो ✓\n③ 건강보험 भनेको स्वास्थ्य बीमा हो ✗\n④ 상해보험 भनेको दुर्घटना बीमा हो, त्यसैले यो मिल्दैन। सहि उत्तर 고용보험 हो जसको अर्थ रोजगारी बीमा हो। ✗"}, {"n": "590", "q": "외국인근로자의 고용 등에 관한 법률에 따라 외국인근로자를 고용한 사업장의 사업주를 말합니다.", "options": ["취업자", "고용자", "재직자", "근로자"], "answer": 1, "explain": "प्रश्नको अर्थ: नियम अनुसार विदेशी कामदारलाई आफ्नो कम्पनीमा काममा लगाउने मालिक वा रोजगारदातालाई बुझाउँछ।\n① 취업자 भनेको रोजगारी पाएको व्यक्ति वा कामदार हो ✗\n② 고용자 भनेको रोजगारदाता वा मालिक हो जसले कामदारलाई काममा राखेको हुन्छ ✓\n③ 재직자 भनेको बहालवाला कर्मचारी वा अहिले काम गरिरहेको व्यक्ति हो ✗\n④ 근로자 भनेको कामदार वा श्रमिक हो, त्यसैले यो मिल्दैन। सहि उत्तर 고용자 हो जसको अर्थ रोजगारदाता हो। ✗"}, {"n": "591", "q": "근로자가 회사를 그만둘 때 지급받는 금액으로, 근로기간에 따라 산정됩니다. 보통 1년 이상 근속한 근로자에게 지급되며, 마지막 급여를 기준으로 계산됩니다.", "options": ["상여금", "퇴직금", "보너스", "기본급"], "answer": 1, "explain": "प्रश्नको अर्थ: कामदारले कम्पनी छोड्दा काम गरेको समयको आधारमा हिसाब गरेर पाइने रकम हो। सामान्यतया एक वर्षभन्दा बढी काम गरेका कामदारलाई यो रकम दिइन्छ।\n① 상여금 भनेको बोनस वा अतिरिक्त प्रोत्साहन भत्ता हो, जुन कामको राम्रो प्रदर्शनको आधारमा दिइन्छ तर यो काम छोड्दा पाइने निश्चित रकम होइन, त्यसैले यो मिलेन। ✗\n② 퇴직금 भनेको कामदारले कम्पनी छाड्दा काम गरेको अवधिको आधारमा पाइने रकम हो र यो अन्तिम तलबको आधारमा हिसाब गरिन्छ ✓\n③ 보너스 भनेको बोनस हो, जुन चाडपर्व वा विशेष अवसरमा पाइन्छ तर यो काम छाड्ने बेलामा मात्र हिसाब गरिने रकम होइन, त्यसैले यो मिलेन। ✗\n④ 기본급 भनेको आधारभूत तलब हो, जुन महिनाभरि काम गरेबापत नियमित रूपमा पाइन्छ, त्यसैले यो मिलेन। ✗"}, {"n": "592", "q": "외국인 근로자가 사업장 이탈 없이 1년 이상 근무 후 출국할 때 퇴직금으로 받을 수 있는 보험을 말합니다.", "options": ["연금보험 const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-12';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Renders the explanation as a structured list: the explanation string is
// lines separated by "\n" — first line is the question's own meaning
// ("प्रश्नको अर्थ: ..."), then one line per option ("① <word> ... ✓/✗").
// Lines render as separate rows; the ✓ line gets a green tint and the ✓/✗
// marker is coloured. Explanations without line breaks (fallback prose)
// render as a single paragraph, exactly as before. Uses text nodes only,
// never innerHTML, so explanation text is never parsed as markup.
function renderExplain(box, explain) {
  const lines = (explain || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length <= 1) {
    const b = document.createElement('b');
    b.textContent = 'किन? ';
    box.appendChild(b);
    const s = document.createElement('span');
    s.textContent = explain;
    box.appendChild(s);
    return;
  }
  const label = document.createElement('div');
  label.className = 'explain-label';
  label.textContent = 'व्याख्या';
  box.appendChild(label);
  lines.forEach((ln, li) => {
    const d = document.createElement('div');
    if (li === 0 && ln.indexOf('प्रश्नको अर्थ') === 0) {
      d.className = 'explain-stem';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    if (ln.indexOf('शिक्षकको उत्तर-पत्र:') === 0) {
      d.className = 'exp-note';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    const mark = ln.endsWith('✓') ? '✓' : (ln.endsWith('✗') ? '✗' : '');
    const body = mark ? ln.slice(0, -1).trim() : ln;
    d.className = 'exp-line' + (mark === '✓' ? ' exp-ok' : '');
    d.appendChild(document.createTextNode(body + (mark ? ' ' : '')));
    if (mark) {
      const m = document.createElement('span');
      m.className = 'exp-mark ' + (mark === '✓' ? 'ok' : 'no');
      m.textContent = mark;
      d.appendChild(m);
    }
    box.appendChild(d);
  });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    renderExplain(card.querySelector('.explain'), q.explain);
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
