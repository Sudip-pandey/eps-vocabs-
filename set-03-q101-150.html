<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPS-TOPIK Vocabulary Quiz — Set 03 (Q101–Q150)</title>
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --green: #188038;
    --green-bg: #e6f4ea;
    --red: #d93025;
    --red-bg: #fce8e6;
    --bg: #f0f4f9;
    --card: #ffffff;
    --text: #1f1f1f;
    --muted: #5f6368;
    --border: #dadce0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--primary); font-weight: 700; font-size: .95rem; padding: 10px 20px; border-radius: 999px; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.18); margin-bottom: 12px; transition: transform .15s, box-shadow .15s; }
  .back-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.22); }
  header { background: var(--primary); color: #fff; padding: 20px 16px 16px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .header-inner { max-width: 760px; margin: 0 auto; }
  header h1 { font-size: 1.35rem; line-height: 1.3; }
  header p { opacity: .9; font-size: .9rem; margin-top: 2px; }
  .progress-wrap { margin-top: 12px; background: rgba(255,255,255,.25); border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-bar { height: 100%; background: #fff; width: 0%; transition: width .3s; }
  .progress-text { font-size: .82rem; margin-top: 6px; opacity: .95; }
  .autosave-note { font-size: .78rem; margin-top: 4px; opacity: .85; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 80px; }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .q-card.answered { border-left: 4px solid var(--primary); }
  .q-num { font-size: .8rem; font-weight: 700; color: var(--primary); letter-spacing: .02em; }
  .q-text { font-size: 1.08rem; white-space: pre-line; margin: 8px 0 14px; line-height: 1.8; }
  .options label { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: background .15s, border-color .15s; font-size: 1.02rem; }
  .options label:hover { background: #f8f9fa; border-color: var(--primary); }
  .options input { margin-top: 5px; accent-color: var(--primary); width: 18px; height: 18px; flex: none; }
  .options label.selected { background: #e8f0fe; border-color: var(--primary); }
  .ul { text-decoration: underline; text-underline-offset: 2px; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 600; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 11px 22px; font-weight: 600; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: #a8c7fa; cursor: not-allowed; }
  .btn-ghost { background: #fff; color: var(--primary); border: 1px solid var(--border); }
  .submit-bar { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,.08); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 20px; text-align: center; margin-bottom: 20px; }
  .score-card .big { font-size: 2.6rem; font-weight: 800; color: var(--primary); line-height: 1.1; }
  .score-card .pct { font-size: 1.1rem; color: var(--muted); margin-top: 4px; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 8px 16px; }
  .filters button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .review-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 14px; }
  .review-card.correct { border-left: 5px solid var(--green); }
  .review-card.wrong { border-left: 5px solid var(--red); }
  .verdict { font-weight: 700; font-size: .95rem; margin-bottom: 6px; }
  .verdict.ok { color: var(--green); }
  .verdict.no { color: var(--red); }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; }
  .rev-opt-correct { background: var(--green-bg); border-color: var(--green); }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: var(--red); }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: var(--green); color: #fff; }
  .badge-mine { background: var(--green); color: #fff; }
  .badge-mine-wrong { background: var(--red); color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #f8f9fa; border-radius: 8px; padding: 12px 14px; margin-top: 10px; font-size: .96rem; }
  .explain b { color: var(--primary-dark); }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.15rem; }
    .q-text { font-size: 1rem; }
    .submit-bar .hint { display: none; }
  }
  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    .back-btn { padding: 6px 14px; font-size: .85rem; margin-bottom: 8px; }
    header h1 { font-size: 1.05rem; line-height: 1.25; }
    header p { font-size: .78rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .75rem; margin-top: 4px; }
    .autosave-note { font-size: .7rem; margin-top: 2px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">&larr; Back to All Sets</a>
    <h1>EPS-TOPIK 문제은행 Quiz</h1>
    <p>Set 3 of 11 &bull; Questions 101–150 &bull; 50 questions &bull; EPS-TOPIK Vocabulary &mdash; answers are AI-generated (no answer key in the book) &mdash; check with a teacher &bull; Explanations in Nepali</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">0 / 50 answered</div>
    <div class="autosave-note">Progress will be auto-saved.</div>
  </div>
</header>

<main id="quizView">
  <div id="questionList"></div>
  <div class="pager">
    <button class="btn-ghost" id="prevBtn">&larr; Previous</button>
    <span class="page-info" id="pageInfo"></span>
    <button class="btn-ghost" id="nextBtn">Next &rarr;</button>
  </div>
</main>

<div class="submit-bar" id="submitBar">
  <div class="inner">
    <span class="hint" id="submitHint">Answer all 50, then submit.</span>
    <div style="display:flex; gap:8px; flex:none;">
      <button class="btn-ghost" id="clearBtn" style="padding:11px 16px;">Clear all</button>
      <button class="btn-primary" id="submitBtn">Submit Quiz</button>
    </div>
  </div>
</div>

<main id="resultView" class="hidden">
  <div class="score-card">
    <div class="big" id="scoreBig"></div>
    <div class="pct" id="scorePct"></div>
    <div class="msg" id="scoreMsg"></div>
    <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-primary" id="retryBtn">Try Again</button>
      <button class="btn-ghost" id="reviewTopBtn">Back to top</button>
    </div>
  </div>
  <div class="filters">
    <button class="btn-ghost active" data-filter="all">All questions</button>
    <button class="btn-ghost" data-filter="wrong">Wrong only</button>
    <button class="btn-ghost" data-filter="correct">Correct only</button>
  </div>
  <div id="reviewList"></div>
</main>

<script>
const QUESTIONS = [{"n": "101", "q": "된장(된장 발효된 콩)을 넣고 끓인 국물 요리이고 보통 두부, 야채, 고기 등을 함께 넣어 맛을 내며, 구수하고 건강한 맛이 특징입니다.", "options": ["닭도리탕", "삼계탕", "된장찌개", "김치찌개"], "answer": 2, "explain": "पहिलो विकल्प 닭도리탕 को अर्थ डक्ताोरिताङ हो। दोस्रो विकल्प 삼계탕 को अर्थ साम्येतं हो। तेस्रो विकल्प 된장찌개 को अर्थ थेन्जाङ्찌गे हो जुन भटमासको पेस्ट (थेन्जाङ) हालेर बनाइने झोल परिकार हो र यसमा तोफु, तरकारी आदि मिसाइन्छ, त्यसैले यो सही उत्तर हो। चौथो विकल्प 김치찌개 को अर्थ किम्ची찌गे हो। तसर्थ, सही उत्तर 된장찌개 हो जसको अर्थ थेन्जाङ्찌गे (भटमासको पेस्टको सुप) हुन्छ।"}, {"n": "102", "q": "잘 익은 김치를 주 재료로 한 한국의 전통 찌개로 돼지고기나 두부, 야채 등을 넣고 끓여 먹는 매콤하고 국물이 많은 음식입니다.", "options": ["감자탕", "갈비탕", "된장찌개", "김치찌개"], "answer": 3, "explain": "पहिलो विकल्प 감자탕 को अर्थ कामजाथाङ हो। दोस्रो विकल्प 갈비탕 को अर्थ काल्भिथाङ हो। तेस्रो विकल्प 된장찌개 को अर्थ थेन्जाङ्찌गे हो। चौथो विकल्प 김치찌개 को अर्थ किम्ची찌गे हो जुन पाकेको किम्ची मुख्य सामग्री, तोफु र सुँगुरको मासु हालेर उमालेको पिरो र झोलयुक्त परिकार हो, त्यसैले यो सही उत्तर हो। तसर्थ, सही उत्तर 김치찌개 हो जसको अर्थ किम्ची찌गे हुन्छ।"}, {"n": "103", "q": "끓는 물에 면과 스프를 넣어 간단하게 만드는 즉석 국수이고 매운 맛이나 순한 맛 등 다양한 종류가 있어, 빠르고 맛있게 먹을 수 있는 음식입니다.", "options": ["라면", "만두", "잡채", "간장"], "answer": 0, "explain": "पहिलो विकल्प 라면 को अर्थ राम्युन (इन्स्ट्यान्ट चाउचाउ) हो जुन उम्लिएको पानीमा चाउचाउ र मसला हालेर सजिलै बनाइने र छिटो खान सकिने परिकार हो, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 만두 को अर्थ मोमो/मान्दु हो। तेस्रो विकल्प 잡채 को अर्थ चाप्चे हो। चौथो विकल्प 간장 को अर्थ सोया सस हो। तसर्थ, सही उत्तर 라면 हो जसको अर्थ राम्युन हुन्छ।"}, {"n": "104", "q": "배추 또는 무 등을 소금에 절여서 고춧가루, 파, 마늘, 생강 등의 양념을 버무린 뒤 발효시킨 음식입니다.", "options": ["잡채", "김밥", "만두", "김치"], "answer": 3, "explain": "पहिलो विकल्प 잡채 को अर्थ चाप्चे हो। दोस्रो विकल्प 김밥 को अर्थ किम्बाब हो। तेस्रो विकल्प 만두 को अर्थ मान्दु हो। चौथो विकल्प 김치 को अर्थ किम्ची हो जुन बन्दाकोबी वा मुलालाई नुनमा गलाएर खुर्सानीको धुलो, लसुन, अदुवा आदि मसला मिसाई किण्वन (फमेन्टेशन) गरेर बनाइएको परिकार हो, त्यसैले यो सही उत्तर हो। तसर्थ, सही उत्तर 김치 हो जसको अर्थ किम्ची हुन्छ।"}, {"n": "105", "q": "소금과 참기름으로 맛을 낸 밥을 시금치, 단무지, 당근, 달걀 등 속재료를 넣고 김으로 말아서 입의 크기로 썰어 낸 음식입니다.", "options": ["김밥", "만두", "김치", "잡채"], "answer": 0, "explain": "पहिलो विकल्प 김밥 को अर्थ किम्बाब हो जुन नुन र तिलको तेलले स्वाद सुधारेको भातमा पालक, मुलाको अचार (दानमुजी), गाजर, अण्डा आदि सामग्री राखेर समुद्री लेउ (किम) ले बेरेर मुखको आकारमा काटेको परिकार हो, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 만두 को अर्थ मान्दु हो। तेस्रो विकल्प 김치 को अर्थ किम्ची हो। चौथो विकल्प 잡채 को अर्थ चाप्चे हो। तसर्थ, सही उत्तर 김밥 हो जसको अर्थ किम्बाब हुन्छ।"}, {"n": "106", "q": "중국에서 유래한 한국의 인기 있는 면 요리예요. 고소한 짜장 소스에 면을 비벼 먹으며, 보통 돼지고기와 채소가 들어갑니다.", "options": ["라면", "돈가스", "자장면", "탕수육"], "answer": 2, "explain": "1. 라면 भनेको चाउचाउ हो, यो विवरणसँग मिल्दैन। 2. 돈가스 भनेको सुँगुरको मासुको कटलेट हो, यो सही उत्तर होइन। 3. 자장면 भनेको कालो सससँग मिसाएर खाने चिनियाँ शैलीको चाउचाउ हो, त्यसैले यो सही उत्तर हो। 4. 탕수육 भनेको गुलियो र अमिलो सस भएको सुँगुरको मासु हो, यो मिल्दैन। सही उत्तर 3 नम्बरको자장면 हो जसको अर्थ जाजाङम्योन (चाउचाउ) हो।"}, {"n": "107", "q": "물건을 사거나 서비스를 이용한 후, 지불한 금액과 내용을 적어 주는 문서입니다.", "options": ["청구서", "영수증", "자격증", "신분증"], "answer": 1, "explain": "1. 청구서 भनेको बिल वा भुक्तानीको माग गर्ने कागजात हो, यो विवरणसँग मिल्दैन। 2. 영수증 भनेको सामान किनेपछि रकम र विवरण लेखेर दिने रसिद हो, त्यसैले यो सही उत्तर हो। 3. 자격증 भनेको योग्यताको प्रमाणपत्र हो, यो मिल्दैन। 4. 신분증 भनेको परिचय पत्र हो, यो मिल्दैन। सही उत्तर 2 नम्बरको영수증 हो जसको अर्थ रसिद हो।"}, {"n": "108", "q": "밥과 함께 먹는 작은 양의 음식으로, 다양한 종류가 있고 김치, 나물, 찌개 등 여러 가지로 함께 먹으면서 밥을 맛있게 즐길 수 있습니다.", "options": ["음료", "반찬", "후식", "비채식"], "answer": 1, "explain": "음료 भनेको पेय पदार्थ हो, यो भातसँग खाइने मुख्य तरकारी होइन। 반찬 भनेको तरकारी वा परिकार हो, यो भातसँग किम्ची, साग, जिगे आदि मिलाएर खाइने भएकाले विवरणसँग मिल्छ। 후식 भनेको खाना खाएपछि खाइने डेजर्ट हो, यो भातसँग खाने कुरा होइन। 비채식 भनेको मांसाहारी भोजन हो, यसले भातसँग खाने परिकारलाई मात्र जनाउँदैन। त्यसैले सही उत्तर २ नम्बरको 반찬 हो, जसको अर्थ तरकारी वा परिकार हुन्छ।"}, {"n": "109", "q": "식당이나 매장에서 주문이나 결제를 할 수 있도록 설치된 무인 기계이며 사람 없이도 스스로 메뉴를 선택하고 계산할 수 있습니다.", "options": ["키오스크", "계산기", "식당표", "할인쿠폰"], "answer": 0, "explain": "1. 키오스크 भनेको अर्डर र भुक्तानी गर्न राखिएको स्वचालित मेशिन हो, त्यसैले यो सही उत्तर हो। 2. 계산기 भनेको क्याल्कुलेटर (हिसाब गर्ने यन्त्र) हो, यो मिल्दैन। 3. 식당표 भनेको रेस्टुरेन्टको तालिका वा मेनु हो, यो मिल्दैन। 4. 할인쿠폰 भनेको छुटकुपन हो, यो मिल्दैन। सही उत्तर 1 नम्बरको키오스크 हो जसको अर्थ किओस्क (स्वचालित मेशिन) हो।"}, {"n": "110", "q": "국가에서 공식적으로 발행한 종이 형태의 화폐로, 물건을 사거나 서비스를 이용할 때 사용하는 돈입니다.", "options": ["동전", "우표", "수표", "지폐"], "answer": 3, "explain": "1. 동전 भनेको सिक्का हो, यो मिल्दैन। 2. 우표 भनेको हुलाक टिकट हो, यो मिल्दैन। 3. 수표 भनेको चेक हो, यो मिल्दैन। 4. 지폐 भनेको कागजको नोट हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको지폐 हो जसको अर्थ कागजको नोट (कागजको पैसा) हो।"}, {"n": "111", "q": "금속으로 만든 화폐로, 주로 지폐보다 적은 금액을 나타내며 물건을 사거나 거스름돈으로 사용합니다.", "options": ["지폐", "우표", "수표", "동전"], "answer": 3, "explain": "1. 지폐 भनेको कागजको नोट हो, यो मिल्दैन। 2. 우표 भनेको हुलाक टिकट हो, यो मिल्दैन। 3. 수표 भनेको चेक हो, यो मिल्दैन। 4. 동전 भनेको धातुले बनेको सिक्का हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको동전 हो जसको अर्थ सिक्का हो।"}, {"n": "112", "q": "은행이나 카드 회사에서 발급하는 플라스틱 카드로, 물건을 살 때 현금 없이 결제하고 나중에 돈을 갚는 방식입니다.", "options": ["직불카드", "신용카드", "현금카드", "상품권"], "answer": 1, "explain": "1. 직불카드 भनेको डेबिट कार्ड हो, यो मिल्दैन। 2. 신용카드 भनेको क्रेडिट कार्ड हो जसले पछि पैसा तिर्ने गरी सामान किन्न मिल्छ, त्यसैले यो सही उत्तर हो। 3. 현금카드 भनेको क्यास कार्ड (नगद कार्ड) हो, यो मिल्दैन। 4. 상품권 भनेको उपहार भौचर हो, यो मिल्दैन। सही उत्तर 2 नम्बरको신용카드 हो जसको अर्थ क्रेडिट कार्ड हो।"}, {"n": "113", "q": "구입한 물품을 마음에 들지 않거나 다른 불편한 점이 있을 때 주어진 기간에 바꿀 수 있는 것을 말합니다.", "options": ["환불", "수출", "교환", "수입"], "answer": 2, "explain": "1. 환불 भनेको पैसा फिर्ता लिनु हो, यो मिल्दैन। 2. 수출 भनेको निर्यात हो, यो मिल्दैन। 3. 교환 भनेको किनेको सामान फेर्नु (साटासाट गर्नु) हो, त्यसैले यो सही उत्तर हो। 4. 수입 भनेको आयात हो, यो मिल्दैन। सही उत्तर 3 नम्बरको교환 हो जसको अर्थ साटासाट (एक्सचेन्ज) हो।"}, {"n": "114", "q": "구입한 물건을 판매자에게 돌려주고 지불한 돈의 전부 또는 일부를 되돌려 받는 것을 말합니다.", "options": ["교환", "환불", "반품", "손실"], "answer": 1, "explain": "1. 교환 भनेको सामान साट्नु हो, यो मिल्दैन। 2. 환불 भनेको पैसा फिर्ता लिनु हो, त्यसैले यो सही उत्तर हो। 3. 반품 भनेको सामान फिर्ता गर्नु हो तर यहाँ पैसा फिर्ता लिने कुरा गरिएको छ त्यसैले 환불 मिल्छ। 4. 손실 भनेको नोक्सान हो, यो मिल्दैन। सही उत्तर 2 नम्बरको환불 हो जसको अर्थ पैसा फिर्ता (रिफन्ड) हो।"}, {"n": "115", "q": "직원 없이 운영되는 가게로, 손님이 직접 물건을 고르고 계산까지 스스로 하는 곳으로 주로 키오스크나 자동결제 시스템을 이용해 물건을 살 수 있습니다.", "options": ["백화점", "수퍼마켓", "무인 판매점", "할인 행사"], "answer": 2, "explain": "1. 백화점 भनेको डिपार्टमेन्ट स्टोर हो, यो मिल्दैन। 2. 수퍼마켓 भनेको सुपरमार्केट हो, यो मिल्दैन। 3. 무인 판매점 भनेको कर्मचारी बिना चल्ने मानवविहीन पसल हो, त्यसैले यो सही उत्तर हो। 4. 할인 행사 भनेको छुटको कार्यक्रम हो, यो मिल्दैन। सही उत्तर 3 नम्बरको무인 판매점 हो जसको अर्थ मानवविहीन बिक्री केन्द्र (अनभेटेड स्टोर) हो।"}, {"n": "116", "q": "물건을 사거나 서비스를 이용한 뒤, 그에 대한 돈을 지불하는 것을 말하며 현금, 카드, 모바일 등 다양한 방법으로 결제할 수 있습니다.", "options": ["입금", "이체", "결제", "반품"], "answer": 2, "explain": "1. 입금 भनेको बैंकमा पैसा जम्मा गर्नु हो, यो मिल्दैन। 2. 이체 भनेको पैसा स्थानान्तरण गर्नु हो, यो मिल्दैन। 3. 결제 भनेको सामान वा सेवाको मूल्य भुक्तानी गर्नु हो, त्यसैले यो सही उत्तर हो। 4. 반품 भनेको सामान फिर्ता गर्नु हो, यो मिल्दैन। सही उत्तर 3 नम्बरको결제 हो जसको अर्थ भुक्तानी हो।"}, {"n": "117", "q": "재활용이나 음식물 쓰레기로 분류되지 않는 쓰레기로, 소각이나 매립이 필요한 쓰레기입니다.", "options": ["일반쓰레기", "재활용 쓰레기", "대형 쓰레기", "음식물 쓰레기"], "answer": 0, "explain": "1. 일반쓰레기 भनेको सामान्य फोहोर (जुन पुनर्चक्रण हुँदैन) हो, त्यसैले यो सही उत्तर हो। 2. 재활용 쓰레기 भनेको पुनर्चक्रण गर्ने फोहोर हो, यो मिल्दैन। 3. 대형 쓰레기 भनेको ठूला फोहोरहरू हुन्, यो मिल्दैन। 4. 음식물 쓰레기 भनेको खानाको फोहोर हो, यो मिल्दैन। सही उत्तर 1 नम्बरको일반쓰레기 हो जसको अर्थ सामान्य फोहोर हो।"}, {"n": "118", "q": "다시 사용할 수 있도록 분리하여 버리는 쓰레기로, 자원을 절약하고 환경을 보호하는 데 도움이 됩니다.", "options": ["일반쓰레기", "재활용 쓰레기", "대형 쓰레기", "음식물 쓰레기"], "answer": 1, "explain": "1. 일반쓰레기 भनेको सामान्य फोहोर हो, यो मिल्दैन। 2. 재활용 쓰레기 भनेको पुनर्चक्रण गर्न मिल्ने फोहोर हो, त्यसैले यो सही उत्तर हो। 3. 대형 쓰레기 भनेको ठूला फोहोरहरू हुन्, यो मिल्दैन। 4. 음식물 쓰레기 भनेको खानाको फोहोर हो, यो मिल्दैन। सही उत्तर 2 नम्बरको재활용 쓰레기 हो जसको अर्थ पुनर्चक्रण फोहोर हो।"}, {"n": "119", "q": "쓰레기나 재활용품 등을 모아 두는 용기로, 정해진 장소에 놓여 있어 사람들이 분리해서 버릴 수 있도록 도와줍니다.", "options": ["헌옷함", "청소함", "수거함", "공구함"], "answer": 2, "explain": "1. 헌옷함 भनेको पुराना लुगा राख्ने बक्स हो, यो मिल्दैन। 2. 청소함 भनेको सरसफाइको सामान राख्ने बक्स हो, यो मिल्दैन। 3. 수거함 भनेको फोहोर वा पुनर्चक्रण वस्तु सङ्कलन गर्ने भाँडो/बक्स हो, त्यसैले यो सही उत्तर हो। 4. 공구함 भनेको औजार राख्ने बक्स हो, यो मिल्दैन। सही उत्तर 3 नम्बरको수거함 हो जसको अर्थ सङ्कलन भाँडो (कलेक्सन बक्स) हो।"}, {"n": "120", "q": "옷이나 천의 주름을 펴고 매끄럽게 하기 위해 사용하는 가전제품으로 열을 이용해 옷의 주름을 없애는 데 사용돼요.", "options": ["밥솥", "냄비", "다리미", "냉장고"], "answer": 2, "explain": "1. 밥솥 भनेको भात पकाउने कुकर हो, यो मिल्दैन। 2. 냄비 भनेको पट्ट वा भाँडो हो, यो मिल्दैन। 3. 다리미 भनेको लुगाको सुरो (चाउरी) पन्छाउने इस्त्री हो, त्यसैले यो सही उत्तर हो। 4. 냉장고 भनेको फ्रिज हो, यो मिल्दैन। सही उत्तर 3 नम्बरको다리미 हो जसको अर्थ इस्त्री हो।"}, {"n": "121", "q": "철로 위를 달리는 대중교통 수단으로 전기를 사용하거나 디젤 엔진으로 움직이며, 정해진 노선을 따라 도시 간 이동이나 장거리 여행에 자주 이용됩니다.", "options": ["지하철", "택시", "버스", "기차"], "answer": 3, "explain": "पहिलो विकल्प 지하철 (भुमिगत रेल) हो, जुन शहरभित्र चल्छ। दोस्रो विकल्प 택시 (ट्याक्सी) हो, जुन सडकमा चल्ने व्यक्तिगत सवारी साधन हो। तेस्रो विकल्प 버스 (बस) हो, जुन सडकमा चल्छ तर प्रश्नमा रेलको ट्र्याकमा चल्ने भनिएको छ। चौथो विकल्प 기차 (रेलगाडी) हो, जुन रेलवे ट्र्याकमा गुड्छ र लामो दूरीको यात्रामा प्रयोग हुन्छ, त्यसैले यो सही उत्तर हो। सही उत्तर 기차 (रेलगाडी) हो।"}, {"n": "122", "q": "땅속에 설치된 철로를 따라 운행되는 도시형 대중교통수단입니다. 교통 혼잡을 피할 수 있어 빠르고 정시에 이동할 수 있습니다.", "options": ["고속열차", "지하철", "고속버스", "마을버스"], "answer": 1, "explain": "पहिलो विकल्प 고속열차 (तीव्र गतिका रेल) हो, जुन शहरबाहिर लामो दूरीका लागि हो। दोस्रो विकल्प 지하철 (भुमिगत रेल) हो, जुन जमिनमुनि बनेको रेलवे ट्र्याकमा चल्ने शहरी सार्वजनिक यातायात हो, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 고속버스 (द्रुत बस) हो, जुन सडकमा चल्छ। चौथो विकल्प 마을버스 (गाउँ/स्थानीय बस) हो, जुन सडकमा चल्छ। सही उत्तर 지하철 (भुमिगत रेल) हो।"}, {"n": "123", "q": "대개 표지판, 의자, 시간표 등이 설치되어 있고 어느 곳에 가기 위해 버스를 기다리기 편리한 장소입니다.", "options": ["지하철역", "버스 터미널", "기차역", "버스 정류장"], "answer": 3, "explain": "पहिलो विकल्प 지하철역 (मेट्रो स्टेशन) हो, जुन भुमिगत रेलका लागि हो। दोस्रो विकल्प 버스터미널 (बस टर्मिनल) हो, जुन ठूलो बसपार्क हो। तेस्रो विकल्प 기차역 (रेलवे स्टेशन) हो, जुन रेलका लागि हो। चौथो विकल्प 버스 정류장 (बस स्टप) हो, जहाँ बोर्ड, कुर्सी र समय तालिका राखिएको हुन्छ र बस पर्खन सजिलो हुन्छ, त्यसैले यो सही उत्तर हो। सही उत्तर 버스 정류장 (बस स्टप) हो।"}, {"n": "124", "q": "승객을 태우거나 내리게 하기 위해 정차하는 장소입니다. 표를 사는 곳, 대합실, 승강장 등이 갖추어져 있어 이용하는 사람들이 편리하게 이용할 수 있습니다.", "options": ["여객 터미널", "지하철역", "버스터미널", "버스 정류장"], "answer": 0, "explain": "पहिलो विकल्प 여객 터미널 (यात्रु टर्मिनल) हो, जहाँ टिकट काउन्टर, प्रतीक्षा कक्ष र प्लेटफर्महरू हुन्छन् र यात्रुहरू चढाउन वा ओराल्न रोकिन्छ, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 지하철역 (मेट्रो स्टेशन) हो, जुन ट्रेनका लागि हो। तेस्रो विकल्प 버스터미널 (बस टर्मिनल) हो, जुन बसका लागि मात्रै हुन्छ। चौथो विकल्प 버스 정류장 (बस स्टप) हो, जहाँ टिकट काउन्टर र प्रतीक्षा कक्ष हुँदैन। सही उत्तर 여객 터미널 (यात्रु टर्मिनल) हो।"}, {"n": "125", "q": "배가 정박하고 사람이나 화물을 싣고 내릴 수 있는 해안 지역입니다. 주로 무역, 어업, 여객 운송 등을 위한 중요한 교통 중심지 역할을 합니다.", "options": ["터미널", "공항", "기차역", "항구"], "answer": 3, "explain": "पहिलो विकल्प 터미널 (टर्मिनल) हो, जुन बस वा यातायातका लागि हो। दोस्रो विकल्प 공항 (विमानस्थल) हो, जुन जहाजका लागि हो। तेस्रो विकल्प 기차역 (रेलवे स्टेशन) हो, जुन रेलका लागि हो। चौथो विकल्प 항구 (बन्दरगाह) हो, जहाँ पानीजहाज रोकिएर मानिस वा सामान चढाइने र ओछ्याइने तटीय क्षेत्र हो, त्यसैले यो सही उत्तर हो। सही उत्तर 항구 (बन्दरगाह) हो।"}, {"n": "126", "q": "시속 200km 이상으로 달릴 수 있는 매우 빠른 열차입니다. 도시 간 이동 시간을 줄여주는 효율적인 교통수단입니다.", "options": ["지하철", "시내버스", "고속버스", "고속열차"], "answer": 3, "explain": "पहिलो विकल्प 지하철 (भुमिगत रेल) हो, जुन सामान्य गतिमा चल्छ। दोस्रो विकल्प 시내버스 (शहरभित्रको बस) हो, जुन सुस्त हुन्छ। तेस्रो विकल्प 고속버스 (द्रुत बस) हो, जुन तर हो। तेस्रो विकल्प 운동 (व्यायाम/खेलकुद) हो, जुन धेरै व्यापक शब्द हो। चौथो विकल्प 회식 (सहकर्मीसँगको खाना/पार्टी) हो। सही उत्तर 헬스 (जिम/स्वास्थ्य व्यायाम) हो।"}, {"n": "131", "q": "운동이나 체육 활동을 할 수 있도록 마련된 넓은 공간입니다. 학교, 공원, 체육 시설 등에 있으며 축구, 달리기 등 다양한 운동이 가능합니다.", "options": ["운동장", "헬스장", "회의실", "교실"], "answer": 0, "explain": "पहिलो विकल्प 운동장 (खेल मैदान) हो, जुन खेलकुद वा शारीरिक गतिविधिको लागि तयार पारिएको फराकिलो ठाउँ हो, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 헬스장 (जिम हल) हो, जुन भित्री फिटनेस हल हो। तिस्रो विकल्प 회의실 (बैठक कक्ष) हो, जुन मिटिङका लागि हो। चौथो विकल्प 교실 (कक्षा कोठा) हो, जुन पढ्ने ठाउँ हो। सही उत्तर 운동장 (खेल मैदान) हो।"}, {"n": "132", "q": "다양한 운동 기구와 시설을 갖추고 있어 사람들이 체력 단련이나 건강 관리를 위해 이용하는 장소입니다. 러닝머신, 웨이트 기구, 샤워실 등이 갖춰져 있습니다.", "options": ["운동장", "헬스장", "축구장", "탁구장"], "answer": 1, "explain": "पहिलो विकल्प 운동장 (खेल मैदान) हो, जुन बाहिरी मैदान हो। दोस्रो विकल्प 헬스장 (जिम हल) हो, जहाँ विभिन्न व्यायाम उपकरण र सुविधाहरू हुन्छन् र मानिसहरूले शारीरिक व्यायामका लागि प्रयोग गर्छन्, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 축구장 (फुटबल मैदान) हो। चौथो विकल्प 탁구장 (टेबल टेनिस खेल्ने हल) हो। सही उत्तर 헬스장 (जिम हल) हो।"}, {"n": "133", "q": "신이나 힘에 대한 믿음을 통하여 인간 생활의 어려움을 해결하고 삶의 긍정적인 의미를 추구하는 문화 체계입니다.", "options": ["약속", "교인", "종교", "신자"], "answer": 2, "explain": "पहिलो विकल्प 약속 (प्रतिज्ञा/वचन) हो। दोस्रो विकल्प 교인 (चर्चको अनुयायी) हो। तेस्रो विकल्प 종교 (धर्म) हो, जुन देवता वा शक्तिको विश्वासमार्फत मानवीय जीवनका कठिनाइहरू समाधान गर्ने सांस्कृतिक प्रणाली हो, त्यसैले यो सही उत्तर हो। चौथो विकल्प 신자 (श्रद्धालु/भक्त) हो। सही उत्तर 종교 (धर्म) हो।"}, {"n": "134", "q": "일요일과 같이 국가나 사회에서 정하여진 휴일로 설날, 추석, 한글날, 삼일절 등이 이에 해당합니다.", "options": ["약정 휴일", "공휴일", "법정휴일", "주휴일"], "answer": 1, "explain": "पहिलो विकल्प 약정 휴일 (सम्झौता गरिएको बिदा) हो। दोस्रो विकल्प 공휴일 (सार्वजनिक बिदा) हो, जुन सरकार वा समाजले तोकेको बिदा हो जस्तै सोलनाल, छुसक, हान글 दिवस आदि, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 법정휴일 (कानुनी बिदा) हो। चौथो विकल्प 주휴일 (साप्ताहिक बिदा) हो। सही उत्तर 공휴일 (सार्वजनिक बिदा) हो।"}, {"n": "135", "q": "사람이 있거나 사물이 놓여 있는 장소를 말합니다. 기준이 되는 점이나 사물과의 관계로 표현됩니다.", "options": ["방향", "위치", "주소", "지역"], "answer": 1, "explain": "पहिलो विकल्प 방향 (दिशा) हो। दोस्रो विकल्प 위치 (स्थान/अवस्थिति) हो, जसले मानिस वा वस्तु रहेको ठाउँलाई बुझाउँछ र आधार बिन्दुसँगको सम्बन्धबाट व्यक्त गरिन्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 주소 (ठेगाना) हो। चौथो विकल्प 지역 (क्षेत्र) हो। सही उत्तर 위치 (स्थान/अवस्थिति) हो।"}, {"n": "136", "q": "보행자가 도로를 안전하게 건널 수 있도록 표시 해 놓은 길입니다. 보통 흰색 줄무늬로 표시되어 있으며, 신호등이 함께 설치되어 있는 경우도 많습니다.", "options": ["원형교차로", "횡단보도", "사거리", "삼거리"], "answer": 1, "explain": "1. 원형교차로 भनेको गोलो आकारको चोक हो, यो पैदलयात्री बाटो पार गर्ने ठाउँ होइन। 2. 횡단보도 भनेको पैदलयात्रीहरूले सडक सुरक्षित रूपमा पार गर्नका लागि बनाइएको जेब्रा क्रसिङ हो, त्यसैले यो सही उत्तर हो। 3. 사거리 भनेको चारवटा बाटो मिल्ने चोक हो। 4. 삼거리 भनेको तीनवटा बाटो मिल्ने चोक हो। सही उत्तर 횡단보도 (जेब्रा क्रसिङ) हो।"}, {"n": "137", "q": "보행자가 차량 도로 위를 안전하게 건널 수 있도록 만든 다리입니다. 주로 도로가 복잡하거나 차량 통행이 많은 곳에 설치됩니다.", "options": ["육교", "지하", "마트", "길거리"], "answer": 0, "explain": "1. 육교 भनेको पैदलयात्रीहरूलाई सडक पार गर्न बनाइएको ओभरहेड ब्रिज (आकाशे पुल) हो, त्यसैले यो सही उत्तर हो। 2. 지하 भनेको भूमिगत भाग वा जमिनमुनि हो। 3. 마트 भनेको मार्ट वा पसल हो। 4. 길거리 भनेको सडकको किनार वा बाटो हो। सही उत्तर 육교 (आकाशे पुल) हो।"}, {"n": "138", "q": "건물의 가장 윗부분에 있는 평평한 지붕 공간입니다. 휴식, 건조, 정원 등 다양한 용도로 활용됩니다.", "options": ["옥상", "마루", "마트", "마당"], "answer": 0, "explain": "1. 옥상 भनेको भवनको सबैभन्दा माथिल्लो तलाको सम्याइएको कौसी वा छत हो, त्यसैले यो सही उत्तर हो। 2. 마루 भनेको काठको पिँढी वा घरभित्रको भुइँ हो। 3. 마트 भनेको मार्ट वा पसल हो। 4. 마당 भनेको घरको आँगन हो। सही उत्तर 옥상 (कौसी/छत) हो।"}, {"n": "139", "q": "네 갈래로 길이 만나는 도로의 교차 지점을 말합니다. 차량과 보행자의 이동이 많아 신호등이나 표지판이 설치되어 있는 경우가 많습니다.", "options": ["사거리", "삼거리", "우회전", "좌회전"], "answer": 0, "explain": "1. 사거리 भनेको चारवटा दिशा वा बाटो मिल्ने चौबाटो हो, त्यसैले यो सही उत्तर हो। 2. 삼거리 भनेको तीनवटा बाटो मिल्ने तीनबाटो हो। 3. 우회전 भनेको दायाँतर्फ मोड्नु हो। 4. 좌회전 भनेको बायाँतर्फ मोड्नु हो। सही उत्तर 사거리 (चौबाटो) हो।"}, {"n": "140", "q": "날씨나 상황에 맞게 입은 옷의 형태나 스타일을 말합니다. 계절, 장소, 목적에 따라 달라집니다.", "options": ["유행", "화장", "쇼핑", "옷차림"], "answer": 3, "explain": "1. 유행 भनेको फेसन वा चलन हो। 2. 화장 भनेको मेकअप वा श्रृंगार हो। 3. 쇼핑 भनेको किनमेल हो। 4. 옷차림 भनेको पहिरन वा लुगा लगाउने शैली हो, त्यसैले यो सही उत्तर हो। सही उत्तर 옷차림 (पहिरन शैली) हो।"}, {"n": "141", "q": "옷차림을 꾸미기 위해 착용하는 장식품을 말하며 귀걸이, 목걸이, 팔찌, 모자, 시계 등이 이에 해당합니다.", "options": ["보석류", "스타일", "액세서리", "옷차림"], "answer": 2, "explain": "1. 보석류 भनेको गरगहना वा बहुमूल्य धातुका वस्तुहरू हुन्। 2. 스타일 भनेको शैली हो। 3. 액세서리 भनेको पहिरनमा थपिने एक्सेसरीज वा गरगहनाहरू हुन्, त्यसैले यो सही उत्तर हो। 4. 옷차림 भनेको पहिरन शैली हो। सही उत्तर 액세서리 (एक्सेसरीज/गरगहना) हो।"}, {"n": "142", "q": "시력을 교정하거나 눈을 보호하기 위해 눈에 쓰는 도구입니다. 시력 교정용 외에도 선글라스나 패션용으로도 사용됩니다.", "options": ["모자", "안약", "안경", "시계"], "answer": 2, "explain": "1. 모자 भनेको टोपी हो। 2. 안약 भनेको आँखामा हाल्ने थोपा औषधि हो। 3. 안경 भनेको आँखामा लगाउने चस्मा हो, त्यसैले यो सही उत्तर हो। 4. 시계 भनेको घडी हो। सही उत्तर 안경 (चस्मा) हो।"}, {"n": "143", "q": "비나 눈이 오는 날에 신는 방수 기능이 있는 신발입니다. 주로 고무로 만들어지며 발과 다리를 젖지 않게 보호합니다.", "options": ["장화", "양말", "슬리퍼", "운동화"], "answer": 0, "explain": "1. 장화 भनेको पानी नछिर्ने रबरको जुत्ता वा गमबुट हो, त्यसैले यो सही उत्तर हो। 2. 양말 भनेको मोजा हो। 3. 슬리퍼 भनेको स्लिपर वा चप्पल हो। 4. 운동화 भनेको खेलकुद जुत्ता वा स्नीकर हो। सही उत्तर 장화 (गमबुट) हो।"}, {"n": "144", "q": "한국인의 고유한 의복, 특히 조선 시대에 입던 형식의 옷. 현재에는 평상복으로 입는 경우는 별로 없고, 주로 명절 때 입습니다.", "options": ["한복", "정복", "상복", "양복"], "answer": 0, "explain": "1. 한복 भनेको कोरियाको पारम्परिक पोशाक हो, त्यसैले यो सही उत्तर हो। 2. 정복 भनेको औपचारिक पोशाक वा युनिफर्म हो। 3. 상복 भनेको शोकको बेला लगाउने कपडा हो। 4. 양복 भनेको पाश्चात्य शैलीको सुट हो। सही उत्तर 한복 (कोरियाली पारम्परिक पोशाक) हो।"}, {"n": "145", "q": "한복의 윗옷으로, 전통적으로 남녀 모두 착용합니다. 짧은 길이에 앞을 여며 입는 형태이며, 깃과 고름이 특징입니다.", "options": ["치마", "바지", "원피스", "저고리"], "answer": 3, "explain": "치마 भनेको स्कर्ट वा जामा हो, यो हानबोकको तल्लो भागमा महिलाले 고시원"], "answer": 2, "explain": "1. 아파트 भनेको अपार्टमेन्ट हो। 2. 주택 भनेको घर हो। 3. 오피스텔 भनेको अफिस र होटल मिलेर बनेको, बस्न र काम गर्न मिल्ने अफिसटेल भवन हो, त्यसैले यो सही उत्तर हो। 4. 고시원 भनेको कोशिबन हो। सही उत्तर 오피스텔 (अफिसटेल) हो।"}];

const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-03';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"><b>किन?</b> <span></span></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    card.querySelector('.explain span').textContent = q.explain;
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
