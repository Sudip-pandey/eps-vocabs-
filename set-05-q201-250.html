<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EPS-TOPIK Vocabulary Quiz — Set 05 (Q201–Q250)</title>
<style>
  :root {
    --primary: #a78bfa;
    --primary-dark: #c4b5fd;
    --primary-soft: rgba(124,58,237,.22);
    --pink: #f472b6;
    --orange: #fb923c;
    --grad: linear-gradient(135deg, #7c3aed 0%, #c026d3 50%, #db2777 78%, #f97316 100%);
    --grad-soft: linear-gradient(135deg, rgba(124,58,237,.28), rgba(219,39,119,.22));
    --green: #34d399;
    --green-bg: rgba(16,185,129,.16);
    --red: #fb7185;
    --red-bg: rgba(244,63,94,.14);
    --bg: #0b0b16;
    --card: #171725;
    --text: #f2f1fa;
    --muted: #9d9db4;
    --border: rgba(255,255,255,.09);
    --shadow: 0 2px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans KR", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(700px 340px at 85% -5%, rgba(124,58,237,.28), transparent 60%), radial-gradient(560px 300px at -5% 8%, rgba(219,39,119,.2), transparent 60%), radial-gradient(500px 400px at 50% 110%, rgba(34,211,238,.08), transparent 60%); background-attachment: fixed; color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); color: #d6c9ff; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,.12); margin-bottom: 14px; transition: all .15s; }
  .back-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  header { background: var(--grad); color: #fff; padding: 20px 16px 16px; position: relative; box-shadow: 0 4px 24px rgba(0,0,0,.5); overflow: hidden; }
  header::before { content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.22), transparent 65%); top: -160px; right: -60px; pointer-events: none; }
  header::after { content: ""; position: absolute; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 65%); bottom: -140px; left: -40px; pointer-events: none; }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.4rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  header p { opacity: .92; font-size: .9rem; margin-top: 4px; }
  .progress-wrap { margin-top: 14px; background: rgba(0,0,0,.35); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #fde68a, #f472b6, #22d3ee); width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(244,114,182,.7); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { background: linear-gradient(180deg, #1d1d30, #171725); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: rgba(167,139,250,.55); }
  .q-num { display: inline-block; font-size: .78rem; font-weight: 800; color: #fff; background: var(--grad); padding: 4px 14px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(219,39,119,.45); }
  .q-text { font-size: 1.12rem; white-space: pre-line; margin: 10px 0 16px; line-height: 1.85; font-weight: 500; color: #f2f1fa; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid rgba(255,255,255,.09); border-radius: 14px; margin-bottom: 9px; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #1e1e30; color: #f2f1fa; }
  .options label:hover { border-color: #8b5cf6; background: #232338; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(124,58,237,.3); }
  .options label::before { content: ""; flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; border: 2px solid #6b6b8a; background: transparent; transition: all .15s; }
  .options label.selected { background: var(--grad-soft); border-color: #a78bfa; box-shadow: 0 4px 18px rgba(124,58,237,.4); }
  .options label.selected::before { border-color: #a78bfa; background: #a78bfa; box-shadow: inset 0 0 0 4px #1e1e30; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #f472b6; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 700; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 4px 18px rgba(219,39,119,.45); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 8px 24px rgba(219,39,119,.5); }
  .btn-primary:disabled { background: #2a2a3d; color: #77778e; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: rgba(255,255,255,.06); color: #d6c9ff; border: 2px solid rgba(255,255,255,.12); }
  .btn-ghost:hover { border-color: #8b5cf6; background: rgba(124,58,237,.2); }
  .submit-bar { position: sticky; bottom: 0; background: rgba(11,11,22,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 24px rgba(0,0,0,.5); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: linear-gradient(135deg, #1e1b3a, #2a1230); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; line-height: 1.05; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .score-card .pct { font-size: 1.15rem; color: #c9c6e0; margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: #e6e4f5; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 2px 12px rgba(219,39,119,.4); }
  .review-card { background: linear-gradient(180deg, #1d1d30, #171725); border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: linear-gradient(135deg, #059669, #34d399); }
  .verdict.no { background: linear-gradient(135deg, #e11d48, #fb7185); }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; background: #1e1e30; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #12101f; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; color: #d9d7ea; }
  .explain b { color: #d6c9ff; }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; }
  .explain-stem { background: linear-gradient(135deg, rgba(124,58,237,.25), rgba(219,39,119,.18)); border-left: 4px solid #a78bfa; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; color: #f2f1fa; }
  .exp-line { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.07); line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: #34d399; }
  .exp-mark.no { color: #fb7185; }
  .exp-note { background: linear-gradient(135deg, rgba(245,158,11,.16), rgba(245,158,11,.08)); border: 1px solid rgba(245,158,11,.4); border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; color: #fde9c8; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }
  @media (min-width: 640px) {
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .options label { margin-bottom: 0; }
  }

</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">&larr; Back to All Sets</a>
    <h1>EPS-TOPIK 문제은행 Quiz</h1>
    <p>Set 5 of 11 &bull; Questions 201–250 &bull; 50 questions &bull; EPS-TOPIK Vocabulary &mdash; answers are AI-generated (no answer key in the book) &mdash; check with a teacher &bull; Explanations in Nepali</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">0 / 50 answered</div>
    <div class="autosave-note">Progress will be auto-saved.</div>
  </div>
</header>

<main id="quizView">
  <div id="questionList"></div>
  <div class="pager">
    <button class="btn-ghost" id="prevBtn">&larr; Previous</button>
    <span class="page-info" id="pageInfo"></span>
    <button class="btn-ghost" id="nextBtn">Next &rarr;</button>
  </div>
</main>

<div class="submit-bar" id="submitBar">
  <div class="inner">
    <span class="hint" id="submitHint">Answer all 50, then submit.</span>
    <div style="display:flex; gap:8px; flex:none;">
      <button class="btn-ghost" id="clearBtn" style="padding:11px 16px;">Clear all</button>
      <button class="btn-primary" id="submitBtn">Submit Quiz</button>
    </div>
  </div>
</div>

<main id="resultView" class="hidden">
  <div class="score-card">
    <div class="big" id="scoreBig"></div>
    <div class="pct" id="scorePct"></div>
    <div class="msg" id="scoreMsg"></div>
    <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-primary" id="retryBtn">Try Again</button>
      <button class="btn-ghost" id="reviewTopBtn">Back to top</button>
    </div>
  </div>
  <div class="filters">
    <button class="btn-ghost active" data-filter="all">All questions</button>
    <button class="btn-ghost" data-filter="wrong">Wrong only</button>
    <button class="btn-ghost" data-filter="correct">Correct only</button>
  </div>
  <div id="reviewList"></div>
</main>

<script>
const QUESTIONS = [{"n": "201", "q": "지역 사회의 건강을 관리하고 증진하기 위해 공공 보건 서비스를 제공하는 기관입니다. 예방접종, 건강 상담, 검진 등 다양한 건강 관리 서비스를 제공합니다.", "options": ["보건소", "상담소", "아동의원", "정형외과"], "answer": 0, "explain": "① 보건소 भनेको समुदायको स्वास्थ्य व्यवस्थापन र प्रवर्द्धनका लागि सार्वजनिक स्वास्थ्य सेवा प्रदान गर्ने संस्था हो ✓\n② 상담소 भनेको परामर्श केन्द्र हो, यो सार्वजनिक स्वास्थ्य सेवा दिने संस्था होइन त्यसैले मिल्दैन। ✗\n③ 아동의원 भनेको बाल अस्पताल हो, यो सबैका लागि सार्वजनिक स्वास्थ्य सेवा दिने संस्था होइन त्यसैले मिल्दैन। ✗\n④ 정형외과 भनेको हाडजोर्नी अस्पताल हो, यो विशेष अस्पताल हो त्यसैले मिल्दैन। ✗"}, {"n": "202", "q": "내적인 질병, 즉 내부 장기와 관련된 질환을 진단하고 치료하는 의학 분야입니다. 주로 소화기, 심장, 호흡기 등 다양한 문제를 다룹니다.", "options": ["치과", "내과", "안과", "소아과"], "answer": 1, "explain": "① 치과 भनेको दाँतको अस्पताल हो, यो आन्तरिक अंगहरूको रोगको उपचार गर्ने विभाग होइन त्यसैले मिल्दैन। ✗\n② 내과 भनेको आन्तरिक रोगहरू जस्तै पेट, मुटु, फोक्सो आदिको जाँच र उपचार गर्ने चिकित्सा क्षेत्र हो ✓\n③ 안과 भनेको आँखाको अस्पताल हो, यो आन्तरिक अंगको विभाग होइन त्यसैले मिल्दैन। ✗\n④ 소아과 भनेको बालरोग अस्पताल हो, यो आन्तरिक रोग विभाग होइन त्यसैले मिल्दैन। ✗"}, {"n": "203", "q": "이를 치료하거나 교정하는 의원이나 병원입니다.", "options": ["안과", "치과", "내과", "피부과"], "answer": 1, "explain": "① 안과 भनेको आँखाको अस्पताल हो, यो दाँतको उपचार गर्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n② 치과 भनेको दाँतको उपचार वा मिलाउने (क्यो्रेक्ट गर्ने) अस्पताल वा क्लिनिक हो ✓\n③ 내과 भनेको आन्तरिक रोगको अस्पताल हो, यो दाँतको अस्पताल होइन त्यसैले मिल्दैन। ✗\n④ 피부과 भनेको छालाको अस्पताल हो, यो दाँतको अस्पताल होइन त्यसैले मिल्दैन। ✗"}, {"n": "204", "q": "뼈, 관절, 근육이 아프거나 다쳤을 때 치료하는 병원입니다. 골절이나 관절염, 허리 아픔 등을 고치는 곳입니다.", "options": ["피부과", "산부인과", "성형외과", "정형외과"], "answer": 3, "explain": "① 피부과 भनेको छालाको अस्पताल हो, यो हाडजोर्नीको उपचार गर्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n② 산부인과 भनेको प्रसूति तथा स्त्रीरोग अस्पताल हो, यो हाडजोर्नीको होइन त्यसैले मिल्दैन। ✗\n③ 성형외과 भनेको प्लास्टिक सर्जरी अस्पताल हो, यो हाडजोर्नी दुख्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n④ 정형외과 भनेको हाड, जोर्नी र मांशपेसी दुख्दा वा चोट लाग्दा उपचार गर्ने अस्पताल हो ✓"}, {"n": "205", "q": "전통적인 한국 의학적인 방식을 이용해 치료하는 곳입니다. 주로 약초나 침, 뜸 등을 사용하여 몸의 균형을 맞추고 건강을 돌봅니다.", "options": ["의원", "안과", "치과", "한의원"], "answer": 3, "explain": "१. 의원 भनेको सामान्य क्लिनिक हो, यो परम्परागत कोरियाली चिकित्सा पद्धति मात्र होइन त्यसैले मिल्दैन। २. 안과 भनेको आँखाको अस्पताल हो, यो परम्परागत चिकित्सा होइन त्यसैले मिल्दैन। ३. 치과 भनेको दाँतको अस्पताल हो, यो परम्परागत चिकित्सा होइन त्यसैले मिल्दैन। ४. 한의원 भनेको परम्परागत कोरियाली चिकित्सा पद्धति प्रयोग गरेर उपचार गर्ने ठाउँ हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको 한의원 हो।"}, {"n": "206", "q": "얼굴이나 몸의 모양을 고치거나 바꾸는 치료를 하는 병원입니다. 다친 곳을 복원하거나 더 예쁘게 만들기 위해 수술하기도 합니다.", "options": ["내과", "피부과", "소아과", "성형외과"], "answer": 3, "explain": "① 내과 भनेको आन्तरिक रोगको अस्पताल हो, यो शरीरको आकार बदल्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n② 피부과 भनेको छालाको अस्पताल हो, यो प्लास्टिक सर्जरी गर्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n③ 소아과 भनेको बालरोग अस्पताल हो, यो सर्जरी गर्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n④ 성형외과 भनेको अनुहार वा शरीरको आकार सच्याउने वा परिवर्तन गर्ने उपचार गर्ने अस्पताल हो ✓"}, {"n": "207", "q": "귀, 코, 목이 아플 때 치료해 주는 병원으로 감기, 코막힘, 중이염 같은 병을 봅니다.", "options": ["청소년과", "정형외과", "이비인후과", "산부인과"], "answer": 2, "explain": "① 청소년과 भनेको किशोरकिशोरी विभाग हो, यो कान, नाक, घाँटी हेर्ने अस्पताल होइन त्यसैले मिल्दैन। ✗\n② 정형외과 भनेको हाडजोर्नी अस्पताल हो, यो कान, नाक, घाँटी हेर्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n③ 이비인후과 भनेको कान, नाक र घाँटी दुख्दा रुघाखोकी, नाक बन्द हुने रोगको उपचार गर्ने अस्पताल हो ✓\n④ 산부인과 भनेको प्रसूति तथा स्त्रीरोग अस्पताल हो, यो कान, नाक, घाँटीको अस्पताल होइन त्यसैले मिल्दैन। ✗"}, {"n": "208", "q": "약을 사는 곳으로, 의사가 준 처방전을 가지고 가면 약을 받아 먹을 수 있습니다. 감기약이나 연고 같은 일반 약도 살 수 있습니다.", "options": ["진료소", "병원", "약국", "극장"], "answer": 2, "explain": "① 진료소 भनेको स्वास्थ्य चौकी हो, यो औषधि किन्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n② 병원 भनेको अस्पताल हो, यो औषधि मात्र किन्न जाने ठाउँ होइन त्यसैले मिल्दैन। ✗\n③ 약국 भनेको औषधि किन्ने ठाउँ हो, जहाँ डाक्टरले दिएको पुर्जी देखाएर औषधि लिन सकिन्छ र साधारण औषधि पनि किन्न पाइन्छ ✓\n④ 극장 भनेको सिनेमा हल हो, यो औषधिसँग सम्बन्धित छैन त्यसैले मिल्दैन। ✗"}, {"n": "209", "q": "가정에서 응급 조치나 병의 예방약으로 준비해 놓는 약품이며 처방전 없이 약국이나 편의점에서 쉽게 살 수 있습니다.", "options": ["비상약", "항생제", "멀미약", "아목시실린"], "answer": 0, "explain": "① 비상약 भनेको आपत्कालीन औषधि हो, जुन घरमा आकस्मिक उपचार वा रोग रोकथामका लागि तयार गरि राखिन्छ र पुर्जी बिना नै फार्मेसी वा कन्भेनिएन्स स्टोरबाट सजिलै किन्न सकिन्छ ✓\n② 항생제 भनेको एन्टिबायोटिक हो, यो पुर्जी बिना किन्न पाइँदैन त्यसैले मिल्दैन। ✗\n③ 멀미약 भनेको गाडी वा डुङ्गा लाग्दा खाने औषधि हो, यो आपत्कालीन औषधिको सामान्य वर्ग होइन त्यसैले मिल्दैन। ✗\n④ 아목시실린 भनेको एमोक्सिसिलिन (एन्टिबायोटिक) हो, यो पुर्जी बिना पाइँदैन त्यसैले मिल्दैन। ✗"}, {"n": "210", "q": "몸이 아프거나 삔 곳에 붙이는 약입니다. 통증을 줄이고 붓기를 가라앉히는 데 도움을 줍니다.", "options": ["파스", "안약", "연고", "밴드"], "answer": 0, "explain": "① 파스 भनेको शरीर दुखेको वा नसा तानिएको ठाउँमा टाँस्ने औषधि (पार्ष) हो, यसले दुखाइ कम गर्न र सुन्निएको घटाउन मद्दत गर्छ ✓\n② 안약 भनेको आँखामा हाल्ने थोपा औषधि हो, यो शरीर दुखेको ठाउँमा टाँस्ने होइन त्यसैले मिल्दैन। ✗\n③ 연고 भनेको मलम हो, यो टाँस्ने पाटे औषधि होइन त्यसैले मिल्दैन। ✗\n④ 밴드 भनेको ब्यान्डेज वा प्लास्टर हो, यसले दुखाइ कम गर्ने औषधि भएको टाँस्ने साधन होइन त्यसैले मिल्दैन। ✗"}, {"n": "211", "q": "사람이나 동물의 병이나 상처에 생기는 해로운 세균을 죽이거나 예방하기 위하여 바르는 물질입니다.", "options": ["진통제", "소독약", "반창고", "소화제"], "answer": 1, "explain": "① 진통제 भनेको दुखाइ कम गर्ने औषधि हो, तर यसले कीटाणु मार्दैन। ✗\n② 소독약 भनेको कीटाणुनाशक औषधि हो, जसले घाउ वा चोटपटकमा हुने हानिकारक कीटाणुलाई मार्न र रोक्न मद्दत गर्छ ✓\n③ 반창고 भनेको घाउमा टाँस्ने पट्टी हो, यो मलम वा औषधि होइन। ✗\n④ 소화제 भनेको खाना पचाउने औषधि हो, घाउमा लगाउने औषधि होइन। ✗"}, {"n": "212", "q": "상처나 부스럼 따위에 감는 소독한 헝겊입니다. 신축성 있고 바람이 잘 통하는 면포, 거즈 따위로 만듭니다.", "options": ["반창고", "붕대", "영양제", "파스"], "answer": 1, "explain": "① 반창고 भनेको ब्यान्डएज वा प्लास्टर हो ✗\n② 붕대 भनेको घाउमा बेर्ने ब्यान्डेज वा पट्टि हो ✓\n③ 영양제 भनेको भिटामिन तथा पौष्टिक तत्व हो ✗\n④ 파스 भनेको दुखाइ कम गर्ने टाँस्ने प्याच हो ✗\nशिक्षकको उत्तर-पत्र: ① 반창고 — मेरो उत्तर: ② 붕대। प्रश्न: '감는 소독한 헝겊, 면포/거즈' — घाउमा बेर्ने (wrap गर्ने) कपास/गज कपडा — त्यो ब्यान्डेज रोल (붕대) हो; 반창고 त सानो टाँसिने प्लास्टर (ब्यान्ड-एड) हो।"}, {"n": "213", "q": "몸이나 상처가 아플 때 치료의 효과는 없고 통증을 느끼지 못하게 하는 약입니다.", "options": ["해열제", "영양제", "소화제", "진통제"], "answer": 3, "explain": "① 해열제 भनेको ज्वरो, घटाउने औषधि हो ✗\n② 영양제 भनेको पौष्टिक औषधि हो ✗\n③ 소화제 भनेको पाचनसम्बन्धी औषधि हो ✗\n④ 진통제 भनेको दुखाइ कम गर्ने औषधि हो ✓"}, {"n": "214", "q": "우리 몸에 필요한 비타민이나 영양소를 보충해 주는 건강 보조 식품입니다. 피로할 때나 영양이 부족할 때 먹습니다.", "options": ["항생제", "영양제", "지사제", "진통제"], "answer": 1, "explain": "① 항생제 भनेको एन्टिबायोटिक हो ✗\n② 영양제 भनेको शरीरलाई चाहिने भिटामिन र पौष्टिक तत्व दिने स्वास्थ्य पूरक खाद्यपदार्थ हो ✓\n③ 지사제 भनेको पखाला रोक्ने औषधि हो ✗\n④ 진통제 भनेको दुखाइ कम गर्ने औषधि हो ✗"}, {"n": "215", "q": "약을 전문적으로 알고, 약을 조제하거나 올바르게 먹는 방법을 알려주는 사람입니다. 주로 약국에서 일합니다.", "options": ["의사", "약사", "간호사", "보호자"], "answer": 1, "explain": "① 의사 भनेको डाक्टर हो ✗\n② 약사 भनेको औषधि पसलमा बसेर औषधि बनाउने र खाने तरिका सिकाउने फार्मासिस्ट (फार्मासिस्ट/औषधि व्यवसायी) हो ✓\n③ 간호사 भनेको नर्स हो ✗\n④ 보호자 भनेको बिरामीको रेखदेख गर्ने संरक्षक हो ✗"}, {"n": "216", "q": "우체국으로 보내는 모든 종류의 물건이나 편지를 말합니다. 예를 들어, 편지, 소포, 카드 등이 우편물에 포함됩니다.", "options": ["준비물", "수하물", "우편물", "방해물"], "answer": 2, "explain": "① 준비물 भनेको तयारी गर्ने सामग्री हो ✗\n② 수하물 भनेको लगेज वा सामान हो ✗\n③ 우편물 भनेको चिठीपत्र वा हुलाकबाट पठाउने वस्तु हो ✓\n④ 방해물 भनेको बाधा पुर्‍याउने वस्तु हो ✗"}, {"n": "217", "q": "물건을 집이나 회사로 배달해 주는 서비스입니다. 주문한 상품이나 소포를 빠르게 집으로 받아 볼 수 있습니다.", "options": ["이체", "EMS", "택배", "환불"], "answer": 2, "explain": "① 이체 भनेको बैंक खाताबाट पैसा स्थानान्तरण गर्नु हो ✗\n② EMS भनेको अन्तर्राष्ट्रिय द्रुत हुलाक सेवा हो ✗\n③ 택배 भनेको घर वा कम्पनीमा सामान पुर्‍याइदिने कुरियर सेवा हो ✓\n④ 환불 भनेको पैसा फिर्ता गर्नु हो ✗"}, {"n": "218", "q": "오늘 보낸 우편물을 다음 날 바로 받아볼 수 있는 빠른 우편 서비스입니다. 급하게 보내야 할 때 사용합니다.", "options": ["일반 소포", "항공 우편", "익일 특급", "선박 우편"], "answer": 2, "explain": "① 일반 소포 भनेको सामान्य पार्सल हो ✗\n② 항공 우편 भनेको हवाइ हुलाक हो ✗\n③ 익일 특급 भनेको भोलिपल्टै प्राप्त हुने गरी पठाइने द्रुत हुलाक सेवा हो ✓\n④ 선박 우편 भनेको पानीजहाजबाट पठाइने हुलाक हो ✗"}, {"n": "219", "q": "국제적으로 긴급한 문서나 물품을 신속하게 배송하는 우편 서비스입니다. 빠른 배송과 함께 배송 추적 기능도 제공됩니다.", "options": ["국제 특급", "익일 우편", "국내 소포", "일반 우편"], "answer": 0, "explain": "① 국제 특급 (이에엠에스) भनेको अन्तर्राष्ट्रिय द्रुत हुलाक सेवा हो, जसले कागजात वा सामान छिटो पठाउँछ र ट्र्याकिङ पनि दिन्छ ✓\n② 익일 우편 भनेको भोलिपल्ट पुग्ने हुलाक सेवा हो, यो अन्तर्राष्ट्रिय सेवा होइन। ✗\n③ 국내 소포 भनेको देशभित्र पठाउने पार्सल सेवा हो, अन्तर्राष्ट्रिय सेवा होइन। ✗\n④ 일반 우편 भनेको साधारण हुलाक सेवा हो, जुन छिटो हुँदैन। ✗"}, {"n": "220", "q": "비행기를 이용해 사람이나 화물을 한 장소에서 다른 장소로 운송하는 서비스입니다. 빠른 이동이 가능해 국내외 여행과 물류에 널리 사용됩니다.", "options": ["항공편", "교통편", "선편", "왕복"], "answer": 0, "explain": "① 항공편 भनेको हवाइमार्ग वा उडान सेवा हो ✓\n② 교통편 भनेको यातायातको साधन वा माध्यम हो ✗\n③ 선편 भनेको जलमार्ग वा पानीजहाज सेवा हो ✗\n④ 왕복 भनेको जानु र आउनु (दोहोरो यात्रा) हो ✗"}, {"n": "221", "q": "전기, 수도, 가스, 전화 등 공공기관이나 공기업에 정기적으로 내는 요금입니다. 생활에 필요한 기본 서비스 이용에 대한 대가입니다.", "options": ["임금", "벌금", "보험금", "공과금"], "answer": 3, "explain": "① 임금 भनेको ज्याला वा तलब हो ✗\n② 벌금 भनेको जरिवाना हो ✗\n③ 보험금 भनेको दाबी भुक्तानी रकम वा बिमा रकम हो ✗\n④ 공과금 भनेको बिजुली, पानी, ग्यास जस्ता सार्वजनिक शुल्कहरू हुन् ✓"}, {"n": "222", "q": "은행에서 개인이나 기업이 금융 거래를 할 수 있도록 만든 책자나 카드입니다. 입금, 출금, 송금 등의 기록이 기록되어 있으며, 계좌와 연결되어 사용됩니다.", "options": ["도장", "서명", "창구", "통장"], "answer": 3, "explain": "① 도장 भनेको सहीछाप वा ल्याछाप लगाउने छाप हो ✗\n② 서명 भनेको हस्ताक्षर हो ✗\n③ 창구 भनेको बैंकको काउन्टर हो ✗\n④ 통장 भनेको बैंक पासबुक हो ✓"}, {"n": "223", "q": "통장의 입출금 내역과 잔액 따위를 확인하기 위하여, 창구나 자동화 기기를 통해 기록을 정리하는 일입니다.", "options": ["잔액 조회", "계좌 이체", "통장 정리", "인터넷뱅킹"], "answer": 2, "explain": "① 잔액 조회 भनेको मौज्दात रकम हेर्नु हो ✗\n② 계좌 이체 भनेको खाताबाट पैसा स्थानान्तरण गर्नु हो ✗\n③ 통장 정리 भनेको पासबुक अपडेट वा स्टेटमेन्ट प्रिन्ट गर्नु हो ✓\n④ 인터넷뱅킹 भनेको अनलाइन बैंकिङ हो ✗"}, {"n": "224", "q": "개인이나 단체의 신분을 증명하거나 공식 문서에 사용하기 위해 이름 등을 새긴 도구입니다. 서명 대신 사용되며, 계약서나 신청서 등에 찍어 법적 효력을 가집니다.", "options": ["창구", "카드", "도장", "서명"], "answer": 2, "explain": "① 창구 भनेको काउन्टर हो ✗\n② 카드 भनेको कार्ड हो ✗\n③ 도장 भनेको कागजातमा आधिकारिकताका लागि प्रयोग गरिने सहीछाप (सील/स्टाम्प) हो ✓\n④ 서명 भनेको हस्ताक्षर हो ✗"}, {"n": "225", "q": "순서를 정하기 위해 사용하는 표로, 번호를 부여해 차례대로 처리할 수 있게 도와줍니다. 병원, 은행, 관공서 등에서 대기 순서를 관리할 때 주로 사용됩니다.", "options": ["번호표", "신청서", "예금주", "영수증"], "answer": 0, "explain": "① 번호표 भनेको पालो लिनका लागि दिइने नम्बर पर्ची (टोकन) हो ✓\n② 신청서 भनेको निवेदन फारम हो ✗\n③ 예금주 भनेको खातावाला हो ✗\n④ 영수증 भनेको बिल वा रसिद हो ✗"}, {"n": "226", "q": "개인의 신원을 증명하기 위해 발급되는 공식 문서입니다. 주민등록증, 운전면허증, 여권 등이 이에 해당하며, 본인 확인이 필요한 상황에서 사용됩니다.", "options": ["신청서", "신분증", "이력서", "보험증"], "answer": 1, "explain": "① 신청서 भनेको आवेदन फारम हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 신분증 भनेको परिचय पत्र हो, जुन व्यक्तिको पहिचान प्रमाणित गर्न जारी गरिने आधिकारिक कागजात हो र यसले विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 이력서 भनेको बायोडाटा वा व्यक्तिगत विवरण हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 보험증 भनेको बीमा कार्ड हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "227", "q": "은행 계좌에서 현금을 인출하거나 잔액 조회, 송금 등의 업무를 할 수 있는 자동화된 기계입니다. 카드나 비밀번호를 이용해 24시간 이용할 수 있어 편리합니다.", "options": ["자동 판매기", "현금 인출기", "계좌 이체", "통"], "answer": 1, "explain": "① 자동 판매기 भनेको भेंडिङ मेसिन (स्वचालित बिक्री गर्ने मेशिन) हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 현금 인출기 भनेको नगद झिक्ने मेशिन (एटिएम) हो, जसले बैंक खाताबाट नगद झिक्ने, ब्यालेन्स जाँच गर्ने जस्ता काम गर्छ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 계좌 이체 भनेको खाता स्थानान्तरण हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 통 भनेको भाँडो वा पिँडौं हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "228", "q": "한 나라의 돈을 다른 나라의 돈으로 바꾸는 과정입니다. 주로 해외 여행이나 국제 거래 시 필요하며, 은행이나 환전소에서 할 수 있습니다.", "options": ["환전", "입금", "출금", "송금"], "answer": 0, "explain": "① 환전 भनेको मुद्रा सटही (पैसा साट्ने काम) हो, जसले एक देशको पैसा अर्को देशको पैसामा साट्ने प्रक्रिया बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n② 입금 भनेको जम्मा गर्ने काम हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 출금 भनेको पैसा झिक्ने काम हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 송금 भनेको रेमिट्यान्स वा पैसा पठाउने काम हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "229", "q": "외국인 근로자들이 한국에서 일하며 겪는 어려움을 상담하고 지원하는 기관입니다. 체류, 생활, 법률 문제 등에 대한 정보와 모국어로 도움을 제공합니다.", "options": ["고용노동부", "외국인력상담센터", "다문화센터", "근로복지센터"], "answer": 1, "explain": "① 고용노동부 भनेको श्रम तथा रोजगार मन्त्रालय हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 외국인력상담센터 भनेको विदेशी कामदार परामर्श केन्द्र हो, जसले वैदेशिक कामदारहरूको समस्या समाधान र सहयोग गर्छ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 다문화센터 भनेको बहुसांस्कृतिक केन्द्र हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 근로복지센터 भनेको श्रमिक कल्याण केन्द्र हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "230", "q": "어떤 사실이나 주장이 사실임을 입증할 수 있는 자료나 정보입니다. 예를 들어, 사건이 일어난 시간, 장소, 사람 등을 증명할 수 있는 물건 등이 이에 해당합니다.", "options": ["가해자", "피해자", "증인", "증거"], "answer": 3, "explain": "① 가해자 भनेको अरूलाई हानि पुऱ्याउने मानिस हो, त्यसैले यो होइन। ✗\n② 피해자 भनेको हानि वा चोट भोगेको पीडित मानिस हो, त्यसैले यो होइन। ✗\n③ 증인 भनेको घटना देख्ने साक्षी मानिस हो, त्यसैले यो होइन। ✗\n④ 증거 भनेको कुनै तथ्य वा घटना सत्य हो भनेर प्रमाणित गर्ने प्रमाण वा सामग्री हो, त्यसैले यो सही उत्तर हो। यो प्रश्नका विकल्पहरू किताबमा छापिएका छैनन्, शिक्षकले दिनुभएको हो। ✓"}, {"n": "231", "q": "공장이나 사무실 같은 물리적인 공간으로, 사람들이 일정한 작업이나 업무를 수행하는 장소를 말합니다.", "options": ["작업대", "작업장", "작업 관리", "작업 순서"], "answer": 1, "explain": "① 작업대 भनेको काम गर्ने टेबल हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 작업장 भनेको कार्यस्थल वा काम गर्ने ठाउँ हो, जसले मानिसहरूले निश्चित काम गर्ने भौतिक ठाउँलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 작업 관리 भनेको कामको व्यवस्थापन हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 작업 순서 भनेको कामको क्रम हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "232", "q": "작업을 할 때 나무나 금속 조각과 같은 물건을 단단히 고정시켜 도구를 사용할 수 있는 테이블입니다.", "options": ["작업대", "서랍장", "손수레", "옷장"], "answer": 0, "explain": "① 작업대 भनेको काम गर्ने टेबल (वर्कबेञ्च) हो, जसले काठ वा धातुका टुक्राहरूलाई कच्याककुचुक नगरी कडासँग अड्याएर औजार प्रयोग गर्न मिल्ने टेबल बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n② 서랍장 भनेको दराज हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 손수레 भनेको हाते ठेला हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 옷장 भनेको कपडा राख्ने दराज हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "233", "q": "물건이나 자재 등을 보관하기 위한 공간 또는 건물을 말하며 상품, 식료품, 기계 부품 등을 보관합니다.", "options": ["창고", "복도", "기숙사", "관리소"], "answer": 0, "explain": "① 창고 भनेको सामान, खाद्यान्न वा पार्टपुर्जा भण्डार गर्ने गोदाम हो, त्यसैले यो विवरणसँग मिल्छ र सही उत्तर हो। ✓\n② 복도 भनेको हिँड्ने बाटो वा बरण्डा हो, सामान राख्ने ठाउँ होइन। ✗\n③ 기숙사 भनेको कामदारहरू बस्ने होस्टेल हो, सामान भण्डार गर्ने ठाउँ होइन। ✗\n④ 관리소 भनेको भवन वा क्षेत्रको हेरचाह गर्ने कार्यालय हो, सामान राख्ने गोदाम होइन। ✗"}, {"n": "234", "q": "어떤 일이나 업무를 맡아 책임지고 수행하는 사람을 말합니다. 고객 상담을 맡은 직원이나 창고 관리 책임자 등 이에 해당합니다.", "options": ["공장장", "담당자", "과장", "반장"], "answer": 1, "explain": "① 공장장 भनेको कारखाना प्रमुख हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 담당자 भनेको जिम्मेवार व्यक्ति वा सम्पर्क व्यक्ति हो, जसले कुनै कामको जिम्मेवारी लिएर त्यसलाई पूरा गर्ने व्यक्तिलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 과장 भनेको विभाग प्रमुख (कावा) हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 반장 भनेको बान्जाङ (समूह नेता) हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "235", "q": "물체나 공간이 얼마나 따뜻하거나 차가운지를 나타내는 물리적인 양입니다. 섭씨(°C)나 화씨(°F) 단위로 측정하며, 열의 세기와 관련이 있습니다.", "options": ["날씨", "계절", "온도", "환경"], "answer": 2, "explain": "① 날씨 भनेको मौसम हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 계절 भनेको ऋतु हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 온도 भनेको तापक्रम हो, जसले बस्तु वा ठाउँ कति तातो वा चिसो छ भन्ने भौतिक मात्रालाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n④ 환경 भनेको वातावरण हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "236", "q": "한 나라나 지역의 경제에서 각 산업(농업, 제조업, 서비스업 등)이 차지하는 비중과 이들 사이의 상호 관계를 나타내는 개념입니다.", "options": ["산업 개발", "산업 경제", "산업 관리", "산업 구조"], "answer": 3, "explain": "① 산업 개발 भनेको उद्योग विकास हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 산업 경제 भनेको औद्योगिक अर्थतन्त्र हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 산업 관리 भनेको उद्योग व्यवस्थापन हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 산업 구조 भनेको औद्योगिक संरचना हो, जसले देशको अर्थतन्त्रमा विभिन्न उद्योगहरूको हिस्सा र सम्बन्धला const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-05';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Renders the explanation as a structured list: the explanation string is
// lines separated by "\n" — first line is the question's own meaning
// ("प्रश्नको अर्थ: ..."), then one line per option ("① <word> ... ✓/✗").
// Lines render as separate rows; the ✓ line gets a green tint and the ✓/✗
// marker is coloured. Explanations without line breaks (fallback prose)
// render as a single paragraph, exactly as before. Uses text nodes only,
// never innerHTML, so explanation text is never parsed as markup.
function renderExplain(box, explain) {
  const lines = (explain || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length <= 1) {
    const b = document.createElement('b');
    b.textContent = 'किन? ';
    box.appendChild(b);
    const s = document.createElement('span');
    s.textContent = explain;
    box.appendChild(s);
    return;
  }
  const label = document.createElement('div');
  label.className = 'explain-label';
  label.textContent = 'व्याख्या';
  box.appendChild(label);
  lines.forEach((ln, li) => {
    const d = document.createElement('div');
    if (li === 0 && ln.indexOf('प्रश्नको अर्थ') === 0) {
      d.className = 'explain-stem';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    if (ln.indexOf('शिक्षकको उत्तर-पत्र:') === 0) {
      d.className = 'exp-note';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    const mark = ln.endsWith('✓') ? '✓' : (ln.endsWith('✗') ? '✗' : '');
    const body = mark ? ln.slice(0, -1).trim() : ln;
    d.className = 'exp-line' + (mark === '✓' ? ' exp-ok' : '');
    d.appendChild(document.createTextNode(body + (mark ? ' ' : '')));
    if (mark) {
      const m = document.createElement('span');
      m.className = 'exp-mark ' + (mark === '✓' ? 'ok' : 'no');
      m.textContent = mark;
      d.appendChild(m);
    }
    box.appendChild(d);
  });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    renderExplain(card.querySelector('.explain'), q.explain);
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
