<title>EPS-TOPIK Vocabulary Quiz — Set 09 (Q401–Q450)</title>
<style>
  :root {

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans KR", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(600px 300px at 85% -5%, rgba(219,39,119,.12), transparent 60%), radial-gradient(500px 260px at -5% 10%, rgba(124,58,237,.12), transparent 60%); background-attachment: fixed; color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.94); color: #6d28d9; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; box-shadow: 0 2px 10px rgba(0,0,0,.2); margin-bottom: 14px; transition: transform .15s, box-shadow .15s; }
  .back-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.24); }
  header { background: var(--grad); color: #fff; padding: 26px 16px 20px; position: relative; box-shadow: 0 4px 24px rgba(109,40,217,.35); overflow: hidden; }
  header::before { content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28), transparent 65%); top: -160px; right: -60px; pointer-events: none; }
  header::after { content: ""; position: absolute; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.18), transparent 65%); bottom: -140px; left: -40px; pointer-events: none; }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.55rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.18); }
  header p { opacity: .94; font-size: .92rem; margin-top: 4px; }
  .progress-wrap { margin-top: 14px; background: rgba(255,255,255,.28); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.15); }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #fde68a, #ffffff); width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(255,255,255,.7); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .85; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: #c4b5fd; }
  .q-num { display: inline-block; font-size: .78rem; font-weight: 800; color: #fff; background: var(--grad); padding: 4px 14px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 8px rgba(219,39,119,.35); }
  .q-text { font-size: 1.12rem; white-space: pre-line; margin: 10px 0 16px; line-height: 1.85; font-weight: 500; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid var(--border); border-radius: 14px; margin-bottom: 9px; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #fff; }
  .options label:hover { border-color: #a78bfa; background: #fbf9ff; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(124,58,237,.12); }
  .options label::before { content: ""; flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; border: 2px solid #c7c2f5; background: #fff; transition: all .15s; }
  .options label.selected { background: var(--grad-soft); border-color: var(--primary); box-shadow: 0 4px 16px rgba(124,58,237,.18); }
  .options label.selected::before { border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 4px #fff; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #db2777; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 700; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 4px 16px rgba(219,39,119,.4); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 8px 22px rgba(219,39,119,.45); }
  .btn-primary:disabled { background: #d6d3f5; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: #fff; color: #6d28d9; border: 2px solid #e9e4fb; }
  .btn-ghost:hover { border-color: #a78bfa; background: #fbf9ff; }
  .submit-bar { position: sticky; bottom: 0; background: rgba(255,255,255,.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 20px rgba(109,40,217,.1); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: var(--grad); color: #fff; border: none; border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; color: #fff; line-height: 1.05; text-shadow: 0 2px 16px rgba(0,0,0,.2); }
  .score-card .pct { font-size: 1.15rem; color: rgba(255,255,255,.94); margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: rgba(255,255,255,.96); }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 2px 10px rgba(219,39,119,.35); }
  .review-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: linear-gradient(135deg, #059669, #10b981); }
  .verdict.no { background: linear-gradient(135deg, #e11d48, #f43f5e); }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #f8f6ff; border: 1px solid #e9e4fb; border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; }
  .explain b { color: var(--primary-dark); }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin-bottom: 10px; }
  .explain-stem { background: linear-gradient(135deg, #ede9fe, #fce7f3); border-left: 4px solid #7c3aed; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; }
  .exp-line { padding: 10px 12px; border-top: 1px solid #e9e4fb; line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: var(--green); }
  .exp-mark.no { color: var(--red); }
  .exp-note { background: linear-gradient(135deg, #fffbeb, #fef3c7); border: 1px solid #fcd34d; border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }

</style>

<script>
const QUESTIONS = [{"n": "401", "q": "어떤 물체나 구조물의 표면이 갈라져 금이 가는 상태입니다. 주로 건축물, 도로, 유리, 땅 등의 표면에 생기는 좁고 길게 벌어진 틈을 가리킵니다.", "options": ["균열", "물기", "부식", "녹"], "answer": 0, "explain": "1. 균열 भनेको चर्किएको वा फुटेको भाग हो, जुन सतहमा मसिनो रेखा जस्तै फाट्ने विवरणसँग एकदम मिल्छ।\n2. 물기 भनेको ओस वा पानीको मात्रा हो, त्यसैले यो चर्किएको अवस्था होइन।\n3. 부식 भनेको धातु खिइने वा नष्ट हुने प्रक्रिया हो, त्यसैले यो विवरणसँग मिल्दैन।\n4. 녹 भनेको फलाममा लाग्ने खिया हो, त्यसैले यो पनि सही होइन।\nतसर्थ, सही उत्तर १ नम्बरको 균열 (चर्किएको भाग) हो।"}, {"n": "402", "q": "산화되어 생긴 부식물로, 주로 철이나 강철에서 발생합니다. 이를 방지하기 위해 정기적인 청소와 방청 처리가 필요합니다.", "options": ["면적", "물기", "폭", "녹"], "answer": 3, "explain": "1. 면적 भनेको क्षेत्रफल हो, त्यसैले यो फलाममा लाग्ने वस्तु होइन।\n2. 물기 भनेको ओस वा पानीको मात्रा हो, त्यसैले यो विवरणसँग मिल्दैन।\n3. 폭 भनेको चौडाइ हो, त्यसैले यो पनि सही उत्तर होइन।\n4. 녹 भनेको फलाममा लाग्ने खिया हो, जुन अक्सिजन र पानीको सम्पर्कले हुने खियाको विवरणसँग एकदम मिल्छ।\nतसर्थ, सही उत्तर ४ नम्बरको 녹 (खिया) हो।"}, {"n": "403", "q": "선박이나 다른 시설에서 안전을 위해 설치된 보호용 장치입니다. 주로 선박의 갑판이나 계단, 출입구 등에 설치되어 승객이나 선원이 떨어지는 사고를 방지하는 역할을 합니다.", "options": ["프로펠러", "도료 호스", "안전난간", "작업발판"], "answer": 2, "explain": "1. 프로펠러 भनेको जहाज गुडाउने पंखा हो, त्यसैले यो सुरक्षा बार होइन।\n2. 도료 호스 भनेको रङ लगाउने पाइप हो, त्यसैले यो विवरणसँग मिल्दैन।\n3. 안전난간 भनेको सुरक्षा बार हो, जुन मानिसहरू तल खस्नबाट जोगाउने सुरक्षा उपकरणको विवरणसँग एकदम मिल्छ।\n4. 작업발판 भनेको काम गर्दा उभिने प्लेटफर्म हो, त्यसैले यो सुरक्षा बार होइन।\nतसर्थ, सही उत्तर ३ नम्बरको 안전난간 (सुरक्षा बार) हो।"}, {"n": "404", "q": "선박이나 건설 현장 등에서 작업자가 안전하게 작업을 할 수 있도록 설치된 평평한 표면입니다. 작업 중에 대 위에 서서 작업할 수 있도록 줍니다.", "options": ["비계기둥", "밑둥잡이", "안전난간", "작업발판"], "answer": 3, "explain": "१. '비계기둥' भनेको स्काफोल्डिङको खम्बा हो, यो टेकेर उभिने समथर भाग होइन।\n२. '밑둥잡이' भनेको तल्लो भाग अड्याउने काठ वा खाँबो हो, यो कामदार उभिने ठाउँ होइन।\n३. '안전난간' भनेको सुरक्षा रेलिङ हो, यसले खस्नबाट जोगाउँछ तर उभिने सतह होइन।\n४. '작업발판' भनेको काम गर्ने फल्याक वा समथर प्लेटफर्म हो, जसमा उभिएर कामदारले सुरक्षित रूपमा काम गर्न सक्छन्, त्यसैले यो सही विवरण हो।\nत्यसैले सही उत्तर ४ नम्बरको '작업발판' (काम गर्ने फल्याक) हो।"}, {"n": "405", "q": "작업 현장이나 선박 등에서 작업자의 안전과 편의를 위해 바닥에 까는 단단하고 평평한 판입니다. 미끄럼 방지나 충격 완화, 바닥 보호 등의 역할을 합니다.", "options": ["가세", "깔판", "띠장", "면적"], "answer": 1, "explain": "१. '가세' भनेको तिरछा टेको हो, जसले संरचनालाई अड्याउँछ तर भुइँमा ओछ्याउने पाटा होइन।\n२. '깔판' भनेको भुइँमा ओछ्याउने म्याट वा पाटा हो, जसले चिप्लिनबाट जोगाउँछ र भुइँको रक्षा गर्छ, त्यसैले यो सही विवरण हो।\n३. '띠장' भनेको तेर्सो बीम हो, यो भुइँमा ओछ्याउने पाटा होइन।\n४. '면적' भनेको क्षेत्रफल हो, यो कुनै ओछ्याउने सामग्री होइन।\nत्यसैले सही उत्तर २ नम्बरको '깔판' (भुइँमा ओछ्याउने म्याट वा पाटा) हो।"}, {"n": "406", "q": "구조물의 강도를 보강하거나 외부 충격을 분산시키기 위해 설치하는 가로막대 또는 지지재입니다. 선박이나 건설 구조물에서 자주 사용되며, 안정성과 내구성을 높이는 역할을 합니다.", "options": ["기둥", "깔판", "띠장", "장선"], "answer": 2, "explain": "१. 기둥 भनेको खम्भा हो, यो ठाडो भार थाम्न प्रयोग हुन्छ र वर्णन गरिएको तेर्सो बार होइन। २. 깔판 भनेको भुइँमा राख्ने फट्टा वा म्याट हो, यो बलियो बनाउने तेर्सो बार वा सपोर्ट होइन। ३. 띠장 भनेको संरचनाको बलियोपन बढाउन वा बाह्य धक्का छर्रन राखिने तेर्सो बार वा सपोर्ट हो, त्यसैले यो सही उत्तर हो। ४. 장선 भनेको ढलान वा फ्लोर जोइस्ट हो, यो मुख्यतया फ्लोरको भार थाम्न हुन्छ। सही उत्तर 띠장 हो जसले संरचनाको शक्ति बढाउँछ।"}, {"n": "407", "q": "선박의 뼈대를 이루는 구조 부재로, 바닥(갑판)을 지지하기 위해 가로 방향으로 설치됩니다. 선체의 강도를 높이고, 갑판 하중을 고르게 분산시키는 역할을 합니다.", "options": ["가세", "난간", "균열", "장선"], "answer": 3, "explain": "१. 가세 भनेको छड्के टेको (ब्रेस) हो, यो तेर्सो दिशामा राखिने डेक सपोर्ट होइन। २. 난간 भनेको रेलिङ हो, यो सुरक्षाका लागि छेउमा राखिन्छ। ३. 균열 भनेको चिरा वा धाँजा (क्र्याक) हो, यो संरचनात्मक भाग होइन। ४. 장선 भनेको जहाज वा निर्माणमा भुइँ वा डेकलाई टेवा दिन तेर्सो दिशामा राख지는 स्ट्रक्चरल मेम्बर हो, त्यसैले यो सही उत्तर हो। सही उत्तर 장선 हो।"}, {"n": "408", "q": "구조물의 강도를 보강하기 위해 설치하는 보조 부재입니다. 선박에서는 장선이나 기둥 등이 받는 힘을 분산시키고 구조적 안정성을 높이기 위해 사용됩니다.", "options": ["가세", "깔판", "띠장", "면적"], "answer": 0, "explain": "१. 가세 भनेको संरचनाको शक्ति बढाउन राखिने सहायक सदस्य वा छड्के टेको (ब्रेस) हो, त्यसैले यो सही उत्तर हो। २. 깔판 भनेको आधारमा राखिने फट्टा वा म्याट हो। ३. 띠장 भनेको तेर्सो बार हो। ४. 면적 भनेको क्षेत्रफल हो। सही उत्तर 가세 हो।"}, {"n": "409", "q": "재배할 때, 외부 환경(온도, 습도, 바람 등)으로부터 보호하기 위해 비닐을 씌워 만든 임시 또는 반영구적인 구조물입니다.", "options": ["비닐하우스", "울타리망", "방열복", "차광막"], "answer": 0, "explain": "१. 비닐하우스 भनेको बिरुवा खेती गर्दा बाह्य वातावरणबाट बचाउन प्लास्टिकले छोपेर बनाइएको संरचना हो, त्यसैले यो सही उत्तर हो। २. 울타리망 भनेको बार वा जाली हो। ३. 방열복 भनेको तातोबाट बचाउने पोसाक हो। ४. 차광막 भनेको घाम छेक्ने जाली हो। सही उत्तर 비닐하우스 हो।"}, {"n": "410", "q": "구조물이나 장비를 안정적으로 버티고 지탱하기 위해 설치하는 부재입니다. 선박에서는 장비 고정, 작업 안정, 구조물 보강 등 다양한 용도로 사용됩니다.", "options": ["지지대", "대각선", "구조물", "중앙부"], "answer": 0, "explain": "१. 지지대 भनेको संरचना वा उपकरणलाई स्थिर रूपमा थाम्न राखिने टेको वा सपोर्ट हो, त्यसैले यो सही उत्तर हो। २. 대각선 भनेको कर्णाकार वा छड्के रेखा हो। ३. 구조물 भनेको संरचना हो। ४. 중앙부 भनेको केन्द्रीय भाग हो। सही उत्तर 지지대 हो।"}, {"n": "411", "q": "땅속에서 캐내는 소중한 자원으로, 암석이나 금속처럼 쓸모 있는 것입니다. 예를 들면 철, 금, 석탄 같은 것이 있고, 이것들은 공장이나 건설, 전기 만들기에 쓰입니다.", "options": ["삼림 보호", "광물 자원", "온실 가스", "천연자원"], "answer": 1, "explain": "१. 삼림 보호 भनेको जङ्गल संरक्षण हो। २. 광물 자원 भनेको खनिज साधन हो, जुन जमिनमुनिबाट निकालिने फलाम, सुन, कोइला जस्ता उपयोगी वस्तु हुन्, त्यसैले यो सही उत्तर हो। ३. 온실 가스 भनेको हरितगृह ग्यास हो। ४. 천연자원 भनेको प्राकृतिक स्रोत हो (यो अलि फराकिलो अर्थ हुन्छ तर खनिजलाई विशेष रूपमा 광물 자원 भनिन्छ)। सही उत्तर 광물 자원 हो।"}, {"n": "412", "q": "갱도의 입구로, 즉 땅속으로 들어가는 통로나 문을 말합니다. 작업자나 장비가 드나들고, 공기가 드나드는 중요한 장소입니다.", "options": ["광부", "수갱", "갱구", "갱도"], "answer": 2, "explain": "१. 광부 भनेको खानी मजदुर हो। २. 수갱 भनेको ठाडो सुरुङ हो। ३. 갱구 भनेको सुरुङको मुख वा प्रवेशद्वार हो, जहाँबाट मानिस, उपकरण र हावा आवतजावत गर्छ, त्यसैले यो सही उत्तर हो। ४. 갱도 भनेको सुरुङ हो। सही उत्तर 갱구 हो।"}, {"n": "413", "q": "지하에서 물을 퍼내거나, 지하수를 채굴하기 위해 파는 구멍이나 갱도를 말합니다. 주로 광산이나 건설 현장에서 지하수 문제를 해결하기 위해 사용됩니다.", "options": ["사갱", "수갱", "갱구", "광차"], "answer": 1, "explain": "१. 사갱 भनेको छड्के सुरुङ हो। २. 수갱 भनेको जमिनमुनिबाट पानी फाल्न वा भूमिगत पानी निकाल्न खनिएको ठाडो सुरुङ वा प्वाल हो, त्यसैले यो सही उत्तर हो। ३. 갱구 भनेको सुरुङको मुख हो। ४. 광차 भनेको कोइला वा खनिज बोक्ने गाडी हो। सही उत्तर 수갱 हो।"}, {"n": "414", "q": "광물 자원을 채굴하기 위해 수직으로 파는 갱도를 말합니다. 주로 깊은 곳에 있는 광석을 캐내기 위해 사용되며, 작업자나 자재를 운반하는 통로로 활용됩니다.", "options": ["사갱", "수갱", "탄광", "광차"], "answer": 1, "explain": "१. 사갱 भनेको छड्के सुरुङ हो। २. 수갱 भनेको खनिज निकाल्नका लागि ठाडो रूपमा खनिएको सुरुङ हो, जसले मजदुर र सामग्री ओसार्न सघाउँछ, त्यसैले यो सही उत्तर हो। ३. 탄광 भनेको कोइला खानी हो। ४. 광차 भनेको खानीको गाडी हो। सही उत्तर 수갱 हो।"}, {"n": "415", "q": "채광장은 광물을 캐내기 위해 만들어진 장소입니다. 광석, 석탄 등을 채굴하는 광산이나 채굴 현장을 말합니다.", "options": ["인차", "수갱", "탄광", "막장"], "answer": 3, "explain": "१. 인차 भनेको मानिस बोक्ने गाडी हो। २. 수갱 भनेको ठाडो सुरुङ हो। ३. 탄광 भनेको कोइला खानी हो। ४. 막장 भनेको खानीमा खनिज खन्ने मुख्य ठाउँ वा च्यानल (채광장) हो, त्यसैले यो सही उत्तर हो। सही उत्तर 막장 हो।"}, {"n": "416", "q": "광산에서 광물을 채굴하는 일을 하는 사람을 말합니다. 땅속에서 자원을 캐내는 일을 하며, 작업이 위험하고 힘든 경우가 많습니다.", "options": ["주부", "광부", "농부", "어부"], "answer": 1, "explain": "१. 주부 भनेको गृहणी हो। २. 광부 भनेको खानी मजदुर हो, जसले जमिनमुनिबाट खनिज खन्ने काम गर्छ, त्यसैले यो सही उत्तर हो। ३. 농부 भनेको किसान हो। ४. 어부 भनेको माछा मार्ने मानिस हो। सही उत्तर 광부 हो।"}, {"n": "417", "q": "광산에서 작업자를 데리고 다니는 차량입니다. 광산 내에서 작업자들이 이동할 때 사용하는 이동 수단입니다.", "options": ["수레", "막장", "인차", "광차"], "answer": 2, "explain": "१. '수레' भनेको हातले घकेल्ने गाडा हो, यो खानीमा मानिस ओसार्ने गाडी होइन।\n२. '막장' भनेको खानीको अन्तिम खन्ने ठाउँ हो, यो सवारी साधन होइन।\n३. '인차' भनेको खानीभित्र कामदारहरूलाई ल्याउने र लैजाने गाडी हो, त्यसैले यो सही विवरण हो।\n४. '광차' भनेको खनिज पदार्थ वा कोइला ओसार्ने गाडा हो, मानिस बोक्ने गाडी होइन।\nत्यसैले सही उत्तर ३ नम्बरको '인차' (कामदार बोक्ने खानीको गाडी) हो।"}, {"n": "418", "q": "광산에서 광물을 운반하는 수레나 운반 도구로, 보통 광물이나 자재를 지하에서 지상으로 이동시키는 데 사용됩니다.", "options": ["탄광", "막장", "인차", "광차"], "answer": 3, "explain": "१. '탄광' भनेको कोइला खानी हो, यो सामान ओसार्ने साधन होइन।\n२. '막장' भनेको खानीको अन्तिम सुरुङ क्षेत्र हो, यो गाडी वा गाडा होइन।\n३. '인차' भनेको कामदार बोक्ने गाडी हो, खनिज ओसार्ने गाडा होइन।\n४. '광차' भनेको खानीबाट खनिज र सामग्रीहरू बोकेर ओसार्ने गाडा हो, त्यसैले यो सही विवरण हो।\nत्यसैले सही उत्तर ४ नम्बरको '광차' (खनिज ओसार्ने गाडा) हो।"}, {"n": "419", "q": "광산에서 채굴한 광물이나 자재를 갱도 위로 끌어올리는 기계입니다. 주로 수직으로 설치되어, 광물이나 작업자를 지상으로 안전하게 운반하는 역할을 합니다.", "options": ["권양기", "지지대", "수평경", "재광장"], "answer": 0, "explain": "१. 권양기 भनेको विन्च वाहोइस्ट मेसिन हो, जसले खानीबाट खनिज वा मानिसलाई माथि तान्ने काम गर्छ, त्यसैले यो सही उत्तर हो। २. 지지대 भनेको टेको हो। ३. 수평경 भनेको तेर्सो सुरुङ हो। ४. 재광장 भनेको खानी पुन: सञ्चालन गर्ने ठाउँ हो। सही उत्तर 권양기 हो।"}, {"n": "420", "q": "탄광에서 캐낸 석탄을 분류, 세척, 가공하는 곳입니다. 석탄에 섞인 돌이나 불순물을 제거하고, 용도에 따라 크기나 품질별로 나눠서 저장하거나 운반 준비를 합니다.", "options": ["석회선", "선탄장", "수평경", "재광장"], "answer": 1, "explain": "१. '석회선' भनेको चुना ढुंगाको रेखा वा क्षेत्र हो, कोइला सफा गर्ने ठाउँ होइन।\n२. '선탄장' भनेको कोइला छुट्याउने र सफा गर्ने ठाउँ हो, त्यसैले यो सही विवरण हो।\n३. '수평경' भनेको तेर्सो सुरुङ हो, प्रसोधन केन्द्र होइन।\n४. '재광장' भनेको पुन: खानी क्षेत्र हो, कोइला छान्ने ठाउँ होइन।\nत्यसैले सही उत्तर २ नम्बरको '선탄장' (कोइला छान्ने ठाउँ) हो।"}, {"n": "421", "q": "단단한 암석이나 광맥을 깨뜨리기 위해 사용하는 공구 또는 기계입니다. 주로 광산, 터널, 건설 현장에서 바위를 뚫거나 깨는 데 쓰입니다.", "options": ["청소기", "세탁기", "착암기", "건조기"], "answer": 2, "explain": "१. 청소기 भनेको फोहर सरसफाइ गर्ने भ्याकुम क्लिनर हो, त्यसैले यो चट्टान फुटाउने औजार होइन। २. 세탁기 भनेको लुगा धुने मेसिन हो, त्यसैले यो खानीमा प्रयोग हुने उपकरण होइन। ३. 착암기 भनेको कडा चट्टान वा ढुंगा फुटाउन प्रयोग गरिने मेसिन हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ४. 건조기 भनेको सामान वा लुगा सुकाउने मेसिन हो, त्यसैले यो गलत छ। त्यसैले सही उत्तर ३ नम्बरको 착암기 हो, जसको अर्थ ढुंगा फुटाउने मेसिन हुन्छ।"}, {"n": "422", "q": "광산이나 공장 등에서 물건이나 자재를 자동으로 옮기는 장치입니다. 벨트나 롤러 위에 광물, 석탄, 자재 등을 올려놓으면 연속적으로 이동시켜 작업 효율을 높여줍니다.", "options": ["트플링실", "스크레이퍼", "컨베이어", "안전난간"], "answer": 2, "explain": "१. 트플링실 को अर्थ त्रिपलिंग सिल हो, यो यस विवरणसँग सम्बन्धित छैन त्यसैले मिल्दैन। २. 스크레이퍼 को अर्थ स्क्रैपर हो, यो उत्खनन वा सम्याउने उपकरण हो त्यसैले मिल्दैन। ३. 컨베이어 को अर्थ कन्भेयर बेल्ट हो, यो खानी वा कारखानाहरूमा सामान वा सामग्रीहरू स्वचालित रूपमा सार्ने उपकरण हो त्यसैले यो सही उत्तर हो। ४. 안전난간 को अर्थ सुरक्षा रेलिङ हो, यो खस्नबाट बच्ने बार हो त्यसैले मिल्दैन। सही उत्तर 컨베이어 हो जसको अर्थ कन्भेयर बेल्ट हुन्छ। पहिलो विकल्प '트플링실' किताबमा छापिएजस्तै राखिएको छ।"}, {"n": "423", "q": "땅속에 있는 석탄을 캐내는 작업을 말합니다. 탄광에서 광부들이 석탄을 파내어 운반하는 모든 과정을 포함하며, 광업의 중요한 단계입니다.", "options": ["간격", "탄광", "광부", "채탄"], "answer": 3, "explain": "१. 간격 भनेको दुई वस्तु वा समय बीचको दुरी हो, त्यसैले यो कोइला खन्ने काम होइन। २. 탄광 भनेको कोइला निकालिने खानी हो, तर यो कार्य होइन। ३. 광부 भनेको खानीमा काम गर्ने कामदार हो, तर यो प्रक्रिया होइन। ४. 채탄 भनेको जमिनमुनिबाट कोइला खनेर निकाल्ने कार्य हो, त्यसैले यो विवरणसँग एकदम मिल्छ। त्यसैले सही उत्तर ४ नम्बरको 채탄 हो, जसको अर्थ कोइला खन्ने कार्य हुन्छ।"}, {"n": "424", "q": "숲에서 얻을 수 있는 유용한 자원으로, 나무, 풀, 버섯 같은 것들이 포함됩니다. 목재는 건축, 가구, 연료 등으로 쓰이며, 숲은 공기 정화와 생태계 보호에도 큰 역할을 합니다.", "options": ["문화유산", "산림 자원", "개인 재산", "천연자원"], "answer": 1, "explain": "१. 문화유산 को अर्थ सांस्कृतिक सम्पदा हो, यो जङ्गलका स्रोतसँग सम्बन्धित छैन त्यसैले मिल्दैन। २. 산림 자원 को अर्थ वन स्रोत हो, यो जङ्गलबाट प्राप्त हुने रुख, घाँस, च्याउ आदि उपयोगी स्रोतहरूलाई जनाउँछ त्यसैले यो सही उत्तर हो। ३. 개인 재산 को अर्थ व्यक्तिगत सम्पत्ति हो, यो वन स्रोतको परिभाषा होइन त्यसैले मिल्दैन। ४. 천연자원 को अर्थ प्राकृतिक स्रोत हो, यो धेरै फराकिलो शब्द हो तर विशेष गरी जङ्गलका वस्तुहरूलाई 산림 자원 भनिन्छ त्यसैले यहाँ 산림 자원 मिल्छ। सही उत्तर 산림 자원 हो जसको अर्थ वन स्रोत हुन्छ।"}, {"n": "425", "q": "나무의 뿌리까지 뽑아내는 작업으로, 이식이나 제거할 때 사용됩니다. 주로 조경이나 산림관리에서 이루어집니다.", "options": ["굴취", "갱도", "도장", "채탄"], "answer": 0, "explain": "१. 굴취 को अर्थ रुख वा बिरुवाको जरासहित उखेल्ने काम हो, यो रूखलाई जरादेखि नै निकाल्ने कामसँग सम्बन्धित छ त्यसैले यो सही उत्तर हो। २. 갱도 को अर्थ खानीको सुरुङ हो, यो जमिनमुनिको बाटो हो त्यसैले मिल्दैन। ३. 도장 को अर्थ पेन्टिङ वा रंग लगाउने काम हो, यो रुख उखेल्ने काम होइन त्यसैले मिल्दैन। ४. 채탄 को अर्थ कोइला उत्खनन हो, यो कोइला निकाल्ने काम हो त्यसैले मिल्दैन। सही उत्तर 굴취 हो जसको अर्थ बिरुवा वा रुख जरासहित उखेल्ने काम हुन्छ।"}, {"n": "426", "q": "거칠고 튼튼한 마나 폴리프로필렌 재질로 만든 자루로, 모래, 곡물, 광물, 쓰레기 등을 담아 운반하거나 보관할 때 사용됩니다.", "options": ["담요", "마대", "배낭", "가방"], "answer": 1, "explain": "१. 담요 भनेको ओढ्ने कम्बल हो, त्यसैले यो सामान ओसार्ने बोरा होइन। २. 마대 भनेको जुट वा बलियो प्लास्टिकबाट बनेको बोरा हो, जुन बालुवा वा अन्न राख्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग एकदम मिल्छ। ३. 배낭 भनेको ढाडमा बोक्ने झोला हो, त्यसैले यो ठूलो बोरा होइन। ४. 가방 भनेको सामान राख्ने सामान्य झोला हो, त्यसैले यो पनि सही होइन। त्यसैले सही उत्तर २ नम्बरको 마대 हो, जसको अर्थ बलियो बोरा हुन्छ।"}, {"n": "427", "q": "산림에서 나무를 베어내는 작업을 말합니다. 목재를 얻거나, 땅을 다른 용도로 사용하기 위해 나무를 베며, 계획적이지 않으면 산림 파괴의 원인이 될 수 있습니다.", "options": ["운재", "청소", "벌목", "집재"], "answer": 2, "explain": "१. 운재 को अर्थ काठ ढुवानी हो, यो काटिसकेको काठ सार्ने काम हो त्यसैले मिल्दैन। २. 청소 को अर्थ सरसफाइ हो, यो फोहोर सफा गर्ने काम हो त्यसैले मिल्दैन। ३. 벌목 को अर्थ रुख काट्ने काम (फँडानी) हो, यो वनबाट रुखहरू काट्ने कामलाई जनाउँछ त्यसैले यो सही उत्तर हो। ४. 집재 को अर्थ काठ थुपार्ने काम हो, यो काटेका काठ एक ठाउँमा जम्मा गर्ने काम हो त्यसैले मिल्दैन। सही उत्तर 벌목 हो जसको अर्थ रुख काट्ने काम हुन्छ।"}, {"n": "428", "q": "나무를 정리하거나 쌓아 놓은 재목을 뜻합니다. 주로 산림 작업이나 목재 생산 과정에서 사용되는 말로, 잘라낸 나무를 가공이나 운반을 위해 정리해 놓은 상태를 말합니다.", "options": ["운재", "조재", "벌목", "수확"], "answer": 1, "explain": "१. 운재 को अर्थ काठ ढुवानी हो, यो काठ ओसार्ने काम हो त्यसैले मिल्दैन। २. 조재 को अर्थ काठ मिलाउने वा छाँट्ने काम हो, यो काटेका रुखहरूलाई प्रयोगयोग्य बनाउन मिलाएर राख्ने वा साइज काट्ने काम हो त्यसैले यो सही उत्तर हो। ३. 벌목 को अर्थ रुख काट्ने काम हो, यो रुख ढाल्ने काम हो त्यसैले मिल्दैन। ४. 수확 को अर्थ बाली भित्र्याउने वा कटनी गर्ने काम हो, यो कृषि उत्पादनसँग सम्बन्धित छ त्यसैले मिल्दैन। सही उत्तर 조재 हो जसको अर्थ काठ मिलाएर राख्ने वा छाँट्ने काम हुन्छ।"}, {"n": "429", "q": "산림 작업에서 나무를 자른 후, 정리된 나무를 산 밖이나 가공 장소까지 옮기는 과정을 말합니다.", "options": ["청소", "굴취", "벌목", "운재"], "answer": 3, "explain": "१. 청소 को अर्थ सरसफाइ हो, यो जङ्गल सफा गर्ने काम होइन त्यसैले मिल्दैन। २. 굴취 को अर्थ रुख जरासहित उखेल्ने काम हो, यो ढुवानीसँग सम्बन्धित छैन त्यसैले मिल्दैन। ३. 벌목 को अर्थ रुख काट्ने काम हो, यो रुख ढाल्ने काम हो त्यसैले मिल्दैन। ४. 운재 को अर्थ काठ ढुवानी हो, यो जङ्गलबाट काटिएका काठहरू बाहिर वा प्रशोधन गर्ने ठाउँसम्म ओसार्ने काम हो त्यसैले यो सही उत्तर हो। सही उत्तर 운재 हो जसको अर्थ काठ ढुवानी हुन्छ।"}, {"n": "430", "q": "회전하는 톱날이 달린 쇠사슬을 이용해 나무를 자르는 기계입니다. 강한 나무도 빠르고 효율적으로 절단할 수 있어서 산림 작업에서 중요한 도구입니다.", "options": ["하베스터", "집재장", "체인톱", "벌채지"], "answer": 2, "explain": "१. 하베스터 को अर्थ हार्वेस्टर (रुख काट्ने मेशिन) हो, यो बहु-कार्यकारी वन मेशिन हो त्यसैले मिल्दैन। २. 집재장 को अर्थ काठ थुपार्ने ठाउँ हो, यो मेशिन होइन त्यसैले मिल्दैन। ३. 체인톱 को अर्थ चेनसा (सिक्री आरा) हो, यो घुम्ने दाँत भएको सिक्री प्रयोग गरेर रुख काट्ने मेशिन हो त्यसैले यो सही उत्तर हो। ४. 벌채지 को अर्थ रुख काटिएको क्षेत्र हो, यो ठाउँको नाम हो त्यसैले मिल्दैन। सही उत्तर 체인톱 हो जसको अर्थ चेनसा हुन्छ। किताबमा पहिलो विकल्प '하베스타' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '하베스터' हो।"}, {"n": "431", "q": "벌목한 나무들을 모아두는 장소입니다. 산속에서 베어 낸 나무들을 운반하기 전에 한곳에 모아 정리하고, 이후에 운재를 쉽게 할 수 있도록 마련된 공간입니다.", "options": ["운동장", "집재장", "경기장", "양식장"], "answer": 1, "explain": "१. 운동장 को अर्थ खेल मैदान हो, यो वनको कामसँग सम्बन्धित छैन त्यसैले मिल्दैन। २. 집재장 को अर्थ काठ जम्मा गर्ने ठाउँ हो, यो जङ्गलमा काटेका रुखहरू ढुवानी गर्नु अघि एक ठाउँमा थुपारेर राख्ने ठाउँ हो त्यसैले यो सही उत्तर हो। ३. 경기장 को अर्थ खेलकुद स्थल हो, यो मिल्दैन। ४. 양식장 को अर्थ माछापालन वा सीपपालन गर्ने ठाउँ हो, यो मिल्दैन। सही उत्तर 집재장 हो जसको अर्थ काठ थुपार्ने ठाउँ हुन्छ।"}, {"n": "432", "q": "나무를 베고, 가지를 치고, 길이대로 자르는 작업을 자동으로 하는 산림 기계입니다. 벌목, 조재, 집재 과정을 빠르고 효율적으로 처리할 때 사용됩니다.", "options": ["하베스터", "집재장", "크레인", "지게차"], "answer": 0, "explain": "१. 하베스터 भनेको रुख ढाल्ने, हाँगा काट्ने र काठ टुक्र्याउने स्वचालित मेसिन हो, त्यसैले यो विवरणसँग एकदम मिल्छ। २. 집재장 भनेको काटिएका काठहरू जम्मा गर्ने ठाउँ हो, त्यसैले यो मेसिन होइन। ३. 크레인 भनेको गह्रौँ सामान उठाउने मेसिन हो, त्यसैले यो रुख काट्ने उपकरण होइन। ४. 지게차 भनेको सामान बोक्ने मेसिन हो, त्यसैले यो पनि गलत हो। त्यसैले सही उत्तर १ नम्बरको 하베스터 हो, जसको अर्थ स्वचालित काठ काट्ने मेसिन हुन्छ। किताबमा पहिलो विकल्प '하베스타' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '하베스터' हो।"}, {"n": "433", "q": "청소와 운영에 필요한 소모품, 청소도구, 린넨, 어메니티 같은 물건을 보관하고 관리하는 공간입니다.", "options": ["음식물", "음료수", "비품실", "탈의실"], "answer": 2, "explain": "१. 음식물 को अर्थ खानाको परिकार वा खाद्य पदार्थ हो, यो सामान राख्ने कोठा होइन त्यसैले मिल्दैन। २. 음료수 को अर्थ पिउनेपानी वा पेय पदार्थ हो, यो मिल्दैन। ३. 비품실 को अर्थ सामान वा सामग्री भण्डार कक्ष हो, यो सरसफाइका सामान, तौलिया आदि राख्ने ठाउँ हो त्यसैले यो सही उत्तर हो। ४. 탈의실 को अर्थ कपडा फेर्ने कोठा (चेन्जिङ रुम) हो, यो मिल्दैन। सही उत्तर 비품실 हो जसको अर्थ सामग्री भण्डार कक्ष हुन्छ।"}, {"n": "434", "q": "실내나 특정 공간에서 좋은 향기를 퍼뜨려 냄새를 없애고 쾌적하게 만드는 제품입니다. 객실, 로비, 욕실 등에 청결하고 기분 좋은 인상을 주는 데 사용합니다.", "options": ["향수", "세제", "방향제", "대걸레"], "answer": 2, "explain": "१. 향수 को अर्थ इत्र वा सेन्ट (परफ्युम) हो, यो मान्छेले शरीरमा लगाउने सु बास्ना हो त्यसैले मिल्दैन। २. 세제 को अर्थ डिटर्जेन्ट वा साबुन पानी हो, यो सफा गर्ने रसायन हो त्यसैले मिल्दैन। ३. 방향제 को अर्थ सु बास्ना छर्ने वस्तु (एयर फ्रेसनर) हो, यो कोठाको गन्ध हटाएर बास्नादार बनाउने वस्तु हो त्यसैले यो सही उत्तर हो। ४. 대걸레 को अर्थ ठूलो भुइँ पुछ्ने मप हो, यो सरसफाइको औजार हो त्यसैले मिल्दैन। सही उत्तर 방향제 हो जसको अर्थ एयर फ्रेसनर हुन्छ।"}, {"n": "435", "q": "샴푸, 린스, 치약, 칫솔 등 얼굴을 씻거나 머리를 감을 때 필요한 용품들을 말합니다.", "options": ["전자제품", "화장품", "가전제품", "세면도구"], "answer": 3, "explain": "१. 전자제품 को अर्थ इलेक्ट्रोनिक सामान हो, यो साम्ग्रीहरू पर्दैन त्यसैले मिल्दैन। २. 화장품 को अर्थ सौन्दर्य प्रसाधन (कोस्मेटिक) हो, यो अनुहारमा लगाउने क्रिम आदि हो त्यसैले मिल्दैन। ३. 가전제품 को अर्थ घरायसी विद्युतीय उपकरण हो, यो मिल्दैन। ४. 세면도구 को अर्थ मुख धुने र दाँत माझ्ने सामानहरू (स्याम्बू, मन्जन, ब्रस आदि) हुन् त्यसैले यो सही उत्तर हो। सही उत्तर 세면도구 हो जसको अर्थ मुख धुने तथा नुहाउने सर-सामानहरू हुन्छन्।"}, {"n": "436", "q": "침대를 덮거나 장식하는 천으로 만든 덮개입니다. 침대의 깔끔함을 유지하고, 위생을 보호하기 위해 사용됩니다.", "options": ["이불보", "침대보", "화장대", "리모컨"], "answer": 1, "explain": "१. 이불보 को अर्थ कबल वा कम्बल छोप्ने कपडा हो, यो ओछ्यान ढाक्न प्रयोग हुने भएकोले सही उत्तर हो। २. 침대보 को अर्थ बेडसिट वा ओछ्यानको तन्ना हो, यो ओछ्यानको म्याट्रिस छोप्न प्रयोग हुन्छ तर कबल ढाक्ने कपडा नभएकोले मिलेन। ३. 화장대 को अर्थ श्रृंगार टेबल वा मेकअप गर्ने टेबल हो, यो कोठाको फर्निचर भएकोले मिलेन। ४. 리모컨 को अर्थ रिमोट कन्ट्रोल हो, यो इलेक्ट्रोनिक उपकरण चलाउन प्रयोग हुने भएकोले मिलेन। सही उत्तर १ नम्बरको 이불보 हो जसको अर्थ कबल वा कम्बल छोप्ने कपडा हो।"}, {"n": "437", "q": "호텔이나 콘도에서 투숙객이 휴식 중이거나 방 청소를 원하지 않을 때 객실 문 손잡이에 걸어 두며, 직원은 이를 보고 객실 서비스를 잠시 보류합니다.", "options": ["헤어드라이어", "메이드 보고서", "DND 카드", "메이크업 카드"], "answer": 2, "explain": "१. 헤어드라이어 भनेको कपाल सुकाउने मेसिन हो, त्यसैले यो ढोकामा झुन्ड्याउने कार्ड होइन। २. 메이드 보고서 भनेको सरसफाइ कर्मचारीको प्रतिवेदन हो, त्यसैले यो पाहुनाले प्रयोग गर्ने कार्ड होइन। ३. 디엔디 카드 भनेको बाधा नपुर्याउनुहोस् भनी ढोकामा झुन्ड्याइने कार्ड हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ४. 메이크업 카드 भनेको कोठा सफा गरिदिन अनुरोध गर्ने कार्ड हो, त्यसैले यो विश्रामको लागि होइन। त्यसैले सही उत्तर ३ नम्बरको 디엔디 카드 हो, जसको अर्थ बाधा नपुर्याउनुहोस् भन्ने कार्ड हुन्छ।"}, {"n": "438", "q": "투숙객이 외출할 때 객실 문 손잡이에 걸어두면, 하우스키핑 직원이 이를 보고 청소, 수건 교체, 침구 정리 등을 진행합니다.", "options": ["화장품", "화장대", "DND 카드", "메이크업 카드"], "answer": 3, "explain": "१. 화장품 को अर्थ कस्मेटिक वा सौन्दर्य प्रसाधन हो, यो सफाइ गराउने कार्ड नभएकोले मिलेन। २. 화장대 को अर्थ श्रृंगार टेबल हो, यो फर्निचर भएकोले मिलेन। ३. DND 카드 को अर्थ DND कार्ड हो, यो त सफाइ नगर भनेर झुन्ड्याउने कार्ड हो त्यसैले मिलेन। ४. 메이크업 카드 को अर्थ मेकअप कार्ड हो, यो ढोकामा झुन्ड्याउँदा सरसफाइ र तन्ना फेर्ने काम गर्ने, गराउने कार्ड भएकोले सही उत्तर हो। सही उत्तर ४ नम्बरको 메이크업 카드 हो जसको अर्थ कोठा सफाइ गरिदिनु पर्ने कार्ड हो।"}, {"n": "439", "q": "뛰어난 경치나 특별한 문화 유산으로 유명하여 사람들이 찾아가는 곳입니다.", "options": ["해외 여행", "관광지", "단체 여행", "공연장"], "answer": 1, "explain": "'해외 여행' भनेको विदेश भ्रमण हो, यो const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-09';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Renders the explanation as a structured list: the explanation string is
// lines separated by "\n" — first line is the question's own meaning
// ("प्रश्नको अर्थ: ..."), then one line per option ("① <word> ... ✓/✗").
// Lines render as separate rows; the ✓ line gets a green tint and the ✓/✗
// marker is coloured. Explanations without line breaks (fallback prose)
// render as a single paragraph, exactly as before. Uses text nodes only,
// never innerHTML, so explanation text is never parsed as markup.
function renderExplain(box, explain) {
  const lines = (explain || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length <= 1) {
    const b = document.createElement('b');
    b.textContent = 'किन? ';
    box.appendChild(b);
    const s = document.createElement('span');
    s.textContent = explain;
    box.appendChild(s);
    return;
  }
  const label = document.createElement('div');
  label.className = 'explain-label';
  label.textContent = 'व्याख्या';
  box.appendChild(label);
  lines.forEach((ln, li) => {
    const d = document.createElement('div');
    if (li === 0 && ln.indexOf('प्रश्नको अर्थ') === 0) {
      d.className = 'explain-stem';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    if (ln.indexOf('शिक्षकको उत्तर-पत्र:') === 0) {
      d.className = 'exp-note';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    const mark = ln.endsWith('✓') ? '✓' : (ln.endsWith('✗') ? '✗' : '');
    const body = mark ? ln.slice(0, -1).trim() : ln;
    d.className = 'exp-line' + (mark === '✓' ? ' exp-ok' : '');
    d.appendChild(document.createTextNode(body + (mark ? ' ' : '')));
    if (mark) {
      const m = document.createElement('span');
      m.className = 'exp-mark ' + (mark === '✓' ? 'ok' : 'no');
      m.textContent = mark;
      d.appendChild(m);
    }
    box.appendChild(d);
  });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    renderExplain(card.querySelector('.explain'), q.explain);
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
