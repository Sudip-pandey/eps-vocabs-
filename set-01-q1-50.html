<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPS-TOPIK Vocabulary Quiz — Set 01 (Q1–Q50)</title>
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --green: #188038;
    --green-bg: #e6f4ea;
    --red: #d93025;
    --red-bg: #fce8e6;
    --bg: #f0f4f9;
    --card: #ffffff;
    --text: #1f1f1f;
    --muted: #5f6368;
    --border: #dadce0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--primary); font-weight: 700; font-size: .95rem; padding: 10px 20px; border-radius: 999px; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.18); margin-bottom: 12px; transition: transform .15s, box-shadow .15s; }
  .back-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.22); }
  header { background: var(--primary); color: #fff; padding: 20px 16px 16px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .header-inner { max-width: 760px; margin: 0 auto; }
  header h1 { font-size: 1.35rem; line-height: 1.3; }
  header p { opacity: .9; font-size: .9rem; margin-top: 2px; }
  .progress-wrap { margin-top: 12px; background: rgba(255,255,255,.25); border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-bar { height: 100%; background: #fff; width: 0%; transition: width .3s; }
  .progress-text { font-size: .82rem; margin-top: 6px; opacity: .95; }
  .autosave-note { font-size: .78rem; margin-top: 4px; opacity: .85; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 80px; }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .q-card.answered { border-left: 4px solid var(--primary); }
  .q-num { font-size: .8rem; font-weight: 700; color: var(--primary); letter-spacing: .02em; }
  .q-text { font-size: 1.08rem; white-space: pre-line; margin: 8px 0 14px; line-height: 1.8; }
  .options label { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: background .15s, border-color .15s; font-size: 1.02rem; }
  .options label:hover { background: #f8f9fa; border-color: var(--primary); }
  .options input { margin-top: 5px; accent-color: var(--primary); width: 18px; height: 18px; flex: none; }
  .options label.selected { background: #e8f0fe; border-color: var(--primary); }
  .ul { text-decoration: underline; text-underline-offset: 2px; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 600; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 11px 22px; font-weight: 600; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: #a8c7fa; cursor: not-allowed; }
  .btn-ghost { background: #fff; color: var(--primary); border: 1px solid var(--border); }
  .submit-bar { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,.08); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 20px; text-align: center; margin-bottom: 20px; }
  .score-card .big { font-size: 2.6rem; font-weight: 800; color: var(--primary); line-height: 1.1; }
  .score-card .pct { font-size: 1.1rem; color: var(--muted); margin-top: 4px; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 8px 16px; }
  .filters button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .review-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 14px; }
  .review-card.correct { border-left: 5px solid var(--green); }
  .review-card.wrong { border-left: 5px solid var(--red); }
  .verdict { font-weight: 700; font-size: .95rem; margin-bottom: 6px; }
  .verdict.ok { color: var(--green); }
  .verdict.no { color: var(--red); }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; }
  .rev-opt-correct { background: var(--green-bg); border-color: var(--green); }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: var(--red); }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: var(--green); color: #fff; }
  .badge-mine { background: var(--green); color: #fff; }
  .badge-mine-wrong { background: var(--red); color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #f8f9fa; border-radius: 8px; padding: 12px 14px; margin-top: 10px; font-size: .96rem; }
  .explain b { color: var(--primary-dark); }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.15rem; }
    .q-text { font-size: 1rem; }
    .submit-bar .hint { display: none; }
  }
  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    .back-btn { padding: 6px 14px; font-size: .85rem; margin-bottom: 8px; }
    header h1 { font-size: 1.05rem; line-height: 1.25; }
    header p { font-size: .78rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .75rem; margin-top: 4px; }
    .autosave-note { font-size: .7rem; margin-top: 2px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">&larr; Back to All Sets</a>
    <h1>EPS-TOPIK 문제은행 Quiz</h1>
    <p>Set 1 of 11 &bull; Questions 1–50 &bull; 50 questions &bull; EPS-TOPIK Vocabulary &mdash; answers are AI-generated (no answer key in the book) &mdash; check with a teacher &bull; Explanations in Nepali</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">0 / 50 answered</div>
    <div class="autosave-note">Progress will be auto-saved.</div>
  </div>
</header>

<main id="quizView">
  <div id="questionList"></div>
  <div class="pager">
    <button class="btn-ghost" id="prevBtn">&larr; Previous</button>
    <span class="page-info" id="pageInfo"></span>
    <button class="btn-ghost" id="nextBtn">Next &rarr;</button>
  </div>
</main>

<div class="submit-bar" id="submitBar">
  <div class="inner">
    <span class="hint" id="submitHint">Answer all 50, then submit.</span>
    <div style="display:flex; gap:8px; flex:none;">
      <button class="btn-ghost" id="clearBtn" style="padding:11px 16px;">Clear all</button>
      <button class="btn-primary" id="submitBtn">Submit Quiz</button>
    </div>
  </div>
</div>

<main id="resultView" class="hidden">
  <div class="score-card">
    <div class="big" id="scoreBig"></div>
    <div class="pct" id="scorePct"></div>
    <div class="msg" id="scoreMsg"></div>
    <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-primary" id="retryBtn">Try Again</button>
      <button class="btn-ghost" id="reviewTopBtn">Back to top</button>
    </div>
  </div>
  <div class="filters">
    <button class="btn-ghost active" data-filter="all">All questions</button>
    <button class="btn-ghost" data-filter="wrong">Wrong only</button>
    <button class="btn-ghost" data-filter="correct">Correct only</button>
  </div>
  <div id="reviewList"></div>
</main>

<script>
const QUESTIONS = [{"n": "1", "q": "상대방을 만나거나 헤어질 때 예의를 표현하는 행동입니다.", "options": ["인사", "소개", "호칭", "악수"], "answer": 0, "explain": "पहिलो विकल्प 인사 भनेको नमस्कार गर्ने वा अभिवादन गर्ने काम हो, जुन सही उत्तर हो। दोस्रो विकल्प 소개 भनेको परिचय दिनु हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 호칭 भनेको सम्बोधन गर्ने शब्द हो, त्यसैले यो मिल्दैन। चौथो विकल्प 악수 भनेको हात मिलाउने काम हो, त्यसैले यो मिल्दैन। सही उत्तर 인사 हो जसको अर्थ अभिवादन वा नमस्कार हो।"}, {"n": "2", "q": "자신의 기본 정보 성명과 직업 따위를 상대방에게 이해하기 쉽게 전하는 것입니다.", "options": ["인사법", "자기소개", "표준어", "존댓말"], "answer": 1, "explain": "पहिलो विकल्प 인사법 भनेको अभिवादन गर्ने तरिका हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 자기소개 भनेको आफ्नो व्यक्तिगत विवरण र पेसा अरूलाई बुझ्न सजिलो हुने गरी बताउनु हो, जुन सही उत्तर हो। तेस्रो विकल्प 표준어 भनेको मानक भाषा हो, त्यसैले यो मिल्दैन। चौथो विकल्प 존댓말 भनेको आदरार्थी भाषा हो, त्यसैले यो मिल्दैन। सही उत्तर 자기소개 हो जसको अर्थ आत्मपरिचय हो।"}, {"n": "3", "q": "사회적 기대에 따라 어떤 일을 적당하게 하거나 다른 사람을 존중하는 바른 행동을 말합니다.", "options": ["말투", "선택", "규칙", "예절"], "answer": 3, "explain": "पहिलो विकल्प 말투 भनेको बोल्ने ढङ्ग वा लवज हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 선택 भनेको रोजाइ वा छनोट हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 규칙 भनेको नियम हो, त्यसैले यो मिल्दैन। चौथो विकल्प 예절 भनेको सामाजिक अपेक्षाअनुसार राम्रोसँग काम गर्ने वा अरूलाई सम्मान गर्ने शिष्टाचार हो, जुन सही उत्तर हो। सही उत्तर 예절 हो जसको अर्थ शिष्टाचार हो।"}, {"n": "4", "q": "사람이 자신이 가진 능력이나 관심, 배운 지식을 바탕으로 돈을 벌거나 사회에 기여하기 위해 하는 일이나 활동을 말합니다.", "options": ["취미", "직업", "습관", "기부"], "answer": 1, "explain": "पहिलो विकल्प 취미 भनेको पारखी काम वा रुचि हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 직업 भनेको मानिसले पैसा कमाउन वा समाजमा योगदान दिन गर्ने पेसा वा काम हो, जुन सही उत्तर हो। तेस्रो विकल्प 습관 भनेको बानी हो, त्यसैले यो मिल्दैन। चौथो विकल्प 기부 भनेको सहयोग वा चन्दा दिनु हो, त्यसैले यो मिल्दैन। सही उत्तर 직업 हो जसको अर्थ पेसा वा रोजगार हो।"}, {"n": "5", "q": "학교나 학원 등에서 공식이나 비공식적으로 공부를 하며 지식을 배우고 성장해 나가는 사람입니다.", "options": ["교사", "의사", "학생", "봉사자"], "answer": 2, "explain": "पहिलो विकल्प 교사 भनेको शिक्षक हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 의사 भनेको डाक्टर हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 학생 भनेको विद्यालय वा शिक्षण संस्थामा पढेर ज्ञान आर्जन गर्ने विद्यार्थी हो, जुन सही उत्तर हो। चौथो विकल्प 봉사자 भनेको स्वयंसेवक हो, त्यसैले यो मिल्दैन। सही उत्तर 학생 हो जसको अर्थ विद्यार्थी हो।"}, {"n": "6", "q": "사기업에서 일하는 직장인을 가리키고 보통 일정한 직무를 수행하며 기업에 소속되어 급여를 받는 사람을 말합니다.", "options": ["공무원", "회사원", "경찰관", "승무원"], "answer": 1, "explain": "공무원 भनेको सरकारी कर्मचारी हो, यो निजी क्षेत्रमा काम गर्नेको वर्णन होइन। 회사원 भनेको कम्पनीमा काम गर्ने कर्मचारी हो, जसले संस्थामा आबद्ध भएर काम गर्छ र तलब पाउँछ र प्रश्नसँग मिल्छ। 경찰관 भनेको प्रहरी हो, यो कार्यालयको कर्मचारी होइन। 승무원 भनेको विमानको कर्मचारी हो, यो सामान्य कार्यालयको कामसँग सम्बन्धित छैन। सही उत्तर २ हो र यसको अर्थ कम्पनीको कर्मचारी हो।"}, {"n": "7", "q": "돈을 받고 일을 하는 사람을 의미한데 주로 공장이나 건설 현장에서 일하며, 자신의 노동을 제공하고 대가를 받습니다.", "options": ["근로자", "간호사", "변호사", "요리사"], "answer": 0, "explain": "पहिलो विकल्प 근로자 भनेको ज्यालादारी वा तलबका लागि काम गर्ने कामदार वा श्रमिक हो, जुन सही उत्तर हो। दोस्रो विकल्प 간호사 भनेको नर्स हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 변호사 भनेको वकिल हो, त्यसैले यो मिल्दैन। चौथो विकल्प 요리사 भनेको भान्से हो, त्यसैले यो मिल्दैन। सही उत्तर 근로자 हो जसको अर्थ श्रमिक वा कामदार हो।"}, {"n": "8", "q": "지역 사람들이 안전을 위해 법과 질서를 지키고, 범죄를 예방하거나 해결하는 일을 하는 사람을 의미합니다.", "options": ["공무원", "회사원", "소방관", "경찰관"], "answer": 3, "explain": "पहिलो विकल्प 공무원 भनेको सरकारी कर्मचारी हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 회사원 भनेको कम्पनीको कर्मचारी हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 소방관 भनेको दमकलकर्मी वा अग्नि नियन्त्रक हो, त्यसैले यो मिल्दैन। चौथो विकल्प 경찰관 भनेको जनताको सुरक्षा, कानुन पालना र अपराध रोकथाम गर्ने प्रहरी हो, जुन सही उत्तर हो। सही उत्तर 경찰관 हो जसको अर्थ प्रहरी हो।"}, {"n": "9", "q": "화재를 진압하고 사람들의 안전을 지키는 일을 하는 사람으로 화재 발생 시 신속하게 대응하여 피해를 최소화하고, 구조 활동도 수행합니다.", "options": ["공무원", "소방관", "경찰관", "승무원"], "answer": 1, "explain": "पहिलो विकल्प 공무원 भनेको सरकारी कर्मचारी हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 소방관 भनेको आगो निभाउने र उद्धार कार्य गर्ने अग्नि नियन्त्रक वा दमकलकर्मी हो, जुन सही उत्तर हो। तेस्रो विकल्प 경찰관 भनेको प्रहरी हो, त्यसैले यो मिल्दैन। चौथो विकल्प 승무원 भनेको विमान परिचारिका हो, त्यसैले यो मिल्दैन। सही उत्तर 소방관 हो जसको अर्थ अग्नि नियन्त्रक हो।"}, {"n": "10", "q": "나라나 지방자치단체를 위해 일하는 사람을 의미하고 법에 따라 임명되어 공공의 일을 수행합니다.", "options": ["승무원", "회사원", "벽돌공", "공무원"], "answer": 3, "explain": "पहिलो विकल्प 승무원 भनेको विमान परिचारिका हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 회사원 भनेको कम्पनीको कर्मचारी हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 벽돌공 भनेको डकर्मी हो, त्यसैले यो मिल्दैन। चौथो विकल्प 공무원 भनेको देश वा स्थानीय सरकारका लागि कानुनबमोजिम नियुक्त भई काम गर्ने सरकारी कर्मचारी हो, जुन सही उत्तर हो। सही उत्तर 공무원 हो जसको अर्थ सरकारी कर्मचारी हो।"}, {"n": "11", "q": "의학 학위를 가지고 병이나 상처를 치료하며 사람의 건강을 돌보는 일을 하는 사람을 의미합니다.", "options": ["어부", "의사", "농부", "학생"], "answer": 1, "explain": "पहिलो विकल्प 어부 भनेको माछा मार्ने मानिस हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 의사 भनेको चिकित्साशास्त्रको उपाधि प्राप्त गरी बिरामीको उपचार गर्ने डाक्टर हो, जुन सही उत्तर हो। तेस्रो विकल्प 농부 भनेको किसान हो, त्यसैले यो मिल्दैन। चौथो विकल्प 학생 भनेको विद्यार्थी हो, त्यसैले यो मिल्दैन। सही उत्तर 의사 हो जसको अर्थ डाक्टर हो।"}, {"n": "12", "q": "의학 학위를 가지고 환자를 돌보고 의사를 도와 치료를 지원하는 일을 하는 사람을 의미합니다.", "options": ["의사", "간호사", "변호사", "기술자"], "answer": 1, "explain": "पहिलो विकल्प 의사 भनेको डाक्टर हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 간호사 भनेको बिरामीको हेरचाह गर्ने र डाक्टरको उपचारमा सहयोग गर्ने नर्स हो, जुन सही उत्तर हो। तेस्रो विकल्प 변호사 भनेको वकिल हो, त्यसैले यो मिल्दैन। चौथो विकल्प 기술자 भनेको प्राविधिक हो, त्यसैले यो मिल्दैन। सही उत्तर 간호사 हो जसको अर्थ नर्स हो।"}, {"n": "13", "q": "식당, 호텔, 카페 등에서 다양한 음식을 만들고 조리하는 일을 전문적으로 하는 사람을 의미합니다.", "options": ["승무원", "회사원", "간호사", "요리사"], "answer": 3, "explain": "पहिलो विकल्प 승무원 भनेको विमान परिचारिका हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 회사원 भनेको कम्पनीको कर्मचारी हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 간호사 भनेको नर्स हो, त्यसैले यो मिल्दैन। चौथो विकल्प 요리사 भनेको रेस्टुरेन्ट, होटल आदि ठाउँमा विभिन्न खानेकुरा बनाउने भान्से वा सेफ हो, जुन सही उत्तर हो। सही उत्तर 요리사 हो जसको अर्थ भान्से हो।"}, {"n": "14", "q": "자동차, 버스, 트럭 등 다양한 차량을 전문적으로 운전하는 일을 하는 사람을 의미합니다. 승객이나 물건을 안전하게 목적지까지 운송하는 것이 주된 역할입니다.", "options": ["기술자", "회사원", "연구원", "운전기사"], "answer": 3, "explain": "पहिलो विकल्प 기술자 भनेको प्राविधिक हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 회사원 भनेको कम्पनीको कर्मचारी हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 연구원 भनेको अनुसन्धानकर्ता हो, त्यसैले यो मिल्दैन। चौथो विकल्प 운전기사 भनेको गाडी, बस, ट्रक आदि चलाउने चालक हो, जुन सही उत्तर हो। सही उत्तर 운전기사 हो जसको अर्थ चालक हो।"}, {"n": "15", "q": "특정 분야에서 전문적인 기술과 지식을 가지고 일하는 사람을 의미한데 주로 기계, 전자, IT 등 다양한 분야에서 문제를 해결하거나 제품을 개발하는 역할을 합니다.", "options": ["기술자", "전기공", "변호사", "요리사"], "answer": 0, "explain": "기술자 भनेको प्राविधिक वा इञ्जिनियर हो, जसले विशेष क्षेत्रमा प्राविधिक ज्ञान प्रयोग गरेर समस्या समाधान गर्छ र प्रश्नसँग मिल्छ। 전기공 भनेको बिजुलीको काम गर्ने मिस्त्री हो, यो सबै प्राविधिक क्षेत्रसँग मात्र जोडिएको हुँदैन। 변호사 भनेको वकिल हो, यो प्राविधिक उत्पादन विकास गर्ने व्यक्ति होइन। 요리사 भनेको भान्से हो, यो प्राविधिक वा इञ्जिनियर होइन। सही उत्तर १ हो र यसको अर्थ प्राविधिक हो।"}, {"n": "16", "q": "나무를 사용하여 가구나 건축물 등의 물건을 만드는 일을 하는 사람으로 나무를 자르고 다듬어 필요한 형태로 만드는 기술을 가진 전문가입니다.", "options": ["주부", "어부", "목수", "의사"], "answer": 2, "explain": "पहिलो विकल्पको '주부' को अर्थ गृहणी वा गृहिणी हो, यो रूख काट्ने कामसँग सम्बन्धित छैन त्यसैले यो मिलेन। दोस्रो विकल्पको '어부' को अर्थ माछा मार्ने मानिस हो, यो काठको कामसँग मिल्दैन त्यसैले यो मिलेन। तेस्रो विकल्पको '목수' को अर्थ सिकारी वा डकर्मी (काठको काम गर्ने मानिस) हो, जसले काठ काटेर विभिन्न आकारका वस्तुहरू बनाउँछ, त्यसैले यो सही उत्तर हो। चौथो विकल्पको '의사' को अर्थ डाक्टर हो, यो काठको काम गर्ने मानिस होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प ३ हो जसको अर्थ काठको काम गर्ने मानिस (목수) हुन्छ।"}, {"n": "17", "q": "논밭에서 농사를 짓고, 작물을 재배하거나 축사에서 가축을 기르는 일을 하는 사람을 말합니다.", "options": ["어부", "목수", "농부", "주부"], "answer": 2, "explain": "पहिलो विकल्पको '어부' को अर्थ माछा मार्ने मानिस हो, यो खेतीपाती गर्ने मानिससँग मिल्दैन त्यसैले यो मिलेन। दोस्रो विकल्पको '목수' को अर्थ काठको काम गर्ने मानिस हो, यो किसान होइन त्यसैले यो मिलेन। तेस्रो विकल्पको '농부' को अर्थ किसान हो, जसले खेतबारीमा खेती गर्ने र पशुपालन गर्ने काम गर्छ, त्यसैले यो सही उत्तर हो। चौथो विकल्पको '주부' को अर्थ गृहणी हो, यो खेतीकिसानी गर्ने व्यक्तिसँग सम्बन्धित छैन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प ३ हो जसको अर्थ किसान (농부) हुन्छ।"}, {"n": "18", "q": "바다나 강에서 물고기를 잡아 생계를 유지하는 사람을 의미합니다. 어획물을 잡고 이를 판매하거나 소비하는 일을 합니다.", "options": ["어부", "목수", "선수", "주부"], "answer": 0, "explain": "어부 भनेको माछा मार्ने मानिस हो, जसले समुद्र वा नदीमा माछा समातेर जीविकोपार्जन गर्छ र प्रश्नसँग मिल्छ। 목수 भनेको सिकर्मी हो, यो माछा मार्ने व्यक्ति होइन। 선수 भनेको खेलाडी हो, यो माछा मार्ने पेसा होइन। 주부 भनेको गृहणी हो, यो माछा मार्ने कामसँग सम्बन्धित छैन। सही उत्तर १ हो र यसको अर्थ माछा मार्ने मानिस हो।"}, {"n": "19", "q": "금속을 녹여서 이어 붙이는 작업을 하는 사람을 의미합니다. 주로 건설 현장이나 공장에서 금속 구조물을 만들거나 수리하는 역할을 합니다.", "options": ["경찰관", "소방관", "용접공", "벽돌공"], "answer": 2, "explain": "पहिलो विकल्पको '경찰관' को अर्थ प्रहरी हो, यो धातु जोड्ने काम गर्ने मानिससँग मिल्दैन त्यसैले यो मिलेन। दोस्रो विकल्पको '소방관' को अर्थ दमकलकर्मी हो, यो वेल्डिङ गर्ने कामसँग सम्बन्धित छैन त्यसैले यो मिलेन। तेस्रो विकल्पको '용접공' को अर्थ वेल्डर वा डकर्मी (धातु जोड्ने काम गर्ने मिस्त्री) हो, जसले धातु पगालेर जोड्ने काम गर्छ, त्यसैले यो सही उत्तर हो। चौथो विकल्पको '벽돌공' को अर्थ इँटा लगाउने कामदार हो, यो धातुको काम गर्ने मानिस होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प ३ हो जसको अर्थ वेल्डर (용접공) हुन्छ।"}, {"n": "20", "q": "특정 스포츠나 경기에서 전문적으로 활동하는 사람을 의미합니다. 주로 팀이나 개인의 일원으로 경기에 참가하며, 뛰어난 실력을 가진 사람을 가리킵니다.", "options": ["의사", "선수", "가수", "어부"], "answer": 1, "explain": "पहिलो विकल्पको '의사' को अर्थ डाक्टर हो, यो खेलकुद क्षेत्रको व्यक्तिसँग मिल्दैन त्यसैले यो मिलेन। दोस्रो विकल्पको '선수' को अर्थ खेलाडी हो, जसले खेलकुदमा पेशेवर रूपमा भाग लिन्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्पको '가수' को अर्थ गायक हो, यो खेलकुद क्षेत्रसँग सम्बन्धित छैन त्यसैले यो मिलेन। चौथो विकल्पको '어부' को अर्थ माछा मार्ने मानिस हो, यो खेलाडीसँग मिल्दैन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प २ हो जसको अर्थ खेलाडी (선수) हुन्छ।"}, {"n": "21", "q": "뉴스나 정보를 수집하고, 이를 작성하여 대중에게 전달하는 일을 하는 사람으로 신문, 방송, 인터넷 등 다양한 매체를 통해 사건, 사고, 사회적 이슈 등을 보도합니다.", "options": ["어부", "기자", "목수", "교사"], "answer": 1, "explain": "पहिलो विकल्पको '어부' को अर्थ माछा मार्ने मानिस हो, यो समाचार संकलन गर्ने व्यक्तिसँग मिल्दैन त्यसैले यो मिलेन। दोस्रो विकल्पको '기자' को अर्थ पत्रकार हो, जसले समाचार र सूचना संकलन गरेर जनतालाई जानकारी दिन्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्पको '목수' को अर्थ काठको काम गर्ने मानिस हो, यो पत्रकार होइन त्यसैले यो मिलेन। चौथो विकल्पको '교사' को अर्थ शिक्षक हो, यो समाचार माध्यमसँग सम्बन्धित छैन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प २ हो जसको अर्थ पत्रकार (기자) हुन्छ।"}, {"n": "22", "q": "보통 사람이 속한 나라를 의미하며 어떤 국가의 시민권을 가진 상태를 가리킵니다.", "options": ["신분증", "명칭", "성명", "국적"], "answer": 3, "explain": "신분증 भनेको परिचय पत्र हो, यो देशको नागरिकताको अवस्था होइन। 명칭 भनेको नाम वा शीर्षक हो, यो नागरिकतासँग सम्बन्धित छैन। 성명 भनेको पूरा नाम हो, यो नागरिकताको स्थिति होइन। 국적 भनेको राष्ट्रियता हो, जसले व्यक्ति कुन देशको नागरिक हो भन्ने जनाउँछ र प्रश्नसँग मिल्छ। सही उत्तर ४ हो र यसको अर्थ राष्ट्रियता हो।"}, {"n": "23", "q": "대화나 행동을 하는 동안 함께 있는 사람을 의미합니다. 보통 대화나 논쟁, 경기 등에서 자신과 반대되는 사람을 가리킬 때 사용됩니다.", "options": ["친척", "도우미", "상대방", "룸메이트"], "answer": 2, "explain": "पहिलो विकल्पको '친척' को अर्थ नातेदार वा आफन्त हो, यो कुराकानी वा खेलमा विरोधी पक्षसँग मिल्दैन त्यसैले यो मिलेन। दोस्रो विकल्पको '도우미' को अर्थ सहयोगी हो, यो विपक्षी व्यक्ति होइन त्यसैले यो मिलेन। तेस्रो विकल्पको '상대방' को अर्थ विपक्षी वा अर्को पक्ष (साथमा रहेको वा प्रतिस्पर्धा गर्ने व्यक्ति) हो, त्यसैले यो सही उत्तर हो। चौथो विकल्पको '룸메이트' को अर्थ कोठा साथी हो, यो कुराकानी वा खेलमा विपरीत पक्षमा हुने मानिस होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प ३ हो जसको अर्थ विपक्षी वा अर्को पक्ष (상대방) हुन्छ।"}, {"n": "24", "q": "두 사람이 손을 맞잡고 가볍게 흔드는 동작으로, 인사나 감사, 축하, 등의 의미로 서로의 감정을 표현하는 방식입니다.", "options": ["악수", "약속", "감사", "방문"], "answer": 0, "explain": "पहिलो विकल्पको '악수' को अर्थ हात मिलाउने काम (शेक ह्यान्ड) हो, जहाँ दुई जनाले हात समातेर नमस्कार, धन्यवाद वा बधाई प्रकट गर्छन्, त्यसैले यो सही उत्तर हो। दोस्रो विकल्पको '약속' को अर्थ वाचा वा प्रतिज्ञा हो, यो हात मिलाउने कार्यसँग मिल्दैन त्यसैले यो मिलेन। तेस्रो विकल्पको '감사' को अर्थ धन्यवाद हो, यो हात जोड्ने वा मिलाउने शारीरिक क्रिया होइन त्यसैले यो मिलेन। चौथो विकल्पको '방문' को अर्थ भ्रमण वा ढोका हो, यो अभिवादन गर्ने तरिका होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प १ हो जसको अर्थ हात मिलाउनु (악수) हुन्छ।"}, {"n": "25", "q": "일상생활에서 자주 사용하는 물건들로, 청소 도구, 주방 용품, 세면도구, 가전제품 등이 생활을 편리하게 해주는 다양한 제품을 말합니다.", "options": ["생활용품", "생활규칙", "화장품", "생산품"], "answer": 0, "explain": "생활용품 भनेको दैनिक प्रयोगका सामानहरू हुन्, जसले जीवनलाई सजिलो बनाउँछ र प्रश्नसँग मिल्छ। 생활규칙 भनेको जीवनका नियमहरू हुन्, यो वस्तु होइन। 화장품 भनेको सौन्दर्य प्रसाधन हो, यो सबै प्रकारका दैनिक सामान होइन। 생산품 भनेको उत्पादन गरिएका वस्तुहरू हुन्, यो दैनिक प्रयोगका घरायसी सामान मात्र होइन। सही उत्तर १ हो र यसको अर्थ दैनिक प्रयोगका सामानहरू हो।"}, {"n": "26", "q": "사람들이 업무를 보기 위해 모여 일하는 공간을 말합니다. 주로 문서 작업, 회의, 관리 등의 일을 수행하는 장소입니다.", "options": ["대강당", "사무실", "교실", "공장"], "answer": 1, "explain": "पहिलो विकल्पको '대강당' को अर्थ ठूलो हल हो, यो मानिसहरू अफिसको काम गर्ने सानो ठाउँ होइन त्यसैले यो मिलेन। दोस्रो विकल्पको '사무실' को अर्थ कार्यालय वा अफिस हो, जहाँ मानिसहरू काम गर्न, मिटिङ गर्न र कागजी काम गर्न जम्मा हुन्छन्, त्यसैले यो सही उत्तर हो। तेस्रो विकल्पको '교실' को अर्थ कक्षा कोठा हो, यो विद्यार्थी पढ्ने ठाउँ हो त्यसैले अफिसको काम गर्ने ठाउँसँग मिल्दैन। चौथो विकल्पको '공장' को अर्थ कारखाना हो, यो प्रशासनिक काम गर्ने अफिस होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प २ हो जसको अर्थ कार्यालय (사무실) हुन्छ।"}, {"n": "27", "q": "종이, 천, 머리카락 같은 재료를 자르기 위해 사용되는 장치로, 가운데에 결합된 날카로운 두 개의 날과 손가락을 넣을 구멍이 있는 두 개의 손잡이로 구성됩니다.", "options": ["톱", "가위", "칼", "드릴"], "answer": 1, "explain": "पहिलो विकल्पको '톱' को अर्थ करन्ती (आरी) हो, यो कपडा वा कागज काट्ने औजार होइन त्यसैले यो मिलेन। दोस्रो विकल्पको '가위' को अर्थ कैंची हो, जसको बीचमा धारिला दुई वटा ब्लेड र औंला छिराउने प्वाल हुन्छ जसले कागज, कपडा आदि काट्न मद्दत गर्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्पको '칼' को अर्थ चक्कु हो, यसमा औंला छिराउने प्वाल हुँदैन त्यसैले यो मिलेन। चौथो विकल्पको '드릴' को अर्थ प्वाल पार्ने मेसिन हो, यो काट्ने कैंची होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प २ हो जसको अर्थ कैंची (가위) हुन्छ।"}, {"n": "28", "q": "물체를 자르거나 깎기 위해 사용하는 보통 얇고 납작한 날을 가지고 있는 도구로, 용도에 따라 모양이 다양합니다.", "options": ["가위", "낫", "톱", "칼"], "answer": 3, "explain": "가위 भनेको कैंची हो, यो पातलो र चेप्टो धार भएको टुक्रा काट्ने साधन भए पनि मुख्यतया कागज वा कपडा काट्न प्रयोग हुन्छ। 낫 भनेको हँसिया हो, यो घाँस काट्न प्रयोग हुन्छ। 톱 भनेको आरा हो, यो काठ काट्न प्रयोग हुन्छ। 칼 भनेको चक्कु हो, यो वस्तुहरू काट्न वा छाँटकाँट गर्न प्रयोग हुने पातलो र चेप्टो धार भएको साधन हो र प्रश्नसँग मिल्छ। सही उत्तर ४ हो र यसको अर्थ चक्कु हो।"}, {"n": "29", "q": "날짜, 요일, 월, 연도 등의 정보를 한눈에 볼 수 있게 만든 것으로 보통 종이나 전자 화면에 표 형태로 구성되어 있으며, 벽걸이형이나, 탁상용으로 사용할 수 있습니다.", "options": ["시계", "안경", "달력", "계산기"], "answer": 2, "explain": "पहिलो विकल्पको '시계' को अर्थ घडी हो, यो मिति र बार हेर्ने तालिका होइन त्यसैले यो मिलेन। दोस्रो विकल्पको '안경' को अर्थ चस्मा हो, यो पात्रो होइन त्यसैले यो मिलेन। तेस्रो विकल्पको '달력' को अर्थ पात्रो (क्यालेन्डर) हो, जसबाट मिति, बार, महिना र वर्ष सजिलै हेर्न सकिन्छ र यो भित्ता वा टेबलमा राख्ने गरिन्छ, त्यसैले यो सही उत्तर हो। चौथो विकल्पको '계산기' को अर्थ क्याल्कुलेटर हो, यो गणितीय हिसाब गर्ने उपकरण हो त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प ३ हो जसको अर्थ पात्रो (달력) हुन्छ।"}, {"n": "30", "q": "데이터를 처리하고 저장하는 전자 기기로, 정보를 입력하고 처리하여 결과를 출력하는 역할을 합니다.", "options": ["컴퓨터", "전화기", "라디오", "현미경"], "answer": 0, "explain": "컴퓨터 भनेको कम्प्युटर हो, जसले डेटा प्रशोधन र भण्डारण गर्छ तथा जानकारी प्रशोधन गरेर नतिजा दिन्छ र प्रश्नसँग मिल्छ। 전화기 भनेको फोन हो, यो मुख्यतया कुराकानी गर्ने यन्त्र हो। 라디오 भनेको रेडियो हो, यो अडियो सुन्ने मात्र यन्त्र हो। 현미경 भनेको सूक्ष्मदर्शी हो, यो सानो वस्तु ठूलो देखाउने यन्त्र हो। सही उत्तर १ हो र यसको अर्थ कम्प्युटर हो।"}, {"n": "31", "q": "숫자와 수학적인 연산을 빠르고 정확하게 수행하는 전자 기기로 간단한 계산부터 복잡한 계산까지 처리할 수 있습니다.", "options": ["계산기", "수준기", "정수기", "세탁기"], "answer": 0, "explain": "१. 계산기 भनेको क्याल्कुलेटर हो, जसले गणितीय गणना छिटो र सही, सरलदेखि जटिलसम्म गर्न सक्छ त्यसैले यो सही उत्तर हो। २. 수준기 भनेको लेभल गर्ने औजार हो, यो गणितीय गणना गर्ने इलेक्ट्रोनिक मेसिन होइन। ३. 정수기 भनेको पानी शुद्ध गर्ने वाटर प्युरिफायर हो, यो गणना गर्ने मेसिन होइन। ४. 세탁기 भनेको लुगा धुने मेसिन हो, यसले गणनाको काम गर्दैन। सही उत्तर 계산기 हो जुन क्याल्कुलेटर हो।"}, {"n": "32", "q": "주로 청소나 개인 위생을 위한 종이 제품으로, 부드럽고 흡수력이 뛰어난 특성이 있습니다.", "options": ["원사", "비닐", "봉지", "휴지"], "answer": 3, "explain": "१. 원사 भनेको धागो हो, यो सरसफाइ वा व्यक्तिगत सरसफाइका लागि प्रयोग हुने कागजको उत्पादन होइन। २. 비닐 भनेको प्लास्टिक वा भिनिल हो, यो कागजको उत्पादन होइन। ३. 봉지 भनेको झोला हो, यो पनि कागजको उत्पादन होइन। ४. 휴지 भनेको टिस्यु पेपर वा ट्वाइलेट पेपर हो, जुन सरसफाइका लागि प्रयोग हुने नरम र पानी सोस्ने कागजको उत्पादन हो त्यसैले यो सही उत्तर हो। सही उत्तर 휴지 हो जुन टिस्यु पेपर हो।"}, {"n": "33", "q": "국제 여행을 위해 개인의 신원을 증명하는 공식 문서입니다. 보통 사진, 이름, 생년월일, 발급 국가 등이 기재되어 있으며, 출입국 관리 시 필요한 중요한 서류입니다.", "options": ["학생증", "사원증", "이력서", "여권"], "answer": 3, "explain": "학생증 भनेको विद्यार्थी परिचय पत्र हो, यो अन्तर्राष्ट्रिय यात्राको लागि होइन। 사원증 भनेको कम्पनीको परिचय पत्र हो, यो राहदानी होइन। 이력서 भनेको बायोडाटा वा जागिरको आवेदन फारम हो, यो यात्राको कागजात होइन। 여권 भनेको राहदानी हो, जसले अन्तर्राष्ट्रिय यात्राको लागि व्यक्तिको पहिचान प्रमाणित गर्छ र प्रश्नसँग मिल्छ। सही उत्तर ४ हो र यसको अर्थ राहदानी हो।"}, {"n": "34", "q": "돈, 카드, 신분증 등을 보관하는 작은 가방 모양의 액세서리로 보통 가죽이나 천으로 만들어집니다.", "options": ["서랍", "지갑", "배낭", "주머니"], "answer": 1, "explain": "서랍 भनेको दराज हो, यो बोक्ने झोला आकारको वस्तु होइन। 지갑 भनेको पर्स हो, जसले पैसा, कार्ड र परिचय पत्र राख्छ र छाला वा कपडाबाट बनेको हुन्छ र प्रश्नसँग मिल्छ। 배낭 भनेको पिठ्युँमा बोक्ने झोला हो, यो पैसा राख्ने सानो पर्स होइन। 주머니 भनेको खल्ती हो, यो छुट्टै बनाइएको झोला होइन। सही उत्तर २ हो र यसको अर्थ पर्स हो।"}, {"n": "35", "q": "잠금을 열거나 잠그는 데 사용하는 도구로, 특정 잠금 장치에 맞게 디자인된 금속 재질의 작은 물건입니다. 보통 집, 자동차, 자물쇠 등을 여는 데 사용됩니다.", "options": ["창문", "열쇠", "부품", "지갑"], "answer": 1, "explain": "१. 창문 भनेको झ्याल हो, यो ताला खोल्ने औजार होइन। २. 열쇠 भनेको साँचो हो, यो ताला खोल्न वा बन्द गर्न प्रयोग गरिने धातुबाट बनेको सानो वस्तु हो त्यसैले यो सही उत्तर हो। ३. 부품 भनेको पार्टपुर्जा हो, यो साँचो होइन। ४. 지갑 भनेको वालेट हो, यो ताला खोल्ने औजार होइन। सही उत्तर 열쇠 हो जुन साँचो हो।"}, {"n": "36", "q": "피부를 보호하거나 미용을 위해 사용하는 제품들로, 로션, 크림, 세럼, 메이크업 제품 등 다양한 종류가 있습니다.", "options": ["의약품", "생산품", "화장품", "음료품"], "answer": 2, "explain": "१. 의약품 भनेको औषधि हो, यो छालाको हेरचाह वा सौन्दर्यको लागि प्रयोग हुने प्रसाधन सामग्री होइन। २. 생산품 भनेको उत्पादित वस्तु हो, यो सामान्य शब्द हो। ३. 화장품 भनेको सौन्दर्य प्रसाधन वा कस्मेटिक्स हो, जुन छालाको सुरक्षा वा सौन्दर्यको लागि प्रयोग गरिन्छ र लोसन, क्रिम, सेरम, मेकअपका सामानहरू यसभित्र पर्छन् त्यसैले यो सही उत्तर हो। ४. 음료품 भनेको पेय पदार्थ हो, यो छालामा लगाउने सौन्दर्य प्रसाधन होइन। सही उत्तर 화장품 हो जुन कस्मेटिक्स हो।"}, {"n": "37", "q": "우리가 보려고 하는 것을 보여주는 유리이고 주로 얼굴을 보고 화장하거나 옷을 확인할 때 사용합니다. 모양은 평평하거나 조금 둥글 수 있습니다.", "options": ["거울", "옷장", "창문", "세숫대"], "answer": 0, "explain": "१. 거울 भनेको ऐना हो, यो हामीले हेर्न चाहेको कुरा देखाउने सिसा हो र अनुहार हेरेर मेकअप गर्दा वा लुगा ठिक छ छैन भनेर हेर्दा प्रयोग गरिन्छ त्यसैले यो सही उत्तर हो। २. 옷장 भनेको दल्चा वा कपडा राख्ने दराज हो, यो ऐना होइन। ३. 창문 भनेको झ्याल हो, यो अनुहार हेर्ने ऐना होइन। ४. 세숫대야 भनेको मुख धुने वा भाँडाकुडा धुने बाटा हो, यो ऐना होइन। सही उत्तर 거울 हो जुन ऐना हो।"}, {"n": "38", "q": "사람이 잠을 잘 때 머리나 목을 편안하게 받쳐 주기 위해 사용하는 물건입니다. 부드러운 재료로 만들어져 있어 몸의 긴장을 풀어 주고 편안한 잠을 도와줍니다.", "options": ["베개", "이불", "담요", "매트리스"], "answer": 0, "explain": "१. 베개 भनेको सिरानी हो, यो सुत्दा टाउको वा घाँटीलाई आरामसँग अड्याउन प्रयोग गरिने वस्तु हो त्यसैले यो सही उत्तर हो। २. 이불 भनेको बख्खु वा लुगा ओढ्ने कम्बल/सजाइ हो, यो टाउकोमा राख्ने सिरानी होइन। ३. 담요 भनेको ब्ल्याङ्केट वा कम्बल हो, const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-01';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"><b>किन?</b> <span></span></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    card.querySelector('.explain span').textContent = q.explain;
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
