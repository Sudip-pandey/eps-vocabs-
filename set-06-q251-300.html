<title>EPS-TOPIK Vocabulary Quiz — Set 06 (Q251–Q300)</title>
<style>
  :root {
    --primary: #a78bfa;
    --primary-dark: #c4b5fd;
    --primary-soft: rgba(124,58,237,.22);
    --accent: #6366f1;

    --muted: #9d9db4;
    --border: rgba(255,255,255,.09);
    --shadow: 0 2px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans KR", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(700px 340px at 50% -5%, rgba(99,102,241,.14), transparent 60%); background-attachment: fixed; color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); color: #d6c9ff; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,.12); margin-bottom: 14px; transition: all .15s; }
  .back-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  header { background: #312e81; color: #fff; padding: 20px 16px 16px; position: relative; border-bottom: 1px solid rgba(255,255,255,.1); box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.4rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  header p { opacity: .92; font-size: .9rem; margin-top: 4px; }
  .progress-wrap { margin-top: 14px; background: rgba(0,0,0,.35); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .progress-bar { height: 100%; background: #a5b4fc; width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(165,180,252,.6); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { position: relative; background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; background: #6366f1; border-radius: 0 0 6px 6px; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: rgba(167,139,250,.55); }
  .q-card.answered::after { content: "✓"; position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: #059669; color: #fff; font-weight: 800; font-size: .95rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .q-num { display: inline-block; font-size: .92rem; font-weight: 800; color: #fff; background: #4f46e5; padding: 7px 18px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(79,70,229,.4); }
  .q-text { font-size: 1.16rem; white-space: pre-line; margin: 14px 0 18px; line-height: 1.85; font-weight: 500; color: #f2f1fa; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 16px 18px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid rgba(255,255,255,.09); border-radius: 14px; margin-bottom: 0; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #1e1e30; color: #f2f1fa; }
  .options label:hover { border-color: #8b5cf6; background: #232338; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,.3); }
  .options label::before { content: ""; flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid #7c7ca0; background: transparent; transition: all .15s; }
  .options label.selected { background: var(--accent-soft); border-color: #a78bfa; box-shadow: 0 4px 18px rgba(99,102,241,.4); }
  .options label.selected::before { border-color: #a78bfa; background: #a78bfa; box-shadow: inset 0 0 0 4px #1e1e30; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #a5b4fc; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 700; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .btn-primary { background: #4f46e5; color: #fff; box-shadow: 0 4px 18px rgba(79,70,229,.4); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 8px 24px rgba(79,70,229,.45); }
  .btn-primary:disabled { background: #2a2a3d; color: #77778e; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: rgba(255,255,255,.06); color: #d6c9ff; border: 2px solid rgba(255,255,255,.12); }
  .btn-ghost:hover { border-color: #8b5cf6; background: rgba(124,58,237,.2); }
  .submit-bar { position: sticky; bottom: 0; background: rgba(11,11,22,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 24px rgba(0,0,0,.5); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: #1e1b3a; border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; line-height: 1.05; color: #a5b4fc; }
  .score-card .pct { font-size: 1.15rem; color: #c9c6e0; margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: #e6e4f5; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: #4f46e5; color: #fff; border-color: transparent; box-shadow: 0 2px 12px rgba(79,70,229,.35); }
  .review-card { background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: #059669; }
  .verdict.no { background: #e11d48; }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; background: #1e1e30; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #12101f; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; color: #d9d7ea; }
  .explain b { color: #d6c9ff; }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; }
  .explain-stem { background: rgba(99,102,241,.18); border-left: 4px solid #a78bfa; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; color: #f2f1fa; }
  .exp-line { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.07); line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: #34d399; }
  .exp-mark.no { color: #fb7185; }
  .exp-note { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.4); border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; color: #fde9c8; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }

</style>

<header>

</main>

<script>
const QUESTIONS = [{"n": "251", "q": "결혼 따위의 좋은 일에 남을 초청하는 글과 함께 위치, 장소, 날짜 등 내용을 적어 주는 카드입니다.", "options": ["청첩장", "피로연", "축의금", "결혼식장"], "answer": 0, "explain": "प्रश्नको अर्थ: यो विवाह जस्तो शुभकार्यमा अरू मानिसहरूलाई निम्तो दिनको लागि स्थान र मिति लेखेर पठाइने कार्ड हो।\n① 청첩장 भनेको विवाहजस्ता शुभ कार्यमा अरूलाई बोलाउन मिति, स्थान आदि लेखेर दिइने निमन्त्रणा कार्ड हो ✓\n② 피로연 भनेको विवाहपछिको भोज हो, त्यसैले यो मिलेन। ✗\n③ 축의금 भनेको बधाई स्वरूप दिइने पैसा हो, त्यसैले यो मिलेन। ✗\n④ 결혼식장 भनेको विवाह मण्डप वा हल हो, त्यसैले यो मिलेन। ✗\nशिक्षकको उत्तर-पत्र: ③ 축의금 — मेरो उत्तर: ① 청첩장। प्रश्न: निमन्त्रणा लेखिएको कार्ड (स्थान, मिति सहित) — त्यो निमन्त्रणा पत्र (청첩장) हो; 축의금 त बधाईमा दिने पैसा हो, कार्ड होइन।"}, {"n": "252", "q": "장례식에서 고인의 명복을 빌기 위해 주는 돈입니다. 고인의 가족을 위로하고, 장례 절차를 돕기 위한 의미로 주어지며, 일반적으로 봉투에 담아 전달합니다.", "options": ["축의금", "조의금", "요금", "용돈"], "answer": 1, "explain": "प्रश्नको अर्थ: यो अन्त्यष्टि कार्यक्रममा मृतकको आत्माको शान्तिको कामना गर्न र शोकमा रहेका परिवारलाई सहयोग गर्न खवर पठाउने पैसा हो।\n① 축의금 भनेको शुभ कार्यमा दिइने बधाई रकम हो, त्यसैले यो मिलेन। ✗\n② 조의금 भनेको मलामी जाँदा वा मृत्यु संस्कारमा परिवारलाई सहयोग र समवेदना व्यक्त गर्न दिइने पैसा हो ✓\n③ 요금 भनेको सेवा वा प्रयोग बापतको शुल्क हो, त्यसैले यो मिलेन। ✗\n④ 용돈 भनेको खर्च (पकेट मनी) हो, त्यसैले यो मिलेन। ✗"}, {"n": "253", "q": "새로운 집으로 이사한 후, 친지나 친구들을 초대하여 집을 구경시키고, 축하를 받는 행사입니다. 손님들께 음식을 대접하고 선물을 받습니다.", "options": ["생일", "돌잔치", "집들이", "결혼식"], "answer": 2, "explain": "प्रश्नको अर्थ: यो नयाँ घरमा बसाइँ सरेपछि आफन्त र साथीहरूलाई बोलाएर घर देखाउने र शुभकामना लिने कार्यक्रम हो।\n① 생일 भनेको जन्मदिन हो, त्यसैले यो मिलेन। ✗\n② 돌잔치 भनेको पहिलो जन्मदिनको भोज हो, त्यसैले यो मिलेन। ✗\n③ 집들이 भनेको नयाँ घरमा सरेपछि साथीभाइ तथा आफन्तलाई बोलाएर घर देखाउने र भोज गराउने घरपैँचो कार्यक्रम हो ✓\n④ 결혼식 भनेको विवाह समारोह हो, त्यसैले यो मिलेन। ✗"}, {"n": "254", "q": "특정 국가의 중요한 역사적 사건이나 기념일을 기리기 위해 정해진 날로, 보통 해당 국가의 독립, 건국, 승리 등을 기념합니다.", "options": ["국경일", "개천절", "광복절", "삼일절"], "answer": 0, "explain": "प्रश्नको यक्ति हो, त्यसैले यो मिलेन। ✗\n④ 응원자 भनेको समर्थन वा हौसला दिने व्यक्ति हो, त्यसैले यो मिलेन। ✗"}, {"n": "258", "q": "사람이 죽은 후 고인을 예를 갖추어 보내는 의식과 절차를 말합니다. 유가족과 조문객들이 함께 고인을 추모하고 애도합니다.", "options": ["장례", "제사", "차례", "성묘"], "answer": 0, "explain": "प्रश्नको अर्थ: यो प्रश्नले कोही मानिसको मृत्यु हुँदा उहाँलाई सम्मानका साथ अन्तिम बिदाइ गर्ने संस्कार र कार्यविधिको बारेमा बताइरहेको छ।\n① 장례 भनेको मानिसको मृत्युपछि सम्मानपूर्वक अन्तिम संस्कार गर्ने विधि र प्रक्रिया हो ✓\n② 제사 भनेको दिवङ्गत पितृहरूको सम्झनामा गरिने श्राद्ध हो, त्यसैले यो मिलेन। ✗\n③ 차례 भनेको चाडपर्वका दिन बिहान गरिने पितृ पूजा हो, त्यसैले यो मिलेन। ✗\n④ 성묘 भनेको पूर्वजहरूको चिहानमा गएर ढोग्ने काम हो, त्यसैले यो मिलेन। ✗"}, {"n": "259", "q": "어른이 돌아가시면 매년 돌아가신 날 아침에 가족들이 모여서 상에는 천, 나물, 과일, 고기, 등 정성스럽게 만든 음식들을 올리는 것을 말합니다.", "options": ["맞선", "환갑", "제사", "장례"], "answer": 2, "explain": "प्रश्नको अर्थ: यो प्रश्नले परिवारको कोही सदस्यको निधन भएपछि हरेक वर्ष उहाँको स्मृतिमा विभिन्न प्रकारका खानेकुराहरू चढाएर गरिने वार्षिक कार्यको बारेमा बताइरहेको छ।\n① 맞선 भनेको विवाहका लागि भेट्ने काम हो, त्यसैले यो मिलेन। ✗\n② 환갑 भनेको ६० औँ जन्मदिन हो, त्यसैले यो मिलेन। ✗\n③ 제사 भनेको दिवङ्गत अभिभावकको मृत्यु भएको दिन परिवारका सदस्यहरू जम्मा भई परिकारहरू चढाएर गरिने श्राद्ध/पितृ पूजा हो ✓\n④ 장례 भनेको अन्तिम संस्कार हो, त्यसैले यो मिलेन। ✗"}, {"n": "260", "q": "지하철이나 버스 안에 볼 수 있는 나이 많으신 분이나 몸이 불편한 사람을 위한 자리입니다.", "options": ["안전석", "지정석", "예약석", "노약자석"], "answer": 3, "explain": "प्रश्नको अर्थ: यो भूमिगत रेल वा बसमा ज्येष्ठ नागरिक वा अशक्त व्यक्तिहरूका लागि छुट्टाइएको विशेष आसन हो।\n① 안전석 (सुरक्षित सीट) - यो विवरणसँग मिल्दैन। ✗\n② 지정석 (तोकिएको सीट) - यो विवरणसँग मिल्दैन। ✗\n③ 예약석 (आरक्षित सीट) - यो विवरणसँग मिल्दैन। ✗\n④ 노약자석 (ज्येष्ठ नागरिक तथा असक्तका लागि सीट) - सबवे वा बसमा वृद्ध वा शारीरिक रूपमा अशक्त व्यक्तिका लागि छुट्याइएको सीट हो, त्यसैले यो सही उत्तर हो।\nअतः सही उत्तर 4. 노약자석 (ज्येष्ठ नागरिक तथा असक्तका लागि सीट) हो। ✓"}, {"n": "261", "q": "한국의 전통 놀이로, 네 개의 나무 막대기 던져 나온 모양에 따라 말을 움직이며 승부를 겨루는 게임입니다. 주로 설날이나 명절 때 가족이나 친척이 함께 즐깁니다.", "options": ["연날리기", "쥐불놀이", "농악놀이", "윷놀이"], "answer": 3, "explain": "प्रश्नको अर्थ: यो काठका चार वटा टुक्रा फालेर खेलिने कोरियाको परम्परागत खेल हो, जुन चाडपर्वमा परिवारसँग खेलिन्छ।\n① 연날리기 (चङ्गा उडाउने खेल) - यो विवरणसँग मिल्दैन। ✗\n② 쥐불놀이 (जुइबुलनोरी - आगो घुमाउने खेल) - यो विवरणसँग मिल्दैन। ✗\n③ 농악놀이 (परम्परागत किसान बाजा र नृत्य) - यो विवरणसँग मिल्दैन। ✗\n④ 윷놀이 (युत्नोरी) - चारवटा काठका लाठीहरू फालेर परेको आकार अनुसार गोटी बढाएर खेलिने कोरियाली परम्परागत खेल हो, त्यसैले यो सही उत्तर हो।\nअतः सही उत्तर 4. 윷놀이 (युत्नोरी) हो। ✓"}, {"n": "262", "q": "한국의 전통 놀이로, 발로 제기를 차서 오래 떠 있게 하는 놀이입니다. 주로 설날이나 명절에 아이들과 어른들이 함께 즐깁니다.", "options": ["윷놀이", "팽이치기", "제기차기", "강강술래"], "answer": 2, "explain": "प्रश्नको अर्थ: यो कोरियाको एक परम्परागत खेल हो, जसलाई खुट्टाले खेल्ने गरिन्छ। यो मुख्यतया चाडपर्वका बेला सबैले खेल्ने गर्छन्।\n① 윷놀이 (युत्노री) - यो विवरणसँग मिल्दैन। ✗\n② 팽이치기 (लट्टू घुमाउने खेल) - यो विवरणसँग मिल्दैन। ✗\n③ 제기차기 (जेगिछागी) - गोडाले जेगीलाई हानेर धेरै बेर हावामा राखिने कोरियाको परम्परागत खेल हो ✓\n④ 강강술래 (गाङ्गाङसुल्ले) - यो विवरणसँग मिल्दैन।\nअतः सही उत्तर 3. 제기차기 (जेगिछागी) हो। ✗"}, {"n": "263", "q": "쌀가루를 반죽하여 팥, 콩, 밤, 대추, 깨 따위를 넣고 반달이나 조개 모양으로 빚어서 솔잎을 깔고 찐 음식 특히 추석 때 빚어서 먹습니다.", "options": ["찐빵", "콩국수", "송편", "삼계탕"], "answer": 2, "explain": "प्रश्नको अर्थ: यो चामलको पिठोमा विभिन्न मीठा चिजहरू राखेर बनाइने र विशेष गरी चाडपर्वमा खाने परम्परागत खाना हो।\n① 찐빵 (बाफिएको पाउरोटी) - यो विवरणसँग मिल्दैन। ✗\n② 콩국수 (भटमासको झोलको चाउचाउ) - यो विवरणसँग मिल्दैन। ✗\n③ 송편 (सोङप्प्योन) - पिठो मुछेर बोडी, तिल आदि हाली अर्धचन्द्र आकारमा बनाएर सल्लोको पातमा उसिनेर खाइने परिकार हो, जुन विशेष गरी छुसकमा खाइन्छ ✓\n④ 삼계탕 (सामग्येथाङ - कुखुराको सुप) - यो विवरणसँग मिल्दैन।\nअतः सही उत्तर 3. 송편 (सोङप्प्योन) हो। ✗"}, {"n": "264", "q": "두 팀이 긴 줄을 잡고 서로 반대 방향으로 당기는 놀이입니다. 상대 팀을 끌어당겨서 승리하는 것이 목표이며, 보통 명절이나 축제에서 많이 즐깁니다.", "options": ["널뛰기", "팽이치기", "강강술래", "줄다리기"], "answer": 3, "explain": "प्रश्नको अर्थ: यो दुई समूहले लामो डोरी समातेर आफैंतर्फ तानेर जित्ने परम्परागत खेल हो।\n① 널뛰기 (फल्याकमा उफ्रिने खेल) - यो विवरणसँग मिल्दैन। ✗\n② 팽이치기 (लट्टू घुमाउने खेल) - यो विवरणसँग मिल्दैन। ✗\n③ 강강술래 (गाङ्गाङसुल्ले) - यो विवरणसँग मिल्दैन। ✗\n④ 줄다리기 (डोरी तान्ने खेल) - दुई टोलीले लामो डोरी समातेर विपरीत दिशातिर तान्ने खेल हो, त्यसैले यो सही उत्तर हो।\nअतः सही उत्तर 4. 줄다리기 (डोरी तान्ने खेल) हो। ✓"}, {"n": "265", "q": "전통적인 한국의 민속 춤으로, 보통 여자들이 추석 날 보름달 아래에 손을 잡고 원을 이루어 돌면서 부르는 노래에 맞춰 춤을 추는 놀이입니다.", "options": ["씨름", "윷놀이", "강강술래", "연날리기"], "answer": 2, "explain": "प्रश्नको अर्थ: यो कोरियाको एक किसिमको परम्परागत लोकनृत्य हो, जहाँ महिलाहरूले गोलबन्द भएर गीत गाउँदै नाच्छन्।\n① 씨름 (सिरुम - कोरियाली कुस्ती) - यो विवरणसँग मिल्दैन। ✗\n② 윷놀이 (युत्노री) - यो विवरणसँग मिल्दैन। ✗\n③ 강강술래 (गाङ्गाङसुल्ले) - छुसकको दिन पूर्णिमाको रातमा महिलाहरूले हात समातेर गोलो घेरा बनाई घुम्दै नाचिने परम्परागत नृत्य हो ✓\n④ 연날리기 (चङ्गा उडाउने खेल) - यो विवरणसँग मिल्दैन।\nअतः सही उत्तर 3. 강강술래 (गाङ्गाङसुल्ले) हो। ✗"}, {"n": "266", "q": "특별한 날을 기념하기 위해 온 가족이 모여서 맛있는 음식을 먹으면서 즐거운 시간을 보내는 날입니다.", "options": ["명절", "주말", "휴가", "휴일"], "answer": 0, "explain": "प्रश्नको अर्थ: यो विशेष दिनमा परिवारका सबै सदस्यहरू जम्मा भएर मीठा परिकार खाँदै खुसी साटासाट गर्ने दिन हो।\n① 명절 (चाडपर्व) - विशेष दिन मनाउन परिवारका सबै सदस्य भेला भएर मीठो खानेकुरा खाँदै रमाइलो समय बिताउने दिन हो ✓\n② 주말 (सप्ताहन्त) - यो विवरणसँग मिल्दैन। ✗\n③ 휴가 (बिदा) - यो विवरणसँग मिल्दैन। ✗\n④ 휴일 (सार्वजनिक बिदा) - यो विवरणसँग मिल्दैन।\nअतः सही उत्तर 1. 명절 (चाडपर्व) हो। ✗"}, {"n": "267", "q": "역사, 문화, 예술, 자연 등과 관련된 물건을 모아 전시하고 보여주는 곳입니다. 사람들이 보고 배우며 지식을 얻을 수 있는 교육 장소입니다.", "options": ["교육원", "미술관", "박물관", "백화점"], "answer": 2, "explain": "प्रश्नको अर्थ: यो ऐतिहासिक, सांस्कृतिक र कलासम्बन्धी महत्त्वपूर्ण वस्तुहरू जम्मा गरेर मानिसहरूलाई प्रदर्शन गर्ने ठाउँ हो।\n① 교육원 (तालिम/शिक्षा केन्द्र) - यो विवरणसँग मिल्दैन। ✗\n② 미술관 (कला सङ्ग्रहालय) - यो विवरणसँग पूर्ण रूपमा मिल्दैन। ✗\n③ 박물관 (सङ्ग्रहालय) - इतिहास, संस्कृति, कला, प्रकृति सम्बन्धी वस्तुहरू सङ्कलन गरी प्रदर्शन गर्ने ठाउँ हो ✓\n④ 백화점 (डिपार्टमेन्ट स्टोर) - यो विवरणसँग मिल्दैन।\nअतः सही उत्तर 3. 박물관 (सङ्ग्रहालय) हो। ✗"}, {"n": "268", "q": "내 집 가까이에 사는 사람들을 말합니다. 어려울 때 서로 도와주고 정을 나누는 좋은 관계를 만드는 것이 중요합니다.", "options": ["친구", "가족", "친척", "이웃"], "answer": 3, "explain": "प्रश्नको अर्थ: यो आफ्नो घरको नजिकै बसोबास गर्ने मानिसहरूलाई भनिन्छ, जो अप्ठ्यारो पर्दा एक-अर्कालाई सहयोग गर्छन्।\n① 친구 (साथी) - यो विवरणसँग मिल्दैन। ✗\n② 가족 (परिवार) - यो विवरणसँग मिल्दैन। ✗\n③ 친척 (नातेदार) - यो विवरणसँग मिल्दैन। ✗\n④ 이웃 (छिमेकी) - आफ्नो घर नजिकै बस्ने मानिसहरूलाई भनिन्छ, त्यसैले यो सही उत्तर हो।\nअतः सही उत्तर 4. 이웃 (छिमेकी) हो। ✓"}, {"n": "269", "q": "많은 사람들이 함께 즐기는 문화로, 예를 들어 노래, 영화, 드라마, 패션 등이 있습니다. 쉽게 접할 수 있고, 사람들이 일상에서 자주 경험하는 문화입니다.", "options": ["지역문화", "대중문화", "전통문화", "청소년문화"], "answer": 1, "explain": "प्रश्नको अर्थ: यो धेरै मानिसहरूले दैनिक जीवनमा सजिलैसँग अनुभव गर्ने र आनन्द लिने गीत, चलचित्र तथा फेसनजस्ता विषयहरूसँग सम्बन्धित छ।\n① 지역문화 (क्षेत्रीय संस्कृति) - यो विवरणसँग मिल्दैन। ✗\n② 대중문화 (जनसंस्कृति/पप कल्चर) - धेरै मानिसहरूले सँगै आनन्द लिने गीत, चलचित्र, ड्रामा आदि संस्कृति हो ✓\n③ 전통문화 (परम्परागत संस्कृति) - यो विवरणसँग मिल्दैन। ✗\n④ 청소년문화 (युवा संस्कृति) - यो विवरणसँग मिल्दैन।\nअतः सही उत्तर 2. 대중문화 (जनसंस्कृति) हो। ✗"}, {"n": "270", "q": "운동장이나 경기장에 경기나 공연을 보러 모인 사람들을 말합니다.", "options": ["관중", "응원가", "프로팀", "가수"], "answer": 0, "explain": "प्रश्नको अर्थ: खेल मैदान वा रंगशालामा खेल वा कार्यक्रम हेर्न जम्मा भएका मानिसहरूलाई जनाउँछ।\n① 관중 (दर्शकवृन्द) - खेलकुद मैदान वा रङ्गशालामा खेल वा प्रस्तुति हेर्न भेला भएका मानिसहरूलाई भनिन्छ ✓\n② 응원가 (हुटिङ गीत) - यो विवरणसँग मिल्दैन। ✗\n③ 프로팀 (व्यावसायिक टोली) - यो विवरणसँग मिल्दैन। ✗\n④ 가수 (गायक/गायिका) - यो विवरणसँग मिल्दैन।\nअतः सही उत्तर 1. 관중 (दर्शकवृन्द) हो। ✗"}, {"n": "271", "q": "1990 년대부터 중국과 동남아를 중심으로 인기를 얻기 시작하고 요즘은 유럽과 미국에서까지 유명합니다.", "options": ["경제", "한류", "무역", "수입"], "answer": 1, "explain": "प्रश्नको अर्थ: १९९० को दशकदेखि चीन र दक्षिणपूर्वी एसियामा लोकप्रिय बन्न थालेको संस्कृति हो।\n① 경제 (अर्थतन्त्र) - यो विवरणसँग मिल्दैन। ✗\n② 한류 (कोरियन वेभ/हान्र्यु) - १९९० को दशकदेखि चीन र दक्षिणपूर्वी एसियामा लोकप्रिय भई हाल युरोप र अमेरिकामा समेत प्रसिद्ध भएको कोरियाली सांस्कृतिक लहर हो ✓\n③ 무역 (व्यापार) - यो विवरणसँग मिल्दैन। ✗\n④ 수입 (आयात) - यो विवरणसँग मिल्दैन।\nअतः सही उत्तर 2. 한류 (कोरियन वेभ) हो। ✗"}, {"n": "272", "q": "특정 팀이나 사람을 응원하기 위해 부르는 노래입니다. 스포츠 경기나 행사에서 팀을 응원하며 분위기를 돋우는 역할을 합니다.", "options": ["응원가", "응원단", "프로팀", "관중석"], "answer": 0, "explain": "प्रश्नको अर्थ: कुनै विशेष टिम वा व्यक्तिलाई समर्थन गर्न गाइने गीत हो।\n① 응원가 (हुटिङ गीत) - कुनै खास टोली वा व्यक्तिलाई प्रोत्साहन दिन गाइने गीत हो ✓\n② 응원단 (हुटिङ समूह) - यो विवरणसँग मिल्दैन। ✗\n③ 프로팀 (व्यावसायिक टोली) - यो विवरणसँग मिल्दैन। ✗\n④ 관중석 (दर्शकासन/सिट) - यो विवरणसँग मिल्दैन।\nअतः सही उत्तर 1. 응원가 (हुटिङ गीत) हो। ✗"}, {"n": "273", "q": "특정 장소나 행사에 들어가기 위해 필요한 티켓입니다. 예를 들어, 영화관, 공연장, 박물관 등에서 들어갈 때 이것을 구매해야 합니다.", "options": ["신분증", "공과금", "입장권", "상품권"], "answer": 2, "explain": "प्रश्नको अर्थ: कुनै निश्चित ठाउँ वा कार्यक्रममा प्रवेश गर्न आवश्यक पर्ने टिकट हो।\n① 신분증 (परिचयपत्र) - यो विवरणसँग मिल्दैन। ✗\n② 공과금 (सार्वजनिक सेवा शुल्क) - यो विवरणसँग मिल्दैन। ✗\n③ 입장권 (प्रवेश टिकट) - कुनै निश्चित ठाउँ वा कार्यक्रममा प्रवेश गर्नका लागि चाहिने टिकट हो ✓\n④ 상품권 (उपहार भौचर) - यो विवरणसँग मिल्दैन।\nअतः सही उत्तर 3. 입장권 (प्रवेश टिकट) हो। ✗"}, {"n": "274", "q": "주로 음악이나 공연 활동을 하는 젊은 연예인으로, 팬들에게 큰 인기를 끄는 사람을 말합니다. 보통 그룹이나 개인으로 활동합니다.", "options": ["배우", "가사", "아이돌", "방송자"], "answer": 2, "explain": "प्रश्नको अर्थ: मुख्यतया सङ्गीत वा कन्सर्टमा सक्रिय रहने र युवाहरूमाझ अत्यधिक लोकप्रिय कलाकार हो।\n① 배우 (अभिनेता/अभिनेत्री) - यो विवरणसँग मिल्दैन। ✗\n② 가사 (गीतको शब्द) - यो विवरणसँग मिल्दैन। ✗\n③ 아이돌 (आइडल/पप स्टार) - मुख्यतया सङ्गीत वा प्रस्तुतिको क्षेत्रमा सक्रिय युवा कलाकार हुन् जसलाई प्रशंसकहरूले धेरै मन पराउँछन् ✓\n④ 방송자 (प्रसारक) - यो विवरणसँग मिल्दैन।\nअतः सही उत्तर 3. 아이돌 (आइडल) हो। ✗"}, {"n": "275", "q": "영화나 드라마에서 특정 역할을 맡아 연기하는 사람을 말합니다. 감정과 상황을 표현하며, 이야기 속 등장인물을 생동감 있게 만들어 관객에게 감동을 남깁니다.", "options": ["응원가", "기자", "가수", "배우"], "answer": 3, "explain": "प्रश्नको अर्थ: चलचित्र वा नाटकमा कुनै विशेष चरित्रको अभिनय गर्ने व्यक्ति हो।\n① 응원가 भनेको हुटिङ गीत हो, त्यसैले यो उत्तर होइन। ✗\n② 기자 भनेको पत्रकार हो, त्यसैले यो उत्तर होइन। ✗\n③ 가수 भनेको गायक वा गायिका हो, त्यसैले यो उत्तर होइन। ✗\n④ 배우 भनेको फिल्म वा नाटकमा अभिनय गर्ने कलाकार हो ✓"}, {"n": "276", "q": "일을 할 때 입는 옷으로, 몸을 보호하고 편하게 움직일 수 있도록 만들어졌습니다. 공장, 건설 현장 등에서 사용되며, 일의 종류에 따라 모양과 재질이 다를 수 있습니다.", "options": ["한복", "양복", "유니폼", "작업복"], "answer": 3, "explain": "प्रश्नको अर्थ: काम गर्दा लगाउने लुगा हो जसले शरीरको सुरक्षा गर्छ र सजिलै चलाउन मद्दत गर्छ।\n① 한복 भनेको कोरियाली परम्परागत लुगा हो, त्यसैले यो उत्तर होइन। ✗\n② 양복 भनेको औपचारिक कोट-प्यान्ट हो, त्यसैले यो उत्तर होइन। ✗\n③ 유니폼 भनेको पोशाक (युनिफर्म) हो, त्यसैले यो उत्तर होइन। ✗\n④ 작업복 भनेको काम गर्दा शरीरको सुरक्षाका लागि लगाइने लुगा हो ✓"}, {"n": "277", "q": "공식적인 자리나 중요한 모임에서 입는 단정하고 격식 있는 옷입니다. 주로 면접, 결혼식, 회의 등에 입습니다.", "options": ["한복", "정장", "유니폼", "작업복"], "answer": 1, "explain": "प्रश्नको अर्थ: आधिकारिक ठाउँ वा महत्त्वपूर्ण भेलामा लगाउने औपचारिक र चिटिक्क परेको पहिरन हो।\n① 한복 भनेको कोरियाली परम्परागत लुगा हो, त्यसैले यो उत्तर होइन। ✗\n② 정장 भनेको औपचारिक कार्यक्रम वा अन्तर्वार्तामा लगाउने कोट-प्यान्ट (सुट) हो ✓\n③ 유니폼 भने고 पोशाक हो, त्यसैले यो उत्तर होइन। ✗\n④ 작업복 भनेको कार्यस्थलमा लगाउने लुगा हो, त्यसैले यो उत्तर होइन। ✗"}, {"n": "278", "q": "다른 사람의 좋은 말이나 행동을 보고 좋다고 말해 주는 것입니다. 기분을 좋게 하고, 더 잘하게 만드는 힘을 줍니다.", "options": ["태도", "의도", "칭찬", "피해"], "answer": 2, "explain": "प्रश्नको अर्थ: अर्को मानिसको राम्रो कुरा वा काम देखेर त्यसको प्रशंसा गर्ने कार्य हो।\n① 태도 भनेको बानी वा व्यवहार हो, त्यसैले यो उत्तर होइन। ✗\n② 의도 भनेको मनको नियत वा उद्देश्य हो, त्यसैले यो उत्तर होइन। ✗\n③ 칭찬 भनेको अरूको राम्रो कामको तारिफ वा प्रशंसा गर्ने काम हो ✓\n④ 피해 भनेको हानि वा क्षति हो, त्यसैले यो उत्तर होइन। ✗"}, {"n": "279", "q": "어떤 일이나 생각에 대해 자기 마음속에 있는 생각이나 판단을 말하는 것입니다.", "options": ["의견", "소통", "이야기", "싸움"], "answer": 0, "explain": "प्रश्नको अर्थ: कुनै काम वा विचारको बारेमा आफ्नो मनमा भएको सोच वा धारणा व्यक्त गर्नु हो।\n① 의견 भनेको कुनै विषयमा आफ्नो मनमा भएको विचार वा धारणा हो ✓\n② 소통 भनेको दोहोरो सञ्चार वा कुराकानी हो, त्यसैले यो उत्तर होइन। ✗\n③ 이야기 भनेको कुराकानी वा कथा हो, त्यसैले यो उत्तर होइन। ✗\n④ 싸움 भनेको झगडा हो, त्यसैले यो उत्तर होइन। ✗"}, {"n": "280", "q": "근로자가 원료나 재료를 가공하여 물건을 만들어 내는 설비를 갖춘 곳입니다.", "options": ["공장", "농장", "사업장", "공사장"], "answer": 0, "explain": "प्रश्नको अर्थ: कामदारहरूले कच्चा पदार्थ प्रशोधन गरेर सामान उत्पादन गर्ने ठाउँ हो।\n① 공장 भनेको कच्चा पदार्थ प्रशोधन गरेर सामान बनाइने कारखाना हो ✓\n② 농장 भनेको कृषि फार्म हो, त्यसैले यो उत्तर होइन। ✗\n③ 사업장 भनेको कार्यस्थल हो, त्यसैले यो उत्तर होइन। ✗\n④ 공사장 भनेको निर्माण क्षेत्र हो, त्यसैले यो उत्तर होइन। ✗"}, {"n": "281", "q": "말을 할 때 지켜야 하는 바른 말쓰기와 예의 있는 표현을 말합니다. 존댓말을 쓰는 것이나 남을 배려하는 것은 이에 포함됩니다.", "options": ["인사 예절", "식사 예절", "공공 예절", "언어 예절"], "answer": 3, "explain": "प्रश्नको अर्थ: बोल्दा अपनाउनुपर्ने सही भाषा र शिष्ट तरिका हो।\n① 인사 예절 भनेको अभिवादन गर्दा पालना गरिने शिष्टाचार हो, त्यसैले यो उत्तर होइन। ✗\n② 식사 예절 भनेको खाना खाँदा पाल나 गरिने शिष्टाचार हो, त्यसैले यो उत्तर होइन। ✗\n③ 공공 예절 भनेको सार्वजनिक स्थानमा पालना गरिने शिष्टाचार हो, त्यसैले यो उत्तर होइन। ✗\n④ 언어 예절 भनेको बोल्दा पालना गरिने भाषाको शिष्टाचार र नम्र बोली हो ✓"}, {"n": "282", "q": "어떤 직장에서 함께 일하는 사람을 말합니다. 서로 도와주고 협력하면서 좋은 관계를 유지하는 것이 중요합니다.", "options": ["선배", "동료", "반친구", "룸메이트"], "answer": 1, "explain": "प्रश्नको अर्थ: कुनै कार्यक्षेत्रमा सँगै काम गर्ने सहकर्मीलाई जनाउँछ।\n① 선배 भनेको आफूभन्दा पहिले काम वा पढाइ सुरु गरेको वरिष्ठ (सिनियर) व्यक्ति हो, त्यसैले यो उत्तर होइन। ✗\n② 동료 भनेको एउटै कार्यस्थलमा सँगै काम गर्ने सहकर्मी हो ✓\n③ 반친구 भनेको कक्षाको साथी हो, त्यसैले यो उत्तर होइन। ✗\n④ 룸메이트 भनेको एउटै कोठामा बस्ने साथी हो, त्यसैले यो उत्तर होइन। ✗"}, {"n": "283", "q": "공공 장소에서 하면 안 되는 행동으로 순서를 어기고 남의 자리에 슬며시 끼어드는 행위입니다.", "options": ["흡연", "방해", "싸움", "새치기"], "answer": 3, "explain": "प्रश्नको अर्थ: सार्वजनिक ठाउँमा लाइन मिचेर अगाडि बढ्ने गलत बानी हो।\n① 흡연 भनेको धुम्रपान गर्ने काम हो, त्यसैले यो उत्तर होइन। ✗\n② 방해 भनेको अरूको काममा बाधा पुर्‍याउने काम हो, त्यसैले यो उत्तर होइन। ✗\n③ 싸움 भनेको झगडा गर्ने काम हो, त्यसैले यो उत्तर होइन। ✗\n④ 새치기 भनेको सार्वजनिक ठाउँमा नियम विपरीत पालो मिच्ने काम हो ✓"}, {"n": "284", "q": "자신보다 먼저 어떤 일을 시작한 사람으로, 경험이 많고 후배에게 조언을 해주는 역할을 합니다. 학교나 직장에서 후배를 이끌고 돕는 중요한 존재입니다.", "options": ["선배", "동료", "상사", "대리"], "answer": 0, "explain": "प्रश्नको अर्थ: अनुभवी व्यक्ति जसले आफ्नो जुनियरलाई सल्लाह र मार्गदर्शन दिन्छ।\n① 선배 भनेको आफूभन्दा अघि काम सुरु गरेको अनुभव भएको वरिष्ठ (सिनियर) व्यक्ति हो ✓\n② 동료 भनेको सँगै काम गर्ने सहकर्मी हो, त्यसैले यो उत्तर होइन। ✗\n③ 상사 भनेको माथिल्लो दर्जाको हाकिम हो, त्यसैले यो उत्तर होइन। ✗\n④ 대리 भनेको कार्यालयको सहायक प्रबन्धक पद हो, त्यसैले यो उत्तर होइन। ✗"}, {"n": "285", "q": "사람을 부를 때 사용하는 이름이나 직위입니다. 예를 들어, 선생님, 사장님, 아버지, 친구 등이 이에 해당하고 상대방의 나이, 직위, 관계에 따라 달라집니다.", "options": ["동료", "후배", "호칭", "친척"], "answer": 2, "explain": "प्रश्नको अर्थ: मानिसलाई सम्बोधन गर्न प्रयोग गरिने नाम वा पद हो।\n① 동료 भनेको सहकर्मी हो, त्यसैले यो उत्तर होइन। ✗\n② 후배 भनेको जुनियर व्यक्ति हो, त्यसैले यो उत्तर होइन। ✗\n③ 호칭 भनेको मानिसलाई बोलाउँदा प्रयोग गरिने सम्बोधन वा पद हो ✓\n④ 친척 भनेको नातागोता वा आफन्त हो, त्यसैले यो उत्तर होइन। ✗"}, {"n": "286", "q": "회사나 기관 내에 마련된 식사 공간으로, 직원들이 점심이나 저녁을 먹을 수 있는 곳입니다. 보통 회사의 업무 시간에 맞춰 운영되며, 직원들에게 저렴하고 편리한 식사를 제공합니다.", "options": ["학식당", "고깃집", "뷔페식당", "구내식당"], "answer": 3, "explain": "प्रश्नको अर्थ: कम्पनीभित्रै कर्मचारीहरूका लागि खाना खाने ठाउँको व्यवस्था गरिएको हुन्छ।\n① 학식당 भनेको विद्यालय वा विश्वविद्यालयको क्यान्टिन हो, त्यसैले यो उत्तर होइन। ✗\n② 고깃집 भनेको मासु पाइने रेस्टुरेन्ट हो, त्यसैले यो उत्तर होइन। ✗\n③ 뷔페식당 भनेको बुफे रेस्टुरेन्ट हो, त्यसैले यो उत्तर होइन। ✗\n④ 구내식당 भनेको कम्पनी वा संस्था भित्र कर्मचारीहरूका लागि खोलिएको क्यान्टिन हो ✓"}, {"n": "287", "q": "건물 안에서 방을 다른 방과 연결하는 통로입니다. 사람들이 이동할 수 있도록 되어 있으며, 주로 여러 개의 방이 있는 건물에서 볼 수 있습니다.", "options": ["거실", "복도", "주방", "난간"], "answer": 1, "explain": "प्रश्नको अर्थ: भवनभित्र कोठाहरूलाई जोड्ने बाटो वा करिडोर हो।\n① 거실 भनेको बैठक कोठा हो, त्यसैले यो उत्तर होइन। ✗\n② 복도 भनेको भवन भित्रका कोठाहरू जोड्ने बरण्डा वा गल्ली (कोरिडोर) हो ✓\n③ 주방 भनेको भान्छा कोठा हो, त्यसैले यो उत्तर होइन। ✗\n④ 난간 भनेको बाटो वा कौसीको घेरा (रेलिङ) हो, त्यसैले यो उत्तर होइन। ✗"}, {"n": "288", "q": "건물의 층을 위층과 연결하는 구조물로, 사람들이 올라가거나 내려갈 수 있도록 만든 시설입니다.", "options": ["침실", "바닥", "계단", "마루"], "answer": 2, "explain": "प्रश्नको अर्थ: माथिल्लो तलामा आवतजावत गर्न मानिसहरू हिँड्ने संरचना हो।\n① 침실 भनेको सुत्ने कोठा हो, त्यसैले यो उत्तर होइन। ✗\n② 바닥 भनेको कोठाको भुइँ हो, त्यसैले यो उत्तर होइन। ✗\n③ 계단 भनेको भवनका तलाहरूमा उक्लिन वा ओर्लिन बनाइएको भर्‍याङ हो ✓\n④ 마루 भनेको काठको भुइँ हो, त्यसैले यो उत्तर होइन। ✗"}, {"n": "289", "q": "주문 받은 물품이나 생산된 농산물 등을 약속된 날짜에 거래처로 가져다주는 일입니다.", "options": ["적재", "포장", "반품", "납품"], "answer": 3, "explain": "प्रश्नको अर्थ: अर्डर गरिएका सामानहरू तोकिएको मितिमा ग्राहककहाँ पुर्‍याउने काम हो।\n① 적재 भनेको सामान गाडीमा लोड गर्ने काम हो, त्यसैले यो उत्तर होइन। ✗\n② 포장 भनेको सामान प्याक गर्ने काम हो, त्यसैले यो उत्तर होइन। ✗\n③ 반품 भनेको किनेको सामान फिर्ता पठाउने काम हो, त्यसैले यो उत्तर होइन। ✗\n④ 납품 भनेको अर्डर गरिएको सामान वा उत्पादन ग्राहक वा कम्पनीलाई बुझाउने काम हो ✓"}, {"n": "290", "q": "건물이나 방에 들어가거나 나갈 수 있도록 만들어진 문입니다. 주로 사람들이 출입할 수 있도록 열리고 닫히며, 안전을 위해 잠금장치나 자물쇠가 달려있기도 합니다.", "options": ["출입문", "조리실", "고정문", "폐문"], "answer": 0, "explain": "प्रश्नको अर्थ: यो प्रश्नले भवन वा कोठामा आवतजावत गर्न बनाइएको बाटो वा ढोकाको बारेमा बताउँछ।\n① 출입문 भनेको आवतजावत गर्ने ढोका हो, जसले भवन वा कोठामा छिर्न र निस्कन सघाउँछ ✓\n② 조리실 भनेको खाना पकाउने कोठा हो ✗\n③ 고정문 भनेको नखुल्ने वा स्थिर ढोका हो ✗\n④ 폐문 भनेको बन्द गरिएको ढोका हो, त्यसैले यो पनि मिल्दैन। ✗"}, {"n": "291", "q": "건물이나 시설을 관리하고 유지보수하는 사람을 말합니다. 주로 건물의 청소, 수리, 안전 점검 등을 담당하며, 입주자들의 편의를 돕는 역할을 합니다.", "options": ["직장인", "관리인", "승무원", "공무원"], "answer": 1, "explain": "प्रश्नको अर्थ: यो प्रश्नले कुनै भवन वा ठाउँको सरसफाई, मर्मत र रेखदेख गर्ने जिम्मा लिएको मानिसलाई जनाउँछ।\n① 직장인 भनेको कम्पनी वा कार्यालयमा काम गर्ने कर्मचारी हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 관리인 भनेको भवन वा सुविधाको रेखदेख र सरसफाइ गर्ने हेरचाहकर्ता (केयरटेकर) हो ✓\ const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-06';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Renders the explanation as a structured list: the explanation string is
// lines separated by "\n" — first line is the question's own meaning
// ("प्रश्नको अर्थ: ..."), then one line per option ("① <word> ... ✓/✗").
// Lines render as separate rows; the ✓ line gets a green tint and the ✓/✗
// marker is coloured. Explanations without line breaks (fallback prose)
// render as a single paragraph, exactly as before. Uses text nodes only,
// never innerHTML, so explanation text is never parsed as markup.
function renderExplain(box, explain) {
  const lines = (explain || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length <= 1) {
    const b = document.createElement('b');
    b.textContent = 'किन? ';
    box.appendChild(b);
    const s = document.createElement('span');
    s.textContent = explain;
    box.appendChild(s);
    return;
  }
  const label = document.createElement('div');
  label.className = 'explain-label';
  label.textContent = 'व्याख्या';
  box.appendChild(label);
  lines.forEach((ln, li) => {
    const d = document.createElement('div');
    if (li === 0 && ln.indexOf('प्रश्नको अर्थ') === 0) {
      d.className = 'explain-stem';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    if (ln.indexOf('शिक्षकको उत्तर-पत्र:') === 0) {
      d.className = 'exp-note';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    const mark = ln.endsWith('✓') ? '✓' : (ln.endsWith('✗') ? '✗' : '');
    const body = mark ? ln.slice(0, -1).trim() : ln;
    d.className = 'exp-line' + (mark === '✓' ? ' exp-ok' : '');
    d.appendChild(document.createTextNode(body + (mark ? ' ' : '')));
    if (mark) {
      const m = document.createElement('span');
      m.className = 'exp-mark ' + (mark === '✓' ? 'ok' : 'no');
      m.textContent = mark;
      d.appendChild(m);
    }
    box.appendChild(d);
  });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    renderExplain(card.querySelector('.explain'), q.explain);
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
