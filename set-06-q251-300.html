<style>
  :root {

  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); color: #d6c9ff; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,.12); margin-bottom: 14px; transition: all .15s; }
  .back-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  header { background: #312e81; color: #fff; padding: 20px 16px 16px; position: relative; border-bottom: 1px solid rgba(255,255,255,.1); box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }

  .progress-wrap { margin-top: 14px; background: rgba(0,0,0,.35); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #fde68a, #f472b6, #22d3ee); width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(244,114,182,.7); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { position: relative; background: linear-gradient(180deg, #1d1d30, #171725); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; background: #8b5cf6; border-radius: 0 0 6px 6px; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: rgba(167,139,250,.55); }
  .q-card.answered::after { content: "✓"; position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: #059669; color: #fff; font-weight: 800; font-size: .95rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .q-num { display: inline-block; font-size: .92rem; font-weight: 800; color: #fff; background: var(--grad); padding: 7px 18px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(219,39,119,.45); }
  .q-text { font-size: 1.16rem; white-space: pre-line; margin: 14px 0 18px; line-height: 1.85; font-weight: 500; color: #f2f1fa; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 16px 18px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid rgba(255,255,255,.09); border-radius: 14px; margin-bottom: 0; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #1e1e30; color: #f2f1fa; }
  .options label:hover { border-color: #8b5cf6; background: #232338; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(124,58,237,.3); }
  .options label::before { content: ""; flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid #7c7ca0; background: transparent; transition: all .15s; }
  .options label.selected { background: var(--grad-soft); border-color: #a78bfa; box-shadow: 0 4px 18px rgba(124,58,237,.4); }
  .options label.selected::before { border-color: #a78bfa; background: #a78bfa; box-shadow: inset 0 0 0 4px #1e1e30; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #f472b6; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }

  .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 4px 18px rgba(219,39,119,.45); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 8px 24px rgba(219,39,119,.5); }
  .btn-primary:disabled { background: #2a2a3d; color: #77778e; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: rgba(255,255,255,.06); color: #d6c9ff; border: 2px solid rgba(255,255,255,.12); }
  .btn-ghost:hover { border-color: #8b5cf6; background: rgba(124,58,237,.2); }
  .submit-bar { position: sticky; bottom: 0; background: rgba(11,11,22,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 24px rgba(0,0,0,.5); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: linear-gradient(135deg, #1e1b3a, #2a1230); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; line-height: 1.05; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .score-card .pct { font-size: 1.15rem; color: #c9c6e0; margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: #e6e4f5; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 2px 12px rgba(219,39,119,.4); }
  .review-card { background: linear-gradient(180deg, #1d1d30, #171725); border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }

  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: linear-gradient(135deg, #059669, #34d399); }
  .verdict.no { background: linear-gradient(135deg, #e11d48, #fb7185); }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; background: #1e1e30; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #12101f; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; color: #d9d7ea; }
  .explain b { color: #d6c9ff; }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; }

  .exp-line { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.07); line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: #34d399; }
  .exp-mark.no { color: #fb7185; }
  .exp-note { background: linear-gradient(135deg, rgba(245,158,11,.16), rgba(245,158,11,.08)); border: 1px solid rgba(245,158,11,.4); border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; color: #fde9c8; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }

  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }

</style>

<script>
const QUESTIONS = [{"n": "251", "q": "본래 있어야 할 물질과 다른 물질이 섞여 있는 상태를 말합니다. 주로 원하지 않거나 불필요한 물질을 지칭합니다.", "options": ["재질", "수물질", "이물질", "화학물질"], "answer": 2, "explain": "① 재질 भनेको सामानको किसिम वा गुण हो, त्यसैले यो बाहिरबाट मिसिने नचाहिने वस्तु होइन। ✗\n② 수물질 भनेको पानीजन्य वा असम्बन्धित शब्द हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 이물질 भनेको नचाहिने बाहिरी पदार्थ हो, जसले सक्कली वस्तुमा अर्कै नचाहिने चीज मिसिएको अवस्थालाई बुझाउँछ। ✓\n④ 화학물질 भनेको रासायनिक पदार्थ हो, त्यसैले यो नचाहिने तत्त्व मिसिएको विवरणसँग मिल्दैन। दोस्रो विकल्प '수물질' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "252", "q": "실내의 탁한 공기를 밖으로 내보내고 신선한 공기를 들여오는 기계 장치입니다. 욕실, 주방, 공장 등에서 공기 순환과 환기를 위해 사용됩니다.", "options": ["환풍기", "선풍기", "에어컨", "온돌"], "answer": 0, "explain": "① 환풍기 भनेको कोठाको फोहोर हावा बाहिर फालेर ताजा हावा भित्र ल्याउने भेन्टिलेटर वा एक्जस्ट फ्यान हो ✓\n② 선풍기 भनेको पङ्खा (बिजुलीको पंखा) हो ✗\n③ 에어컨 भनेको एयर कन्डिसनर हो ✗\n④ 온돌 भनेको कोरियाली तातो भुइँ प्रणाली हो ✗"}, {"n": "253", "q": "회전하는 절삭공구에 가공물을 이송하여 원하는 형상으로 가공하는 공작 기계로 특히 가공물을 절단하고 깎을 때 사용합니다.", "options": ["선반 기계", "밀링 기계", "용접 기계", "프레스 기계"], "answer": 1, "explain": "① 선반 기계 भनेको लेथ मेसिन हो जसले धातु वा काठलाई घुमाएर काट्छ ✗\n② 밀링 기계 भनेको घुम्ने कटरको माध्यमबाट वर्कपिसलाई काटेर, कुँदेर वा सेप दिने मिलिङ मेसिन हो ✓\n③ 용접 기계 भनेको वेल्डिङ मेसिन हो ✗\n④ 프레스 기계 भनेको प्रेस मेसिन हो ✗"}, {"n": "254", "q": "금속, 나무, 돌 따위를 회전시켜서 갈거나 파내거나 도려내는 데 쓰는 공작 기계입니다.", "options": ["밀링 기계", "밴딩 기계", "선반 기계", "용접 기계"], "answer": 2, "explain": "① 밀링 기계 भनेको मिलिङ मेसिन हो ✗\n② 밴딩 기계 भनेको बेन्डिङ मेसिन हो ✗\n③ 선반 기계 भनेको धातु, काठ वा ढुङ्गालाई घुमाएर छिलेर, खोपेर वा काटेर आकार निकाल्ने लेथ मेसिन हो ✓\n④ 용접 기계 भनेको वेल्डिङ मेसिन हो ✗"}, {"n": "255", "q": "두 개 이상의 금속 물체나 재료를 열로 녹여서 접합시키는 기계입니다.", "options": ["밀링 기계", "용접 기계", "선반 기계", "프레스 기계"], "answer": 1, "explain": "① 밀링 기계 भनेको मिलिङ मेसिन हो ✗\n② 용접 기계 भनेको दुई वा दुईभन्दा बढी धातुका वस्तु वा सामग्रीहरूलाई तापको सहायताले पगालेर जोड्ने वेल्डिङ मेसिन हो ✓\n③ 선반 기계 भनेको लेथ मेसिन हो ✗\n④ 프레스 기계 भनेको प्रेस मेसिन हो ✗"}, {"n": "256", "q": "붙이는 작업을 할 때 아주 뜨거운 불꽃이 튈 수 있어서 다치지 않도록 조심해서 일해야 하는 기계입니다.", "options": ["선반기계", "프레스기계", "밀링기계", "전기용접기"], "answer": 3, "explain": "① 선반기계 भनेको धातुलाई घुमाएर काट्ने मेसिन हो ✗\n② 프레스기계 भनेको धातुमा दबाब दिने मेसिन हो ✗\n③ 밀링기계 भनेको मिलिङ गर्ने मेसिन हो ✗\n④ 전기용접기 भनेको बिजुलीको आगोले धातु जोड्ने मेसिन हो जसमा आगोको फुल्लिङ उड्न सक्छ ✓"}, {"n": "257", "q": "금속이나 기타 재료에 큰 압력을 가해 절단, 성형, 구멍 뚫기 등의 작업을 수행하는 산업용 기계입니다.", "options": ["선반기계", "프레스기계", "밀링기계", "전기용접기"], "answer": 1, "explain": "१. 프레스기계 भनेको धातु वा अन्य सामग्रीमा ठूलो दबाब दिएर काट्ने, आकार दिने वा प्वाल पार्ने काम गर्ने औद्योगिक मेसिन हो, त्यसैले यो सही उत्तर हो। २. 선반기계 भनेको लाथ मेसिन हो, त्यसैले यो मिल्दैन। ३. 밀링기계 भनेको मिलिङ मेसिन हो, त्यसैले यो मिल्दैन। ४. 전기용접기 भनेको विद्युतीय वेल्डिङ गर्ने मेसिन हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको २ नम्बरको 프레스기계 (प्र्रेस मेसिन) हो।"}, {"n": "258", "q": "금속, 목재, 플라스틱 등의 재료에 구멍을 뚫기 위해 사용하는 기계입니다. 제조업이나 건설 현장에서 정확한 위치에 구멍을 뚫을 때 사용됩니다.", "options": ["에어컴프레서", "드릴링머신", "절단기", "전동커터기"], "answer": 1, "explain": "① 에어컴프레서 भनेको हावा कम्प्रेस गर्ने मेसिन हो ✗\n② 드릴링머신 भनेको धातु, काठ वा प्लास्टिक जस्ता सामग्रीहरूमा प्वाल पार्न प्रयोग गरिने मेसिन हो ✓\n③ 절단기 भनेको काट्ने मेसिन हो ✗\n④ 전동커터기 भनेको विद्युतीय कटर हो ✗"}, {"n": "259", "q": "전기를 동력으로 사용하여 금속, 나무, 플라스틱 등의 재료를 빠르고 정밀하게 절단하는 전동 공구입니다.", "options": ["가전제품", "에어컴프레서", "전동커터기", "전기용접기"], "answer": 2, "explain": "① 가전제품 भनेको घरायसी विद्युतीय उपकरण हो ✗\n② 에어컴프레서 भनेको हावा कम्प्रेस गर्ने मेसिन हो ✗\n③ 전동커터기 भनेको बिजुली प्रयोग गरेर धातु, काठ र प्लास्टिकलाई छिटो र सटिक रूपमा काट्ने विद्युतीय औजार हो ✓\n④ 전기용접기 भनेको वेल्डिङ गर्ने मेसिन हो ✗"}, {"n": "260", "q": "일상생활이나 작업 현장에서 사용하고 더 이상 필요하지 않게 된 물질을 말합니다.", "options": ["재활용품", "일회용품", "독성물질", "폐기물"], "answer": 3, "explain": "① 재활용품 भनेको पुन: प्रयोग गर्ने वस्तु हो ✗\n② 일회용품 भनेको एक पटक प्रयोग गर्ने वस्तु हो ✗\n③ 독성물질 भनेको विषालु पदार्थ हो ✗\n④ 폐기물 भनेको दैनिक जीवन वा काम गर्ने ठाउँमा प्रयोग भएर अब थप आवश्यक नभएको पदार्थ वा फोहरलाई जनाउँछ, त्यसैले यो सही उत्तर हो। किताबमा तेस्रो विकल्प '독석물질' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '독성물질' हो। ✓"}, {"n": "261", "q": "상품이나 서비스를 구매하여 사용하는 사람을 말합니다. 예를 들어 마트에서 물건을 사는 사람이나, 인터넷에서 서비스를 이용하는 사람 모두 이에 해당합니다.", "options": ["학생", "참가자", "소비자", "청년자"], "answer": 2, "explain": "① 학생 भनेको विद्यार्थी हो ✗\n② 참가자 भनेको सहभागी हो ✗\n③ 소비자 भनेको सामान वा सेवा खरिद गरेर प्रयोग गर्ने व्यक्ति हो ✓\n④ 청년자 भनेको युवा भन्ने अर्थ नभएको गलत शब्द हो, त्यसैले यो मिल्दैन। चौथो विकल्प '청년자' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "262", "q": "인터넷을 통해 다양한 사물이 서로 연결되어 정보를 주고받을 수 있는 기술입니다. 이를 통해 집, 자동차, 전자 기기 등을 스마트하게 관리할 수 있습니다.", "options": ["사물인터넷", "인터넷쇼핑", "인터넷 전화", "인터넷 광고"], "answer": 0, "explain": "① 사물인터넷 भनेको वस्तुहरूको इन्टरनेट प्रविधि हो, जसले सामानहरू आपसमा जोडिएर जानकारी आदानप्रदान गर्न र उपकरणहरूलाई स्मार्ट तरिकाले सञ्चालन गर्न मद्दत गर्छ। ✓\n② 인터넷쇼핑 भनेको इन्टरनेटबाट सामान किन्ने काम हो, त्यसैले यो उपकरणहरू जोड्ने प्रविधिसँग मिल्दैन। ✗\n③ 인터넷 전화 भनेको इन्टरनेट फोन हो, त्यसैले यो सम्पूर्ण सामान व्यवस्थापन गर्ने प्रविधिसँग मिल्दैन। ✗\n④ 인터넷 광고 भनेको इन्टरनेट विज्ञापन हो, त्यसैले यो विवरणसँग मेल खाँदैन। ✗"}, {"n": "263", "q": "개인의 취향이나 필요에 따라 특별히 맞춤 제작된 제품이나 서비스를 뜻합니다. 특히 가구나 가전제품은 사용자가 원하는 색상, 기능, 디자인 등을 선택해 자신만의 스타일로 구성할 수 있습니다.", "options": ["비스보크", "전자제품", "키오스크", "무인점"], "answer": 0, "explain": "① 비스보크 भनेको व्यक्तिको रुचि वा आवश्यकता अनुसार विशेष रूपमा बनाइएको उत्पादन वा सेवा हो ✓\n② 전자제품 भनेको इलेक्ट्रोनिक्स सामान हो ✗\n③ 키오스크 भनेको किओस्क (स्वयंसेवा मेसिन) हो ✗\n④ 무인점 भनेको मानिस नभएको पसल हो ✗"}, {"n": "264", "q": "여러 개의 부품이나 요소를 정해진 순서와 방식에 따라 결합하여 하나의 완성된 구조물이나 제품으로 만드는 과정입니다.", "options": ["조립", "접합", "용접", "계량, 재다"], "answer": 0, "explain": "① 조립 भनेको धेरै वटा पार्टपुर्जा वा तत्वहरूलाई तोकिएको क्रम र तरिका अनुसार जोडेर एउटा पूर्ण संरचना वा उत्पादन बनाउने प्रक्रिया हो ✓\n② 접합 भनेको जोड्ने काम हो ✗\n③ 용접 भनेको वेल्डिङ गर्ने काम हो ✗\n④ 계량, 재다 भनेको नाप्ने काम हो, त्यसैले यो मिल्दैन। चौथो विकल्प '계량, 재다' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "265", "q": "철선을 끊거나 구부릴 때 사용하는 두 개의 손잡이가 있는 작은 수공구입니다.", "options": ["망치", "스페너", "펜치", "바이스"], "answer": 2, "explain": "① 망치 भनेको हथौडा हो ✗\n② 스페너 भनेको स्प्यानर हो ✗\n③ 펜치 भनेको फलामको तार काट्न वा बांग्याउन प्रयोग गरिने दुई वटा ह्यान्डल भएको सानो हाते औजार हो ✓\n④ 바이스 भनेको भाइस (पकड्ने औजार) हो ✗"}, {"n": "266", "q": "전선이나 작은 부품을 자를 때 사용하는 절단용 수공구로 손잡이가 달린 집게 형태에 있습니다.", "options": ["망치", "니퍼", "펜치", "바이스"], "answer": 1, "explain": "① 망치 भनेको हथौडा हो ✗\n② 니퍼 भनेको तार वा साना पार्टपुर्जा काट्न प्रयोग गरिने काट्ने हाते औजार हो जुन ह्यान्डल भएको चिम्टीको आकारमा हुन्छ ✓\n③ 펜치 भनेको पिनर हो ✗\n④ 바이스 भनेको भाइस हो ✗"}, {"n": "267", "q": "너트와 볼트를 잡고 조이거나 풀 때 사용하는 특수 모양의 끝이 있는 금속 공구입니다.", "options": ["스패너", "니퍼", "바이스", "펜치"], "answer": 0, "explain": "① 스패너 भनेको नट र बोल्टलाई समातेर कस्न वा खोल्न प्रयोग गरिने विशेष आकारको मुख भएको धातुको औजार हो ✓\n② 니퍼 भनेको निप्पर हो ✗\n③ 바이스 भनेको भाइस हो ✗\n④ 펜치 भनेको पिनर हो ✗"}, {"n": "268", "q": "금속이나 전선을 잡아서 구부리거나 펼 때 사용하는 수공구입니다. 보통 집게처럼 생기며, 전기 작업이나 정비 작업에 자주 쓰입니다.", "options": ["바이스", "나사못", "멍키렌치", "플라이어"], "answer": 3, "explain": "① 바이스 भनेको भाइस हो ✗\n② 나사못 भनेको स्क्रू हो ✗\n③ 멍키렌치 भनेको मङ्की रेन्च हो ✗\n④ 플라이어 भनेको धातु वा तारलाई समातेर बांग्याउन वा फैलाउन प्रयोग गरिने हाते औजार हो ✓"}, {"n": "269", "q": "너트나 볼트 크기에 맞게 입 크기를 조절할 수 있는 렌치입니다. 다양한 크기의 부품을 하나의 도구로 조일 수 있어 매우 실용적입니다.", "options": ["바이스", "토크 렌치", "멍키렌치", "플라이어"], "answer": 2, "explain": "① 바이스 भनेको भाइस हो ✗\n② 토크 렌치 भनेको टर्क रेन्च हो ✗\n③ 멍키렌치 भनेको नट वा बोल्टको साइज अनुसार मुखको आकार समायोजन गर्न सकिने रेन्च हो ✓\n④ 플라이어 भनेको प्लायर्स हो ✗"}, {"n": "270", "q": "볼트나 너트를 정해진 힘으로 조일 때 사용하는 공구입니다. 길쭉한 손잡이에 눈금이나 디지털 표시가 있으며, 설정한 토크에 도달하면 '딸깍' 소리가 납니다.", "options": ["용접봉", "나사못", "유각 렌치", "토크 렌치"], "answer": 3, "explain": "① 용접봉 भनेको वेल्डिंग रड हो ✗\n② 나사못 भनेको स्क्रू हो ✗\n③ 유각 렌치 भनेको हेक्स रेन्च हो ✗\n④ 토크 렌치 भनेको बोल्ट वा नटलाई तोकिएको शक्ति (बल) ले कस्न प्रयोग गरिने औजार हो ✓"}, {"n": "271", "q": "볼트나 나사를 돌릴 때 사용하는 L 자 모양의 공구입니다. 작고 간단한 구조로 기계 조립이나 가구 조립에 자주 쓰입니다.", "options": ["전기 드릴", "판금 가위", "유각 렌치", "파이프 렌치"], "answer": 2, "explain": "① 전기 드릴 भनेको बिजुलीबाट चल्ने प्वाल पार्ने औजार हो, त्यसैले यो एल-आकारको औजार होइन। ✗\n② 판금 가위 भनेको पाता काट्ने कैँची हो, त्यसैले यो नट-बोल्ट घुमाउने औजार होइन। ✗\n③ 유각 렌치 भनेको एल-आकारको हेक्स रेन्च हो, जुन नट वा स्क्रू घुमाउन र फर्निचर वा मेसिन जोड्न प्रयोग गरिन्छ। ✓\n④ 파이프 렌치 भनेको पाइप समात्ने र घुमाउने रेन्च हो, त्यसैले यो एल-आकारको सानो औजार होइन। ✗"}, {"n": "272", "q": "점이 없는 나사 모양의 금속 물체로 너트를 사용하여 물건을 고정 시킵니다.", "options": ["볼트", "줄", "비트", "못"], "answer": 0, "explain": "① 볼트 भनेको टाउकोमा बिन्दु नभएको र नटसँग प्रयोग हुने धातुको वस्तु हो ✓\n② 줄 भनेको फाइल (घोट्ने औजार) हो ✗\n③ 비트 भनेको ड्रिलको बिट हो ✗\n④ 못 भनेको किला हो ✗"}, {"n": "273", "q": "머리에는 드라이버로 돌릴 수 있도록 홈이 나 있는 못입니다. 보통 목재나 얇은 금속류 등을 접합시킬 때 사용합니다.", "options": ["용접봉", "나사못", "절곡기", "바이스"], "answer": 1, "explain": "① 용접봉 भनेको वेल्डिंग रड हो ✗\n② 나사못 भनेको स्क्रू नट (स्लाट भएको काठ वा धातुमा कस्ने किला) हो ✓\n③ 절곡기 भनेको पाता वा पाना झुकाउने मेसिन हो ✗\n④ 바이스 भनेको भाइस (पकड्ने औजार) हो ✗"}, {"n": "274", "q": "볼트와 함께 사용되어 부품을 단단히 고정하는 데 쓰입니다. 보통 금속으로 된 육각형 모양이며, 내부에 나사산이 있습니다.", "options": ["토치", "너트", "볼트", "리머"], "answer": 1, "explain": "① 토치 भनेको टर्च (वेल्डिंग वा तताउने औजार) हो ✗\n② 너트 भनेको बोल्टसँग प्रयोग हुने छकुने भाग भएको नट हो ✓\n③ 볼트 भनेको बोल्ट हो ✗\n④ 리머 भनेको प्वाल सफा गर्ने वा बढाउने औजार रीमर हो ✗"}, {"n": "275", "q": "나사를 조이거나 풀 때 사용하는 수공구입니다. 끝의 모양은 평평하고 마이너스 기호처럼 생기며, 손잡이가 달려 있습니다.", "options": ["일자 드라이버", "십자 드라이버", "금긋기 바늘", "전자 저울"], "answer": 0, "explain": "① 일자 드라이버 भनेको माइनस (-) चिन्ह जस्तो चप्टो मुख भएको स्क्रू ड्राइभर हो ✓\n② 십자 드라이버 भनेको प्लस (+) चिन्ह जस्तो मुख भएको स्क्रू ड्राइभर हो ✗\n③ 금긋기 바늘 भनेको रेखा कोर्ने सुई हो ✗\n④ 전자 저울 भनेको इलेक्ट्रोनिक तराजु हो ✗"}, {"n": "276", "q": "나사를 조이거나 풀 때 사용하는 공구입니다. 끝이 +자 형태이며, 손잡이가 달린 막대 모양입니다.", "options": ["일자 드라이버", "십자 드라이버", "배식대", "방청지"], "answer": 1, "explain": "① 일자 드라이버 भनेको माइनस मुख भएको स्क्रू ड्राइभर हो ✗\n② 십자 드라이버 भनेको प्लस (+) आकारको मुख भएको स्क्रू ड्राइभर हो ✓\n③ 배식대 भनेको खाना वितरण गर्ने टेबल हो ✗\n④ 방청지 भनेको खिया लाग्नबाट बचाउने कागज हो ✗"}, {"n": "277", "q": "회전하는 부품이 매끄럽게 움직이도록 도와주는 부품입니다. 보통 둥근 링 안에 작은 강철 볼이 들어 있는 원형 모양입니다.", "options": ["바이스", "베어링", "수준기", "플라이어"], "answer": 1, "explain": "① 바이스 भनेको च्याप्प समात्ने भाइस औजार हो ✗\n② 베어링 भनेको घुम्ने भागहरू सहजै चल्न मद्दत गर्ने बियरिङ हो ✓\n③ 수준기 भनेको स्पिरिट लेभल (तेर्सो जाँच्ने औजार) हो ✗\n④ 플라이어 भनेको प्लायर्स हो ✗"}, {"n": "278", "q": "회전력을 전달하거나 속도와 방향을 조절할 때 사용하는 부품입니다. 테두리에 톱니가 있는 둥근 모양입니다.", "options": ["줄", "톱", "기어", "축"], "answer": 2, "explain": "① 줄 भनेको फाइल (घोट्ने औजार) हो ✗\n② 톱 भनेको आरा हो ✗\n③ 기어 भनेको दाँत भएको गोलो आकारको गिअर हो जसले शक्ति र गति सार्छ ✓\n④ 축 भनेको अक्ष (साफ्ट) हो ✗"}, {"n": "279", "q": "충격을 줄이거나 힘을 저장하는 데 쓰는 나선 모양으로 감긴 탄성 있는 금속입니다.", "options": ["접시 저울", "일자 드라이버", "코일 스프링", "유각 렌치"], "answer": 2, "explain": "① 접시 저울 भनेको थाल भएको तराजु हो, त्यसैले यो लचकदार घुमाउरो धातु होइन। ✗\n② 일자 드라이버 भनेको माइनस पेचकस हो, त्यसैले यो धक्का सोस्ने स्प्रिङ होइन। ✗\n③ 코일 스프링 भनेको घुमाउरो बेरिएको स्प्रिङ हो, जसले धक्का कम गर्न र शक्ति सञ्चय गर्न काम गर्छ। ✓\n④ 유각 렌치 भनेको एल-आकारको रेन्च हो, त्यसैले यो स्प्रिङसँग मिल्दैन। ✗"}, {"n": "280", "q": "기계 부품을 안전하고 쉽게 빼낼 때 사용하는 도구로, 유압의 힘을 이용해 베어링이나 기어 등을 분해합니다. 세 개의 갈고리와 손잡이 레버가 달려 있어 작동이 간편합니다.", "options": ["기어", "너트", "볼트", "풀러"], "answer": 3, "explain": "① 기어 भनेको गिअर हो ✗\n② 너트 भनेको नट हो ✗\n③ 볼트 भनेको बोल्ट हो ✗\n④ 풀러 भनेको बियरिङ वा गिअर सजिलै झिक्ने पुलर औजार हो ✓"}, {"n": "281", "q": "바닥이나 물건이 평평한지 또는 곧은지 보는 도구입니다. 안에 있는 작은 물방울이 가운데에 오면 수평이나 수직이 맞습니다.", "options": ["바이스", "베어링", "나사못", "수준기"], "answer": 3, "explain": "① 바이스 भनेको भाइस हो ✗\n② 베어링 भनेको बियरिङ हो ✗\n③ 나사못 भनेको स्क्रू हो ✗\n④ 수준기 भनेको सतह मिलेको नमिलेको जाँच्ने स्पिरिट लेभल हो ✓"}, {"n": "282", "q": "쇠붙이(철)를 끌어당기는 도구입니다. 이것을 가까이 대면 못이나 클립 같은 쇠가 붙습니다.", "options": ["펜치", "망치", "자석", "자재"], "answer": 2, "explain": "① 펜치 भनेको चिम्टा वा प्लायर्स हो ✗\n② 망치 भनेको हथौडा हो ✗\n③ 자석 भनेको फलाम तान्ने चुम्बक हो ✓\n④ 자재 भनेको निर्माण सामग्री हो ✗"}, {"n": "283", "q": "물체가 돌 때 중심이 되는 선이나 막대입니다. 바퀴나 선풍기처럼 도는 물건은 이것을 중심으로 돕니다.", "options": ["축", "줄", "톱", "칼"], "answer": 0, "explain": "① 축 भनेको कुनै वस्तु घुम्दा केन्द्र हुने अक्ष वा साफ्ट हो ✓\n② 줄 भनेको फाइल हो ✗\n③ 톱 भनेको आरा हो ✗\n④ 칼 भनेको चक्कु हो ✗"}, {"n": "284", "q": "환경을 덜 오염시키는 자동차로 보통 전기차, 수소차, 하 이브리드차가 있습니다. 매연이 적거나 없어서 공기를 깨끗하게 합니다.", "options": ["친환경 자동차", "친환경 에너지", "친환경 건물", "친환경 농업"], "answer": 0, "explain": "① 친환경 자동차 भनेको वातावरणमैत्री गाडी (विद्युतीय वा हाइड्रोजन गाडी) हो ✓\n② 친환경 에너지 भनेको वातावरणमैत्री ऊर्जा हो ✗\n③ 친환경 건물 भनेको वातावरणमैत्री भवन हो ✗\n④ 친환경 농업 भनेको वातावरणमैत्री कृषि हो ✗"}, {"n": "285", "q": "쇠, 철 따위를 자르거나, 깎거나, 모양을 바꾸는 일을 의미하며 이렇게 해서 기계 부품이나 물건을 만듭니다.", "options": ["금속 염색", "금속 가공", "금속 판매", "금속 채굴"], "answer": 1, "explain": "① 금속 염색 भनेको धातु रङ्गाउने काम हो ✗\n② 금속 가공 भनेको धातुलाई काटेर, कुटेर वा आकार दिएर वस्तु बनाउने मेटल प्रोसेसिङ (धातु प्रशोधन) हो ✓\n③ 금속 판매 भनेको धातु बिक्री गर्ने काम हो ✗\n④ 금속 채굴 भनेको धातु खानीबाट निकाल्ने काम हो ✗"}, {"n": "286", "q": "무언가를 두드리거나 박을 때 쓰는 도구로 보통 손잡이가 있고, 끝에 무거운 쇠 부분이 있습니다.", "options": ["펜치", "드릴", "망치", "볼트"], "answer": 2, "explain": "① 펜치 (पेन्च) हो, यो तार काट्न वा समात्न प्रयोग गरिन्छ तर यसमा हत्था र भारी फलामको भाग हुँदैन ✗\n② 드릴 (ड्रिल) हो, यो प्वाल पार्ने औजार हो ✗\n③ 망치 (हथौडा) हो, यो कुनै वस्तु ठोक्न वा गाड्न प्रयोग गरिने हत्था भएको र छेउमा भारी फलामको भाग भएको औजार हो ✓\n④ 볼트 (बोल्ट) हो, यो कस्ने वस्तु हो ✗"}, {"n": "287", "q": "금속이나 나무 등을 갈아서 모양을 다듬는 도구인데 작고 거친 날이 있어서 표면을 매끄럽게 만들거나 깎을 때 씁니다.", "options": ["칼", "축", "줄", "톱"], "answer": 2, "explain": "① 칼 भनेको चाकु हो, यसले काट्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 축 भनेको धुरी हो, यसले घुम्ने भागलाई अड्याउँछ त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 줄 भनेको रेती हो, यसले धातु वा काठलाई घसेर चिल्लो बनाउने वा आकार मिलाउने औजार भएकाले यो विवरणसँग एकदम मिल्छ। ✓\n④ 톱 भनेको करौँती हो, यसले काठ वा धातु काट्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "288", "q": "돌이나 쇠를 깎거나 깨뜨릴 때 쓰는 뾰족한 쇠 도구입니다. 보통 망치로 정을 쳐서 금속이나 돌을 자르거나 구멍을 낼 때 사용해요.", "options": ["축", "톱", "못", "정"], "answer": 3, "explain": "① 축 (अक्स) हो, यो मिल्दैन। ✗\n② 톱 (आरा) हो, यो काठ काट्ने औजार हो ✗\n③ 못 (किला) हो, यो ठोक्ने वस्तु हो ✗\n④ 정 (छिनो) हो, यो ढुङ्गा वा फलाम काट्न वा फुटाउन प्रयोग हुने तिखो फलामको औजार हो जसलाई हथौडाले हानेर प्रयोग गरिन्छ ✓"}, {"n": "289", "q": "구멍을 넓히거나 매끄럽게 다듬는 도구로 보통 기계 부품에 뚫린 구멍을 정확한 크기와 모양으로 정리할 때 사용합니다.", "options": ["쇠톱", "너트", "니퍼", "리머"], "answer": 3, "explain": "① 쇠톱 (ह्याकस’) हो, यो फलाम काट्ने आरा हो ✗\n② 너트 (नट) हो, यो बोल्टसँग कस्ने वस्तु हो ✗\n③ 니퍼 (निप्पर) हो, यो तार काट्ने चिम्टाजस्तो औजार हो ✗\n④ 리머 (रीमर) हो, यो प्वाललाई फराकिलो वा चिल्लो पार्न मेसिनको भागमा प्रयोग गरिने औजार हो ✓"}, {"n": "290", "q": "함께 움직일 수 있는 두 개의 금속 블록이 있는 공구, 작업이 완료되는 동안 물건을 단단히 고정할 때 사용됩니다.", "options": ["바이스", "망치", "쇠지래", "괭이"], "answer": 0, "explain": "① 바이스 (भाइस) हो, यो सँगै चल्न सक्ने दुईवटा फलामको ब्लक हुने र काम गर्ने बेला वस्तुलाई दह्रोसँग च्यापेर राख्ने औजार हो ✓\n② 망치 (हथौडा) हो, यो ठोक्ने औजार हो ✗\n③ 쇠지래 (फलामको लिभर) हो, यो उचाल्ने वा भत्काउने औजार हो ✗\n④ 괭이 (कुटो) हो, यो खन्ने कृषियन्त्र हो त्यसैले यो मिल्दैन। तेस्रो विकल्प '쇠지래' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "291", "q": "두꺼운 금속판을 자를 때 사용하는 특수한 가위입니다. 강한 날카로운 칼날로 금속을 정확하게 자를 수 있습니다.", "options": ["용접봉", "유각 렌치", "전기 절단기", "판금 가위"], "answer": 3, "explain": "① 용접봉 (वेल्डिंग रड) हो, यो वेल्डिंग गर्दा प्रयोग हुने छड हो ✗\n② 유각 렌치 (हेक्स रेन्च) हो, यो बोल्ट कस्ने औजार हो ✗\n③ 전기 절단기 (विद्युतीय काट्ने मेसिन) हो, यो समग्रमा काट्ने मेसिन हो ✗\n④ 판금 가위 (पाना काट्ने काइँची/मेटल शियर) हो, यो बाक्लो फलामको पट्टा वा पाना काट्न प्रयोग हुने धारिलो विशेष किसिमको काइँची हो ✓"}, {"n": "292", "q": "나무나 금속 재료를 일정한 사이즈나 두께의 조각으로 자르는 장치입니다.", "options": ["밴딩기", "절단기", "용접기", "정수기"], "answer": 1, "explain": "① 밴딩기 (बेन्डिङ मेसिन) हो, यो बेन्ड गर्ने मेसिन हो ✗\n② 절단기 (कटर/काट्ने मेसिन) हो, यो काठ वा धातुका सामाग्रीलाई निश्चित साइ const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-06';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Renders the explanation as a structured list: the explanation string is
// lines separated by "\n" — first line is the question's own meaning
// ("प्रश्नको अर्थ: ..."), then one line per option ("① <word> ... ✓/✗").
// Lines render as separate rows; the ✓ line gets a green tint and the ✓/✗
// marker is coloured. Explanations without line breaks (fallback prose)
// render as a single paragraph, exactly as before. Uses text nodes only,
// never innerHTML, so explanation text is never parsed as markup.
function renderExplain(box, explain) {
  const lines = (explain || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length <= 1) {
    const b = document.createElement('b');
    b.textContent = 'किन? ';
    box.appendChild(b);
    const s = document.createElement('span');
    s.textContent = explain;
    box.appendChild(s);
    return;
  }
  const label = document.createElement('div');
  label.className = 'explain-label';
  label.textContent = 'व्याख्या';
  box.appendChild(label);
  lines.forEach((ln, li) => {
    const d = document.createElement('div');
    if (li === 0 && ln.indexOf('प्रश्नको अर्थ') === 0) {
      d.className = 'explain-stem';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    if (ln.indexOf('शिक्षकको उत्तर-पत्र:') === 0) {
      d.className = 'exp-note';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    const mark = ln.endsWith('✓') ? '✓' : (ln.endsWith('✗') ? '✗' : '');
    const body = mark ? ln.slice(0, -1).trim() : ln;
    d.className = 'exp-line' + (mark === '✓' ? ' exp-ok' : '');
    d.appendChild(document.createTextNode(body + (mark ? ' ' : '')));
    if (mark) {
      const m = document.createElement('span');
      m.className = 'exp-mark ' + (mark === '✓' ? 'ok' : 'no');
      m.textContent = mark;
      d.appendChild(m);
    }
    box.appendChild(d);
  });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    renderExplain(card.querySelector('.explain'), q.explain);
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
