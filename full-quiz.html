नासको मिश्रण बनाउन प्रयोग गरिन्छ त्यसैले यो सही उत्तर हो। अन्त्यमा, सही उत्तर 혼합기 हो जसको अर्थ मिश्रण गर्ने मेसिन हुन्छ।"}, {"n": "301", "q": "물체의 길이나 높이 등을 재는 도구로, 띠 모양의 눈금이 있는 유연한 재질로 만들어져 있고 건축, 재봉, 일상 생활 등 다양한 곳에서 사용합니다.", "options": ["자", "줄자", "저울", "캘리퍼스"], "answer": 1, "explain": "पहिलो विकल्प 자 (फिता वा स्केल) हो, जुन छोटो लम्बाइ नाप्न प्रयोग गरिन्छ तर लचिलो फिताको रूपमा हुँदैन। दोस्रो विकल्प 줄자 (जुल्जा) हो, जुन लम्बाइ वा उचाइ नाप्ने फिता आकारको लचिलो औजार हो र यसलाई निर्माण, वास्तुकला र दैनिक जीवनमा प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 저울 (तराजु) हो, जसले तौल नाप्छ। चौथो विकल्प 캘리퍼스 (क्यालिपर्स) हो, जसले वस्तुको सूक्ष्म आकार नाप्छ। सही उत्तर विकल्प २ (줄자) हो।"}, {"n": "302", "q": "물체의 안지름, 바깥지름, 깊이 등을 정밀하게 재는 측정 도구이다. 주로 과학 실험이나 공학 분야에서 사용되며, 눈금이 정밀하게 나뉘어 있어 작은 단위까지 측정할 수 있다.", "options": ["줄자", "전자 저울", "접시 저울", "버니어 캘리퍼스"], "answer": 3, "explain": "1. 줄자 भनेको नाप्ने फिता हो, यसले लम्बाइ नाप्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। 2. 전자 저울 भनेको डिजिटल तराजु हो, यसले तौल नाप्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। 3. 접시 저울 भनेको थाली तराजु हो, यसले पनि सामानको तौल नाप्छ त्यसैले यो विवरणसँग मिल्दैन। 4. 버니어 캘리퍼스 भनेको भर्नियर क्यालिपर हो, यसले वस्तुको भित्री व्यास, बाहिरी व्यास र गहिराइ सूक्ष्म रूपमा नाप्ने भएकाले यो विवरणसँग एकदम मिल्छ। त्यसैले सही उत्तर 4 नम्बरको 버니어 캘리퍼스 हो, जसको अर्थ भर्नियर क्यालिपर हुन्छ।"}, {"n": "303", "q": "환경을 오염시키지 않고 자연에서 얻을 수 있는 에너지입니다. 태양광, 풍력, 수력, 지열 등이 있으며, 탄소 배출이 적어 지구를 보호하는 데 도움이 됩니다.", "options": ["친환경 자동차", "친환경 에너지", "친환경 건물", "친환경 농업"], "answer": 1, "explain": "पहिलो विकल्प 친환경 자동차 (वातावरणमैत्री गाडी) हो, जुन सवारी साधन हो। दोस्रो विकल्प 친환경 에너지 (वातावरणमैत्री ऊर्जा) हो, जुन प्रकृतिबाट प्राप्त हुने, प्रदूषण नगर्ने र कार्बन उत्सर्जन कम गर्ने ऊर्जा हो, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 친환경 건물 (वातावरणमैत्री भवन) हो, जुन भवनसँग सम्बन्धित छ। चौथो विकल्प 친환경 농업 (वातावरणमैत्री कृषि) हो, जुन खेतीकिसानीसँग सम्बन्धित छ। सही उत्तर विकल्प २ (친환경 에너지) हो।"}, {"n": "304", "q": "오랜 시간에 걸쳐 지구의 평균 기온이나 강수량 등이 변하는 현상입니다. 주로 인간의 활동으로 인한 온실가스 증가가 원인이며, 이상기후, 해수면 상승 등을 일으킵니다.", "options": ["기후 변화", "환경 파괴", "지구 온난화", "친환경 정책"], "answer": 0, "explain": "'기후 변화' भनेको जलवायु परिवर्तन हो। लामो समयमा पृथ्वीको औसत तापक्रम र वर्षाको मात्रा परिवर्तन हुने प्रक्रियालाई यसले जनाउँछ, त्यसैले यो सही उत्तर हो। '환경 파괴' भनेको वातावरण विनाश हो। यो प्राकृतिक वातावरण नष्ट हुने अवस्था हो, त्यसैले यो होइन। '지구 온난화' भनेको पृथ्वीको तापक्रम वृद्धि हो। यो तापक्रम बढ्ने कुरा मात्र हो, त्यसैले यो मिल्दैन। '친환경 정책' भनेको वातावरणमैत्री नीति हो। यो वातावरण जोगाउन बनाइने नियम हो, त्यसैले यो होइन। त्यसैले सही उत्तर १ नम्बरको '기후 변화' (जलवायु परिवर्तन) हो।"}, {"n": "305", "q": "자연의 자원과 생태계를 심각하게 손상하는 현상입니다. 산림 벌채, 오염물질 배출, 무분별한 개발 등이 주요 원인으로, 이는 생물 다양성 감소와 지구 온난화 등 심각한 문제를 일으킵니다.", "options": ["기후 변화", "환경 파괴", "풍력 에너지", "ESG 경영"], "answer": 1, "explain": "पहिलो विकल्प 기후 변화 (जलवायु परिवर्तन) हो। दोस्रो विकल्प 환경 파괴 (वातावरण विनाश) हो, जसले प्राकृतिक स्रोत र पारिस्थितिक प्रणालीलाई गम्भीर रूपमा नोक्सान पुर्‍याउँछ र वन फँडानी यसको मुख्य कारण हो, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 풍력 에너지 (वायु ऊर्जा) हो। चौथो विकल्प ESG 경영 (ESG व्यवस्थापन) हो। सही उत्तर विकल्प २ (환경 파괴) हो।"}, {"n": "306", "q": "이산화탄소, 메탄, 아산화질소 같은 대기 중에 존재하는 가스로, 지구의 열을 가두어 기온을 상승시키는 역할을 합니다.", "options": ["화석 연료", "기후 변화", "환경 오염", "온실 가스"], "answer": 3, "explain": "पहिलो विकल्प 화석 연료 (फसिल इन्धन) हो। दोस्रो विकल्प 기후 변화 (जलवायु परिवर्तन) हो। तेस्रो विकल्प 환경 오염 (वातावरण प्रदूषण) हो। चौथो विकल्प 온실 가스 (ग्रिनहाउस ग्यास) हो, जुन वायुमण्डलमा पाइने कार्बनडाइअक्साइड, मिथेन आदि ग्यास हुन् जसले पृथ्वीको तापक्रम बढाउँछन्, त्यसैले यो सही उत्तर हो। सही उत्तर विकल्प ४ (온실 가스) हो।"}, {"n": "307", "q": "해에서 나오는 빛과 열을 이용해 전기를 생산하는 에너지입니다. 환경에 미치는 영향이 적고 재생 가능하여 친환경적인 에너지로 주목받고 있습니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 0, "explain": "पहिलो विकल्प 태양광 에너지 (सौर्य ऊर्जा) हो, जसले सूर्यबाट आउने प्रकाश र तातो प्रयोग गरेर बिजुली उत्पादन गर्छ, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 풍력 에너지 (वायु ऊर्जा) हो। तेस्रो विकल्प 수력 에너지 (जलविद्युत ऊर्जा) हो। चौथो विकल्प 해양 에너지 (समुद्री ऊर्जा) हो। सही उत्तर विकल्प १ (태양광 에너지) हो।"}, {"n": "308", "q": "대기 중 온실가스 증가로 인해 지구의 평균 기온이 상승하는 현상입니다. 이로 인해 생태계와 인간 생활에 심각한 영향을 미칩니다.", "options": ["글로벌화", "산업화", "지구 온난화", "단순화"], "answer": 2, "explain": "'글로벌화' भनेको विश्वव्यापीकरण हो। यो व्यापार र संस्कृति संसारभरि फैलिनु हो, त्यसैले यो होइन। '산업화' भनेको औद्योगिकीकरण हो। यो उद्योग र कारखानाहरूको विकास हुनु हो, त्यसैले यो मिल्दैन। '지구 온난화' भनेको पृथ्वीको तापक्रम वृद्धि हो। वायुमण्डलमा हरितगृह ग्यास बढेर पृथ्वीको औसत तापक्रम बढ्ने प्रक्रियालाई यसले जनाउँछ, त्यसैले यो सही उत्तर हो। '단순화' भनेको सरलीकरण हो। यो जटिल कुरालाई सजिलो बनाउनु हो, त्यसैले यो होइन। त्यसैले सही उत्तर ३ नम्बरको '지구 온난화' (पृथ्वीको तापक्रम वृद्धि) हो।"}, {"n": "309", "q": "석탄, 석유, 천연가스 같은 에너지원으로 많이 사용되지만, 환경 오염과 온실가스 배출의 주요 원인입니다.", "options": ["기후 변화", "재생에어지", "화석 연료", "온난화"], "answer": 2, "explain": "'기후 변화' भनेको जलवायु परिवर्तन हो। यो मौसम र वातावरणमा आउने फेरबदल हो, त्यसैले यो होइन। '재생에어지' भनेको नवीकरणीय ऊर्जा हो। यो प्रदूषण नगर्ने ऊर्जाको स्रोत हो, त्यसैले यो मिल्दैन। '화석 연료' भनेको जीवाश्म इन्धन हो। कोइला, खनिज तेल र प्राकृतिक ग्यास जस्ता वातावरण प्रदूषण गर्ने ऊर्जा स्रोतलाई यसले जनाउँछ, त्यसैले यो सही उत्तर हो। '온난화' भनेको तापक्रम वृद्धि हो। यो न्यानो हुने प्रक्रिया हो, इन्धन होइन, त्यसैले यो होइन। त्यसैले सही उत्तर ३ नम्बरको '화석 연료' (जीवाश्म इन्धन) हो।"}, {"n": "310", "q": "물이 흐르거나 떨어지는 힘을 이용해 전기를 만드는 에너지입니다. 주로 댐이나 강에서 물의 흐름을 이용하여 발전하며, 재생 가능하고 친환경적인 에너지원으로 널리 사용됩니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 2, "explain": "पहिलो विकल्प 태양광 에너지 (सौर्य ऊर्जा) हो। दोस्रो विकल्प 풍력 에너지 (वायु ऊर्जा) हो। तेस्रो विकल्प 수력 에너지 (जलविद्युत ऊर्जा) हो, जसले पानी बग्ने वा खस्ने शक्ति प्रयोग गरेर बिजुली उत्पादन गर्छ, त्यसैले यो सही उत्तर हो। चौथो विकल्प 해양 에너지 (समुद्री ऊर्जा) हो। सही उत्तर विकल्प ३ (수력 에너지) हो।"}, {"n": "311", "q": "쓰레기를 버릴 때 재활용 가능한 자원과 일반 쓰레기를 구별하여 배출하는 것을 의미합니다. 이를 통해 재활용률을 높이고 환경 오염을 줄일 수 있습니다.", "options": ["환경보호", "재고관리", "정리정돈", "분리수거"], "answer": 3, "explain": "पहिलो विकल्प 환경보호 (वातावरण संरक्षण) हो। दोस्रो विकल्प 재고관리 (स्टक व्यवस्थापन) हो। तेस्रो विकल्प 정리정돈 (व्यवस्थापन तथा सफाइ) हो। चौथो विकल्प 분리수거 (सामाग्री वर्गीकरण गरी फ्याँक्ने काम) हो, जसले फोहोर फ्याँक्दा पुनप्रयोग गर्न मिल्ने र साधारण फोहोर छुट्याएर फाल्ने बुझाउँछ, त्यसैले यो सही उत्तर हो। सही उत्तर विकल्प ४ (분리수거) हो।"}, {"n": "312", "q": "바람의 힘을 이용해 전기를 만드는 에너지입니다. 재생 가능하고 친환경적인 에너지원으로 주목받고 있습니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 1, "explain": "पहिलो विकल्प 태양광 에너지 (सौर्य ऊर्जा) हो। दोस्रो विकल्प 풍력 에너지 (वायु ऊर्जा) हो, जसले हावाको शक्ति प्रयोग गरेर बिजुली उत्पादन गर्छ र यो नवीकरणीय तथा वातावरणमैत्री ऊर्जा हो, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 수력 에너지 (जलविद्युत ऊर्जा) हो। चौथो विकल्प 해양 에너지 (समुद्री ऊर्जा) हो। सही उत्तर विकल्प २ (풍력 에너지) हो।"}, {"n": "313", "q": "천이나 옷감을 만들기 전에 사용하는 실의 기본 재료입니다. 면, 나일론, 폴리에스터 같은 섬유를 뽑아서 만든 실로, 이것을 엮어서 천을 만듭니다.", "options": ["원사", "옷장", "옷걸이", "재봉기"], "answer": 0, "explain": "पहिलो विकल्प 원사 (धागो/कच्चा धागो) हो, जुन कपडा वा लुगा बनाउनु अगाडि प्रयोग हुने धागोको आधारभूत सामग्री हो, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 옷장 (दराज) हो। तेस्रो विकल्प 옷걸이 (ह्याङ्गर) हो। चौथो विकल्प 재봉기 (सिलाई मेसिन) हो। सही उत्तर विकल्प १ (원사) हो।"}, {"n": "314", "q": "자연에서 얻을 수 있고, 시간이 지나도 다시 만들어지는 에너지입니다. 태양광, 풍력, 수력, 해양 에너지 등이 있으며, 환경을 오염시키지 않고 계속 사용할 수 있는 것이 특징입니다.", "options": ["환경 오염", "재생에너지", "지구 온난화", "친환경 정책"], "answer": 1, "explain": "'환경 오염' भनेको वातावरणीय प्रदूषण हो। यो वातावरण फोहोर र खराब हुने अवस्था हो, त्यसैले यो होइन। '재생에너지' भनेको नवीकरणीय ऊर्जा हो। प्रकृतिबाट पाइने र पुन: प्रयोग गर्न सकिने सफा ऊर्जालाई यसले जनाउँछ, त्यसैले यो सही उत्तर हो। '지구 온난화' भनेको पृथ्वीको तापक्रम वृद्धि हो। यो वातावरण तातिने समस्या हो, त्यसैले यो मिल्दैन। '친환경 정책' भनेको वातावरणमैत्री नीति हो। यो सरकार वा संस्थाले बनाउने नियम हो, त्यसैले यो होइन। त्यसैले सही उत्तर २ नम्बरको '재생에너지' (नवीकरणीय ऊर्जा) हो।"}, {"n": "315", "q": "공기 속에 들어 있는 수증기(물기)의 양을 나타내는 정도입니다. 이것이 높으면 공기가 축축하고 덥게 느껴지고, 낮으면 건조하게 느껴집니다.", "options": ["계절", "하늘", "바람", "습도"], "answer": 3, "explain": "पहिलो विकल्प 계절 (ऋतु) हो। दोस्रो विकल्प 하늘 (आकाश) हो। तेस्रो विकल्प 바람 (हावा) हो। चौथो विकल्प 습도 (आर्द्रता/चिस्यान) हो, जसले हावामा रहेको पानीको बाफको मात्रालाई बुझाउँछ र यसले हावालाई ओसिलो वा सुख्खा बनाउँछ, त्यसैले यो सही उत्तर हो। सही उत्तर विकल्प ४ (습도) हो।"}, {"n": "316", "q": "어떤 길이, 무게, 시간, 온도 같은 것을 수치로 재는 것을 말합니다. 예를 들어, 자로 길이를 재거나 저울로 무게를 재는 것이 모두 이에 해당합니다.", "options": ["관리", "측정", "재고", "보관"], "answer": 1, "explain": "१. 관리 भनेको व्यवस्थापन गर्नु वा हेरचाह गर्नु हो, त्यसैले यो मिल्दैन। २. 측정 भनेको लम्बाइ, तौल, समय, तापक्रम आदि नाप्नु वा तौलनु हो, त्यसैले यो सही उत्तर हो। ३. 재고 भनेको मौज्दात वा सामानको बाँकी मात्रा हो, त्यसैले यो मिल्दैन। ४. 보관 भनेको सामान भण्डारण गर्नु वा सुरक्षित राख्नु हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 측정 हो जसको अर्थ नाप वा मापन हो।"}, {"n": "317", "q": "어떤 물건이나 정보, 사람 등을 체계적으로 기록하고 관리하는 문서나 책입니다. 주로 학교, 회사, 공공기관 등에서 물건이나 작업을 잘 관리하기 위해 사용합니다.", "options": ["작업대", "판금 가위", "관리 대장", "주문서"], "answer": 2, "explain": "१. 작업대 भनेको काम गर्ने टेबल हो, त्यसैले यो मिल्दैन। २. 판금 가위 भनेको पाना काट्ने कैंची हो, त्यसैले यो मिल्दैन। ३. 관리 대장 भनेको कुनै पनि वस्तु, जानकारी वा व्यक्तिलाई व्यवस्थित रूपमा रेकर्ड गरेर व्यवस्थापन गर्ने कागजात वा किताब हो, त्यसैले यो सही उत्तर हो। ४. 주문서 भनेको अर्डर फारम वा माग फारम हो, त्यसैले यो मिल्दैन। सही उत्तर 3 नम्बरको 관리 대장 हो जसको अर्थ व्यवस्थापन खाता वा रेकर्ड पुस्तिका हो।"}, {"n": "318", "q": "옷감이나 실 등에 색을 입히는 작업을 말합니다. 이 과정을 통해 천에 다양한 색을 내고, 무늬를 만들거나 멋을 더할 수 있습니다.", "options": ["염색 가공", "변색 가공", "관리 대장", "창고 관리"], "answer": 0, "explain": "१. 염색 가공 भनेको कपडा वा धागोमा रङ लगाउने प्रशोधन प्रक्रिया हो, त्यसैले यो सही उत्तर हो। २. 변색 가공 भनेको रङ फेरिने वा बदलिने प्रशोधन हो, त्यसैले यो मिल्दैन। ३. 관리 대장 भनेको व्यवस्थापन खाता वा रेकर्ड पुस्तिका हो, त्यसैले यो मिल्दैन। ४. 창고 관리 भनेको गोदाम व्यवस्थापन हो, त्यसैले यो मिल्दैन। सही उत्तर 1 नम्बरको 염색 가공 हो जसको अर्थ रङ लगाउने प्रशोधन हो।"}, {"n": "319", "q": "자연에서 얻은 재료로 만든 실이나 천을 말합니다. 면, 모, 견 등이 있으며, 피부에 부드럽고 환경에 좋은 섬유입니다.", "options": ["합성 섬유", "천연 섬유", "기계 가공", "원사 가공"], "answer": 1, "explain": "१. 합성 섬유 भनेको सिंथेटिक वा कृत्रिम फाइबर हो, त्यसैले यो मिल्दैन। २. 천연 섬유 भनेको प्रकृतिबाट प्राप्त सामग्रीबाट बनेको धागो वा कपडा हो, जसलाई प्राकृतिक फाइबर भनिन्छ, त्यसैले यो सही उत्तर हो। ३. 기계 가공 भनेको मेसिन प्रशोधन हो, त्यसैले यो मिल्दैन। ४. 원사 가공 भनेको कच्चा धागो प्रशोधन हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 천연 섬유 हो जसको अर्थ प्राकृतिक फाइबर हो।"}, {"n": "320", "q": "석유 같은 화학 물질로 만든 인공 섬유입니다. 나일론, 폴리에스터, 아크릴 등이 있으며, 질기고 잘 마르며 주름이 잘 생기지 않는 특징이 있습니다.", "options": ["합성 섬유", "천연 섬유", "기계 가공", "원사 가공"], "answer": 0, "explain": "१. 합성 섬유 भनेको रासायनिक पदार्थबाट बनेको कृत्रिम फाइबर हो, त्यसैले यो सही उत्तर हो। २. 천연 섬유 भनेको प्राकृतिक फाइबर हो, त्यसैले यो मिल्दैन। ३. 기계 가공 भनेको मेसिन प्रशोधन हो, त्यसैले यो मिल्दैन। ४. 원사 가공 भनेको कच्चा धागो प्रशोधन हो, त्यसैले यो मिल्दैन। सही उत्तर 1 नम्बरको 합성 섬유 हो जसको अर्थ सिंथेटिक फाइबर (कृत्रिम फाइबर) हो।"}, {"n": "321", "q": "어떤 물질에 섞여 있는 원래와 다른 성분이나 더러운 것을 말합니다. 예를 들어, 깨끗한 물에 섞인 먼지나 기름 같은 것입니다.", "options": ["음식재료", "불순물", "음료수", "돌출물"], "answer": 1, "explain": "१. 음식재료 भनेको खानेकुरा बनाउने सामग्री हो, त्यसैले यो मिल्दैन। २. 불순물 भनेको कुनै पनि पदार्थमा मिसाइएको वा मिसिएको मौलिक नभएको अशुद्ध तत्त्व वा फोहर हो, त्यसैले यो सही उत्तर हो। ३. 음료수 भनेको पिउने पानी वा पेय पदार्थ हो, त्यसैले यो मिल्दैन। ४. 돌출물 भनेको बाहिर निस्केको वस्तु हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 불순물 हो जसको अर्थ अशुद्ध वस्तु वा मिसावट हो।"}, {"n": "322", "q": "길고 가느다란 나무나 쇠, 플라스틱 등의 막대 모양 물체를 말합니다. 장난감, 도구, 운동기구 등 다양한 곳에서 쓰이며, 손으로 잡기 쉬운 형태입니다.", "options": ["연필", "빗자루", "막대기", "대걸레"], "answer": 2, "explain": "१. 연필 भनेको पेन्सिल हो, त्यसैले यो मिल्दैन। २. 빗자루 भनेको कुचो हो, त्यसैले यो मिल्दैन। ३. 막대기 भनेको लामो र पातलो काठ, फलाम वा प्लास्टिकको छडी वा लठ्ठी हो, त्यसैले यो सही उत्तर हो। ४. 대걸레 भनेको भुइँ पुछ्ने मप हो, त्यसैले यो मिल्दैन। सही उत्तर 3 नम्बरको 막대기 हो जसको अर्थ छडी वा लठ्ठी हो।"}, {"n": "323", "q": "건축물을 짓거나 가구 따위를 만들 때 필요한 기본적인 나무로 된 재료입니다.", "options": ["벽돌", "목재", "철근", "모래"], "answer": 1, "explain": "१. 벽돌 भनेको इँटा हो, त्यसैले यो मिल्दैन। २. 목재 भनेको भवन बनाउँदा वा फर्निचर बनाउँदा चाहिने आधारभूत काठको सामग्री हो, त्यसैले यो सही उत्तर हो। ३. 철근 भनेको स्टिलको रड हो, त्यसैले यो मिल्दैन। ४. 모래 भनेको बालुवा हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 목재 हो जसको अर्थ काठ वा काठको सामग्री हो।"}, {"n": "324", "q": "가구를 만들 때 가장 먼저 하는 일로, 원목을 용도에 맞게 정확한 크기로 재는 것을 말합니다.", "options": ["샌딩", "도색", "재단", "조립"], "answer": 2, "explain": "'샌딩' भनेको सिरिष कागजले घोटेर चिल्लो पार्ने काम हो। यो काठलाई सम्म बनाउने काम हो, त्यसैले यो होइन। '도색' भनेको रङ लगाउने काम हो। यो सामानमा रङ पोख्ने वा लगाउने काम हो, त्यसैले यो मिल्दैन। '재단' भनेको नापेर काट्ने काम हो। फर्निचर बनाउँदा काठलाई चाहिएको आकारमा सही नाप लिएर काट्नुलाई जनाउँछ, त्यसैले यो सही उत्तर हो। '조립' भनेको जोड्ने काम हो। छुटिएका भागहरूलाई मिलाएर सामान बनाउनु हो, त्यसैले यो होइन। त्यसैले सही उत्तर ३ नम्बरको '재단' (नापेर काट्ने काम) हो।"}, {"n": "325", "q": "목재의 표면을 평평하게 하고 두께를 줄이며, 매끄러운 표면을 부여하는 데 사용합니다.", "options": ["갈퀴", "망치", "대패", "바이스"], "answer": 2, "explain": "१. 갈퀴 भनेको घाँस वा पात बटुल्ने औजार हो, त्यसैले यो मिल्दैन। २. 망치 भनेको हथौडा हो, त्यसैले यो मिल्दैन। ३. 대패 भनेको काठको सतह चिल्लो बनाउन, मोटाइ घटाउन र चिल्लो सतह प्रदान गर्न प्रयोग गरिने रन्दा (प्लेन) हो, त्यसैले यो सही उत्तर हो। ४. 바이스 भनेको भाइस (पकड्ने औजार) हो, त्यसैले यो मिल्दैन। सही उत्तर 3 नम्बरको 대패 हो जसको अर्थ काठ छुल्काउने रन्दा हो।"}, {"n": "326", "q": "나무나 금속을 깎거나 파낼 때 쓰는 도구입니다. 끝이 날카롭고 손잡이가 달려 있어, 망치와 함께 사용하기도 합니다.", "options": ["톱", "축", "줄", "끌"], "answer": 3, "explain": "१. 톱 भनेको आरा हो, त्यसैले यो मिल्दैन। २. 축 भनेको अक्ष (एक्सिस) हो, त्यसैले यो मिल्दैन। ३. 줄 भनेको रेती हो, त्यसैले यो मिल्दैन। ४. 끌 भनेको काठ वा धातु काट्ने वा खोप्ने छेनी हो, जसको टुप्पो तिखो हुन्छ र ह्यामरसँग पनि प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको 끌 हो जसको अर्थ छेनी हो।"}, {"n": "327", "q": "물건을 꽉 잡아 고정시키는 도구입니다. 목공, 금속 작업, 공예 등에서 두 물체를 움직이지 않게 붙잡아 줄 때 사용합니다.", "options": ["작업대", "클램프", "바이스", "장도리"], "answer": 1, "explain": "१. 작업대 भनेको काम गर्ने टेबल हो, त्यसैले यो मिल्दैन। २. 클램프 भनेको दुईवटा वस्तुलाई हल्लाउन नदिई च्यापेर कस्ने वा स्थिर बनाउने क्ल्याम्प हो, त्यसैले यो सही उत्तर हो। ३. 바이스 भनेको भाइस हो, त्यसैले यो मिल्दैन। ४. 장도리 भनेको नङ्ग्रा भएको हथौडा हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 클램프 हो जसको अर्थ क्ल्याम्प हो।"}, {"n": "328", "q": "가구의 표면을 매끄럽게 만들기 위해 문지르는 작업입니다. 사포나 기계를 사용해 거친 부분이나 흠집을 없애고, 페인트나 바니시를 잘 칠할 수 있도록 준비합니다.", "options": ["도장 작업", "가구 연마", "가구 판매", "밀링 작업"], "answer": 1, "explain": "१. 도장 작업 भनेको पेन्टिङ वा कोटिंगको काम हो, त्यसैले यो मिल्दैन। २. 가구 연마 भनेको फर्निचरको सतह चिल्लो बनाउनको लागि स्यान्डपेपर वा मेसिन प्रयोग गरेर घोट्ने काम हो, त्यसैले यो सही उत्तर हो। ३. 가구 판매 भनेको फर्निचर बिक्री हो, त्यसैले यो मिल्दैन। ४. 밀링 작업 भनेको मिलिङ मेसिनको काम हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 가구 연마 हो जसको अर्थ फर्निचर घोट्ने वा चिल्लो पार्ने काम हो।"}, {"n": "329", "q": "물체의 표면에 페인트나 니스 같은 재료를 칠하는 일입니다. 주로 보호하거나 색을 입히고, 보기 좋게 만들기 위해 가구, 건물, 금속 등에 칠합니다.", "options": ["가구 연마", "선반 기계", "도장 작업", "염색 작업"], "answer": 2, "explain": "१. 가구 연마 भनेको फर्निचर घोट्ने काम हो, त्यसैले यो मिल्दैन। २. 선반 기계 भनेको लेथ मेसिन हो, त्यसैले यो मिल्दैन। ३. 도장 작업 भनेको वस्तुको सतहमा पेन्ट वा वार्निश जस्ता सामग्री लगाउने काम हो, त्यसैले यो सही उत्तर हो। ४. 염색 작업 भनेको रङ लगाउने काम (कपडा आदिको) हो, त्यसैले यो मिल्दैन। सही उत्तर 3 नम्बरको 도장 작업 हो जसको अर्थ पेन्टिङ वा रंगरोगनको काम हो।"}, {"n": "330", "q": "물이나 약품 등을 가늘게 뿌릴 수 있게 만든 도구입니다. 식물에 물을 주거나, 청소, 도장 작업 등에 사용하며, 손으로 누르거나 압력을 이용해 작동합니다.", "options": ["분무기", "열풍기", "선풍기", "환풍기"], "answer": 0, "explain": "१. 분무기 भनेको पानी वा औषधि आदि मसिनो गरी छर्कन मिल्ने गरी बनाएको स्प्रेयर (फुहारा) हो, त्यसैले यो सही उत्तर हो। २. 열풍기 भनेको हिटर वा तातो हावा फाल्ने मेसिन हो, त्यसैले यो मिल्दैन। ३. 선풍기 भनेको पङ्खा हो, त्यसैले यो मिल्दैन। ४. 환풍기 भनेको भेन्टिलेटर वा हावा फेर्ने पङ्खा हो, त्यसैले यो मिल्दैन। सही उत्तर 1 नम्बरको 분무기 हो जसको अर्थ स्प्रेयर वा छर्कने यन्त्र हो।"}, {"n": "331", "q": "작업을 시작하기 전에 각 부품에 이상이 없는지 기계를 작동시켜 확인해 보는 것입니다.", "options": ["재단", "포장", "사포질", "공회전"], "answer": 3, "explain": "१. 재단 भनेको कपडा वा काठ काट्ने काम हो, त्यसैले यो मिल्दैन। २. 포장 भनेको प्याकिङ गर्ने काम हो, त्यसैले यो मिल्दैन। ३. 사포질 भनेको स्यान्डपेपरले घस्ने काम हो, त्यसैले यो मिल्दैन। ४. 공회전 भनेको काम सुरु गर्नु अघि मेसिन चलाएर ठीक भए नभएको जाँच्ने काम हो, त्यसैले यो सही उत्तर हो। सही उत्तर 공회전 हो जसको अर्थ खाली घुमाउनु वा मेसिन जाँच गर्नु हो।"}, {"n": "332", "q": "물체의 표면을 갈아서 매끄럽게 만들거나 거친 부분을 제거하는 도구입니다. 작은 모래 알갱이처럼 거친 입자가 붙어 있어 나무나 금속 등을 다듬을 때 사용합니다.", "options": ["망치", "사포", "펜치", "가위"], "answer": 1, "explain": "१. 망치 भनेको हथौडा हो, त्यसैले यो मिल्दैन। २. 사포 भनेको स्यान्डपेपर हो जुन वस्तुको सतह चिल्लो बनाउन प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। ३. 펜치 भनेको पेंचर वा चिम्टा हो, त्यसैले यो मिल्दैन। ४. 가위 भनेको कैँची हो, त्यसैले यो मिल्दैन। सही उत्तर 사포 हो जसको अर्थ स्यान्डपेपर हो।"}, {"n": "333", "q": "가구, 벽, 자동차 등의 틈이나 구멍을 메우고 평평하게 만들기 위해 쓰는 반죽 같은 재료입니다.", "options": ["사포", "홈", "퍼티", "붓"], "answer": 2, "explain": "१. 사포 भनेको स्यान्डपेपर हो, त्यसैले यो मिल्दैन। २. 홈 भनेको खोल्सा वा काप हो, त्यसैले यो मिल्दैन। ३. 퍼티 भनेको प्वाल वा खाडल भर्ने पेस्टजस्तो सामग्री हो, त्यसैले यो सही उत्तर हो। ४. 붓 भनेको पेन्ट गर्ने ब्रस हो, त्यसैले यो मिल्दैन। सही उत्तर 퍼티 हो जसको अर्थ पुट्टी हो।"}, {"n": "334", "q": "페인트나 색칠을 잘 먹게 하기 위해 표면에 먼저 바르는 하얀 밑칠용 재료입니다. 나무, 종이, 플라스틱 등에 칠해서 색이 잘 붙고 오래 유지되도록 도와줍니다.", "options": ["바니시", "롤러", "퍼티", "젯소"], "answer": 3, "explain": "१. 바니시 भनेको वार्निश हो, त्यसैले यो मिल्दैन। २. 롤러 भनेको रोलर हो, त्यसैले यो मिल्दैन। ३. 퍼티 भनेको पुट्टी हो, त्यसैले यो मिल्दैन। ४. 젯소 भनेको रङ लगाउनु अघि लगाइने सेतो बेस कोट हो, त्यसैले यो सही उत्तर हो। सही उत्तर 젯소 हो जसको अर्थ जेसो हो।"}, {"n": "335", "q": "뜨거운 바람을 내보내는 기계로, 물건을 건조시킬 때 사용합니다. 페인트나 퍼티를 빨리 말리거나, 작업장에서 따뜻한 바람으로 난방할 때도 쓰입니다.", "options": ["선풍기", "열풍기", "환풍기", "소화기"], "answer": 1, "explain": "१. 선풍기 भनेको पङ्खा हो, त्यसैले यो मिल्दैन। २. 열풍기 भनेको तातो हावा फाल्ने हिटर मेसिन हो, त्यसैले यो सही उत्तर हो। ३. 환풍기 भनेको भेन्टिलेटर वा हावा फेर्ने पंखा हो, त्यसैले यो मिल्दैन। ४. 소화기 भनेको अग्नििनियन्त्रक यन्त्र हो, त्यसैले यो मिल्दैन। सही उत्तर 열풍기 हो जसको अर्थ तातो हावा दिने मेसिन हो।"}, {"n": "336", "q": "집이나 건물 구조에 고정되어 설치된 가구를 말합니다. 이런 가구를 사용하면 공간을 효율적으로 활용할 수 있습니다.", "options": ["빌트인 가구", "사무용 가구", "조립식 가구", "이동식 가구"], "answer": 0, "explain": "१. 빌트인 가구 भनेको भित्ता वा संरचनामा फिट गरिएको बिल्ट-इन फर्निचर हो, त्यसैले यो सही उत्तर हो। २. 사무용 가구 भनेको अफिसको फर्निचर हो, त्यसैले यो मिल्दैन। ३. 조립식 가구 भनेको जोडिने फर्निचर हो, त्यसैले यो मिल्दैन। ४. 이동식 가구 भनेको सार्न मिल्ने फर्निचर हो, त्यसैले यो मिल्दैन। सही उत्तर 빌트인 가구 हो जसको अर्थ बिल्ट-इन फर्निचर हो।"}, {"n": "337", "q": "물건을 정리하고 보관하는 데 쓰는 장입니다. 옷, 책, 식기, 생활용품 등을 깔끔하게 넣어두기 좋으며, 서랍이나 문이 있는 형태가 많습니다.", "options": ["옷장", "책장", "수납장", "장식장"], "answer": 2, "explain": "१. 옷장 भनेको दराज (वार्डरोब) हो, त्यसैले यो मिल्दैन। २. 책장 भनेको पुस्तकको दराज हो, त्यसैले यो मिल्दैन। ३. 수납장 भनेको सामान मिलाएर राख्ने भण्डारण क्याबिनेट हो, त्यसैले यो सही उत्तर हो। ४. 장식장 भनेको सजावटको दराज हो, त्यसैले यो मिल्दैन। सही उत्तर 수납장 हो जसको अर्थ भण्डारण क्याबिनेट हो।"}, {"n": "338", "q": "철로 만든 막대기를 뜻하며, 보통 콘크리트 구조물에 보강재로 쓰이는 강철봉을 말합니다.", "options": ["자갈", "철근", "벽돌", "전선"], "answer": 1, "explain": "१. 자갈 भनेको गिट्टी हो, त्यसैले यो मिल्दैन। २. 철근 भनेको स्टिलको रड हो, त्यसैले यो सही उत्तर हो। ३. 벽돌 भनेको इँटा हो, त्यसैले यो मिल्दैन। ४. 전선 भनेको बिजुलीको तार हो, त्यसैले यो मिल्दैन। सही उत्तर 철근 हो जसको अर्थ स्टिलको रड हो।"}, {"n": "339", "q": "철근을 서로 묶는 철사로 철근이 움직이지 않도록 고정해 줍니다. 주로 얇고 잘 구부러지는 철사로 만들어집니다.", "options": ["장도리", "절단기", "결속선", "결속 핸들"], "answer": 2, "explain": "१. 장도리 भनेको ह्यामर हो, त्यसैले यो मिल्दैन। २. 절단기 भनेको काट्ने मेसिन हो, त्यसैले यो मिल्दैन। ३. 결속선 भनेको स्टिलको रड बाँध्ने तार हो, त्यसैले यो सही उत्तर हो। ४. 결속 핸들 भनेको बाँध्ने ह्यान्डल हो, त्यसैले यो मिल्दैन। सही उत्तर 결속선 हो जसको अर्थ बाइन्डिङ वायर (बाँध्ने तार) हो।"}, {"n": "340", "q": "어두운 곳에서 앞을 잘 볼 수 있도록 손에 들고 사용하는 작은 전등입니다. 전기로 빛을 내며, 건전지를 넣어 사용하는 경우가 많고, 야간 활동 등에 자주 쓰입니다.", "options": ["전구", "형광등", "충전기", "손전등"], "answer": 3, "explain": "१. 전구 भनेको बल्ब हो, त्यसैले यो मिल्दैन। २. 형광등 भनेको फ्लोरोसेन्ट लाइट हो, त्यसैले यो मिल्दैन। ३. 충전기 भनेको चार्जर हो, त्यसैले यो मिल्दैन। ४. 손전등 भनेको टर्चलाइट हो, त्यसैले यो सही उत्तर हो। सही उत्तर 손전등 हो जसको अर्थ टर्चलाइट हो।"}, {"n": "341", "q": "두 개 이상의 선이나 물체가 만나는 곳을 말합니다. 예를 들어, 철근 공사에서는 철근 두 개가 서로 만나서 X자처럼 겹치는 부분입니다.", "options": ["교차점", "종착점", "결속선", "장단점"], "answer": 0, "explain": "१. 교차점 भनेको काटिने बिन्दु वा क्रसिङ हो, त्यसैले यो सही उत्तर हो। २. 종착점 भनेको अन्तिम गन्तव्य हो, त्यसैले यो मिल्दैन। ३. 결속선 भनेको बाँध्ने तार हो, त्यसैले यो मिल्दैन। ४. 장단점 भनेको फाइदा र बेफाइदा हो, त्यसैले यो मिल्दैन। सही उत्तर 교차점 हो जसको अर्थ काटिने बिन्दु वा क्रसिङ हो। किताबमा दोस्रो विकल्प '종작점' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '종착점' हो।"}, {"n": "342", "q": "보통 콘크리트, 철근, 철강 등 강한 재료로 만들어지며, 건물이나 다리, 교량 등에서 중요한 지지대 역할을 합니다.", "options": ["철근", "기둥", "지붕", "마당"], "answer": 1, "explain": "१. 철근 भनेको स्टिलको रड हो, त्यसैले यो मिल्दैन। २. 기둥 भनेको पिलर वा खाँबो हो, त्यसैले यो सही उत्तर हो। ३. 지붕 भनेको छानो हो, त्यसैले यो मिल्दैन। ४. 마당 भनेको आँगन हो, त्यसैले यो मिल्दैन। सही उत्तर 기둥 हो जसको अर्थ पिलर वा खाँबो हो।"}, {"n": "343", "q": "건물, 시설물 등을 새로 짓거나 오래된 건물, 시설물들을 처리하는 곳입니다.", "options": ["공장", "농장", "사업장", "공사장"], "answer": 3, "explain": "१. 공장 भनेको कारखाना हो, त्यसैले यो मिल्दैन। २. 농장 भनेको फार्म हो, त्यसैले यो मिल्दैन। ३. 사업장 भनेको कार्यस्थल हो, त्यसैले यो मिल्दैन। ४. 공사장 भनेको निर्माण स्थल हो, त्यसैले यो सही उत्तर हो। सही उत्तर 공사장 हो जसको अर्थ निर्माण स्थल हो।"}, {"n": "344", "q": "사람이나 차량이 쉽게 건너도록 도와주며, 보통 콘크리트, 철강, 철근 등 강한 재료로 만들어집니다. 도로, 철도, 하수도 등 다양한 용도로 사용되며, 두 지역을 연결하는 중요한 역할을 합니다.", "options": ["육교", "지하", "교량", "신호등"], "answer": 2, "explain": "१. 육교 भनेको ओभरहेड ब्रिज (आकाशे पुल) हो, त्यसैले यो मिल्दैन। २. 지하 भनेको भूमिगत हो, त्यसैले यो मिल्दैन। ३. 교량 भनेको पुल (ब्रिज) हो, त्यसैले यो सही उत्तर हो। ४. 신호등 भनेको ट्रफिक लाइट हो, त्यसैले यो मिल्दैन। सही उत्तर 교량 हो जसको अर्थ पुल हो।"}, {"n": "345", "q": "공사를 할 때 땅이나 암석 따위를 파거나 파낸 것을 처리하는 기계입니다.", "options": ["불도저", "굴착기", "화물차", "굴착기"], "answer": 1, "explain": "'불도저' भनेको जमिन सम्याउने मेसिन हो, त्यसैले यो माटो खन्ने मेसिन होइन। '굴착기' भनेको जमिन वा चट्टान खन्ने र पन्छाउने मेसिन हो, त्यसैले यो विवरणसँग मिल्छ। '화물차' भनेको सामान बोक्ने ट्रक हो, त्यसैले यो माटो खन्ने मेसिन होइन। '굴착기' भनेको जमिन खन्ने मेसिन हो, तर विकल्प २ पहिले नै सही छ। त्यसैले सही उत्तर विकल्प २ को '굴착기' हो।"}, {"n": "346", "q": "모래나 자갈등을 공사 현장으로 운반할 때에 편리하게 사용하는 작업 차량입니다.", "options": ["불도저", "덤프트럭", "굴착기", "기중기"], "answer": 1, "explain": "१. 불도저 भनेको डोजर हो, जसले माटो धकेल्छ र यो यहाँ मिल्दैन। २. 덤프트럭 भनेको डम्प ट्रक हो, जसले बालुवा वा गिट्टीजस्ता सामग्रीहरू निर्माण स्थलमा बोकेर लैजान सजिलै प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। ३. 굴착기 भनेको खन्ने मेसिन (एक्सकाभेटर) हो र यो यहाँ मिल्दैन। ४. 기중기 भनेको क्रेन हो, जसले सामान उठाउँछ र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 덤프트럭 (डम्प ट्रक) हो।"}, {"n": "347", "q": "농업에서 논밭을 갈아 일굴 때 사용하는 기계입니다.", "options": ["콤바인", "굴착기", "경운기", "지게차"], "answer": 2, "explain": "१. 콤바인 भनेको धान काट्ने र झार्ने मेशिन हो र यो यहाँ मिल्दैन। २. 굴착기 भनेको खन्ने मेसिन (एक्सकाभेटर) हो र यो यहाँ मिल्दैन। ३. 경운기 भनेको पावर टिलर वा हाते ट्र्याक्टर हो, जसले कृषिमा खेतबारी जोत्न प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। ४. 지게차 भनेको फोर्कलिफ्ट हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 경운기 (पावर टिलर) हो।"}, {"n": "348", "q": "두 대의 바퀴 축 사이에 넓은 회전 날이 달려있어 땅바닥을 평평하게 할 때 사용하는 작업 기계입니다.", "options": ["크레인", "지게차", "덤프트럭", "그레이더"], "answer": 3, "explain": "१. 크레인 भनेको क्रेन हो र यो यहाँ मिल्दैन। २. 지게차 भनेको फोर्कलिफ्ट हो र यो यहाँ मिल्दैन। ३. 덤프트럭 भनेको डम्प ट्रक हो र यो यहाँ मिल्दैन। ४. 그레이더 भनेको ग्रिडर हो, जसमा पाङ्ग्राको बीचमा फराकिलो ब्लेड हुन्छ जसले जमिनलाई सम्याउन मद्दत गर्छ, त्यसैले यो सही उत्तर हो। तसर्थ, सही उत्तर 그레이더 (ग्रिडर) हो।"}, {"n": "349", "q": "흙을 밀어 내어 땅을 깎거나 지면을 고르고 평평하게 만드는 중장비입니다.", "options": ["불도저", "그레이더", "지게차", "굴착기"], "answer": 0, "explain": "१. 불도저 भनेको बुल्डोजर हो, जसले माटो धकेलेर वा काटेर जमिनलाई सफा र सम्याउन मद्दत गर्छ, त्यसैले यो सही उत्तर हो। २. 그레이더 भनेको ग्रिडर हो र यो यहाँ मिल्दैन। ३. 지게차 भनेको फोर्कलिफ्ट हो र यो यहाँ मिल्दैन। ४. 굴착기 भनेको खन्ने मेसिन हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 불도저 (बुल्डोजर) हो।"}, {"n": "350", "q": "농촌에서 무거운 짐이나 농기계를 끌 때 사용하는 중장비입니다.", "options": ["화물차", "트렉터", "콤바인", "크레인"], "answer": 1, "explain": "१. 화물차 भनेको कार्गो ट्रक हो र यो यहाँ मिल्दैन। २. 트렉터 भनेको ट्र्याक्टर हो, जसले ग्रामीण क्षेत्रमा भारी सामान वा कृषियन्त्रहरू तान्न प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। ३. 콤바인 भनेको धान काट्ने मेसिन हो र यो यहाँ मिल्दैन। ४. 크레인 भनेको क्रेन हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 트렉터 (ट्र्याक्टर) हो।"}, {"n": "351", "q": "건설 현장이나 항구에서 자주 사용되며, 큰 기계 팔이나 줄을 이용해 물건을 들어 올리고 이동시킵니다. 건물이나 구조물을 짓거나 수송할 때 중요한 역할을 합니다.", "options": ["화물차", "트렉터", "콤바인", "크레인"], "answer": 3, "explain": "१. 화물차 भनेको कार्गो ट्रक हो र यो यहाँ मिल्दैन। २. 트렉터 भनेको ट्र्याक्टर हो र यो यहाँ मिल्दैन। ३. 콤바인 भनेको धान काट्ने मेसिन हो र यो यहाँ मिल्दैन। ४. 크레인 भनेको क्रेन हो, जसले निर्माण स्थलमा ठूला मेसिन वा डोरीको प्रयोग गरी सामान उठाउने र सार्ने काम गर्छ, त्यसैले यो सही उत्तर हो। तसर्थ, सही उत्तर 크레인 (क्रेन) हो।"}, {"n": "352", "q": "흙이나 아스팔트 등의 재료를 압축하고 지면을 다지는 데 사용하는 장비입니다.", "options": ["불도저", "지게차", "로더", "롤러"], "answer": 3, "explain": "'불도저' भनेको माटो धकेल्ने मेसिन हो, त्यसैले यसले भुइँ थिच्ने काम गर्दैन। '지게차' भनेको सामान उचाल्ने मेसिन हो, त्यसैले यो भुइँ दरो बनाउने उपकरण होइन। '로더' भनेको माटो उचालेर लोड गर्ने मेसिन हो, त्यसैले यो विवरणसँग मिल्दैन। '롤러' भनेको माटो वा असफाल्ट थिचेर भुइँ सम्याउने रोलर हो, त्यसैले यो विवरणसँग मिल्छ। त्यसैले सही उत्तर विकल्प ४ को '롤러' हो।"}, {"n": "353", "q": "바다나 강, 호수의 바닥을 파서 깊이를 늘리거나, 퇴적물을 제거하는 작업입니다.", "options": ["준설", "도장", "염색", "운송"], "answer": 0, "explain": "१. 준설 भनेको ड्रेजिङ (नदी वा समुद्रको पिँध खनेर गहिराइ बढाउने वा लेदो हटाउने काम) हो, त्यसैले यो सही उत्तर हो। २. 도장 भनेको पेन्टिङ (रंग लगाउने काम) हो र यो यहाँ मिल्दैन। ३. 염색 भनेको रंगाउने काम हो र यो यहाँ मिल्दैन। ४. 운송 भनेको ढुवानी हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 준설 (ड्रेजिङ/पिँध खन्ने काम) हो।"}, {"n": "354", "q": "흙과 모래가 섞인 것을 말하며 건설 현장이나 하천 주변에서 자주 볼 수 있습니다.", "options": ["돌", "자갈", "토사", "콘크리트"], "answer": 2, "explain": "१. 돌 भनेको ढुङ्गा हो र यो यहाँ मिल्दैन। २. 자갈 भनेको गिट्टी हो र यो यहाँ मिल्दैन। ३. 토사 भनेको माटो र बालुवा मिसिएको लेदो वा माटो-बालुवा हो, जसलाई निर्माण स्थल वा खोला किनारमा प्रायः देख्न सकिन्छ, त्यसैले यो सही उत्तर हो। ४. 콘크리트 भनेको कंक्रिट हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 토사 (माटो र बालुवाको मिश्रण) हो।"}, {"n": "355", "q": "하천, 호수, 하수관 등에서 물이 천천히 흐를 때 무거운 물질들이 아래로 내려앉아 쌓이게 되는 것을 말합니다. 오랜 시간 쌓이면 물이 흐르는 길을 막거나 오염의 원인이 되기도 합니다.", "options": ["수하물", "침전물", "불순물", "분진물"], "answer": 1, "explain": "१. 수하물 भनेको ब्यागेज वा सामान हो र यो यहाँ मिल्दैन। २. 침전물 भनेको लेदो वा गेगर (पानीमा रहेका भारी पदार्थहरू तल थिग्रिएर बस्ने निक्षेप) हो, त्यसैले यो सही उत्तर हो। ३. 불순물 भनेको अशुद्धता हो र यो यहाँ मिल्दैन। ४. 분진물 भनेको धुलोका कणहरू हुन् र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 침전물 (गेगर/लेदो निक्षेप) हो।"}, {"n": "356", "q": "물이 흐르도록 만든 길이나 자연적으로 생긴 물길을 말합니다. 예를 들어, 강, 하천, 배수로 등이 모두 이에 해당합니다.", "options": ["토사", "바다", "폭포", "수로"], "answer": 3, "explain": "१. 토사 भनेको माटो र बालुवा हो र यो यहाँ मिल्दैन। २. 바다 भनेको समुद्र हो र यो यहाँ मिल्दैन। ३. 폭포 भनेको झरना हो र यो यहाँ मिल्दैन। ४. 수로 भनेको पानी बग्ने कुलो वा प्राकृतिक पानीको बाटो हो, त्यसैले यो सही उत्तर हो। तसर्थ, सही उत्तर 수로 (पानी बग्ने कुलो/बाटो) हो।"}, {"n": "357", "q": "집이나 건물에 깨끗한 물을 보내고, 더러운 물을 밖으로 빼내는 시설입니다.", "options": ["상하수도", "음용수", "배수구", "수도관"], "answer": 0, "explain": "१. 상하수도 भनेको खानेपानी र ढल निकास प्रणाली (वाटर सप्लाई र सेभेज सिस्टम) हो, जसले सफा पानी पठाउँछ र फोहोर पानी बाहिर लैजान्छ, त्यसैले यो सही उत्तर हो। २. 음용수 भनेको पिउने पानी हो र यो यहाँ मिल्दैन। ३. 배수구 भनेको ड्रेन वा पानी जाने प्वाल हो र यो यहाँ मिल्दैन। ४. 수도관 भनेको पानीको पाइप हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 상하수도 (खानेपानी तथा ढल निकास प्रणाली) हो।"}, {"n": "358", "q": "흙이나 모래 등을 단단하게 다질 때 사용하는 손도구입니다. 손잡이가 달린 작은 기계처럼 생겼고, 사람이 손으로 들어 올려 바닥을 여러 번 내리쳐서 땅을 눌러 단단하게 만드는 데 사용합니다.", "options": ["결속 핸들", "핸드 램머", "판금 가위", "유각 렌치"], "answer": 1, "explain": "१. 결속 핸들 भनेको बाइन्डिङ ह्यान्डल हो र यो यहाँ मिल्दैन। २. 핸드 램머 भनेको ह्यान्ड र्यामर (हातले उचालेर जमिन कुट्ने औजार) हो, त्यसैले यो सही उत्तर हो। ३. 판금 가위 भनेको पाना काट्ने कैंची हो र यो यहाँ मिल्दैन। ४. 유각 렌치 भनेको हेक्सागन रेन्च हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 핸드 램머 (ह्यान्ड र्यामर) हो।"}, {"n": "359", "q": "산이나 땅속을 파서 만든 터널로, 주로 도로, 철도, 수도, 전력선 등을 통과시키기 위해 사용됩니다.", "options": ["육상터널", "대교량", "현수교", "하역구"], "answer": 0, "explain": "१. 육상터널 भनेको जमिन वा पहाडभित्र बनाइने सुरुङ (टनेल) हो, त्यसैले यो सही उत्तर हो। २. 대교량 भनेको ठूलो पुल हो र यो यहाँ मिल्दैन। ३. 현수교 भनेको सस्पेन्शन ब्रिज (झुलाउने पुल) हो र यो यहाँ मिल्दैन। ४. 하역구 भनेको सामान लोड-अनलोड गर्ने ठाउँ हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 육상터널 (सुरुङ/टनेल) हो।"}, {"n": "360", "q": "쇠로 된 두 줄의 레일로 이루어져 있고, 기차나 전철 같은 열차가 이 레일 위를 달립니다. 사람이나 물건을 빠르게 멀리까지 옮길 수 있어서, 교통과 운송에 아주 중요한 역할을 합니다.", "options": ["도로", "육교", "철도", "교량"], "answer": 2, "explain": "१. 도로 भनेको सडक हो र यो यहाँ मिल्दैन। २. 육교 भनेको ओभरब्रिज (आकाशे पुल) हो र यो यहाँ मिल्दैन। ३. 철도 भनेको रेलमार्ग (ट्र्याक) हो, जसले दुईवटा फलामका लिकहरूमा रेल दौडाउँछ र यातायातमा महत्त्वपूर्ण भूमिका खेल्छ, त्यसैले यो सही उत्तर हो। ४. 교량 भनेको पुल हो र यो यहाँ मिल्दैन। तसर्थ, सही उत्तर 철도 (रेलमार्ग) हो।"}, {"n": "361", "q": "기둥(주탑)에서 여러 개의 줄(케이블)이 사선으로 연결되어 있는 다리입니다. 보기에도 멋지고, 튼튼하면서도 긴 거리를 연결할 수 있어 큰 강이나 바다 위에 자주 사용합니다.", "options": ["육상터널", "수상 교량", "현수교", "사장교"], "answer": 3, "explain": "'육상터널' भनेको जमिनमुनिको सुरुङ हो, त्यसैले यो पुल होइन। '수상 교량' भनेको पानीमाथिको सामान्य पुल हो, तर यसमा केबलको विशेष कुरा छैन। '현수교' भनेको झोलुङ्गे पुल हो, तर यसमा केबलहरू अर्कै तरिकाले टाँगिएका हुन्छन्। '사장교' भनेको मुख्य थामबाट केबलहरू छड्के रूपमा जोडिएको पुल हो, त्यसैले यो विवरणसँग मिल्छ। त्यसैले सही उत्तर विकल्प ४ को '사장교' हो। किताबमा ३ वटा मात्र विकल्पहरू छापिएका छन्, सही उत्तर साजाङ्ग्यो थपिएको हो।"}, {"n": "362", "q": "바다 바닥을 파고 들어가 만든 터널입니다. 이 터널은 바다 아래를 지나갈 수 있도록 만들어지며, 주로 도로, 철도, 수도, 전력선 등을 연결하는 데 사용됩니다.", "options": ["육상터널", "해저침매터널", "교통수단", "사장교"], "answer": 1, "explain": "1. 육상터널 भनेको जमिनमा बनाइने सुरुङ हो, यो समुद्रको फेदमा बनाइने सुरुङको वर्णन होइन त्यसैले मिलेन। 2. 해저침매터널 भनेको समुद्रको पिँध खनेर बनाइएको सुरुङ हो, त्यसैले यो सही उत्तर हो। 3. 교통수단 भनेको यातायातको साधन हो, यो सुरुङसँग सम्बन्धित छैन त्यसैले मिलेन। 4. 사장교 भनेको केबल प्रयोग गरिएको पुल हो, यो सुरुङ होइन त्यसैले मिलेन। 해저침매터널 भनेको समुद्रको सतहमुनि सुरुङ बनाउने विधि हो।"}, {"n": "363", "q": "나무, 철사, 플라스틱 등 다양한 재료로 만들어지며, 식물이 무너지지 않도록 돕고, 햇볕과 공기의 흐름을 좋게 유지하는 역할을 합니다.", "options": ["울타리망", "경운기", "지주대", "곡괭이"], "answer": 2, "explain": "1. 울타리망 भनेको बारे लगाउने जाली हो, यो बिरुवालाई अड्याउने साधन होइन त्यसैले मिलेन। 2. 경운기 भनेको हाते ट्र्याक्टर हो, यो बिरुवालाई अड्याउने साधन होइन त्यसैले मिलेन। 3. 지주대 भनेको बिरुवा ढल्न नदिन र हावापानीको आवतजावत राम्रो बनाउन प्रयोग गरिने खम्बा वा साहरा हो, त्यसैले यो सही उत्तर हो। 4. 곡괭이 भनेको कोदालो वा गैंची हो, यो बिरुवालाई अड्याउने साधन होइन त्यसैले मिलेन। 지주대 भनेको बिरुवालाई अड्याउन प्रयोग गरिने साधन हो।"}, {"n": "364", "q": "쇠로 서너 개의 발을 만들고 자루를 박아 갈퀴 모양으로 만든 농기구입니다. 땅을 파헤쳐 고르거나 두엄, 풀무덤 등을 쳐내는 데 씁니다.", "options": ["모종삽", "분무기", "곡괭이", "쇠스랑"], "answer": 3, "explain": "'모종삽' भनेको बिरुवा सार्ने सानो साबेल हो, त्यसैले यो काँढा भएको औजार होइन। '분무기' भनेको पानी वा औषधि छर्कने उपकरण हो, त्यसैले यो माटो पन्छाउने औजार होइन। '곡괭이' भनेको गैँती हो, तर यसमा तीन-चार वटा काँढा हुँदैनन्। '쇠스랑' भनेको फलामको काँढा भएको सोहोर्ने कृषि औजार हो, त्यसैले यो विवरणसँग मिल्छ। त्यसैले सही उत्तर विकल्प ४ को '쇠스랑' हो।"}, {"n": "365", "q": "모판에서 기른 어린 식물을 논이나 밭으로 옮겨 심을 때 사용하는 작업 도구입니다.", "options": ["뜰채", "갈퀴", "곡괭이", "모종삽"], "answer": 3, "explain": "1. 뜰채 भनेको जाली हो, यो बिरुवा सार्ने औजार होइन त्यसैले मिलेन। 2. 갈퀴 भनेको घाँस वा पात बटुलुने औजार हो, यो बिरुवा सार्ने होइन त्यसैले मिलेन। 3. 모종삽 भनेको बेर्ना सार्न प्रयोग गरिने सानो साबेल हो, त्यसैले यो सही उत्तर हो। 4. 곡괭이 भनेको कडा माटो खन्ने गैंची हो, यो बिरुवा सार्ने औजार होइन त्यसैले मिलेन। 모종삽 भनेको बेर्ना सार्ने औजार हो।"}, {"n": "366", "q": "곡괭이, 호미, 낫 등과 같이 논과 밭에서 곡식이나 채소 등을 재배할 때 사용하는 도구입니다.", "options": ["공구", "가구", "농기구", "보호구"], "answer": 2, "explain": "'공구' भनेको सामान्य काममा प्रयोग हुने औजार हो, तर यो विशेष गरी खेतीको होइन। '가구' भनेको घरको फर्निचर हो, त्यसैले यो खेती गर्ने औजार होइन। '농기구' भनेको खेतबारीमा अन्न वा तरकारी रोप्दा प्रयोग गरिने कृषि औजार हो, त्यसैले यो विवरणसँग मिल्छ। '보호구' भनेको शरीरको सुरक्षा गर्ने सामान हो, त्यसैले यो खेती गर्ने औजार होइन। त्यसैले सही उत्तर विकल्प ३ को '농기구' हो।"}, {"n": "367", "q": "긴 나무 자루에 길고 뾰족한 날을 붙여서 만든 것으로 단단한 땅을 파는 데 쓰는 농기구입니다.", "options": ["호미", "갈퀴", "모종삽", "곡괭이"], "answer": 3, "explain": "१. 호미 भनेको सानो कुटो हो, यो घाँस उखेल्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। २. 갈퀴 भनेको सोहर्ने दाँती हो, यो सुकेका पात सोहर्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ३. 모종삽 भनेको सानो बेल्चा हो, यो बिरुवा रोप्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ४. 곡괭이 भनेको गैँती हो, यो लामो काठको बिँड भएको कडा माटो खन्ने औजार भएकाले विवरणसँग सही मिल्छ। त्यसैले सही उत्तर ४ नम्बरको 곡괭이 हो।"}, {"n": "368", "q": "농업이나 건설 현장에서 땅을 파거나 흙을 옮길 때 사용하는 도구입니다.", "options": ["삽", "괭이", "호미", "대패"], "answer": 0, "explain": "1. 삽 भनेको माटो खन्न वा सार्न प्रयोग हुने साबेल हो, त्यसैले यो सही उत्तर हो। 2. 괭이 भनेको कुटो हो, यो साबेल होइन त्यसैले मिलेन। 3. 호미 भनेको सानो कुटो हो, यो माटो फ्याँक्ने साबेल होइन त्यसैले मिलेन। 4. 대패 भनेको काठ रन्दा लगाउने औजार हो, यो माटो खन्ने होइन त्यसैले मिलेन। 삽 भनेको माटो खन्ने वा बोक्ने साबेल हो।"}, {"n": "369", "q": "벼, 보리, 밀 같은 작물을 수확할 때 탈곡과 선별 작업을 동시에 할 수 있는 기계입니다.", "options": ["경운기", "예초기", "콤바인", "파종기"], "answer": 2, "explain": "1. 경운기 भनेको हाते ट्र्याक्टर हो, यो बाली काट्ने मेसिन होइन त्यसैले मिलेन। 2. 예초기 भनेको घाँस काट्ने मेसिन हो, यो बाली भित्र्याउने मेसिन होइन त्यसैले मिलेन। 3. 콤바인 भनेको धान, गहुँ जस्ता बाली एकैचोटि काट्ने र चुट्ने मेसिन (कम्बाइन) हो, त्यसैले यो सही उत्तर हो। 4. 파종기 भनेको बीउ रोप्ने मेसिन हो, यो बाली काट्ने मेसिन होइन त्यसैले मिलेन। 콤바인 भनेको बाली काट्ने र झार्ने काम एकैसाथ गर्ने मेसिन हो।"}, {"n": "370", "q": "농업에서 씨앗을 빠르고 효율적으로 심을 수 있도록 도와주는 기계로, 자동화된 시스템을 이용해 일정한 양의 씨앗을 고르게 뿌려서 노동을 덜어줍니다.", "options": ["경운기", "트렉터", "콤바인", "파종기"], "answer": 3, "explain": "1. 경운기 भनेको हाते ट्र्याक्टर हो, यो बीउ रोप्ने मेसिन होइन त्यसैले मिलेन। 2. 트렉터 भनेको ट्र्याक्टर हो, यो जोत्ने काममा आउँछ त्यसैले मिलेन। 3. 콤바인 भनेको बाली काट्ने मेसिन हो, यो बीउ रोप्ने होइन त्यसैले मिलेन। 4. 파종기 भनेको बीउ छर्ने वा रोप्ने मेसिन हो, त्यसैले यो सही उत्तर हो। 파종기 भनेको कृषिका लागि बीउ रोप्ने मेसिन हो।"}, {"n": "371", "q": "풀을 자르거나 깎는 데 사용하는 기계로 주로 논, 밭, 과수원, 도로 주변, 공원 등에서 자란 잔디나 잡초를 정리할 때 사용합니다.", "options": ["수준기", "예초기", "정수기", "경운기"], "answer": 1, "explain": "1. 수준기 भनेको लेभल मिलाउने औजार हो, यो घाँस काट्ने मेसिन होइन त्यसैले मिलेन। 2. 예초기 भनेको घाँस वा बुट्यान काट्ने मेसिन हो, त्यसैले यो सही उत्तर हो। 3. 정수기 भनेको पानी फिल्टर गर्ने मेसिन हो, यो घाँस काट्ने होइन त्यसैले मिलेन। 4. 경운기 भनेको हाते ट्र्याक्टर हो, यो घाँस काट्ने मेसिन होइन त्यसैले मिलेन। 예초기 भनेको घाँस काट्ने मेसिन हो।"}, {"n": "372", "q": "땅을 파거나 고를 때 사용하는 농기구입니다. 끝이 날카로운 쇠로 되어 있고, 손잡이를 잡고 흔들어 흙을 팔 때 사용합니다.", "options": ["삽", "괭이", "망치", "곡괭이"], "answer": 1, "explain": "1. 삽 भनेको माटो काट्ने साबेल हो, यो कुटो होइन त्यसैले मिलेन। 2. 괭이 भनेको माटो खन्ने वा गोडमेल गर्ने कुटो हो, त्यसैले यो सही उत्तर हो। 3. 망치 भनेको हथौडा हो, यो कृषि औजार होइन त्यसैले मिलेन। 4. 곡괭이 भनेको गैंची हो, यो कुटोभन्दा फरक हुन्छ त्यसैले यो होइन। 괭이 भनेको माटो खन्ने कुटो हो।"}, {"n": "373", "q": "밭에서 풀을 뽑거나 흙을 고를 때 사용하는 작은 농기구입니다. 한 손으로 쓸 수 있는 도구로, 끝이 휘어져 있어서 흙을 긁거나 파기에 좋고, 잡초를 쉽게 제거할 수 있습니다.", "options": ["호미", "괭이", "갈퀴", "낫"], "answer": 0, "explain": "१. 호미 भनेको सानो कुटो हो, यो एक हातले घाँस उखेल्न र माटो सोहर्न प्रयोग गरिने औजार भएकाले विवरणसँग सही मिल्छ। २. 괭이 भनेको कुदालो हो, यो दुवै हातले प्रयोग गरिने अलि ठूलो औजार भएकाले विवरणसँग मिल्दैन। ३. 갈퀴 भनेको सोहर्ने दाँती हो, यो घाँस वा पात सोहर्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ४. 낫 भनेको हँसिया हो, यो बाली वा घाँस काट्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। त्यसैले सही उत्तर १ नम्बरको 호미 हो।"}, {"n": "374", "q": "씨앗을 뿌려 모를 키우는 작은 밭이나 판입니다. 주로 벼농사에서 많이 사용되며, 모판에서 모를 일정 크기로 키운 뒤, 본논에 옮겨 심는 방식으로 농사를 짓습니다.", "options": ["수레", "분뇨", "상자", "모판"], "answer": 3, "explain": "1. 수레 भनेको ठेलागाडी हो, यो बेर्ना हुर्काउने ठाउँ होइन त्यसैले मिलेन। 2. 분뇨 भनेको मलमूत्र हो, यो बेर्ना राख्ने ठाउँ होइन त्यसैले मिलेन। 3. 상자 भनेको बक्स हो, यो बेर्ना राख्ने ठाउँसँग मिल्दैन। 4. 모판 भनेको धान वा तरकारीको बेर्ना उमार्ने ब्याड (प्लाष्टिक वा काठको ट्रे) हो, त्यसैले यो सही उत्तर हो। 모판 भनेको बेर्ना उमार्ने ठाउँ वा ब्याड हो।"}, {"n": "375", "q": "토지의 생산력을 높이고 식물에 생장을 돕기 위해 땅에 뿌리는 물질입니다.", "options": ["씨앗", "비료", "사료", "모종, 바종"], "answer": 1, "explain": "1. 씨앗 भनेको बीउ हो, यो माटोमा हालिने रासायनिक वा प्रांगारिक पदार्थ होइन त्यसैले मिलेन। 2. 비료 भनेको माटोको उर्वराशक्ति बढाउन र बिरुवाको वृद्धिका लागि प्रयोग गरिने मल (खेतीमा हाल्ने मल) हो, त्यसैले यो सही उत्तर हो। 3. 사료 भनेको दाना (जनावरलाई खुवाउने) हो, यो माटोमा हाल्ने होइन त्यसैले मिलेन। 4. 모종, 바종 भनेको बेर्ना र बीउ छर्ने काम हो, यो मल होइन त्यसैले मिलेन। 비료 भनेको मल वा फर्टिलाइजर हो। चौथो विकल्प '모종, 바종' किताबमा छापिएजस्तै राखिएको छ।"}, {"n": "376", "q": "나무를 심고, 가꾸고, 수확하는 작업이 이루어지며, 과일 생산을 위한 전문적인 농업 공간입니다.", "options": ["농장", "공원", "정원", "과수원"], "answer": 3, "explain": "१. 농장 भनेको समग्र बालीनाला लगाउने र जनावर पाल्ने फार्म हो, त्यसैले यो मिल्दैन। २. 공원 भनेको मानिसहरू आराम गर्ने पार्क हो, त्यसैले यो मिल्दैन। ३. 정원 भनेको बगैंचा हो, त्यसैले यो मिल्दैन। ४. 과수원 भनेको फलफूल उत्पादन गर्ने बगैंचा वा फार्म हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ नम्बरको 과수원 (फलफूल बगैंचा) हो।"}, {"n": "377", "q": "가축들이 먹는 먹이를 말하며 주로 곡물, 풀, 콩, 비타민 등으로 만들어지며, 가축이 건강하게 자라고 고기나 우유, 달걀 등을 잘 생산할 수 있도록 도와줍니다.", "options": ["비료", "분뇨", "사료", "건초"], "answer": 2, "explain": "१. 비료 भनेको मल हो, त्यसैले यो मिल्दैन। २. 분뇨 भनेको पशुपक्षीको मलमूत्र हो, त्यसैले यो मिल्दैन। ३. 사료 भनेको जनावरलाई खुवाउने दाना (आहारा) हो, त्यसैले यो सही उत्तर हो। ४. 건초 भनेको सुकेको घाँस हो, त्यसैले यो मिल्दैन। सही उत्तर ३ नम्बरको 사료 (पशु आहार) हो।"}, {"n": "378", "q": "가축에게 사료를 주는 기계나 도구입니다. 이 기계는 자동 또는 수동으로 작동하며, 일정한 양의 사료를 정해진 시간에 가축에게 공급해 줍니다.", "options": ["바가지", "사료조", "급이기", "계량컵"], "answer": 2, "explain": "१. 바가지 भनेको पानी वा दाना तान्ने बाटा वा कचौरा हो, त्यसैले यो मिल्दैन। २. 사료조 भनेको दाना राख्ने भाँडो वा डुँड हो, त्यसैले यो मिल्दैन। ३. 급이기 भनेको पशुलाई स्वचालित वा हाते तरिकाले दाना खुवाउने यन्त्र (फीडर) हो, त्यसैले यो सही उत्तर हो। ४. 계량컵 भनेको नाप्ने कप हो, त्यसैले यो मिल्दैन। सही उत्तर ३ नम्बरको 급이기 (दाना खुवाउने यन्त्र) हो।"}, {"n": "379", "q": "가축에게 사료를 담아주는 그릇이나 통입니다. 주로 가축들이 사료를 먹을 수 있도록 담아두는 용기로, 플라스틱, 철, 시멘트 등 다양한 재료로 만들어집니다.", "options": ["주전자", "사료조", "급이기", "저울"], "answer": 1, "explain": "१. 주전자 भनेको चिया वा पानी उमाल्ने वा राख्ने भाँडो हो, त्यसैले यो मिल्दैन। २. 사료조 भनेको पशुलाई दाना राख्ने भाँडो वा डुँड हो, त्यसैले यो सही उत्तर हो। ३. 급이기 भनेको दाना खुवाउने यन्त्र हो, त्यसैले यो मिल्दैन। ४. 저울 भनेको तराजु हो, त्यसैले यो मिल्दैन। सही उत्तर २ नम्बरको 사료조 (दाना राख्ने डुँड/भाँडो) हो।"}, {"n": "380", "q": "건초나 풀처럼 가축에게 먹이는 거친 사료를 말합니다. 주로 소나 양 같은 초식 가축에게 주며, 예를 들어 볏짚, 건초, 옥수수 줄기, 청초 등이 있습니다.", "options": ["조사료", "미네랄", "습사료", "곡물"], "answer": 0, "explain": "१. 조사료 भनेको खस्रो आहारा (घाँस, पराल आदि) हो, त्यसैले यो सही उत्तर हो। २. 미네랄 भनेको खनिज पदार्थ हो, त्यसैले यो मिल्दैन। ३. 습사료 भनेको ओसिलो वा झोलयुक्त दाना हो, त्यसैले यो मिल्दैन। ४. 곡물 भनेको अन्नबाली हो, त्यसैले यो मिल्दैन। सही उत्तर १ नम्बरको 조사료 (खस्रो आहारा) हो।"}, {"n": "381", "q": "자루가 달려 있는 그릇이나 도구로, 물건을 담거나 퍼내는 데 사용하는 도구입니다. 주로 물이나 곡물, 사료 등을 퍼내거나 담는 데 사용됩니다.", "options": ["양동이", "바가지", "손수레", "프라이팬"], "answer": 1, "explain": "१. 양동이 भनेको बाल्टी हो, त्यसैले यो मिल्दैन। २. 바가지 भनेको पानी वा दाना उघाउने डुडुल्को वा पहेँलो बाटाजस्तो भाँडो हो, त्यसैले यो सही उत्तर हो। ३. 손수레 भनेको हाते ठेला हो, त्यसैले यो मिल्दैन। ४. 프라이팬 भनेको कराैँ (तवा) हो, त्यसैले यो मिल्दैन। सही उत्तर २ नम्बरको 바가지 (उघाउने भाँडो) हो।"}, {"n": "382", "q": "가축을 기르는 건물이나 공간을 의미합니다. 보통 소, 돼지, 양, 닭 등 가축을 키우기 위해 만들어진 건물로, 가축들이 편하게 지낼 수 있도록 설계됩니다.", "options": ["농장", "공장", "축사", "과수원"], "answer": 2, "explain": "१. 농장 भनेको कृषि फर्म हो, त्यसैले यो मिल्दैन। २. 공장 भनेको कारखाना हो, त्यसैले यो मिल्दैन। ३. 축사 भनेको पशुपक्षी पाल्ने गोठ (खोर) हो, त्यसैले यो सही उत्तर हो। ४. 과수원 भनेको फलफूल बगैंचा हो, त्यसैले यो मिल्दैन। सही उत्तर ३ नम्बरको 축사 (गोठ/खोर) हो।"}, {"n": "383", "q": "보통 물고기를 잡을 때 쓰는 수단으로 노끈이나 실, 쇠줄 따위로 여러 구멍이 나게 엮은 물건입니다.", "options": ["통발", "그물", "갈퀴", "밧줄"], "answer": 1, "explain": "१. 통발 भनेको माछा समात्ने थुन्से आकारको पासो हो, त्यसैले यो मिल्दैन। २. 그물 भनेको माछा समात्ने जालो हो, त्यसैले यो सही उत्तर हो। ३. 갈퀴 भनेको घाँस वा पात बटुलुवा हो, त्यसैले यो मिल्दैन। ४. 밧줄 भनेको डोरी हो, त्यसैले यो मिल्दैन। सही उत्तर २ नम्बरको 그물 (जाल) हो।"}, {"n": "384", "q": "어업에서 물고기를 잡는 그물을 걷어올리는데 사용되는 기계입니다.", "options": ["집어등", "양망기", "바늘대", "밧줄"], "answer": 1, "explain": "१. 집어등 भनेको माछा तान्ने बत्ती हो, त्यसैले यो मिल्दैन। २. 양망기 भनेको माछा मार्ने जालो तान्ने मेसिन हो, त्यसैले यो सही उत्तर हो। ३. 바늘대 भनेको बत्तीको सिन्का वा सुई राख्ने साधन हो, त्यसैले यो मिल्दैन। ४. 밧줄 भनेको डोरी हो, त्यसैले यो मिल्दैन। सही उत्तर २ नम्बरको 양망기 (जाल तान्ने मेसिन) हो।"}, {"n": "385", "q": "물고기나 해양 생물을 잡는 그물 형태의 덫입니다. 보통 원통 모양으로 생겼고, 입구가 좁아 생물이 들어가면 나오기 어렵도록 설계되어 있습니다.", "options": ["닻", "뜰채", "부표", "통발"], "answer": 3, "explain": "१. 닻 भनेको लङ्गर हो, यो जहाजलाई एकै ठाउँमा रोक्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। २. 뜰채 भनेको हात जाली हो, यो पानीबाट माछा उठाउन प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ३. 부표 भनेको तैरिने भुवा हो, यो स्थान जनाउन प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ४. 통발 भनेको ढडिया हो, यो बेलनाकार आकारको माछा समात्ने पासो भएकाले विवरणसँग सही मिल्छ। त्यसैले सही उत्तर ४ नम्बरको 통발 हो।"}, {"n": "386", "q": "물속에서 물고기나 다른 수생 생물을 잡는 도구입니다. 주로 연못이나 작은 호수에서 물고기를 잡을 때 사용되며, 낚시나 수산업에서 자주 사용됩니다.", "options": ["뜰채", "밧줄", "그물", "바늘대"], "answer": 0, "explain": "१. 뜰채 भनेको सानो जाली वा छिपो हो जसले पानीभित्रका जीवहरू समात्छ, त्यसैले यो सही उत्तर हो। २. 밧줄 भनेको डोरी हो, त्यसैले यो मिल्दैन। ३. 그물 भनेको ठूलो जाल हो, त्यसैले यो मिल्दैन। ४. 바늘대 भनेको सुई हो, त्यसैले यो मिल्दैन। सही उत्तर १ नम्बरको 뜰채 (सानो जाली/छिपो) हो।"}, {"n": "387", "q": "햇빛이나 강한 조명을 차단하여 실내 온도 조절이나 눈부심 방지에 사용하는 막입니다. 주로 비닐하우스, 창문, 어업용 어 등에 활용됩니다.", "options": ["갑판", "부표", "바늘대", "차광막"], "answer": 3, "explain": "१. 갑판 भनेको जहाजको डेक हो, त्यसैले यो मिल्दैन। २. 부표 भनेको पानीमा तैरिने बुइो हो, त्यसैले यो मिल्दैन। ३. 바늘대 भनेको सुई वा सोसम्बन्धी साधन हो, त्यसैले यो मिल्दैन। ४. 차광막 भनेको घाम छेक्ने जाली (शेड नेट) हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ नम्बरको 차광막 (घाम छेक्ने जाली) हो।"}, {"n": "388", "q": "보통 그물을 칠 때 사용하는 실이나 줄을 한쪽 끝에 걸어서 날 속으로 들여 지르는 가늘고 길쭉한 막대기입니다.", "options": ["닻", "고리", "도르래", "바늘대"], "answer": 3, "explain": "१. 닻 भनेको लंगर हो, त्यसैले यो मिल्दैन। २. 고리 भनेको रिङ वा कडी हो, त्यसैले यो मिल्दैन। ३. 도르래 भनेको घिर्नी हो, त्यसैले यो मिल्दैन। ४. 바늘대 भनेको जाल बुन्ने वा छिराउने सिन्का वा साधन हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ नम्बरको 바늘대 (जाल बुन्ने/सिउने सिन्का) हो।"}, {"n": "389", "q": "물이나 약제를 높은 압력으로 뿌려 세척, 농약 살포 등에 사용하는 장비입니다. 강한 압력 덕분에 먼지, 오염물, 해충 등을 효과적으로 제거할 수 있습니다.", "options": ["양망기", "차광막", "고압 호스", "고압 분사기"], "answer": 3, "explain": "१. 양망기 भनेको जाल तान्ने मेसिन हो, त्यसैले यो मिल्दैन। २. 차광막 भनेको घाम छेक्ने जाली हो, त्यसैले यो मिल्दैन। ३. 고압 호스 भनेको उच्च चापको पाइप हो, त्यसैले यो मिल्दैन। ४. 고압 분사기 भनेको उच्च चापमा पानी वा औषधि छ्याप्ने यन्त्र हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ नम्बरको 고압 분사기 (उच्च चापको स्प्रेयर) हो।"}, {"n": "390", "q": "물고기, 조개, 해조류 등을 인공적으로 기르기 위해 바다나 강, 호수 등에 설치한 시설입니다. 어업에서 안정적인 수산물 생산을 위해 중요한 역할을 합니다.", "options": ["농장", "닭장", "양식장", "양계장"], "answer": 2, "explain": "१. 농장 भनेको कृषि फर्म हो, त्यसैले यो मिल्दैन। २. 닭장 भनेको कुखुराको खोर हो, त्यसैले यो मिल्दैन। ३. 양식장 भनेको माछा वा सामुद्रिक जीव पालन गर्ने केन्द्र (फिश फार्म) हो, त्यसैले यो सही उत्तर हो। ४. 양계장 भनेको कुखुरा पालन फर्म हो, त्यसैले यो मिल्दैन। सही उत्तर ३ नम्बरको 양식장 (जलचर पालन केन्द्र) हो।"}, {"n": "391", "q": "어업에서 양식장 위치나 어망 설치 지점을 표시하기 위해 사용하는 해상 표지입니다. 부력을 이용해 물 위에 떠 있으며 어선의 작업 효율과 안전을 돕습니다.", "options": ["그물", "갑판", "부표", "밧줄"], "answer": 2, "explain": "१. 그물 भनेको जाल हो, यो माछा समात्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। २. 갑판 भनेको जहाजको डेक हो, यो मानिस उभिने वा सामान राख्ने सतह हो, त्यसैले यो विवरणसँग मिल्दैन। ३. 부표 भनेको तैरिने सङ्केत हो, यो पानीमा तैरिएर स्थान वा दिशा देखाउन प्रयोग गरिने भएकाले विवरणसँग सही मिल्छ। ४. 밧줄 भनेको डोरी हो, यो सामान बाँध्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। त्यसैले सही उत्तर ३ नम्बरको 부표 हो।"}, {"n": "392", "q": "물고기나 해산물을 기르거나 보관하기 위해 사용하는 물탱크 형태의 용기입니다. 양식장이나 실내 사육 시설에서 주로 사용됩니다.", "options": ["구조", "수조", "부표", "통발"], "answer": 1, "explain": "१. 구조 भनेको उद्धार हो, यो खतराबाट बचाउने कार्य हो, त्यसैले यो विवरणसँग मिल्दैन। २. 수조 भनेको पानीको ट्याङ्की हो, यो माछा वा सामुद्रिक जीव पाल्न र राख्न प्रयोग गरिने भाँडो भएकाले विवरणसँग सही मिल्छ। ३. 부표 भनेको तैरिने सङ्केत हो, यो पानीमा तैरिएर स्थान देखाउन प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ४. 통발 भनेको ढडिया हो, यो माछा समात्ने पासो हो, त्यसैले यो विवरणसँग मिल्दैन। त्यसैले सही उत्तर २ नम्बरको 수조 हो।"}, {"n": "393", "q": "어류나 해산물이 자라는 양식장에서 물 속에 산소를 공급하여 생물들이 건강하게 자랄 수 있도록 돕는 장비입니다.", "options": ["양식장", "산소 공급기", "고압 분사기", "낚시 바늘"], "answer": 1, "explain": "१. 양식장 भनेको माछा पालन गर्ने फार्म हो, त्यसैले यो मिल्दैन। २. 산소 공급기 भनेको अक्सिजन आपूर्ति गर्ने यन्त्र हो जसले पानीमा अक्सिजन दिन्छ, त्यसैले यो सही उत्तर हो। ३. 고압 분사기 भनेको उच्च दबाबको पानी छ्याप्ने मेसिन हो, त्यसैले यो मिल्दैन। ४. 낚시 바늘 भनेको बल्छिको काँटी हो, त्यसैले यो मिल्दैन। सही उत्तर 산소 공급기 हो जसको अर्थ अक्सिजन आपूर्ति गर्ने यन्त्र हो।"}, {"n": "394", "q": "체온이나 물의 온도를 측정하는 도구로 주로 병원, 가정, 또는 양식장이나 어업에서 사용됩니다.", "options": ["계산기", "청소기", "온도계", "체중계"], "answer": 2, "explain": "१. 계산기 भनेको क्याल्कुलेटर हो, त्यसैले यो मिल्दैन। २. 청소기 भनेको भ्याकुम क्लिनर हो, त्यसैले यो मिल्दैन। ३. 온도계 भनेको तापक्रम नाप्ने थर्मामिटर हो, त्यसैले यो सही उत्तर हो। ४. 체중계 भनेको तौल नाप्ने मेसिन हो, त्यसैले यो मिल्दैन। सही उत्तर 온도계 हो जसको अर्थ तापक्रम नाप्ने यन्त्र हो।"}, {"n": "395", "q": "선박을 설계하고 건조하는 산업으로, 상선, 어선, 군함 등 다양한 종류의 배를 제작합니다. 강한 기술력과 정밀한 공정이 요구되며, 해운과 수산업 발전에 중요한 역할을 합니다.", "options": ["농업", "제조업", "조선업", "축산업"], "answer": 2, "explain": "१. 농업 भनेको कृषि हो, त्यसैले यो मिल्दैन। २. 제조업 भनेको उत्पादन उद्योग हो, त्यसैले यो मिल्दैन। ३. 조선업 भनेको जहाज निर्माण गर्ने उद्योग हो, त्यसैले यो सही उत्तर हो। ४. 축산업 भनेको पशुपालन हो, त्यसैले यो मिल्दैन। सही उत्तर 조선업 हो जसको अर्थ जहाज निर्माण उद्योग हो।"}, {"n": "396", "q": "선박의 항로를 조정하는 곳으로, 선박의 운항을 관리하는 공간입니다. 선장과 조타수가 항해 중 선박의 방향을 조정하고 운항을 통제하는 중요한 역할을 합니다.", "options": ["조타실", "선원실", "선수부", "중앙부"], "answer": 0, "explain": "१. 조타실 भनेको जहाजको स्टेयरिङ कक्ष वा ह्वील हाउस हो जहाँबाट जहाजको दिशा नियन्त्रण गरिन्छ, त्यसैले यो सही उत्तर हो। २. 선원실 भनेको नाविकहरूको कोठा हो, त्यसैले यो मिल्दैन। ३. 선수부 भनेको जहाजको अगाडिको भाग हो, त्यसैले यो मिल्दैन। ४. 중앙부 भनेको मध्य भाग हो, त्यसैले यो मिल्दैन। सही उत्तर 조타실 हो जसको अर्थ जहाज सञ्चालन कक्ष हो।"}, {"n": "397", "q": "선박에서 선원들이 생활하는 공간입니다. 주로 숙소 역할을 하며, 선원들이 휴식, 식사, 개인적인 시간을 보내는 장소로 사용됩니다.", "options": ["조타실", "선원실", "선수부", "중앙부"], "answer": 1, "explain": "१. 조타실 भनेको जहाज चलाउने कक्ष हो, त्यसैले यो मिल्दैन। २. 선원실 भनेको नाविकहरू बस्ने, सुत्ने र आराम गर्ने कोठा हो, त्यसैले यो सही उत्तर हो। ३. 선수부 भनेको जहाजको अगाडिको भाग हो, त्यसैले यो मिल्दैन। ४. 중앙부 भनेको मध्य भाग हो, त्यसैले यो मिल्दैन। सही उत्तर 선원실 हो जसको अर्थ नाविक कक्ष हो।"}, {"n": "398", "q": "선박의 뒷부분을 의미합니다. 선박의 추진기나 조타 장치가 위치해 있으며, 항해 중 선박의 방향을 조정하는 중요한 역할을 합니다.", "options": ["양망기", "통발", "선미부", "도료 호스"], "answer": 2, "explain": "1. 양망기 भनेको जाल तान्ने मेसिन हो, त्यसैले यो जहाजको पछाडिको भाग होइन।\n2. 통발 भनेको माछा समात्ने ढोक्सी हो, त्यसैले यो विवरणसँग मिल्दैन।\n3. 선미부 भनेको जहाजको पछाडिको भाग हो, जुन दिशा मोड्ने र पछाडि रहने भागको विवरणसँग एकदम मिल्छ।\n4. 도료 호스 भनेको रङ लगाउने पाइप हो, त्यसैले यो सही उत्तर होइन।\nतसर्थ, सही उत्तर ३ नम्बरको 선미부 (जहाजको पछाडिको भाग) हो।"}, {"n": "399", "q": "선박의 중간 부분을 말합니다. 선박의 균형을 맞추는 데 중요한 역할을 하며, 화물 공간이나 승객실이 위치할 수 있습니다.", "options": ["중앙부", "그물", "선체", "갑판"], "answer": 0, "explain": "1. 중앙부 भनेको मध्य भाग हो, जुन जहाजको बीचको भाग भन्ने विवरणसँग एकदम मिल्छ।\n2. 그물 भनेको माछा मार्ने जाल हो, त्यसैले यो जहाजको भाग होइन।\n3. 선체 भनेको जहाजको मुख्य जिउ वा ढाँचा हो, त्यसैले यसले बीचको भागलाई मात्र जनाउँदैन।\n4. 갑판 भनेको जहाजको डेक वा भुइँ हो, त्यसैले यो बीचको भाग भन्ने विवरणसँग मिल्दैन।\nतसर्थ, सही उत्तर १ नम्बरको 중앙부 (मध्य भाग) हो।"}, {"n": "400", "q": "선박이나 항공기의 추진력을 생성하는 장치로, 회전하면서 물이나 공기를 밀어내어 이동을 돕습니다. 선박에서는 엔진의 동력을 받아 회전하며, 선박을 앞으로 나가게 합니다.", "options": ["조타실", "프로펠러", "양망기", "비계기둥"], "answer": 1, "explain": "१. 조타실 भनेको जहाज चलाउने कोठा हो, त्यसैले यो मिल्दैन। २. 프로펠러 भनेको प्रोपेलर वा पंखा हो जसले पानी वा हावा धकेलेर जहाजलाई अगाडि बढाउँछ, त्यसैले यो सही उत्तर हो। ३. 양망기 भनेको जालो तान्ने यन्त्र हो, त्यसैले यो मिल्दैन। ४. 비계기둥 भनेको मचानको खाम्बा हो, त्यसैले यो मिल्दैन। सही उत्तर 프로펠러 हो जसको अर्थ प्रोपेलर हो।"}, {"n": "401", "q": "어떤 물체나 구조물의 표면이 갈라져 금이 가는 상태입니다. 주로 건축물, 도로, 유리, 땅 등의 표면에 생기는 좁고 길게 벌어진 틈을 가리킵니다.", "options": ["균열", "물기", "부식", "녹"], "answer": 0, "explain": "1. 균열 भनेको चर्किएको वा फुटेको भाग हो, जुन सतहमा मसिनो रेखा जस्तै फाट्ने विवरणसँग एकदम मिल्छ।\n2. 물기 भनेको ओस वा पानीको मात्रा हो, त्यसैले यो चर्किएको अवस्था होइन।\n3. 부식 भनेको धातु खिइने वा नष्ट हुने प्रक्रिया हो, त्यसैले यो विवरणसँग मिल्दैन।\n4. 녹 भनेको फलाममा लाग्ने खिया हो, त्यसैले यो पनि सही होइन।\nतसर्थ, सही उत्तर १ नम्बरको 균열 (चर्किएको भाग) हो।"}, {"n": "402", "q": "산화되어 생긴 부식물로, 주로 철이나 강철에서 발생합니다. 이를 방지하기 위해 정기적인 청소와 방청 처리가 필요합니다.", "options": ["면적", "물기", "폭", "녹"], "answer": 3, "explain": "1. 면적 भनेको क्षेत्रफल हो, त्यसैले यो फलाममा लाग्ने वस्तु होइन।\n2. 물기 भनेको ओस वा पानीको मात्रा हो, त्यसैले यो विवरणसँग मिल्दैन।\n3. 폭 भनेको चौडाइ हो, त्यसैले यो पनि सही उत्तर होइन।\n4. 녹 भनेको फलाममा लाग्ने खिया हो, जुन अक्सिजन र पानीको सम्पर्कले हुने खियाको विवरणसँग एकदम मिल्छ।\nतसर्थ, सही उत्तर ४ नम्बरको 녹 (खिया) हो।"}, {"n": "403", "q": "선박이나 다른 시설에서 안전을 위해 설치된 보호용 장치입니다. 주로 선박의 갑판이나 계단, 출입구 등에 설치되어 승객이나 선원이 떨어지는 사고를 방지하는 역할을 합니다.", "options": ["프로펠러", "도료 호스", "안전난간", "작업발판"], "answer": 2, "explain": "1. 프로펠러 भनेको जहाज गुडाउने पंखा हो, त्यसैले यो सुरक्षा बार होइन।\n2. 도료 호스 भनेको रङ लगाउने पाइप हो, त्यसैले यो विवरणसँग मिल्दैन।\n3. 안전난간 भनेको सुरक्षा बार हो, जुन मानिसहरू तल खस्नबाट जोगाउने सुरक्षा उपकरणको विवरणसँग एकदम मिल्छ।\n4. 작업발판 भनेको काम गर्दा उभिने प्लेटफर्म हो, त्यसैले यो सुरक्षा बार होइन।\nतसर्थ, सही उत्तर ३ नम्बरको 안전난간 (सुरक्षा बार) हो।"}, {"n": "404", "q": "선박이나 건설 현장 등에서 작업자가 안전하게 작업을 할 수 있도록 설치된 평평한 표면입니다. 작업 중에 대 위에 서서 작업할 수 있도록 줍니다.", "options": ["비계기둥", "밑둥잡이", "안전난간", "작업발판"], "answer": 3, "explain": "१. '비계기둥' भनेको स्काफोल्डिङको खम्बा हो, यो टेकेर उभिने समथर भाग होइन।\n२. '밑둥잡이' भनेको तल्लो भाग अड्याउने काठ वा खाँबो हो, यो कामदार उभिने ठाउँ होइन।\n३. '안전난간' भनेको सुरक्षा रेलिङ हो, यसले खस्नबाट जोगाउँछ तर उभिने सतह होइन।\n४. '작업발판' भनेको काम गर्ने फल्याक वा समथर प्लेटफर्म हो, जसमा उभिएर कामदारले सुरक्षित रूपमा काम गर्न सक्छन्, त्यसैले यो सही विवरण हो।\nत्यसैले सही उत्तर ४ नम्बरको '작업발판' (काम गर्ने फल्याक) हो।"}, {"n": "405", "q": "작업 현장이나 선박 등에서 작업자의 안전과 편의를 위해 바닥에 까는 단단하고 평평한 판입니다. 미끄럼 방지나 충격 완화, 바닥 보호 등의 역할을 합니다.", "options": ["가세", "깔판", "띠장", "면적"], "answer": 1, "explain": "१. '가세' भनेको तिरछा टेको हो, जसले संरचनालाई अड्याउँछ तर भुइँमा ओछ्याउने पाटा होइन।\n२. '깔판' भनेको भुइँमा ओछ्याउने म्याट वा पाटा हो, जसले चिप्लिनबाट जोगाउँछ र भुइँको रक्षा गर्छ, त्यसैले यो सही विवरण हो।\n३. '띠장' भनेको तेर्सो बीम हो, यो भुइँमा ओछ्याउने पाटा होइन।\n४. '면적' भनेको क्षेत्रफल हो, यो कुनै ओछ्याउने सामग्री होइन।\nत्यसैले सही उत्तर २ नम्बरको '깔판' (भुइँमा ओछ्याउने म्याट वा पाटा) हो।"}, {"n": "406", "q": "구조물의 강도를 보강하거나 외부 충격을 분산시키기 위해 설치하는 가로막대 또는 지지재입니다. 선박이나 건설 구조물에서 자주 사용되며, 안정성과 내구성을 높이는 역할을 합니다.", "options": ["기둥", "깔판", "띠장", "장선"], "answer": 2, "explain": "१. 기둥 भनेको खम्भा हो, यो ठाडो भार थाम्न प्रयोग हुन्छ र वर्णन गरिएको तेर्सो बार होइन। २. 깔판 भनेको भुइँमा राख्ने फट्टा वा म्याट हो, यो बलियो बनाउने तेर्सो बार वा सपोर्ट होइन। ३. 띠장 भनेको संरचनाको बलियोपन बढाउन वा बाह्य धक्का छर्रन राखिने तेर्सो बार वा सपोर्ट हो, त्यसैले यो सही उत्तर हो। ४. 장선 भनेको ढलान वा फ्लोर जोइस्ट हो, यो मुख्यतया फ्लोरको भार थाम्न हुन्छ। सही उत्तर 띠장 हो जसले संरचनाको शक्ति बढाउँछ।"}, {"n": "407", "q": "선박의 뼈대를 이루는 구조 부재로, 바닥(갑판)을 지지하기 위해 가로 방향으로 설치됩니다. 선체의 강도를 높이고, 갑판 하중을 고르게 분산시키는 역할을 합니다.", "options": ["가세", "난간", "균열", "장선"], "answer": 3, "explain": "१. 가세 भनेको छड्के टेको (ब्रेस) हो, यो तेर्सो दिशामा राखिने डेक सपोर्ट होइन। २. 난간 भनेको रेलिङ हो, यो सुरक्षाका लागि छेउमा राखिन्छ। ३. 균열 भनेको चिरा वा धाँजा (क्र्याक) हो, यो संरचनात्मक भाग होइन। ४. 장선 भनेको जहाज वा निर्माणमा भुइँ वा डेकलाई टेवा दिन तेर्सो दिशामा राख지는 स्ट्रक्चरल मेम्बर हो, त्यसैले यो सही उत्तर हो। सही उत्तर 장선 हो।"}, {"n": "408", "q": "구조물의 강도를 보강하기 위해 설치하는 보조 부재입니다. 선박에서는 장선이나 기둥 등이 받는 힘을 분산시키고 구조적 안정성을 높이기 위해 사용됩니다.", "options": ["가세", "깔판", "띠장", "면적"], "answer": 0, "explain": "१. 가세 भनेको संरचनाको शक्ति बढाउन राखिने सहायक सदस्य वा छड्के टेको (ब्रेस) हो, त्यसैले यो सही उत्तर हो। २. 깔판 भनेको आधारमा राखिने फट्टा वा म्याट हो। ३. 띠장 भनेको तेर्सो बार हो। ४. 면적 भनेको क्षेत्रफल हो। सही उत्तर 가세 हो।"}, {"n": "409", "q": "재배할 때, 외부 환경(온도, 습도, 바람 등)으로부터 보호하기 위해 비닐을 씌워 만든 임시 또는 반영구적인 구조물입니다.", "options": ["비닐하우스", "울타리망", "방열복", "차광막"], "answer": 0, "explain": "१. 비닐하우스 भनेको बिरुवा खेती गर्दा बाह्य वातावरणबाट बचाउन प्लास्टिकले छोपेर बनाइएको संरचना हो, त्यसैले यो सही उत्तर हो। २. 울타리망 भनेको बार वा जाली हो। ३. 방열복 भनेको तातोबाट बचाउने पोसाक हो। ४. 차광막 भनेको घाम छेक्ने जाली हो। सही उत्तर 비닐하우스 हो।"}, {"n": "410", "q": "구조물이나 장비를 안정적으로 버티고 지탱하기 위해 설치하는 부재입니다. 선박에서는 장비 고정, 작업 안정, 구조물 보강 등 다양한 용도로 사용됩니다.", "options": ["지지대", "대각선", "구조물", "중앙부"], "answer": 0, "explain": "१. 지지대 भनेको संरचना वा उपकरणलाई स्थिर रूपमा थाम्न राखिने टेको वा सपोर्ट हो, त्यसैले यो सही उत्तर हो। २. 대각선 भनेको कर्णाकार वा छड्के रेखा हो। ३. 구조물 भनेको संरचना हो। ४. 중앙부 भनेको केन्द्रीय भाग हो। सही उत्तर 지지대 हो।"}, {"n": "411", "q": "땅속에서 캐내는 소중한 자원으로, 암석이나 금속처럼 쓸모 있는 것입니다. 예를 들면 철, 금, 석탄 같은 것이 있고, 이것들은 공장이나 건설, 전기 만들기에 쓰입니다.", "options": ["삼림 보호", "광물 자원", "온실 가스", "천연자원"], "answer": 1, "explain": "१. 삼림 보호 भनेको जङ्गल संरक्षण हो। २. 광물 자원 भनेको खनिज साधन हो, जुन जमिनमुनिबाट निकालिने फलाम, सुन, कोइला जस्ता उपयोगी वस्तु हुन्, त्यसैले यो सही उत्तर हो। ३. 온실 가스 भनेको हरितगृह ग्यास हो। ४. 천연자원 भनेको प्राकृतिक स्रोत हो (यो अलि फराकिलो अर्थ हुन्छ तर खनिजलाई विशेष रूपमा 광물 자원 भनिन्छ)। सही उत्तर 광물 자원 हो।"}, {"n": "412", "q": "갱도의 입구로, 즉 땅속으로 들어가는 통로나 문을 말합니다. 작업자나 장비가 드나들고, 공기가 드나드는 중요한 장소입니다.", "options": ["광부", "수갱", "갱구", "갱도"], "answer": 2, "explain": "१. 광부 भनेको खानी मजदुर हो। २. 수갱 भनेको ठाडो सुरुङ हो। ३. 갱구 भनेको सुरुङको मुख वा प्रवेशद्वार हो, जहाँबाट मानिस, उपकरण र हावा आवतजावत गर्छ, त्यसैले यो सही उत्तर हो। ४. 갱도 भनेको सुरुङ हो। सही उत्तर 갱구 हो।"}, {"n": "413", "q": "지하에서 물을 퍼내거나, 지하수를 채굴하기 위해 파는 구멍이나 갱도를 말합니다. 주로 광산이나 건설 현장에서 지하수 문제를 해결하기 위해 사용됩니다.", "options": ["사갱", "수갱", "갱구", "광차"], "answer": 1, "explain": "१. 사갱 भनेको छड्के सुरुङ हो। २. 수갱 भनेको जमिनमुनिबाट पानी फाल्न वा भूमिगत पानी निकाल्न खनिएको ठाडो सुरुङ वा प्वाल हो, त्यसैले यो सही उत्तर हो। ३. 갱구 भनेको सुरुङको मुख हो। ४. 광차 भनेको कोइला वा खनिज बोक्ने गाडी हो। सही उत्तर 수갱 हो।"}, {"n": "414", "q": "광물 자원을 채굴하기 위해 수직으로 파는 갱도를 말합니다. 주로 깊은 곳에 있는 광석을 캐내기 위해 사용되며, 작업자나 자재를 운반하는 통로로 활용됩니다.", "options": ["사갱", "수갱", "탄광", "광차"], "answer": 1, "explain": "१. 사갱 भनेको छड्के सुरुङ हो। २. 수갱 भनेको खनिज निकाल्नका लागि ठाडो रूपमा खनिएको सुरुङ हो, जसले मजदुर र सामग्री ओसार्न सघाउँछ, त्यसैले यो सही उत्तर हो। ३. 탄광 भनेको कोइला खानी हो। ४. 광차 भनेको खानीको गाडी हो। सही उत्तर 수갱 हो।"}, {"n": "415", "q": "채광장은 광물을 캐내기 위해 만들어진 장소입니다. 광석, 석탄 등을 채굴하는 광산이나 채굴 현장을 말합니다.", "options": ["인차", "수갱", "탄광", "막장"], "answer": 3, "explain": "१. 인차 भनेको मानिस बोक्ने गाडी हो। २. 수갱 भनेको ठाडो सुरुङ हो। ३. 탄광 भनेको कोइला खानी हो। ४. 막장 भनेको खानीमा खनिज खन्ने मुख्य ठाउँ वा च्यानल (채광장) हो, त्यसैले यो सही उत्तर हो। सही उत्तर 막장 हो।"}, {"n": "416", "q": "광산에서 광물을 채굴하는 일을 하는 사람을 말합니다. 땅속에서 자원을 캐내는 일을 하며, 작업이 위험하고 힘든 경우가 많습니다.", "options": ["주부", "광부", "농부", "어부"], "answer": 1, "explain": "१. 주부 भनेको गृहणी हो। २. 광부 भनेको खानी मजदुर हो, जसले जमिनमुनिबाट खनिज खन्ने काम गर्छ, त्यसैले यो सही उत्तर हो। ३. 농부 भनेको किसान हो। ४. 어부 भनेको माछा मार्ने मानिस हो। सही उत्तर 광부 हो।"}, {"n": "417", "q": "광산에서 작업자를 데리고 다니는 차량입니다. 광산 내에서 작업자들이 이동할 때 사용하는 이동 수단입니다.", "options": ["수레", "막장", "인차", "광차"], "answer": 2, "explain": "१. '수레' भनेको हातले घकेल्ने गाडा हो, यो खानीमा मानिस ओसार्ने गाडी होइन।\n२. '막장' भनेको खानीको अन्तिम खन्ने ठाउँ हो, यो सवारी साधन होइन।\n३. '인차' भनेको खानीभित्र कामदारहरूलाई ल्याउने र लैजाने गाडी हो, त्यसैले यो सही विवरण हो।\n४. '광차' भनेको खनिज पदार्थ वा कोइला ओसार्ने गाडा हो, मानिस बोक्ने गाडी होइन।\nत्यसैले सही उत्तर ३ नम्बरको '인차' (कामदार बोक्ने खानीको गाडी) हो।"}, {"n": "418", "q": "광산에서 광물을 운반하는 수레나 운반 도구로, 보통 광물이나 자재를 지하에서 지상으로 이동시키는 데 사용됩니다.", "options": ["탄광", "막장", "인차", "광차"], "answer": 3, "explain": "१. '탄광' भनेको कोइला खानी हो, यो सामान ओसार्ने साधन होइन।\n२. '막장' भनेको खानीको अन्तिम सुरुङ क्षेत्र हो, यो गाडी वा गाडा होइन।\n३. '인차' भनेको कामदार बोक्ने गाडी हो, खनिज ओसार्ने गाडा होइन।\n४. '광차' भनेको खानीबाट खनिज र सामग्रीहरू बोकेर ओसार्ने गाडा हो, त्यसैले यो सही विवरण हो।\nत्यसैले सही उत्तर ४ नम्बरको '광차' (खनिज ओसार्ने गाडा) हो।"}, {"n": "419", "q": "광산에서 채굴한 광물이나 자재를 갱도 위로 끌어올리는 기계입니다. 주로 수직으로 설치되어, 광물이나 작업자를 지상으로 안전하게 운반하는 역할을 합니다.", "options": ["권양기", "지지대", "수평경", "재광장"], "answer": 0, "explain": "१. 권양기 भनेको विन्च वाहोइस्ट मेसिन हो, जसले खानीबाट खनिज वा मानिसलाई माथि तान्ने काम गर्छ, त्यसैले यो सही उत्तर हो। २. 지지대 भनेको टेको हो। ३. 수평경 भनेको तेर्सो सुरुङ हो। ४. 재광장 भनेको खानी पुन: सञ्चालन गर्ने ठाउँ हो। सही उत्तर 권양기 हो।"}, {"n": "420", "q": "탄광에서 캐낸 석탄을 분류, 세척, 가공하는 곳입니다. 석탄에 섞인 돌이나 불순물을 제거하고, 용도에 따라 크기나 품질별로 나눠서 저장하거나 운반 준비를 합니다.", "options": ["석회선", "선탄장", "수평경", "재광장"], "answer": 1, "explain": "१. '석회선' भनेको चुना ढुंगाको रेखा वा क्षेत्र हो, कोइला सफा गर्ने ठाउँ होइन।\n२. '선탄장' भनेको कोइला छुट्याउने र सफा गर्ने ठाउँ हो, त्यसैले यो सही विवरण हो।\n३. '수평경' भनेको तेर्सो सुरुङ हो, प्रसोधन केन्द्र होइन।\n४. '재광장' भनेको पुन: खानी क्षेत्र हो, कोइला छान्ने ठाउँ होइन।\nत्यसैले सही उत्तर २ नम्बरको '선탄장' (कोइला छान्ने ठाउँ) हो।"}, {"n": "421", "q": "단단한 암석이나 광맥을 깨뜨리기 위해 사용하는 공구 또는 기계입니다. 주로 광산, 터널, 건설 현장에서 바위를 뚫거나 깨는 데 쓰입니다.", "options": ["청소기", "세탁기", "착암기", "건조기"], "answer": 2, "explain": "१. 청소기 भनेको फोहर सरसफाइ गर्ने भ्याकुम क्लिनर हो, त्यसैले यो चट्टान फुटाउने औजार होइन। २. 세탁기 भनेको लुगा धुने मेसिन हो, त्यसैले यो खानीमा प्रयोग हुने उपकरण होइन। ३. 착암기 भनेको कडा चट्टान वा ढुंगा फुटाउन प्रयोग गरिने मेसिन हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ४. 건조기 भनेको सामान वा लुगा सुकाउने मेसिन हो, त्यसैले यो गलत छ। त्यसैले सही उत्तर ३ नम्बरको 착암기 हो, जसको अर्थ ढुंगा फुटाउने मेसिन हुन्छ।"}, {"n": "422", "q": "광산이나 공장 등에서 물건이나 자재를 자동으로 옮기는 장치입니다. 벨트나 롤러 위에 광물, 석탄, 자재 등을 올려놓으면 연속적으로 이동시켜 작업 효율을 높여줍니다.", "options": ["트플링실", "스크레이퍼", "컨베이어", "안전난간"], "answer": 2, "explain": "१. 트플링실 को अर्थ त्रिपलिंग सिल हो, यो यस विवरणसँग सम्बन्धित छैन त्यसैले मिल्दैन। २. 스크레이퍼 को अर्थ स्क्रैपर हो, यो उत्खनन वा सम्याउने उपकरण हो त्यसैले मिल्दैन। ३. 컨베이어 को अर्थ कन्भेयर बेल्ट हो, यो खानी वा कारखानाहरूमा सामान वा सामग्रीहरू स्वचालित रूपमा सार्ने उपकरण हो त्यसैले यो सही उत्तर हो। ४. 안전난간 को अर्थ सुरक्षा रेलिङ हो, यो खस्नबाट बच्ने बार हो त्यसैले मिल्दैन। सही उत्तर 컨베이어 हो जसको अर्थ कन्भेयर बेल्ट हुन्छ। पहिलो विकल्प '트플링실' किताबमा छापिएजस्तै राखिएको छ।"}, {"n": "423", "q": "땅속에 있는 석탄을 캐내는 작업을 말합니다. 탄광에서 광부들이 석탄을 파내어 운반하는 모든 과정을 포함하며, 광업의 중요한 단계입니다.", "options": ["간격", "탄광", "광부", "채탄"], "answer": 3, "explain": "१. 간격 भनेको दुई वस्तु वा समय बीचको दुरी हो, त्यसैले यो कोइला खन्ने काम होइन। २. 탄광 भनेको कोइला निकालिने खानी हो, तर यो कार्य होइन। ३. 광부 भनेको खानीमा काम गर्ने कामदार हो, तर यो प्रक्रिया होइन। ४. 채탄 भनेको जमिनमुनिबाट कोइला खनेर निकाल्ने कार्य हो, त्यसैले यो विवरणसँग एकदम मिल्छ। त्यसैले सही उत्तर ४ नम्बरको 채탄 हो, जसको अर्थ कोइला खन्ने कार्य हुन्छ।"}, {"n": "424", "q": "숲에서 얻을 수 있는 유용한 자원으로, 나무, 풀, 버섯 같은 것들이 포함됩니다. 목재는 건축, 가구, 연료 등으로 쓰이며, 숲은 공기 정화와 생태계 보호에도 큰 역할을 합니다.", "options": ["문화유산", "산림 자원", "개인 재산", "천연자원"], "answer": 1, "explain": "१. 문화유산 को अर्थ सांस्कृतिक सम्पदा हो, यो जङ्गलका स्रोतसँग सम्बन्धित छैन त्यसैले मिल्दैन। २. 산림 자원 को अर्थ वन स्रोत हो, यो जङ्गलबाट प्राप्त हुने रुख, घाँस, च्याउ आदि उपयोगी स्रोतहरूलाई जनाउँछ त्यसैले यो सही उत्तर हो। ३. 개인 재산 को अर्थ व्यक्तिगत सम्पत्ति हो, यो वन स्रोतको परिभाषा होइन त्यसैले मिल्दैन। ४. 천연자원 को अर्थ प्राकृतिक स्रोत हो, यो धेरै फराकिलो शब्द हो तर विशेष गरी जङ्गलका वस्तुहरूलाई 산림 자원 भनिन्छ त्यसैले यहाँ 산림 자원 मिल्छ। सही उत्तर 산림 자원 हो जसको अर्थ वन स्रोत हुन्छ।"}, {"n": "425", "q": "나무의 뿌리까지 뽑아내는 작업으로, 이식이나 제거할 때 사용됩니다. 주로 조경이나 산림관리에서 이루어집니다.", "options": ["굴취", "갱도", "도장", "채탄"], "answer": 0, "explain": "१. 굴취 को अर्थ रुख वा बिरुवाको जरासहित उखेल्ने काम हो, यो रूखलाई जरादेखि नै निकाल्ने कामसँग सम्बन्धित छ त्यसैले यो सही उत्तर हो। २. 갱도 को अर्थ खानीको सुरुङ हो, यो जमिनमुनिको बाटो हो त्यसैले मिल्दैन। ३. 도장 को अर्थ पेन्टिङ वा रंग लगाउने काम हो, यो रुख उखेल्ने काम होइन त्यसैले मिल्दैन। ४. 채탄 को अर्थ कोइला उत्खनन हो, यो कोइला निकाल्ने काम हो त्यसैले मिल्दैन। सही उत्तर 굴취 हो जसको अर्थ बिरुवा वा रुख जरासहित उखेल्ने काम हुन्छ।"}, {"n": "426", "q": "거칠고 튼튼한 마나 폴리프로필렌 재질로 만든 자루로, 모래, 곡물, 광물, 쓰레기 등을 담아 운반하거나 보관할 때 사용됩니다.", "options": ["담요", "마대", "배낭", "가방"], "answer": 1, "explain": "१. 담요 भनेको ओढ्ने कम्बल हो, त्यसैले यो सामान ओसार्ने बोरा होइन। २. 마대 भनेको जुट वा बलियो प्लास्टिकबाट बनेको बोरा हो, जुन बालुवा वा अन्न राख्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग एकदम मिल्छ। ३. 배낭 भनेको ढाडमा बोक्ने झोला हो, त्यसैले यो ठूलो बोरा होइन। ४. 가방 भनेको सामान राख्ने सामान्य झोला हो, त्यसैले यो पनि सही होइन। त्यसैले सही उत्तर २ नम्बरको 마대 हो, जसको अर्थ बलियो बोरा हुन्छ।"}, {"n": "427", "q": "산림에서 나무를 베어내는 작업을 말합니다. 목재를 얻거나, 땅을 다른 용도로 사용하기 위해 나무를 베며, 계획적이지 않으면 산림 파괴의 원인이 될 수 있습니다.", "options": ["운재", "청소", "벌목", "집재"], "answer": 2, "explain": "१. 운재 को अर्थ काठ ढुवानी हो, यो काटिसकेको काठ सार्ने काम हो त्यसैले मिल्दैन। २. 청소 को अर्थ सरसफाइ हो, यो फोहोर सफा गर्ने काम हो त्यसैले मिल्दैन। ३. 벌목 को अर्थ रुख काट्ने काम (फँडानी) हो, यो वनबाट रुखहरू काट्ने कामलाई जनाउँछ त्यसैले यो सही उत्तर हो। ४. 집재 को अर्थ काठ थुपार्ने काम हो, यो काटेका काठ एक ठाउँमा जम्मा गर्ने काम हो त्यसैले मिल्दैन। सही उत्तर 벌목 हो जसको अर्थ रुख काट्ने काम हुन्छ।"}, {"n": "428", "q": "나무를 정리하거나 쌓아 놓은 재목을 뜻합니다. 주로 산림 작업이나 목재 생산 과정에서 사용되는 말로, 잘라낸 나무를 가공이나 운반을 위해 정리해 놓은 상태를 말합니다.", "options": ["운재", "조재", "벌목", "수확"], "answer": 1, "explain": "१. 운재 को अर्थ काठ ढुवानी हो, यो काठ ओसार्ने काम हो त्यसैले मिल्दैन। २. 조재 को अर्थ काठ मिलाउने वा छाँट्ने काम हो, यो काटेका रुखहरूलाई प्रयोगयोग्य बनाउन मिलाएर राख्ने वा साइज काट्ने काम हो त्यसैले यो सही उत्तर हो। ३. 벌목 को अर्थ रुख काट्ने काम हो, यो रुख ढाल्ने काम हो त्यसैले मिल्दैन। ४. 수확 को अर्थ बाली भित्र्याउने वा कटनी गर्ने काम हो, यो कृषि उत्पादनसँग सम्बन्धित छ त्यसैले मिल्दैन। सही उत्तर 조재 हो जसको अर्थ काठ मिलाएर राख्ने वा छाँट्ने काम हुन्छ।"}, {"n": "429", "q": "산림 작업에서 나무를 자른 후, 정리된 나무를 산 밖이나 가공 장소까지 옮기는 과정을 말합니다.", "options": ["청소", "굴취", "벌목", "운재"], "answer": 3, "explain": "१. 청소 को अर्थ सरसफाइ हो, यो जङ्गल सफा गर्ने काम होइन त्यसैले मिल्दैन। २. 굴취 को अर्थ रुख जरासहित उखेल्ने काम हो, यो ढुवानीसँग सम्बन्धित छैन त्यसैले मिल्दैन। ३. 벌목 को अर्थ रुख काट्ने काम हो, यो रुख ढाल्ने काम हो त्यसैले मिल्दैन। ४. 운재 को अर्थ काठ ढुवानी हो, यो जङ्गलबाट काटिएका काठहरू बाहिर वा प्रशोधन गर्ने ठाउँसम्म ओसार्ने काम हो त्यसैले यो सही उत्तर हो। सही उत्तर 운재 हो जसको अर्थ काठ ढुवानी हुन्छ।"}, {"n": "430", "q": "회전하는 톱날이 달린 쇠사슬을 이용해 나무를 자르는 기계입니다. 강한 나무도 빠르고 효율적으로 절단할 수 있어서 산림 작업에서 중요한 도구입니다.", "options": ["하베스터", "집재장", "체인톱", "벌채지"], "answer": 2, "explain": "१. 하베스터 को अर्थ हार्वेस्टर (रुख काट्ने मेशिन) हो, यो बहु-कार्यकारी वन मेशिन हो त्यसैले मिल्दैन। २. 집재장 को अर्थ काठ थुपार्ने ठाउँ हो, यो मेशिन होइन त्यसैले मिल्दैन। ३. 체인톱 को अर्थ चेनसा (सिक्री आरा) हो, यो घुम्ने दाँत भएको सिक्री प्रयोग गरेर रुख काट्ने मेशिन हो त्यसैले यो सही उत्तर हो। ४. 벌채지 को अर्थ रुख काटिएको क्षेत्र हो, यो ठाउँको नाम हो त्यसैले मिल्दैन। सही उत्तर 체인톱 हो जसको अर्थ चेनसा हुन्छ। किताबमा पहिलो विकल्प '하베스타' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '하베스터' हो।"}, {"n": "431", "q": "벌목한 나무들을 모아두는 장소입니다. 산속에서 베어 낸 나무들을 운반하기 전에 한곳에 모아 정리하고, 이후에 운재를 쉽게 할 수 있도록 마련된 공간입니다.", "options": ["운동장", "집재장", "경기장", "양식장"], "answer": 1, "explain": "१. 운동장 को अर्थ खेल मैदान हो, यो वनको कामसँग सम्बन्धित छैन त्यसैले मिल्दैन। २. 집재장 को अर्थ काठ जम्मा गर्ने ठाउँ हो, यो जङ्गलमा काटेका रुखहरू ढुवानी गर्नु अघि एक ठाउँमा थुपारेर राख्ने ठाउँ हो त्यसैले यो सही उत्तर हो। ३. 경기장 को अर्थ खेलकुद स्थल हो, यो मिल्दैन। ४. 양식장 को अर्थ माछापालन वा सीपपालन गर्ने ठाउँ हो, यो मिल्दैन। सही उत्तर 집재장 हो जसको अर्थ काठ थुपार्ने ठाउँ हुन्छ।"}, {"n": "432", "q": "나무를 베고, 가지를 치고, 길이대로 자르는 작업을 자동으로 하는 산림 기계입니다. 벌목, 조재, 집재 과정을 빠르고 효율적으로 처리할 때 사용됩니다.", "options": ["하베스터", "집재장", "크레인", "지게차"], "answer": 0, "explain": "१. 하베스터 भनेको रुख ढाल्ने, हाँगा काट्ने र काठ टुक्र्याउने स्वचालित मेसिन हो, त्यसैले यो विवरणसँग एकदम मिल्छ। २. 집재장 भनेको काटिएका काठहरू जम्मा गर्ने ठाउँ हो, त्यसैले यो मेसिन होइन। ३. 크레인 भनेको गह्रौँ सामान उठाउने मेसिन हो, त्यसैले यो रुख काट्ने उपकरण होइन। ४. 지게차 भनेको सामान बोक्ने मेसिन हो, त्यसैले यो पनि गलत हो। त्यसैले सही उत्तर १ नम्बरको 하베스터 हो, जसको अर्थ स्वचालित काठ काट्ने मेसिन हुन्छ। किताबमा पहिलो विकल्प '하베스타' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '하베스터' हो।"}, {"n": "433", "q": "청소와 운영에 필요한 소모품, 청소도구, 린넨, 어메니티 같은 물건을 보관하고 관리하는 공간입니다.", "options": ["음식물", "음료수", "비품실", "탈의실"], "answer": 2, "explain": "१. 음식물 को अर्थ खानाको परिकार वा खाद्य पदार्थ हो, यो सामान राख्ने कोठा होइन त्यसैले मिल्दैन। २. 음료수 को अर्थ पिउनेपानी वा पेय पदार्थ हो, यो मिल्दैन। ३. 비품실 को अर्थ सामान वा सामग्री भण्डार कक्ष हो, यो सरसफाइका सामान, तौलिया आदि राख्ने ठाउँ हो त्यसैले यो सही उत्तर हो। ४. 탈의실 को अर्थ कपडा फेर्ने कोठा (चेन्जिङ रुम) हो, यो मिल्दैन। सही उत्तर 비품실 हो जसको अर्थ सामग्री भण्डार कक्ष हुन्छ।"}, {"n": "434", "q": "실내나 특정 공간에서 좋은 향기를 퍼뜨려 냄새를 없애고 쾌적하게 만드는 제품입니다. 객실, 로비, 욕실 등에 청결하고 기분 좋은 인상을 주는 데 사용합니다.", "options": ["향수", "세제", "방향제", "대걸레"], "answer": 2, "explain": "१. 향수 को अर्थ इत्र वा सेन्ट (परफ्युम) हो, यो मान्छेले शरीरमा लगाउने सु बास्ना हो त्यसैले मिल्दैन। २. 세제 को अर्थ डिटर्जेन्ट वा साबुन पानी हो, यो सफा गर्ने रसायन हो त्यसैले मिल्दैन। ३. 방향제 को अर्थ सु बास्ना छर्ने वस्तु (एयर फ्रेसनर) हो, यो कोठाको गन्ध हटाएर बास्नादार बनाउने वस्तु हो त्यसैले यो सही उत्तर हो। ४. 대걸레 को अर्थ ठूलो भुइँ पुछ्ने मप हो, यो सरसफाइको औजार हो त्यसैले मिल्दैन। सही उत्तर 방향제 हो जसको अर्थ एयर फ्रेसनर हुन्छ।"}, {"n": "435", "q": "샴푸, 린스, 치약, 칫솔 등 얼굴을 씻거나 머리를 감을 때 필요한 용품들을 말합니다.", "options": ["전자제품", "화장품", "가전제품", "세면도구"], "answer": 3, "explain": "१. 전자제품 को अर्थ इलेक्ट्रोनिक सामान हो, यो साम्ग्रीहरू पर्दैन त्यसैले मिल्दैन। २. 화장품 को अर्थ सौन्दर्य प्रसाधन (कोस्मेटिक) हो, यो अनुहारमा लगाउने क्रिम आदि हो त्यसैले मिल्दैन। ३. 가전제품 को अर्थ घरायसी विद्युतीय उपकरण हो, यो मिल्दैन। ४. 세면도구 को अर्थ मुख धुने र दाँत माझ्ने सामानहरू (स्याम्बू, मन्जन, ब्रस आदि) हुन् त्यसैले यो सही उत्तर हो। सही उत्तर 세면도구 हो जसको अर्थ मुख धुने तथा नुहाउने सर-सामानहरू हुन्छन्।"}, {"n": "436", "q": "침대를 덮거나 장식하는 천으로 만든 덮개입니다. 침대의 깔끔함을 유지하고, 위생을 보호하기 위해 사용됩니다.", "options": ["이불보", "침대보", "화장대", "리모컨"], "answer": 1, "explain": "१. 이불보 को अर्थ कबल वा कम्बल छोप्ने कपडा हो, यो ओछ्यान ढाक्न प्रयोग हुने भएकोले सही उत्तर हो। २. 침대보 को अर्थ बेडसिट वा ओछ्यानको तन्ना हो, यो ओछ्यानको म्याट्रिस छोप्न प्रयोग हुन्छ तर कबल ढाक्ने कपडा नभएकोले मिलेन। ३. 화장대 को अर्थ श्रृंगार टेबल वा मेकअप गर्ने टेबल हो, यो कोठाको फर्निचर भएकोले मिलेन। ४. 리모컨 को अर्थ रिमोट कन्ट्रोल हो, यो इलेक्ट्रोनिक उपकरण चलाउन प्रयोग हुने भएकोले मिलेन। सही उत्तर १ नम्बरको 이불보 हो जसको अर्थ कबल वा कम्बल छोप्ने कपडा हो।"}, {"n": "437", "q": "호텔이나 콘도에서 투숙객이 휴식 중이거나 방 청소를 원하지 않을 때 객실 문 손잡이에 걸어 두며, 직원은 이를 보고 객실 서비스를 잠시 보류합니다.", "options": ["헤어드라이어", "메이드 보고서", "DND 카드", "메이크업 카드"], "answer": 2, "explain": "१. 헤어드라이어 भनेको कपाल सुकाउने मेसिन हो, त्यसैले यो ढोकामा झुन्ड्याउने कार्ड होइन। २. 메이드 보고서 भनेको सरसफाइ कर्मचारीको प्रतिवेदन हो, त्यसैले यो पाहुनाले प्रयोग गर्ने कार्ड होइन। ३. 디엔디 카드 भनेको बाधा नपुर्याउनुहोस् भनी ढोकामा झुन्ड्याइने कार्ड हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ४. 메이크업 카드 भनेको कोठा सफा गरिदिन अनुरोध गर्ने कार्ड हो, त्यसैले यो विश्रामको लागि होइन। त्यसैले सही उत्तर ३ नम्बरको 디엔디 카드 हो, जसको अर्थ बाधा नपुर्याउनुहोस् भन्ने कार्ड हुन्छ।"}, {"n": "438", "q": "투숙객이 외출할 때 객실 문 손잡이에 걸어두면, 하우스키핑 직원이 이를 보고 청소, 수건 교체, 침구 정리 등을 진행합니다.", "options": ["화장품", "화장대", "DND 카드", "메이크업 카드"], "answer": 3, "explain": "१. 화장품 को अर्थ कस्मेटिक वा सौन्दर्य प्रसाधन हो, यो सफाइ गराउने कार्ड नभएकोले मिलेन। २. 화장대 को अर्थ श्रृंगार टेबल हो, यो फर्निचर भएकोले मिलेन। ३. DND 카드 को अर्थ DND कार्ड हो, यो त सफाइ नगर भनेर झुन्ड्याउने कार्ड हो त्यसैले मिलेन। ४. 메이크업 카드 को अर्थ मेकअप कार्ड हो, यो ढोकामा झुन्ड्याउँदा सरसफाइ र तन्ना फेर्ने काम गर्ने, गराउने कार्ड भएकोले सही उत्तर हो। सही उत्तर ४ नम्बरको 메이크업 카드 हो जसको अर्थ कोठा सफाइ गरिदिनु पर्ने कार्ड हो।"}, {"n": "439", "q": "뛰어난 경치나 특별한 문화 유산으로 유명하여 사람들이 찾아가는 곳입니다.", "options": ["해외 여행", "관광지", "단체 여행", "공연장"], "answer": 1, "explain": "'해외 여행' भनेको विदेश भ्रमण हो, यो अर्को देशमा जाने यात्रा भएकाले विवरणसँग मिल्दैन। '관광지' भनेको पर्यटक स्थल हो, यो राम्रो दृश्य वा सांस्कृतिक सम्पदा हेर्न मानिसहरू जाने ठाउँ भएकाले विवरणसँग मिल्छ। '단체 여행' भनेको सामूहिक भ्रमण हो, यो समूहमा गरिने यात्रा भएकाले विवरणसँग मिल्दैन। '공연장' भनेको प्रदर्शन स्थल हो, यो नाटक वा सङ्गीत देखाइने ठाउँ भएकाले विवरणसँग मिल्दैन। त्यसैले सही उत्तर २ नम्बरको '관광지' हो।"}, {"n": "440", "q": "식당, 주방 등에서 사용하는 쌀, 채소, 고기, 조미료 등이 모두 이에 해당하며, 손님에게 제공할 식사를 준비하는 데 필요한 기본 요소입니다.", "options": ["식자재", "음식식품", "생필품", "통조림"], "answer": 0, "explain": "'식자재' भनेको खाद्य सामग्री हो, यो खाना बनाउन चाहिने चामल, तरकारी, मासु र मसला जस्ता आधारभूत वस्तुहरू भएकाले विवरणसँग मिल्छ। '음식식품' भनेको खाना तथा खाद्य वस्तु हो, यो तयार पारिएको खाना वा प्रशोधित उत्पादनलाई जनाउने भएकाले विवरणसँग मिल्दैन। '생필품' भनेको दैनिक उपभोग्य वस्तु हो, यो साबुन वा मन्जन जस्ता दैनिक जीवनमा चाहिने सामान भएकाले विवरणसँग मिल्दैन। '통조림' भनेको डिब्बाबन्दी खाना हो, यो क्यानमा राखिएको खानेकुरा भएकाले विवरणसँग मिल्दैन। त्यसैले सही उत्तर १ नम्बरको '식자재' हो।"}, {"n": "441", "q": "통조림은 음식을 금속 깡통에 넣고 밀봉하여 오래 보관할 수 있도록 가공한 식품입니다. 비상식량, 조식 준비, 간편 요리용으로 사용됩니다.", "options": ["음료수", "음식식품", "생필품", "통조림"], "answer": 3, "explain": "१. 음료수 को अर्थ पेय पदार्थ वा पिउने पानी जुस आदि हो, यो धातुको कन्टेनरमा बन्द गरिएको खाना नभएकोले मिलेन। २. 음식식품 को अर्थ खाद्य पदार्थ हो, यो सामान्य खाना बुझाउने भएकोले मिलेन। ३. 생필품 को अर्थ दैनिक आवश्यक वस्तुहरू हुन्, त्यसैले मिलेन। ४. 통조림 को अर्थ क्यान फुड वा टिनको बट्टामा बन्द गरिएको खाना हो, यो धातुको कन्टेनरमा लामो समय राख्न बनाइएको खाद्य वस्तु भएकोले सही उत्तर हो। सही उत्तर ४ नम्बरको 통조림 हो जसको अर्थ क्यान फुड हो।"}, {"n": "442", "q": "뚜껑이 단단히 닫혀 공기나 수분이 들어가지 않도록 만든 보관 통입니다. 식자재, 조리된 음식, 양념 등을 신선하게 보관하고 위생을 유지하기 위해 사용됩니다.", "options": ["쿠킹호일", "냉장 보관", "밀폐용기", "냉동 보관"], "answer": 2, "explain": "१. 쿠킹호일 को अर्थ कुकिङ आल्मुनियम आल्मुनियम आल्मुनियम आल्मुनियम आल्मुनियम आल्मुनियम हो, यो बट्टा नभएकोले मिलेन। २. 냉장 보관 को अर्थ फ्रिजमा भण्डारण गर्नु हो, यो प्रक्रिया हो कन्टेनर होइन त्यसैले मिलेन। ३. 밀폐용기 को अर्थ हावाछिद्र नभएको बन्द कन्टेनर (एअर टाइट कन्टेनर) हो, यो हावा वा ओस पस्न नदिने गरी बनाइएको भाँडो भएकोले सही उत्तर हो। ४. 냉동 보관 को अर्थ फ्रिजमा जमाएर राख्नु हो, यो भण्डारण गर्ने तरिका हो त्यसैले मिलेन। सही उत्तर ३ नम्बरको 밀폐용기 हो जसको अर्थ एअर टाइट बट्टा हो।"}, {"n": "443", "q": "음식이나 식자재를 덮거나 감싸서 공기와 수분을 차단하는 얇은 비닐이며 주방에서는 음식 보관 시 위생 유지, 신선도 유지, 냄새 차단 등을 위해 사용됩니다.", "options": ["위생백", "비닐랩", "밀폐용기", "키친타월"], "answer": 1, "explain": "१. 위생백 को अर्थ सरसफाइको झोला वा पोलिथिन झोला हो, यो खाना बेर्ने पातलो र्‍याप नभएकोले मिलेन। २. 비닐랩 को अर्थ भान्छामा प्रयोग हुने प्लास्टिक र्‍याप (क्लिंग फिल्म) हो, यो खाना ढाक्न र हावा रोक्न प्रयोग हुने पातलो प्लास्टिक भएकोले सही उत्तर हो। ३. 밀폐용기 को अर्थ एअर टाइट बट्टा हो, यो कडा भाँडो भएकोले मिलेन। ४. 키친타월 को अर्थ किचेन टिस्यु पेपर हो, यो कागजको तौलिया भएकोले मिलेन। सही उत्तर २ नम्बरको 비닐랩 हो जसको अर्थ प्लास्टिक र्‍याप हो।"}, {"n": "444", "q": "사람이 먹을 수 있는 곡식의 씨앗을 말합니다. 대표적으로 쌀, 밀, 보리, 옥수수, 조, 귀리 등이 있으며, 전 세계적으로 주식으로 사용되는 중요한 식품입니다.", "options": ["과일", "곡류", "육류", "음료"], "answer": 1, "explain": "१. 과일 को अर्थ फलफूल हो, यो अन्नको दाना नभएकोले मिलेन। २. 곡류 को अर्थ अन्नजात वा धान्यान्न (ग्रिन्स/सिरियल्स) हो, यो चामल, गहुँ, मकै जस्ता खानेकुराको दाना बुझाउने भएकोले सही उत्तर हो। ३. 육류 को अर्थ मासुजन्य पदार्थ हो, यो अन्न नभएकोले मिलेन। ४. 음료 को अर्थ पेय पदार्थ हो, यो पनि मिलेन। सही उत्तर २ नम्बरको 곡류 हो जसको अर्थ अन्नजात वा धान्यान्न हो।"}, {"n": "445", "q": "바다에서 얻을 수 있는 생물을 말합니다. 대표적으로 생선, 조개, 새우, 오징어, 해조류, 김, 미역 등이 이에 해당합니다.", "options": ["식중독", "유제품", "해산물", "뒤집개"], "answer": 2, "explain": "'식중독' भनेको विषाक्त भोजन हो, यो खराब खानाले हुने बिरामी भएकाले विवरणसँग मिल्दैन। '유제품' भनेको दुग्धजन्य पदार्थ हो, यो दूधबाट बन्ने परिकार भएकाले विवरणसँग मिल्दैन। '해산물' भनेको समुद्री उत्पादन हो, यो समुद्रबाट पाइने माछा, झिङ्गेमाछा र सिपी जस्ता जीवहरू भएकाले विवरणसँग मिल्छ। '뒤집개' भनेको खाना पल्ट्याउने साधन हो, यो भान्साको औजार भएकाले विवरणसँग मिल्दैन। त्यसैले सही उत्तर ३ नम्बरको '해산물' हो।"}, {"n": "446", "q": "우유를 원료로 만든 음식으로 대표적으로 치즈, 버터, 요거트, 생크림, 연유 등을 말합니다.", "options": ["곰판", "유제품", "해산물", "뒤집개"], "answer": 1, "explain": "'곰판' भनेको ढुसी वा फफूँद हो, यो दूधबाट बन्ने खानेकुरा नभएकाले विवरणसँग मिल्दैन। '유제품' भनेको दुग्धजन्य पदार्थ हो, यो दूधबाट बन्ने चिज, मक्खन र दही जस्ता परिकार भएकाले विवरणसँग मिल्छ। '해산물' भनेको समुद्री उत्पादन हो, यो समुद्रमा पाइने जीवहरू भएकाले विवरणसँग मिल्दैन। '뒤집개' भनेको खाना पल्ट्याउने साधन हो, यो भान्साको औजार भएकाले विवरणसँग मिल्दैन। त्यसैले सही उत्तर २ नम्बरको '유제품' हो। पहिलो विकल्प '곰판' किताबमा छापिएजस्तै राखिएको छ।"}, {"n": "447", "q": "음식 재료를 썰거나 다질 때 바닥에 깔고 사용하는 판입니다. 특히 고기, 채소, 과일 등을 위생적으로 손질하기 위해 꼭 필요한 조리 도구입니다.", "options": ["식칼", "강판", "국자", "도마"], "answer": 3, "explain": "'식칼' भनेको भान्साको चक्कु हो, यो सामान काट्न प्रयोग गरिने औजार भए पनि मुनि राखिने पाता नभएकाले विवरणसँग मिल्दैन। '강판' भनेको कोरेसो हो, यो खानेकुरा मसिनो गरी कोर्न प्रयोग गरिने भएकाले विवरणसँग मिल्दैन। '국자' भनेको डाडु हो, यो झोल पस्कन प्रयोग गरिने भएकाले विवरणसँग मिल्दैन। '도마' भनेको अचानो हो, यो खानेकुरा काट्दा मुनि राखेर प्रयोग गरिने पाता भएकाले विवरणसँग मिल्छ। त्यसैले सही उत्तर ४ नम्बरको '도마' हो।"}, {"n": "448", "q": "채소나 과일 등을 가는 데 사용하는 금속판 형태의 조리 도구입니다. 작은 날들이 표면에 나 있어 무, 생강, 마늘 등을 갈거나 채 썰 때 사용됩니다.", "options": ["식칼", "강판", "국자", "도마"], "answer": 1, "explain": "१. 식칼 को अर्थ चक्कु हो, यो मिलेन। २. 강판 को अर्थ घोट्ने वा कोर्ने धातुको पाता हो, यसमा साना दाँतीहरू हुने भएकाले मूला, अदुवा, लसुन आदि घोट्न वा चप गर्न प्रयोग हुने भएकोले सही उत्तर हो। ३. 국자 को अर्थ डाडु हो, यो झोलका लागि हो त्यसैले मिलेन। ४. 도마 को अर्थ काट्ने पिर्का हो, यो पनि मिलेन। सही उत्तर २ नम्बरको 강판 हो जसको अर्थ घोट्ने वा कोर्ने धातुको पाता हो।"}, {"n": "449", "q": "프라이팬에서 음식을 뒤집거나 옮길 때 사용하는 주방 도구입니다. 달걀, 팬케이크, 고기, 생선 등을 조리할 때 모양을 망치지 않고 뒤집기 위해 자주 사용됩니다.", "options": ["그릇", "접시", "뒤집개", "보온병"], "answer": 2, "explain": "१. 그릇 को अर्थ कचौरा वा भाँडो हो, यो प्यानमा खाना पल्टाउने औजार नभएकोले मिलेन। २. 접시 को अर्थ प्लेट हो, यो पनि मिलेन। ३. 뒤집개 को अर्थ फर्काउने औजार वा पन्यू (स्प्याच्युला) हो, यो प्यानमा अण्डा वा मासु पल्टाउन प्रयोग हुने भएकोले सही उत्तर हो। ४. 보온병 को अर्थ थर्मस फ्लास्क (तातो पानी राख्ने बोतल) हो, यो मिलेन। सही उत्तर ३ नम्बरको 뒤집개 हो जसको अर्थ खाना पल्टाउने पन्यू वा स्प्याच्युला हो।"}, {"n": "450", "q": "밥을 퍼낼 때 사용하는 주방 도구입니다. 나무나 플라스틱 재질로 만들어져 음식에 손상을 주지 않도록 돕습니다.", "options": ["유리컵", "밥솥", "국자", "주걱"], "answer": 3, "explain": "1. 유리컵 भनेको सिसाको कप हो, जसबाट पानी वा जुस पिइन्छ, त्यसैले यो सही उत्तर होइन। 2. 밥솥 भनेको भात पकाउने राइस कुकर हो, जसमा भात पकाइन्छ, त्यसैले यो सही उत्तर होइन। 3. 국자 भनेको झोल उघाउने डाडु हो, जसले तरकारीको झोल निकालिन्छ, त्यसैले यो सही उत्तर होइन। 4. 주걱 भनेको भात उघाउने पन्यू हो, जसले पाकेको भात झिक्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्छ। त्यसैले सही उत्तर ४ नम्बरको 주걱 (भात उघाउने पन्यू) हो।"}, {"n": "451", "q": "바다나 민물에서 자생하는 연체동물로, 단단한 껍데기를 가진 해산물입니다. 미역국, 파스타, 찜 요리 등 다양한 방식으로 요리됩니다.", "options": ["조개", "참치", "어류", "낙지"], "answer": 0, "explain": "1. 조개 भनेको सिपी हो, जुन समुद्र वा नदीमा पाइने कडा खोल भएको जीव हो, त्यसैले यो विवरणसँग मिल्छ। 2. 참치 भनेको टुना माछा हो, जुन ठूलो आकारको माछा हो, त्यसैले यो सही उत्तर होइन। 3. 어류 भनेको माछा वर्ग हो, जसले सबै जलचर माछाहरूलाई जनाउँछ, त्यसैले यो सही उत्तर होइन। 4. 낙지 भनेको अक्टोपस हो, जसको कडा खोल हुँदैन, त्यसैले यो सही उत्तर होइन। त्यसैले सही उत्तर १ नम्बरको 조개 (सिपी) हो।"}, {"n": "452", "q": "위험하거나 방해가 되는 물건을 의미합니다. 보통 어떤 작업이나 환경에서 위험을 초래할 수 있는 요소를 말합니다.", "options": ["방사선", "장해물", "화학물", "독성물"], "answer": 1, "explain": "1. 방사선 भनेको रेडिएसन वा विकिरण हो, त्यसैले यो मिल्दैन। 2. 장해물 भनेको जोखिम वा बाधा पुर्‍याउने वस्तु हो, त्यसैले यो सही उत्तर हो। 3. 화학물 भनेको रासायनिक पदार्थ हो, त्यसैले यो मिल्दैन। 4. 독성물 भनेको विषालु पदार्थ हो, त्यसैले यो मिल्दैन। सही उत्तर 장해물 हो जसको अर्थ जोखिम वा बाधा पुर्‍याउने वस्तु भन्ने हुन्छ।"}, {"n": "453", "q": "불에 쉽게 붙을 수 있는 물질을 의미합니다. 휘발유, 알콜, 가솔린, 에테르, 기름 등이 이에 해당하며, 화재나 폭발 사고를 일으킬 수 있습니다.", "options": ["화학물질", "폭발물질", "장해물질", "인화물질"], "answer": 3, "explain": "1. 화학물질 भनेको रासायनिक पदार्थ हो, त्यसैले यो मिल्दैन। 2. 폭발물질 भनेको विस्फोटक पदार्थ हो, त्यसैले यो मिल्दैन। 3. 장해물질 भनेको बाधा पुर्‍याउने पदार्थ हो, त्यसैले यो मिल्दैन। 4. 인화물질 भनेको आगो सजिलै टिप-हाल्ने वा ज्वलनशील पदार्थ हो, त्यसैले यो सही उत्तर हो। सही उत्तर 인화물질 हो जसको अर्थ ज्वलनशील पदार्थ भन्ने हुन्छ।"}, {"n": "454", "q": "높은 곳에서 떨어지는 물건이나 물질을 뜻합니다. 주로 공사장, 건설현장, 창고, 높은 선반 등에서 발생할 수 있습니다.", "options": ["독극물", "낙하물", "장해물", "감전물"], "answer": 1, "explain": "1. 독극물 भनेको विषालु पदार्थ हो, त्यसैले यो मिल्दैन। 2. 낙하물 भनेको माथिबाट खस्ने वस्तु हो, त्यसैले यो सही उत्तर हो। 3. 장해물 भनेको बाधा पुर्‍याउने वस्तु हो, त्यसैले यो मिल्दैन। 4. 감전물 भनेको करेन्ट लाग्ने वस्तु हो, त्यसैले यो मिल्दैन। सही उत्तर 낙하물 हो जसको अर्थ माथिबाट खस्ने वस्तु भन्ने हुन्छ।"}, {"n": "455", "q": "불을 붙이는 행위를 금지한다는 뜻입니다. 주로 인화 물질이 있는 곳이나 화재 위험이 높은 장소에 설치됩니다.", "options": ["탑승 금지", "촬영 금지", "착화 금지", "통행 금지"], "answer": 2, "explain": "1. 탑승 금지 भनेको चढ्न निषेध हो, त्यसैले यो मिल्दैन। 2. 촬영 금지 भनेको फोटो खिच्न निषेध हो, त्यसैले यो मिल्दैन। 3. 착화 금지 भनेको आगो बाल्न निषेध हो, त्यसैले यो सही उत्तर हो। 4. 통행 금지 भनेको आवतजावत निषेध हो, त्यसैले यो मिल्दैन। सही उत्तर 착화 금지 हो जसको अर्थ आगो बाल्न निषेध भन्ने हुन्छ।"}, {"n": "456", "q": "사진이나 동영상 찍으면 안 된다는 뜻입니다. 주로 보안이 필요한 장소, 프라이버시 보호가 필요한 공간, 저작권 보호 구역 등에 설치됩니다.", "options": ["식음료금지", "촬영 금지", "수영금지", "출입금지"], "answer": 1, "explain": "1. 식음료금지 भनेको खानेकुरा खान र पिउन निषेध हो, त्यसैले यो मिल्दैन। 2. 촬영 금지 भनेको फोटो वा भिडियो खिच्न निषेध हो, त्यसैले यो सही उत्तर हो। 3. 수영금지 भनेको पौडी खेल्न निषेध हो, त्यसैले यो मिल्दैन। 4. 출입금지 भनेको प्रवेश निषेध हो, त्यसैले यो मिल्दैन। सही उत्तर 촬영 금지 हो जसको अर्थ फोटो खिच्न निषेध भन्ने हुन्छ।"}, {"n": "457", "q": "애견 금지는 반려견을 데리고 들어가는 것을 금지한다는 뜻입니다. 주로 식당, 공공시설, 숙박업소, 놀이시설 등에서 위생, 알레르기 예방 등을 이유로 설치됩니다.", "options": ["애견 금지", "임산부 금지", "탑승 금지", "섭취금지"], "answer": 0, "explain": "1. 애견 금지 भनेको घरपालुवा कुकुर निषेध हो, त्यसैले यो सही उत्तर हो। 2. 임산부 금지 भनेको गर्भवती महिला निषेध हो, त्यसैले यो मिल्दैन। 3. 탑승 금지 भनेको सवारी साधनमा चढ्न निषेध हो, त्यसैले यो मिल्दैन। 4. 섭취금지 भनेको सेवन गर्न निषेध हो, त्यसैले यो मिल्दैन। सही उत्तर 애견 금지 हो जसको अर्थ कुकुर ल्याउन निषेध भन्ने हुन्छ।"}, {"n": "458", "q": "위험이 생기거나 사고가 나지 않도록 행동이나 절차에서 지켜야 할 사항을 정한 규칙입니다.", "options": ["공공 도덕", "회사 규칙", "건강 관리", "안전 수칙"], "answer": 3, "explain": "1. 공공 도덕 भनेको सार्वजनिक नैतिकता हो, त्यसैले यो मिल्दैन। 2. 회사 규칙 भनेको कम्पनीको नियम हो, त्यसैले यो मिल्दैन। 3. 건강 관리 भनेको स्वास्थ्य व्यवस्थापन हो, त्यसैले यो मिल्दैन। 4. 안전 수칙 भनेको सुरक्षा नियम वा मापदण्ड हो, त्यसैले यो सही उत्तर हो। सही उत्तर 안전 수칙 हो जसको अर्थ सुरक्षा नियम भन्ने हुन्छ।"}, {"n": "459", "q": "근로자가 작업 중에 사고나 부상으로부터 자신을 보호하기 위해 착용하거나 사용하는 설비를 말합니다.", "options": ["안전 장비", "안전 관리", "안전 수칙", "안전 교육"], "answer": 0, "explain": "1. 안전 장비 भनेको सुरक्षा उपकरण हो, त्यसैले यो सही उत्तर हो। 2. 안전 관리 भनेको सुरक्षा व्यवस्थापन हो, त्यसैले यो मिल्दैन। 3. 안전 수칙 भनेको सुरक्षा नियम हो, त्यसैले यो मिल्दैन। 4. 안전 교육 भनेको सुरक्षा शिक्षा हो, त्यसैले यो मिल्दैन। सही उत्तर 안전 장비 हो जसको अर्थ सुरक्षा उपकरण भन्ने हुन्छ।"}, {"n": "460", "q": "근로자가 업무 중 또는 업무로 인해 부상, 질병, 장애, 사망 등을 입는 사고를 말합니다.", "options": ["산업 관리", "산업 안전", "산업 재해", "산업 복지"], "answer": 2, "explain": "1. 산업 관리 भनेको उद्योग व्यवस्थापन हो, त्यसैले यो मिल्दैन। 2. 산업 안전 भनेको औद्योगिक सुरक्षा हो, त्यसैले यो मिल्दैन। 3. 산업
