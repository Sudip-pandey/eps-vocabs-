{"n": "353", "q": "바다나 강, 호수의 바닥을 파서 깊이를 늘리거나, 퇴적물을 제거하는 작업입니다.", "options": ["준설", "도장", "염색", "운송"], "answer": 0, "explain": "प्रश्नको अर्थ: यो समुद्र, नदी वा तालको पिध खनेर गहिरो बनाउने वा थुप्रिएको माटो र फोहोर हटाउने कार्य हो।\n① 준설 भनेको ड्रेजिङ (नदी वा समुद्रको पिँध खनेर गहिराइ बढाउने वा लेदो हटाउने काम) हो ✓\n② 도장 भनेको पेन्टिङ (रंग लगाउने काम) हो र यो यहाँ मिल्दैन। ✗\n③ 염색 भनेको रंगाउने काम हो र यो यहाँ मिल्दैन। ✗\n④ 운송 भनेको ढुवानी हो र यो यहाँ मिल्दैन। ✗"}, {"n": "354", "q": "흙과 모래가 섞인 것을 말하며 건설 현장이나 하천 주변에서 자주 볼 수 있습니다.", "options": ["돌", "자갈", "토사", "콘크리트"], "answer": 2, "explain": "प्रश्नको अर्थ: यो माटो र बालुवा मिसिएको वस्तु हो, जुन निर्माण स्थल वा नदी किनारामा धेरै पाइन्छ।\n① 돌 भनेको ढुङ्गा हो र यो यहाँ मिल्दैन। ✗\n② 자갈 भनेको गिट्टी हो र यो यहाँ मिल्दैन। ✗\n③ 토사 भनेको माटो र बालुवा मिसिएको लेदो वा माटो-बालुवा हो, जसलाई निर्माण स्थल वा खोला किनारमा प्रायः देख्न सकिन्छ ✓\n④ 콘크리트 भनेको कंक्रिट हो र यो यहाँ मिल्दैन। ✗"}, {"n": "355", "q": "하천, 호수, 하수관 등에서 물이 천천히 흐를 때 무거운 물질들이 아래로 내려앉아 쌓이게 되는 것을 말합니다. 오랜 시간 쌓이면 물이 흐르는 길을 막거나 오염의 원인이 되기도 합니다.", "options": ["수하물", "침전물", "불순물", "분진물"], "answer": 1, "explain": "प्रश्नको अर्थ: यो नदी वा ढलमा पानी बिस्तारै बग्दा लेदो र गह्रौँ पदार्थहरू पिधमा थुप्रिने प्रक्रिया वा थुप्रिएको वस्तु हो।\n① 수하물 भनेको ब्यागेज वा सामान हो र यो यहाँ मिल्दैन। ✗\n② 침전물 भनेको लेदो वा गेगर (पानीमा रहेका भारी पदार्थहरू तल थिग्रिएर बस्ने निक्षेप) हो ✓\n③ 불순물 भनेको अशुद्धता हो र यो यहाँ मिल्दैन। ✗\n④ 분진물 भनेको धुलोका कणहरू हुन् र यो यहाँ मिल्दैन। ✗"}, {"n": "356", "q": "물이 흐르도록 만든 길이나 자연적으로 생긴 물길을 말합니다. 예를 들어, 강, 하천, 배수로 등이 모두 이에 해당합니다.", "options": ["토사", "바다", "폭포", "수로"], "answer": 3, "explain": "प्रश्नको अर्थ: यो पानी बग्नका लागि बनाइएको वा प्राकृतिक रूपमा बनेको बाटो हो, जस्तै नदी वा नाली।\n① 토사 भनेको माटो र बालुवा हो र यो यहाँ मिल्दैन। ✗\n② 바다 भनेको समुद्र हो र यो यहाँ मिल्दैन। ✗\n③ 폭포 भनेको झरना हो र यो यहाँ मिल्दैन। ✗\n④ 수로 भनेको पानी बग्ने कुलो वा प्राकृतिक पानीको बाटो हो ✓"}, {"n": "357", "q": "집이나 건물에 깨끗한 물을 보내고, 더러운 물을 밖으로 빼내는 시설입니다.", "options": ["상하수도", "음용수", "배수구", "수도관"], "answer": 0, "explain": "प्रश्नको अर्थ: यो घर वा भवनमा सफा पानी ल्याउने र सङ्कलन भएको धमिलो वा फोहोर पानी बाहिर पठाउने पूर्वाधार हो।\n① 상하수도 भनेको खानेपानी र ढल निकास प्रणाली (वाटर सप्लाई र सेभेज सिस्टम) हो, जसले सफा पानी पठाउँछ र फोहोर पानी बाहिर लैजान्छ ✓\n② 음용수 भनेको पिउने पानी हो र यो यहाँ मिल्दैन। ✗\n③ 배수구 भनेको ड्रेन वा पानी जाने प्वाल हो र यो यहाँ मिल्दैन। ✗\n④ 수도관 भनेको पानीको पाइप हो र यो यहाँ मिल्दैन। ✗"}, {"n": "358", "q": "흙이나 모래 등을 단단하게 다질 때 사용하는 손도구입니다. 손잡이가 달린 작은 기계처럼 생겼고, 사람이 손으로 들어 올려 바닥을 여러 번 내리쳐서 땅을 눌러 단단하게 만드는 데 사용합니다.", "options": ["결속 핸들", "핸드 램머", "판금 가위", "유각 렌치"], "answer": 1, "explain": "प्रश्नको अर्थ: यो माटो वा बालुवालाई थिचेर बलियो बनाउन मानिसले हातले उचालेर भुइँमा बजार्ने सानो औजार हो।\n① 결속 핸들 भनेको बाइन्डिङ ह्यान्डल हो र यो यहाँ मिल्दैन। ✗\n② 핸드 램머 भनेको ह्यान्ड र्यामर (हातले उचालेर जमिन कुट्ने औजार) हो ✓\n③ 판금 가위 भनेको पाना काट्ने कैंची हो र यो यहाँ मिल्दैन। ✗\n④ 유각 렌치 भनेको हेक्सागन रेन्च हो र यो यहाँ मिल्दैन। ✗"}, {"n": "359", "q": "산이나 땅속을 파서 만든 터널로, 주로 도로, 철도, 수도, 전력선 등을 통과시키기 위해 사용됩니다.", "options": ["육상터널", "대교량", "현수교", "하역구"], "answer": 0, "explain": "प्रश्नको अर्थ: यो पहाड वा जमिनमुनि खनेर बनाइएको सुरुङ बाटो हो, जहाँबाट गाडी वा रेल आवतजावत गर्छन्।\n① 육상터널 भनेको जमिन वा पहाडभित्र बनाइने सुरुङ (टनेल) हो ✓\n② 대교량 भनेको ठूलो पुल हो र यो यहाँ मिल्दैन। ✗\n③ 현수교 भनेको सस्पेन्शन ब्रिज (झुलाउने पुल) हो र यो यहाँ मिल्दैन। ✗\n④ 하역구 भनेको सामान लोड-अनलोड गर्ने ठाउँ हो र यो यहाँ मिल्दैन। ✗"}, {"n": "360", "q": "쇠로 된 두 줄의 레일로 이루어져 있고, 기차나 전철 같은 열차가 이 레일 위를 달립니다. 사람이나 물건을 빠르게 멀리까지 옮길 수 있어서, 교통과 운송에 아주 중요한 역할을 합니다.", "options": ["도로", "육교", "철도", "교량"], "answer": 2, "explain": "प्रश्नको अर्थ: यो फलामका दुईवटा लिकहरू मिलेर बनेको बाटो हो, जसको माथि रेल कुद्ने गर्छ।\n① 도로 भनेको सडक हो र यो यहाँ मिल्दैन। ✗\n② 육교 भनेको ओभरब्रिज (आकाशे पुल) हो र यो यहाँ मिल्दैन। ✗\n③ 철도 भनेको रेलमार्ग (ट्र्याक) हो, जसले दुईवटा फलामका लिकहरूमा रेल दौडाउँछ र यातायातमा महत्त्वपूर्ण भूमिका खेल्छ ✓\n④ 교량 भनेको पुल हो र यो यहाँ मिल्दैन। ✗"}, {"n": "361", "q": "기둥(주탑)에서 여러 개의 줄(케이블)이 사선으로 연결되어 있는 다리입니다. 보기에도 멋지고, 튼튼하면서도 긴 거리를 연결할 수 있어 큰 강이나 바다 위에 자주 사용합니다.", "options": ["육상터널", "수상 교량", "현수교", "사장교"], "answer": 3, "explain": "प्रश्नको अर्थ: यो ठूला नदी वा समुद्रमा खम्बाबाट बलिया डोरीहरू तेर्सो पारेर बाँधिएको पुलको विवरण हो। यसले टाढाको दुरीलाई सजिलै जोड्ने काम गर्छ।\n① 육상터널 भनेको जमिनमुनिको सुरुङ हो, त्यसैले यो पुल होइन। ✗\n② 수상 교량 भनेको पानीमाथिको सामान्य पुल हो, तर यसमा केबलको विशेष कुरा छैन। ✗\n③ 현수교 भनेको झोलुङ्गे पुल हो, तर यसमा केबलहरू अर्कै तरिकाले टाँगिएका हुन्छन्। ✗\n④ 사장교 भनेको मुख्य थामबाट केबलहरू छड्के रूपमा जोडिएको पुल हो, त्यसैले यो विवरणसँग मिल्छ। किताबमा ३ वटा मात्र विकल्पहरू छापिएका छन्, सही उत्तर साजाङ्ग्यो थपिएको हो। ✓\nशिक्षकको उत्तर-पत्र: ② 수상 교량 — मेरो उत्तर: ④ 사장교। प्रश्न: टावर/पाइलनबाट केबल तिरछो जोडिएको पुल — त्यो केबल-स्टेड ब्रिज (사장교) हो; 수상 교량 त पुलको प्रकार नै होइन। पुस्तकमा 3 वटा मात्र विकल्प थियो (사장교 थिएन), त्यसैले मैले ④ मा थपेको हुँ।"}, {"n": "362", "q": "바다 바닥을 파고 들어가 만든 터널입니다. 이 터널은 바다 아래를 지나갈 수 있도록 만들어지며, 주로 도로, 철도, 수도, 전력선 등을 연결하는 데 사용됩니다.", "options": ["육상터널", "해저침매터널", "교통수단", "사장교"], "answer": 1, "explain": "प्रश्नको अर्थ: यो समुद्रको पिँध मुनिबाट बाटो वा रेलमार्ग लैजान बनाइएको सुरुङको विवरण हो। यसले पानीमुनिबाट गाडी र बिजुलीका तारहरू लैजान मद्दत गर्छ।\n① 육상터널 भनेको जमिनमा बनाइने सुरुङ हो, यो समुद्रको फेदमा बनाइने सुरुङको वर्णन होइन त्यसैले मिलेन। ✗\n② 해저침매터널 भनेको समुद्रको पिँध खनेर बनाइएको सुरुङ हो ✓\n③ 교통수단 भनेको यातायातको साधन हो, यो सुरुङसँग सम्बन्धित छैन त्यसैले मिलेन। ✗\n④ 사장교 भनेको केबल प्रयोग गरिएको पुल हो, यो सुरुङ होइन त्यसैले मिलेन। 해저침매터널 भनेको समुद्रको सतहमुनि सुरुङ बनाउने विधि हो। ✗"}, {"n": "363", "q": "나무, 철사, 플라스틱 등 다양한 재료로 만들어지며, 식물이 무너지지 않도록 돕고, 햇볕과 공기의 흐름을 좋게 유지하는 역할을 합니다.", "options": ["울타리망", "경운기", "지주대", "곡괭이"], "answer": 2, "explain": "प्रश्नको अर्थ: यो बिरुवाहरू नलडीकन सीधा उभिन र घाम तथा हावा राम्ररी पाउन मद्दत गर्ने आधार वा टेकोको विवरण हो। यसलाई काठ वा फलामका तारहरूबाट बनाइन्छ।\n① 울타리망 भनेको बारे लगाउने जाली हो, यो बिरुवालाई अड्याउने साधन होइन त्यसैले मिलेन। ✗\n② 경운기 भनेको हाते ट्र्याक्टर हो, यो बिरुवालाई अड्याउने साधन होइन त्यसैले मिलेन। ✗\n③ 지주대 भनेको बिरुवा ढल्न नदिन र हावापानीको आवतजावत राम्रो बनाउन प्रयोग गरिने खम्बा वा साहरा हो ✓\n④ 곡괭이 भनेको कोदालो वा गैंची हो, यो बिरुवालाई अड्याउने साधन होइन त्यसैले मिलेन। 지주대 भनेको बिरुवालाई अड्याउन प्रयोग गरिने साधन हो। ✗"}, {"n": "364", "q": "쇠로 서너 개의 발을 만들고 자루를 박아 갈퀴 모양으로 만든 농기구입니다. 땅을 파헤쳐 고르거나 두엄, 풀무덤 등을 쳐내는 데 씁니다.", "options": ["모종삽", "분무기", "곡괭이", "쇠스랑"], "answer": 3, "explain": "प्रश्नको अर्थ: यो फलामका तीखा चुच्चा भएका र डन्डी जोडिएको कृषि औजारको विवरण हो। यसले माटो सम्याउन र मल वा घाँसका थुप्राहरू हटाउन मद्दत गर्छ।\n① 모종삽 भनेको बिरुवा सार्ने सानो साबेल हो, त्यसैले यो काँढा भएको औजार होइन। ✗\n② 분무기 भनेको पानी वा औषधि छर्कने उपकरण हो, त्यसैले यो माटो पन्छाउने औजार होइन। ✗\n③ 곡괭이 भनेको गैँती हो, तर यसमा तीन-चार वटा काँढा हुँदैनन्। ✗\n④ 쇠스랑 भनेको फलामको काँढा भएको सोहोर्ने कृषि औजार हो, त्यसैले यो विवरणसँग मिल्छ। ✓"}, {"n": "365", "q": "모판에서 기른 어린 식물을 논이나 밭으로 옮겨 심을 때 사용하는 작업 도구입니다.", "options": ["뜰채", "갈퀴", "곡괭이", "모종삽"], "answer": 3, "explain": "प्रश्नको अर्थ: यो ब्याडमा उमारिएका साना बिरुवाहरूलाई खेत वा बारीमा सारेर रोप्दा प्रयोग गरिने सानो औजारको विवरण हो।\n① 뜰채 भनेको जाली हो, यो बिरुवा सार्ने औजार होइन त्यसैले मिलेन। ✗\n② 갈퀴 भनेको घाँस वा पात बटुलुने औजार हो, यो बिरुवा सार्ने होइन त्यसैले मिलेन। 3. 모종삽 भनेको बेर्ना सार्न प्रयोग गरिने सानो साबेल हो ✗\n③ 곡괭이 भनेको कडा माटो खन्ने गैंची हो, यो बिरुवा सार्ने औजार होइन त्यसैले मिलेन। ✗\n④ 모종삽 भनेको बेर्ना सार्ने औजार हो। ✓"}, {"n": "366", "q": "곡괭이, 호미, 낫 등과 같이 논과 밭에서 곡식이나 채소 등을 재배할 때 사용하는 도구입니다.", "options": ["공구", "가구", "농기구", "보호구"], "answer": 2, "explain": "प्रश्नको अर्थ: यो खेतबारीमा अन्न वा तरकारी खेती गर्दा प्रयोग गरिने विभिन्न प्रकारका औजारहरूको साझा नामको विवरण हो।\n① 공구 भनेको सामान्य काममा प्रयोग हुने औजार हो, तर यो विशेष गरी खेतीको होइन। ✗\n② 가구 भनेको घरको फर्निचर हो, त्यसैले यो खेती गर्ने औजार होइन। ✗\n③ 농기구 भनेको खेतबारीमा अन्न वा तरकारी रोप्दा प्रयोग गरिने कृषि औजार हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n④ 보호구 भनेको शरीरको सुरक्षा गर्ने सामान हो, त्यसैले यो खेती गर्ने औजार होइन। ✗"}, {"n": "367", "q": "긴 나무 자루에 길고 뾰족한 날을 붙여서 만든 것으로 단단한 땅을 파는 데 쓰는 농기구입니다.", "options": ["호미", "갈퀴", "모종삽", "곡괭이"], "answer": 3, "explain": "प्रश्नको अर्थ: यो लामो काठको बिँड र तीखो फलाम भएको औजारको विवरण हो। यसको प्रयोग साह्रो माटो खन्न र फुटाउन गरिन्छ।\n① 호미 भनेको सानो कुटो हो, यो घाँस उखेल्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 갈퀴 भनेको सोहर्ने दाँती हो, यो सुकेका पात सोहर्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 모종삽 भनेको सानो बेल्चा हो, यो बिरुवा रोप्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 곡괭이 भनेको गैँती हो, यो लामो काठको बिँड भएको कडा माटो खन्ने औजार भएकाले विवरणसँग सही मिल्छ। ✓"}, {"n": "368", "q": "농업이나 건설 현장에서 땅을 파거나 흙을 옮길 때 사용하는 도구입니다.", "options": ["삽", "괭이", "호미", "대패"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कृषि वा निर्माण कार्यमा माटो खन्न र खनेको माटो अर्को ठाउँमा सार्न प्रयोग गरिने मुख्य औजारको विवरण हो।\n① 삽 भनेको माटो खन्न वा सार्न प्रयोग हुने साबेल हो ✓\n② 괭이 भनेको कुटो हो, यो साबेल होइन त्यसैले मिलेन। ✗\n③ 호미 भनेको सानो कुटो हो, यो माटो फ्याँक्ने साबेल होइन त्यसैले मिलेन। ✗\n④ 대패 भनेको काठ रन्दा लगाउने औजार हो, यो माटो खन्ने होइन त्यसैले मिलेन। 삽 भनेको माटो खन्ने वा बोक्ने साबेल हो। ✗"}, {"n": "369", "q": "벼, 보리, 밀 같은 작물을 수확할 때 탈곡과 선별 작업을 동시에 할 수 있는 기계입니다.", "options": ["경운기", "예초기", "콤바인", "파종기"], "answer": 2, "explain": "प्रश्नको अर्थ: यो धान, गहुँ वा जौ जस्ता बाली काट्ने, दाइँ हाल्ने र दाना छुट्ट्याउने काम एकैचोटि गर्ने मेसिनको विवरण हो।\n① 경운기 भनेको हाते ट्र्याक्टर हो, यो बाली काट्ने मेसिन होइन त्यसैले मिलेन। ✗\n② 예초기 भनेको घाँस काट्ने मेसिन हो, यो बाली भित्र्याउने मेसिन होइन त्यसैले मिलेन। ✗\n③ 콤바인 भनेको धान, गहुँ जस्ता बाली एकैचोटि काट्ने र चुट्ने मेसिन (कम्बाइन) हो ✓\n④ 파종기 भनेको बीउ रोप्ने मेसिन हो, यो बाली काट्ने मेसिन होइन त्यसैले मिलेन। 콤바인 भनेको बाली काट्ने र झार्ने काम एकैसाथ गर्ने मेसिन हो। ✗"}, {"n": "370", "q": "농업에서 씨앗을 빠르고 효율적으로 심을 수 있도록 도와주는 기계로, 자동화된 시스템을 이용해 일정한 양의 씨앗을 고르게 뿌려서 노동을 덜어줍니다.", "options": ["경운기", "트렉터", "콤바인", "파종기"], "answer": 3, "explain": "प्रश्नको अर्थ: यो खेतबारीमा बीउहरूलाई बराबरी दुरीमा र छिटो छर्नका लागि प्रयोग गरिने आधुनिक कृषि मेसिनको विवरण हो।\n① 경운기 भनेको हाते ट्र्याक्टर हो, यो बीउ रोप्ने मेसिन होइन त्यसैले मिलेन। ✗\n② 트렉터 भनेको ट्र्याक्टर हो, यो जोत्ने काममा आउँछ त्यसैले मिलेन। ✗\n③ 콤바인 भनेको बाली काट्ने मेसिन हो, यो बीउ रोप्ने होइन त्यसैले मिलेन। ✗\n④ 파종기 भनेको बीउ छर्ने वा रोप्ने मेसिन हो, त्यसैले यो सही उत्तर हो। 파종기 भनेको कृषिका लागि बीउ रोप्ने मेसिन हो। ✓"}, {"n": "371", "q": "풀을 자르거나 깎는 데 사용하는 기계로 주로 논, 밭, 과수원, 도로 주변, 공원 등에서 자란 잔디나 잡초를 정리할 때 사용합니다.", "options": ["수준기", "예초기", "정수기", "경운기"], "answer": 1, "explain": "प्रश्नको अर्थ: यो खेत, बगैँचा वा पार्कहरूमा उम्रेका घाँस र झाडीहरू काट्न प्रयोग गरिने मेसिनको विवरण हो।\n① 수준기 भनेको लेभल मिलाउने औजार हो, यो घाँस काट्ने मेसिन होइन त्यसैले मिलेन। ✗\n② 예초기 भनेको घाँस वा बुट्यान काट्ने मेसिन हो ✓\n③ 정수기 भनेको पानी फिल्टर गर्ने मेसिन हो, यो घाँस काट्ने होइन त्यसैले मिलेन। ✗\n④ 경운기 भनेको हाते ट्र्याक्टर हो, यो घाँस काट्ने मेसिन होइन त्यसैले मिलेन। 예초기 भनेको घाँस काट्ने मेसिन हो। ✗"}, {"n": "372", "q": "땅을 파거나 고를 때 사용하는 농기구입니다. 끝이 날카로운 쇠로 되어 있고, 손잡이를 잡고 흔들어 흙을 팔 때 사용합니다.", "options": ["삽", "괭이", "망치", "곡괭이"], "answer": 1, "explain": "प्रश्नको अर्थ: यो माटो खन्न वा ढिक्का फुटाउन प्रयोग गरिने फलामको धारिलो औजारको विवरण हो। यसको बिँड समातेर माटो खन्ने गरिन्छ।\n1. 삽 भनेको माटो काट्ने साबेल हो, यो कुटो होइन त्यसैले मिलेन। 2. 괭이 भनेको माटो खन्ने वा गोडमेल गर्ने कुटो हो, त्यसैले यो सही उत्तर हो। 3. 망치 भनेको हथौडा हो, यो कृषि औजार होइन त्यसैले मिलेन। 4. 곡괭이 भनेको गैंची हो, यो कुटोभन्दा फरक हुन्छ त्यसैले यो होइन। 괭이 भनेको माटो खन्ने कुटो हो।"}, {"n": "373", "q": "밭에서 풀을 뽑거나 흙을 고를 때 사용하는 작은 농기구입니다. 한 손으로 쓸 수 있는 도구로, 끝이 휘어져 있어서 흙을 긁거나 파기에 좋고, 잡초를 쉽게 제거할 수 있습니다.", "options": ["호미", "괭이", "갈퀴", "낫"], "answer": 0, "explain": "प्रश्नको अर्थ: यो बारीमा एक हातले समातेर झार उखेल्न र माटो कोस्रन प्रयोग गरिने सानो औजारको विवरण हो।\n① 호미 भनेको सानो कुटो हो, यो एक हातले घाँस उखेल्न र माटो सोहर्न प्रयोग गरिने औजार भएकाले विवरणसँग सही मिल्छ। ✓\n② 괭이 भनेको कुदालो हो, यो दुवै हातले प्रयोग गरिने अलि ठूलो औजार भएकाले विवरणसँग मिल्दैन। ✗\n③ 갈퀴 भनेको सोहर्ने दाँती हो, यो घाँस वा पात सोहर्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 낫 भनेको हँसिया हो, यो बाली वा घाँस काट्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "374", "q": "씨앗을 뿌려 모를 키우는 작은 밭이나 판입니다. 주로 벼농사에서 많이 사용되며, 모판에서 모를 일정 크기로 키운 뒤, 본논에 옮겨 심는 방식으로 농사를 짓습니다.", "options": ["수레", "분뇨", "상자", "모판"], "answer": 3, "explain": "प्रश्नको अर्थ: यो धानको बीउ छरेर बेउरा वा बीउ हुर्काउने सानो ठाउँ वा बाकसको विवरण हो। यहाँ बेउरा हुर्केपछि मुख्य खेतमा सारिन्छ।\n① 수레 भनेको ठेलागाडी हो, यो बेर्ना हुर्काउने ठाउँ होइन त्यसैले मिलेन। ✗\n② 분뇨 भनेको मलमूत्र हो, यो बेर्ना राख्ने ठाउँ होइन त्यसैले मिलेन। ✗\n③ 상자 भनेको बक्स हो, यो बेर्ना राख्ने ठाउँसँग मिल्दैन। ✗\n④ 모판 भनेको धान वा तरकारीको बेर्ना उमार्ने ब्याड (प्लाष्टिक वा काठको ट्रे) हो, त्यसैले यो सही उत्तर हो। 모판 भनेको बेर्ना उमार्ने ठाउँ वा ब्याड हो। ✓"}, {"n": "375", "q": "토지의 생산력을 높이고 식물에 생장을 돕기 위해 땅에 뿌리는 물질입니다.", "options": ["씨앗", "비료", "사료", "모종, 바종"], "answer": 1, "explain": "प्रश्नको अर्थ: यो माटोको उर्वरा शक्ति बढाउन र बिरुवालाई राम्ररी हुर्काउन माटोमा हालिने पोषक तत्त्वको विवरण हो।\n① 씨앗 भनेको बीउ हो, यो माटोमा हालिने रासायनिक वा प्रांगारिक पदार्थ होइन त्यसैले मिलेन। ✗\n② 비료 भनेको माटोको उर्वराशक्ति बढाउन र बिरुवाको वृद्धिका लागि प्रयोग गरिने मल (खेतीमा हाल्ने मल) हो ✓\n③ 사료 भनेको दाना (जनावरलाई खुवाउने) हो, यो माटोमा हाल्ने होइन त्यसैले मिलेन। ✗\n④ 모종, 바종 भनेको बेर्ना र बीउ छर्ने काम हो, यो मल होइन त्यसैले मिलेन। 비료 भनेको मल वा फर्टिलाइजर हो। चौथो विकल्प '모종, 바종' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "376", "q": "나무를 심고, 가꾸고, 수확하는 작업이 이루어지며, 과일 생산을 위한 전문적인 농업 공간입니다.", "options": ["농장", "공원", "정원", "과수원"], "answer": 3, "explain": "प्रश्नको अर्थ: यो विभिन्न प्रकारका फलफूलका रुखहरू हुर्काएर फल उत्पादन गरिने विशेष ठाउँ वा बगैँचाको विवरण हो।\n① 농장 भनेको समग्र बालीनाला लगाउने र जनावर पाल्ने फार्म हो ✗\n② 공원 भनेको मानिसहरू आराम गर्ने पार्क हो ✗\n③ 정원 भनेको बगैंचा हो ✗\n④ 과수원 भनेको फलफूल उत्पादन गर्ने बगैंचा वा फार्म हो ✓"}, {"n": "377", "q": "가축들이 먹는 먹이를 말하며 주로 곡물, 풀, 콩, 비타민 등으로 만들어지며, 가축이 건강하게 자라고 고기나 우유, 달걀 등을 잘 생산할 수 있도록 도와줍니다.", "options": ["비료", "분뇨", "사료", "건초"], "answer": 2, "explain": "प्रश्नको अर्थ: यो गाईवस्तु, सुँगुर वा कुखुरा जस्ता पशुपन्छीलाई खुवाइने ताकतिलो दाना वा आहारको विवरण हो।\n① 비료 भनेको मल हो ✗\n② 분뇨 भनेको पशुपक्षीको मलमूत्र हो ✗\n③ 사료 भनेको जनावरलाई खुवाउने दाना (आहारा) हो ✓\n④ 건초 भनेको सुकेको घाँस हो ✗"}, {"n": "378", "q": "가축에게 사료를 주는 기계나 도구입니다. 이 기계는 자동 또는 수동으로 작동하며, 일정한 양의 사료를 정해진 시간에 가축에게 공급해 줍니다.", "options": ["바가지", "사료조", "급이기", "계량컵"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पशुपन्छीलाई तोकिएको समयमा निश्चित मात्रामा दाना वा खाना दिने मेसिन वा उपकरणको विवरण हो।\n① 바가지 भनेको पानी वा दाना तान्ने बाटा वा कचौरा हो ✗\n② 사료조 भनेको दाना राख्ने भाँडो वा डुँड हो ✗\n③ 급이기 भनेको पशुलाई स्वचालित वा हाते तरिकाले दाना खुवाउने यन्त्र (फीडर) हो ✓\n④ 계량컵 भनेको नाप्ने कप हो ✗"}, {"n": "379", "q": "가축에게 사료를 담아주는 그릇이나 통입니다. 주로 가축들이 사료를 먹을 수 있도록 담아두는 용기로, 플라스틱, 철, 시멘트 등 다양한 재료로 만들어집니다.", "options": ["주전자", "사료조", "급이기", "저울"], "answer": 1, "explain": "प्रश्नको अर्थ: यो पशुहरूले सजिलै दाना खान सकून् भनेर दाना हालिदिने भाँडो वा कुँडको विवरण हो।\n① 주전자 भनेको चिया वा पानी उमाल्ने वा राख्ने भाँडो हो ✗\n② 사료조 भनेको पशुलाई दाना राख्ने भाँडो वा डुँड हो ✓\n③ 급이기 भनेको दाना खुवाउने यन्त्र हो ✗\n④ 저울 भनेको तराजु हो ✗"}, {"n": "380", "q": "건초나 풀처럼 가축에게 먹이는 거친 사료를 말합니다. 주로 소나 양 같은 초식 가축에게 주며, 예를 들어 볏짚, 건초, 옥수수 줄기, 청초 등이 있습니다.", "options": ["조사료", "미네랄", "습사료", "곡물"], "answer": 0, "explain": "प्रश्नको अर्थ: यो गाई र भेडा जस्ता शाकाहारी पशुहरूलाई खुवाइने सुकेको घाँस, पराल वा ढोड जस्ता घाँसजन्य आहारको विवरण हो।\n① 조사료 भनेको खस्रो आहारा (घाँस, पराल आदि) हो ✓\n② 미네랄 भनेको खनिज पदार्थ हो ✗\n③ 습사료 भनेको ओसिलो वा झोलयुक्त दाना हो ✗\n④ 곡물 भनेको अन्नबाली हो ✗"}, {"n": "381", "q": "자루가 달려 있는 그릇이나 도구로, 물건을 담거나 퍼내는 데 사용하는 도구입니다. 주로 물이나 곡물, 사료 등을 퍼내거나 담는 데 사용됩니다.", "options": ["양동이", "바가지", "손수레", "프라이팬"], "answer": 1, "explain": "प्रश्नको अर्थ: यो समात्ने बिँड भएको भाँडो वा औजार हो, जसले पानी, अन्न वा दाना उघाउन वा हाल्न प्रयोग गरिन्छ।\n① 양동이 भनेको बाल्टी हो ✗\n② 바가지 भनेको पानी वा दाना उघाउने डुडुल्को वा पहेँलो बाटाजस्तो भाँडो हो ✓\n③ 손수레 भनेको हाते ठेला हो ✗\n④ 프라이팬 भनेको कराैँ (तवा) हो ✗"}, {"n": "382", "q": "가축을 기르는 건물이나 공간을 의미합니다. 보통 소, 돼지, 양, 닭 등 가축을 키우기 위해 만들어진 건물로, 가축들이 편하게 지낼 수 있도록 설계됩니다.", "options": ["농장", "공장", "축사", "과수원"], "answer": 2, "explain": "प्रश्नको अर्थ: यो गाई, सुँगुर, भेडा वा कुखुरा जस्ता पाल्तु जनावरहरूलाई पाल्न र राख्न बनाइएको ठाउँ वा भवन हो।\n① 농장 भनेको कृषि फर्म हो ✗\n② 공장 भनेको कारखाना हो ✗\n③ 축사 भनेको पशुपक्षी पाल्ने गोठ (खोर) हो ✓\n④ 과수원 भनेको फलफूल बगैंचा हो ✗"}, {"n": "383", "q": "보통 물고기를 잡을 때 쓰는 수단으로 노끈이나 실, 쇠줄 따위로 여러 구멍이 나게 엮은 물건입니다.", "options": ["통발", "그물", "갈퀴", "밧줄"], "answer": 1, "explain": "प्रश्नको अर्थ: यो धागो वा डोरीलाई धेरै प्वाल हुने गरी बुनेर माछा समात्न प्रयोग गरिने साधन हो।\n① 통발 भनेको माछा समात्ने थुन्से आकारको पासो हो ✗\n② 그물 भनेको माछा समात्ने जालो हो ✓\n③ 갈퀴 भनेको घाँस वा पात बटुलुवा हो ✗\n④ 밧줄 भनेको डोरी हो ✗"}, {"n": "384", "q": "어업에서 물고기를 잡는 그물을 걷어올리는데 사용되는 기계입니다.", "options": ["집어등", "양망기", "바늘대", "밧줄"], "answer": 1, "explain": "प्रश्नको अर्थ: यो माछा मार्ने काममा पानीबाट माछा परेको साधनलाई माथि तान्न वा उठाउन प्रयोग गरिने मेसिन हो।\n① 집어등 भनेको माछा तान्ने बत्ती हो ✗\n② 양망기 भनेको माछा मार्ने जालो तान्ने मेसिन हो ✓\n③ 바늘대 भनेको बत्तीको सिन्का वा सुई राख्ने साधन हो ✗\n④ 밧줄 भनेको डोरी हो ✗"}, {"n": "385", "q": "물고기나 해양 생물을 잡는 그물 형태의 덫입니다. 보통 원통 모양으로 생겼고, 입구가 좁아 생물이 들어가면 나오기 어렵도록 설계되어 있습니다.", "options": ["닻", "뜰채", "부표", "통발"], "answer": 3, "explain": "प्रश्नको अर्थ: यो ढोका साँघुरो भएको बेलनाकार पासो हो, जसमा माछा वा जलचर पसेपछि बाहिर निस्कन गाह्रो हुन्छ।\n① 닻 भनेको लङ्गर हो, यो जहाजलाई एकै ठाउँमा रोक्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 뜰채 भनेको हात जाली हो, यो पानीबाट माछा उठाउन प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 부표 भनेको तैरिने भुवा हो, यो स्थान जनाउन प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 통발 भनेको ढडिया हो, यो बेलनाकार आकारको माछा समात्ने पासो भएकाले विवरणसँग सही मिल्छ। ✓"}, {"n": "386", "q": "물속에서 물고기나 다른 수생 생물을 잡는 도구입니다. 주로 연못이나 작은 호수에서 물고기를 잡을 때 사용되며, 낚시나 수산업에서 자주 사용됩니다.", "options": ["뜰채", "밧줄", "그물", "바늘대"], "answer": 0, "explain": "प्रश्नको अर्थ: यो पोखरी वा सानो तालमा पानीभित्रका माछाहरूलाई उघारेर वा समातेर निकाल्न प्रयोग गरिने औजार हो।\n① 뜰채 भनेको सानो जाली वा छिपो हो जसले पानीभित्रका जीवहरू समात्छ ✓\n② 밧줄 भनेको डोरी हो ✗\n③ 그물 भनेको ठूलो जाल हो ✗\n④ 바늘대 भनेको सुई हो ✗"}, {"n": "387", "q": "햇빛이나 강한 조명을 차단하여 실내 온도 조절이나 눈부심 방지에 사용하는 막입니다. 주로 비닐하우스, 창문, 어업용 어 등에 활용됩니다.", "options": ["갑판", "부표", "바늘대", "차광막"], "answer": 3, "explain": "प्रश्नको अर्थ: यो घामको कडा प्रकाशलाई रोकेर भित्री तापमान मिलाउन वा आँखा तिर्मिराउन नदिन प्रयोग गरिने पर्दा वा ओझेल हो।\n① 갑판 भनेको जहाजको डेक हो ✗\n② 부표 भनेको पानीमा तैरिने बुइो हो ✗\n③ 바늘대 भनेको सुई वा सोसम्बन्धी साधन हो ✗\n④ 차광막 भनेको घाम छेक्ने जाली (शेड नेट) हो ✓"}, {"n": "388", "q": "보통 그물을 칠 때 사용하는 실이나 줄을 한쪽 끝에 걸어서 날 속으로 들여 지르는 가늘고 길쭉한 막대기입니다.", "options": ["닻", "고리", "도르래", "바늘대"], "answer": 3, "explain": "प्रश्नको अर्थ: यो माछा मार्ने साधन बुन्दा वा मर्मत गर्दा धागो छिराउन प्रयोग गरिने पातलो र लामो सिन्का हो।\n① 닻 भनेको लंगर हो ✗\n② 고리 भनेको रिङ वा कडी हो ✗\n③ 도르래 भनेको घिर्नी हो ✗\n④ 바늘대 भनेको जाल बुन्ने वा छिराउने सिन्का वा साधन हो ✓"}, {"n": "389", "q": "물이나 약제를 높은 압력으로 뿌려 세척, 농약 살포 등에 사용하는 장비입니다. 강한 압력 덕분에 먼지, 오염물, 해충 등을 효과적으로 제거할 수 있습니다.", "options": ["양망기", "차광막", "고압 호스", "고압 분사기"], "answer": 3, "explain": "प्रश्नको अर्थ: यो ठूलो बलका साथ पानी वा औषधि छर्केर सफा गर्न वा कीटनाशक हाल्न प्रयोग गरिने उपकरण हो।\n① 양망기 भनेको जाल तान्ने मेसिन हो ✗\n② 차광막 भनेको घाम छेक्ने जाली हो ✗\n③ 고압 호스 भनेको उच्च चापको पाइप हो ✗\n④ 고압 분사기 भनेको उच्च चापमा पानी वा औषधि छ्याप्ने यन्त्र हो ✓"}, {"n": "390", "q": "물고기, 조개, 해조류 등을 인공적으로 기르기 위해 바다나 강, 호수 등에 설치한 시설입니다. 어업에서 안정적인 수산물 생산을 위해 중요한 역할을 합니다.", "options": ["농장", "닭장", "양식장", "양계장"], "answer": 2, "explain": "प्रश्नको अर्थ: यो समुद्र, नदी वा तालमा माछा वा अन्य जलचरहरूलाई कृत्रिम रूपमा हुर्काउन बनाइएको संरचना हो।\n① 농장 भनेको कृषि फर्म हो ✗\n② 닭장 भनेको कुखुराको खोर हो ✗\n③ 양식장 भनेको माछा वा सामुद्रिक जीव पालन गर्ने केन्द्र (फिश फार्म) हो ✓\n④ 양계장 भनेको कुखुरा पालन फर्म हो ✗"}, {"n": "391", "q": "어업에서 양식장 위치나 어망 설치 지점을 표시하기 위해 사용하는 해상 표지입니다. 부력을 이용해 물 위에 떠 있으며 어선의 작업 효율과 안전을 돕습니다.", "options": ["그물", "갑판", "부표", "밧줄"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पानीमा तैरिएर काम गर्ने ठाउँ वा साधन राखिएको स्थान देखाउन प्रयोग गरिने सङ्केत हो।\n① 그물 भनेको जाल हो, यो माछा समात्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 갑판 भनेको जहाजको डेक हो, यो मानिस उभिने वा सामान राख्ने सतह हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 부표 भनेको तैरिने सङ्केत हो, यो पानीमा तैरिएर स्थान वा दिशा देखाउन प्रयोग गरिने भएकाले विवरणसँग सही मिल्छ। ✓\n④ 밧줄 भनेको डोरी हो, यो सामान बाँध्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "392", "q": "물고기나 해산물을 기르거나 보관하기 위해 사용하는 물탱크 형태의 용기입니다. 양식장이나 실내 사육 시설에서 주로 사용됩니다.", "options": ["구조", "수조", "부표", "통발"], "answer": 1, "explain": "प्रश्नको अर्थ: यो माछा वा जलचर जीवहरूलाई पाल्न वा सुरक्षित राख्न प्रयोग गरिने पानीको ट्याङ्की जस्तो भाँडो हो।\n① 구조 भनेको उद्धार हो, यो खतराबाट बचाउने कार्य हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 수조 भनेको पानीको ट्याङ्की हो, यो माछा वा सामुद्रिक जीव पाल्न र राख्न प्रयोग गरिने भाँडो भएकाले विवरणसँग सही मिल्छ। ✓\n③ 부표 भनेको तैरिने सङ्केत हो, यो पानीमा तैरिएर स्थान देखाउन प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 통발 भनेको ढडिया हो, यो माछा समात्ने पासो हो, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "393", "q": "어류나 해산물이 자라는 양식장에서 물 속에 산소를 공급하여 생물들이 건강하게 자랄 수 있도록 돕는 장비입니다.", "options": ["양식장", "산소 공급기", "고압 분사기", "낚시 바늘"], "answer": 1, "explain": "प्रश्नको अर्थ: यो पानीभित्र माछाहरूलाई सास फेर्न चाहिने हावा पठाएर हुर्काउन मद्दत गर्ने उपकरण हो।\n① 양식장 भनेको माछा पालन गर्ने फार्म हो ✗\n② 산소 공급기 भनेको अक्सिजन आपूर्ति गर्ने यन्त्र हो जसले पानीमा अक्सिजन दिन्छ ✓\n③ 고압 분사기 भनेको उच्च दबाबको पानी छ्याप्ने मेसिन हो ✗\n④ 낚시 바늘 भनेको बल्छिको काँटी हो ✗"}, {"n": "394", "q": "체온이나 물의 온 ँग मिल्दैन। ✗\n③ 선미부 भनेको जहाजको पछाडिको भाग हो, जुन दिशा मोड्ने र पछाडि रहने भागको विवरणसँग एकदम मिल्छ। ✓\n④ 도료 호스 भनेको रङ लगाउने पाइप हो, त्यसैले यो सही उत्तर होइन। ✗"}, {"n": "399", "q": "선박의 중간 부분을 말합니다. 선박의 균형을 맞추는 데 중요한 역할을 하며, 화물 공간이나 승객실이 위치할 수 있습니다.", "options": ["중앙부", "그물", "선체", "갑판"], "answer": 0, "explain": "प्रश्नको अर्थ: यो पानीजहाजको बीचको भाग हो, जसले जहाजको सन्तुलन कायम राख्न मद्दत गर्छ।\n① 중앙부 भनेको मध्य भाग हो, जुन जहाजको बीचको भाग भन्ने विवरणसँग एकदम मिल्छ। ✓\n② 그물 भनेको माछा मार्ने जाल हो, त्यसैले यो जहाजको भाग होइन। ✗\n③ 선체 भनेको जहाजको मुख्य जिउ वा ढाँचा हो, त्यसैले यसले बीचको भागलाई मात्र जनाउँदैन। ✗\n④ 갑판 भनेको जहाजको डेक वा भुइँ हो, त्यसैले यो बीचको भाग भन्ने विवरणसँग मिल्दैन। ✗"}, {"n": "400", "q": "선박이나 항공기의 추진력을 생성하는 장치로, 회전하면서 물이나 공기를 밀어내어 이동을 돕습니다. 선박에서는 엔진의 동력을 받아 회전하며, 선박을 앞으로 나가게 합니다.", "options": ["조타실", "프로펠러", "양망기", "비계기둥"], "answer": 1, "explain": "प्रश्नको अर्थ: यो घुमेर पानी वा हावालाई पछाडि धकेल्दै जहाजलाई अगाडि बढाउने पाङ्ग्रा जस्तो यन्त्र हो।\n① 조타실 भनेको जहाज चलाउने कोठा हो ✗\n② 프로펠러 भनेको प्रोपेलर वा पंखा हो जसले पानी वा हावा धकेलेर जहाजलाई अगाडि बढाउँछ ✓\n③ 양망기 भनेको जालो तान्ने यन्त्र हो ✗\n④ 비계기둥 भनेको मचानको खाम्बा हो ✗"}, {"n": "401", "q": "어떤 물체나 구조물의 표면이 갈라져 금이 가는 상태입니다. 주로 건축물, 도로, 유리, 땅 등의 표면에 생기는 좁고 길게 벌어진 틈을 가리킵니다.", "options": ["균열", "물기", "부식", "녹"], "answer": 0, "explain": "प्रश्नको अर्थ: यो भवन, बाटो वा सिसाको सतहमा आउने सानो र लामो चिरिएको भाग वा फाटेको ठाउँलाई जनाउँछ। यसले कुनै वस्तु फुट्न वा फाट्न थालेको अवस्थालाई बुझाउँछ।\n① 균열 भनेको चर्किएको वा फुटेको भाग हो, जुन सतहमा मसिनो रेखा जस्तै फाट्ने विवरणसँग एकदम मिल्छ। ✓\n② 물기 भनेको ओस वा पानीको मात्रा हो, त्यसैले यो चर्किएको अवस्था होइन। ✗\n③ 부식 भनेको धातु खिइने वा नष्ट हुने प्रक्रिया हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 녹 भनेको फलाममा लाग्ने खिया हो, त्यसैले यो पनि सही होइन। ✗"}, {"n": "402", "q": "산화되어 생긴 부식물로, 주로 철이나 강철에서 발생합니다. 이를 방지하기 위해 정기적인 청소와 방청 처리가 필요합니다.", "options": ["면적", "물기", "폭", "녹"], "answer": 3, "explain": "प्रश्नको अर्थ: यो फलाम वा अन्य धातुमा हावा र पानीको सम्पर्कले गर्दा लाग्ने रातो वा खैरो पदार्थ हो। यसबाट जोगाउन फलामलाई नियमित सफा गर्ने र मर्मत गर्ने गरिन्छ।\n① 면적 भनेको क्षेत्रफल हो, त्यसैले यो फलाममा लाग्ने वस्तु होइन। ✗\n② 물기 भनेको ओस वा पानीको मात्रा हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 폭 भनेको चौडाइ हो, त्यसैले यो पनि सही उत्तर होइन। ✗\n④ 녹 भनेको फलाममा लाग्ने खिया हो, जुन अक्सिजन र पानीको सम्पर्कले हुने खियाको विवरणसँग एकदम मिल्छ। ✓"}, {"n": "403", "q": "선박이나 다른 시설에서 안전을 위해 설치된 보호용 장치입니다. 주로 선박의 갑판이나 계단, 출입구 등에 설치되어 승객이나 선원이 떨어지는 사고를 방지하는 역할을 합니다.", "options": ["프로펠러", "도료 호스", "안전난간", "작업발판"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पानीजहाज वा अग्लो ठाउँमा मानिसहरू लड्न वा खस्न नदिन बारको रूपमा हालिने सुरक्षा साधन हो। यसले कामदार वा यात्रीहरूलाई तल खस्नबाट जोगाउँछ।\n① 프로펠러 भनेको जहाज गुडाउने पंखा हो, त्यसैले यो सुरक्षा बार होइन। ✗\n② 도료 호스 भनेको रङ लगाउने पाइप हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 안전난간 भनेको सुरक्षा बार हो, जुन मानिसहरू तल खस्नबाट जोगाउने सुरक्षा उपकरणको विवरणसँग एकदम मिल्छ। ✓\n④ 작업발판 भनेको काम गर्दा उभिने प्लेटफर्म हो, त्यसैले यो सुरक्षा बार होइन। ✗"}, {"n": "404", "q": "선박이나 건설 현장 등에서 작업자가 안전하게 작업을 할 수 있도록 설치된 평평한 표면입니다. 작업 중에 대 위에 서서 작업할 수 있도록 줍니다.", "options": ["비계기둥", "밑둥잡이", "안전난간", "작업발판"], "answer": 3, "explain": "प्रश्नको अर्थ: यो निर्माण क्षेत्र वा जहाजमा कामदारहरू उभिएर सुरक्षित रूपमा काम गर्न बनाइएको समतल ठाउँ हो। यसले अग्लो वा असजिलो ठाउँमा उभिन सजिलो बनाउँछ।\n① 비계기둥 भनेको स्काफोल्डिङको खम्बा हो, यो टेकेर उभिने समथर भाग होइन। ✗\n② 밑둥잡이 भनेको तल्लो भाग अड्याउने काठ वा खाँबो हो, यो कामदार उभिने ठाउँ होइन। ✗\n③ 안전난간 भनेको सुरक्षा रेलिङ हो, यसले खस्नबाट जोगाउँछ तर उभिने सतह होइन। ✗\n④ 작업발판 भनेको काम गर्ने फल्याक वा समथर प्लेटफर्म हो, जसमा उभिएर कामदारले सुरक्षित रूपमा काम गर्न सक्छन्, त्यसैले यो सही विवरण हो। ✓"}, {"n": "405", "q": "작업 현장이나 선박 등에서 작업자의 안전과 편의를 위해 바닥에 까는 단단하고 평평한 판입니다. 미끄럼 방지나 충격 완화, 바닥 보호 등의 역할을 합니다.", "options": ["가세", "깔판", "띠장", "면적"], "answer": 1, "explain": "प्रश्नको अर्थ: यो काम गर्ने ठाउँको भुइँमा बिछ्याइने बलियो र समतल पाता हो। यसले चिप्लिनबाट रोक्छ र भुइँको सुरक्षा गर्छ।\n① 가세 भनेको तिरछा टेको हो, जसले संरचनालाई अड्याउँछ तर भुइँमा ओछ्याउने पाटा होइन। ✗\n② 깔판 भनेको भुइँमा ओछ्याउने म्याट वा पाटा हो, जसले चिप्लिनबाट जोगाउँछ र भुइँको रक्षा गर्छ, त्यसैले यो सही विवरण हो। ✓\n③ 띠장 भनेको तेर्सो बीम हो, यो भुइँमा ओछ्याउने पाटा होइन। ✗\n④ 면적 भनेको क्षेत्रफल हो, यो कुनै ओछ्याउने सामग्री होइन। ✗"}, {"n": "406", "q": "구조물의 강도를 보강하거나 외부 충격을 분산시키기 위해 설치하는 가로막대 또는 지지재입니다. 선박이나 건설 구조물에서 자주 사용되며, 안정성과 내구성을 높이는 역할을 합니다.", "options": ["기둥", "깔판", "띠장", "장선"], "answer": 2, "explain": "प्रश्नको अर्थ: यो कुनै बनावट वा संरचनालाई ढल्न नदिन र अझ बलियो बनाउन तेर्सो पारिने काठ वा फलामको बार हो। यसले बाहिरी धक्कालाई थाम्ने काम गर्छ।\n① 기둥 भनेको खम्भा हो, यो ठाडो भार थाम्न प्रयोग हुन्छ र वर्णन गरिएको तेर्सो बार होइन। ✗\n② 깔판 भनेको भुइँमा राख्ने फट्टा वा म्याट हो, यो बलियो बनाउने तेर्सो बार वा सपोर्ट होइन। ✗\n③ 띠장 भनेको संरचनाको बलियोपन बढाउन वा बाह्य धक्का छर्रन राखिने तेर्सो बार वा सपोर्ट हो ✓\n④ 장선 भनेको ढलान वा फ्लोर जोइस्ट हो, यो मुख्यतया फ्लोरको भार थाम्न हुन्छ। ✗"}, {"n": "407", "q": "선박의 뼈대를 이루는 구조 부재로, 바닥(갑판)을 지지하기 위해 가로 방향으로 설치됩니다. 선체의 강도를 높이고, 갑판 하중을 고르게 분산시키는 역할을 합니다.", "options": ["가세", "난간", "균열", "장선"], "answer": 3, "explain": "प्रश्नको अर्थ: यो पानीजहाजको भुइँलाई थाम्ने र जहाजको ढाँचालाई बलियो बनाउन तेर्सो गरी राखिने मुख्य भाग हो। यसले जहाजको तौललाई बराबर बाँड्न मद्दत गर्छ।\n① 가세 भनेको छड्के टेको (ब्रेस) हो, यो तेर्सो दिशामा राखिने डेक सपोर्ट होइन। ✗\n② 난간 भनेको रेलिङ हो, यो सुरक्षाका लागि छेउमा राखिन्छ। ✗\n③ 균열 भनेको चिरा वा धाँजा (क्र्याक) हो, यो संरचनात्मक भाग होइन। ✗\n④ 장선 भनेको जहाज वा निर्माणमा भुइँ वा डेकलाई टेवा दिन तेर्सो दिशामा राख지는 स्ट्रक्चरल मेम्बर हो ✓"}, {"n": "408", "q": "구조물의 강도를 보강하기 위해 설치하는 보조 부재입니다. 선박에서는 장선이나 기둥 등이 받는 힘을 분산시키고 구조적 안정성을 높이기 위해 사용됩니다.", "options": ["가세", "깔판", "띠장", "면적"], "answer": 0, "explain": "प्रश्नको अर्थ: यो खम्बा वा संरचनालाई थप मजबुत बनाउन छड्के वा सहायताको रूपमा राखिने बलियो साधन हो। यसले बनावटको सन्तुलन कायम राख्न सहयोग गर्छ।\n① 가세 भनेको संरचनाको शक्ति बढाउन राखिने सहायक सदस्य वा छड्के टेको (ब्रेस) हो ✓\n② 깔판 भनेको आधारमा राखिने फट्टा वा म्याट हो। ✗\n③ 띠장 भनेको तेर्सो बार हो। ✗\n④ 면적 भनेको क्षेत्रफल हो। ✗"}, {"n": "409", "q": "재배할 때, 외부 환경(온도, 습도, 바람 등)으로부터 보호하기 위해 비닐을 씌워 만든 임시 또는 반영구적인 구조물입니다.", "options": ["비닐하우스", "울타리망", "방열복", "차광막"], "answer": 0, "explain": "प्रश्नको अर्थ: यो बिरुवा वा तरकारीलाई जाडो, हावा र पानीबाट जोगाउन प्लास्टिकले ढाकेर बनाइएको संरचना हो। यसभित्र कृषिका लागि उपयुक्त वातावरण तयार गरिन्छ।\n① 비닐하우스 भनेको बिरुवा खेती गर्दा बाह्य वातावरणबाट बचाउन प्लास्टिकले छोपेर बनाइएको संरचना हो ✓\n② 울타리망 भनेको बार वा जाली हो। ✗\n③ 방열복 भनेको तातोबाट बचाउने पोसाक हो। ✗\n④ 차광막 भनेको घाम छेक्ने जाली हो। ✗"}, {"n": "410", "q": "구조물이나 장비를 안정적으로 버티고 지탱하기 위해 설치하는 부재입니다. 선박에서는 장비 고정, 작업 안정, 구조물 보강 등 다양한 용도로 사용됩니다.", "options": ["지지대", "대각선", "구조물", "중앙부"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कुनै सामान वा संरचनालाई नढल्ने गरी अड्याउन र सहारा दिन प्रयोग गरिने साधन हो। यसले मेसिन वा बनावटलाई एकै ठाउँमा स्थिर राख्छ।\n① 지지대 भनेको संरचना वा उपकरणलाई स्थिर रूपमा थाम्न राखिने टेको वा सपोर्ट हो ✓\n② 대각선 भनेको कर्णाकार वा छड्के रेखा हो। ✗\n③ 구조물 भनेको संरचना हो। ✗\n④ 중앙부 भनेको केन्द्रीय भाग हो। ✗"}, {"n": "411", "q": "땅속에서 캐내는 소중한 자원으로, 암석이나 금속처럼 쓸모 있는 것입니다. 예를 들면 철, 금, 석탄 같은 것이 있고, 이것들은 공장이나 건설, 전기 만들기에 쓰입니다.", "options": ["삼림 보호", "광물 자원", "온실 가스", "천연자원"], "answer": 1, "explain": "प्रश्नको अर्थ: यो जमिनमुनिबाट खनेर निकालिने फलाम, सुन वा कोइला जस्ता बहुमूल्य प्राकृतिक वस्तु हो। यसलाई कारखाना र निर्माण कार्यमा व्यापक रूपमा प्रयोग गरिन्छ।\n① 삼림 보호 भनेको जङ्गल संरक्षण हो। ✗\n② 광물 자원 भनेको खनिज साधन हो, जुन जमिनमुनिबाट निकालिने फलाम, सुन, कोइला जस्ता उपयोगी वस्तु हुन् ✓\n③ 온실 가스 भनेको हरितगृह ग्यास हो। ✗\n④ 천연자원 भनेको प्राकृतिक स्रोत हो (यो अलि फराकिलो अर्थ हुन्छ तर खनिजलाई विशेष रूपमा 광물 자원 भनिन्छ)। ✗"}, {"n": "412", "q": "갱도의 입구로, 즉 땅속으로 들어가는 통로나 문을 말합니다. 작업자나 장비가 드나들고, 공기가 드나드는 중요한 장소입니다.", "options": ["광부", "수갱", "갱구", "갱도"], "answer": 2, "explain": "प्रश्नको अर्थ: यो जमिनमुनिको खानीभित्र छिर्ने वा बाहिर निस्कने मुख्य ढोका वा बाटो हो। यहाँबाट कामदार, मेसिन र हावा आउने-जाने गर्छ।\n① 광부 भनेको खानी मजदुर हो। ✗\n② 수갱 भनेको ठाडो सुरुङ हो। ✗\n③ 갱구 भनेको सुरुङको मुख वा प्रवेशद्वार हो, जहाँबाट मानिस, उपकरण र हावा आवतजावत गर्छ ✓\n④ 갱도 भनेको सुरुङ हो। ✗"}, {"n": "413", "q": "지하에서 물을 퍼내거나, 지하수를 채굴하기 위해 파는 구멍이나 갱도를 말합니다. 주로 광산이나 건설 현장에서 지하수 문제를 해결하기 위해 사용됩니다.", "options": ["사갱", "수갱", "갱구", "광차"], "answer": 1, "explain": "प्रश्नको अर्थ: यो जमिनमुनिको पानी बाहिर फाल्न वा पानी निकाल्न खनिएको विशेष खाल्डो वा सुरुङ हो। यसले खानीभित्र पानी भरिनबाट रोक्न मद्दत गर्छ।\n① 사갱 भनेको छड्के सुरुङ हो। ✗\n② 수갱 भनेको जमिनमुनिबाट पानी फाल्न वा भूमिगत पानी निकाल्न खनिएको ठाडो सुरुङ वा प्वाल हो ✓\n③ 갱구 भनेको सुरुङको मुख हो। ✗\n④ 광차 भनेको कोइला वा खनिज बोक्ने गाडी हो। ✗"}, {"n": "414", "q": "광물 자원을 채굴하기 위해 수직으로 파는 갱도를 말합니다. 주로 깊은 곳에 있는 광석을 캐내기 위해 사용되며, 작업자나 자재를 운반하는 통로로 활용됩니다.", "options": ["사갱", "수갱", "탄광", "광차"], "answer": 1, "explain": "प्रश्नको अर्थ: यो गहिरो जमिनमुनि पुग्नका लागि सीधा ठाडो खनिएको सुरुङ हो। यसबाट कामदार र सामान तल-माथि ओसारपसार गरिन्छ।\n① 사갱 भनेको छड्के सुरुङ हो। ✗\n② 수갱 भनेको खनिज निकाल्नका लागि ठाडो रूपमा खनिएको सुरुङ हो, जसले मजदुर र सामग्री ओसार्न सघाउँछ ✓\n③ 탄광 भनेको कोइला खानी हो। ✗\n④ 광차 भनेको खानीको गाडी हो। ✗\nशिक्षकको उत्तर-पत्र: ① 사갱 — मेरो उत्तर: ② 수갱। प्रश्न: '수직으로 파는 갱도' — ठाडो (VERTICALLY) खनिएको खानी — 수갱 (vertical shaft) हो; 사갱 त भिरालो/ढलान खानी हो।"}, {"n": "415", "q": "채광장은 광물을 캐내기 위해 만들어진 장소입니다. 광석, 석탄 등을 채굴하는 광산이나 채굴 현장을 말합니다.", "options": ["인차", "수갱", "탄광", "막장"], "answer": 3, "explain": "प्रश्नको अर्थ: यो कोइला वा अन्य बहुमूल्य धातुहरू खनेर निकालिने काम गर्ने ठाउँ वा खानी हो। यहाँ जमिनमुनिबाट कच्चा पदार्थ निकाल्ने काम हुन्छ।\n① 인차 भनेको मानिस बोक्ने गाडी हो। ✗\n② 수갱 भनेको ठाडो सुरुङ हो। ✗\n③ 탄광 भनेको कोइला खानी हो। ✗\n④ 막장 भनेको खानीमा खनिज खन्ने मुख्य ठाउँ वा च्यानल (채광장) हो ✓"}, {"n": "416", "q": "광산에서 광물을 채굴하는 일을 하는 사람을 말합니다. 땅속에서 자원을 캐내는 일을 하며, 작업이 위험하고 힘든 경우가 많습니다.", "options": ["주부", "광부", "농부", "어부"], "answer": 1, "explain": "प्रश्नको अर्थ: यो खानीभित्र पसेर कोइला वा धातुहरू खन्ने र निकाल्ने काम गर्ने व्यक्ति हो। यो निकै गाह्रो र जोखिमपूर्ण पेसा हो।\n① 주부 भनेको गृहणी हो। ✗\n② 광부 भनेको खानी मजदुर हो, जसले जमिनमुनिबाट खनिज खन्ने काम गर्छ ✓\n③ 농부 भनेको किसान हो। ✗\n④ 어부 भनेको माछा मार्ने मानिस हो। ✗"}, {"n": "417", "q": "광산에서 작업자를 데리고 다니는 차량입니다. 광산 내에서 작업자들이 이동할 때 사용하는 이동 수단입니다.", "options": ["수레", "막장", "인차", "광차"], "answer": 2, "explain": "प्रश्नको अर्थ: यो खानीभित्र कामदारहरूलाई एक ठाउँबाट अर्को ठाउँमा ओसारपसार गर्न प्रयोग गरिने गाडी हो। यसले कामदारको यात्रा सजिलो बनाउँछ।\n① 수레 भनेको हातले घकेल्ने गाडा हो, यो खानीमा मानिस ओसार्ने गाडी होइन। ✗\n② 막장 भनेको खानीको अन्तिम खन्ने ठाउँ हो, यो सवारी साधन होइन। ✗\n③ 인차 भनेको खानीभित्र कामदारहरूलाई ल्याउने र लैजाने गाडी हो, त्यसैले यो सही विवरण हो। ✓\n④ 광차 भनेको खनिज पदार्थ वा कोइला ओसार्ने गाडा हो, मानिस बोक्ने गाडी होइन। ✗"}, {"n": "418", "q": "광산에서 광물을 운반하는 수레나 운반 도구로, 보통 광물이나 자재를 지하에서 지상으로 이동시키는 데 사용됩니다.", "options": ["탄광", "막장", "인차", "광차"], "answer": 3, "explain": "प्रश्नको अर्थ: यो खानीभित्र खनिएका सामान वा पत्थरहरू बोकेर बाहिर ल्याउन प्रयोग गरिने सानो डिब्बा वा ठेलागाडी हो।\n① 탄광 भनेको कोइला खानी हो, यो सामान ओसार्ने साधन होइन। ✗\n② 막장 भनेको खानीको अन्तिम सुरुङ क्षेत्र हो, यो गाडी वा गाडा होइन। ✗\n③ 인차 भनेको कामदार बोक्ने गाडी हो, खनिज ओसार्ने गाडा होइन। ✗\n④ 광차 भनेको खानीबाट खनिज र सामग्रीहरू बोकेर ओसार्ने गाडा हो, त्यसैले यो सही विवरण हो। ✓"}, {"n": "419", "q": "광산에서 채굴한 광물이나 자재를 갱도 위로 끌어올리는 기계입니다. 주로 수직으로 설치되어, 광물이나 작업자를 지상으로 안전하게 운반하는 역할을 합니다.", "options": ["권양기", "지지대", "수평경", "재광장"], "answer": 0, "explain": "प्रश्नको अर्थ: यो खानीको गहिरो भागबाट सामान वा कामदारलाई डोरीको सहायताले माथि तान्ने मेसिन हो। यसले भारी वस्तुहरू सजिलै माथि उठाउँछ।\n① 권양기 भनेको विन्च वाहोइस्ट मेसिन हो, जसले खानीबाट खनिज वा मानिसलाई माथि तान्ने काम गर्छ ✓\n② 지지대 भनेको टेको हो। ✗\n③ 수평경 भनेको तेर्सो सुरुङ हो। ✗\n④ 재광장 भनेको खानी पुन: सञ्चालन गर्ने ठाउँ हो। ✗"}, {"n": "420", "q": "탄광에서 캐낸 석탄을 분류, 세척, 가공하는 곳입니다. 석탄에 섞인 돌이나 불순물을 제거하고, 용도에 따라 크기나 품질별로 나눠서 저장하거나 운반 준비를 합니다.", "options": ["석회선", "선탄장", "수평경", "재광장"], "answer": 1, "explain": "प्रश्नको अर्थ: यो खानीबाट निकालिएको कोइलालाई पखालेर, ढुङ्गा छुट्ट्याएर र आकार अनुसार वर्गीकरण गर्ने ठाउँ हो।\n① 석회선 भनेको चुना ढुंगाको रेखा वा क्षेत्र हो, कोइला सफा गर्ने ठाउँ होइन। ✗\n② 선탄장 भनेको कोइला छुट्याउने र सफा गर्ने ठाउँ हो, त्यसैले यो सही विवरण हो। ✓\n③ 수평경 भनेको तेर्सो सुरुङ हो, प्रसोधन केन्द्र होइन। ✗\n④ 재광장 भनेको पुन: खानी क्षेत्र हो, कोइला छान्ने ठाउँ होइन। ✗"}, {"n": "421", "q": "단단한 암석이나 광맥을 깨뜨리기 위해 사용하는 공구 또는 기계입니다. 주로 광산, 터널, 건설 현장에서 바위를 뚫거나 깨는 데 쓰입니다.", "options": ["청소기", "세탁기", "착암기", "건조기"], "answer": 2, "explain": "प्रश्नको अर्थ: यो खानी, सुरुङ वा निर्माण क्षेत्रमा कडा चट्टान र ढुङ्गाहरू फुटाउन वा दुलो पार्न प्रयोग गरिने एक औजार वा मेसिन हो।\n① 청소기 भनेको फोहर सरसफाइ गर्ने भ्याकुम क्लिनर हो, त्यसैले यो चट्टान फुटाउने औजार होइन। ✗\n② 세탁기 भनेको लुगा धुने मेसिन हो, त्यसैले यो खानीमा प्रयोग हुने उपकरण होइन। ✗\n③ 착암기 भनेको कडा चट्टान वा ढुंगा फुटाउन प्रयोग गरिने मेसिन हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ✓\n④ 건조기 भनेको सामान वा लुगा सुकाउने मेसिन हो, त्यसैले यो गलत छ। ✗"}, {"n": "422", "q": "광산이나 공장 등에서 물건이나 자재를 자동으로 옮기는 장치입니다. 벨트나 롤러 위에 광물, 석탄, 자재 등을 올려놓으면 연속적으로 이동시켜 작업 효율을 높여줍니다.", "options": ["트플링실", "스크레이퍼", "컨베이어", "안전난간"], "answer": 2, "explain": "प्रश्नको अर्थ: यो खानी वा कारखानामा सामान र कच्चा पदार्थहरूलाई आफैं लगातार एक ठाउँबाट अर्को ठाउँमा सार्ने प्रविधि हो।\n① 트플링실 को अर्थ त्रिपलिंग सिल हो, यो यस विवरणसँग सम्बन्धित छैन त्यसैले मिल्दैन। ✗\n② 스크레이퍼 को अर्थ स्क्रैपर हो, यो उत्खनन वा सम्याउने उपकरण हो त्यसैले मिल्दैन। ✗\n③ 컨베이어 को अर्थ कन्भेयर बेल्ट हो, यो खानी वा कारखानाहरूमा सामान वा सामग्रीहरू स्वचालित रूपमा सार्ने उपकरण हो ✓\n④ 안전난간 को अर्थ सुरक्षा रेलिङ हो, यो खस्नबाट बच्ने बार हो त्यसैले मिल्दैन। पहिलो विकल्प '트플링실' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "423", "q": "땅속에 있는 석탄을 캐내는 작업을 말합니다. 탄광에서 광부들이 석탄을 파내어 운반하는 모든 과정을 포함하며, 광업의 중요한 단계입니다.", "options": ["간격", "탄광", "광부", "채탄"], "answer": 3, "explain": "प्रश्नको अर्थ: यो जमिनमुनि रहेको कोइला खनेर बाहिर निकाल्ने र ओसारपसार गर्ने कामलाई बुझाउँछ।\n① 간격 भनेको दुई वस्तु वा समय बीचको दुरी हो, त्यसैले यो कोइला खन्ने काम होइन। ✗\n② 탄광 भनेको कोइला निकालिने खानी हो, तर यो कार्य होइन। ✗\n③ 광부 भनेको खानीमा काम गर्ने कामदार हो, तर यो प्रक्रिया होइन। ✗\n④ 채탄 भनेको जमिनमुनिबाट कोइला खनेर निकाल्ने कार्य हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ✓"}, {"n": "424", "q": "숲에서 얻을 수 있는 유용한 자원으로, 나무, 풀, 버섯 같은 것들이 포함됩니다. 목재는 건축, 가구, 연료 등으로 쓰이며, 숲은 공기 정화와 생태계 보호에도 큰 역할을 합니다.", "options": ["문화유산", "산림 자원", "개인 재산", "천연자원"], "answer": 1, "explain": "प्रश्नको अर्थ: यो जङ्गल वा वनबाट प्राप्त हुने काठ, बिरुवा र अन्य उपयोगी प्राकृतिक वस्तुहरूलाई भनिन्छ।\n① 문화유산 को अर्थ सांस्कृतिक सम्पदा हो, यो जङ्गलका स्रोतसँग सम्बन्धित छैन त्यसैले मिल्दैन। ✗\n② 산림 자원 को अर्थ वन स्रोत हो, यो जङ्गलबाट प्राप्त हुने रुख, घाँस, च्याउ आदि उपयोगी स्रोतहरूलाई जनाउँछ ✓\n③ 개인 재산 को अर्थ व्यक्तिगत सम्पत्ति हो, यो वन स्रोतको परिभाषा होइन त्यसैले मिल्दैन। ✗\n④ 천연자원 को अर्थ प्राकृतिक स्रोत हो, यो धेरै फराकिलो शब्द हो तर विशेष गरी जङ्गलका वस्तुहरूलाई 산림 자원 भनिन्छ त्यसैले यहाँ 산림 자원 मिल्छ। ✗"}, {"n": "425", "q": "나무의 뿌리까지 뽑아내는 작업으로, 이식이나 제거할 때 사용됩니다. 주로 조경이나 산림관리에서 이루어집니다.", "options": ["굴취", "갱도", "도장", "채탄"], "answer": 0, "explain": "प्रश्नको अर्थ: यो रुखलाई अर्को ठाउँमा सार्न वा हटाउनका लागि जरासहित उखेलेर खन्ने कार्य हो।\n① 굴취 को अर्थ रुख वा बिरुवाको जरासहित उखेल्ने काम हो, यो रूखलाई जरादेखि नै निकाल्ने कामसँग सम्बन्धित छ ✓\n② 갱도 को अर्थ खानीको सुरुङ हो, यो जमिनमुनिको बाटो हो त्यसैले मिल्दैन। ✗\n③ 도장 को अर्थ पेन्टिङ वा रंग लगाउने काम हो, यो रुख उखेल्ने काम होइन त्यसैले मिल्दैन। ✗\n④ 채탄 को अर्थ कोइला उत्खनन हो, यो कोइला निकाल्ने काम हो त्यसैले मिल्दैन। ✗"}, {"n": "426", "q": "거칠고 튼튼한 마나 폴리프로필렌 재질로 만든 자루로, 모래, 곡물, 광물, 쓰레기 등을 담아 운반하거나 보관할 때 사용됩니다.", "options": ["담요", "마대", "배낭", "가방"], "answer": 1, "explain": "प्रश्नको अर्थ: यो बालुवा, खाद्यान्न वा फोहोर जस्ता वस्तुहरू राखेर बोक्न वा भण्डारण गर्न प्रयोग गरिने बलियो बोरा हो।\n① 담요 भनेको ओढ्ने कम्बल हो, त्यसैले यो सामान ओसार्ने बोरा होइन। ✗\n② 마대 भनेको जुट वा बलियो प्लास्टिकबाट बनेको बोरा हो, जुन बालुवा वा अन्न राख्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग एकदम मिल्छ। ✓\n③ 배낭 भनेको ढाडमा बोक्ने झोला हो, त्यसैले यो ठूलो बोरा होइन। ✗\n④ 가방 भनेको सामान राख्ने सामान्य झोला हो, त्यसैले यो पनि सही होइन। ✗"}, {"n": "427", "q": "산림에서 나무를 베어내는 작업을 말합니다. 목재를 얻거나, 땅을 다른 용도로 사용하기 위해 나무를 베며, 계획적이지 않으면 산림 파괴의 원인이 될 수 있습니다.", "options": ["운재", "청소", "벌목", "집재"], "answer": 2, "explain": "प्रश्नको अर्थ: यो जङ्गलमा काठ प्राप्त गर्न वा जमिन प्रयोग गर्नका लागि रुखहरू ढाल्ने वा काट्ने काम हो।\n① 운재 को अर्थ काठ ढुवानी हो, यो काटिसकेको काठ सार्ने काम हो त्यसैले मिल्दैन। ✗\n② 청소 को अर्थ सरसफाइ हो, यो फोहोर सफा गर्ने काम हो त्यसैले मिल्दैन। ✗\n③ 벌목 को अर्थ रुख काट्ने काम (फँडानी) हो, यो वनबाट रुखहरू काट्ने कामलाई जनाउँछ ✓\n④ 집재 को अर्थ काठ थुपार्ने काम हो, यो काटेका काठ एक ठाउँमा जम्मा गर्ने काम हो त्यसैले मिल्दैन। ✗"}, {"n": "428", "q": "나무를 정리하거나 쌓아 놓은 재목을 뜻합니다. 주로 산림 작업이나 목재 생산 과정에서 사용되는 말로, 잘라낸 나무를 가공이나 운반을 위해 정리해 놓은 상태를 말합니다.", "options": ["운재", "조재", "벌목", "수확"], "answer": 1, "explain": "प्रश्नको अर्थ: यो वनमा काटिएका रुखहरूलाई ओसारपसार वा प्रशोधन गर्नका लागि हाँगाबिँगा काटेर तयार पारिएको काठ हो।\n① 운재 को अर्थ काठ ढुवानी हो, यो काठ ओसार्ने काम हो त्यसैले मिल्दैन। ✗\n② 조재 को अर्थ काठ मिलाउने वा छाँट्ने काम हो, यो काटेका रुखहरूलाई प्रयोगयोग्य बनाउन मिलाएर राख्ने वा साइज काट्ने काम हो ✓\n③ 벌목 को अर्थ रुख काट्ने काम हो, यो रुख ढाल्ने काम हो त्यसैले मिल्दैन। ✗\n④ 수확 को अर्थ बाली भित्र्याउने वा कटनी गर्ने काम हो, यो कृषि उत्पादनसँग सम्बन्धित छ त्यसैले मिल्दैन। ✗"}, {"n": "429", "q": "산림 작업에서 나무를 자른 후, 정리된 나무를 산 밖이나 가공 장소까지 옮기는 과정을 말합니다.", "options": ["청소", "굴취", "벌목", "운재"], "answer": 3, "explain": "प्रश्नको अर्थ: यो जङ्गलमा काटिएका र मिलाइएका काठहरूलाई वन बाहिर वा अन्य ठाउँसम्म बोकेर लैजाने प्रक्रिया हो।\n① 청소 को अर्थ सरसफाइ हो, यो जङ्गल सफा गर्ने काम होइन त्यसैले मिल्दैन। ✗\n② 굴취 को अर्थ रुख जरासहित उखेल्ने काम हो, यो ढुवानीसँग सम्बन्धित छैन त्यसैले मिल्दैन। ✗\n③ 벌목 को अर्थ रुख काट्ने काम हो, यो रुख ढाल्ने काम हो त्यसैले मिल्दैन। ✗\n④ 운재 को अर्थ काठ ढुवानी हो, यो जङ्गलबाट काटिएका काठहरू बाहिर वा प्रशोधन गर्ने ठाउँसम्म ओसार्ने काम हो ✓"}, {"n": "430", "q": "회전하는 톱날이 달린 쇠사슬을 이용해 나무를 자르는 기계입니다. 강한 나무도 빠르고 효율적으로 절단할 수 있어서 산림 작업에서 중요한 도구입니다.", "options": ["하베스터", "집재장", "체인톱", "벌채지"], "answer": 2, "explain": "प्रश्नको अर्थ: यो घुम्ने साङ्लोयुक्त तिखो चक्कुको मद्दतले ठूला र कडा रुखहरूलाई छिटो काट्न प्रयोग गरिने मेसिन हो।\n① 하베스터 को अर्थ हार्वेस्टर (रुख काट्ने मेशिन) हो, यो बहु-कार्यकारी वन मेशिन हो त्यसैले मिल्दैन। ✗\n② 집재장 को अर्थ काठ थुपार्ने ठाउँ हो, यो मेशिन होइन त्यसैले मिल्दैन। ✗\n③ 체인톱 को अर्थ चेनसा (सिक्री आरा) हो, यो घुम्ने दाँत भएको सिक्री प्रयोग गरेर रुख काट्ने मेशिन हो ✓\n④ 벌채지 को अर्थ रुख काटिएको क्षेत्र हो, यो ठाउँको नाम हो त्यसैले मिल्दैन। किताबमा पहिलो विकल्प '하베스타' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '하베스터' हो। ✗"}, {"n": "431", "q": "벌목한 나무들을 모아두는 장소입니다. 산속에서 베어 낸 나무들을 운반하기 전에 한곳에 모아 정리하고, 이후에 운재를 쉽게 할 수 있도록 마련된 공간입니다.", "options": ["운동장", "집재장", "경기장", "양식장"], "answer": 1, "explain": "प्रश्नको अर्थ: यो जङ्गलमा काटिएका काठहरूलाई अन्यत्र लैजानुअघि एकै ठाउँमा जम्मा गरेर राख्ने ठाउँ हो।\n① 운동장 को अर्थ खेल मैदान हो, यो वनको कामसँग सम्बन्धित छैन त्यसैले मिल्दैन। ✗\n② 집재장 को अर्थ काठ जम्मा गर्ने ठाउँ हो, यो जङ्गलमा काटेका रुखहरू ढुवानी गर्नु अघि एक ठाउँमा थुपारेर राख्ने ठाउँ हो ✓\n③ 경기장 को अर्थ खेलकुद स्थल हो, यो मिल्दैन। ✗\n④ 양식장 को अर्थ माछापालन वा सीपपालन गर्ने ठाउँ हो, यो मिल्दैन। ✗"}, {"n": "432", "q": "나무를 베고, 가지를 치고, 길이대로 자르는 작업을 자동으로 하는 산림 기계입니다. 벌목, 조재, 집재 과정을 빠르고 효율적으로 처리할 때 사용됩니다.", "options": ["하베스터", "집재장", "크레인", "지게차"], "answer": 0, "explain": "प्रश्नको अर्थ: यो रुख काट्ने, हाँगा पन्छाउने र निश्चित नापमा टुक्राउने काम आफैं गर्ने आधुनिक वन मेसिन हो।\n① 하베스터 भनेको रुख ढाल्ने, हाँगा काट्ने र काठ टुक्र्याउने स्वचालित मेसिन हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ✓\n② 집재장 भनेको काटिएका काठहरू जम्मा गर्ने ठाउँ हो, त्यसैले यो मेसिन होइन। ✗\n③ 크레인 भनेको गह्रौँ सामान उठाउने मेसिन हो, त्यसैले यो रुख काट्ने उपकरण होइन। ✗\n④ 지게차 भनेको सामान बोक्ने मेसिन हो, त्यसैले यो पनि गलत हो। किताबमा पहिलो विकल्प '하베스타' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '하베스터' हो। ✗"}, {"n": "433", "q": "청소와 운영에 필요한 소모품, 청소도구, 린넨, 어메니티 같은 물건을 보관하고 관리하는 공간입니다.", "options": ["음식물", "음료수", "비품실", "탈의실"], "answer": 2, "explain": "प्रश्नको अर्थ: यो होटल वा संस्थामा सरसफाइका सामान, तौलिया र आवश्यक सामग्रीहरू सुरक्षित राखिने कोठा हो।\n① 음식물 को अर्थ खानाको परिकार वा खाद्य पदार्थ हो, यो सामान राख्ने कोठा होइन त्यसैले मिल्दैन। ✗\n② 음료수 को अर्थ पिउनेपानी वा पेय पदार्थ हो, यो मिल्दैन। ✗\n③ 비품실 को अर्थ सामान वा सामग्री भण्डार कक्ष हो, यो सरसफाइका सामान, तौलिया आदि राख्ने ठाउँ हो ✓\n④ 탈의실 को अर्थ कपडा फेर्ने कोठा (चेन्जिङ रुम) हो, यो मिल्दैन। ✗"}, {"n": "434", "q": "실내나 특정 공간에서 좋은 향기를 퍼뜨려 냄새를 없애고 쾌적하게 만드는 제품입니다. 객실, 로비, 욕실 등에 청결하고 기분 좋은 인상을 주는 데 사용합니다.", "options": ["향수", "세제", "방향제", "대걸레"], "answer": 2, "explain": "प्रश्नको अर्थ: यो कोठा वा बन्द ठाउँको नराम्रो गन्ध हटाएर मीठो बासना फैलाउन प्रयोग गरिने वस्तु हो।\n① 향수 को अर्थ इत्र वा सेन्ट (परफ्युम) हो, यो मान्छेले शरीरमा लगाउने सु बास्ना हो त्यसैले मिल्दैन। ✗\n② 세제 को अर्थ डिटर्जेन्ट वा साबुन पानी हो, यो सफा गर्ने रसायन हो त्यसैले मिल्दैन। ✗\n③ 방향제 को अर्थ सु बास्ना छर्ने वस्तु (एयर फ्रेसनर) हो, यो कोठाको गन्ध हटाएर बास्नादार बनाउने वस्तु हो ✓\n④ 대걸레 को अर्थ ठूलो भुइँ पुछ्ने मप हो, यो सरसफाइको औजार हो त्यसैले मिल्दैन। ✗"}, {"n": "435", "q": "샴푸, 린스, 치약, 칫솔 등 얼굴을 씻거나 머리를 감을 때 필요한 용품들을 말합니다.", "options": ["전자제품", "화장품", "가전제품", "세면도구"], "answer": 3, "explain": "प्रश्नको अर्थ: यो साबुन, मञ्जन, ब्रस र स्याम्पु जस्ता मुख धुन तथा नुहाउन चाहिने आवश्यक सामानहरू हुन्।\n① 전자제품 को अर्थ इलेक्ट्रोनिक सामान हो, यो साम्ग्रीहरू पर्दैन त्यसैले मिल्दैन। ✗\n② 화장품 को अर्थ सौन्दर्य प्रसाधन (कोस्मेटिक) हो, यो अनुहारमा लगाउने क्रिम आदि हो त्यसैले मिल्दैन। ✗\n③ 가전제품 को अर्थ घरायसी विद्युतीय उपकरण हो, यो मिल्दैन। ✗\n④ 세면도구 को अर्थ मुख धुने र दाँत माझ्ने सामानहरू (स्याम्बू, मन्जन, ब्रस आदि) हुन् ✓"}, {"n": "436", "q": "침대를 덮거나 장식하는 천으로 만든 덮개입니다. 침대의 깔끔함을 유지하고, 위생을 보호하기 위해 사용됩니다.", "options": ["이불보", "침대보", "화장대", "리모컨"], "answer": 1, "explain": "प्रश्नको अर्थ: यो ओछ्यानलाई सफा राख्न र ढाक्नका लागि सिरक वा डसनामाथि ओछ्याइने कपडा हो।\n① 이불보 को अर्थ कबल वा कम्बल छोप्ने कपडा हो, यो ओछ्यान ढाक्न प्रयोग हुने भएकोले सही उत्तर हो। ✗\n② 침대보 को अर्थ बेडसिट वा ओछ्यानको तन्ना हो, यो ओछ्यानको म्याट्रिस छोप्न प्रयोग हुन्छ तर कबल ढाक्ने कपडा नभएकोले मिलेन। ✓\n③ 화장대 को अर्थ श्रृंगार टेबल वा मेकअप गर्ने टेबल हो, यो कोठाको फर्निचर भएकोले मिलेन। ✗\n④ 리모컨 को अर्थ रिमोट कन्ट्रोल हो, यो इलेक्ट्रोनिक उपकरण चलाउन प्रयोग हुने भएकोले मिलेन। ✗"}, {"n": "437", "q": "호텔이나 콘도에서 투숙객이 휴식 중이거나 방 청소를 원하지 않을 때 객실 문 손잡이에 걸어 두며, 직원은 이를 보고 객실 서비스를 잠시 보류합니다.", "options": ["헤어드라이어", "메이드 보고서", "DND 카드", "메이크업 카드"], "answer": 2, "explain": "प्रश्नको अर्थ: यो होटलका पाहुनाले आफू आराम गरिरहेको बेला कोठा सफा नगर्न अनुरोध गर्दै ढोकाको ह्यान्डलमा झुण्ड्याउने कार्ड हो।\n१. 헤어드라이어 भनेको कपाल सुकाउने मेसिन हो, त्यसैले यो ढोकामा झुन्ड्याउने कार्ड होइन। २. 메이드 보고서 भनेको सरसफाइ कर्मचारीको प्रतिवेदन हो, त्यसैले यो पाहुनाले प्रयोग गर्ने कार्ड होइन। ३. 디엔디 카드 भनेको बाधा नपुर्याउनुहोस् भनी ढोकामा झुन्ड्याइने कार्ड हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ४. 메이크업 카드 भनेको कोठा सफा गरिदिन अनुरोध गर्ने कार्ड हो, त्यसैले यो विश्रामको लागि होइन। त्यसैले सही उत्तर ३ नम्बरको 디엔디 카드 हो, जसको अर्थ बाधा नपुर्याउनुहोस् भन्ने कार्ड हुन्छ।"}, {"n": "438", "q": "투숙객이 외출할 때 객실 문 손잡이에 걸어두면, 하우스키핑 직원이 이를 보고 청소, 수건 교체, 침구 정리 등을 진행합니다.", "options": ["화장품", "화장대", "DND 카드", "메이크업 카드"], "answer": 3, "explain": "प्रश्नको अर्थ: यो होटलको कोठा सफा गर्न र तौलिया फेर्न कर्मचारीलाई जानकारी दिन ढोकामा झुण्ड्याइने संकेत कार्ड हो।\n① 화장품 को अर्थ कस्मेटिक वा सौन्दर्य प्रसाधन हो, यो सफाइ गराउने कार्ड नभएकोले मिलेन। ✗\n② 화장대 को अर्थ श्रृंगार टेबल हो, यो फर्निचर भएकोले मिलेन। ✗\n③ DND 카드 को अर्थ DND कार्ड हो, यो त सफाइ नगर भनेर झुन्ड्याउने कार्ड हो त्यसैले मिलेन। ✗\n④ 메이크업 카드 को अर्थ मेकअप कार्ड हो, यो ढोकामा झुन्ड्याउँदा सरसफाइ र तन्ना फेर्ने काम गर्ने, गराउने कार्ड भएकोले सही उत्तर हो। ✓"}, {"n": "439", "q": "뛰어난 경치나 특별한 문화 유산으로 유명하여 사람들이 찾아가는 곳입니다.", "options": ["해외 여행", "관광지", "단체 여행", "공연장"], "answer": 1, "explain": "प्रश्नको अर्थ: यो राम्रो प्राकृतिक दृश्य वा ऐतिहासिक महत्त्वका कारण 어 무, 생강, 마늘 등을 갈거나 채 썰 때 사용됩니다.", "options": ["식칼", "강판", "국자", "도마"], "answer": 1, "explain": "प्रश्नको अर्थ: यो मूला, अदुवा वा लसुनलाई मसिनो पारेर कोर्न प्रयोग गरिने धातुको साधन हो। यसको सतहमा साना तिखा प्वाल वा धारहरू हुन्छन्।\n① 식칼 को अर्थ चक्कु हो, यो मिलेन। ✗\n② 강판 को अर्थ घोट्ने वा कोर्ने धातुको पाता हो, यसमा साना दाँतीहरू हुने भएकाले मूला, अदुवा, लसुन आदि घोट्न वा चप गर्न प्रयोग हुने भएकोले सही उत्तर हो। ✓\n③ 국자 को अर्थ डाडु हो, यो झोलका लागि हो त्यसैले मिलेन। ✗\n④ 도마 को अर्थ काट्ने पिर्का हो, यो पनि मिलेन। ✗"}, {"n": "449", "q": "프라이팬에서 음식을 뒤집거나 옮길 때 사용하는 주방 도구입니다. 달걀, 팬케이크, 고기, 생선 등을 조리할 때 모양을 망치지 않고 뒤집기 위해 자주 사용됩니다.", "options": ["그릇", "접시", "뒤집개", "보온병"], "answer": 2, "explain": "प्रश्नको अर्थ: यो तावामा पकाउँदा खानेकुरालाई नभाँचिने गरी फर्काउन वा पल्टाउन प्रयोग गरिने भान्छाको औजार हो। अण्डा वा रोटी पकाउँदा यसको प्रयोग धेरै गरिन्छ।\n① 그릇 को अर्थ कचौरा वा भाँडो हो, यो प्यानमा खाना पल्टाउने औजार नभएकोले मिलेन। ✗\n② 접시 को अर्थ प्लेट हो, यो पनि मिलेन। ✗\n③ 뒤집개 को अर्थ फर्काउने औजार वा पन्यू (स्प्याच्युला) हो, यो प्यानमा अण्डा वा मासु पल्टाउन प्रयोग हुने भएकोले सही उत्तर हो। ✓\n④ 보온병 को अर्थ थर्मस फ्लास्क (तातो पानी राख्ने बोतल) हो, यो मिलेन। ✗"}, {"n": "450", "q": "밥을 퍼낼 때 사용하는 주방 도구입니다. 나무나 플라스틱 재질로 만들어져 음식에 손상을 주지 않도록 돕습니다.", "options": ["유리컵", "밥솥", "국자", "주걱"], "answer": 3, "explain": "प्रश्नको अर्थ: यो पकाएको भात भाँडोबाट पस्कन वा झिक्नका लागि प्रयोग गरिने साधन हो। यो प्रायः काठ वा प्लास्टिकबाट बनेको हुन्छ।\n① 유리컵 भनेको सिसाको कप हो, जसबाट पानी वा जुस पिइन्छ, त्यसैले यो सही उत्तर होइन। ✗\n② 밥솥 भनेको भात पकाउने राइस कुकर हो, जसमा भात पकाइन्छ, त्यसैले यो सही उत्तर होइन। ✗\n③ 국자 भनेको झोल उघाउने डाडु हो, जसले तरकारीको झोल निकालिन्छ, त्यसैले यो सही उत्तर होइन। ✗\n④ 주걱 भनेको भात उघाउने पन्यू हो, जसले पाकेको भात झिक्न प्रयोग गरिन्छ, त्यसैले यो विवरणसँग मिल्छ। ✓"}, {"n": "451", "q": "바다나 민물에서 자생하는 연체동물로, 단단한 껍데기를 가진 해산물입니다. 미역국, 파스타, 찜 요리 등 다양한 방식으로 요리됩니다.", "options": ["조개", "참치", "어류", "낙지"], "answer": 0, "explain": "प्रश्नको अर्थ: यो पानीमा पाइने कडा खपटा वा खोल भएको सानो जलचर जीव हो। यसलाई विभिन्न प्रकारका झोल वा परिकार बनाएर खाइन्छ।\n① 조개 भनेको सिपी हो, जुन समुद्र वा नदीमा पाइने कडा खोल भएको जीव हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n② 참치 भनेको टुना माछा हो, जुन ठूलो आकारको माछा हो, त्यसैले यो सही उत्तर होइन। ✗\n③ 어류 भनेको माछा वर्ग हो, जसले सबै जलचर माछाहरूलाई जनाउँछ, त्यसैले यो सही उत्तर होइन। ✗\n④ 낙지 भनेको अक्टोपस हो, जसको कडा खोल हुँदैन, त्यसैले यो सही उत्तर होइन। ✗"}, {"n": "452", "q": "위험하거나 방해가 되는 물건을 의미합니다. 보통 어떤 작업이나 환경에서 위험을 초래할 수 있는 요소를 말합니다.", "options": ["방사선", "장해물", "화학물", "독성물"], "answer": 1, "explain": "प्रश्नको अर्थ: यो काम गर्ने ठाउँ वा बाटोमा बाधा पुर्याउने र खतरा निम्त्याउने वस्तु हो। यसले मानिसलाई आवतजावत गर्न वा काम गर्न अप्ठ्यारो पार्छ।\n① 방사선 भनेको रेडिएसन वा विकिरण हो ✗\n② 장해물 भनेको जोखिम वा बाधा पुर्‍याउने वस्तु हो ✓\n③ 화학물 भनेको रासायनिक पदार्थ हो ✗\n④ 독성물 भनेको विषालु पदार्थ हो ✗"}, {"n": "453", "q": "불에 쉽게 붙을 수 있는 물질을 의미합니다. 휘발유, 알콜, 가솔린, 에테르, 기름 등이 이에 해당하며, 화재나 폭발 사고를 일으킬 수 있습니다.", "options": ["화학물질", "폭발물질", "장해물질", "인화물질"], "answer": 3, "explain": "प्रश्नको अर्थ: यो सजिलै आगो सल्किन सक्ने वा डढ्न सक्ने पेट्रोल, तेल जस्ता वस्तुहरू हुन्। यस्ता वस्तुले ठूलो दुर्घटना वा विस्फोट गराउन सक्छन्।\n① 화학물질 भनेको रासायनिक पदार्थ हो ✗\n② 폭발물질 भनेको विस्फोटक पदार्थ हो ✗\n③ 장해물질 भनेको बाधा पुर्‍याउने पदार्थ हो ✗\n④ 인화물질 भनेको आगो सजिलै टिप-हाल्ने वा ज्वलनशील पदार्थ हो ✓"}, {"n": "454", "q": "높은 곳에서 떨어지는 물건이나 물질을 뜻합니다. 주로 공사장, 건설현장, 창고, 높은 선반 등에서 발생할 수 있습니다.", "options": ["독극물", "낙하물", "장해물", "감전물"], "answer": 1, "explain": "प्रश्नको अर्थ: यो उँचो ठाउँ वा निर्माण क्षेत्रबाट तल खस्ने सामान वा वस्तु हो। यसले मुनि काम गरिरहेका मानिसलाई गम्भीर चोट पुर्याउन सक्छ।\n① 독극물 भनेको विषालु पदार्थ हो ✗\n② 낙하물 भनेको माथिबाट खस्ने वस्तु हो ✓\n③ 장해물 भनेको बाधा पुर्‍याउने वस्तु हो ✗\n④ 감전물 भनेको करेन्ट लाग्ने वस्तु हो ✗"}, {"n": "455", "q": "불을 붙이는 행위를 금지한다는 뜻입니다. 주로 인화 물질이 있는 곳이나 화재 위험이 높은 장소에 설치됩니다.", "options": ["탑승 금지", "촬영 금지", "착화 금지", "통행 금지"], "answer": 2, "explain": "प्रश्नको अर्थ: यो आगो वा सलाई बाल्न पाइँदैन भनेर रोक लगाइएको नियम हो। आगो लाग्ने खतरा भएका ठाउँहरूमा यो नियम राखिन्छ।\n① 탑승 금지 भनेको चढ्न निषेध हो ✗\n② 촬영 금지 भनेको फोटो खिच्न निषेध हो ✗\n③ 착화 금지 भनेको आगो बाल्न निषेध हो ✓\n④ 통행 금지 भनेको आवतजावत निषेध हो ✗"}, {"n": "456", "q": "사진이나 동영상 찍으면 안 된다는 뜻입니다. 주로 보안이 필요한 장소, 프라이버시 보호가 필요한 공간, 저작권 보호 구역 등에 설치됩니다.", "options": ["식음료금지", "촬영 금지", "수영금지", "출입금지"], "answer": 1, "explain": "प्रश्नको अर्थ: यो क्यामेरा वा फोनबाट फोटो र भिडियो खिच्न पाइँदैन भन्ने निषेध हो। सुरक्षा वा गोपनीयता कायम राख्नुपर्ने ठाउँमा यो लागु हुन्छ।\n① 식음료금지 भनेको खानेकुरा खान र पिउन निषेध हो ✗\n② 촬영 금지 भनेको फोटो वा भिडियो खिच्न निषेध हो ✓\n③ 수영금지 भनेको पौडी खेल्न निषेध हो ✗\n④ 출입금지 भनेको प्रवेश निषेध हो ✗"}, {"n": "457", "q": "애견 금지는 반려견을 데리고 들어가는 것을 금지한다는 뜻입니다. 주로 식당, 공공시설, 숙박업소, 놀이시설 등에서 위생, 알레르기 예방 등을 이유로 설치됩니다.", "options": ["애견 금지", "임산부 금지", "탑승 금지", "섭취금지"], "answer": 0, "explain": "प्रश्नको अर्थ: यो घरपालुवा कुकुर वा जनावरलाई भित्र लैजान पाइँदैन भन्ने रोक हो। सरसफाइ र अरू मानिसको सुरक्षाका लागि सार्वजनिक ठाउँमा यो नियम राखिन्छ।\n① 애견 금지 भनेको घरपालुवा कुकुर निषेध हो ✓\n② 임산부 금지 भनेको गर्भवती महिला निषेध हो ✗\n③ 탑승 금지 भनेको सवारी साधनमा चढ्न निषेध हो ✗\n④ 섭취금지 भनेको सेवन गर्न निषेध हो ✗"}, {"n": "458", "q": "위험이 생기거나 사고가 나지 않도록 행동이나 절차에서 지켜야 할 사항을 정한 규칙입니다.", "options": ["공공 도덕", "회사 규칙", "건강 관리", "안전 수칙"], "answer": 3, "explain": "प्रश्नको अर्थ: यो काम गर्दा दुर्घटना नहोस् र ज्यान जोगाउन सकियोस् भनेर पालन गर्नुपर्ने नियमहरू हुन्। कार्यक्षेत्रमा पालना गर्नुपर्ने कार्यविधि यसभित्र पर्छ।\n① 공공 도덕 भनेको सार्वजनिक नैतिकता हो ✗\n② 회사 규칙 भनेको कम्पनीको नियम हो ✗\n③ 건강 관리 भनेको स्वास्थ्य व्यवस्थापन हो ✗\n④ 안전 수칙 भनेको सुरक्षा नियम वा मापदण्ड हो ✓"}, {"n": "459", "q": "근로자가 작업 중에 사고나 부상으로부터 자신을 보호하기 위해 착용하거나 사용하는 설비를 말합니다.", "options": ["안전 장비", "안전 관리", "안전 수칙", "안전 교육"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कामदारले काम गर्दा आइपर्ने चोटपटकबाट जोगिन शरीरमा लगाउने वा प्रयोग गर्ने सुरक्षाका साधनहरू हुन्।\n① 안전 장비 भनेको सुरक्षा उपकरण हो ✓\n② 안전 관리 भनेको सुरक्षा व्यवस्थापन हो ✗\n③ 안전 수칙 भनेको सुरक्षा नियम हो ✗\n④ 안전 교육 भनेको सुरक्षा शिक्षा हो ✗"}, {"n": "460", "q": "근로자가 업무 중 또는 업무로 인해 부상, 질병, 장애, 사망 등을 입는 사고를 말합니다.", "options": ["산업 관리", "산업 안전", "산업 재해", "산업 복지"], "answer": 2, "explain": "प्रश्नको अर्थ: यो कार्यस्थलमा काम गर्ने क्रममा कामदारलाई हुने शारीरिक चोटपटक, बिरामी वा दुर्घटना हो।\n① 산업 관리 भनेको उद्योग व्यवस्थापन हो ✗\n② 산업 안전 भनेको औद्योगिक सुरक्षा हो ✗\n③ 산업 재해 भनेको औद्योगिक दुर्घटना हो ✓\n④ 산업 복지 भनेको औद्योगिक कल्याण हो ✗"}, {"n": "461", "q": "일하다가 위에서 떨어지거나 날아오는 물체로 맞아 발생하는 재해를 말합니다.", "options": ["누전 사고", "감전 사고", "낙하 사고", "붕괴 사고"], "answer": 2, "explain": "प्रश्नको अर्थ: काम गर्दा माथिबाट वस्तु खसेर वा उडेर आएर ठोक्किँदा हुने दुर्घटनालाई यसले जनाउँछ।\n① 누전 사고 भनेको करेन्ट चुहावटको दुर्घटना हो ✗\n② 감전 사고 भनेको करेन्ट लाग्ने दुर्घटना हो ✗\n③ 낙하 사고 भनेको माथिबाट खसेर हुने दुर्घटना हो ✓\n④ 붕괴 사고 भनेको भत्किने दुर्घटना हो ✗"}, {"n": "462", "q": "필요한 물건을 쉽게 찾을 수 있도록 사용한 후 정해진 위치에 갖다 놓는 것으로서 안전 사고를 예방할 수 있습니다.", "options": ["작업장 관리", "정리정돈", "포장작업", "전기전략"], "answer": 1, "explain": "प्रश्नको अर्थ: सामान प्रयोग गरेपछि सजिलै भेट्टाउन तोकिएको ठाउँमा राख्ने र दुर्घटना जोगिने कामलाई बुझाउँछ।\n① 작업장 관리 भनेको कार्यक्षेत्र व्यवस्थापन हो ✗\n② 정리정돈 भनेको सरसफाइ तथा सामान मिलाएर राख्ने काम हो ✓\n③ 포장작업 भनेको प्याकिङ गर्ने काम हो ✗\n④ 전기전략 भनेको बिजुलीको रणनीति हो, त्यसैले यो मिल्दैन। चौथो विकल्प '전기전략' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "463", "q": "오래된 전자제품의 전선에서 전기가 밖으로 흘러나와서 발생하는 사고를 말합니다.", "options": ["폭발 사고", "낙하 사고", "붕괴 사고", "누전 사고"], "answer": 3, "explain": "प्रश्नको अर्थ: पुराना विद्युतीय सामानको तारबाट बिजुली बाहिर बगेर हुने दुर्घटनालाई यसले जनाउँछ।\n① 폭발 사고 भनेको विस्फोटन दुर्घटना हो ✗\n② 낙하 사고 भनेको खस्ने दुर्घटना हो ✗\n③ 붕괴 사고 भनेको भत्किने दुर्घटना हो ✗\n④ 누전 사고 भनेको करेन्ट चुहावटको दुर्घटना हो ✓"}, {"n": "464", "q": "화재나 지진 등 갑작스러운 사고가 일어날 때 대피할 수 있도록 마련한 출입구입니다.", "options": ["사다리", "비상구", "비상벨", "지하도"], "answer": 1, "explain": "प्रश्नको अर्थ: आगो वा भूकम्प जस्ता अनपेक्षित घटना हुँदा सुरक्षित ठाउँमा भाग्न बनाइएको ढोका हो।\n① 사다리 भनेको भर्याङ हो, जुन उचाइमा चढ्न र ओर्लन प्रयोग गरिन्छ, त्यसैले यो सही उत्तर होइन। ✗\n② 비상구 भनेको आकस्मिक बाहिरिने ढोका हो, जहाँबाट दुर्घटना वा संकटको बेला बाहिर भाग्न सकिन्छ, त्यसैले यो विवरणसँग मिल्छ। ✓\n③ 비상벨 भनेको आकस्मिक घण्टी हो, जसले खतराको बेला घण्टी बजाउँछ, त्यसैले यो सही उत्तर होइन। ✗\n④ 지하도 भनेको पैदलयात्रीका लागि बनाइएको बाटो हो, त्यसैले यो सही उत्तर होइन। ✗"}, {"n": "465", "q": "사람들이 많이 다녀서 교통사고의 위험이 있거나 공사가 진행되고 있는 곳에 설치하는 표지판입니다.", "options": ["출입금지", "접근 금지", "사용금지", "취사금지"], "answer": 1, "explain": "प्रश्नको अर्थ: मानिसहरूको आवतजावत धेरै हुने वा निर्माण कार्य भइरहेको ठाउँमा राखिने सांकेतिक बोर्ड हो।\n① 출입금지 भनेको प्रवेश निषेध हो ✗\n② 접근 금지 भनेको नजिक जान निषेध हो ✓\n③ 사용금지 भनेको प्रयोग निषेध हो ✗\n④ 취사금지 भनेको खाना पकाउन निषेध हो ✗\nशिक्षकको उत्तर-पत्र: ① 출입금지 — मेरो उत्तर: ② 접근 금지। प्रश्न: धेरै मान्छे हिँड्ने ठाउँ, दुर्घटना जोखिम वा निर्माण — त्यो खतरनाक ठाउँबाट टाढा बस्ने साइन (접근 금지) हो; 출입금지 त सुविधा भित्र 'प्रवेश नगर्नू' हो। यो debatable छ — शिक्षकले निर्णय गर्ने।"}, {"n": "466", "q": "화학물질이나 독성물질을 다룰 때 안전을 위해서 사용하는 보호구입니다.", "options": ["방독마스크", "방진마스크", "안전대", "용접면"], "answer": 0, "explain": "प्रश्नको अर्थ: रसायन वा विषालु पदार्थको काम गर्दा सुरक्षाका लागि मुखमा लगाइने साधन हो।\n① 방독마스크 भनेको विषालु ग्यासबाट बच्ने मास्क हो, यो रासायनिक पदार्थको लागि प्रयोग हुने भएकोले सही उत्तर हो। ✓\n② 방진마스크 भनेको धुलोबाट बच्ने मास्क हो ✗\n③ 안전대 भनेको सुरक्षा बेल्ट हो ✗\n④ 용접면 भनेको वेल्डिंग गर्ने मास्क हो, त्यसैले यो मिल्दैन। (नोट: पुस्तकको फोटो अनुसार विकल्पहरू मिलाइएको छ।) ✗"}, {"n": "467", "q": "작업장에서 작업을 할 때 안전을 위해서 착용하는 것으로서 추락으로부터 우리 몸을 지켜 주는 보호구입니다.", "options": ["안전화", "안전장갑", "안전대", "안전모"], "answer": 2, "explain": "प्रश्नको अर्थ: उच्च ठाउँमा काम गर्दा लडेर तल खस्नबाट शरीरलाई जोगाउन बाँधिने सुरक्षा उपकरण हो।\n① 안전화 भनेको सुरक्षा जुत्ता हो, यो उचाइबाट खस्ने ुबाट बचाउने नभई खुट्टाको सुरक्षाको लागि हो। ✗\n② 안전장갑 भनेको सुरक्षा पन्जा हो ✗\n③ 안전대 भनेको सुरक्षा बेल्ट हो, यो उचाइबाट खस्नबाट जोगाउने भएकोले सही उत्तर हो। ✓\n④ 안전모 भनेको सुरक्षा टोपी हो ✗"}, {"n": "468", "q": "소음 심한 곳에서 작업할 때 특히 귀를 보호하기 위해 사용되는 보호구입니다.", "options": ["안전모", "안전복", "보안경", "귀마개"], "answer": 3, "explain": "प्रश्नको अर्थ: ठूलो आवाज आउने ठाउँमा काम गर्दा कानको सुरक्षाका लागि प्रयोग गरिने साधन हो।\n① 안전모 भनेको सुरक्षा टोपी हो ✗\n② 안전복 भनेको सुरक्षा पोसाक हो ✗\n③ 보안경 भनेको सुरक्षा चस्मा हो ✗\n④ 귀마개 भनेको कानमा लगाउने इयरप्लग हो, यो हल्ला वा कोलाहलबाट कान बचाउन प्रयोग हुने भएकोले सही उत्तर हो। ✓"}, {"n": "469", "q": "위험으로부터 우리 몸을 지켜 주는 안전모, 보안경, 안전화 등을 말합니다. 우리는 일하기 전에 반드시 이것들을 착용하고 일이 끝나면 잘 정리해야 합니다.", "options": ["비상구", "보호구", "수공구", "작업대"], "answer": 1, "explain": "प्रश्नको अर्थ: काम गर्दा खतराबाट शरीरका अङ्गहरूलाई बचाउन प्रयोग गरिने विभिन्न सुरक्षाका सामानहरू हुन्।\n① 비상구 भनेको आपतकालीन ढोका हो ✗\n② 보호구 भनेको व्यक्तिगत सुरक्षा उपकरण हो, यसले सुरक्षा टोपी, सुरक्षा चस्मा र सुरक्षा जुत्तालाई जनाउने हुनाले सही उत्तर हो। ✓\n③ 수공구 भनेको हाते औजार हो ✗\n④ 작업대 भनेको काम गर्ने टेबल हो ✗"}, {"n": "470", "q": "작업 현장에서 낙하물, 파편 등으로부터 머리를 보호하기 위해서 착용해야 하는 안전도구입니다.", "options": ["안전화", "안전장갑", "안전모", "안전복"], "answer": 2, "explain": "प्रश्नको अर्थ: काम गर्ने ठाउँमा माथिबाट सामान वा टुक्राहरू खस्दा टाउकोलाई जोगाउन टाउकामा लगाइने टोपी हो।\n① 안전화 भनेको सुरक्षा जुत्ता हो ✗\n② 안전장갑 भनेको सुरक्षा पन्जा हो ✗\n③ 안전모 भनेको सुरक्षा टोपी हो, यो खस्ने वस्तुबाट टाउको बचाउन लगाइने हुनाले सही उत्तर हो। ✓\n④ 안전복 भनेको सुरक्षा पोसाक हो ✗"}, {"n": "471", "q": "물에 빠졌을 때 사람의 몸이 물에 뜨도록 도와주는 안전 장비입니다. 물가에서 작업할 때, 또는 수난 구조 활동 시 착용하며, 익사를 예방하는 데 매우 중요합니다.", "options": ["구명조끼", "절연 장갑", "절연 장화", "무릎보호대"], "answer": 0, "explain": "प्रश्नको अर्थ: पानीमा खस्दा ज्यान जोगाउन र शरीरलाई पानीमा तैराउन मद्दत गर्ने सुरक्षा कपडा हो।\n① 구명조끼 भनेको ज्याकेट लाइफ ज्याकेट हो, यो पानीमा डुब्दा बचाउने हुनाले सही उत्तर हो। ✓\n② 절연 장갑 भनेको इन्सुलेटेड पन्जा हो ✗\n③ 절연 장화 भनेको इन्सुलेटेड जुत्ता हो ✗\n④ 무릎보호대 भनेको घुँडा रक्षक हो ✗"}, {"n": "472", "q": "갑작스러운 사고나 질병으로 다친 사람에게 의사가 오기 전 또는 병원에 가기 전까지 임시로 시행하는 절차를 말합니다.", "options": ["응급 상황", "응급 처치", "비상 상황", "비상 전화"], "answer": 1, "explain": "प्रश्नको अर्थ: अचानक बिरामी वा घाइते भएका व्यक्तिलाई अस्पताल लैजानुअघि तुरुन्तै गरिने प्रारम्भिक उपचार हो।\n① 응급 상황 भनेको आपतकालीन अवस्था हो ✗\n② 응급 처치 भनेको प्राथमिक उपचार हो, डाक्टर आउनु वा अस्पताल जानु अघि गरिने उपचार भएकोले सही उत्तर हो। ✓\n③ 비상 상황 भनेको आपतकालीन परिस्थिति हो ✗\n④ 비상 전화 भनेको आपतकालीन फोन हो ✗"}, {"n": "473", "q": "숨을 제대로 쉬지 못해 산소가 부족해지는 상태를 말하며, 기도가 막히거나 유해가스를 마셨을 때 발생할 수 있습니다.", "options": ["화재", "부상", "질식", "무의식"], "answer": 2, "explain": "प्रश्नको अर्थ: सास्ती वा विषालु ग्यासका कारण सास फेर्न गाह्रो भई अक्सिजनको कमी हुने अवस्था हो।\n① 화재 भनेको आगलागी हो ✗\n② 부상 भनेको चोटपटक हो ✗\n③ 질식 भनेको श्वासप्रश्वास रोकिनु वा दम घोटिनु हो, अक्सिजन नपुग्ने अवस्थालाई जनाउने हुनाले सही उत्तर हो। ✓\n④ 무의식 भनेको बेहोस हुनु हो ✗\nशिक्षकको उत्तर-पत्र: ④ 무의식 — मेरो उत्तर: ③ 질식। प्रश्न: सास फेर्न नसक्ने, अक्सिजन कमी, श्वासनली बन्द / हानिकारक ग्यास — त्यो निस्सासिनु (질식) हो; 무의식 (बेहोशी) त सम्भावित परिणाम हो, प्रश्नले भनेको अवस्था होइन।"}, {"n": "474", "q": "다친 사람이나 환자를 옮길 때 사용하는 이동용 침대입니다. 구조 현장이나 병원, 구급차에서 자주 사용되며 두 사람이 양쪽을 들어서 운반합니다.", "options": ["사다리", "비상구", "옷장", "들것"], "answer": 3, "explain": "प्रश्नको अर्थ: घाइते वा बिरामी व्यक्तिलाई एक ठाउँबाट अर्को ठाउँमा बोकेर लैजान प्रयोग गरिने साधन हो।\n① 사다리 भनेको भर्‍याङ हो ✗\n② 비상구 भनेको आपतकालीन ढोका हो ✗\n③ 옷장 भनेको दराज हो ✗\n④ 들것 भनेको स्ट्रेचर हो, बिरामी बोक्ने ओछ्यान भएकोले सही उत्तर हो। ✓"}, {"n": "475", "q": "내국인을 구하지 못하여 인력난을 겪고 있는 사업장에 일정한 요건하여 외국인 근로자를 합법적으로 고용할 수 있도록 허가해주는 제도입니다.", "options": ["고용허가제", "외국인 등록제", "최저임금제", "국가세금제"], "answer": 0, "explain": "प्रश्नको अर्थ: स्वदेशी कामदार नपाएका कम्पनीहरूले विदेशी कामदारलाई कानुनी रूपमा काममा राख्न पाउने नियम वा व्यवस्था हो।\n① 고용허가제 भनेको रोजगार अनुमति प्रणाली हो, विदेशी मजदुरलाई कानुनी रूपमा काम गर्न अनुमति दिने प्रणाली भएकोले सही उत्तर हो। ✓\n② 외국인 등록제 भनेको विदेशी दर्ता प्रणाली हो ✗\n③ 최저임금제 भनेको न्यूनतम ज्याला प्रणाली हो ✗\n④ 국가세금제 भनेको राष्ट्रिय कर प्रणाली हो ✗"}, {"n": "476", "q": "원자재나 부품을 가공하여 제품을 만드는 산업을 말합니다. 예를 들어, 자동차, 옷, 가전제품, 식품 등을 공장에서 만들어내는 활동이 모두 제조업에 해당합니다.", "options": ["조선업", "제조업", "건설업", "축산업"], "answer": 1, "explain": "प्रश्नको अर्थ: कच्चा पदार्थ र सामानहरू प्रयोग गरेर कारखानामा नयाँ वस्तुहरू उत्पादन गर्ने उद्योगलाई बुझाउँछ।\n① 조선업 भनेको जहाज निर्माण उद्योग हो ✗\n② 제조업 भनेको उत्पादनमूलक उद्योग हो, वस्तुहरू उत्पादन गर्ने उद्योग भएकोले सही उत्तर हो। ✓\n③ 건설업 भनेको निर्माण उद्योग हो ✗\n④ 축산업 भनेको पशुपालन उद्योग हो ✗"}, {"n": "477", "q": "나무를 심고 기르며 수확하는 산업으로, 산림 자원을 이용해 목재, 버섯, 약초 등을 생산합니다. 자연을 보호하면서 지속 가능한 자원 활용을 목표로 합니다.", "options": ["농업", "광업", "어업", "임업"], "answer": 3, "explain": "प्रश्नको अर्थ: रुख रोपेर हुर्काउने र जङ्गलका काठ तथा अन्य जडीबुटी उत्पादन गर्नेसँग सम्बन्धित क्षेत्र हो।\n① 농업 भनेको कृषि हो ✗\n② 광업 भनेको खानी उद्योग हो ✗\n③ 어업 भनेको माछापालन हो ✗\n④ 임업 भनेको वन पैदावार उद्योग हो, रुख रोक्ने र हुकाउने उद्योग भएकोले सही उत्तर हो। ✓"}, {"n": "478", "q": "땅속에서 석탄, 철, 금, 석유 같은 자원을 채굴하고 가공하는 산업입니다. 주로 광산이나 시추 시설에서 이루어지며, 제조업의 기초 자원을 제공합니다.", "options": ["콘도업", "광업", "어업", "임업"], "answer": 1, "explain": "प्रश्नको अर्थ: जमिनमुनिबाट कोइला, फलाम, सुन जस्ता प्राकृतिक खनिज पदार्थहरू निकाल्ने काम वा क्षेत्र हो।\n① 콘도업 भनेको कडो व्यवसाय हो ✗\n② 광업 भनेको खानी उद्योग हो, जमिनमुनिबाट खनिज निकाल्ने उद्योग भएकोले सही उत्तर हो। ✓\n③ 어업 भनेको माछापालन हो ✗\n④ 임업 भनेको वन उद्योग हो, त्यसैले यो मिल्दैन। (नोट: पुस्तकको फोटो अनुसार विकल्पहरू राखिएको छ।) ✗"}, {"n": "479", "q": "영리를 목적으로 물고기, 조개, 김, 미역 따위를 잡거나 기르는 산업입니다.", "options": ["광업", "농업", "어업", "서비스업"], "answer": 2, "explain": "प्रश्नको अर्थ: नदी, पोखरी वा समुद्रबाट माछा तथा अन्य जलचर प्राणीहरू समात्ने र पाल्ने व्यवसाय हो।\n① 광업 भनेको खानी उद्योग हो ✗\n② 농업 भनेको कृषि हो ✗\n③ 어업 भनेको माछा मार्ने वा पालन गर्ने उद्योग हो, माछा तथा सामुद्रिक जीव समात्ने वा हुकाउने कामलाई जनाउने हुनाले सही उत्तर हो। ✓\n④ 서비스업 भनेको सेवा उद्योग हो ✗"}, {"n": "480", "q": "벼, 밀, 채소, 과일 등 식물을 재배하여 식량이나 자원을 생산하는 산업입니다. 주로 밭이나 논에서 경작하는 활동을 말합니다.", "options": ["광업", "농업", "어업", "서비스업"], "answer": 1, "explain": "प्रश्नको अर्थ: खेतबारीमा धान, मकै, सागसब्जी र फलफूल उमारेर अन्नबाली उत्पादन गर्ने पेसा वा क्षेत्र हो।\n① 광업 भनेको खानी उद्योग हो ✗\n② 농업 भनेको कृषि उद्योग हो, बालीनाला खेती गर्ने उद्योग भएकोले सही उत्तर हो। ✓\n③ 어업 भनेको माछापालन हो ✗\n④ 서비스업 भनेको सेवा उद्योग हो ✗"}, {"n": "481", "q": "소, 돼지, 닭, 양 등 가축을 기르고 키워서 고기, 우유, 달걀 등을 생산하는 산업입니다. 농업 중에서도 동물을 사육하여 식품을 얻는 분야를 말합니다.", "options": ["제조업", "건설업", "축산업", "서비스업"], "answer": 2, "explain": "प्रश्नको अर्थ: गाई, सुँगुर, कुखुरा जस्ता जनावरहरू पालेर मासु, दूध र अण्डा उत्पादन गर्ने काम वा क्षेत्रलाई जनाउँछ।\n① 제조업 भनेको सामान उत्पादन गर्ने उद्योग हो ✗\n② 건설업 भनेको निर्माण गर्ने क्षेत्र हो ✗\n③ 축산업 भनेको पशुपालन गर्ने र पशुजन्य उत्पादन लिने क्षेत्र हो ✓\n④ 서비스업 भनेको सेवामूलक क्षेत्र हो ✗"}, {"n": "482", "q": "건물, 도로, 다리, 터널, 댐 등 구조물을 설계하고 짓는 산업입니다. 사람들이 살거나 일하는 공간과 사회 기반 시설을 만드는 데 중요한 역할을 합니다.", "options": ["건설업", "서비스업", "호텔업", "조선업"], "answer": 0, "explain": "प्रश्नको अर्थ: घर, बाटो, पुल र बाँध जस्ता संरचनाहरू निर्माण गर्ने र बनाउने कामलाई जनाउँछ।\n① 건설업 भनेको भवन, सडक, पुल आदि निर्माण गर्ने क्षेत्र हो ✓\n② 서비스업 भनेको सेवामूलक क्षेत्र हो ✗\n③ 호텔업 भनेको होटल व्यवसाय हो ✗\n④ 조선업 भनेको जहाज निर्माण गर्ने क्षेत्र हो ✗"}, {"n": "483", "q": "근로자와 사업주가 근로 조건을 명확히 정하고 서면으로 체결하는 공식 문서입니다. 노동자의 권리를 보호하고, 근로 조건에 대한 분쟁을 예방하기 위해 사용됩니다.", "options": ["근로계약서", "휴가 신청서", "취업 확인", "입국 신고서"], "answer": 0, "explain": "प्रश्नको अर्थ: कामदार र मालिकबिच कामका नियमहरू स्पष्ट पारेर सही गरिने आधिकारिक कागजातलाई जनाउँछ। यसले कामदारको अधिकार रक्षा गर्छ।\n① 근로계약서 भनेको कामदार र रोजगारदाताबीचको श्रम सम्झौता पत्र हो ✓\n② 휴가 신청서 भनेको बिदाको लागि निवेदन पत्र हो ✗\n③ 취업 확인 भनेको रोजगारी पुष्टि गर्ने कागजात हो ✗\n④ 입국 신고서 भनेको प्रवेश घोषणा पत्र हो ✗"}, {"n": "484", "q": "근로자가 일하고 있는 근무지를 바꾸는 것을 말합니다. 최대 3회까지 허용합니다.", "options": ["체류 기간 연장", "사업장 변경", "외국인 등록", "고용허가제"], "answer": 1, "explain": "प्रश्नको अर्थ: कामदारले आफूले काम गरिरहेको ठाउँ छाडेर अर्को ठाउँमा सर्नु वा फेर्नुलाई जनाउँछ।\n① 체류 기간 연장 भनेको बसोबास अवधि थप गर्नु हो ✗\n② 사업장 변경 भनेको काम गर्ने ठाउँ वा कम्पनी परिवर्तन गर्नु हो ✓\n③ 외국인 등록 भनेको विदेशी दर्ता हो ✗\n④ 고용허가제 भनेको रोजगार अनुमति प्रणाली हो ✗"}, {"n": "485", "q": "근로자와 사업주 간에 체결되는 임금, 근무시간, 휴일, 업무 내용 등을 포함합니다. 이것들은 근로계약서에 명시되어 있으며, 근로자의 권리 보호를 위해 중요합니다.", "options": ["근무 교대", "근무 수칙", "근무 변경", "근무 조건"], "answer": 3, "explain": "प्रश्नको अर्थ: तलब, काम गर्ने समय, बिदा र कामको विवरण जस्ता विषयहरूलाई बुझाउँछ।\n① 근무 교대 भनेको ड्युटी वा सिफ्ट फेर्ने काम हो ✗\n② 근무 수칙 भनेको कामको नियम हो ✗\n③ 근무 변경 भनेको काम परिवर्तन गर्ने हो ✗\n④ 근무 조건 भनेको तलब, काम गर्ने समय आदि काम गर्ने सर्तहरू हुन् ✓"}, {"n": "486", "q": "근로자가 회사에 취직하면 최대 3개월동안 연습으로 일하는 기간이 있습니다. 이 기간 중에는 임금의 90%만 지급받게 됩니다.", "options": ["근로기간", "수습기간", "계약기간", "유효기간"], "answer": 1, "explain": "प्रश्नको अर्थ: नयाँ काम सुरु गर्दा काम सिक्न र अभ्यास गर्न दिइने निश्चित समयलाई जनाउँछ।\n① 근로기간 भनेको श्रम अवधि हो, जसमा कामदारले काम गर्ने कुल समय बुझाउँछ, त्यसैले यो सही उत्तर होइन। ✗\n② 수습기간 भनेको परीक्षण काल हो, जहाँ नयाँ कामदारले अभ्यासको रूपमा काम गर्छ र ९० प्रतिशत तलब पाउँछ, त्यसैले यो विवरणसँग मिल्छ। ✓\n③ 계약기간 भनेको सम्झौता अवधि हो, जुन सम्झौतामा तोकिएको काम गर्ने समय हो, त्यसैले यो सही उत्तर होइन। ✗\n④ 유효기간 भनेको म्याद रहने समय हो, त्यसैले यो सही उत्तर होइन। ✗"}, {"n": "487", "q": "재직기간을 끝내고 본국에 돌아간 사람이 다시 취직하게 된 것을 말합니다.", "options": ["재발급", "재취업", "재활용", "재정착"], "answer": 1, "explain": "प्रश्नको अर्थ: स्वदेश फर्किसकेपछि दोहोर्याएर पुनः काममा लाग्ने अवस्थालाई जनाउँछ।\n① 재발급 भनेको पुनः जारी गर्नु हो ✗\n② 재취업 भनेको कार्यकाल सकिएर स्वदेश गएको व्यक्तिले पुनः रोजगारी पाउनु हो ✓\n③ 재활용 भनेको पुनः प्रयोग गर्नु हो ✗\n④ 재정착 भनेको पुनः बसोबास गर्नु हो ✗"}, {"n": "488", "q": "근로자가 일한 시간이나 일에 대해 지급되는 고정된 급여로, 수당이나 보너스를 제외한 임금을 말합니다.", "options": ["보험금", "지급액", "기본급", "공제액"], "answer": 2, "explain": "प्रश्नको अर्थ: थप भत्ता नजोडी काम गरेबापत पाइने तोकिएको निश्चित रकमलाई बुझाउँछ।\n① 보험금 भनेको बिमा रकम हो, जुन दुर्घटना वा क्षति हुँदा पाइने रकम हो, त्यसैले यो सही उत्तर होइन। ✗\n② 지급액 भनेको कुल भुक्तानी रकम हो, त्यसैले यो सही उत्तर होइन। ✗\n③ 기본급 भनेको आधारभूत तलब हो, जसमा भत्ता वा बोनस बाहेकको तोकिएको मुख्य तलब पर्दछ, त्यसैले िल्दैन। सहि उत्तर 일당 हो जसको अर्थ दैनिक ज्याला हो। ✗"}, {"n": "497", "q": "어떤 일을 맡아 처리해 준 데 대한 대가로서 특히 공공 기관에 주는 요금입니다.", "options": ["학비", "수수료", "식비", "번호표"], "answer": 1, "explain": "प्रश्नको अर्थ: कुनै सेवा वा काम गराएबापत सार्वजनिक निकायलाई बुझाउनुपर्ने शुल्कलाई जनाउँछ।\n① 학비 भनेको पढाई खर्च वा शुल्क हो ✗\n② 수수료 भनेको कुनै काम गरिदिए बापत तिर्ने सेवा शुल्क वा दस्तुर हो ✓\n③ 식비 भनेको खाना खर्च हो ✗\n④ 번호표 भनेको पालो पर्खने नम्बर पर्ची हो, त्यसैले यो मिल्दैन। सहि उत्तर 수수료 हो जसको अर्थ सेवा शुल्क वा दस्तुर हो। ✗"}, {"n": "498", "q": "집을 빌려주고 빌릴 때 기관과 비용 등 계약 내용을 기재한 서류로 체류 기간을 연장할 때 체류지 입증 서류로 사용될 수 있습니다.", "options": ["구직등록필증", "임대차 계약서", "근로계약서", "입국 신고서"], "answer": 1, "explain": "प्रश्नको अर्थ: घर वा कोठा भाडामा लिँदा र दिँदा गरिने लिखित सम्झौता पत्रलाई जनाउँछ।\n① 구직등록필증 भनेको रोजगारी खोजी दर्ता प्रमाणपत्र हो ✗\n② 임대차 계약서 भनेको घर भाडा सम्झौता पत्र हो जसमा कोठा वा घर भाडामा लिँदाका सर्तहरू लेखिएका हुन्छन् र यो बसोबास प्रमाणित गर्न प्रयोग हुन्छ ✓\n③ 근로계약서 भनेको श्रम सम्झौता पत्र हो ✗\n④ 입국 신고서 भनेको प्रवेश घोषणा पत्र हो, त्यसैले यो मिल्दैन। सहि उत्तर 임대차 계약서 हो जसको अर्थ घर भाडा सम्झौता पत्र हो। ✗"}, {"n": "499", "q": "사업을 시작할 때 세무서에 등록하고 발급받는 공식 문서로, 정부에 내가 어떤 사업을 하고 있다는 것을 알리는 증명서입니다.", "options": ["근로계약서", "외국인등록증", "연말정산", "사업자등록증"], "answer": 3, "explain": "प्रश्नको अर्थ: व्यापार वा व्यवसाय सुरु गर्दा कर कार्यालयबाट पाइने आधिकारिक दर्ता प्रमाणपत्रलाई जनाउँछ।\n① 근로계약서 भनेको श्रम सम्झौता पत्र हो ✗\n② 외국인등록증 भनेको विदेशी परिचय पत्र हो ✗\n③ 연말정산 भनेको वर्षको अन्त्यमा गरिने कर हिसाब मिलान हो ✗\n④ 사업자등록증 भनेको व्यवसाय दर्ता प्रमाणपत्र हो जसले कर कार्यालयमा व्यवसाय दर्ता गरेको कुरा प्रमाणित गर्छ, त्यसैले यो सही उत्तर हो। सहि उत्तर 사업자등록증 हो जसको अर्थ व्यवसाय दर्ता प्रमाणपत्र हो। किताबमा दोस्रो विकल्प '외국이등록증' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '외국인등록증' हो। ✓"}, {"n": "500", "q": "시청, 구청, 주민센터, 출입국관리사무소 같은 국가나 지방의 행정을 맡아 보는 여러 기관을 말합니다.", "options": ["관공서", "소방서", "경찰서", "여행사"], "answer": 0, "explain": "प्रश्नको अर्थ: सरकारी सेवा र प्रशासनिक कामहरू गर्ने विभिन्न कार्यालय वा निकायहरूलाई बुझाउँछ।\n① 관공서 भनेको सरकारी कार्यालय हो जसमा महानगरपालिका, वडा कार्यालय र अध्यागमन कार्यालय जस्ता प्रशासनिक निकायहरू पर्छन् ✓\n② 소방서 भनेको दमकल कार्यालय वा अग्नि नियन्त्रण कार्यालय हो ✗\n③ 경찰서 भनेको प्रहरी कार्यालय हो ✗\n④ 여행사 भनेको ट्राभल एजेन्सी वा यात्रा कम्पनी हो, त्यसैले यो मिल्दैन। सहि उत्तर 관공서 हो जसको अर्थ सरकारी कार्यालय हो। ✗"}, {"n": "501", "q": "외국인이 다른 나라에 머무를 수 있도록 허가받은 기간을 말합니다. 비자에 따라 정해지며, 이 기간이 지나면 출국하거나 연장 절차를 거쳐야 합니다.", "options": ["계약기간", "체류기간", "수습기간", "임명기간"], "answer": 1, "explain": "प्रश्नको अर्थ: विदेशी नागरिकलाई अर्को देशमा बस्नका लागि अनुमति दिइएको समयावधिलाई बुझाउँछ। यो अवधि सकिएपछि आफ्नो देश फर्कनुपर्छ वा म्याद थप्नुपर्छ।\n① 계약기간 भनेको सम्झौता अवधि हो ✗\n② 체류기간 भनेको विदेशीले देशमा बस्न पाउने अवधि वा भिसाको म्याद हो ✓\n③ 수습기간 भनेको काम सिक्ने वा परीक्षण अवधि हो ✗\n④ 임명기간 भनेको नियुक्ति अवधि हो, त्यसैले यो मिल्दैन। सहि उत्तर 체류기간 हो जसको अर्थ बसोबास अवधि वा बसाइको म्याद हो। ✗"}, {"n": "502", "q": "특별한 사정으로 운영하고 있는 사업이나 영업을 영구적으로 그만두는 것입니다.", "options": ["폐업", "휴업", "취업", "실업"], "answer": 0, "explain": "प्रश्नको अर्थ: विशेष कारणले गर्दा आफूले चलाइरहेको व्यापार वा कामलाई स्थायी रूपमा सधैँका लागि बन्द गर्ने कार्यलाई जनाउँछ।\n① 폐업 भनेको व्यवसाय वा पसल स्थायी रूपमा बन्द गर्नु हो ✓\n② 휴업 भनेको अस्थायी रूपमा व्यवसाय बन्द गर्नु हो ✗\n③ 취업 भनेको रोजगारी पाउनु वा काममा लाग्नु हो ✗\n④ 실업 भनेको बेरोजगार हुनु हो, त्यसैले यो मिल्दैन। सहि उत्तर 폐업 हो जसको अर्थ स्थायी रूपमा व्यवसाय बन्द गर्नु हो। ✗"}, {"n": "503", "q": "외국인이 한국에 90일 이상 체류할 경우 반드시 발급받아야 하는 신분증입니다. 이것에는 이름, 국적, 체류 자격, 체류 기간, 주소 등이 기재되어 있습니다.", "options": ["학생증", "사원증", "방문증", "외국인동록증"], "answer": 3, "explain": "प्रश्नको अर्थ: कोरियामा ९० दिनभन्दा बढी बस्ने विदेशीले अनिवार्य रूपमा बनाउनुपर्ने परिचयपत्र हो। यसमा नाम, राष्ट्रियता र ठेगाना जस्ता विवरणहरू लेखिएका हुन्छन्।\nपहिलो विकल्प 학생증 भनेको विद्यार्थी परिचय पत्र हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 사원증 भनेको कर्मचारी परिचय पत्र हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 방문증 भनेको आगन्तुक पास वा परिचय पत्र हो, त्य "}, {"n": "507", "q": "일하다가 업무상 재해에 대한 보상이나 요양을 위해 가입해야 하는 보험입니다.", "options": ["상해보험", "고용보험", "건강보험", "산재보험"], "answer": 3, "explain": "प्रश्नको अर्थ: काम गर्दा हुने दुर्घटना वा चोटपटकको क्षतिपूर्ति र उपचार खर्च पाउनका लागि अनिवार्य रूपमा लिनुपर्ने सुरक्षा योजना हो।\n① 상해보험 भनेको दुर्घटना बीमा हो ✗\n② 고용보험 भनेको रोजगारी बीमा हो ✗\n③ 건강보험 भनेको स्वास्थ्य बीमा हो ✗\n④ 산재보험 भनेको औद्योगिक दुर्घटना बीमा हो जुन काम गर्दा हुने दुर्घटनाको क्षतिपूर्ति र उपचारको लागि अनिवार्य हुन्छ, त्यसैले यो सही उत्तर हो। सहि उत्तर 산재보험 हो जसको अर्थ औद्योगिक दुर्घटना बीमा हो। ✓"}, {"n": "508", "q": "외국인 근로자의 업무상 재해 이외에 질병, 교통사고나 사망 등을 위하여 가입해야 하는 보험입니다.", "options": ["보증보험", "고용보험", "건강보험", "상해보험"], "answer": 3, "explain": "प्रश्नको अर्थ: कामको सिलसिलामा बाहेक अन्य व्यक्तिगत बिरामी, सवारी दुर्घटना वा मृत्यु जस्ता अवस्थामा क्षतिपूर्ति पाउनका लागि गरिने सुरक्षा योजना हो।\n① 보증보험 भनेको ग्यारेन्टी बीमा हो, जसले सम्झौता पूरा नगर्दा हुने नोक्सानीको सुरक्षा गर्छ, त्यसैले यो सही होइन। ✗\n② 고용보험 भनेको रोजगार बीमा हो, जसले बेरोजगारीको समयमा सहयोग गर्छ, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 건강보험 भनेको स्वास्थ्य बीमा हो, जसले अस्पतालको उपचार खर्चमा सहयोग गर्छ, त्यसैले यो गैर-व्यावसायिक दुर्घटना वा मृत्युको बीमा होइन। ✗\n④ 상해보험 भनेको चोटपटक वा दुर्घटना बीमा हो, जसले काम बाहेकका रोग, सवारी दुर्घटना वा मृत्यु आदिको सुरक्षा दिन्छ ✓"}, {"n": "509", "q": "근로자가 실직했을 때 생계 안정을 지원하고, 재취업을 돕기 위해 국가가 운영하는 사회보험 제도입니다.", "options": ["보증보험", "고용보험", "건강보험", "상해보험"], "answer": 1, "explain": "प्रश्नको अर्थ: कामदारले रोजगार गुमाउँदा जीवनयापनमा सहयोग पुर्याउन र नयाँ काम खोज्न मद्दत गर्न सरकारले चलाएको सामाजिक सुरक्षा योजना हो।\n① 보증보험 भनेको ग्यारेन्टी बीमा हो ✗\n② 고용보험 भनेको रोजगारी बीमा हो जुन काम गुमाउँदा जीवन निर्वाहमा सहयोग गर्न र पुनः रोजगारी पाउन राज्यले चलाउने बीमा हो ✓\n③ 건강보험 भनेको स्वास्थ्य बीमा हो ✗\n④ 상해보험 भनेको दुर्घटना बीमा हो, त्यसैले यो मिल्दैन। सहि उत्तर 고용보험 हो जसको अर्थ रोजगारी बीमा हो। ✗"}, {"n": "510", "q": "외국인근로자의 고용 등에 관한 법률에 따라 외국인근로자를 고용한 사업장의 사업주를 말합니다.", "options": ["취업자", "고용자", "재직자", "근로자"],
