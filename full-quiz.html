ाले विवरणसँग मिल्छ। ✓"}, {"n": "157", "q": "높은 곳에서 멀리 바라보는 아름다운 풍경을 말합니다. 산이나 건물 위에서 보는 경치가 이에 해당합니다.", "options": ["산맥", "고궁", "야경", "전망"], "answer": 3, "explain": "प्रश्नको अर्थ: उचाइमा रहेको ठाउँबाट टाढासम्मको सुन्दर दृश्य हेर्नुलाई जनाउँछ।\n① 산맥 भनेको पर्वतमाला हो। ✗\n② 고궁 भनेको पुरानो राजदरबार हो। ✗\n③ 야경 भनेको उच्च स्थानबाट टाढा हेर्दा देखिने सुन्दर रातको दृष्य (नाइट भ्यु) हो ✗\n④ 전망 भनेको टाढाको दृश्य वा अवलोकन हो तर यो विशेष गरी रातको दृश्यसँग जोडिएको छैन। ✓"}, {"n": "158", "q": "관광을 목적으로 사람들이 방문하는 장소입니다. 이러한 장소는 문화적, 자연적, 역사적 특색을 가진 지역으로, 여행자들에게 다양한 경험을 제공합니다.", "options": ["교육원", "전쟁지", "여행지", "놀이공원"], "answer": 2, "explain": "प्रश्नको अर्थ: मानिसहरू घुम्नका लागि जाने रमाइलो ठाउँलाई बुझाउँछ।\n① 교육원 भनेको शैक्षिक संस्था हो। ✗\n② 전쟁지 भनेको युद्ध क्षेत्र हो। ✗\n③ 여행지 भनेको मानिसहरू भ्रमणको उद्देश्यले भ्रमण गर्ने ठाउँ हो ✓\n④ 놀이공원 भनेको मनोरञ्जन पार्क हो। ✗"}, {"n": "159", "q": "전기 장비를 전기 공급 장치에 연결하는 2개 또는 3개의 금속 핀이 있는 작은 플라스틱 물체입니다.", "options": ["스위치", "콘센트", "플러그", "손전등"], "answer": 2, "explain": "प्रश्नको अर्थ: विद्युतीय उपकरणलाई करेन्टको लाइनमा जोड्न प्रयोग गरिने सानो वस्तु हो।\n① 스위치 भनेको बत्ती बाल्ने वा निभाउने स्विच हो। ✗\n② 콘센트 भनेको भित्तामा हुने सकेट हो। ✗\n③ 플러그 भनेको विद्युतीय उपकरणलाई करेन्टको स्रोतमा जोड्नको लागि २ वा ३ वटा धातुको पिन भएको सानो प्लाष्टिकको वस्तु हो ✓\n④ 손전등 भनेको टर्चलाइट हो। ✗"}, {"n": "160", "q": "한 사회의 역사적, 예술적, 과학적 가치가 있는 유물, 건축물, 전통 등을 포함한 물질적 및 비물질적 자산입니다.", "options": ["천연 자원", "산림 생물", "문화유산", "사유재산"], "answer": 2, "explain": "प्रश्नको अर्थ: समाजका ऐतिहासिक र सांस्कृतिक महत्त्व बोकेका अमूल्य सम्पदाहरू हुन्।\n① 천연 자원 भनेको प्राकृतिक स्रोत हो। ✗\n② 산림 생물 भनेको जङ्गली जीवजन्तु तथा वनस्पति हो। ✗\n③ 문화유산 भनेको कुनै समाजको ऐतिहासिक, कलात्मक र वैज्ञानिक मूल्य भएका पुरासम्पदा, वास्तुकला, परम्परा आदि समेटिएको सांस्कृतिक सम्पदा हो ✓\n④ 사유재산 भनेको निजी सम्पत्ति हो। ✗"}, {"n": "161", "q": "여행 중이나 일정 기간 동안 머물기 위해 제공되는 거주지입니다. 호텔, 게스트하우스, 민박, 리조트 등 다양한 형태로 제공됩니다.", "options": ["숙소", "주택", "기숙사", "고시원"], "answer": 0, "explain": "प्रश्नको अर्थ: यो यात्रा गर्दा वा निश्चित समयका लागि बस्न पाइने ठाउँ हो। यसलाई होटेल वा गेस्टहाउस जस्ता विभिन्न तरिकाले पाउन सकिन्छ।\n① 숙소 भनेको यात्राको समयमा वा निश्चित अवधिका लागि बस्न प्रदान गरिएको आवास हो ✓\n② 주택 भनेको सामान्य घर हो। ✗\n③ 기숙사 भनेको होस्टेल हो। ✗\n④ 고시원 भनेको सस्तो अध्ययन कोठा हो। ✗"}, {"n": "162", "q": "공동 소유 형태로 운영되는 주거지로, 일반적으로 여러 명이 한 건물 내의 임대하여 사용하는 형태입니다. 시설과 서비스가 호텔과 비슷한 특징을 가집니다.", "options": ["콘도", "민박", "펜션", "모텔"], "answer": 0, "explain": "प्रश्नको अर्थ: यो धेरै मानिसहरूले मिलेर प्रयोग गर्ने बस्ने ठाउँ हो। यसका सेवाहरू होटेल जस्तै राम्रा हुन्छन्।\n① 콘도 भनेको कन्डोमिनियम हो जो साझा स्वामित्वको रूपमा सञ्चालन हुने र होटल जस्तै सेवा तथा सुविधा भएको आवास हो ✓\n② 민박 भनेको होमस्टे हो। ✗\n③ 펜션 भनेको पेन्सन (रिसोर्ट शैलीको घर) हो। ✗\n④ 모텔 भनेको मोटेल हो। ✗"}, {"n": "163", "q": "주민이 자신의 집이나 별도로 마련된 공간을 여행객에게 제공하여 숙박을 하는 형태입니다. 보통 가정적인 분위기에서 저렴한 가격으로 숙박할 수 있으며, 주인과의 교류를 통해 현지 문화를 더 가까이 경험할 수 있습니다.", "options": ["호텔", "민박", "콘도", "펜션"], "answer": 1, "explain": "प्रश्नको अर्थ: यो स्थानीय घरमा यात्रीहरू बस्ने तरिका हो। यसमा सस्तो मूल्यमा बस्न र स्थानीय संस्कृति बुझ्न सकिन्छ।\n① 호텔 भनेको होटल हो। ✗\n② 민박 भनेको स्थानीय बासिन्दाले आफ्नो घर वा छुट्टै ठाउँ पर्यटकलाई दिएर बस्ने व्यवस्था मिलाउने होमस्टे हो ✓\n③ 콘도 भनेको कन्डोमिनियम हो। ✗\n④ 펜션 भनेको पेन्सन हो। ✗"}, {"n": "164", "q": "자연 속에서 휴식을 취할 수 있도록 마련된 작은 규모의 숙소로, 보통 가족이나 소규모 그룹을 대상으로 제공됩니다. 주로 독립된 건물이나 별채 형태로 되어 있어 프라이빗한 분위기에서 편안한 시간을 보낼 수 있습니다.", "options": ["기숙사", "고시원", "펜션", "민박"], "answer": 2, "explain": "प्रश्नको अर्थ: यो प्रकृतिको काखमा आराम गर्न बनाइएको सानो ठाउँ हो। यसमा परिवारसँग शान्त र आरामदायी समय बिताउन सकिन्छ।\n① 기숙사 भनेको आवासगृह वा होस्टेल हो, यो कम्पनी वा विद्यालयले उपलब्ध गराउने ठाउँ हो। ✗\n② 고시원 भनेको गोसीवोन हो, यो विद्यार्थी बस्ने सानो कोठा हो। ✗\n③ 펜션 भनेको रिसोर्ट कटेज हो, यो प्रकृतिमा परिवार वा सानो समूहले आराम गर्न सक्ने स्वतन्त्र भवन भएकाले विवरणसँग मिल्छ। ✓\n④ 민박 भनेको होमस्टे हो, यो साधारण घरमा भाडामा बस्ने ठाउँ हो। ✗"}, {"n": "165", "q": "물이 고여 있는 자연적인 낮은 지형으로, 산이나 평지에 형성됩니다. 이곳은 물놀이를 하거나 경치를 즐길 수 있는 멋진 장소입니다.", "options": ["강", "산", "호수", "바다"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पानी जम्मा हुने प्राकृतिक र होचो ठाउँ हो। यहाँ घुम्न र रमाइलो गर्न धेरै राम्रो हुन्छ।\n① 강 भनेको नदी हो। ✗\n② 산 भनेको पहाड हो। ✗\n③ 호수 भनेको पानी जमेको प्राकृतिक रूपमा रहेको सानो भू-भाग हो जुन पहाड वा समथर भूमिमा बन्छ र यहाँ पानीमा खेल्न वा दृश्यको आनन्द लिन सकिन्छ ✓\n④ 바다 भनेको समुद्र हो। ✗"}, {"n": "166", "q": "넓고 깊은 물이 있는 큰 곳입니다. 여러 나라를 나누는 경계가 되며, 물고기나 배를 이용한 여행에 중요한 역할을 합니다.", "options": ["온천", "호수", "야경", "바다"], "answer": 3, "explain": "प्रश्नको अर्थ: यो ठूलो र गहिरो पानी भएको क्षेत्र हो। यो देशहरू छुट्याउने सीमा बन्छ र यसमा पानीजहाज चलाइन्छ।\n① 온천 भनेको तातो पानी निस्कने ठाउँ हो ✗\n② 호수 भनेको ताल हो ✗\n③ 야경 भनेको रात्रिको दृश्य हो ✗\n④ 바다 भनेको समुद्र हो जसले धेरै पानी ओगटेको छ र देशहरूलाई छुट्याउँछ ✓"}, {"n": "167", "q": "바다나 호수에 둘러싸인 땅입니다. 크거나 작은 땅덩어리로, 사람이나 동식물이 살 수 있는 곳이기도 합니다.", "options": ["산", "강", "섬", "폭포"], "answer": 2, "explain": "प्रश्नको अर्थ: यो चारैतिर पानीले घेरिएको सानो वा ठूलो जमिन हो। यहाँ मानिस र जीवजन्तु बस्न सक्छन्।\n① 산 भनेको पहाड हो ✗\n② 강 भनेको नदी हो ✗\n③ 섬 भनेको चारैतिर पानीले घेरिएको टापु हो जहाँ मानिस र बोटबिरुवा बस्छन् ✓\n④ 폭포 भनेको झरना हो ✗"}, {"n": "168", "q": "자연에서 나오는 따뜻한 물입니다. 주로 지구의 깊은 곳에서 데워져 땅속에서 나오는 물로, 사람들은 몸을 담그며 피로를 풀거나 건강을 챙기기 위해 이용합니다.", "options": ["온천", "폭포", "동굴", "호수"], "answer": 0, "explain": "प्रश्नको अर्थ: यो प्रकृतिबाट आउने तातो पानी हो। मानिसहरू थकाइ मार्न र स्वास्थ्य राम्रो बनाउन यसमा डुब्छन्।\n① 온천 भनेको प्राकृतिक तातो पानी आउने ठाउँ हो जहाँ मानिसहरू थकाइ मार्न जान्छन् ✓\n② 폭포 भनेको झरना हो ✗\n③ 동굴 भनेको गुफा हो ✗\n④ 호수 भनेको ताल हो ✗"}, {"n": "169", "q": "옛날 사람들의 생활이나 문화가 남아 있는 장소입니다. 오래된 건물이나 유물들이 있어, 역사적인 가치를 지니며 사람들이 그곳을 방문하여 배우고 경험할 수 있습니다.", "options": ["유적지", "민속촌", "교육원", "천연 자원"], "answer": 0, "explain": "प्रश्नको अर्थ: यो पुराना कुराहरू र इतिहास सुरक्षित राखिएको ठाउँ हो। यहाँ गएर पुराना कुरा सिक्न सकिन्छ।\n① 유적지 भनेको ऐतिहासिक अवशेषहरू पाइने ठाउँ हो ✓\n② 민속촌 भनेको लोकगाउँ हो ✗\n③ 교육원 भनेको शिक्षा केन्द्र हो ✗\n④ 천연 자원 भनेको प्राकृतिक स्रोत हो ✗"}, {"n": "170", "q": "전통적인 생활 방식과 문화를 보여주는 마을입니다. 옛날 사람들의 집, 옷, 도구 등을 실제로 볼 수 있으며, 전통 놀이와 행사도 체험할 수 있는 곳입니다.", "options": ["문화유산", "여행지", "유적지", "민속촌"], "answer": 3, "explain": "प्रश्नको अर्थ: यो पुरानो शैलीको जीवन र संस्कृति देखाइने गाउँ हो। यहाँ पुराना घर र चलन प्रत्यक्ष हेर्न पाइन्छ।\n① 문화유산 भनेको सांस्कृतिक सम्पदा हो ✗\n② 여행지 भनेको भ्रमण गर्ने ठाउँ हो ✗\n③ 유적지 भनेको ऐतिहासिक स्थल हो ✗\n④ 민속촌 भनेको परम्परागत जीवनशैली र संस्कृति झल्काउने लोकगाउँ हो ✓"}, {"n": "171", "q": "과거에 일어난 일들과 그 과정을 말합니다. 사람들의 사건, 변화, 발전을 기록하여 현재와 미래에 배울 수 있습니다.", "options": ["사회", "경제", "소설", "역사"], "answer": 3, "explain": "प्रश्नको अर्थ: यो प्रश्नले भूतकालका घटनाहरू, परिवर्तन र विकासको बारेमा कुरा गर्ने विषयलाई बुझाउँछ।\n① 사회 भनेको समाज हो ✗\n② 경제 भनेको अर्थतन्त्र हो ✗\n③ 소설 भनेको उपन्यास हो ✗\n④ 역사 भनेको इतिहास हो जुन विगतका घटना र विकाससँग सम्बन्धित हुन्छ ✓"}, {"n": "172", "q": "산을 올라가며 자연을 즐기는 활동입니다. 사람들은 보통 산을 오르거나 하산하면서 운동을 하고, 산의 경치를 즐깁니다.", "options": ["여행", "등산", "방문", "만남"], "answer": 1, "explain": "प्रश्नको अर्थ: यो पहाड चढेर प्रकृति र रमाइलो लिने काम हो। यसबाट शरीरलाई व्यायाम पनि हुन्छ।\n① 여행 भनेको भ्रमण हो, यो नयाँ ठाउँको यात्रा गर्ने काम हो त्यसैले विवरणसँग मिल्दैन। ✗\n② 등산 भनेको पहाड चढ्नु हो, यो डाँडा चढेर प्रकृतिको आनन्द लिने काम हो त्यसैले यो विवरणसँग मिल्छ। ✓\n③ 방문 भनेको भेट्न जानु हो, यो कुनै ठाउँ वा मानिसलाई भेट्ने काम हो ✗\n④ 만남 भनेको भेटघाट हो, यो मानिसहरू आपसमा भेट्ने कुरा हो ✗"}, {"n": "173", "q": "왕이나 왕족이 살았던 큰 집입니다. 보통 많은 방과 정원이 있으며, 왕국의 중요한 행사나 정치적 결정이 이루어졌던 장소입니다.", "options": ["비원", "정원", "궁궐", "시청"], "answer": 2, "explain": "प्रश्नको अर्थ: यो राजा वा राजपरिवार बस्ने ठूलो भवन हो। यहाँ महत्त्वपूर्ण राजकीय निर्णयहरू हुने गर्दथे।\n① 비원 भनेको गुप्तेश्वर वा गोप्य बगैंचा हो ✗\n② 정원 भनेको बगैंचा हो ✗\n③ 궁궐 भनेको राजा वा राजपरिवार बस्ने राजदरबार हो ✓\n④ 시청 भनेको महानगरपालिका वा नगर कार्यालय हो ✗"}, {"n": "174", "q": "사람이 지은 건물이나 구조물입니다. 집, 학교, 다리처럼 다양한 목적을 위해 만들어지며, 크기나 모양도 다양합니다.", "options": ["사무소", "answer": 1, "explain": "प्रश्नको अर्थ: यो लामो समयदेखि मुखबाट मुखमा सर्दै आएको कथा हो। यसमा अनौठा घटना वा पात्रहरू हुन्छन्।\n① 속담 भनेको उखान हो ✗\n② 전설 भनेको जनश्रुति वा दन्त्यकथा/किंवदंती हो ✓\n③ 전쟁 भनेको युद्ध हो ✗\n④ 문화 भनेको संस्कृति हो ✗"}, {"n": "179", "q": "경주의 불국사 안에 있는 아름다운 돌탑입니다. 신라 시대에 만들어졌으며, 섬세하고 조화로운 모습으로 한국의 대표적인 문화유산 중 하나입니다.", "options": ["창덕궁", "경복궁", "다보탑", "석굴암"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पुरानो मन्दिरभित्र रहेको सुन्दर ढुङ्गाको धरहरा हो। यो कलात्मक रूपमा निकै आकर्षक छ।\n① 창덕궁 भनेको दरबार हो ✗\n② 경복궁 भनेको दरबार हो ✗\n③ 다보탑 भनेको ग्येोङ्जुको पुलगुक्साभित्र रहेको प्रसिद्ध ढुङ्गाको प्यागोडा (ताप्) हो ✓\n④ 석굴암 भनेको गुफा मन्दिर हो ✗"}, {"n": "180", "q": "부처님의 모습을 돌이나 나무로 만든 상입니다. 절에 가면 볼 수 있으며, 사람들은 불상 앞에서 기도하거나 마음의 평화를 빕니다.", "options": ["사원", "동상", "불상", "불경"], "answer": 2, "explain": "प्रश्नको अर्थ: यो ढुङ्गा वा काठबाट बनाइएको बुद्धको मूर्ति हो। मानिसहरू यसको अगाडि शान्तिका लागि प्रार्थना गर्छन्।\n① 사원 भनेको मन्दिर हो ✗\n② 동상은 सालिक वा मूर्ति हो ✗\n③ 불상 भनेको बुद्धको मूर्ति (बुल्साङ) हो ✓\n④ 불경 भनेको बौद्ध ग्रन्थ हो ✗"}, {"n": "181", "q": "어떤 일을 잘 해내기 위한 방법이나 능력으로 물건을 만들거나 기계를 다루는 것도 여기에 들어갑니다.", "options": ["기술", "기회", "후회", "성공"], "answer": 0, "explain": "प्रश्नको अर्थ: कुनै पनि काम राम्रोसँग गर्नको लागि चाहिने सीप वा क्षमतालाई जनाउँछ। यसमा वस्तु बनाउने वा मेसिन चलाउने कुरा पनि पर्छ।\n① 기술 को अर्थ सीप वा प्रविधि हो, यो सही उत्तर हो किनभने यसले कुनै काम राम्रोसँग गर्न सक्ने क्षमतालाई बुझाउँछ। ✓\n② 기회 को अर्थ मौका हो, यो वर्णन अनुसार मिल्दैन। ✗\n③ 후회 को अर्थ पछुतावा हो, यो काम गर्ने क्षमतासँग सम्बन्धित छैन। ✗\n④ 성공 को अर्थ सफलता हो, यो काम राम्रोसँग गर्ने तरिका वा क्षमता होइन। ✗"}, {"n": "182", "q": "여행을 떠나 다른 곳을 방문한 사람이며 주로 관광명소나 유명한 장소를 보고 즐기기 위해 떠납니다.", "options": ["관광객", "관중", "응원자", "손님"], "answer": 0, "explain": "प्रश्नको अर्थ: घरबाट टाढा घुम्न गएको मान्छे हो जो मुख्यतया पर्यटकीय स्थलहरू हेर्न जान्छ।\n① 관광객 को अर्थ पर्यटक हो, यो सही उत्तर हो किनभने यसले घुम्न आएको मानिसलाई बुझाउँछ। ✓\n② 관중 को अर्थ दर्शक हो, यो खेल वा कार्यक्रम हेर्ने मानिसहरूको समूह हो। ✗\n③ 응원자 को अर्थ समर्थक वा चिअरर हो, यो घुम्न जाने मानिस होइन। ✗\n④ 손님 को अर्थ पाहुना वा ग्राहक हो, यो पर्यटनसँग मात्र सम्बन्धित छैन। ✗"}, {"n": "183", "q": "조선 시대의 유학자 이황을 기리기 위해 세운 서원입니다. 경상북도 안동에 위치하며, 이곳은 이황 선생의 학문과 가르침을 배우기 위한 장소로 알려져 있습니다.", "options": ["도산서원", "수원화성", "창덕궁", "경복궁"], "answer": 0, "explain": "प्रश्नको अर्थ: इतिहासको एक प्रसिद्ध विद्वानको सम्झनामा बनाइएको अध्ययन गर्ने ठाउँ हो। यो एण्डोङ भन्ने ठाउँमा रहेको छ।\n① 도산서원 भनेको विद्वान इह्वाङको सम्झनामा बनाइएको अध्ययन केन्द्र हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n② 수원화성 भनेको सुवोनमा रहेको ऐतिहासिक किल्ला हो ✗\n③ 창덕궁 भनेको जोसोन कालको राजदरबार हो ✗\n④ 경복궁 भनेको जोसोन कालको मुख्य राजदरबार हो ✗"}, {"n": "184", "q": "공자의 가르침을 바탕으로 효, 예, 인을 중요시하며, 인간 관계에서 도덕적 규범과 예절을 중시하는 전통입니다. 가족 중심의 가치와 교육을 강조하여 사회의 질서와 조화를 유지하려고 했습니다.", "options": ["유교 문화", "서양 문화", "전통 문화", "동양 문화"], "answer": 0, "explain": "प्रश्नको अर्थ: मानिसहरूबीचको नैतिक नियम र शिष्टाचारलाई जोड दिने परम्परागत संस्कृति हो। यसले परिवार र शिक्षालाई विशेष महत्त्व दिन्छ।\n① 유교 문화 भनेको कन्फ्युसियसको शिक्षामा आधारित संस्कृति हो, जसले नैतिकता र शिष्टाचारलाई महत्त्व दिन्छ त्यसैले यो विवरणसँग मिल्छ। ✓\n② 서양 문화 भनेको पश्चिमी संस्कृति हो ✗\n③ 전통 문화 भनेको परम्परागत संस्कृति हो, तर यो कुनै एउटा विशेष दर्शन मात्र होइन त्यसैले मिल्दैन। ✗\n④ 동양 문화 भनेको पूर्वीय संस्कृति हो, जुन धेरै व्यापक विषय हो त्यसैले मिल्दैन। ✗"}, {"n": "185", "q": "자유 시간에 즐기는 활동이나 관심사입니다. 사람들이 스트레스를 풀거나 즐거움을 느끼기 위해 하는 일로, 예를 들면 운동, 독서, 그림 그리기 등이 있습니다.", "options": ["꿈", "취미", "지침", "근무"], "answer": 1, "explain": "प्रश्नको अर्थ: खाली समयमा रमाइलोको लागि गरिने गतिविधि हो। यसले मानिसको तनाव कम गर्न सहयोग गर्छ।\n① 꿈 को अर्थ सपना हो, यो खाली समयमा गर्ने क्रियाकलाप होइन। ✗\n② 취미 को अर्थ शोख वा रुचि हो, यो सही उत्तर हो किनभने यसले खाली समयमा आनन्दको लागि गर्ने कामलाई बुझाउँछ। ✓\n③ 지침 को अर्थ निर्देशिका वा मार्गदर्शन हो, यो रुचि होइन। ✗\n④ 근무 को अर्थ काम वा ड्युटी हो, यो फुर्सदको समयको गतिविधि होइन। ✗"}, {"n": "186", "q": "매운 양념에 떡과 어묵 등을 넣어 볶아 만든 한국 음식입니다. 길거리 음식으로 인기가 많고, 맵고 달콤한 맛이 특징입니다.", "options": ["비빔밥", "떡볶이", "떡국", "미역국"], "answer": 1, "explain": "प्रश्नको अर्थ: पिरो मसालामा चामलको पिठोबाट बनेको परिकार र माछाको टुक्रा मिसाएर बनाइने खानेकुरा हो। यो बाटोमा पाइने लोकप्रिय खाना हो।\n① 비빔밥 भनेको भातमा विभिन्न तरकारी मिसाएर खाइने कोरियाली खाना हो, त्यसैले यो भुटेको परिकार होइन। ✗\n② 떡볶이 भनेको पिरो मसलामा पीठोको परिकार र माछाको केक भुटेर बनाइने खाना हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ✓\n③ 떡국 भनेको पीठोको चक्का हालिएको झोल खाना हो, त्यसैले यो भुटेर बनाइने खाना होइन। ✗\n④ 미역국 भनेको समुद्री लेउको झोल हो, त्यसैले यो पिरो भुटेको खाना होइन। ✗"}, {"n": "187", "q": "요리를 하다가 음식의 맛을 더 맛있게 하기 위해 넣는 재료로 소금, 간장, 고추장, 설탕 등을 말합니다.", "options": ["식초", "양념", "고추장", "마늘"], "answer": 1, "explain": "प्रश्नको अर्थ: खानालाई अझ मीठो बनाउनको लागि प्रयोग गरिने मसला वा चिजहरू हुन्। यसमा नुन र चिनी जस्ता वस्तुहरू पर्छन्।\n① 식초 को अर्थ भिनेगर (सिरका) हो, यो एउटा मात्र मसला हो। ✗\n② 양념 को अर्थ मसला वा झोल हो, यो सही उत्तर हो किनभने यसले खाना मिठो बनाउन हालिने सबै सामग्रीहरूलाई जनाउँछ। ✓\n③ 고추장 को अर्थ गोछुजाङ (रातो खुर्सानीको पेस्ट) हो, यो एउटा विशेष मसला मात्र हो। ✗\n④ 마늘 को अर्थ लसुन हो, यो पनि एउटा मात्र खाद्य सामग्री हो। ✗"}, {"n": "188", "q": "닭 한 마리에 찹쌀, 마늘, 인삼 등을 넣고 끓인 한국의 보양 음식입니다. 주로 몸을 건강하게 하기 위해 여름철에 많이 먹습니다.", "options": ["감자탕", "닭갈비", "닭도리탕", "삼계탕"], "answer": 3, "explain": "प्रश्नको अर्थ: कुखुराको मासुमा विभिन्न जडीबुटी हालेर पकाइने तातो सुप हो। यो शरीरलाई शक्ति दिनको लागि गर्मीको समयमा खाइन्छ।\n① 감자탕 भनेको सुँगुरको हाड र आलुको झोल खाना हो, त्यसैले यो सिङ्गो कुखुरा हालेर बनाइने खाना होइन। ✗\n② 닭갈비 भनेको कुखुराको मासु भुटेर बनाइने खाना हो, त्यसैले यो झोल खाना होइन। ✗\n③ 닭도리탕 भनेको कुखुराको पिरो झोल खाना हो, तर यसमा इन्साम हालेर गर्मीमा खाइदैन। ✗\n④ 삼계탕 भनेको सिङ्गो कुखुरामा चामल, लसुन र इन्साम हालेर उम्ल्याइने पौष्टिक खाना हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ✓"}, {"n": "189", "q": "냉동 우유 또는 크림과 설탕으로 만든 매우 차갑고 달콤한 음식 주로 여름철 때 즐겨 먹습니다.", "options": ["초콜릿", "떡볶이", "아이스크림", "송편"], "answer": 2, "explain": "प्रश्नको अर्थ: दूध र चिनीबाट बनाइने चिसो र गुलियो खानेकुरा हो। यो विशेष गरी गर्मीको मौसममा खान धेरै रमाइलो हुन्छ।\n① 초콜릿 को अर्थ चकलेट हो, यो दूध र बरफबाट बनेको होइन। ✗\n② 떡볶이 को अर्थ तोक्बोक्की हो, यो पिरो खाना हो। ✗\n③ 아이스크림 को अर्थ आइसक्रिम हो, यो सही उत्तर हो किनभने यो चिसो दूध वा क्रिम र चिनीबाट बनाइन्छ। ✓\n④ 송편 को अर्थ सोङ्प्येोन हो, यो चोसेक पर्वमा खाने पिठोको परिकार हो। ✗"}, {"n": "190", "q": "고기, 채소 등 다양한 재료를 밀가루 반죽에 싸서 찌거나 굽거나 튀긴 한국의 전통 음식입니다. 간 식이나 반찬, 국물 요리에 다양하게 활용됩니다.", "options": ["라면", "김치", "만두", "잡채"], "answer": 2, "explain": "प्रश्नको अर्थ: विभिन्न तरकारी र मासु पिठोभित्र हालेर बनाइने परिकार हो। यसलाई उसिनेर वा तारेर खान सकिन्छ।\n① 라면 को अर्थ राम्युन (चाउचाउ) हो, यो पिठोको खोलमा बेरेको डम्प्लिङ होइन। ✗\n② 김치 को अर्थ किम्छि हो, यो बन्दाकोबीको अचार हो। ✗\n③ 만두 को अर्थ मानदु हो, यो सही उत्तर हो किनभने यो पिठोको बाक्लो खोलमा मासु र तरकारी राखेर बनाइने परिकार हो। ✓\n④ 잡채 को अर्थ चाप्चे हो, यो सेलरोटी वा चाउमिन जस्तो तरकारी र चाउचाउ मिसाएको परिकार हो। ✗"}, {"n": "191", "q": "전 세계의 컴퓨터와 네트워크를 서로 연결해 정보를 주고받을 수 있게 하는 통신망입니다.", "options": ["인터넷", "스마트폰", "웹사이트", "홈페이지"], "answer": 0, "explain": "प्रश्नको अर्थ: संसारभरका कम्प्युटरहरूलाई जोडेर सूचना आदानप्रदान गर्न सघाउने सञ्जाल हो। यसको सहायताले हामी अनलाइन बस्न सक्छौं।\n① 인터넷 को अर्थ इन्टरनेट हो, यो सही उत्तर हो किनभने यसले संसारभरका कम्प्युटरहरूलाई जोड्ने काम गर्छ। ✓\n② 스마트폰 को अर्थ स्मार्टफोन हो, यो एउटा उपकरण मात्र हो। ✗\n③ 웹사이트 को अर्थ वेबसाइट हो, यो इन्टरनेटभित्रको एउटा पाटो हो। ✗\n④ 홈페이지 को अर्थ होमपेज हो, यो पनि एउटा वेब पेज हो। ✗"}, {"n": "192", "q": "컴퓨터나 스마트폰을 이용하여 통신 회선으로 주고받는 서류나 글입니다.", "options": ["이메일", "웹사이트", "인터넷", "블로그"], "answer": 0, "explain": "प्रश्नको अर्थ: इलेक्ट्रोनिक माध्यमबाट एक ठाउँबाट अर्को ठाउँमा पठाउने चिठी वा सन्देश हो। यो कम्प्युटरमार्फत पठाइन्छ।\n① 이메일 को अर्थ इमेल हो, यो सही उत्तर हो किनभने यसले कम्प्युटर वा फोनबाट पत्र वा लेखहरू आदानप्रदान गर्न सघाउँछ। ✓\n② 웹사이트 को अर्थ वेबसाइट हो, यो हेर्ने ठाउँ हो। ✗\n③ 인터넷 को अर्थ इन्टरनेट हो, यो सञ्जाल हो। ✗\n④ 블로그 को अर्थ ब्लग हो, यो व्यक्तिगत लेख्ने ठाउँ हो। ✗"}, {"n": "193", "q": "사람들과 정보를 주고받으며 소통할 수 있는 사회 관계망 서비스입니다. 대표적으로 인스타그램, 페이스북, 트위터 등이 있습니다.", "options": ["애플리케이션", "에스엔에스", "와이파이", "인터넷"], "answer": 1, "explain": "प्रश्नको अर्थ: मानिसहरूबीच विचार र तस्बिरहरू साटासाट गर्न मिल्ने डिजिटल चौतारी हो। यसमा विभिन्न लोकप्रिय सामाजिक सञ्जालहरू पर्छन्।\n① 애플리케이션 भनेको कम्प्युटर वा मोबाइलको सफ्टवेयर प्रोग्राम हो, त्यसैले यो सामाजिक सञ्जाल मात्र होइन। ✗\n② 에스엔에스 भनेको मानिसहरूसँग जानकारी साटासाट गर्ने सामाजिक सञ्जाल सेवा हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ✓\n③ 와이파이 भनेको ताररहित इन्टरनेट प्रविधि हो, त्यसैले यो सामाजिक सञ्जाल होइन। ✗\n④ 인터넷 भनेको विश्वव्यापी कम्प्युटर सञ्जाल हो, तर फेसबुक वा इन्स्टाग्राम जस्ता सेवालाई 에스엔에스 भनिन्छ। ✗"}, {"n": "194", "q": "감정이나 표정을 그림이나 기호로 나타낸 것입니다. 메시지나 글에 감정을 표현할 때 자주 사용됩 니다.", "options": ["웹사이트", "이모티콘", "메세지", "채팅"], "answer": 1, "explain": "प्रश्नको अर्थ: आफ्नो भावना वा मुहारको भाव बुझाउने साना चित्रहरू हुन्। सन्देश पठाउँदा कुरा प्रष्ट पार्न यो प्रयोग गरिन्छ।\n① 웹사이트 भनेको इन्टरनेटको वेब पृष्ठ हो, त्यसैले यो भावना जनाउने चित्र होइन। ✗\n② 이모티콘 भनेको भावना वा अनुहारको हाउभाउलाई चित्र वा चिन्हद्वारा देखाउने माध्यम हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ✓\n③ 메세지 भनेको सन्देश वा खबर हो, त्यसैले यो भावना व्यक्त गर्ने चित्र होइन। ✗\n④ 채팅 भनेको इन्टरनेटमा गरिने कुराकानी हो, त्यसैले यो चित्र होइन। ✗\nशिक्षकको उत्तर-पत्र: ③ 메세지 — मेरो उत्तर: ② 이모티콘। भावना चित्र/चिन्हबाट व्यक्त गर्ने कुरा भनेको इमोटिकन (이모티콘) हो; 메세지 त सन्देश मात्र हो।"}, {"n": "195", "q": "무선으로 인터넷에 연결할 수 있게 해 주는 기술입니다. 스마트폰, 노트북 등 여러 기기가 케이블 없이 인터넷을 사용할 수 있도록 도와줍니다.", "options": ["댓글", "메신저", "와이파이", "홈페이지"], "answer": 2, "explain": "प्रश्नको अर्थ: तार विना नै इन्टरनेट चलाउन मिल्ने प्रविधि हो। यसले मोबाइल वा ल्यापटपमा सजिलै नेट चलाउन मद्दत गर्छ।\n① 댓글 को अर्थ कमेन्ट (टिप्पणी) हो, यो इन्टरनेट चलाउने प्रविधि होइन। ✗\n② 메신저 को अर्थ मेसेन्जर हो, यो कुरा गर्ने एप हो। ✗\n③ 와이파이 को अर्थ वाइफाइ हो, यो सही उत्तर हो किनभने यसले तारबिना इन्टरनेटमा जोड्न मद्दत गर्छ। ✓\n④ 홈페이지 को अर्थ होमपेज हो, यो एउटा साइट हो। ✗"}, {"n": "196", "q": "병원이나 의원에서 의사가 환자의 건강 상태를 확인하고 병을 진단하거나 치료하는 과정입니다.", "options": ["수술", "상담", "통화", "진료"], "answer": 3, "explain": "प्रश्नको अर्थ: अस्पतालमा गएर डाक्टरले बिरामीको स्वास्थ्य जाँच्ने र उपचार गर्ने प्रक्रिया हो। यसबाट रोग पत्ता लाग्छ।\n① 수술 भनेको शल्यक्रिया गर्नु हो, यो स्वास्थ्य अवस्था जाँच गर्ने प्रक्रिया होइन त्यसैले मिल्दैन। ✗\n② 상담 भनेको परामर्श वा सल्लाह लिनु हो, यो उपचार गर्ने प्रक्रिया होइन त्यसैले मिल्दैन। ✗\n③ 통화 भनेको फोनमा कुराकानी गर्नु हो, यो चिकित्सासँग सम्बन्धित छैन त्यसैले मिल्दैन। ✗\n④ 진료 भनेको अस्पताल वा क्लिनिकमा डाक्टरले बिरामीको स्वास्थ्य अवस्था जाँच गरेर रोगको निदान वा उपचार गर्नु हो ✓"}, {"n": "197", "q": "질병이나 몸의 이상으로 나타나는 기침, 열, 통증 같은 여러 가지 신체적 또는 정신적인 변화입니다.", "options": ["부상", "약품", "치료", "증상"], "answer": 3, "explain": "प्रश्नको अर्थ: रोग वा शारीरिक समस्याका कारण देखिने लक्षणहरू हुन्। यसमा ज्वरो आउने वा दुख्ने जस्ता कुराहरू पर्छन्।\n१. 부상 भनेको चोटपटक लाग्नु हो, यो रोग वा शारीरिक परिवर्तन मात्र होइन त्यसैले मिल्दैन। २. 약품 भनेको औषधि हो, यो शारीरिक लक्षण होइन त्यसैले मिल्दैन। ३. 증상 भनेको रोग वा शरीरमा आएको गडबडीका कारण देखिने खोकी, ज्वरो, दु통जस्ता शारीरिक वा मानसिक परिवर्तनहरू हुन्, त्यसैले यो सही उत्तर हो। ४. 치료 भनेको उपचार गर्नु हो, यो रोगको लक्षण होइन त्यसैले मिल्दैन। सही उत्तर 3 नम्बरको 증상 हो।"}, {"n": "198", "q": "질병이나 상처를 치료하기 위해 의학적으로 몸의 일부를 절개하거나 조작하는 치료 방법입니다. 병원에서 전문 의사가 시행합니다.", "options": ["진료", "진단", "수술", "검진"], "answer": 2, "explain": "प्रश्नको अर्थ: अन्तरङ्ग उपचारको लागि शरीरको कुनै भागमा शल्यक्रिया गर्ने विधि हो। यो डाक्टरको निगरानीमा गरिन्छ।\n① 진료 भनेको सामान्य जाँच र उपचार हो, यो शरीरको भाग काट्ने शल्यक्रिया होइन त्यसैले मिल्दैन। ✗\n② 진단 भनेको रोग पत्ता लगाउनु हो, यो शल्यक्रिया गर्ने विधि होइन त्यसैले मिल्दैन। ✗\n③ 수술 भनेको रोग वा चोटपटक उपचार गर्नका लागि चिकित्सकीय रूपमा शरीरको कुनै भाग काटेर वा जोडेर गरिने उपचार विधि हो ✓\n④ 검진 भनेको स्वास्थ्य परीक्षण गर्नु हो, यो शल्यक्रिया होइन त्यसैले मिल्दैन। ✗"}, {"n": "199", "q": "의사가 환자에게 필요한 약의 종류와 복용 방법을 적어 약국에서 약을 살 수 있도록 해 주는 문서입니다.", "options": ["엑스레이", "진단서", "처방전", "보험증"], "answer": 2, "explain": "प्रश्नको अर्थ: डाक्टरले बिरामीलाई कुन औषधि कति खाने भनेर लेखिदिएको कागजको टुक्रा हो। यसैको आधारमा औषधि पसलबाट औषधि किनिन्छ।\n① 엑스레이 भनेको शरीरको भित्री भागको फोटो खिच्ने प्रविधि हो, त्यसैले यो औषधि किन्ने कागज होइन। ✗\n② 진단서 भनेको डाक्टरले रोगको विवरण लेख्ने पत्र हो, तर यसबाट औषधि पसलमा औषधि किन्न मिल्दैन। ✗\n③ 처방전 भनेको डाक्टरले औषधिको प्रकार र खाने तरिका लेखेर दिने पुर्जा हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ✓\n④ 보험증 भनेको स्वास्थ्य बिमाको परिचयपत्र हो, त्यसैले यो औषधि किन्ने पुर्जा होइन। ✗"}, {"n": "200", "q": "사람이나 동물의 몸 전체를 의미하며, 뼈, 근육, 장기 등으로 구성되어 있습니다. 신체는 생명 활동을 유지하고, 외부 환경에 적응하는 역할을 합니다.", "options": ["신체", "체온", "신장", "체중"], "answer": 0, "explain": "प्रश्नको अर्थ: मान्छे वा जनावरको सिङ्गो शरीरलाई बुझाउने शब्द हो। यसमा हड्डी, मासु र भित्री अङ्गहरू सबै पर्छन्।\n① 신체 भनेको मानिस वा जनावरको सम्पूर्ण शरीर हो, जुन हाड, मांशपेसी, अंगहरू आदि मिलेर बनेको हुन्छ ✓\n② 체온 भनेको शरीरको तापक्रम हो, यो सम्पूर्ण शरीर होइन त्यसैले मिल्दैन। ✗\n③ 신장 भनेको उचाइ (वा मिर्गौला) हो, यो शरीरको सम्पूर्ण अंग होइन त्यसैले मिल्दैन। ✗\n④ 체중 भनेको शरीरको तौल हो, यो सम्पूर्ण शरीरको अर्थ होइन त्यसैले मिल्दैन। ✗"}, {"n": "201", "q": "지역 사회의 건강을 관리하고 증진하기 위해 공공 보건 서비스를 제공하는 기관입니다. 예방접종, 건강 상담, 검진 등 다양한 건강 관리 서비스를 제공합니다.", "options": ["보건소", "상담소", "아동의원", "정형외과"], "answer": 0, "explain": "प्रश्नको अर्थ: यो मानिसहरूको स्वास्थ्य हेरचाह गर्ने र विभिन्न स्वास्थ्य सेवा दिने सरकारी संस्था हो। यसले खोप र स्वास्थ्य जाँच जस्ता सेवाहरू प्रदान गर्दछ।\n① 보건소 भनेको समुदायको स्वास्थ्य व्यवस्थापन र प्रवर्द्धनका लागि सार्वजनिक स्वास्थ्य सेवा प्रदान गर्ने संस्था हो ✓\n② 상담소 भनेको परामर्श केन्द्र हो, यो सार्वजनिक स्वास्थ्य सेवा दिने संस्था होइन त्यसैले मिल्दैन। ✗\n③ 아동의원 भनेको बाल अस्पताल हो, यो सबैका लागि सार्वजनिक स्वास्थ्य सेवा दिने संस्था होइन त्यसैले मिल्दैन। ✗\n④ 정형외과 भनेको हाडजोर्नी अस्पताल हो, यो विशेष अस्पताल हो त्यसैले मिल्दैन। ✗"}, {"n": "202", "q": "내적인 질병, 즉 내부 장기와 관련된 질환을 진단하고 치료하는 의학 분야입니다. 주로 소화기, 심장, 호흡기 등 다양한 문제를 다룹니다.", "options": ["치과", "내과", "안과", "소아과"], "answer": 1, "explain": "प्रश्नको अर्थ: यो शरीर भित्रका अङ्गहरूको रोग जाँच गर्ने र उपचार गर्ने चिकित्सा क्षेत्र हो। यसले पेट, मुटु र श्वासप्रश्वास सम्बन्धी समस्याहरूको उपचार गर्दछ।\n① 치과 भनेको दाँतको अस्पताल हो, यो आन्तरिक अंगहरूको रोगको उपचार गर्ने विभाग होइन त्यसैले मिल्दैन। ✗\n② 내과 भनेको आन्तरिक रोगहरू जस्तै पेट, मुटु, फोक्सो आदिको जाँच र उपचार गर्ने चिकित्सा क्षेत्र हो ✓\n③ 안과 भनेको आँखाको अस्पताल हो, यो आन्तरिक अंगको विभाग होइन त्यसैले मिल्दैन। ✗\n④ 소아과 भनेको बालरोग अस्पताल हो, यो आन्तरिक रोग विभाग होइन त्यसैले मिल्दैन। ✗"}, {"n": "203", "q": "이를 치료하거나 교정하는 의원이나 병원입니다.", "options": ["안과", "치과", "내과", "피부과"], "answer": 1, "explain": "प्रश्नको अर्थ: यो दाँतको उपचार गर्ने वा मिलाउने ठाउँ वा अस्पताल हो।\n① 안과 भनेको आँखाको अस्पताल हो, यो दाँतको उपचार गर्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n② 치과 भनेको दाँतको उपचार वा मिलाउने (क्यो्रेक्ट गर्ने) अस्पताल वा क्लिनिक हो ✓\n③ 내과 भनेको आन्तरिक रोगको अस्पताल हो, यो दाँतको अस्पताल होइन त्यसैले मिल्दैन। ✗\n④ 피부과 भनेको छालाको अस्पताल हो, यो दाँतको अस्पताल होइन त्यसैले मिल्दैन। ✗"}, {"n": "204", "q": "뼈, 관절, 근육이 아프거나 다쳤을 때 치료하는 병원입니다. 골절이나 관절염, 허리 아픔 등을 고치는 곳입니다.", "options": ["피부과", "산부인과", "성형외과", "정형외과"], "answer": 3, "explain": "प्रश्नको अर्थ: यो हड्डी, जोर्नी र मांसपेशी दुख्दा वा चोट लाग्दा उपचार गर्ने अस्पताल हो। यसले फ्र्याक्चर र बाथ रोग जस्ता समस्याहरूको उपचार गर्दछ।\n① 피부과 भनेको छालाको अस्पताल हो, यो हाडजोर्नीको उपचार गर्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n② 산부인과 भनेको प्रसूति तथा स्त्रीरोग अस्पताल हो, यो हाडजोर्नीको होइन त्यसैले मिल्दैन। ✗\n③ 성형외과 भनेको प्लास्टिक सर्जरी अस्पताल हो, यो हाडजोर्नी दुख्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n④ 정형외과 भनेको हाड, जोर्नी र मांशपेसी दुख्दा वा चोट लाग्दा उपचार गर्ने अस्पताल हो ✓"}, {"n": "205", "q": "전통적인 한국 의학적인 방식을 이용해 치료하는 곳입니다. 주로 약초나 침, 뜸 등을 사용하여 몸의 균형을 맞추고 건강을 돌봅니다.", "options": ["의원", "안과", "치과", "한의원"], "answer": 3, "explain": "प्रश्नको अर्थ: यो परम्परागत तरिकाले उपचार गर्ने ठाउँ हो। यहाँ जडीबुटी, सुई र सेकाईको प्रयोग गरेर शरीरको स्वास्थ्य हेरचाह गरिन्छ।\n१. 의원 भनेको सामान्य क्लिनिक हो, यो परम्परागत कोरियाली चिकित्सा पद्धति मात्र होइन त्यसैले मिल्दैन। २. 안과 भनेको आँखाको अस्पताल हो, यो परम्परागत चिकित्सा होइन त्यसैले मिल्दैन। ३. 치과 भनेको दाँतको अस्पताल हो, यो परम्परागत चिकित्सा होइन त्यसैले मिल्दैन। ४. 한의원 भनेको परम्परागत कोरियाली चिकित्सा पद्धति प्रयोग गरेर उपचार गर्ने ठाउँ हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको 한의원 हो।"}, {"n": "206", "q": "얼굴이나 몸의 모양을 고치거나 바꾸는 치료를 하는 병원입니다. 다친 곳을 복원하거나 더 예쁘게 만들기 위해 수술하기도 합니다.", "options": ["내과", "피부과", "소아과", "성형외과"], "answer": 3, "explain": "प्रश्नको अर्थ: यो अनुहार वा शरीरको आकार परिवर्तन गर्न वा सुधार्न शल्यक्रिया गर्ने अस्पताल हो।\n① 내과 भनेको आन्तरिक रोगको अस्पताल हो, यो शरीरको आकार बदल्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n② 피부과 भनेको छालाको अस्पताल हो, यो प्लास्टिक सर्जरी गर्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n③ 소아과 भनेको बालरोग अस्पताल हो, यो सर्जरी गर्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n④ 성형외과 भनेको अनुहार वा शरीरको आकार सच्याउने वा परिवर्तन गर्ने उपचार गर्ने अस्पताल हो ✓"}, {"n": "207", "q": "귀, 코, 목이 아플 때 치료해 주는 병원으로 감기, 코막힘, 중이염 같은 병을 봅니다.", "options": ["청소년과", "정형외과", "이비인후과", "산부인과"], "answer": 2, "explain": "प्रश्नको अर्थ: यो कान, नाक र घाँटी दुख्दा उपचार गर्ने अस्पताल हो। यसले रुघाखोकी र टन्सिल जस्ता रोगहरूको उपचार गर्दछ।\n① 청소년과 भनेको किशोरकिशोरी विभाग हो, यो कान, नाक, घाँटी हेर्ने अस्पताल होइन त्यसैले मिल्दैन। ✗\n② 정형외과 भनेको हाडजोर्नी अस्पताल हो, यो कान, नाक, घाँटी हेर्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n③ 이비인후과 भनेको कान, नाक र घाँटी दुख्दा रुघाखोकी, नाक बन्द हुने रोगको उपचार गर्ने अस्पताल हो ✓\n④ 산부인과 भनेको प्रसूति तथा स्त्रीरोग अस्पताल हो, यो कान, नाक, घाँटीको अस्पताल होइन त्यसैले मिल्दैन। ✗"}, {"n": "208", "q": "약을 사는 곳으로, 의사가 준 처방전을 가지고 가면 약을 받아 먹을 수 있습니다. 감기약이나 연고 같은 일반 약도 살 수 있습니다.", "options": ["진료소", "병원", "약국", "극장"], "answer": 2, "explain": "प्रश्नको अर्थ: यो औषधि किन्न पाइने ठाउँ हो जहाँ डाक्टरको पुर्जी देखाएर औषधि लिन सकिन्छ।\n① 진료소 भनेको स्वास्थ्य चौकी हो, यो औषधि किन्ने ठाउँ होइन त्यसैले मिल्दैन। ✗\n② 병원 भनेको अस्पताल हो, यो औषधि मात्र किन्न जाने ठाउँ होइन त्यसैले मिल्दैन। ✗\n③ 약국 भनेको औषधि किन्ने ठाउँ हो, जह
