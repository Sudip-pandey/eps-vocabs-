성 있고 바람이 잘 통하는 면포, 거즈 따위로 만듭니다.", "options": ["반창고", "붕대", "영양제", "파스"], "answer": 1, "explain": "प्रश्नको अर्थ: यो प्रश्नले शरीरमा घाउ वा खटिरा हुँदा बेर्ने एउटा सफा कपडाको बारेमा कुरा गरिरहेको छ। यो हावा पास हुने किसिमको हुन्छ।\n① 반창고 भनेको ब्यान्डएज वा प्लास्टर हो ✗\n② 붕대 भनेको घाउमा बेर्ने ब्यान्डेज वा पट्टि हो ✓\n③ 영양제 भनेको भिटामिन तथा पौष्टिक तत्व हो ✗\n④ 파스 भनेको दुखाइ कम गर्ने टाँस्ने प्याच हो ✗\nशिक्षकको उत्तर-पत्र: ① 반창고 — मेरो उत्तर: ② 붕대। प्रश्न: '감는 소독한 헝겊, 면포/거즈' — घाउमा बेर्ने (wrap गर्ने) कपास/गज कपडा — त्यो ब्यान्डेज रोल (붕대) हो; 반창고 त सानो टाँसिने प्लास्टर (ब्यान्ड-एड) हो।"}, {"n": "213", "q": "몸이나 상처가 아플 때 치료의 효과는 없고 통증을 느끼지 못하게 하는 약입니다.", "options": ["해열제", "영양제", "소화제", "진통제"], "answer": 3, "explain": "प्रश्नको अर्थ: यो शरीर दुख्दा दुखाइ कम गर्न प्रयोग गरिने औषधि हो।\n① 해열제 भनेको ज्वरो, घटाउने औषधि हो ✗\n② 영양제 भनेको पौष्टिक औषधि हो ✗\n③ 소화제 भनेको पाचनसम्बन्धी औषधि हो ✗\n④ 진통제 भनेको दुखाइ कम गर्ने औषधि हो ✓"}, {"n": "214", "q": "우리 몸에 필요한 비타민이나 영양소를 보충해 주는 건강 보조 식품입니다. 피로할 때나 영양이 부족할 때 먹습니다.", "options": ["항생제", "영양제", "지사제", "진통제"], "answer": 1, "explain": "प्रश्नको अर्थ: यो शरीरलाई चाहिने भिटामिन र पोषक तत्वपूर्ति गर्ने स्वास्थ्यवर्धक खाद्य पदार्थ हो।\n① 항생제 भनेको एन्टिबायोटिक हो ✗\n② 영양제 भनेको शरीरलाई चाहिने भिटामिन र पौष्टिक तत्व दिने स्वास्थ्य पूरक खाद्यपदार्थ हो ✓\n③ 지사제 भनेको पखाला रोक्ने औषधि हो ✗\n④ 진통제 भनेको दुखाइ कम गर्ने औषधि हो ✗"}, {"n": "215", "q": "약을 전문적으로 알고, 약을 조제하거나 올바르게 먹는 방법을 알려주는 사람입니다. 주로 약국에서 일합니다.", "options": ["의사", "약사", "간호사", "보호자"], "answer": 1, "explain": "प्रश्नको अर्थ: यो औषधि बनाउने र कसरी खाने भनेर सिकाउने व्यक्ति हो जो प्रायः औषधि पसलमा काम गर्छ।\n① 의사 भनेको डाक्टर हो ✗\n② 약사 भनेको औषधि पसलमा बसेर औषधि बनाउने र खाने तरिका सिकाउने फार्मासिस्ट (फार्मासिस्ट/औषधि व्यवसायी) हो ✓\n③ 간호사 भनेको नर्स हो ✗\n④ 보호자 भनेको बिरामीको रेखदेख गर्ने संरक्षक हो ✗"}, {"n": "216", "q": "우체국으로 보내는 모든 종류의 물건이나 편지를 말합니다. 예를 들어, 편지, 소포, 카드 등이 우편물에 포함됩니다.", "options": ["준비물", "수하물", "우편물", "방해물"], "answer": 2, "explain": "प्रश्नको अर्थ: यो हुलाकबाट पठाउने सबै किसिमका चिठीपत्र र सामानहरू हुन्।\n① 준비물 भनेको तयारी गर्ने सामग्री हो ✗\n② 수하물 भनेको लगेज वा सामान हो ✗\n③ 우편물 भनेको चिठीपत्र वा हुलाकबाट पठाउने वस्तु हो ✓\n④ 방해물 भनेको बाधा पुर्‍याउने वस्तु हो ✗"}, {"n": "217", "q": "물건을 집이나 회사로 배달해 주는 서비스입니다. 주문한 상품이나 소포를 빠르게 집으로 받아 볼 수 있습니다.", "options": ["이체", "EMS", "택배", "환불"], "answer": 2, "explain": "प्रश्नको अर्थ: यो सामानलाई घर वा कम्पनीसम्म पुर्याइदिने सेवा हो।\n① 이체 भनेको बैंक खाताबाट पैसा स्थानान्तरण गर्नु हो ✗\n② EMS भनेको अन्तर्राष्ट्रिय द्रुत हुलाक सेवा हो ✗\n③ 택배 भनेको घर वा कम्पनीमा सामान पुर्‍याइदिने कुरियर सेवा हो ✓\n④ 환불 भनेको पैसा फिर्ता गर्नु हो ✗"}, {"n": "218", "q": "오늘 보낸 우편물을 다음 날 바로 받아볼 수 있는 빠른 우편 서비스입니다. 급하게 보내야 할 때 사용합니다.", "options": ["일반 소포", "항공 우편", "익일 특급", "선박 우편"], "answer": 2, "explain": "प्रश्नको अर्थ: यो आज पठाएको चिठी भोलिपल्ट नै छिटो प्राप्त हुने हुलाक सेवा हो।\n① 일반 소포 भनेको सामान्य पार्सल हो ✗\n② 항공 우편 भनेको हवाइ हुलाक हो ✗\n③ 익일 특급 भनेको भोलिपल्टै प्राप्त हुने गरी पठाइने द्रुत हुलाक सेवा हो ✓\n④ 선박 우편 भनेको पानीजहाजबाट पठाइने हुलाक हो ✗"}, {"n": "219", "q": "국제적으로 긴급한 문서나 물품을 신속하게 배송하는 우편 서비스입니다. 빠른 배송과 함께 배송 추적 기능도 제공됩니다.", "options": ["국제 특급", "익일 우편", "국내 소포", "일반 우편"], "answer": 0, "explain": "प्रश्नको अर्थ: यो देशविदेशमा छिटो र सुरक्षित रूपमा कागजात वा सामान पठाउने अन्तर्राष्ट्रिय सेवा हो।\n① 국제 특급 (이에엠에스) भनेको अन्तर्राष्ट्रिय द्रुत हुलाक सेवा हो, जसले कागजात वा सामान छिटो पठाउँछ र ट्र्याकिङ पनि दिन्छ ✓\n② 익일 우편 भनेको भोलिपल्ट पुग्ने हुलाक सेवा हो, यो अन्तर्राष्ट्रिय सेवा होइन। ✗\n③ 국내 소포 भनेको देशभित्र पठाउने पार्सल सेवा हो, अन्तर्राष्ट्रिय सेवा होइन। ✗\n④ 일반 우편 भनेको साधारण हुलाक सेवा हो, जुन छिटो हुँदैन। ✗"}, {"n": "220", "q": "비행기를 이용해 사람이나 화물을 한 장소에서 다른 장소로 운송하는 서비스입니다. 빠른 이동이 가능해 국내외 여행과 물류에 널리 사용됩니다.", "options": ["항공편", "교통편", "선편", "왕복"], "answer": 0, "explain": "प्रश्नको अर्थ: यो जहाजमार्फत मानिस वा सामान एक ठाउँबाट अर्को ठाउँमा पुर्याउने सेवा हो।\n① 항공편 भनेको हवाइमार्ग वा उडान सेवा हो ✓\n② 교통편 भनेको यातायातको साधन वा माध्यम हो ✗\n③ 선편 भनेको जलमार्ग वा पानीजहाज सेवा हो ✗\n④ 왕복 भनेको जानु र आउनु (दोहोरो यात्रा) हो ✗"}, {"n": "221", "q": "전기, 수도, 가스, 전화 등 공공기관이나 공기업에 정기적으로 내는 요금입니다. 생활에 필요한 기본 서비스 이용에 대한 대가입니다.", "options": ["임금", "벌금", "보험금", "공과금"], "answer": 3, "explain": "प्रश्नको अर्थ: यो प्रश्नले बिजुली, पानी र ग्यास जस्ता सेवा प्रयोग गरे बापत नियमित तिर्नुपर्ने शुल्कको बारेमा बताउँछ। यो दैनिक जीवनमा आवश्यक पर्ने आधारभूत सुविधाको मूल्य हो।\n① 임금 भनेको ज्याला वा तलब हो ✗\n② 벌금 भनेको जरिवाना हो ✗\n③ 보험금 भनेको दाबी भुक्तानी रकम वा बिमा रकम हो ✗\n④ 공과금 भनेको बिजुली, पानी, ग्यास जस्ता सार्वजनिक शुल्कहरू हुन् ✓"}, {"n": "222", "q": "은행에서 개인이나 기업이 금융 거래를 할 수 있도록 만든 책자나 카드입니다. 입금, 출금, 송금 등의 기록이 기록되어 있으며, 계좌와 연결되어 사용됩니다.", "options": ["도장", "서명", "창구", "통장"], "answer": 3, "explain": "प्रश्नको अर्थ: यो प्रश्नले बैंकमा पैसा जम्मा गर्न, झिक्न र पठाउनका लागि प्रयोग गरिने खातासँग जोडिएको साधनलाई जनाउँछ। यसमा कारोबारका सबै रेकर्डहरू लेखिएका हुन्छन्।\n① 도장 भनेको सहीछाप वा ल्याछाप लगाउने छाप हो ✗\n② 서명 भनेको हस्ताक्षर हो ✗\n③ 창구 भनेको बैंकको काउन्टर हो ✗\n④ 통장 भनेको बैंक पासबुक हो ✓"}, {"n": "223", "q": "통장의 입출금 내역과 잔액 따위를 확인하기 위하여, 창구나 자동화 기기를 통해 기록을 정리하는 일입니다.", "options": ["잔액 조회", "계좌 이체", "통장 정리", "인터넷뱅킹"], "answer": 2, "explain": "प्रश्नको अर्थ: यो प्रश्नले बैंकको खातामा कति पैसा बाँकी छ भनेर हेर्न र कारोबारको विवरण अपडेट गर्ने कामलाई बुझाउँछ। यसलाई बैंकको मेसिन वा काउन्टरबाट गर्न सकिन्छ।\n① 잔액 조회 भनेको मौज्दात रकम हेर्नु हो ✗\n② 계좌 이체 भनेको खाताबाट पैसा स्थानान्तरण गर्नु हो ✗\n③ 통장 정리 भनेको पासबुक अपडेट वा स्टेटमेन्ट प्रिन्ट गर्नु हो ✓\n④ 인터넷뱅킹 भनेको अनलाइन बैंकिङ हो ✗"}, {"n": "224", "q": "개인이나 단체의 신분을 증명하거나 공식 문서에 사용하기 위해 이름 등을 새긴 도구입니다. 서명 대신 사용되며, 계약서나 신청서 등에 찍어 법적 효력을 가집니다.", "options": ["창구", "카드", "도장", "서명"], "answer": 2, "explain": "प्रश्नको अर्थ: यो प्रश्नले हस्ताक्षरको सट्टामा प्रयोग गरिने नाम खोपेको काठ वा रबरको चिनोलाई जनाउँछ। यो कागजातमा छाप लगाएर आधिकारिक बनाउन प्रयोग हुन्छ।\n① 창구 भनेको काउन्टर हो ✗\n② 카드 भनेको कार्ड हो ✗\n③ 도장 भनेको कागजातमा आधिकारिकताका लागि प्रयोग गरिने सहीछाप (सील/स्टाम्प) हो ✓\n④ 서명 भनेको हस्ताक्षर हो ✗"}, {"n": "225", "q": "순서를 정하기 위해 사용하는 표로, 번호를 부여해 차례대로 처리할 수 있게 도와줍니다. 병원, 은행, 관공서 등에서 대기 순서를 관리할 때 주로 사용됩니다.", "options": ["번호표", "신청서", "예금주", "영수증"], "answer": 0, "explain": "प्रश्नको अर्थ: यो प्रश्नले अस्पताल वा बैंकमा पालो कुर्दा प्रयोग गरिने नम्बर लेखिएको सानो कागजको टुक्रालाई जनाउँछ। यसले मानिसहरूलाई क्रमबद्ध रूपमा काम गर्न मद्दत गर्छ।\n① 번호표 भनेको पालो लिनका लागि दिइने नम्बर पर्ची (टोकन) हो ✓\n② 신청서 भनेको निवेदन फारम हो ✗\n③ 예금주 भनेको खातावाला हो ✗\n④ 영수증 भनेको बिल वा रसिद हो ✗"}, {"n": "226", "q": "개인의 신원을 증명하기 위해 발급되는 공식 문서입니다. 주민등록증, 운전면허증, 여권 등이 이에 해당하며, 본인 확인이 필요한 상황에서 사용됩니다.", "options": ["신청서", "신분증", "이력서", "보험증"], "answer": 1, "explain": "प्रश्नको अर्थ: यो प्रश्नले व्यक्तिको परिचय प्रमाणित गर्ने आधिकारिक कागजातलाई बुझाउँछ। यसले कसैको पहिचान पुष्टि गर्न मद्दत गर्दछ।\n① 신청서 भनेको आवेदन फारम हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 신분증 भनेको परिचय पत्र हो, जुन व्यक्तिको पहिचान प्रमाणित गर्न जारी गरिने आधिकारिक कागजात हो र यसले विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 이력서 भनेको बायोडाटा वा व्यक्तिगत विवरण हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 보험증 भनेको बीमा कार्ड हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "227", "q": "은행 계좌에서 현금을 인출하거나 잔액 조회, 송금 등의 업무를 할 수 있는 자동화된 기계입니다. 카드나 비밀번호를 이용해 24시간 이용할 수 있어 편리합니다.", "options": ["자동 판매기", "현금 인출기", "계좌 이체", "통"], "answer": 1, "explain": "प्रश्नको अर्थ: यो प्रश्नले बैंकको पैसा झिक्न र खाताको विवरण हेर्न प्रयोग हुने मेसिनलाई बुझाउँछ। यसले २४ घण्टा नै काम गर्न सक्छ।\n① 자동 판매기 भनेको भेंडिङ मेसिन (स्वचालित बिक्री गर्ने मेशिन) हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 현금 인출기 भनेको नगद झिक्ने मेशिन (एटिएम) हो, जसले बैंक खाताबाट नगद झिक्ने, ब्यालेन्स जाँच गर्ने जस्ता काम गर्छ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 계좌 이체 भनेको खाता स्थानान्तरण हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 통 भनेको भाँडो वा पिँडौं हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "228", "q": "한 나라의 돈을 다른 나라의 돈으로 바꾸는 과정입니다. 주로 해외 여행이나 국제 거래 시 필요하며, 은행이나 환전소에서 할 수 있습니다.", "options": ["환전", "입금", "출금", "송금"], "answer": 0, "explain": "प्रश्नको अर्थ: यो प्रश्नले एक देशको मुद्रालाई अर्को देशको मुद्रामा साट्ने कामलाई बुझाउँछ। यो विदेश जाँदा वा व्यापार गर्दा आवश्यक हुन्छ।\n① 환전 भनेको मुद्रा सटही (पैसा साट्ने काम) हो, जसले एक देशको पैसा अर्को देशको पैसामा साट्ने प्रक्रिया बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n② 입금 भनेको जम्मा गर्ने काम हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 출금 भनेको पैसा झिक्ने काम हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 송금 भनेको रेमिट्यान्स वा पैसा पठाउने काम हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "229", "q": "외국인 근로자들이 한국에서 일하며 겪는 어려움을 상담하고 지원하는 기관입니다. 체류, 생활, 법률 문제 등에 대한 정보와 모국어로 도움을 제공합니다.", "options": ["고용노동부", "외국인력상담센터", "다문화센터", "근로복지센터"], "answer": 1, "explain": "प्रश्नको अर्थ: यो प्रश्नले विदेशबाट आएका कामदारहरूलाई समस्या पर्दा सल्लाह र सहयोग गर्ने संस्थालाई बुझाउँछ। यसले विभिन्न भाषामा सहयोग प्रदान गर्दछ।\n① 고용노동부 भनेको श्रम तथा रोजगार मन्त्रालय हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 외국인력상담센터 भनेको विदेशी कामदार परामर्श केन्द्र हो, जसले वैदेशिक कामदारहरूको समस्या समाधान र सहयोग गर्छ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 다문화센터 भनेको बहुसांस्कृतिक केन्द्र हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 근로복지센터 भनेको श्रमिक कल्याण केन्द्र हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "230", "q": "어떤 사실이나 주장이 사실임을 입증할 수 있는 자료나 정보입니다. 예를 들어, 사건이 일어난 시간, 장소, 사람 등을 증명할 수 있는 물건 등이 이에 해당합니다.", "options": ["가해자", "피해자", "증인", "증거"], "answer": 3, "explain": "प्रश्नको अर्थ: यो प्रश्नले कुनै कुरा सत्य हो भनेर प्रमाणित गर्न प्रयोग हुने प्रमाण वा जानकारीलाई बुझाउँछ। यसले घटनाको वास्तविकता देखाउँछ।\n① 가해자 भनेको अरूलाई हानि पुऱ्याउने मानिस हो, त्यसैले यो होइन। ✗\n② 피해자 भनेको हानि वा चोट भोगेको पीडित मानिस हो, त्यसैले यो होइन। ✗\n③ 증인 भनेको घटना देख्ने साक्षी मानिस हो, त्यसैले यो होइन। ✗\n④ 증거 भनेको कुनै तथ्य वा घटना सत्य हो भनेर प्रमाणित गर्ने प्रमाण वा सामग्री हो, त्यसैले यो सही उत्तर हो। यो प्रश्नका विकल्पहरू किताबमा छापिएका छैनन्, शिक्षकले दिनुभएको हो। ✓"}, {"n": "231", "q": "공장이나 사무실 같은 물리적인 공간으로, 사람들이 일정한 작업이나 업무를 수행하는 장소를 말합니다.", "options": ["작업대", "작업장", "작업 관리", "작업 순서"], "answer": 1, "explain": "प्रश्नको अर्थ: मानिसहरूले काम गर्ने भौतिक ठाउँ वा कारखानालाई बुझाउँछ।\n① 작업대 भनेको काम गर्ने टेबल हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 작업장 भनेको कार्यस्थल वा काम गर्ने ठाउँ हो, जसले मानिसहरूले निश्चित काम गर्ने भौतिक ठाउँलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 작업 관리 भनेको कामको व्यवस्थापन हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 작업 순서 भनेको कामको क्रम हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "232", "q": "작업을 할 때 나무나 금속 조각과 같은 물건을 단단히 고정시켜 도구를 사용할 수 있는 테이블입니다.", "options": ["작업대", "서랍장", "손수레", "옷장"], "answer": 0, "explain": "प्रश्नको अर्थ: काम गर्दा सामानलाई बलियोसँग समात्न प्रयोग गरिने टेबुल हो।\n① 작업대 भनेको काम गर्ने टेबल (वर्कबेञ्च) हो, जसले काठ वा धातुका टुक्राहरूलाई कच्याककुचुक नगरी कडासँग अड्याएर औजार प्रयोग गर्न मिल्ने टेबल बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n② 서랍장 भनेको दराज हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 손수레 भनेको हाते ठेला हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 옷장 भनेको कपडा राख्ने दराज हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "233", "q": "물건이나 자재 등을 보관하기 위한 공간 또는 건물을 말하며 상품, 식료품, 기계 부품 등을 보관합니다.", "options": ["창고", "복도", "기숙사", "관리소"], "answer": 0, "explain": "प्रश्नको अर्थ: सामान वा सामग्रीहरू सुरक्षित राख्ने ठाउँ वा गोदामलाई बुझाउँछ।\n① 창고 भनेको सामान, खाद्यान्न वा पार्टपुर्जा भण्डार गर्ने गोदाम हो, त्यसैले यो विवरणसँग मिल्छ र सही उत्तर हो। ✓\n② 복도 भनेको हिँड्ने बाटो वा बरण्डा हो, सामान राख्ने ठाउँ होइन। ✗\n③ 기숙사 भनेको कामदारहरू बस्ने होस्टेल हो, सामान भण्डार गर्ने ठाउँ होइन। ✗\n④ 관리소 भनेको भवन वा क्षेत्रको हेरचाह गर्ने कार्यालय हो, सामान राख्ने गोदाम होइन। ✗"}, {"n": "234", "q": "어떤 일이나 업무를 맡아 책임지고 수행하는 사람을 말합니다. 고객 상담을 맡은 직원이나 창고 관리 책임자 등 이에 해당합니다.", "options": ["공장장", "담당자", "과장", "반장"], "answer": 1, "explain": "प्रश्नको अर्थ: कुनै जिम्मा लिएर काम पूरा गर्ने व्यक्तिलाई बुझाउँछ।\n① 공장장 भनेको कारखाना प्रमुख हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 담당자 भनेको जिम्मेवार व्यक्ति वा सम्पर्क व्यक्ति हो, जसले कुनै कामको जिम्मेवारी लिएर त्यसलाई पूरा गर्ने व्यक्तिलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 과장 भनेको विभाग प्रमुख (कावा) हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 반장 भनेको बान्जाङ (समूह नेता) हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "235", "q": "물체나 공간이 얼마나 따뜻하거나 차가운지를 나타내는 물리적인 양입니다. 섭씨(°C)나 화씨(°F) 단위로 측정하며, 열의 세기와 관련이 있습니다.", "options": ["날씨", "계절", "온도", "환경"], "answer": 2, "explain": "प्रश्नको अर्थ: कुनै ठाउँ वा वस्तु कति तातो वा चिसो छ भन्ने नाप्ने एकाइ हो।\n① 날씨 भनेको मौसम हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 계절 भनेको ऋतु हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 온도 भनेको तापक्रम हो, जसले बस्तु वा ठाउँ कति तातो वा चिसो छ भन्ने भौतिक मात्रालाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n④ 환경 भनेको वातावरण हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "236", "q": "한 나라나 지역의 경제에서 각 산업(농업, 제조업, 서비스업 등)이 차지하는 비중과 이들 사이의 상호 관계를 나타내는 개념입니다.", "options": ["산업 개발", "산업 경제", "산업 관리", "산업 구조"], "answer": 3, "explain": "प्रश्नको अर्थ: यो देशको अर्थतन्त्रमा विभिन्न उद्योगहरूको हिस्सा र तिनको आपसी सम्बन्ध बुझाउने कुरा हो।\n① 산업 개발 भनेको उद्योग विकास हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 산업 경제 भनेको औद्योगिक अर्थतन्त्र हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 산업 관리 भनेको उद्योग व्यवस्थापन हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 산업 구조 भनेको औद्योगिक संरचना हो, जसले देशको अर्थतन्त्रमा विभिन्न उद्योगहरूको हिस्सा र सम्बन्धलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। किताबमा दोस्रो विकल्प '산업 계제' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '산업 경제' हो। ✓"}, {"n": "237", "q": "전 세계가 정치, 경제, 사회, 문화 등 여러 측면에서 서로 밀접하게 연결되고 영향을 주고받는 현상을 말합니다.", "options": ["글로벌화", "산업화", "도시화", "온난화"], "answer": 0, "explain": "प्रश्नको अर्थ: यो शब्दले संसारभरका देशहरू राजनीति, अर्थतन्त्र र संस्कृतिमा एक आपससँग जोडिने अवस्थालाई जनाउँछ। यो एउटा आधुनिक विश्वको मुख्य विशेषता हो।\n① 글로벌화 भनेको विश्वव्यापीकरण (ग्लोबललाइजेसन) हो, जसले संसारभरका देशहरू राजनीति, अर्थतन्त्र र संस्कृतिमा जोडिने प्रक्रियालाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n② 산업화 भनेको औद्योगिकीकरण हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 도시화 भनेको सहरीकरण हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 온난화 भनेको तापक्रम वृद्धि (ग्लोबल वार्मिङ) हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "238", "q": "제품을 보호하기 위해 충격이나 진동을 흡수하고 분산시키는 역할을 하는 포장 재료입니다.", "options": ["라벨", "밀봉", "완충재", "테이프"], "answer": 2, "explain": "प्रश्नको अर्थ: यो सामानलाई चोट वा हल्चाइबाट जोगाउन र प्रभाव कम गर्न प्रयोग हुने प्याकेजिङ सामग्री हो।\n① 라벨 भनेको सामानको विवरण लेखिएको लेबल हो, धक्का सोस्ने सामग्री होइन। ✗\n② 밀봉 भनेको बाकस वा पोका हावा नछिर्ने गरी बन्द गर्ने काम हो, सामग्री होइन। ✗\n③ 완충재 भनेको सामान फुट्न वा बिग्रन नदिन धक्का र कम्पन सोस्ने प्याकिङ सामग्री हो ✓\n④ 테이프 भनेको बाकस टाँस्न प्रयोग गरिने टेप हो, धक्का सोस्ने सामग्री होइन। ✗"}, {"n": "239", "q": "금속 제품이 녹슬지 않도록 포장 처리가 된 종이로, 금속을 포장할 때 사용하는 특수 포장재입니다.", "options": ["완충재", "방청지", "절단기", "용접봉"], "answer": 1, "explain": "प्रश्नको अर्थ: यो फलामका सामानहरूमा खिया लाग्न नदिन प्रयोग गरिने विशेष प्रकारको कागज हो।\n① 완충재 भनेको बफर सामग्री हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 방청지 भनेको खिया प्रतिरोधी कागज हो, जसले धातुका उत्पादनहरूमा खिया लाग्न नदिन प्रयोग गरिने विशेष प्याकेजिङ कागजलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓\n③ 절단기 भनेको काट्ने मेशिन हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 용접봉 भनेको वेल्डिङ रड हो, जुन यस विवरणसँग मिल्दैन। ✗"}, {"n": "240", "q": "물품을 쌓아 올리고 지게차나 핸드리프트로 쉽게 운반할 수 있도록 만든 바닥용 받침대입니다. 물류 창고나 공장에서 상품을 운반할 때 사용되며, 나무, 플라스틱, 금속 등의 재질이 있습니다.", "options": ["대차", "일륜차", "트렉터", "파렛트"], "answer": 3, "explain": "प्रश्नको अर्थ: यो सामानहरू राखेर सजिलै बोक्न र सार्न मिल्ने काठ वा प्लास्टिकको चौटा हो।\n① 대차 भनेको ट्रली हो, जुन यस विवरणसँग मिल्दैन। ✗\n② 일륜차 भनेको एक चक्के ठेला (व्हीलबारो) हो, जुन यस विवरणसँग मिल्दैन। ✗\n③ 트렉터 भनेको ट्र्याक्टर हो, जुन यस विवरणसँग मिल्दैन। ✗\n④ 파렛트 भनेको प्यालेट (सामान राख्ने काठ वा प्लास्टिकको प्लेटर) हो, जसले सामानहरू थुपार्न र फोर्कलिफ्टले सजिलै ओसार्न मद्दत गर्ने भुईँको आधारलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। ✓"}, {"n": "241", "q": "앞부분에 포크형의 두 개 철판이 나와 있어 이것을 상하로 움직여 짐을 운반하거나 하역합니다.", "options": ["크레인", "콤바인", "화물차", "지게차"], "answer": 3, "explain": "प्रश्नको अर्थ: अगाडि दुइटा फलामको काँटा जस्तो भाग भएको र त्यसलाई माथि-तल गरेर सामान ओसार्न वा झार्न प्रयोग गरिने मेसिनको वर्णन गरिएको छ।\n① 크레인 भनेको ठूला र भारी सामानहरू माथि उचालेर टाढा लैजाने क्रेन हो ✗\n② 콤바인 भनेको धान वा गहुँ काट्ने र थ्रेसिंग गर्ने कृषि मेसिन हो ✗\n③ 화물차 भनेको सामान बोक्ने ट्रक हो ✗\n④ 지게차 भनेको अगाडि फोर्क जस्तो फलामको प्लेट भएको र त्यसलाई माथि तल सार्दै सामान बोक्ने वा अनलोड गर्ने फोर्कलिफ्ट हो ✓"}, {"n": "242", "q": "파렛트에 적재된 물품을 사람이 직접 밀거나 당겨서 운반할 수 있도록 만든 수동 운반 장비입니다. 지게차 없이 좁은 공간에서 물건을 옮길 때 주로 사용됩니다.", "options": ["핸드 파렛트", "핸드 카트", "일륜차", "손수레"], "answer": 0, "explain": "प्रश्नको अर्थ: मानिसले आफैं धकेलेर वा तानेर सामान राखिएको काठको फ्ल्याक वा सामान सानो ठाउँमा ओसार्न प्रयोग गर्ने हातले चलाउने उपकरणलाई जनाउँछ।\n① 핸드 파렛트 भनेको प्यालेटमा राखिएका सामानहरू मानिसले आफैँ ठेलेर वा तानेर लैजान सक्ने गरी बनाएको ह्यान्ड प्यालेट ट्रक हो ✓\n② 핸드 카트 भनेको सामान्य हातले गुडाउने कार्ट हो ✗\n③ 일륜차 भनेको एक पाङ्ग्रे ठेलागाडी हो ✗\n④ 손수레 भनेको हातले गुडाउने ठेलागाडी हो ✗"}, {"n": "243", "q": "물건을 싣고 이동시키기 위한 바퀴 달린 운반 장비로, 주로 공장, 창고, 물류 현장에서 사용됩니다. 무거운 짐을 실어 나를 때 사용하는 평평한 판 위에 바퀴가 달린 운반 수레입니다.", "options": ["대차", "트렉터", "파렛트", "지게차"], "answer": 0, "explain": "प्रश्नको अर्थ: कारखाना वा गोदाममा गहु्रङ्गो सामान राखेर गुडाउन सजिलो होस् भनी मुनि पाङ्ग्रा राखिएको तेर्सो सम्म परेको सामान ओसार्ने साधनको बारेमा भनिएको छ।\n① 대차 भनेको सामान बोकेर लैजान पाङ्ग्रा भएको समथल प्लेट वा ट्रली हो ✓\n② 트렉터 भनेको ट्र्याक्टर हो ✗\n③ 파렛트 भनेको सामान राख्ने प्यालेट हो ✗\n④ 지게차 भनेको फोर्कलिफ्ट हो ✗"}, {"n": "244", "q": "다른 나라로부터 상품이나 기술 따위를 국내로 사들이는 절차를 말합니다.", "options": ["수출", "무역", "수입", "소득"], "answer": 2, "explain": "प्रश्नको अर्थ: विदेशबाट सामान वा प्रविधि आफ्नो देशभित्र किनेर ल्याउने व्यापारिक प्रक्रियालाई बुझाउँछ।\n① 수출 भनेको विदेशमा सामान पठाउनु वा निर्यात गर्नु हो ✗\n② 무역 भनेको दुई देशबीच सामान किनबेच गर्नु वा व्यापार गर्नु हो ✗\n③ 수입 भनेको विदेशबाट सामान वा प्रविधि देश भित्र भित्र्याउनु वा आयात गर्नु हो ✓\n④ 소득 भनेको आम्दानी हो ✗"}, {"n": "245", "q": "자연에서 인간의 노력 없이 얻을 수 있는 자원으로, 산업과 생활에 활용되는 물, 공기, 석유, 석탄, 산림, 광물 같은 자원입니다.", "options": ["수자원", "문화유산", "천연자원", "산림 재산"], "answer": 2, "explain": "प्रश्नको अर्थ: मानिसको प्रयास बिना प्रकृतिबाटै पाइने र जीवन तथा उद्योगमा प्रयोग हुने पानी, हावा, तेल, खनिज जस्ता वस्तुहरूलाई जनाउँछ।\n① 수자원 भनेको पानीका स्रोतहरू हुन् ✗\n② 문화유산 भनेको सांस्कृतिक सम्पदा हो ✗\n③ 천연자원 भनेको प्रकृतिबाट मानिसको प्रयास बिना प्राप्त हुने पानी, हावा, खनिज जस्ता प्राकृतिक स्रोतहरू हुन् ✓\n④ 산림 재산 भनेको वनसम्बन्धी सम्पत्ति हो ✗"}, {"n": "246", "q": "국가 간에 상품이나 서비스를 사고파는 경제 활동을 말합니다. 예를 들어 한국이 외국에 자동차를 수출하고, 밀이나 석유를 수입하는 것입니다.", "options": ["소득", "무역", "임금", "재산"], "answer": 1, "explain": "प्रश्नको अर्थ: विभिन्न देशहरूबीच सामान वा सेवा खरिद र बिक्री गर्ने आर्थिक कार्यको वर्णन गरिएको छ।\n① 소득 भनेको आम्दानी हो ✗\n② 무역 भनेको देशहरूबीच सामान वा सेवाहरूको किनबेच गर्ने आर्थिक गतिविधि वा व्यापार हो ✓\n③ 임금 भनेको ज्याला वा तलब हो ✗\n④ 재산 भनेको सम्पत्ति हो ✗"}, {"n": "247", "q": "한 나라가 자국의 상품이나 서비스를 다른 나라에 보내어 판매하는 경제 활동입니다.", "options": ["비용", "수입", "수출", "세금"], "answer": 2, "explain": "प्रश्नको अर्थ: आफ्नो देशमा बनेका सामान वा सेवाहरू विदेशी बजारमा लगेर बेच्ने कार्यको बारेमा बताइएको छ।\n① 비용 भनेको खर्च हो ✗\n② 수입 भनेको आयात हो ✗\n③ 수출 भनेको आफ्नो देशको सामान वा सेवा अर्को देशमा पठाएर बिक्री गर्ने आर्थिक गतिविधि वा निर्यात हो ✓\n④ 세금 भनेको कर हो ✗"}, {"n": "248", "q": "지하에서 뽑아낸 정제되지 않은 천연 상태의 기름으로, 석유 제품의 원료가 됩니다. 휘발유, 경유, 플라스틱 등을 만드는 데 사용됩니다.", "options": ["원유", "재료", "장비", "전기"], "answer": 0, "explain": "प्रश्नको अर्थ: जमिनमुनिबाट निकालिएको प्राकृतिक तेल जसलाई प्रशोधन गरेर पेट्रोल, डिजेल वा प्लास्टिक बनाउन कच्चा पदार्थको रूपमा प्रयोग गरिन्छ।\n① 원유 भनेको जमिनमुनिबाट निकालिएको प्रशोधन नगरिएको प्राकृतिक तेल वा कच्चा तेल हो ✓\n② 재료 भनेको सामग्री हो ✗\n③ 장비 भनेको उपकरण हो ✗\n④ 전기 भनेको बिजुली हो ✗"}, {"n": "249", "q": "기계, 장비, 차량 등에서 부품이나 장치를 설치하거나 부착하는 과정을 의미합니다. 이 과정은 부품이 원활히 작동하도록 연결하거나 고정하는 중요한 작업입니다.", "options": ["작동", "관리", "재고", "장착"], "answer": 3, "explain": "प्रश्नको अर्थ: मेसिन, गाडी वा उपकरणहरूमा कुनै भाग वा सामान सही ठाउँमा जोड्ने र अड्याउने कामलाई जनाउँछ।\n① 작동 भनेको मेसिन चल्नु वा सञ्चालन हुनु हो ✗\n② 관리 भनेको व्यवस्थापन वा रेखदेख गर्नु हो ✗\n③ 재고 भनेको बाँकी सामान वा स्टक हो ✗\n④ 장착 भनेको मेसिन वा सवारी साधनमा पार्टपुर्जा वा यन्त्र जडान गर्नु वा फिट गर्नु हो ✓"}, {"n": "250", "q": "어떤 기계나 구조물을 분해하거나 분리하는 과정을 말합니다. 이는 부품을 하나씩 나누거나, 원래의 형태에서 분해하는 작업을 포함합니다.", "options": ["용접", "절단", "해체", "회전"], "answer": 2, "explain": "प्रश्नको अर्थ: कुनै मेसिन वा संरचनाका भागहरूलाई छुट्ट्याएर अलग-अलग पार्ने वा फुकाल्ने कामको वर्णन गरिएको छ।\n① 용접 भनेको वेल्डिङ गर्ने काम हो, त्यसैले यो मेसिन वा संरचना फुकाल्नेसँग मिल्दैन। ✗\n② 절단 भनेको सामान काट्ने काम हो, त्यसैले यो विवरणसँग मेल खाँदैन। ✗\n③ 해체 भनेको खोलकल गर्ने वा विघटन गर्ने काम हो, जसले विवरणमा भनिए झैँ मेसिन वा संरचनाका भागहरू छुट्याउने कामलाई बुझाउँछ। ✓\n④ 회전 भनेको घुम्ने वा घुमाउने कार्य हो, त्यसैले यो खोलकल गर्नेसँग मिल्दैन। ✗"}, {"n": "251", "q": "본래 있어야 할 물질과 다른 물질이 섞여 있는 상태를 말합니다. 주로 원하지 않거나 불필요한 물질을 지칭합니다.", "options": ["재질", "수물질", "이물질", "화학물질"], "answer": 2, "explain": "प्रश्नको अर्थ: कुनै शुद्ध वस्तुमा मिसिएको अनावश्यक वा नचाहिने बाहिरी पदार्थलाई जनाउँछ।\n① 재질 भनेको सामानको किसिम वा गुण हो, त्यसैले यो बाहिरबाट मिसिने नचाहिने वस्तु होइन। ✗\n② 수물질 भनेको पानीजन्य वा असम्बन्धित शब्द हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 이물질 भनेको नचाहिने बाहिरी पदार्थ हो, जसले सक्कली वस्तुमा अर्कै नचाहिने चीज मिसिएको अवस्थालाई बुझाउँछ। ✓\n④ 화학물질 भनेको रासायनिक पदार्थ हो, त्यसैले यो नचाहिने तत्त्व मिसिएको विवरणसँग मिल्दैन। दोस्रो विकल्प '수물질' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "252", "q": "실내의 탁한 공기를 밖으로 내보내고 신선한 공기를 들여오는 기계 장치입니다. 욕실, 주방, 공장 등에서 공기 순환과 환기를 위해 사용됩니다.", "options": ["환풍기", "선풍기", "에어컨", "온돌"], "answer": 0, "explain": "प्रश्नको अर्थ: कोठा, भान्सा वा कारखानाभित्रको नराम्रो वा फोहर हावा बाहिर फालेर ताजा हावा भित्र ल्याउने उपकरणको बारेमा भनिएको छ।\n① 환풍기 भनेको कोठाको फोहोर हावा बाहिर फालेर ताजा हावा भित्र ल्याउने भेन्टिलेटर वा एक्जस्ट फ्यान हो ✓\n② 선풍기 भनेको पङ्खा (बिजुलीको पंखा) हो ✗\n③ 에어컨 भनेको एयर कन्डिसनर हो ✗\n④ 온돌 भनेको कोरियाली तातो भुइँ प्रणाली हो ✗"}, {"n": "253", "q": "회전하는 절삭공구에 가공물을 이송하여 원하는 형상으로 가공하는 공작 기계로 특히 가공물을 절단하고 깎을 때 사용합니다.", "options": ["선반 기계", "밀링 기계", "용접 기계", "프레스 기계"], "answer": 1, "explain": "प्रश्नको अर्थ: घुम्ने औजारको मद्दतले धातु वा वस्तुलाई काटेर वा तासेर चाहेको आकार बनाउन प्रयोग गरिने मेसिनको वर्णन गरिएको छ।\n① 선반 기계 भनेको लेथ मेसिन हो जसले धातु वा काठलाई घुमाएर काट्छ ✗\n② 밀링 기계 भनेको घुम्ने कटरको माध्यमबाट वर्कपिसलाई काटेर, कुँदेर वा सेप दिने मिलिङ मेसिन हो ✓\n③ 용접 기계 भनेको वेल्डिङ मेसिन हो ✗\n④ 프레스 기계 भनेको प्रेस मेसिन हो ✗"}, {"n": "254", "q": "금속, 나무, 돌 따위를 회전시켜서 갈거나 파내거나 도려내는 데 쓰는 공작 기계입니다.", "options": ["밀링 기계", "밴딩 기계", "선반 기계", "용접 기계"], "answer": 2, "explain": "प्रश्नको अर्थ: धातु, काठ वा ढुंगालाई घुमाएर तास्न, खोप्न वा गोलो आकार दिन प्रयोग गरिने औजार मेसिनको बारेमा भनिएको हो।\n① 밀링 기계 भनेको मिलिङ मेसिन हो ✗\n② 밴딩 기계 भनेको बेन्डिङ मेसिन हो ✗\n③ 선반 기계 भनेको धातु, काठ वा ढुङ्गालाई घुमाएर छिलेर, खोपेर वा काटेर आकार निकाल्ने लेथ मेसिन हो ✓\n④ 용접 기계 भनेको वेल्डिङ मेसिन हो ✗"}, {"n": "255", "q": "두 개 이상의 금속 물체나 재료를 열로 녹여서 접합시키는 기계입니다.", "options": ["밀링 기계", "용접 기계", "선반 기계", "프레스 기계"], "answer": 1, "explain": "प्रश्नको अर्थ: दुई वा सोभन्दा बढी फलाम वा धातुका टुक्राहरूलाई तापले पगालेर आपसमा जोड्न प्रयोग गरिने मेसिनलाई जनाउँछ।\n① 밀링 기계 भनेको मिलिङ मेसिन हो ✗\n② 용접 기계 भनेको दुई वा दुईभन्दा बढी धातुका वस्तु वा सामग्रीहरूलाई तापको सहायताले पगालेर जोड्ने वेल्डिङ मेसिन हो ✓\n③ 선반 기계 भनेको लेथ मेसिन हो ✗\n④ 프레스 기계 भनेको प्रेस मेसिन हो ✗"}, {"n": "256", "q": "붙이는 작업을 할 때 아주 뜨거운 불꽃이 튈 수 있어서 다치지 않도록 조심해서 일해야 하는 기계입니다.", "options": ["선반기계", "프레스기계", "밀링기계", "전기용접기"], "answer": 3, "explain": "प्रश्नको अर्थ: धातु जोड्ने काम गर्दा तातो झिल्काहरू निस्कने भएकाले सुरक्षाको ध्यान दिएर चलाउनुपर्ने विद्युतीय मेसिनको वर्णन गरिएको छ।\n① 선반기계 भनेको धातुलाई घुमाएर काट्ने मेसिन हो ✗\n② 프레스기계 भनेको धातुमा दबाब दिने मेसिन हो ✗\n③ 밀링기계 भनेको मिलिङ गर्ने मेसिन हो ✗\n④ 전기용접기 भनेको बिजुलीको आगोले धातु जोड्ने मेसिन हो जसमा आगोको फुल्लिङ उड्न सक्छ ✓"}, {"n": "257", "q": "금속이나 기타 재료에 큰 압력을 가해 절단, 성형, 구멍 뚫기 등의 작업을 수행하는 산업용 기계입니다.", "options": ["선반기계", "프레스기계", "밀링기계", "전기용접기"], "answer": 1, "explain": "प्रश्नको अर्थ: धातु वा अन्य वस्तुमा ठूलो दबाब दिएर थिची काट्न, आकार दिन वा दुलो पार्न प्रयोग गरिने औद्योगिक मेसिनको बारेमा भनिएको छ।\n१. 프레스기계 भनेको धातु वा अन्य सामग्रीमा ठूलो दबाब दिएर काट्ने, आकार दिने वा प्वाल पार्ने काम गर्ने औद्योगिक मेसिन हो, त्यसैले यो सही उत्तर हो। २. 선반기계 भनेको लाथ मेसिन हो, त्यसैले यो मिल्दैन। ३. 밀링기계 भनेको मिलिङ मेसिन हो, त्यसैले यो मिल्दैन। ४. 전기용접기 भनेको विद्युतीय वेल्डिङ गर्ने मेसिन हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको २ नम्बरको 프레스기계 (प्र्रेस मेसिन) हो।"}, {"n": "258", "q": "금속, 목재, 플라스틱 등의 재료에 구멍을 뚫기 위해 사용하는 기계입니다. 제조업이나 건설 현장에서 정확한 위치에 구멍을 뚫을 때 사용됩니다.", "options": ["에어컴프레서", "드릴링머신", "절단기", "전동커터기"], "answer": 1, "explain": "प्रश्नको अर्थ: काठ, फलाम वा प्लास्टिक जस्ता वस्तुमा सही ठाउँमा दुलो पार्न वा प्वाल बनाउन प्रयोग गरिने उपकरणको बारेमा बताइएको छ।\n① 에어컴프레서 भनेको हावा कम्प्रेस गर्ने मेसिन हो ✗\n② 드릴링머신 भनेको धातु, काठ वा प्लास्टिक जस्ता सामग्रीहरूमा प्वाल पार्न प्रयोग गरिने मेसिन हो ✓\n③ 절단기 भनेको काट्ने मेसिन हो ✗\n④ 전동커터기 भनेको विद्युतीय कटर हो ✗"}, {"n": "259", "q": "전기를 동력으로 사용하여 금속, 나무, 플라스틱 등의 재료를 빠르고 정밀하게 절단하는 전동 공구입니다.", "options": ["가전제품", "에어컴프레서", "전동커터기", "전기용접기"], "answer": 2, "explain": "प्रश्नको अर्थ: बिजुलीबाट चलेर फलाम, काठ वा प्लास्टिक जस्ता सामानहरू छिटो र सफासँग काट्न प्रयोग गरिने विद्युतीय औजारलाई जनाउँछ।\n① 가전제품 भनेको घरायसी विद्युतीय उपकरण हो ✗\n② 에어컴프레서 भनेको हावा कम्प्रेस गर्ने मेसिन हो ✗\n③ 전동커터기 भनेको बिजुली प्रयोग गरेर धातु, काठ र प्लास्टिकलाई छिटो र सटिक रूपमा काट्ने विद्युतीय औजार हो ✓\n④ 전기용접기 भनेको वेल्डिङ गर्ने मेसिन हो ✗"}, {"n": "260", "q": "일상생활이나 작업 현장에서 사용하고 더 이상 필요하지 않게 된 물질을 말합니다.", "options": ["재활용품", "일회용품", "독성물질", "폐기물"], "answer": 3, "explain": "प्रश्नको अर्थ: दैनिक जीवन वा कार्यक्षेत्रमा प्रयोग गरिसकेपछि अब प्रयोगमा नआउने वा फ्याँक्नुपर्ने काम नलाग्ने वस्तुलाई जनाउँछ।\n① 재활용품 भनेको पुन: प्रयोग गर्ने वस्तु हो ✗\n② 일회용품 भनेको एक पटक प्रयोग गर्ने वस्तु हो ✗\n③ 독성물질 भनेको विषालु पदार्थ हो ✗\n④ 폐기물 भनेको दैनिक जीवन वा काम गर्ने ठाउँमा प्रयोग भएर अब थप आवश्यक नभएको पदार्थ वा फोहरलाई जनाउँछ, त्यसैले यो सही उत्तर हो। किताबमा तेस्रो विकल्प '독석물질' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '독성물질' हो। ✓"}, {"n": "261", "q": "상품이나 서비스를 구매하여 사용하는 사람을 말합니다. 예를 들어 마트에서 물건을 사는 사람이나, 인터넷에서 서비스를 이용하는 사람 모두 이에 해당합니다.", "options": ["학생", "참가자", "소비자", "청년자"], "answer": 2, "explain": "प्रश्नको अर्थ: सामान वा सेवा किनेर प्रयोग गर्ने मानिसलाई बुझाउँछ। जस्तै पसल वा इन्टरनेटबाट सामान किन्ने व्यक्ति यसमा पर्छन्।\n① 학생 भनेको विद्यार्थी हो ✗\n② 참가자 भनेको सहभागी हो ✗\n③ 소비자 भनेको सामान वा सेवा खरिद गरेर प्रयोग गर्ने व्यक्ति हो ✓\n④ 청년자 भनेको युवा भन्ने अर्थ नभएको गलत शब्द हो, त्यसैले यो मिल्दैन। चौथो विकल्प '청년자' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "262", "q": "인터넷을 통해 다양한 사물이 서로 연결되어 정보를 주고받을 수 있는 기술입니다. 이를 통해 집, 자동차, 전자 기기 등을 스마트하게 관리할 수 있습니다.", "options": ["사물인터넷", "인터넷쇼핑", "인터넷 전화", "인터넷 광고"], "answer": 0, "explain": "प्रश्नको अर्थ: इन्टरनेटको माध्यमबाट धेरै वस्तुहरू एकआपसमा जोडिएर जानकारी आदानप्रदान गर्ने प्रविधि हो। यसले घर वा गाडीलाई सजिलै नियन्त्रण गर्न सकिन्छ।\n① 사물인터넷 भनेको वस्तुहरूको इन्टरनेट प्रविधि हो, जसले सामानहरू आपसमा जोडिएर जानकारी आदानप्रदान गर्न र उपकरणहरूलाई स्मार्ट तरिकाले सञ्चालन गर्न मद्दत गर्छ। ✓\n② 인터넷쇼핑 भनेको इन्टरनेटबाट सामान किन्ने काम हो, त्यसैले यो उपकरणहरू जोड्ने प्रविधिसँग मिल्दैन। ✗\n③ 인터넷 전화 भनेको इन्टरनेट फोन हो, त्यसैले यो सम्पूर्ण सामान व्यवस्थापन गर्ने प्रविधिसँग मिल्दैन। ✗\n④ 인터넷 광고 भनेको इन्टरनेट विज्ञापन हो, त्यसैले यो विवरणसँग मेल खाँदैन। ✗"}, {"n": "263", "q": "개인의 취향이나 필요에 따라 특별히 맞춤 제작된 제품이나 서비스를 뜻합니다. 특히 가구나 가전제품은 사용자가 원하는 색상, 기능, 디자인 등을 선택해 자신만의 스타일로 구성할 수 있습니다.", "options": ["비스보크", "전자제품", "키오스크", "무인점"], "answer": 0, "explain": "प्रश्नको अर्थ: मानिसको चाहना वा आवश्यकता अनुसार खास रूपमा बनाइएका सामान वा सेवालाई जनाउँछ। प्रयोगकर्ताले आफूलाई चाहिने रङ र डिजाइन रोज्न सक्छन्।\n① 비스보크 भनेको व्यक्तिको रुचि वा आवश्यकता अनुसार विशेष रूपमा बनाइएको उत्पादन वा सेवा हो ✓\n② 전자제품 भनेको इलेक्ट्रोनिक्स सामान हो ✗\n③ 키오스크 भनेको किओस्क (स्वयंसेवा मेसिन) हो ✗\n④ 무인점 भनेको मानिस नभएको पसल हो ✗"}, {"n": "264", "q": "여러 개의 부품이나 요소를 정해진 순서와 방식에 따라 결합하여 하나의 완성된 구조물이나 제품으로 만드는 과정입니다.", "options": ["조립", "접합", "용접", "계량, 재다"], "answer": 0, "explain": "प्रश्नको अर्थ: धेरै वटा साना पाटपुर्जाहरूलाई क्रमबद्ध रूपमा जोडेर एउटा पूर्ण सामान वा संरचना बनाउने कामलाई बुझाउँछ।\n① 조립 भनेको धेरै वटा पार्टपुर्जा वा तत्वहरूलाई तोकिएको क्रम र तरिका अनुसार जोडेर एउटा पूर्ण संरचना वा उत्पादन बनाउने प्रक्रिया हो ✓\n② 접합 भनेको जोड्ने काम हो ✗\n③ 용접 भनेको वेल्डिङ गर्ने काम हो ✗\n④ 계량, 재다 भनेको नाप्ने काम हो, त्यसैले यो मिल्दैन। चौथो विकल्प '계량, 재다' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "265", "q": "철선을 끊거나 구부릴 때 사용하는 두 개의 손잡이가 있는 작은 수공구입니다.", "options": ["망치", "스페너", "펜치", "바이스"], "answer": 2, "explain": "प्रश्नको अर्थ: तार काट्न वा बंग्याउन प्रयोग गरिने दुईवटा समात्ने ठाउँ भएको सानो हातहतियार हो।\n① 망치 भनेको हथौडा हो ✗\n② 스페너 भनेको स्प्यानर हो ✗\n③ 펜치 भनेको फलामको तार काट्न वा बांग्याउन प्रयोग गरिने दुई वटा ह्यान्डल भएको सानो हाते औजार हो ✓\n④ 바이스 भनेको भाइस (पकड्ने औजार) हो ✗"}, {"n": "266", "q": "전선이나 작은 부품을 자를 때 사용하는 절단용 수공구로 손잡이가 달린 집게 형태에 있습니다.", "options": ["망치", "니퍼", "펜치", "바이스"], "answer": 1, "explain": "प्रश्नको अर्थ: बिजुलीको तार वा साना भागहरू काट्नका लागि प्रयोग गरिने समात्ने पिलास जस्तै हातले चलाउने औजार हो।\n① 망치 भनेको हथौडा हो ✗\n② 니퍼 भनेको तार वा साना पार्टपुर्जा काट्न प्रयोग गरिने काट्ने हाते औजार हो जुन ह्यान्डल भएको चिम्टीको आकारमा हुन्छ ✓\n③ 펜치 भनेको पिनर हो ✗\n④ 바이스 भनेको भाइस हो ✗"}, {"n": "267", "q": "너트와 볼트를 잡고 조이거나 풀 때 사용하는 특수 모양의 끝이 있는 금속 공구입니다.", "options": ["스패너", "니퍼", "바이스", "펜치"], "answer": 0, "explain": "प्रश्नको अर्थ: नट र बोल्टलाई समातेर कस्न वा फुकाउन प्रयोग गरिने विशेष आकारको धातुको औजार हो।\n① 스패너 भनेको नट र बोल्टलाई समातेर कस्न वा खोल्न प्रयोग गरिने विशेष आकारको मुख भएको धातुको औजार हो ✓\n② 니퍼 भनेको निप्पर हो ✗\n③ 바이스 भनेको भाइस हो ✗\n④ 펜치 भनेको पिनर हो ✗"}, {"n": "268", "q": "금속이나 전선을 잡아서 구부리거나 펼 때 사용하는 수공구입니다. 보통 집게처럼 생기며, 전기 작업이나 정비 작업에 자주 쓰입니다.", "options": ["바이스", "나사못", "멍키렌치", "플라이어"], "answer": 3, "explain": "प्रश्नको अर्थ: धातु वा तारलाई समातेर बंग्याउन वा सीधा बनाउन प्रयोग गरिने औजार हो। यो बिजुली र मर्मतको काममा धेरै प्रयोग हुन्छ।\n① 바이스 भनेको भाइस हो ✗\n② 나사못 भनेको स्क्रू हो ✗\n③ 멍키렌치 भनेको मङ्की रेन्च हो ✗\n④ 플라이어 भनेको धातु वा तारलाई समातेर बांग्याउन वा फैलाउन प्रयोग गरिने हाते औजार हो ✓"}, {"n": "269", "q": "너트나 볼트 크기에 맞게 입 크기를 조절할 수 있는 렌치입니다. 다양한 크기의 부품을 하나의 도구로 조일 수 있어 매우 실용적입니다.", "options": ["바이스", "토크 렌치", "멍키렌치", "플라이어"], "answer": 2, "explain": "प्रश्नको अर्थ: नट वा बोल्टको आकार अनुसार समात्ने भागलाई सानो-ठूलो बनाउन सकिने औजार हो। विभिन्न आकारका सामान कस्न यो निकै उपयोगी हुन्छ।\n① 바이스 भनेको भाइस हो ✗\n② 토크 렌치 भनेको टर्क रेन्च हो ✗\n③ 멍키렌치 भनेको नट वा बोल्टको साइज अनुसार मुखको आकार समायोजन गर्न सकिने रेन्च हो ✓\n④ 플라이어 भनेको प्लायर्स हो ✗"}, {"n": "270", "q": "볼트나 너트를 정해진 힘으로 조일 때 사용하는 공구입니다. 길쭉한 손잡이에 눈금이나 디지털 표시가 있으며, 설정한 토크에 도달하면 '딸깍' 소리가 납니다.", "options": ["용접봉", "나사못", "유각 렌치", "토크 렌치"], "answer": 3, "explain": "प्रश्नको अर्थ: बोल्ट वा नटलाई तोकिएको निश्चित बलले कस्न प्रयोग गरिने औजार हो। यसमा मिलाएको तागत पुगेपछि आवाज आउँछ।\n① 용접봉 भनेको वेल्डिंग रड हो ✗\n② 나사못 भनेको स्क्रू हो ✗\n③ 유각 렌치 भनेको हेक्स रेन्च हो ✗\n④ 토크 렌치 भनेको बोल्ट वा नटलाई तोकिएको शक्ति (बल) ले कस्न प्रयोग गरिने औजार हो ✓"}, {"n": "271", "q": "볼트나 나사를 돌릴 때 사용하는 L 자 모양의 공구입니다. 작고 간단한 구조로 기계 조립이나 가구 조립에 자주 쓰입니다.", "options": ["전기 드릴", "판금 가위", "유각 렌치", "파이프 렌치"], "answer": 2, "explain": "प्रश्नको अर्थ: यो बोल्ट र पेच घुमाउनका लागि प्रयोग गरिने सानो औजार हो। मेसिन तथा फर्निचरका सामानहरू जोड्ने काममा यसको धेरै प्रयोग हुन्छ।\n① 전기 드릴 भनेको बिजुलीबाट चल्ने प्वाल पार्ने औजार हो, त्यसैले यो एल-आकारको औजार होइन। ✗\n② 판금 가위 भनेको पाता काट्ने कैँची हो, त्यसैले यो नट-बोल्ट घुमाउने औजार होइन। ✗\n③ 유각 렌치 भनेको एल-आकारको हेक्स रेन्च हो, जुन नट वा स्क्रू घुमाउन र फर्निचर वा मेसिन जोड्न प्रयोग गरिन्छ। ✓\n④ 파이프 렌치 भनेको पाइप समात्ने र घुमाउने रेन्च हो, त्यसैले यो एल-आकारको सानो औजार होइन। ✗"}, {"n": "272", "q": "점이 없는 나사 모양의 금속 물체로 너트를 사용하여 물건을 고정 시킵니다.", "options": ["볼트", "줄", "비트", "못"], "answer": 0, "explain": "प्रश्नको अर्थ: तिखो टुप्पो नभएको पेच जस्तै धातुको वस्तु हो, जसलाई नटसँग जोडेर सामानलाई बलियो गरी अड्काइन्छ।\n① 볼트 भनेको टाउकोमा बिन्दु नभएको र नटसँग प्रयोग हुने धातुको वस्तु हो ✓\n② 줄 भनेको फाइल (घोट्ने औजार) हो ✗\n③ 비트 भनेको ड्रिलको बिट हो ✗\n④ 못 भनेको किला हो ✗"}, {"n": "273", "q": "머리에는 드라이버로 돌릴 수 있도록 홈이 나 있는 못입니다. 보통 목재나 얇은 금속류 등을 접합시킬 때 사용합니다.", "options": ["용접봉", "나사못", "절곡기", "바이스"], "answer": 1, "explain": "प्रश्नको अर्थ: टाउकोमा पेचकसले घुमाउन मिल्ने धर्का भएको काँटी हो। काठ वा पातलो धातुलाई आपसमा जोड्न यसको प्रयोग गरिन्छ।\n① 용접봉 भनेको वेल्डिंग रड हो ✗\n② 나사못 भनेको स्क्रू नट (स्लाट भएको काठ वा धातुमा कस्ने किला) हो ✓\n③ 절곡기 भनेको पाता वा पाना झुकाउने मेसिन हो ✗\n④ 바이스 भनेको भाइस (पकड्ने औजार) हो ✗"}, {"n": "274", "q": "볼트와 함께 사용되어 부품을 단단히 고정하는 데 쓰입니다. 보통 금속으로 된 육각형 모양이며, 내부에 나사산이 있습니다.", "options": ["토치", "너트", "볼트", "리머"], "answer": 1, "explain": "प्रश्नको अर्थ: बोल्टसँगै प्रयोग गरेर सामानहरूलाई कस्ने धातुको वस्तु हो। यो प्रायः छ वटा पाना भएको आकारको हुन्छ र भित्र धर्काहरू हुन्छन्।\n① 토치 भनेको टर्च (वेल्डिंग वा तताउने औजार) हो ✗\n② 너트 भनेको बोल्टसँग प्रयोग हुने छकुने भाग भएको नट हो ✓\n③ 볼트 भनेको बोल्ट हो ✗\n④ 리머 भनेको प्वाल सफा गर्ने वा बढाउने औजार रीमर हो ✗"}, {"n": "275", "q": "나사를 조이거나 풀 때 사용하는 수공구입니다. 끝의 모양은 평평하고 마이너스 기호처럼 생기며, 손잡이가 달려 있습니다.", "options": ["일자 드라이버", "십자 드라이버", "금긋기 바늘", "전자 저울"], "answer": 0, "explain": "प्रश्नको अर्थ: पेचहरू कस्न वा फुकाउन प्रयोग गरिने हात औजार हो। यसको टुप्पो च्याप्टो र माइनस चिन्ह जस्तो आकारको हुन्छ।\n① 일자 드라이버 भनेको माइनस (-) चिन्ह जस्तो चप्टो मुख भएको स्क्रू ड्राइभर हो ✓\n② 십자 드라이버 भनेको प्लस (+) चिन्ह जस्तो मुख भएको स्क्रू ड्राइभर हो ✗\n③ 금긋기 바늘 भनेको रेखा कोर्ने सुई हो ✗\n④ 전자 저울 भनेको इलेक्ट्रोनिक तराजु हो ✗"}, {"n": "276", "q": "나사를 조이거나 풀 때 사용하는 공구입니다. 끝이 +자 형태이며, 손잡이가 달린 막대 모양입니다.", "options": ["일자 드라이버", "십자 드라이버", "배식대", "방청지"], "answer": 1, "explain": "प्रश्नको अर्थ: पेचहरू घुमाएर कस्न वा फुकाउन प्रयोग गरिने औजार हो। यसको टुप्पो प्लस चिन्ह जस्तो चारकुने आकारको हुन्छ।\n① 일자 드라이버 भनेको माइनस मुख भएको स्क्रू ड्राइभर हो ✗\n② 십자 드라이버 भनेको प्लस (+) आकारको मुख भएको स्क्रू ड्राइभर हो ✓\n③ 배식대 भनेको खाना वितरण गर्ने टेबल हो ✗\n④ 방청지 भनेको खिया लाग्नबाट बचाउने कागज हो ✗"}, {"n": "277", "q": "회전하는 부품이 매끄럽게 움직이도록 도와주는 부품입니다. 보통 둥근 링 안에 작은 강철 볼이 들어 있는 원형 모양입니다.", "options": ["바이스", "베어링", "수준기", "플라이어"], "answer": 1, "explain": "प्रश्नको अर्थ: घुम्ने पाटपुर्जाहरूलाई चिल्लो र सजिलैसँग घुम्न मद्दत गर्ने भाग हो। यसको गोलो रिङभित्र साना फलामका डल्लाहरू हुन्छन्।\n① 바이스 भनेको च्याप्प समात्ने भाइस औजार हो ✗\n② 베어링 भनेको घुम्ने भागहरू सहजै चल्न मद्दत गर्ने बियरिङ हो ✓\n③ 수준기 भनेको स्पिरिट लेभल (तेर्सो जाँच्ने औजार) हो ✗\n④ 플라이어 भनेको प्लायर्स हो ✗"}, {"n": "278", "q": "회전력을 전달하거나 속도와 방향을 조절할 때 사용하는 부품입니다. 테두리에 톱니가 있는 둥근 모양입니다.", "options": ["줄", "톱", "기어", "축"], "answer": 2, "explain": "प्रश्नको अर्थ: घुम्ने शक्तिलाई अरू ठाउँमा पठाउन वा गति मिलाउन प्रयोग गरिने भाग हो। यसको वरिपरि ससाना दाँतहरू हुन्छन्।\n① 줄 भनेको फाइल (घोट्ने औजार) हो ✗\n② 톱 भनेको आरा हो ✗\n③ 기어 भनेको दाँत भएको गोलो आकारको गिअर हो जसले शक्ति र गति सार्छ ✓\n④ 축 भनेको अक्ष (साफ्ट) हो ✗"}, {"n": "279", "q": "충격을 줄이거나 힘을 저장하는 데 쓰는 나선 모양으로 감긴 탄성 있는 금속입니다.", "options": ["접시 저울", "일자 드라이버", "코일 스프링", "유각 렌치"], "answer": 2, "explain": "प्रश्नको अर्थ: धक्का वा झट्का कम गर्न प्रयोग गरिने घुमाउरो धातुको सामान हो। यसलाई थिच्दा दबिने र छोड्दा पहिलेकै ठाउँमा आउने गुण हुन्छ।\n① 접시 저울 भनेको थाल भएको तराजु हो, त्यसैले यो लचकदार घुमाउरो धातु होइन। ✗\n② 일자 드라이버 भनेको माइनस पेचकस हो, त्यसैले यो धक्का सोस्ने स्प्रिङ होइन। ✗\n③ 코일 스프링 भनेको घुमाउरो बेरिएको स्प्रिङ हो, जसले धक्का कम गर्न र शक्ति सञ्चय गर्न काम गर्छ। ✓\n④ 유각 렌치 भनेको एल-आकारको रेन्च हो, त्यसैले यो स्प्रिङसँग मिल्दैन। ✗"}, {"n": "280", "q": "기계 부품을 안전하고 쉽게 빼낼 때 사용하는 도구로, 유압의 힘을 이용해 베어링이나 기어 등을 분해합니다. 세 개의 갈고리와 손잡이 레버가 달려 있어 작동이 간편합니다.", "options": ["기어", "너트", "볼트", "풀러"], "answer": 3, "explain": "प्रश्नको अर्थ: मेसिनका पाटपुर्जाहरूलाई सुरक्षितसाथ बाहिर निकाल्न प्रयोग गरिने औजार हो। यसमा भएका समात्ने हातहरूले घुम्ने भागहरूलाई सजिलै छुट्याउँछ।\n① 기어 भनेको गिअर हो ✗\n② 너트 भनेको नट हो ✗\n③ 볼트 भनेको बोल्ट हो ✗\n④ 풀러 भनेको बियरिङ वा गिअर सजिलै झिक्ने पुलर औजार हो ✓"}, {"n": "281", "q": "바닥이나 물건이 평평한지 또는 곧은지 보는 도구입니다. 안에 있는 작은 물방울이 가운데에 오면 수평이나 수직이 맞습니다.", "options": ["바이스", "베어링", "나사못", "수준기"], "answer": 3, "explain": "प्रश्नको अर्थ: यो कुनै सतह वा सामान समतल र सिधा छ कि छैन भनेर जाँच्ने औजार हो। यसभित्र भएको सानो पानीको थोपा बिचमा आउँदा तेर्सो वा ठाडो मिलेको थाहा हुन्छ।\n① 바이스 भनेको भाइस हो ✗\n② 베어링 भनेको बियरिङ हो ✗\n③ 나사못 भनेको स्क्रू हो ✗\n④ 수준기 भनेको सतह मिलेको नमिलेको जाँच्ने स्पिरिट लेभल हो ✓"}, {"n": "282", "q": "쇠붙이(철)를 끌어당기는 도구입니다. 이것을 가까이 대면 못이나 클립 같은 쇠가 붙습니다.", "options": ["펜치", "망치", "자석", "자재"], "answer": 2, "explain": "प्रश्नको अर्थ: यो फलामका वस्तुहरूलाई आफूतिर तान्ने औजार हो। यसको नजिक काँटी वा क्लिप जस्ता फलामका सामान ल्याउँदा ती टाँसिन्छन्।\n① 펜치 भनेको चिम्टा वा प्लायर्स हो ✗\n② 망치 भनेको हथौडा हो ✗\n③ 자석 भनेको फलाम तान्ने चुम्बक हो ✓\n④ 자재 भनेको निर्माण सामग्री हो ✗"}, {"n": "283", "q": "물체가 돌 때 중심이 되는 선이나 막대입니다. 바퀴나 선풍기처럼 도는 물건은 이것을 중심으로 돕니다.", "options": ["축", "줄", "톱", "칼"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कुनै वस्तु घुम्दा बिचमा रहने मुख्य रेखा वा डन्डा हो। पाङ्ग्रा वा पङ्खा जस्ता घुम्ने वस्तुहरू यसैलाई केन्द्र बनाएर घुम्छन्।\n① 축 भनेको कुनै वस्तु घुम्दा केन्द्र हुने अक्ष वा साफ्ट हो ✓\n② 줄 भनेको फाइल हो ✗\n③ 톱 भनेको आरा हो ✗\n④ 칼 भनेको चक्कु हो ✗"}, {"n": "284", "q": "환경을 덜 오염시키는 자동차로 보통 전기차, 수소차, 하 이브리드차가 있습니다. 매연이 적거나 없어서 공기를 깨끗하게 합니다.", "options": ["친환경 자동차", "친환경 에너지", "친환경 건물", "친환경 농업"], "answer": 0, "explain": "प्रश्नको अर्थ: यो वातावरणलाई कम प्रदूषण गर्ने गाडी हो जसमा बिजुली वा हाइड्रोजनबाट चल्ने कारहरू पर्छन्। यसले धुवाँ कम वा पटक्कै ननिकाल्ने भएकाले हवा सफा राख्छ।\n① 친환경 자동차 भनेको वातावरणमैत्री गाडी (विद्युतीय वा हाइड्रोजन गाडी) हो ✓\n② 친환경 에너지 भनेको वातावरणमैत्री ऊर्जा हो ✗\n③ 친환경 건물 भनेको वातावरणमैत्री भवन हो ✗\n④ 친환경 농업 भनेको वातावरणमैत्री कृषि हो ✗"}, {"n": "285", "q": "쇠, 철 따위를 자르거나, 깎거나, 모양을 바꾸는 일을 의미하며 이렇게 해서 기계 부품이나 물건을 만듭니다.", "options": ["금속 염색", "금속 가공", "금속 판매", "금속 채굴"], "answer": 1, "explain": "प्रश्नको अर्थ: यो फलाम वा धातुलाई काट्ने, ताछ्ने वा आकार परिवर्तन गर्ने काम हो। यसरी मसिनका पार्टपुर्जा वा विभिन्न सामानहरू बनाइन्छ।\n① 금속 염색 भनेको धातु रङ्गाउने काम हो ✗\n② 금속 가공 भनेको धातुलाई काटेर, कुटेर वा आकार दिएर वस्तु बनाउने मेटल प्रोसेसिङ (धातु प्रशोधन) हो ✓\n③ 금속 판매 भनेको धातु बिक्री गर्ने काम हो ✗\n④ 금속 채굴 भनेको धातु खानीबाट निकाल्ने काम हो ✗"}, {"n": "286", "q": "무언가를 두드리거나 박을 때 쓰는 도구로 보통 손잡이가 있고, 끝에 무거운 쇠 부분이 있습니다.", "options": ["펜치", "드릴", "망치", "볼트"], "answer": 2, "explain": "प्रश्नको अर्थ: यो कुनै कुरा ठोक्न वा काँटी गाड्न प्रयोग गरिने औजार हो। यसको समात्ने बिँड हुन्छ र टुप्पामा गह्रौँ फलामको भाग हुन्छ।\n① 펜치 (पेन्च) हो, यो तार काट्न वा समात्न प्रयोग गरिन्छ तर यसमा हत्था र भारी फलामको भाग हुँदैन ✗\n② 드릴 (ड्रिल) हो, यो प्वाल पार्ने औजार हो ✗\n③ 망치 (हथौडा) हो, यो कुनै वस्तु ठोक्न वा गाड्न प्रयोग गरिने हत्था भएको र छेउमा भारी फलामको भाग भएको औजार हो ✓\n④ 볼트 (बोल्ट) हो, यो कस्ने वस्तु हो ✗"}, {"n": "287", "q": "금속이나 나무 등을 갈아서 모양을 다듬는 도구인데 작고 거친 날이 있어서 표면을 매끄럽게 만들거나 깎을 때 씁니다.", "options": ["칼", "축", "줄", "톱"], "answer": 2, "explain": "प्रश्नको अर्थ: यो धातु वा काठलाई खिपेर आकार मिलाउन प्रयोग गरिने औजार हो। यसमा साना र खस्रा धारहरू हुने भएकाले सतहलाई चिल्लो पार्न वा काट्न प्रयोग गरिन्छ।\n① 칼 भनेको चाकु हो, यसले काट्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 축 भनेको धुरी हो, यसले घुम्ने भागलाई अड्याउँछ त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 줄 भनेको रेती हो, यसले धातु वा काठलाई घसेर चिल्लो बनाउने वा आकार मिलाउने औजार भएकाले यो विवरणसँग एकदम मिल्छ। ✓\n④ 톱 भनेको करौँती हो, यसले काठ वा धातु काट्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "288", "q": "돌이나 쇠를 깎거나 깨뜨릴 때 쓰는 뾰족한 쇠 도구입니다. 보통 망치로 정을 쳐서 금속이나 돌을 자르거나 구멍을 낼 때 사용해요.", "options": ["축", "톱", "못", "정"], "answer": 3, "explain": "प्रश्नको अर्थ: यो ढुङ्गा वा फलाम ताछ्न र फुटाउन प्रयोग गरिने तिखो फलामको औजार हो। प्रायः हथौडाले हानेर धातु वा ढुङ्गा काट्न र दुलो पार्न यसको प्रयोग गरिन्छ।\n① 축 (अक्स) हो, यो मिल्दैन। ✗\n② 톱 (आरा) हो, यो काठ काट्ने औजार हो ✗\n③ 못 (किला) हो, यो ठोक्ने वस्तु हो ✗\n④ 정 (छिनो) हो, यो ढुङ्गा वा फलाम काट्न वा फुटाउन प्रयोग हुने तिखो फलामको औजार हो जसलाई हथौडाले हानेर प्रयोग गरिन्छ ✓"}, {"n": "289", "q": "구멍을 넓히거나 매끄럽게 다듬는 도구로 보통 기계 부품에 뚫린 구멍을 정확한 크기와 모양으로 정리할 때 사용합니다.", "options": ["쇠톱", "너트", "니퍼", "리머"], "answer": 3, "explain": "प्रश्नको अर्थ: यो मसिनका सामानमा पारिएका दुलोहरूलाई अझ फराकिलो वा चिल्लो पार्न प्रयोग गरिने औजार हो। यसले दुलोलाई एकदम सही आकार र साइजमा मिलाउन मद्दत गर्छ।\n① 쇠톱 (ह्याकस’) हो, यो फलाम काट्ने आरा हो ✗\n② 너트 (नट) हो, यो बोल्टसँग कस्ने वस्तु हो ✗\n③ 니퍼 (निप्पर) हो, यो तार काट्ने चिम्टाजस्तो औजार हो ✗\n④ 리머 (रीमर) हो, यो प्वाललाई फराकिलो वा चिल्लो पार्न मेसिनको भागमा प्रयोग गरिने औजार हो ✓"}, {"n": "290", "q": "함께 움직일 수 있는 두 개의 금속 블록이 있는 공구, 작업이 완료되는 동안 물건을 단단히 고정할 때 사용됩니다.", "options": ["바이스", "망치", "쇠지래", "괭이"], "answer": 0, "explain": "प्रश्नको अर्थ: यो दुईवटा फलामका खण्डहरू भएको औजार हो जसले काम गर्दा सामानलाई हलचल नगर्ने गरी कडासँग समातेर राख्छ।\n① 바이스 (भाइस) हो, यो सँगै चल्न सक्ने दुईवटा फलामको ब्लक हुने र काम गर्ने बेला वस्तुलाई दह्रोसँग च्यापेर राख्ने औजार हो ✓\n② 망치 (हथौडा) हो, यो ठोक्ने औजार हो ✗\n③ 쇠지래 (फलामको लिभर) हो, यो उचाल्ने वा भत्काउने औजार हो ✗\n④ 괭이 (कुटो) हो, यो खन्ने कृषियन्त्र हो त्यसैले यो मिल्दैन। तेस्रो विकल्प '쇠지래' किताबमा छापिएजस्तै राखिएको छ। ✗"}, {"n": "291", "q": "두꺼운 금속판을 자를 때 사용하는 특수한 가위입니다. 강한 날카로운 칼날로 금속을 정확하게 자를 수 있습니다.", "options": ["용접봉", "유각 렌치", "전기 절단기", "판금 가위"], "answer": 3, "explain": "प्रश्नको अर्थ: यो बाक्लो धातुको पाता काट्न प्रयोग गरिने विशेष प्रकारको कैँची हो। यसको तिखो धारले फलामको पातालाई सजिलै काट्न सकिन्छ।\n① 용접봉 (वेल्डिंग रड) हो, यो वेल्डिंग गर्दा प्रयोग हुने छड हो ✗\n② 유각 렌치 (हेक्स रेन्च) हो, यो बोल्ट कस्ने औजार हो ✗\n③ 전기 절단기 (विद्युतीय काट्ने मेसिन) हो, यो समग्रमा काट्ने मेसिन हो ✗\n④ 판금 가위 (पाना काट्ने काइँची/मेटल शियर) हो, यो बाक्लो फलामको पट्टा वा पाना काट्न प्रयोग हुने धारिलो विशेष किसिमको काइँची हो ✓"}, {"n": "292", "q": "나무나 금속 재료를 일정한 사이즈나 두께의 조각으로 자르는 장치입니다.", "options": ["밴딩기", "절단기", "용접기", "정수기"], "answer": 1, "explain": "प्रश्नको अर्थ: यो काठ वा धातुका सामानहरूलाई तोकिएको आकार वा बाक्लोपनामा टुक्रा पार्न काट्ने मसिन हो।\n① 밴딩기 (बेन्डिङ मेसिन) हो, यो बेन्ड गर्ने मेसिन हो ✗\n② 절단기 (कटर/काट्ने मेसिन) हो, यो काठ वा धातुका सामाग्रीलाई निश्चित साइज वा मोटाइको टुक्रामा काट्ने मेसिन वा उपकरण हो ✓\n③ 용접기 (वेल्डिंग मेसिन) हो, यो जोड्ने मेसिन हो ✗\n④ 정수기 (पानी शुद्ध पार्ने मेसिन) हो, यो पिउने पानी सफा गर्ने मेसिन हो ✗"}, {"n": "293", "q": "집이나 사무실에서 빗자루를 사용하여 먼지나 쓰레기를 쓸어 담는 도구입니다.", "options": ["먼지털이", "쓰레받기", "청소함", "공구함"], "answer": 1, "explain": "प्रश्नको अर्थ: यो घर वा कार्यालयमा कुचोले बढाारेको धूलो र फोहर उठाएर राख्न प्रयोग गरिने औजार हो।\n① 먼지털이 (धुलो टार्ने कुचो) हो, यो धुलो टार्ने साधन हो ✗\n② 쓰레받기 (डस्टबिन/फोहोर उठ्ने सूप) हो, यो घर वा कार्यालयमा कुचो प्रयोग गरेर धुलो वा फोहोर बटुलि राख्ने वा उठाउने औजार हो ✓\n③ 청소함 (सरसफाइ बाकस) हो, यो सरसफाइका सामान राख्ने ठाउँ हो ✗\n④ 공구함 (औजार बाकस) हो, यो औजार राख्ने बक्स हो ✗"}, {"n": "294", "q": "화재 발생시 손으로 들고 가서 불을 끌 수 있는 이동식 도구입니다. 대개 복도나 작업장 벽에 둡니다.", "options": ["구급함", "공구함", "소화기", "소화전"], "answer": 2, "explain": "प्रश्नको अर्थ: यो आगो लाग्दा हातले बोकेर लगेर आगो निभाउन सकिने औजार हो। यसलाई प्रायः कोठा वा काम गर्ने ठाउँको भित्तामा राखिन्छ।\n① 구급함 (औषधि बाकस) हो, यो प्राथमिक उपचारको बक्स हो ✗\n② 공구함 (औजार बाकस) हो, यो औजार राख्ने बक्स हो ✗\n③ 소화기 (अग्नििनवारक यन्त्र) हो, यो आगलागी हुँदा हातले समातेर आगो निभाउन लैजान सकिने र करिडोर वा कार्यक्षेत्रको भित्तामा राखिने मोबाइल उपकरण हो ✓\n④ 소화전 (फायर हाइड्रन्ट) हो, यो भित्तामा जडान गरिएको पानी आउने धारा हो ✗"}, {"n": "295", "q": "기계나 장비의 작동 상태를 바꾸거나 맞추는 장치입니다. 예를 들어, 용접에서는 전류나 압력을 알맞게 설정하는 데 사용됩니다.", "options": ["세탁기", "계산기", "조절기", "소화기"], "answer": 2, "explain": "प्रश्नको अर्थ: यो मसिन वा उपकरणको काम गर्ने अवस्था मिलाउन वा परिवर्तन गर्न प्रयोग गरिने यन्त्र हो। यसले बिजुलीको प्रवाह वा चापलाई उपयुक्त स्तरमा मिलाउँछ।\n① 세탁기 (वाशिङ मेसिन) हो, यो लुगा धुने मेसिन हो ✗\n② 계산기 (क्यालकुलेटर) हो, यो हिसाब गर्ने यन्त्र हो ✗\n③ 조절기 (कन्ट्रोलर/नियन्त्रक) हो, यो मेसिन वा उपकरणको सञ्चालन अवस्था परिवर्तन वा मिलाउने यन्त्र हो जसले करेन्ट वा चाप मिलाउन मद्दत गर्छ ✓\n④ 소화기 (अग्निनवारक यन्त्र) हो, यो आगो निभाउने यन्त्र हो ✗"}, {"n": "296", "q": "금속, 돌, 나무 등의 재료를 갈거나 자르는 데 사용하는 전동 공구입니다. 주로 표면을 매끄럽게 하거나 불필요한 부분을 제거할 때 쓰입니다.", "options": ["절단기", "그라인더", "용접기", "밴딩기"], "answer": 1, "explain": "प्रश्नको अर्थ: यो धातु, ढुङ्गा वा काठ खियाउन र काट्न प्रयोग गरिने बिजुलीबाट चल्ने औजार हो। यसले सतह चिल्लो पार्न वा अनावश्यक भाग हटाउन मद्दत गर्छ।\n① 절단기 (कटर) हो, यो काट्ने मेसिन हो ✗\n② 그라인더 (ग्राइन्डर) हो, यो धातु, ढुङ्गा, काठ आदि सामाग्री घोट्न वा काट्न प्रयोग हुने तथा सतह चिल्लो पार्न वा अनावश्यक भाग हटाउन प्रयोग हुने विद्युतीय औजार हो ✓\n③ 용접기 (वेल्डिंग मेसिन) हो, यो जोड्ने मेसिन हो ✗\n④ 밴딩기 (बेन्डिङ मेसिन) हो, यो बेन्ड गर्ने मेसिन हो ✗"}, {"n": "297", "q": "품질에 문제가 있어 정상적으로 사용할 수 없는 제품을 생산되는 것을 말합니다.", "options": ["원재료", "불량품", "식료품", "생필품"], "answer": 1, "explain": "प्रश्नको अर्थ: यो गुणस्तरमा समस्या भएर सामान्य रूपमा प्रयोग गर्न नमिल्ने गरी बनेका सामानहरूलाई जनाउँछ।\n① 원재료 भनेको काँचो पदार्थ हो, यो सामान बनाउन प्रयोग गरिने सामग्री हो त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 불량품 भनेको खराब सामान हो, गुणस्तरमा समस्या भएर प्रयोग गर्न नसकिने उत्पादन भएकाले यो विवरणसँग एकदम मिल्छ। ✓\n③ 식료품 भनेको खाद्यान्न सामग्री हो, यो खानेकुरा हो त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 생필품 भनेको दैनिक उपभोग्य वस्तु हो, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "298", "q": "제품이나 물건을 만들기 위해 처음에 사용하는 가공되지 않은 기본 재료입니다.", "options": ["원재료", "수준기", "참기름", "밀가루"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कुनै सामान वा वस्तु बनाउनका लागि सुरुमा प्रयोग गरिने प्रशोधन नगरिएको मुख्य कच्चा पदार्थ हो।\n① 원재료 भनेको काँचो पदार्थ हो, यो सामान वा वस्तु बनाउन प्रयोग गरिने आधारभूत सामग्री भएकाले यो विवरणसँग एकदम मिल्छ। ✓\n② 수준기 भनेको सतह तेर्सो छ कि छैन नाप्ने औजार हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 참기름 भनेको तिलको तेल हो, यो खानेकुरा पकाउन प्रयोग गरिने तेल हो त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 밀가루 भनेको गहुँको पिठो हो, यो एउटा खानेकुरा बनाउने सामग्री हो त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "299", "q": "제품을 만들 때 기능을 더하거나 성질을 개선하기 위해 소량 넣는 물질입니다.", "options": ["불량품", "용접봉", "첨가제", "고추장"], "answer": 2, "explain": "प्रश्नको अर्थ: यो सामान बनाउँदा त्यसको गुणस्तर सुधार्न वा थप विशेषता दिनका लागि थोरै मात्रामा मिसाइने पदार्थ हो।\n① 불량품 भनेको खराब सामान हो, बिग्रेको उत्पादनलाई बुझाउने भएकाले यो विवरणसँग मिल्दैन। ✗\n② 용접봉 भनेको वेल्डिङ रड हो, धातु जोड्न प्रयोग गरिने भएकाले यो विवरणसँग मिल्दैन। ✗\n③ 첨가제 भनेको थपिने पदार्थ हो, वस्तुको गुणस्तर वा कार्य सुधार्न थोरै मिसाइने पदार्थ भएकाले यो विवरणसँग एकदम मिल्छ। ✓\n④ 고추장 भनेको खुर्सानीको पेस्ट हो, यो खानेकुरामा हालिने कोरियाली लेदो हो त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "300", "q": "두 가지 이상의 재료를 고르게 섞는 데 사용하는 기계나 장치입니다. 예를 들어, 원재료와 첨가제를 섞어 균일한 혼합물을 만들 때 사용됩니다.", "options": ["청소기", "계산기", "용접기", "혼합기"], "answer": 3, "explain": "प्रश्नको अर्थ: यो दुई वा सोभन्दा बढी पदार्थहरूलाई राम्ररी मिसाउन प्रयोग गरिने मसिन वा उपकरण हो।\n① 청소기 (भ्याकुम क्लिनर) हो, यो सरसफाइ गर्ने मेसिन हो ✗\n② 계산기 (क्यालकुलेटर) हो, यो हिसाब गर्ने यन्त्र हो ✗\n③ 용접기 (वेल्डिंग मेसिन) हो, यो वेल्डिंग गर्ने मेसिन हो ✗\n④ 혼합기 (मिक्सर/मिश्रण गर्ने मेसिन) हो, यो दुई वा बढी सामाग्रीलाई एकनासले मिसाउन प्रयोग गरिने मेसिन वा उपकरण हो जस्तै कच्चा पदार्थ र एडिटीभ मिसाएर एकनासको मिश्रण बनाउन प्रयोग गरिन्छ ✓"}, {"n": "301", "q": "물체의 길이나 높이 등을 재는 도구로, 띠 모양의 눈금이 있는 유연한 재질로 만들어져 있고 건축, 재봉, 일상 생활 등 다양한 곳에서 사용합니다.", "options": ["자", "줄자", "저울", "캘리퍼스"], "answer": 1, "explain": "प्रश्नको अर्थ: यो सामानको लम्बाइ वा उचाइ नाप्न प्रयोग गरिने साधन हो। यो लचिलो हुन्छ र यसमा नाप्ने चिन्हहरू हुन्छन्।\nपहिलो विकल्प 자 (फिता वा स्केल) हो, जुन छोटो लम्बाइ नाप्न प्रयोग गरिन्छ तर लचिलो फिताको रूपमा हुँदैन। दोस्रो विकल्प 줄자 (जुल्जा) हो, जुन लम्बाइ वा उचाइ नाप्ने फिता आकारको लचिलो औजार हो र यसलाई निर्माण, वास्तुकला र दैनिक जीवनमा प्रयोग गरिन्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 저울 (तराजु) हो, जसले तौल नाप्छ। चौथो विकल्प 캘리퍼스 (क्यालिपर्स) हो, जसले वस्तुको सूक्ष्म आकार नाप्छ। सही उत्तर विकल्प २ (줄자) हो।"}, {"n": "302", "q": "물체의 안지름, 바깥지름, 깊이 등을 정밀하게 재는 측정 도구이다. 주로 과학 실험이나 공학 분야에서 사용되며, 눈금이 정밀하게 나뉘어 있어 작은 단위까지 측정할 수 있다.", "options": ["줄자", "전자 저울", "접시 저울", "버니어 캘리퍼스"], "answer": 3, "explain": "प्रश्नको अर्थ: यो सामानको भित्री वा बाहिरी गोलाइ र गहिराइ एकदम मसिनो गरी नाप्ने औजार हो। यो धेरैजसो विज्ञान वा इन्जिनियरिङको काममा प्रयोग गरिन्छ।\n① 줄자 भनेको नाप्ने फिता हो, यसले लम्बाइ नाप्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 전자 저울 भनेको डिजिटल तराजु हो, यसले तौल नाप्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 접시 저울 भनेको थाली तराजु हो, यसले पनि सामानको तौल नाप्छ त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 버니어 캘리퍼스 भनेको भर्नियर क्यालिपर हो, यसले वस्तुको भित्री व्यास, बाहिरी व्यास र गहिराइ सूक्ष्म रूपमा नाप्ने भएकाले यो विवरणसँग एकदम मिल्छ। ✓"}, {"n": "303", "q": "환경을 오염시키지 않고 자연에서 얻을 수 있는 에너지입니다. 태양광, 풍력, 수력, 지열 등이 있으며, 탄소 배출이 적어 지구를 보호하는 데 도움이 됩니다.", "options": ["친환경 자동차", "친환경 에너지", "친환경 건물", "친환경 농업"], "answer": 1, "explain": "प्रश्नको अर्थ: यो वातावरणलाई नोक्सान नपुर्याई प्रकृतिबाट पाइने शक्ति वा ऊर्जा हो। घाम, हावा र पानी जस्ता स्रोतबाट यस्तो ऊर्जा बनाइन्छ।\n① 친환경 자동차 (वातावरणमैत्री गाडी) हो, जुन सवारी साधन हो। ✗\n② 친환경 에너지 (वातावरणमैत्री ऊर्जा) हो, जुन प्रकृतिबाट प्राप्त हुने, प्रदूषण नगर्ने र कार्बन उत्सर्जन कम गर्ने ऊर्जा हो ✓\n③ 친환경 건물 (वातावरणमैत्री भवन) हो, जुन भवनसँग सम्बन्धित छ। ✗\n④ 친환경 농업 (वातावरणमैत्री कृषि) हो, जुन खेतीकिसानीसँग सम्बन्धित छ। ✗"}, {"n": "304", "q": "오랜 시간에 걸쳐 지구의 평균 기온이나 강수량 등이 변하는 현상입니다. 주로 인간의 활동으로 인한 온실가스 증가가 원인이며, 이상기후, 해수면 상승 등을 일으킵니다.", "options": ["기후 변화", "환경 파괴", "지구 온난화", "친환경 정책"], "answer": 0, "explain": "प्रश्नको अर्थ: यो लामो समयको क्रममा पृथ्वीको औसत तापमान वा पानी पर्ने मात्रामा परिवर्तन आउने प्रक्रिया हो। मानिसका गतिविधिले गर्दा मौसम बिग्रँदै जाने समस्या यसमा हुन्छ।\n① 기후 변화 भनेको जलवायु परिवर्तन हो। लामो समयमा पृथ्वीको औसत तापक्रम र वर्षाको मात्रा परिवर्तन हुने प्रक्रियालाई यसले जनाउँछ ✓\n② 환경 파괴 भनेको वातावरण विनाश हो। यो प्राकृतिक वातावरण नष्ट हुने अवस्था हो, त्यसैले यो होइन। ✗\n③ 지구 온난화 भनेको पृथ्वीको तापक्रम वृद्धि हो। यो तापक्रम बढ्ने कुरा मात्र हो ✗\n④ 친환경 정책 भनेको वातावरणमैत्री नीति हो। यो वातावरण जोगाउन बनाइने नियम हो, त्यसैले यो होइन। ✗"}, {"n": "305", "q": "자연의 자원과 생태계를 심각하게 손상하는 현상입니다. 산림 벌채, 오염물질 배출, 무분별한 개발 등이 주요 원인으로, 이는 생물 다양성 감소와 지구 온난화 등 심각한 문제를 일으킵니다.", "options": ["기후 변화", "환경 파괴", "풍력 에너지", "ESG 경영"], "answer": 1, "explain": "प्रश्नको अर्थ: यो रुख काट्ने र फोहोर फाल्ने कार्यले गर्दा प्रकृति र वातावरण नष्ट हुने अवस्था हो। यसले जीवजन्तु र पृथ्वीलाई ठूलो असर पार्छ।\n① 기후 변화 (जलवायु परिवर्तन) हो। ✗\n② 환경 파괴 (वातावरण विनाश) हो, जसले प्राकृतिक स्रोत र पारिस्थितिक प्रणालीलाई गम्भीर रूपमा नोक्सान पुर्‍याउँछ र वन फँडानी यसको मुख्य कारण हो ✓\n③ 풍력 에너지 (वायु ऊर्जा) हो। ✗\n④ ESG 경영 (ESG व्यवस्थापन) हो। ✗"}, {"n": "306", "q": "이산화탄소, 메탄, 아산화질소 같은 대기 중에 존재하는 가스로, 지구의 열을 가두어 기온을 상승시키는 역할을 합니다.", "options": ["화석 연료", "기후 변화", "환경 오염", "온실 가스"], "answer": 3, "explain": "प्रश्नको अर्थ: यो हावामा पाइने यस्तो ग्यास हो जसले पृथ्वीको तापक्रम बढाउन मद्दत गर्छ। यसले वातावरणको गर्मीलाई बाहिर जान नदिई थुनेर राख्छ।\n① 화석 연료 (फसिल इन्धन) हो। ✗\n② 기후 변화 (जलवायु परिवर्तन) हो। ✗\n③ 환경 오염 (वातावरण प्रदूषण) हो। ✗\n④ 온실 가스 (ग्रिनहाउस ग्यास) हो, जुन वायुमण्डलमा पाइने कार्बनडाइअक्साइड, मिथेन आदि ग्यास हुन् जसले पृथ्वीको तापक्रम बढाउँछन् ✓"}, {"n": "307", "q": "해에서 나오는 빛과 열을 이용해 전기를 생산하는 에너지입니다. 환경에 미치는 영향이 적고 재생 가능하여 친환경적인 에너지로 주목받고 있습니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 0, "explain": "प्रश्नको अर्थ: यो घामको प्रकाश र तापलाई प्रयोग गरेर बिजुली निकाल्ने शक्ति हो। यसले वातावरणलाई सफा राख्न मद्दत गर्छ।\n① 태양광 에너지 (सौर्य ऊर्जा) हो, जसले सूर्यबाट आउने प्रकाश र तातो प्रयोग गरेर बिजुली उत्पादन गर्छ ✓\n② 풍력 에너지 (वायु ऊर्जा) हो। ✗\n③ 수력 에너지 (जलविद्युत ऊर्जा) हो। ✗\n④ 해양 에너지 (समुद्री ऊर्जा) हो। ✗\nशिक्षकको उत्तर-पत्र: ④ 해양 에너지 — मेरो उत्तर: ① 태양광 에너지। प्रश्न: '해에서 나오는 빛과 열' — सूर्यको प्रकाश र तापबाट बिजुली — सौर्य ऊर्जा, स्पष्ट छ; 해양 त समुद्र हो।"}, {"n": "308", "q": "대기 중 온실가스 증가로 인해 지구의 평균 기온이 상승하는 현상입니다. 이로 인해 생태계와 인간 생활에 심각한 영향을 미칩니다.", "options": ["글로벌화", "산업화", "지구 온난화", "단순화"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पृथ्वीको तापक्रम बिस्तारै तातो हुँदै जाने वा बढ्दै जाने समस्या हो। यसले गर्दा मौसममा नराम्रो असर पर्छ।\n① 글로벌화 भनेको विश्वव्यापीकरण हो। यो व्यापार र संस्कृति संसारभरि फैलिनु हो, त्यसैले यो होइन। ✗\n② 산업화 भनेको औद्योगिकीकरण हो। यो उद्योग र कारखानाहरूको विकास हुनु हो ✗\n③ 지구 온난화 भनेको पृथ्वीको तापक्रम वृद्धि हो। वायुमण्डलमा हरितगृह ग्यास बढेर पृथ्वीको औसत तापक्रम बढ्ने प्रक्रियालाई यसले जनाउँछ ✓\n④ 단순화 भनेको सरलीकरण हो। यो जटिल कुरालाई सजिलो बनाउनु हो, त्यसैले यो होइन। ✗"}, {"n": "309", "q": "석탄, 석유, 천연가스 같은 에너지원으로 많이 사용되지만, 환경 오염과 온실가스 배출의 주요 원인입니다.", "options": ["기후 변화", "재생에어지", "화석 연료", "온난화"], "answer": 2, "explain": "प्रश्नको अर्थ: यो कोइला वा खनिज तेल जस्ता जमिनमुनिबाट निकालिने इन्धन हो। यसलाई बाल्दा वातावरण प्रदूषण हुन्छ।\n① 기후 변화 भनेको जलवायु परिवर्तन हो। यो मौसम र वातावरणमा आउने फेरबदल हो, त्यसैले यो होइन। ✗\n② 재생에어지 भनेको नवीकरणीय ऊर्जा हो। यो प्रदूषण नगर्ने ऊर्जाको स्रोत हो ✗\n③ 화석 연료 भनेको जीवाश्म इन्धन हो। कोइला, खनिज तेल र प्राकृतिक ग्यास जस्ता वातावरण प्रदूषण गर्ने ऊर्जा स्रोतलाई यसले जनाउँछ ✓\n④ 온난화 भनेको तापक्रम वृद्धि हो। यो न्यानो हुने प्रक्रिया हो, इन्धन होइन, त्यसैले यो होइन। ✗"}, {"n": "310", "q": "물이 흐르거나 떨어지는 힘을 이용해 전기를 만드는 에너지입니다. 주로 댐이나 강에서 물의 흐름을 이용하여 발전하며, 재생 가능하고 친환경적인 에너지원으로 널리 사용됩니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 2, "explain": "प्रश्नको अर्थ: यो बग्ने वा माथिबाट खस्ने पानीको शक्ति प्रयोग गरेर बिजुली उत्पादन गर्ने तरिका हो। यो नदी वा बाँधमा प्रयोग गरिन्छ।\n① 태양광 에너지 (सौर्य ऊर्जा) हो। ✗\n② 풍력 에너지 (वायु ऊर्जा) हो। ✗\n③ 수력 에너지 (जलविद्युत ऊर्जा) हो, जसले पानी बग्ने वा खस्ने शक्ति प्रयोग गरेर बिजुली उत्पादन गर्छ ✓\n④ 해양 에너지 (समुद्री ऊर्जा) हो। ✗"}, {"n": "311", "q": "쓰레기를 버릴 때 재활용 가능한 자원과 일반 쓰레기를 구별하여 배출하는 것을 의미합니다. 이를 통해 재활용률을 높이고 환경 오염을 줄일 수 있습니다.", "options": ["환경보호", "재고관리", "정리정돈", "분리수거"], "answer": 3, "explain": "प्रश्नको अर्थ: यो फोहोर फ्याँक्दा पुनः प्रयोग गर्न सकिने र नसकिने सामानलाई छुट्टाछुट्टै छुट्याएर राख्ने काम हो। यसले वातावरण सफा राख्छ।\n① 환경보호 (वातावरण संरक्षण) हो। ✗\n② 재고관리 (स्टक व्यवस्थापन) हो। ✗\n③ 정리정돈 (व्यवस्थापन तथा सफाइ) हो। ✗\n④ 분리수거 (सामाग्री वर्गीकरण गरी फ्याँक्ने काम) हो, जसले फोहोर फ्याँक्दा पुनप्रयोग गर्न मिल्ने र साधारण फोहोर छुट्याएर फाल्ने बुझाउँछ ✓"}, {"n": "312", "q": "바람의 힘을 이용해 전기를 만드는 에너지입니다. 재생 가능하고 친환경적인 에너지원으로 주목받고 있습니다.", "options": ["태양광 에너지", "풍력 에너지", "수력 에너지", "해양 에너지"], "answer": 1, "explain": "प्रश्नको अर्थ: यो चल्ने हावाको शक्तिलाई प्रयोग गरेर बिजुली बनाउने तरिका हो। यो कहिल्यै नसकिने प्राकृतिक शक्ति हो।\n① 태양광 에너지 (सौर्य ऊर्जा) हो। ✗\n② 풍력 에너지 (वायु ऊर्जा) हो, जसले हावाको शक्ति प्रयोग गरेर बिजुली उत्पादन गर्छ र यो नवीकरणीय तथा वातावरणमैत्री ऊर्जा हो ✓\n③ 수력 에너지 (जलविद्युत ऊर्जा) हो। ✗\n④ 해양 에너지 (समुद्री ऊर्जा) हो। ✗"}, {"n": "313", "q": "천이나 옷감을 만들기 전에 사용하는 실의 기본 재료입니다. 면, 나일론, 폴리에스터 같은 섬유를 뽑아서 만든 실로, 이것을 엮어서 천을 만듭니다.", "options": ["원사", "옷장", "옷걸이", "재봉기"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कपडा वा लुगा बुन्नका लागि प्रयोग गरिने धागो हो। यसलाई धेरै प्रकारका रेशाबाट बनाइन्छ।\n① 원사 (धागो/कच्चा धागो) हो, जुन कपडा वा लुगा बनाउनु अगाडि प्रयोग हुने धागोको आधारभूत सामग्री हो ✓\n② 옷장 (दराज) हो। ✗\n③ 옷걸이 (ह्याङ्गर) हो। ✗\n④ 재봉기 (सिलाई मेसिन) हो। ✗"}, {"n": "314", "q": "자연에서 얻을 수 있고, 시간이 지나도 다시 만들어지는 에너지입니다. 태양광, 풍력, 수력, 해양 에너지 등이 있으며, 환경을 오염시키지 않고 계속 사용할 수 있는 것이 특징입니다.", "options": ["환경 오염", "재생에너지", "지구 온난화", "친환경 정책"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कहिल्यै नसकिने र प्रकृतिबाट पटक-पटक प्राप्त भइरहने शक्ति हो। यसले प्रदूषण गराउँदैन।\n① 환경 오염 भनेको वातावरणीय प्रदूषण हो। यो वातावरण फोहोर र खराब हुने अवस्था हो, त्यसैले यो होइन। ✗\n② 재생에너지 भनेको नवीकरणीय ऊर्जा हो। प्रकृतिबाट पाइने र पुन: प्रयोग गर्न सकिने सफा ऊर्जालाई यसले जनाउँछ ✓\n③ 지구 온난화 भनेको पृथ्वीको तापक्रम वृद्धि हो। यो वातावरण तातिने समस्या हो ✗\n④ 친환경 정책 भनेको वातावरणमैत्री नीति हो। यो सरकार वा संस्थाले बनाउने नियम हो, त्यसैले यो होइन। ✗"}, {"n": "315", "q": "공기 속에 들어 있는 수증기(물기)의 양을 나타내는 정도입니다. 이것이 높으면 공기가 축축하고 덥게 느껴지고, 낮으면 건조하게 느껴집니다.", "options": ["계절", "하늘", "바람", "습도"], "answer": 3, "explain": "प्रश्नको अर्थ: यो हावामा भएको भिजेको भाग वा पानीको मात्रालाई जनाउने कुरा हो। यो धेरै भएमा ओसिलो र कम भएमा सुक्खा महसुस हुन्छ।\n① 계절 (ऋतु) हो। ✗\n② 하늘 (आकाश) हो। ✗\n③ 바람 (हावा) हो। ✗\n④ 습도 (आर्द्रता/चिस्यान) हो, जसले हावामा रहेको पानीको बाफको मात्रालाई बुझाउँछ र यसले हावालाई ओसिलो वा सुख्खा बनाउँछ ✓"}, {"n": "316", "q": "어떤 길이, 무게, 시간, 온도 같은 것을 수치로 재는 것을 말합니다. 예를 들어, 자로 길이를 재거나 저울로 무게를 재는 것이 모두 이에 해당합니다.", "options": ["관리", "측정", "재고", "보관"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कुनै सामानको लम्बाइ, तौल वा तापक्रम अङ्कमा नाप्ने वा जाँच्ने क्रिया हो।\n① 관리 भनेको व्यवस्थापन गर्नु वा हेरचाह गर्नु हो ✗\n② 측정 भनेको लम्बाइ, तौल, समय, तापक्रम आदि नाप्नु वा तौलनु हो ✓\n③ 재고 भनेको मौज्दात वा सामानको बाँकी मात्रा हो ✗\n④ 보관 भनेको सामान भण्डारण गर्नु वा सुरक्षित राख्नु हो ✗"}, {"n": "317", "q": "어떤 물건이나 정보, 사람 등을 체계적으로 기록하고 관리하는 문서나 책입니다. 주로 학교, 회사, 공공기관 등에서 물건이나 작업을 잘 관리하기 위해 사용합니다.", "options": ["작업대", "판금 가위", "관리 대장", "주문서"], "answer": 2, "explain": "प्रश्नको अर्थ: यो सामान, मानिस वा कामको विवरण मिलाएर लेखिने कागजात वा कापी हो। कार्यालय वा कारखानामा व्यवस्थापन गर्न यसको प्रयोग गरिन्छ।\n① 작업대 भनेको काम गर्ने टेबल हो ✗\n② 판금 가위 भनेको पाना काट्ने कैंची हो ✗\n③ 관리 대장 भनेको कुनै पनि वस्तु, जानकारी वा व्यक्तिलाई व्यवस्थित रूपमा रेकर्ड गरेर व्यवस्थापन गर्ने कागजात वा किताब हो ✓\n④ 주문서 भनेको अर्डर फारम वा माग फारम हो ✗"}, {"n": "318", "q": "옷감이나 실 등에 색을 입히는 작업을 말합니다. 이 과정을 통해 천에 다양한 색을 내고, 무늬를 만들거나 멋을 더할 수 있습니다.", "options": ["염색 가공", "변색 가공", "관리 대장", "창고 관리"], "answer": 0, "explain": "प्रश्नको अर्थ: यो कपडा वा धागोमा विभिन्न रङ लगाउने प्रक्रिया हो। यसबाट कपडालाई सुन्दर बनाइन्छ।\n① 염색 가공 भनेको कपडा वा धागोमा रङ लगाउने प्रशोधन प्रक्रिया हो ✓\n② 변색 가공 भनेको रङ फेरिने वा बदलिने प्रशोधन हो ✗\n③ 관리 대장 भनेको व्यवस्थापन खाता वा रेकर्ड पुस्तिका हो ✗\n④ 창고 관리 भनेको गोदाम व्यवस्थापन हो ✗"}, {"n": "319", "q": "자연에서 얻은 재료로 만든 실이나 천을 말합니다. 면, 모, 견 등이 있으며, 피부에 부드럽고 환경에 좋은 섬유입니다.", "options": ["합성 섬유", "천연 섬유", "기계 가공", "원사 가공"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कपास वा पशम जस्ता प्राकृतिक वस्तुबाट बनाइने रेशा वा कपडा हो। यो छालाका लागि राम्रो र नरम हुन्छ।\n① 합성 섬유 भनेको सिंथेटिक वा कृत्रिम फाइबर हो ✗\n② 천연 섬유 भनेको प्रकृतिबाट प्राप्त सामग्रीबाट बनेको धागो वा कपडा हो, जसलाई प्राकृतिक फाइबर भनिन्छ ✓\n③ 기계 가공 भनेको मेसिन प्रशोधन हो ✗\n④ 원사 가공 भनेको कच्चा धागो प्रशोधन हो ✗"}, {"n": "320", "q": "석유 같은 화학 물질로 만든 인공 섬유입니다. 나일론, 폴리에스터, 아크릴 등이 있으며, 질기고 잘 마르며 주름이 잘 생기지 않는 특징이 있습니다.", "options": ["합성 섬유", "천연 섬유", "기계 가공", "원사 가공"], "answer": 0, "explain": "प्रश्नको अर्थ: यो रसायन वा खनिज तेल प्रयोग गरेर मानिसले बनाएको कृत्रिम रेशा हो। यो बलियो हुन्छ र छिटै सुक्छ।\n① 합성 섬유 भनेको रासायनिक पदार्थबाट बनेको कृत्रिम फाइबर हो ✓\n② 천연 섬유 भनेको प्राकृतिक फाइबर हो ✗\n③ 기계 가공 भनेको मेसिन प्रशोधन हो ✗\n④ 원사 가공 भनेको कच्चा धागो प्रशोधन हो ✗"}, {"n": "321", "q": "어떤 물질에 섞여 있는 원래와 다른 성분이나 더러운 것을 말합니다. 예를 들어, 깨끗한 물에 섞인 먼지나 기름 같은 것입니다.", "options": ["음식재료", "불순물", "음료수", "돌출물"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कुनै वस्तु वा सफा पानीमा मिसिएको फोहोर वा फरक तत्वलाई बुझाउँछ। यसले मुख्य वस्तुलाई धमिलो वा अशुद्ध बनाउँछ।\n① 음식재료 भनेको खानेकुरा बनाउने सामग्री हो ✗\n② 불순물 भनेको कुनै पनि पदार्थमा मिसाइएको वा मिसिएको मौलिक नभएको अशुद्ध तत्त्व वा फोहर हो ✓\n③ 음료수 भनेको पिउने पानी वा पेय पदार्थ हो ✗\n④ 돌출물 भनेको बाहिर निस्केको वस्तु हो ✗"}, {"n": "322", "q": "길고 가느다란 나무나 쇠, 플라스틱 등의 막대 모양 물체를 말합니다. 장난감, 도구, 운동기구 등 다양한 곳에서 쓰이며, 손으로 잡기 쉬운 형태입니다.", "options": ["연필", "빗자루", "막대기", "대걸레"], "answer": 2, "explain": "प्रश्नको अर्थ: यो काठ, फलाम वा प्लास्टिकबाट बनेको लामो र पातलो वस्तु हो। यसलाई हातले सजिलैसँग समात्न सकिन्छ र धेरै प्रकारका औजार वा सामानमा प्रयोग गरिन्छ।\n① 연필 भनेको पेन्सिल हो ✗\n② 빗자루 भनेको कुचो हो ✗\n③ 막대기 भनेको लामो र पातलो काठ, फलाम वा प्लास्टिकको छडी वा लठ्ठी हो ✓\n④ 대걸레 भनेको भुइँ पुछ्ने मप हो ✗"}, {"n": "323", "q": "건축물을 짓거나 가구 따위를 만들 때 필요한 기본적인 나무로 된 재료입니다.", "options": ["벽돌", "목재", "철근", "모래"], "answer": 1, "explain": "प्रश्नको अर्थ: यो घर वा भवन बनाउँदा र फर्निचर तयार पार्दा चाहिने काठको मुख्य कच्चा पदार्थ हो। निर्माण कार्यमा यसको ठूलो महत्त्व हुन्छ।\n① 벽돌 भनेको इँटा हो ✗\n② 목재 भनेको भवन बनाउँदा वा फर्निचर बनाउँदा चाहिने आधारभूत काठको सामग्री हो ✓\n③ 철근 भनेको स्टिलको रड हो ✗\n④ 모래 भनेको बालुवा हो ✗"}, {"n": "324", "q": "가구를 만들 때 가장 먼저 하는 일로, 원목을 용도에 맞게 정확한 크기로 재는 것을 말합니다.", "options": ["샌딩", "도색", "재단", "조립"], "answer": 2, "explain": "प्रश्नको अर्थ: यो फर्निचर बनाउने क्रममा काठलाई आवश्यक आकार र साइज अनुसार नाप्ने र काट्ने पहिलो काम हो। यसले सामानलाई सही नापमा बनाउन मद्दत गर्छ।\n① 샌딩 भनेको सिरिष कागजले घोटेर चिल्लो पार्ने काम हो। यो काठलाई सम्म बनाउने काम हो, त्यसैले यो होइन। ✗\n② 도색 भनेको रङ लगाउने काम हो। यो सामानमा रङ पोख्ने वा लगाउने काम हो ✗\n③ 재단 भनेको नापेर काट्ने काम हो। फर्निचर बनाउँदा काठलाई चाहिएको आकारमा सही नाप लिएर काट्नुलाई जनाउँछ ✓\n④ 조립 भनेको जोड्ने काम हो। छुटिएका भागहरूलाई मिलाएर सामान बनाउनु हो, त्यसैले यो होइन। ✗"}, {"n": "325", "q": "목재의 표면을 평평하게 하고 두께를 줄이며, 매끄러운 표면을 부여하는 데 사용합니다.", "options": ["갈퀴", "망치", "대패", "바이스"], "answer": 2, "explain": "प्रश्नको अर्थ: यो काठको बाहिरी भागलाई चेप्टो, चिल्लो र सम्म बनाउन प्रयोग गरिने एउटा औजार हो। यसले काठको बाक्लो भागलाई घटाउन पनि सघाउँछ।\n① 갈퀴 भनेको घाँस वा पात बटुल्ने औजार हो ✗\n② 망치 भनेको हथौडा हो ✗\n③ 대패 भनेको काठको सतह चिल्लो बनाउन, मोटाइ घटाउन र चिल्लो सतह प्रदान गर्न प्रयोग गरिने रन्दा (प्लेन) हो ✓\n④ 바이스 भनेको भाइस (पकड्ने औजार) हो ✗"}, {"n": "326", "q": "나무나 금속을 깎거나 파낼 때 쓰는 도구입니다. 끝이 날카롭고 손잡이가 달려 있어, 망치와 함께 사용하기도 합니다.", "options": ["톱", "축", "줄", "끌"], "answer": 3, "explain": "प्रश्नको अर्थ: यो काठ वा धातुलाई ताछ्न र दुलो पार्न प्रयोग गरिने तिखो औजार हो। यसमा समात्ने बिँड हुन्छ र कहिलेकाहीँ हथौडासँग मिलाएर प्रयोग गरिन्छ।\n① 톱 भनेको आरा हो ✗\n② 축 भनेको अक्ष (एक्सिस) हो ✗\n③ 줄 भनेको रेती हो ✗\n④ 끌 भनेको काठ वा धातु काट्ने वा खोप्ने छेनी हो, जसको टुप्पो तिखो हुन्छ र ह्यामरसँग पनि प्रयोग गरिन्छ ✓"}, {"n": "327", "q": "물건을 꽉 잡아 고정시키는 도구입니다. 목공, 금속 작업, 공예 등에서 두 물체를 움직이지 않게 붙잡아 줄 때 사용합니다.", "options": ["작업대", "클램프", "바이스", "장도리"], "answer": 1, "explain": "प्रश्नको अर्थ: यो काम गर्दा दुईवटा सामानलाई नहल्लिने गरी बलियोसँग समातेर राख्ने औजार हो। काठ र फलामको काम गर्दा वस्तुलाई स्थिर राख्न यसको प्रयोग हुन्छ।\n① 작업대 भनेको काम गर्ने टेबल हो ✗\n② 클램프 भनेको दुईवटा वस्तुलाई हल्लाउन नदिई च्यापेर कस्ने वा स्थिर बनाउने क्ल्याम्प हो ✓\n③ 바이스 भनेको भाइस हो ✗\n④ 장도리 भनेको नङ्ग्रा भएको हथौडा हो ✗"}, {"n": "328", "q": "가구의 표면을 매끄럽게 만들기 위해 문지르는 작업입니다. 사포나 기계를 사용해 거친 부분이나 흠집을 없애고, 페인트나 바니시를 잘 칠할 수 있도록 준비합니다.", "options": ["도장 작업", "가구 연마", "가구 판매", "밀링 작업"], "answer": 1, "explain": "प्रश्नको अर्थ: यो फर्निचरको खस्रो भाग र खोट हटाएर चिल्लो बनाउन घोट्ने काम हो। रङ लगाउनु भन्दा पहिले सामानलाई तयार पार्न यो काम गरिन्छ।\n① 도장 작업 भनेको पेन्टिङ वा कोटिंगको काम हो ✗\n② 가구 연마 भनेको फर्निचरको सतह चिल्लो बनाउनको लागि स्यान्डपेपर वा मेसिन प्रयोग गरेर घोट्ने काम हो ✓\n③ 가구 판매 भनेको फर्निचर बिक्री हो ✗\n④ 밀링 작업 भनेको मिलिङ मेसिनको काम हो ✗"}, {"n": "329", "q": "물체의 표면에 페인트나 니스 같은 재료를 칠하는 일입니다. 주로 보호하거나 색을 입히고, 보기 좋게 만들기 위해 가구, 건물, 금속 등에 칠합니다.", "options": ["가구 연마", "선반 기계", "도장 작업", "염색 작업"], "answer": 2, "explain": "प्रश्नको अर्थ: यो सामान, भवन वा फर्निचरलाई सुरक्षित राख्न र सुन्दर देखाउन रङ वा पालिस लगाउने काम हो। यसले वस्तुलाई सजिलै बिग्रन दिँदैन।\n① 가구 연마 भनेको फर्निचर घोट्ने काम हो ✗\n② 선반 기계 भनेको लेथ मेसिन हो ✗\n③ 도장 작업 भनेको वस्तुको सतहमा पेन्ट वा वार्निश जस्ता सामग्री लगाउने काम हो ✓\n④ 염색 작업 भनेको रङ लगाउने काम (कपडा आदिको) हो ✗"}, {"n": "330", "q": "물이나 약품 등을 가늘게 뿌릴 수 있게 만든 도구입니다. 식물에 물을 주거나, 청소, 도장 작업 등에 사용하며, 손으로 누르거나 압력을 이용해 작동합니다.", "options": ["분무기", "열풍기", "선풍기", "환풍기"], "answer": 0, "explain": "प्रश्नको अर्थ: यो पानी वा औषधि मसिनो गरी छर्कन प्रयोग गरिने औजार हो। बोटबिरुवामा पानी हाल्न र सरसफाइ गर्न यसको प्रयोग गरिन्छ।\n① 분무기 भनेको पानी वा औषधि आदि मसिनो गरी छर्कन मिल्ने गरी बनाएको स्प्रेयर (फुहारा) हो ✓\n② 열풍기 भनेको हिटर वा तातो हावा फाल्ने मेसिन हो ✗\n③ 선풍기 भनेको पङ्खा हो ✗\n④ 환풍기 भनेको भेन्टिलेटर वा हावा फेर्ने पङ्खा हो ✗"}, {"n": "331", "q": "작업을 시작하기 전에 각 부품에 이상이 없는지 기계를 작동시켜 확인해 보는 것입니다.", "options": ["재단", "포장", "사포질", "공회전"], "answer": 3, "explain": "प्रश्नको अर्थ: यो काम सुरु गर्नु भन्दा अगाडि मेसिनका भागहरू सही छन् कि छैनन् भनेर खाली चलाएर हेर्ने काम हो। यसले काम गर्दा हुने दुर्घटनाबाट बचाउँछ।\n① 재단 भनेको कपडा वा काठ काट्ने काम हो ✗\n② 포장 भनेको प्याकिङ गर्ने काम हो ✗\n③ 사포질 भनेको स्यान्डपेपरले घस्ने काम हो ✗\n④ 공회전 भनेको काम सुरु गर्नु अघि मेसिन चलाएर ठीक भए नभएको जाँच्ने काम हो ✓"}, {"n": "332", "q": "물체의 표면을 갈아서 매끄럽게 만들거나 거친 부분을 제거하는 도구입니다. 작은 모래 알갱이처럼 거친 입자가 붙어 있어 나무나 금속 등을 다듬을 때 사용합니다.", "options": ["망치", "사포", "펜치", "가위"], "answer": 1, "explain": "प्रश्नको अर्थ: यो काठ वा धातुको खस्रो भागलाई घोटेर चिल्लो बनाउन प्रयोग गरिने कागज वा औजार हो। यसको सतहमा मसिनो बालुवा जस्तै खस्रो वस्तु टाँसिएको हुन्छ।\n① 망치 भनेको हथौडा हो ✗\n② 사포 भनेको स्यान्डपेपर हो जुन वस्तुको सतह चिल्लो बनाउन प्रयोग गरिन्छ ✓\n③ 펜치 भनेको पेंचर वा चिम्टा हो ✗\n④ 가위 भनेको कैँची हो ✗"}, {"n": "333", "q": "가구, 벽, 자동차 등의 틈이나 구멍을 메우고 평평하게 만들기 위해 쓰는 반죽 같은 재료입니다.", "options": ["사포", "홈", "퍼티", "붓"], "answer": 2, "explain": "प्रश्नको अर्थ: यो काठ, भित्ता वा गाडीका साना प्वाल र फुटेका ठाउँ भर्न प्रयोग गरिने बाक्लो लेदो जस्तो पदार्थ हो। यसले सतहलाई सम्म बनाउन मद्दत गर्छ।\n① 사포 भनेको स्यान्डपेपर हो ✗\n② 홈 भनेको खोल्सा वा काप हो ✗\n③ 퍼티 भनेको प्वाल वा खाडल भर्ने पेस्टजस्तो सामग्री हो ✓\n④ 붓 भनेको पेन्ट गर्ने ब्रस हो ✗"}, {"n": "334", "q": "페인트나 색칠을 잘 먹게 하기 위해 표면에 먼저 바르는 하얀 밑칠용 재료입니다. 나무, 종이, 플라스틱 등에 칠해서 색이 잘 붙고 오래 유지되도록 도와줍니다.", "options": ["바니시", "롤러", "퍼티", "젯소"], "answer": 3, "explain": "प्रश्नको अर्थ: यो रङ राम्रोसँग टाँसियोस् भनेर मुख्य रङ लगाउनु भन्दा अघि लगाइने सेतो जग रङ हो। यसले काठ वा प्लाष्टिकमा रङलाई लामो समयसम्म टिकाउँछ।\n① 바니시 भनेको वार्निश हो ✗\n② 롤러 भनेको रोलर हो ✗\n③ 퍼티 भनेको पुट्टी हो ✗\n④ 젯소 भनेको रङ लगाउनु अघि लगाइने सेतो बेस कोट हो ✓"}, {"n": "335", "q": "뜨거운 바람을 내보내는 기계로, 물건을 건조시킬 때 사용합니다. 페인트나 퍼티를 빨리 말리거나, 작업장에서 따뜻한 바람으로 난방할 때도 쓰입니다.", "options": ["선풍기", "열풍기", "환풍기", "소화기"], "answer": 1, "explain": "प्रश्नको अर्थ: यो तातो हावा फालेर वस्तुहरू छिटो सुकाउन प्रयोग गरिने मेसिन हो। रङ सुकाउन वा काम गर्ने ठाउँलाई न्यानो पार्न यसको प्रयोग गरिन्छ।\n① 선풍기 भनेको पङ्खा हो ✗\n② 열풍기 भनेको तातो हावा फाल्ने हिटर मेसिन हो ✓\n③ 환풍기 भनेको भेन्टिलेटर वा हावा फेर्ने पंखा हो ✗\n④ 소화기 भनेको अग्नििनियन्त्रक यन्त्र हो ✗"}, {"n": "336", "q": "집이나 건물 구조에 고정되어 설치된 가구를 말합니다. 이런 가구를 사용하면 공간을 효율적으로 활용할 수 있습니다.", "options": ["빌트인 가구", "사무용 가구", "조립식 가구", "이동식 가구"], "answer": 0, "explain": "प्रश्नको अर्थ: यो घर वा कोठाको भित्तामा स्थायी रूपमा जोडिएर बनाइएको फर्निचर हो। यसले कोठाको ठाउँ बचाउन धेरै मद्दत गर्छ।\n① 빌트인 가구 भनेको भित्ता वा संरचनामा फिट गरिएको बिल्ट-इन फर्निचर हो ✓\n② 사무용 가구 भनेको अफिसको फर्निचर हो ✗\n③ 조립식 가구 भनेको जोडिने फर्निचर हो ✗\n④ 이동식 가구 भनेको सार्न मिल्ने फर्निचर हो ✗"}, {"n": "337", "q": "물건을 정리하고 보관하는 데 쓰는 장입니다. 옷, 책, 식기, 생활용품 등을 깔끔하게 넣어두기 좋으며, 서랍이나 문이 있는 형태가 많습니다.", "options": ["옷장", "책장", "수납장", "장식장"], "answer": 2, "explain": "प्रश्नको अर्थ: यो लुगा, किताब वा घरायसी सामानहरू मिलाएर राख्न प्रयोग गरिने घरको दराज वा दराज जस्तै फर्निचर हो। यसमा ढोका वा घर्राहरू हुन्छन्।\n① 옷장 भनेको दराज (वार्डरोब) हो ✗\n② 책장 भनेको पुस्तकको दराज हो ✗\n③ 수납장 भनेको सामान मिलाएर राख्ने भण्डारण क्याबिनेट हो ✓\n④ 장식장 भनेको सजावटको दराज हो ✗"}, {"n": "338", "q": "철로 만든 막대기를 뜻하며, 보통 콘크리트 구조물에 보강재로 쓰이는 강철봉을 말합니다.", "options": ["자갈", "철근", "벽돌", "전선"], "answer": 1, "explain": "प्रश्नको अर्थ: यो घर वा पुल बनाउँदा ढलानलाई बलियो बनाउन प्रयोग गरिने फलामको डन्डी हो। यसले सिमेन्टको संरचनालाई मजबुत बनाउँछ।\n① 자갈 भनेको गिट्टी हो ✗\n② 철근 भनेको स्टिलको रड हो ✓\n③ 벽돌 भनेको इँटा हो ✗\n④ 전선 भनेको बिजुलीको तार हो ✗"}, {"n": "339", "q": "철근을 서로 묶는 철사로 철근이 움직이지 않도록 고정해 줍니다. 주로 얇고 잘 구부러지는 철사로 만들어집니다.", "options": ["장도리", "절단기", "결속선", "결속 핸들"], "answer": 2, "explain": "प्रश्नको अर्थ: यो निर्माण कार्यमा फलामका डन्डीहरूलाई नहल्लिने गरी आपसमा बाँध्न प्रयोग गरिने पातलो तार हो। यो सजिलैसँग मोड्न सकिन्छ।\n① 장도리 भनेको ह्यामर हो ✗\n② 절단기 भनेको काट्ने मेसिन हो ✗\n③ 결속선 भनेको स्टिलको रड बाँध्ने तार हो ✓\n④ 결속 핸들 भनेको बाँध्ने ह्यान्डल हो ✗"}, {"n": "340", "q": "어두운 곳에서 앞을 잘 볼 수 있도록 손에 들고 사용하는 작은 전등입니다. 전기로 빛을 내며, 건전지를 넣어 사용하는 경우가 많고, 야간 활동 등에 자주 쓰입니다.", "options": ["전구", "형광등", "충전기", "손전등"], "answer": 3, "explain": "प्रश्नको अर्थ: यो अँध्यारोमा बाटो वा वस्तु देख्न हातमा लिएर हिँडिने सानो बत्ती हो। यसमा ब्याट्री हालेर राति हिँड्दा वा काम गर्दा प्रयोग गरिन्छ।\n① 전구 भनेको बल्ब हो ✗\n② 형광등 भनेको फ्लोरोसेन्ट लाइट हो ✗\n③ 충전기 भनेको चार्जर हो ✗\n④ 손전등 भनेको टर्चलाइट हो ✓"}, {"n": "341", "q": "두 개 이상의 선이나 물체가 만나는 곳을 말합니다. 예를 들어, 철근 공사에서는 철근 두 개가 서로 만나서 X자처럼 겹치는 부분입니다.", "options": ["교차점", "종착점", "결속선", "장단점"], "answer": 0, "explain": "प्रश्नको अर्थ: यो दुई वा सोभन्दा बढी रेखा वा वस्तुहरू आपसमा भेटिने ठाउँ हो। जस्तै निर्माण काममा दुईवटा फलामका रडहरू आपसमा भेटिएर काटाकाटी हुने भागलाई जनाउँछ।\n① 교차점 भनेको काटिने बिन्दु वा क्रसिङ हो ✓\n② 종착점 भनेको अन्तिम गन्तव्य हो ✗\n③ 결속선 भनेको बाँध्ने तार हो ✗\n④ 장단점 भनेको फाइदा र बेफाइदा हो, त्यसैले यो मिल्दैन। किताबमा दोस्रो विकल्प '종작점' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '종착점' हो। ✗"}, {"n": "342", "q": "보통 콘크리트, 철근, 철강 등 강한 재료로 만들어지며, 건물이나 다리, 교량 등에서 중요한 지지대 역할을 합니다.", "options": ["철근", "기둥", "지붕", "마당"], "answer": 1, "explain": "प्रश्नको अर्थ: यो सामान्यतया कङ्क्रिट र फलाम जस्ता बलिया सामग्रीबाट बनाइन्छ। यसले घर वा पुललाई लड्न नदिई अड्याएर राख्ने मुख्य खम्बाको काम गर्छ।\n① 철근 भनेको स्टिलको रड हो ✗\n② 기둥 भनेको पिलर वा खाँबो हो ✓\n③ 지붕 भनेको छानो हो ✗\n④ 마당 भनेको आँगन हो ✗"}, {"n": "343", "q": "건물, 시설물 등을 새로 짓거나 오래된 건물, 시설물들을 처리하는 곳입니다.", "options": ["공장", "농장", "사업장", "공사장"], "answer": 3, "explain": "प्रश्नको अर्थ: यो नयाँ भवन वा संरचनाहरू निर्माण गर्ने वा पुराना संरचनाहरू भत्काउने काम भइरहेको ठाउँ हो।\n① 공장 भनेको कारखाना हो ✗\n② 농장 भनेको फार्म हो ✗\n③ 사업장 भनेको कार्यस्थल हो ✗\n④ 공사장 भनेको निर्माण स्थल हो ✓"}, {"n": "344", "q": "사람이나 차량이 쉽게 건너도록 도와주며, 보통 콘크리트, 철강, 철근 등 강한 재료로 만들어집니다. 도로, 철도, 하수도 등 다양한 용도로 사용되며, 두 지역을 연결하는 중요한 역할을 합니다.", "options": ["육교", "지하", "교량", "신호등"], "answer": 2, "explain": "प्रश्नको अर्थ: यो मानिस वा गाडीहरू सजिलै पार गर्न सकून् भनेर बनाइएको बलियो ढाँचा हो। यसले दुईवटा क्षेत्र वा किनारलाई आपसमा जोड्ने काम गर्छ।\n① 육교 भनेको ओभरहेड ब्रिज (आकाशे पुल) हो ✗\n② 지하 भनेको भूमिगत हो ✗\n③ 교량 भनेको पुल (ब्रिज) हो ✓\n④ 신호등 भनेको ट्रफिक लाइट हो ✗"}, {"n": "345", "q": "공사를 할 때 땅이나 암석 따위를 파거나 파낸 것을 처리하는 기계입니다.", "options": ["불도저", "굴착기", "화물차", "굴착기"], "answer": 1, "explain": "प्रश्नको अर्थ: यो निर्माण कार्य गर्दा माटो वा चट्टान खन्ने र खनेको माटो पन्छाउने काममा प्रयोग गरिने ठूलो मेसिन हो।\n'불도저' भनेको जमिन सम्याउने मेसिन हो, त्यसैले यो माटो खन्ने मेसिन होइ
