<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<title>EPS-TOPIK Vocabulary Quiz — 520 Questions</title>
<style>
  :root {
    --primary: #7c3aed;
    --primary-dark: #5b21b6;
    --primary-soft: #f5f3ff;
    --pink: #db2777;
    --orange: #f97316;
    --grad: linear-gradient(135deg, #6d28d9 0%, #a21caf 48%, #db2777 78%, #f97316 100%);
    --grad-soft: linear-gradient(135deg, #f5f3ff, #fdf2f8);
    --green: #047857;
    --green-bg: #d1fae5;
    --red: #be123c;
    --red-bg: #ffe4e6;
    --bg: #faf8ff;
    --card: #ffffff;
    --text: #1e1b2e;
    --muted: #6b7280;
    --border: #e9e4fb;
    --shadow: 0 2px 6px rgba(109,40,217,.07), 0 10px 28px rgba(109,40,217,.08);
    --shadow-lg: 0 8px 24px rgba(109,40,217,.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans KR", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(600px 300px at 85% -5%, rgba(219,39,119,.12), transparent 60%), radial-gradient(500px 260px at -5% 10%, rgba(124,58,237,.12), transparent 60%); background-attachment: fixed; color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.94); color: #6d28d9; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; box-shadow: 0 2px 10px rgba(0,0,0,.2); margin-bottom: 14px; transition: transform .15s, box-shadow .15s; }
  .back-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.24); }
  header { background: var(--grad); color: #fff; padding: 26px 16px 20px; position: relative; box-shadow: 0 4px 24px rgba(109,40,217,.35); overflow: hidden; }
  header::before { content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28), transparent 65%); top: -160px; right: -60px; pointer-events: none; }
  header::after { content: ""; position: absolute; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.18), transparent 65%); bottom: -140px; left: -40px; pointer-events: none; }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.55rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.18); }
  header p { opacity: .94; font-size: .92rem; margin-top: 4px; }
  .progress-wrap { margin-top: 14px; background: rgba(255,255,255,.28); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.15); }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #fde68a, #ffffff); width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(255,255,255,.7); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .85; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: #c4b5fd; }
  .q-num { display: inline-block; font-size: .78rem; font-weight: 800; color: #fff; background: var(--grad); padding: 4px 14px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 8px rgba(219,39,119,.35); }
  .q-text { font-size: 1.12rem; white-space: pre-line; margin: 10px 0 16px; line-height: 1.85; font-weight: 500; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid var(--border); border-radius: 14px; margin-bottom: 9px; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #fff; }
  .options label:hover { border-color: #a78bfa; background: #fbf9ff; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(124,58,237,.12); }
  .options label::before { content: ""; flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; border: 2px solid #c7c2f5; background: #fff; transition: all .15s; }
  .options label.selected { background: var(--grad-soft); border-color: var(--primary); box-shadow: 0 4px 16px rgba(124,58,237,.18); }
  .options label.selected::before { border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 4px #fff; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #db2777; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 700; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 4px 16px rgba(219,39,119,.4); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 8px 22px rgba(219,39,119,.45); }
  .btn-primary:disabled { background: #d6d3f5; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: #fff; color: #6d28d9; border: 2px solid #e9e4fb; }
  .btn-ghost:hover { border-color: #a78bfa; background: #fbf9ff; }
  .submit-bar { position: sticky; bottom: 0; background: rgba(255,255,255,.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 20px rgba(109,40,217,.1); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: var(--grad); color: #fff; border: none; border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; color: #fff; line-height: 1.05; text-shadow: 0 2px 16px rgba(0,0,0,.2); }
  .score-card .pct { font-size: 1.15rem; color: rgba(255,255,255,.94); margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: rgba(255,255,255,.96); }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 2px 10px rgba(219,39,119,.35); }
  .review-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: linear-gradient(135deg, #059669, #10b981); }
  .verdict.no { background: linear-gradient(135deg, #e11d48, #f43f5e); }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #f8f6ff; border: 1px solid #e9e4fb; border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; }
  .explain b { color: var(--primary-dark); }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin-bottom: 10px; }
  .explain-stem { background: linear-gradient(135deg, #ede9fe, #fce7f3); border-left: 4px solid #7c3aed; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; }
  .exp-line { padding: 10px 12px; border-top: 1px solid #e9e4fb; line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: var(--green); }
  .exp-mark.no { color: var(--red); }
  .exp-note { background: linear-gradient(135deg, #fffbeb, #fef3c7); border: 1px solid #fcd34d; border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }

</style>
</head>
<body>
<header>
  <div class="header-inner">
    
    <h1>EPS-TOPIK 문제은행 Quiz</h1>
    <p>520 questions &bull; EPS-TOPIK Vocabulary &mdash; choose the word matching the description &bull; Answers are AI-generated (the book has no answer key) &mdash; check with a teacher &bull; Explanations in Nepali</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">0 / 520 answered</div>
    <div class="autosave-note">Progress will be auto-saved.</div>
  </div>
</header>

<main id="quizView">
  <div id="questionList"></div>
  <div class="pager">
    <button class="btn-ghost" id="prevBtn">&larr; Previous</button>
    <span class="page-info" id="pageInfo"></span>
    <button class="btn-ghost" id="nextBtn">Next &rarr;</button>
  </div>
</main>

<div class="submit-bar" id="submitBar">
  <div class="inner">
    <span class="hint" id="submitHint">Answer all 520, then submit.</span>
    <div style="display:flex; gap:8px; flex:none;">
      <button class="btn-ghost" id="clearBtn" style="padding:11px 16px;">Clear all</button>
      <button class="btn-primary" id="submitBtn">Submit Quiz</button>
    </div>
  </div>
</div>

<main id="resultView" class="hidden">
  <div class="score-card">
    <div class="big" id="scoreBig"></div>
    <div class="pct" id="scorePct"></div>
    <div class="msg" id="scoreMsg"></div>
    <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-primary" id="retryBtn">Try Again</button>
      <button class="btn-ghost" id="reviewTopBtn">Back to top</button>
    </div>
  </div>
  <div class="filters">
    <button class="btn-ghost active" data-filter="all">All questions</button>
    <button class="btn-ghost" data-filter="wrong">Wrong only</button>
    <button class="btn-ghost" data-filter="correct">Correct only</button>
  </div>
  <div id="reviewList"></div>
</main>

ain": "पहिलो विकल्प 교사 भनेको शिक्षक हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 의사 भनेको डाक्टर हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 학생 भनेको विद्यालय वा शिक्षण संस्थामा पढेर ज्ञान आर्जन गर्ने विद्यार्थी हो, जुन सही उत्तर हो। चौथो विकल्प 봉사자 भनेको स्वयंसेवक हो, त्यसैले यो मिल्दैन। सही उत्तर 학생 हो जसको अर्थ विद्यार्थी हो।"}, {"n": "6", "q": "사기업에서 일하는 직장인을 가리키고 보통 일정한 직무를 수행하며 기업에 소속되어 급여를 받는 사람을 말합니다.", "options": ["공무원", "회사원", "경찰관", "승무원"], "answer": 1, "explain": "공무원 भनेको सरकारी कर्मचारी हो, यो निजी क्षेत्रमा काम गर्नेको वर्णन होइन। 회사원 भनेको कम्पनीमा काम गर्ने कर्मचारी हो, जसले संस्थामा आबद्ध भएर काम गर्छ र तलब पाउँछ र प्रश्नसँग मिल्छ। 경찰관 भनेको प्रहरी हो, यो कार्यालयको कर्मचारी होइन। 승무원 भनेको विमानको कर्मचारी हो, यो सामान्य कार्यालयको कामसँग सम्बन्धित छैन। सही उत्तर २ हो र यसको अर्थ कम्पनीको कर्मचारी हो।"}, {"n": "7", "q": "돈을 받고 일을 하는 사람을 의미한데 주로 공장이나 건설 현장에서 일하며, 자신의 노동을 제공하고 대가를 받습니다.", "options": ["근로자", "간호사", "변호사", "요리사"], "answer": 0, "explain": "पहिलो विकल्प 근로자 भनेको ज्यालादारी वा तलबका लागि काम गर्ने कामदार वा श्रमिक हो, जुन सही उत्तर हो। दोस्रो विकल्प 간호사 भनेको नर्स हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 변호사 भनेको वकिल हो, त्यसैले यो मिल्दैन। चौथो विकल्प 요리사 भनेको भान्से हो, त्यसैले यो मिल्दैन। सही उत्तर 근로자 हो जसको अर्थ श्रमिक वा कामदार हो।"}, {"n": "8", "q": "지역 사람들이 안전을 위해 법과 질서를 지키고, 범죄를 예방하거나 해결하는 일을 하는 사람을 의미합니다.", "options": ["공무원", "회사원", "소방관", "경찰관"], "answer": 3, "explain": "पहिलो विकल्प 공무원 भनेको सरकारी कर्मचारी हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 회사원 भनेको कम्पनीको कर्मचारी हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 소방관 भनेको दमकलकर्मी वा अग्नि नियन्त्रक हो, त्यसैले यो मिल्दैन। चौथो विकल्प 경찰관 भनेको जनताको सुरक्षा, कानुन पालना र अपराध रोकथाम गर्ने प्रहरी हो, जुन सही उत्तर हो। सही उत्तर 경찰관 हो जसको अर्थ प्रहरी हो।"}, {"n": "9", "q": "화재를 진압하고 사람들의 안전을 지키는 일을 하는 사람으로 화재 발생 시 신속하게 대응하여 피해를 최소화하고, 구조 활동도 수행합니다.", "options": ["공무원", "소방관", "경찰관", "승무원"], "answer": 1, "explain": "पहिलो विकल्प 공무원 भनेको सरकारी कर्मचारी हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 소방관 भनेको आगो निभाउने र उद्धार कार्य गर्ने अग्नि नियन्त्रक वा दमकलकर्मी हो, जुन सही उत्तर हो। तेस्रो विकल्प 경찰관 भनेको प्रहरी हो, त्यसैले यो मिल्दैन। चौथो विकल्प 승무원 भनेको विमान परिचारिका हो, त्यसैले यो मिल्दैन। सही उत्तर 소방관 हो जसको अर्थ अग्नि नियन्त्रक हो।"}, {"n": "10", "q": "나라나 지방자치단체를 위해 일하는 사람을 의미하고 법에 따라 임명되어 공공의 일을 수행합니다.", "options": ["승무원", "회사원", "벽돌공", "공무원"], "answer": 3, "explain": "पहिलो विकल्प 승무원 भनेको विमान परिचारिका हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 회사원 भनेको कम्पनीको कर्मचारी हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 벽돌공 भनेको डकर्मी हो, त्यसैले यो मिल्दैन। चौथो विकल्प 공무원 भनेको देश वा स्थानीय सरकारका लागि कानुनबमोजिम नियुक्त भई काम गर्ने सरकारी कर्मचारी हो, जुन सही उत्तर हो। सही उत्तर 공무원 हो जसको अर्थ सरकारी कर्मचारी हो।"}, {"n": "11", "q": "의학 학위를 가지고 병이나 상처를 치료하며 사람의 건강을 돌보는 일을 하는 사람을 의미합니다.", "options": ["어부", "의사", "농부", "학생"], "answer": 1, "explain": "पहिलो विकल्प 어부 भनेको माछा मार्ने मानिस हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 의사 भनेको चिकित्साशास्त्रको उपाधि प्राप्त गरी बिरामीको उपचार गर्ने डाक्टर हो, जुन सही उत्तर हो। तेस्रो विकल्प 농부 भनेको किसान हो, त्यसैले यो मिल्दैन। चौथो विकल्प 학생 भनेको विद्यार्थी हो, त्यसैले यो मिल्दैन। सही उत्तर 의사 हो जसको अर्थ डाक्टर हो।"}, {"n": "12", "q": "의학 학위를 가지고 환자를 돌보고 의사를 도와 치료를 지원하는 일을 하는 사람을 의미합니다.", "options": ["의사", "간호사", "변호사", "기술자"], "answer": 1, "explain": "पहिलो विकल्प 의사 भनेको डाक्टर हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 간호사 भनेको बिरामीको हेरचाह गर्ने र डाक्टरको उपचारमा सहयोग गर्ने नर्स हो, जुन सही उत्तर हो। तेस्रो विकल्प 변호사 भनेको वकिल हो, त्यसैले यो मिल्दैन। चौथो विकल्प 기술자 भनेको प्राविधिक हो, त्यसैले यो मिल्दैन। सही उत्तर 간호사 हो जसको अर्थ नर्स हो।"}, {"n": "13", "q": "식당, 호텔, 카페 등에서 다양한 음식을 만들고 조리하는 일을 전문적으로 하는 사람을 의미합니다.", "options": ["승무원", "회사원", "간호사", "요리사"], "answer": 3, "explain": "पहिलो विकल्प 승무원 भनेको विमान परिचारिका हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 회사원 भनेको कम्पनीको कर्मचारी हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 간호사 भनेको नर्स हो, त्यसैले यो मिल्दैन। चौथो विकल्प 요리사 भनेको रेस्टुरेन्ट, होटल आदि ठाउँमा विभिन्न खानेकुरा बनाउने भान्से वा सेफ हो, जुन सही उत्तर हो। सही उत्तर 요리사 हो जसको अर्थ भान्से हो।"}, {"n": "14", "q": "자동차, 버스, 트럭 등 다양한 차량을 전문적으로 운전하는 일을 하는 사람을 의미합니다. 승객이나 물건을 안전하게 목적지까지 운송하는 것이 주된 역할입니다.", "options": ["기술자", "회사원", "연구원", "운전기사"], "answer": 3, "explain": "पहिलो विकल्प 기술자 भनेको प्राविधिक हो, त्यसैले यो मिल्दैन। दोस्रो विकल्प 회사원 भनेको कम्पनीको कर्मचारी हो, त्यसैले यो मिल्दैन। तेस्रो विकल्प 연구원 भनेको अनुसन्धानकर्ता हो, त्यसैले यो मिल्दैन। चौथो विकल्प 운전기사 भनेको गाडी, बस, ट्रक आदि चलाउने चालक हो, जुन सही उत्तर हो। सही उत्तर 운전기사 हो जसको अर्थ चालक हो।"}, {"n": "15", "q": "특정 분야에서 전문적인 기술과 지식을 가지고 일하는 사람을 의미한데 주로 기계, 전자, IT 등 다양한 분야에서 문제를 해결하거나 제품을 개발하는 역할을 합니다.", "options": ["기술자", "전기공", "변호사", "요리사"], "answer": 0, "explain": "기술자 भनेको प्राविधिक वा इञ्जिनियर हो, जसले विशेष क्षेत्रमा प्राविधिक ज्ञान प्रयोग गरेर समस्या समाधान गर्छ र प्रश्नसँग मिल्छ। 전기공 भनेको बिजुलीको काम गर्ने मिस्त्री हो, यो सबै प्राविधिक क्षेत्रसँग मात्र जोडिएको हुँदैन। 변호사 भनेको वकिल हो, यो प्राविधिक उत्पादन विकास गर्ने व्यक्ति होइन। 요리사 भनेको भान्से हो, यो प्राविधिक वा इञ्जिनियर होइन। सही उत्तर १ हो र यसको अर्थ प्राविधिक हो।"}, {"n": "16", "q": "나무를 사용하여 가구나 건축물 등의 물건을 만드는 일을 하는 사람으로 나무를 자르고 다듬어 필요한 형태로 만드는 기술을 가진 전문가입니다.", "options": ["주부", "어부", "목수", "의사"], "answer": 2, "explain": "पहिलो विकल्पको '주부' को अर्थ गृहणी वा गृहिणी हो, यो रूख काट्ने कामसँग सम्बन्धित छैन त्यसैले यो मिलेन। दोस्रो विकल्पको '어부' को अर्थ माछा मार्ने मानिस हो, यो काठको कामसँग मिल्दैन त्यसैले यो मिलेन। तेस्रो विकल्पको '목수' को अर्थ सिकारी वा डकर्मी (काठको काम गर्ने मानिस) हो, जसले काठ काटेर विभिन्न आकारका वस्तुहरू बनाउँछ, त्यसैले यो सही उत्तर हो। चौथो विकल्पको '의사' को अर्थ डाक्टर हो, यो काठको काम गर्ने मानिस होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प ३ हो जसको अर्थ काठको काम गर्ने मानिस (목수) हुन्छ।"}, {"n": "17", "q": "논밭에서 농사를 짓고, 작물을 재배하거나 축사에서 가축을 기르는 일을 하는 사람을 말합니다.", "options": ["어부", "목수", "농부", "주부"], "answer": 2, "explain": "पहिलो विकल्पको '어부' को अर्थ माछा मार्ने मानिस हो, यो खेतीपाती गर्ने मानिससँग मिल्दैन त्यसैले यो मिलेन। दोस्रो विकल्पको '목수' को अर्थ काठको काम गर्ने मानिस हो, यो किसान होइन त्यसैले यो मिलेन। तेस्रो विकल्पको '농부' को अर्थ किसान हो, जसले खेतबारीमा खेती गर्ने र पशुपालन गर्ने काम गर्छ, त्यसैले यो सही उत्तर हो। चौथो विकल्पको '주부' को अर्थ गृहणी हो, यो खेतीकिसानी गर्ने व्यक्तिसँग सम्बन्धित छैन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प ३ हो जसको अर्थ किसान (농부) हुन्छ।"}, {"n": "18", "q": "바다나 강에서 물고기를 잡아 생계를 유지하는 사람을 의미합니다. 어획물을 잡고 이를 판매하거나 소비하는 일을 합니다.", "options": ["어부", "목수", "선수", "주부"], "answer": 0, "explain": "어부 भनेको माछा मार्ने मानिस हो, जसले समुद्र वा नदीमा माछा समातेर जीविकोपार्जन गर्छ र प्रश्नसँग मिल्छ। 목수 भनेको सिकर्मी हो, यो माछा मार्ने व्यक्ति होइन। 선수 भनेको खेलाडी हो, यो माछा मार्ने पेसा होइन। 주부 भनेको गृहणी हो, यो माछा मार्ने कामसँग सम्बन्धित छैन। सही उत्तर १ हो र यसको अर्थ माछा मार्ने मानिस हो।"}, {"n": "19", "q": "금속을 녹여서 이어 붙이는 작업을 하는 사람을 의미합니다. 주로 건설 현장이나 공장에서 금속 구조물을 만들거나 수리하는 역할을 합니다.", "options": ["경찰관", "소방관", "용접공", "벽돌공"], "answer": 2, "explain": "पहिलो विकल्पको '경찰관' को अर्थ प्रहरी हो, यो धातु जोड्ने काम गर्ने मानिससँग मिल्दैन त्यसैले यो मिलेन। दोस्रो विकल्पको '소방관' को अर्थ दमकलकर्मी हो, यो वेल्डिङ गर्ने कामसँग सम्बन्धित छैन त्यसैले यो मिलेन। तेस्रो विकल्पको '용접공' को अर्थ वेल्डर वा डकर्मी (धातु जोड्ने काम गर्ने मिस्त्री) हो, जसले धातु पगालेर जोड्ने काम गर्छ, त्यसैले यो सही उत्तर हो। चौथो विकल्पको '벽돌공' को अर्थ इँटा लगाउने कामदार हो, यो धातुको काम गर्ने मानिस होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प ३ हो जसको अर्थ वेल्डर (용접공) हुन्छ।"}, {"n": "20", "q": "특정 스포츠나 경기에서 전문적으로 활동하는 사람을 의미합니다. 주로 팀이나 개인의 일원으로 경기에 참가하며, 뛰어난 실력을 가진 사람을 가리킵니다.", "options": ["의사", "선수", "가수", "어부"], "answer": 1, "explain": "पहिलो विकल्पको '의사' को अर्थ डाक्टर हो, यो खेलकुद क्षेत्रको व्यक्तिसँग मिल्दैन त्यसैले यो मिलेन। दोस्रो विकल्पको '선수' को अर्थ खेलाडी हो, जसले खेलकुदमा पेशेवर रूपमा भाग लिन्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्पको '가수' को अर्थ गायक हो, यो खेलकुद क्षेत्रसँग सम्बन्धित छैन त्यसैले यो मिलेन। चौथो विकल्पको '어부' को अर्थ माछा मार्ने मानिस हो, यो खेलाडीसँग मिल्दैन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प २ हो जसको अर्थ खेलाडी (선수) हुन्छ।"}, {"n": "21", "q": "뉴스나 정보를 수집하고, 이를 작성하여 대중에게 전달하는 일을 하는 사람으로 신문, 방송, 인터넷 등 다양한 매체를 통해 사건, 사고, 사회적 이슈 등을 보도합니다.", "options": ["어부", "기자", "목수", "교사"], "answer": 1, "explain": "पहिलो विकल्पको '어부' को अर्थ माछा मार्ने मानिस हो, यो समाचार संकलन गर्ने व्यक्तिसँग मिल्दैन त्यसैले यो मिलेन। दोस्रो विकल्पको '기자' को अर्थ पत्रकार हो, जसले समाचार र सूचना संकलन गरेर जनतालाई जानकारी दिन्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्पको '목수' को अर्थ काठको काम गर्ने मानिस हो, यो पत्रकार होइन त्यसैले यो मिलेन। चौथो विकल्पको '교사' को अर्थ शिक्षक हो, यो समाचार माध्यमसँग सम्बन्धित छैन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प २ हो जसको अर्थ पत्रकार (기자) हुन्छ।"}, {"n": "22", "q": "보통 사람이 속한 나라를 의미하며 어떤 국가의 시민권을 가진 상태를 가리킵니다.", "options": ["신분증", "명칭", "성명", "국적"], "answer": 3, "explain": "신분증 भनेको परिचय पत्र हो, यो देशको नागरिकताको अवस्था होइन। 명칭 भनेको नाम वा शीर्षक हो, यो नागरिकतासँग सम्बन्धित छैन। 성명 भनेको पूरा नाम हो, यो नागरिकताको स्थिति होइन। 국적 भनेको राष्ट्रियता हो, जसले व्यक्ति कुन देशको नागरिक हो भन्ने जनाउँछ र प्रश्नसँग मिल्छ। सही उत्तर ४ हो र यसको अर्थ राष्ट्रियता हो।"}, {"n": "23", "q": "대화나 행동을 하는 동안 함께 있는 사람을 의미합니다. 보통 대화나 논쟁, 경기 등에서 자신과 반대되는 사람을 가리킬 때 사용됩니다.", "options": ["친척", "도우미", "상대방", "룸메이트"], "answer": 2, "explain": "पहिलो विकल्पको '친척' को अर्थ नातेदार वा आफन्त हो, यो कुराकानी वा खेलमा विरोधी पक्षसँग मिल्दैन त्यसैले यो मिलेन। दोस्रो विकल्पको '도우미' को अर्थ सहयोगी हो, यो विपक्षी व्यक्ति होइन त्यसैले यो मिलेन। तेस्रो विकल्पको '상대방' को अर्थ विपक्षी वा अर्को पक्ष (साथमा रहेको वा प्रतिस्पर्धा गर्ने व्यक्ति) हो, त्यसैले यो सही उत्तर हो। चौथो विकल्पको '룸메이트' को अर्थ कोठा साथी हो, यो कुराकानी वा खेलमा विपरीत पक्षमा हुने मानिस होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प ३ हो जसको अर्थ विपक्षी वा अर्को पक्ष (상대방) हुन्छ।"}, {"n": "24", "q": "두 사람이 손을 맞잡고 가볍게 흔드는 동작으로, 인사나 감사, 축하, 등의 의미로 서로의 감정을 표현하는 방식입니다.", "options": ["악수", "약속", "감사", "방문"], "answer": 0, "explain": "पहिलो विकल्पको '악수' को अर्थ हात मिलाउने काम (शेक ह्यान्ड) हो, जहाँ दुई जनाले हात समातेर नमस्कार, धन्यवाद वा बधाई प्रकट गर्छन्, त्यसैले यो सही उत्तर हो। दोस्रो विकल्पको '약속' को अर्थ वाचा वा प्रतिज्ञा हो, यो हात मिलाउने कार्यसँग मिल्दैन त्यसैले यो मिलेन। तेस्रो विकल्पको '감사' को अर्थ धन्यवाद हो, यो हात जोड्ने वा मिलाउने शारीरिक क्रिया होइन त्यसैले यो मिलेन। चौथो विकल्पको '방문' को अर्थ भ्रमण वा ढोका हो, यो अभिवादन गर्ने तरिका होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प १ हो जसको अर्थ हात मिलाउनु (악수) हुन्छ।"}, {"n": "25", "q": "일상생활에서 자주 사용하는 물건들로, 청소 도구, 주방 용품, 세면도구, 가전제품 등이 생활을 편리하게 해주는 다양한 제품을 말합니다.", "options": ["생활용품", "생활규칙", "화장품", "생산품"], "answer": 0, "explain": "생활용품 भनेको दैनिक प्रयोगका सामानहरू हुन्, जसले जीवनलाई सजिलो बनाउँछ र प्रश्नसँग मिल्छ। 생활규칙 भनेको जीवनका नियमहरू हुन्, यो वस्तु होइन। 화장품 भनेको सौन्दर्य प्रसाधन हो, यो सबै प्रकारका दैनिक सामान होइन। 생산품 भनेको उत्पादन गरिएका वस्तुहरू हुन्, यो दैनिक प्रयोगका घरायसी सामान मात्र होइन। सही उत्तर १ हो र यसको अर्थ दैनिक प्रयोगका सामानहरू हो।"}, {"n": "26", "q": "사람들이 업무를 보기 위해 모여 일하는 공간을 말합니다. 주로 문서 작업, 회의, 관리 등의 일을 수행하는 장소입니다.", "options": ["대강당", "사무실", "교실", "공장"], "answer": 1, "explain": "पहिलो विकल्पको '대강당' को अर्थ ठूलो हल हो, यो मानिसहरू अफिसको काम गर्ने सानो ठाउँ होइन त्यसैले यो मिलेन। दोस्रो विकल्पको '사무실' को अर्थ कार्यालय वा अफिस हो, जहाँ मानिसहरू काम गर्न, मिटिङ गर्न र कागजी काम गर्न जम्मा हुन्छन्, त्यसैले यो सही उत्तर हो। तेस्रो विकल्पको '교실' को अर्थ कक्षा कोठा हो, यो विद्यार्थी पढ्ने ठाउँ हो त्यसैले अफिसको काम गर्ने ठाउँसँग मिल्दैन। चौथो विकल्पको '공장' को अर्थ कारखाना हो, यो प्रशासनिक काम गर्ने अफिस होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प २ हो जसको अर्थ कार्यालय (사무실) हुन्छ।"}, {"n": "27", "q": "종이, 천, 머리카락 같은 재료를 자르기 위해 사용되는 장치로, 가운데에 결합된 날카로운 두 개의 날과 손가락을 넣을 구멍이 있는 두 개의 손잡이로 구성됩니다.", "options": ["톱", "가위", "칼", "드릴"], "answer": 1, "explain": "पहिलो विकल्पको '톱' को अर्थ करन्ती (आरी) हो, यो कपडा वा कागज काट्ने औजार होइन त्यसैले यो मिलेन। दोस्रो विकल्पको '가위' को अर्थ कैंची हो, जसको बीचमा धारिला दुई वटा ब्लेड र औंला छिराउने प्वाल हुन्छ जसले कागज, कपडा आदि काट्न मद्दत गर्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्पको '칼' को अर्थ चक्कु हो, यसमा औंला छिराउने प्वाल हुँदैन त्यसैले यो मिलेन। चौथो विकल्पको '드릴' को अर्थ प्वाल पार्ने मेसिन हो, यो काट्ने कैंची होइन त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प २ हो जसको अर्थ कैंची (가위) हुन्छ।"}, {"n": "28", "q": "물체를 자르거나 깎기 위해 사용하는 보통 얇고 납작한 날을 가지고 있는 도구로, 용도에 따라 모양이 다양합니다.", "options": ["가위", "낫", "톱", "칼"], "answer": 3, "explain": "가위 भनेको कैंची हो, यो पातलो र चेप्टो धार भएको टुक्रा काट्ने साधन भए पनि मुख्यतया कागज वा कपडा काट्न प्रयोग हुन्छ। 낫 भनेको हँसिया हो, यो घाँस काट्न प्रयोग हुन्छ। 톱 भनेको आरा हो, यो काठ काट्न प्रयोग हुन्छ। 칼 भनेको चक्कु हो, यो वस्तुहरू काट्न वा छाँटकाँट गर्न प्रयोग हुने पातलो र चेप्टो धार भएको साधन हो र प्रश्नसँग मिल्छ। सही उत्तर ४ हो र यसको अर्थ चक्कु हो।"}, {"n": "29", "q": "날짜, 요일, 월, 연도 등의 정보를 한눈에 볼 수 있게 만든 것으로 보통 종이나 전자 화면에 표 형태로 구성되어 있으며, 벽걸이형이나, 탁상용으로 사용할 수 있습니다.", "options": ["시계", "안경", "달력", "계산기"], "answer": 2, "explain": "पहिलो विकल्पको '시계' को अर्थ घडी हो, यो मिति र बार हेर्ने तालिका होइन त्यसैले यो मिलेन। दोस्रो विकल्पको '안경' को अर्थ चस्मा हो, यो पात्रो होइन त्यसैले यो मिलेन। तेस्रो विकल्पको '달력' को अर्थ पात्रो (क्यालेन्डर) हो, जसबाट मिति, बार, महिना र वर्ष सजिलै हेर्न सकिन्छ र यो भित्ता वा टेबलमा राख्ने गरिन्छ, त्यसैले यो सही उत्तर हो। चौथो विकल्पको '계산기' को अर्थ क्याल्कुलेटर हो, यो गणितीय हिसाब गर्ने उपकरण हो त्यसैले यो मिलेन। अन्त्यमा, सही उत्तर विकल्प ३ हो जसको अर्थ पात्रो (달력) हुन्छ।"}, {"n": "30", "q": "데이터를 처리하고 저장하는 전자 기기로, 정보를 입력하고 처리하여 결과를 출력하는 역할을 합니다.", "options": ["컴퓨터", "전화기", "라디오", "현미경"], "answer": 0, "explain": "컴퓨터 भनेको कम्प्युटर हो, जसले डेटा प्रशोधन र भण्डारण गर्छ तथा जानकारी प्रशोधन गरेर नतिजा दिन्छ र प्रश्नसँग मिल्छ। 전화기 भनेको फोन हो, यो मुख्यतया कुराकानी गर्ने यन्त्र हो। 라디오 भनेको रेडियो हो, यो अडियो सुन्ने मात्र यन्त्र हो। 현미경 भनेको सूक्ष्मदर्शी हो, यो सानो वस्तु ठूलो देखाउने यन्त्र हो। सही उत्तर १ हो र यसको अर्थ कम्प्युटर हो।"}, {"n": "31", "q": "숫자와 수학적인 연산을 빠르고 정확하게 수행하는 전자 기기로 간단한 계산부터 복잡한 계산까지 처리할 수 있습니다.", "options": ["계산기", "수준기", "정수기", "세탁기"], "answer": 0, "explain": "१. 계산기 भनेको क्याल्कुलेटर हो, जसले गणितीय गणना छिटो र सही, सरलदेखि जटिलसम्म गर्न सक्छ त्यसैले यो सही उत्तर हो। २. 수준기 भनेको लेभल गर्ने औजार हो, यो गणितीय गणना गर्ने इलेक्ट्रोनिक मेसिन होइन। ३. 정수기 भनेको पानी शुद्ध गर्ने वाटर प्युरिफायर हो, यो गणना गर्ने मेसिन होइन। ४. 세탁기 भनेको लुगा धुने मेसिन हो, यसले गणनाको काम गर्दैन। सही उत्तर 계산기 हो जुन क्याल्कुलेटर हो।"}, {"n": "32", "q": "주로 청소나 개인 위생을 위한 종이 제품으로, 부드럽고 흡수력이 뛰어난 특성이 있습니다.", "options": ["원사", "비닐", "봉지", "휴지"], "answer": 3, "explain": "१. 원사 भनेको धागो हो, यो सरसफाइ वा व्यक्तिगत सरसफाइका लागि प्रयोग हुने कागजको उत्पादन होइन। २. 비닐 भनेको प्लास्टिक वा भिनिल हो, यो कागजको उत्पादन होइन। ३. 봉지 भनेको झोला हो, यो पनि कागजको उत्पादन होइन। ४. 휴지 भनेको टिस्यु पेपर वा ट्वाइलेट पेपर हो, जुन सरसफाइका लागि प्रयोग हुने नरम र पानी सोस्ने कागजको उत्पादन हो त्यसैले यो सही उत्तर हो। सही उत्तर 휴지 हो जुन टिस्यु पेपर हो।"}, {"n": "33", "q": "국제 여행을 위해 개인의 신원을 증명하는 공식 문서입니다. 보통 사진, 이름, 생년월일, 발급 국가 등이 기재되어 있으며, 출입국 관리 시 필요한 중요한 서류입니다.", "options": ["학생증", "사원증", "이력서", "여권"], "answer": 3, "explain": "학생증 भनेको विद्यार्थी परिचय पत्र हो, यो अन्तर्राष्ट्रिय यात्राको लागि होइन। 사원증 भनेको कम्पनीको परिचय पत्र हो, यो राहदानी होइन। 이력서 भनेको बायोडाटा वा जागिरको आवेदन फारम हो, यो यात्राको कागजात होइन। 여권 भनेको राहदानी हो, जसले अन्तर्राष्ट्रिय यात्राको लागि व्यक्तिको पहिचान प्रमाणित गर्छ र प्रश्नसँग मिल्छ। सही उत्तर ४ हो र यसको अर्थ राहदानी हो।"}, {"n": "34", "q": "돈, 카드, 신분증 등을 보관하는 작은 가방 모양의 액세서리로 보통 가죽이나 천으로 만들어집니다.", "options": ["서랍", "지갑", "배낭", "주머니"], "answer": 1, "explain": "서랍 भनेको दराज हो, यो बोक्ने झोला आकारको वस्तु होइन। 지갑 भनेको पर्स हो, जसले पैसा, कार्ड र परिचय पत्र राख्छ र छाला वा कपडाबाट बनेको हुन्छ र प्रश्नसँग मिल्छ। 배낭 भनेको पिठ्युँमा बोक्ने झोला हो, यो पैसा राख्ने सानो पर्स होइन। 주머니 भनेको खल्ती हो, यो छुट्टै बनाइएको झोला होइन। सही उत्तर २ हो र यसको अर्थ पर्स हो।"}, {"n": "35", "q": "잠금을 열거나 잠그는 데 사용하는 도구로, 특정 잠금 장치에 맞게 디자인된 금속 재질의 작은 물건입니다. 보통 집, 자동차, 자물쇠 등을 여는 데 사용됩니다.", "options": ["창문", "열쇠", "부품", "지갑"], "answer": 1, "explain": "१. 창문 भनेको झ्याल हो, यो ताला खोल्ने औजार होइन। २. 열쇠 भनेको साँचो हो, यो ताला खोल्न वा बन्द गर्न प्रयोग गरिने धातुबाट बनेको सानो वस्तु हो त्यसैले यो सही उत्तर हो। ३. 부품 भनेको पार्टपुर्जा हो, यो साँचो होइन। ४. 지갑 भनेको वालेट हो, यो ताला खोल्ने औजार होइन। सही उत्तर 열쇠 हो जुन साँचो हो।"}, {"n": "36", "q": "피부를 보호하거나 미용을 위해 사용하는 제품들로, 로션, 크림, 세럼, 메이크업 제품 등 다양한 종류가 있습니다.", "options": ["의약품", "생산품", "화장품", "음료품"], "answer": 2, "explain": "१. 의약품 भनेको औषधि हो, यो छालाको हेरचाह वा सौन्दर्यको लागि प्रयोग हुने प्रसाधन सामग्री होइन। २. 생산품 भनेको उत्पादित वस्तु हो, यो सामान्य शब्द हो। ३. 화장품 भनेको सौन्दर्य प्रसाधन वा कस्मेटिक्स हो, जुन छालाको सुरक्षा वा सौन्दर्यको लागि प्रयोग गरिन्छ र लोसन, क्रिम, सेरम, मेकअपका सामानहरू यसभित्र पर्छन् त्यसैले यो सही उत्तर हो। ४. 음료품 भनेको पेय पदार्थ हो, यो छालामा लगाउने सौन्दर्य प्रसाधन होइन। सही उत्तर 화장품 हो जुन कस्मेटिक्स हो।"}, {"n": "37", "q": "우리가 보려고 하는 것을 보여주는 유리이고 주로 얼굴을 보고 화장하거나 옷을 확인할 때 사용합니다. 모양은 평평하거나 조금 둥글 수 있습니다.", "options": ["거울", "옷장", "창문", "세숫대"], "answer": 0, "explain": "१. 거울 भनेको ऐना हो, यो हामीले हेर्न चाहेको कुरा देखाउने सिसा हो र अनुहार हेरेर मेकअप गर्दा वा लुगा ठिक छ छैन भनेर हेर्दा प्रयोग गरिन्छ त्यसैले यो सही उत्तर हो। २. 옷장 भनेको दल्चा वा कपडा राख्ने दराज हो, यो ऐना होइन। ३. 창문 भनेको झ्याल हो, यो अनुहार हेर्ने ऐना होइन। ४. 세숫대야 भनेको मुख धुने वा भाँडाकुडा धुने बाटा हो, यो ऐना होइन। सही उत्तर 거울 हो जुन ऐना हो।"}, {"n": "38", "q": "사람이 잠을 잘 때 머리나 목을 편안하게 받쳐 주기 위해 사용하는 물건입니다. 부드러운 재료로 만들어져 있어 몸의 긴장을 풀어 주고 편안한 잠을 도와줍니다.", "options": ["베개", "이불", "담요", "매트리스"], "answer": 0, "explain": "१. 베개 भनेको सिरानी हो, यो सुत्दा टाउको वा घाँटीलाई आरामसँग अड्याउन प्रयोग गरिने वस्तु हो त्यसैले यो सही उत्तर हो। २. 이불 भनेको बख्खु वा लुगा ओढ्ने कम्बल/सजाइ हो, यो टाउकोमा राख्ने सिरानी होइन। ३. 담요 भनेको ब्ल्याङ्केट वा कम्बल हो, यो ओढ्ने कुरा हो। ४. 매트리스 भनेको म्याट्रेस वाद्दा हो, यो सुत्ने ओछ्यानमा ओछ्याउने हो सिरानी होइन। सही उत्तर 베개 हो जुन सिरानी हो।"}, {"n": "39", "q": "잠을 잘 때 몸을 덮어 따뜻하게 보호해 주는 천으로 만든 물건입니다. 추위로부터 몸을 지켜 주고 편안한 잠을 도와줍니다.", "options": ["베개", "홑이불", "카펫", "이불"], "answer": 3, "explain": "१. 베개 भनेको सिरानी हो, यो शरीर ढाक्ने ओढ्ने वस्तु होइन। २. 홑이불 भनेको पातलो कभर वा च्यादर हो, यो विशेष गरी शरीर ओढ्ने मुख्य न्यानो कपडाको रूपमा भन्दा पनि फराकिलो अर्थमा 이불 प्रयोग हुन्छ। ३. 카펫 भनेको कार्पेट हो, यो भुइँमा ओछ्याउने कुरा हो। ४. 이불 भनेको कम्बल वा ओढ्ने कपडा हो, जसले सुत्दा शरीर छोपेर न्यानो राख्न मद्दत गर्छ त्यसैले यो सही उत्तर हो। सही उत्तर 이불 हो जुन ओढ्ने कम्बल हो।"}, {"n": "40", "q": "머리카락을 가지런히 정리하거나 엉킨 머리를 풀 때 사용하는 도구입니다. 주로 손잡이가 달려 있고 여러 개의 가느다란 이가 나란히 붙어 있습니다.", "options": ["가위", "칼", "빗", "톱"], "answer": 2, "explain": "१. 가위 भनेको कैची हो, यो कपाल कोर्ने औजार होइन। २. 칼 भनेको चक्कु हो, यो कपाल कोर्ने साधन होइन। ३. 빗 भनेको काइयो हो, जसले कपाल मिलाउन वा अल्झिएको कपाल फुकाउन प्रयोग गरिन्छ र यसमा ह्यान्डल र सानो दाँतहरू लाइनमा बसेका हुन्छन् त्यसैले यो सही उत्तर हो। ४. 톱 भनेको आरा हो, यो काठ काट्ने औजार हो कपाल कोर्ने होइन। सही उत्तर 빗 हो जुन काइयो हो।"}, {"n": "41", "q": "사람들이 일상생활에 필요한 식품, 생필품, 의류 등을 한 곳에서 편리하게 살 수 있도록 모아 놓은 큰 가게나 상점을 말합니다.", "options": ["옷가게", "마트", "서점", "편의점"], "answer": 1, "explain": "१. 옷가게 भनेको कपडा पसल हो, यहाँ सबै प्रकारका दैनिक उपभोग्य वस्तु पाइँदैन केवल कपडा पाइन्छ। २. 마트 भनेको मार्ट वा सुपरमार्केट हो, जहाँ मानिसहरूलाई दैनिक जीवनमा आवश्यक पर्ने खाद्य पदार्थ, दैनिक उपभोग्य वस्तु, कपडा आदि एकै ठाउँमा सजिलै किन्न पाइने ठूलो पसल हो त्यसैले यो सही उत्तर हो। ३. 서점 भनेको पुस्तक पसल हो, यहाँ किताब मात्र पाइन्छ। ४. 편의점 भनेको कन्भिनियन्स स्टोर हो, यो मार्टभन्दा सानो हुन्छ र चौबीसै घण्टा खुल्छ। सही उत्तर 마트 हो जुन सुपरमार्केट हो।"}, {"n": "42", "q": "사람들이 먹기 위해 구입하는 재료나 음식입니다. 주로 쌀, 채소, 과일, 고기, 생선, 우유처럼 일상생활에 꼭 필요한 먹거리를 말합니다.", "options": ["식료품", "음료품", "의약품", "의류품"], "answer": 0, "explain": "१. 식료품 भनेको खाद्यान्न वा खाद्य सामग्री हो, जसमा चामल, तरकारी, फलफूल, मासु, माछा, दूध जस्ता दैनिक जीवनमा नभई नहुने खानेकुरा पर्छन् त्यसैले यो सही उत्तर हो। २. 음료품 भनेको पेय पदार्थ हो, यो खानेकुरा र खाद्यान्न सबैलाई जनाउने शब्द होइन। ३. 의약품 भनेको औषधि हो, यो खाद्य सामग्री होइन। ४. 의류품 भनेको कपडाजन्य वस्तु हो, यो खानेकुरा होइन। सही उत्तर 식료품 हो जुन खाद्यान्न हो।"}, {"n": "43", "q": "전단지는 상품, 행사, 가게 등을 알리기 위해 사람들에게 나눠 주는 작은 종이입니다.", "options": ["메뉴판", "전단지", "잡지", "신문"], "answer": 1, "explain": "१. 메뉴판 भनेको मेनु कार्ड हो, यो पसलको विज्ञापन गर्ने पर्चा होइन। २. 전단지 भनेको विज्ञापन गर्ने पर्चा वा पम्प्लेट हो, जुन सामान, कार्यक्रम, पसल आदिको बारेमा जानकारी दिन मानिसहरूलाई बाँडिन्छ त्यसैले यो सही उत्तर हो। ३. 잡지 भनेको म्यागजिन वा पत्रिका हो, यो विज्ञापन पर्चा होइन। ४. 신문 भनेको समाचारपत्र हो, यो पर्चा होइन। सही उत्तर 전단지 हो जुन विज्ञापन पर्चा हो।"}, {"n": "44", "q": "사용하던 물건을 다른 사람에게 사고파는 것으로 저렴한 가격에 거래합니다.", "options": ["직거래", "중고 거래", "주말 특가", "할인 행사"], "answer": 1, "explain": "१. 직거래 भनेको सिधा कारोबार हो, यो प्रयोग गरिसकेको सामान किनबेच गर्ने कुरा मात्र होइन। २. 중고 거래 भनेको सेकेन्ड ह्यान्ड कारोबार वा पुरानो सामानको किनबेच हो, जसमा प्रयोग गरिरहेको सामान अरूलाई सस्तो मूल्यमा किनबेच गरिन्छ त्यसैले यो सही उत्तर हो। ३. 주말 특가 भनेको सप्ताहन्तको विशेष छुट मूल्य हो। ४. 할인 행사 भनेको छुट दिने कार्यक्रम हो। सही उत्तर 중고 거래 हो जुन सेकेन्ड ह्यान्ड कारोबार हो।"}, {"n": "45", "q": "집에서 사용하는 전기 기계로, 생활을 편리하게 도와주는 물건입니다. 예를 들면, 냉장고, 세탁기, 전자레인지 등이 있습니다.", "options": ["의류품", "전기장치", "가전제품", "기계장치"], "answer": 2, "explain": "१. 의류품 भनेको कपडाजन्य वस्तु हो, यो विद्युतीय मेसिन होइन। २. 전기장치 भनेको विद्युतीय उपकरण वा डिभाइस हो, तर घरमा प्रयोग हुने घरायसी मेसिनहरूलाई जनाउने शब्द होइन। ३. 가전제품 भनेको घरायसी विद्युतीय उपकरण वा होम अप्लायन्सेस हो, जस्तै फ्रिज, वासिङ मेसिन, माइक्रोवेभ आदि जसले जीवनलाई सहज बनाउँछ त्यसैले यो सही उत्तर हो। ४. 기계장치 भनेको मेशिनरी उपकरण हो, यो सामान्य घरायसी सामानका लागि प्रयोग हुँदैन। सही उत्तर 가전제품 हो जुन घरायसी विद्युतीय उपकरण हो।"}, {"n": "46", "q": "실내 온도를 시원하게 하거나 따뜻하게 조절해주는 전자제품입니다. 더운 여름이나 추운 겨울에 쾌적한 환경을 만들어 줍니다.", "options": ["세탁기", "건조기", "정수기", "에어컨"], "answer": 3, "explain": "१. 세탁기 भनेको लुगा धुने मेसिन हो, त्यसैले यो मिल्दैन। २. 건조기 भनेको लुगा सुकाउने मेसिन हो, त्यसैले यो मिल्दैन। ३. 정수기 भनेको पानी शुद्ध पार्ने मेसिन हो, त्यसैले यो मिल्दैन। ४. 에어컨 भनेको कोठाको तापक्रम चिसो वा तातो बनाउने वातानुकूलित यन्त्र हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ हो जसको अर्थ एअर कन्डिसनर हो।"}, {"n": "47", "q": "전기를 이용해 다양한 기능을 수행하는 기계나 기구를 말합니다.", "options": ["전자제품", "의약품", "가전제품", "기계장치"], "answer": 0, "explain": "१. 전자제품 भनेको बिजुलीबाट चल्ने विभिन्न कार्य गर्ने विद्युतीय उत्पादन हो, प्रश्नले घरमा प्रयोग हुने भन्ने कुनै सीमा नतोकेकाले यही सामान्य अर्थ मिल्छ, त्यसैले यो सही उत्तर हो। २. 의약품 भनेको औषधिजन्य सामग्री हो, त्यसैले यो मिल्दैन। ३. 가전제품 भनेको घरमा प्रयोग हुने घरायसी विद्युतीय उपकरण मात्र हो, प्रश्नमा घरायसी प्रयोगको कुनै उल्लेख छैन, त्यसैले यो मिल्दैन। ४. 기계장치 भनेको मेसिनरी यन्त्र हो, बिजुलीबाट चल्ने विद्युतीय उत्पादन भन्ने अर्थसँग मिल्दैन, त्यसैले यो मिल्दैन।"}, {"n": "48", "q": "사람이 잠을 자거나 쉴 때 사용하는 가구입니다. 매트리스와 프레임으로 이루어져 있어 편안하게 누울 수 있습니다.", "options": ["옷장", "책상", "의자", "침대"], "answer": 3, "explain": "१. 옷장 भनेको कपडा राख्ने दराज हो, त्यसैले यो मिल्दैन। २. 책상 भनेको पढ्ने वा लेख्ने टेबल हो, त्यसैले यो मिल्दैन। ३. 의자 भनेको बस्ने कुर्सी हो, त्यसैले यो मिल्दैन। ४. 침대 भनेको सुत्ने वा आराम गर्ने बेड (खाट) हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ हो जसको अर्थ बेड हो।"}, {"n": "49", "q": "옷이나 천 등을 물과 세제를 이용해 자동으로 빨아주는 가전제품입니다. 사용자가 세탁, 헹굼, 탈수 과정을 쉽게 할 수 있도록 도와줍니다.", "options": ["옷걸이", "옷장", "냉장고", "세탁기"], "answer": 3, "explain": "१. 옷걸이 भनेको कपडा झुन्ड्याउने ह्यागर हो, त्यसैले यो मिल्दैन। २. 옷장 भनेको कपडा राख्ने दराज हो, त्यसैले यो मिल्दैन। ३. 냉장고 भनेको खाना तथा पेयपदार्थ चिसो बनाउने फ्रिज हो, त्यसैले यो मिल्दैन। ४. 세탁기 भनेको पानी र डिटर्जेन्ट प्रयोग गरेर स्वचालित रूपमा लुगा धुने वाशिङ मेसिन हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ हो जसको अर्थ वाशिङ मेसिन हो।"}, {"n": "50", "q": "음식이나 음료를 차갑게 보관하여 신선함을 오래 유지할 수 있는 제품입니다.", "options": ["세탁기", "냉장고", "식탁", "전자레인지"], "answer": 1, "explain": "१. 세탁기 भनेको लुगा धुने मेसिन हो, त्यसैले यो मिल्दैन। २. 냉장고 भनेको खाना वा पेयपदार्थलाई चिसोमा राखेर ताजा राखिराख्ने फ्रिज हो, त्यसैले यो सही उत्तर हो। ३. 식탁 भनेको खाना खाने टेबल हो, त्यसैले यो मिल्दैन। ४. 전자레인지 भनेको खाना तताउने माइक्रोवेभ ओभन हो, त्यसैले यो मिल्दैन। सही उत्तर २ हो जसको अर्थ फ्रिज हो।"}, {"n": "51", "q": "먼지나 쓰레기를 빨아들여 집 안이나 사무실 등을 깨끗하게 청소할 수 있도록 도와주는 기계입니다.", "options": ["계산기", "청소기", "냉장고", "사진기"], "answer": 1, "explain": "१. 계산기 भनेको क्याल्कुलेटर हो, त्यसैले यो मिल्दैन। २. 청소기 भनेको धुलो वा फोहोर तानेर कोठा सफा गर्ने भ्याकुम क्लिनर हो, त्यसैले यो सही उत्तर हो। ३. 냉장고 भनेको फ्रिज हो, त्यसैले यो मिल्दैन। ४. 사진기 भनेको क्यामेरा हो, त्यसैले यो मिल्दैन। सही उत्तर २ हो जसको अर्थ भ्याकुम क्लिनर हो।"}, {"n": "52", "q": "상품을 생산하거나 서비스를 제공하여 이익을 얻는 조직입니다. 경영진과 직원들이 효율적으로 자원을 관리하여 지속 가능한 성장을 추구합니다.", "options": ["공장", "학교", "회사", "은행"], "answer": 2, "explain": "१. 공장 भनेको कारखाना हो, त्यसैले यो पूर्ण मिल्दैन। २. 학교 भनेको विद्यालय हो, त्यसैले यो मिल्दैन। ३. 회사 भनेको सामान उत्पादन गरेर वा सेवा दिएर नाफा कमाउने संस्था (कम्पनी) हो, त्यसैले यो सही उत्तर हो। ४. 은행 भनेको बैंक हो, त्यसैले यो मिल्दैन। सही उत्तर ३ हो जसको अर्थ कम्पनी हो।"}, {"n": "53", "q": "음식을 제공하는 장소로, 고객에게 다양한 메뉴를 제공하여 식사를 제공합니다. 보통 음료와 함께 식사를 즐길 수 있는 공간이 마련되어 있습니다.", "options": ["부엌", "밥집", "식당", "커피숍"], "answer": 2, "explain": "१. 부엌 भनेको घरभित्रको भान्साकोठा हो, त्यसैले यो मिल्दैन। २. 밥집 भनेको सामान्य भात खाने पसल हो। ३. 식당 भनेको ग्राहकलाई विभिन्न प्रकारका परिकार र खाना उपलब्ध गराउने रेस्टुरेन्ट हो, त्यसैले यो सही उत्तर हो। ४. 커피숍 भनेको कफी पसल हो, त्यसैले यो मिल्दैन। सही उत्तर ३ हो जसको अर्थ रेस्टुरेन्ट हो।"}, {"n": "54", "q": "돈을 맡기고 빌릴 수 있는 곳으로, 사람들 또는 회사에 금융 서비스를 제공합니다. 예금, 대출, 송금 등의 서비스를 통해 돈을 관리합니다.", "options": ["식당", "학원", "은행", "환전소"], "answer": 2, "explain": "식당 भनेको रेस्टुरेन्ट हो, यो पैसा जम्मा गर्ने ठाउँ होइन। 학원 भनेको ट्युसन सेन्टर वा कोचिङ इन्स्टिच्युट हो, यो बैंक होइन। 은행 भनेको बैंक हो, जहाँ पैसा जम्मा गर्न र ऋण लिन सकिन्छ र वित्तीय सेवाहरू प्रदान गर्छ र प्रश्नसँग मिल्छ। 환전소 भनेको मुद्रा सटही काउन्टर हो, यो पूर्ण बैंक सेवा दिने ठाउँ होइन। सही उत्तर ३ हो र यसको अर्थ बैंक हो।"}, {"n": "55", "q": "집이나 식당에서 식사를 하거나 음식을 올려놓기 위해 사용하는 탁자를 말합니다.", "options": ["책상", "식탁", "책장", "옷장"], "answer": 1, "explain": "१. 책상 भनेको पढ्ने टेबल हो, त्यसैले यो मिल्दैन। २. 식탁 भनेको घर वा रेस्टुरेन्टमा खाना खान वा खाना राख्न प्रयोग गरिने डाइनिङ टेबल हो, त्यसैले यो सही उत्तर हो। ३. 책장 भनेको किताब राख्ने दराज हो, त्यसैले यो मिल्दैन। ४. 옷장 भनेको कपडा राख्ने दराज हो, त्यसैले यो मिल्दैन। सही उत्तर २ हो जसको अर्थ डाइनिङ टेबल हो।"}, {"n": "56", "q": "은행에 예금해 둔 돈을 은행 창구를 거치지 않고 통장이나 카드를 사용하여 찾을 수 있는 장치입니다.", "options": ["카드 단말기", "카드 충전기", "커피 자판기", "현금 인출기"], "answer": 3, "explain": "१. 카드 단말기 भनेको कार्ड स्वाइप गर्ने मेसिन हो, त्यसैले यो मिल्दैन। २. 카드 충전기 भनेको कार्डमा पैसा थप्ने मेसिन हो, त्यसैले यो मिल्दैन। ३. 커피 자판기 भनेको कफी आउने मेसिन हो, त्यसैले यो मिल्दैन। ४. 현금 인출기 भनेको बैंकको काउन्टर नगई पासबुक वा कार्ड प्रयोग गरेर पैसा निकाल्ने एटीएम मेसिन हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ हो जसको अर्थ एटीएम मेसिन हो।"}, {"n": "57", "q": "일상 생활에 필요한 물건을 24시간 또는 긴 시간 동안 쉽게 구입할 수 있는 가게로 주로 음료, 스낵, 생필품 등을 판매합니다.", "options": ["마트", "매점", "백화점", "편의점"], "answer": 3, "explain": "१. 마트 भनेको ठूलो मार्ट हो। २. 매점 भनेको क्यान्टिन हो। ३. 백화점 भनेको डिपार्टमेन्ट स्टोर हो। ४. 편의점 भनेको २४ घण्टै वा लामो समयसम्म खुल्ने, दैनिक उपभोग्य वस्तुहरू सहजै किन्न पाइने सुविधा स्टोर (कन्भेनिएन्स स्टोर) हो, त्यसैले यो सही उत्तर हो। सही उत्तर ४ हो जसको अर्थ कन्भेनिएन्स स्टोर हो।"}, {"n": "58", "q": "사람들이 다양한 상품을 사고파는 곳으로, 보통 노점이나 작은 가게들이 모여 있고 신선한 식료품, 의류, 생활용품 등을 손쉽게 구입할 수 있는 상업 공간입니다.", "options": ["옷가게", "시장", "쇼핑몰", "수퍼마켓"], "answer": 1, "explain": "१. 옷가게 भनेको कपडा पसल हो, त्यसैले यो पूर्ण मिल्दैन। २. 시장 भनेको विभिन्न किसिमका सामान किनबेच गर्ने बजार (खुला वा पारम्परिक बजार) हो, त्यसैले यो सही उत्तर हो। ३. 쇼핑몰 भनेको सपिङ मल हो। ४. 수퍼마켓 भनेको सुपरमार्केट हो। सही उत्तर २ हो जसको अर्थ बजार (मार्केट) हो।"}, {"n": "59", "q": "머리카락을 자르거나 스타일링, 염색 등을 제공하는 곳으로 고객의 헤어와 뷰티에 관련된 다양한 미용 서비스를 제공합니다.", "options": ["미용실", "교육원", "이발소", "미용샵"], "answer": 0, "explain": "१. 미용실 भनेको कपाल काट्ने, स्टाइल गर्ने र रङ्ग्याउने ब्युटी पार्लर (सैलुन) हो, त्यसैले यो सही उत्तर हो। २. 교육원 भनेको शिक्षा दिने केन्द्र हो, त्यसैले यो मिल्दैन। ३. 이발소 भनेको परम्परागत पुरुषको कपाल काट्ने नापित पसल हो। ४. 미용샵 भनेको ब्युटी सप हो (तर सामान्यतया मि용실 प्रयोग हुन्छ)। सही उत्तर १ हो जसको अर्थ ब्युटी पार्लर वा सैलुन हो।"}, {"n": "60", "q": "질병이나 부상을 치료하고 건강을 돌보는 곳으로, 의사와 간호사들이 환자를 돌보고 진료, 검사, 수술 등의 의료 서비스를 제공합니다.", "options": ["병원", "약국", "은행", "극장"], "answer": 0, "explain": "१. 병원 भनेको रोग वा चोटपटकको उपचार गर्ने, डाक्टर र नर्सहरूले बिरामीको हेरचाह गर्ने अस्पताल हो, त्यसैले यो सही उत्तर हो। २. 약국 भनेको औषधि पसल हो, त्यसैले यो मिल्दैन। ३. 은행 भनेको बैंक हो, त्यसैले यो मिल्दैन। ४. 극장 भनेको सिनेमा हल हो, त्यसैले यो मिल्दैन। सही उत्तर १ हो जसको अर्थ अस्पताल हो।"}, {"n": "61", "q": "편지나 소포를 보내고 받는 곳으로, 우편 서비스를 제공합니다. 또한, 금융 서비스와 같은 다양한 서비스를 제공하기도 합니다.", "options": ["우체국", "은행", "병원", "학교"], "answer": 0, "explain": "우체국 भनेको हुलाक कार्यालय हो, जहाँ चिठी वा पार्सल पठाउने र प्राप्त गर्ने काम गरिन्छ र प्रश्नसँग मिल्छ। 은행 भनेको बैंक हो, यो हुलाक सेवा दिने ठाउँ होइन। 병원 भनेको अस्पताल हो, यो हुलाक कार्यालय होइन। 학교 भनेको विद्यालय हो, यो चिठी पठाउने ठाउँ होइन। सही उत्तर १ हो र यसको अर्थ हुलाक कार्यालय हो।"}, {"n": "62", "q": "학생이나 직장인들이 생활할 수 있는 숙소로, 학교나 직장 근처에 위치해 있고 주로 공동 생활 공간과 개인 공간이 나누어져 있습니다.", "options": ["교육원", "대학교", "기숙사", "휴게실"], "answer": 2, "explain": "교육원 भनेको तालिम केन्द्र हो, यो बस्ने होस्टेल होइन। 대학교 भनेको विश्वविद्यालय हो, यो विद्यार्थी वा कामदार बस्ने आवास होइन। 기숙사 भनेको होस्टेल हो, जहाँ विद्यार्थी वा कामदारहरू बस्छन् र साझा तथा व्यक्तिगत ठाउँहरू छुट्टाइएको हुन्छ र प्रश्नसँग मिल्छ। 휴게실 भनेको विश्राम कक्ष हो, यो सुत्ने बासस्थान होइन। सही उत्तर ३ हो र यसको अर्थ होस्टेल हो।"}, {"n": "63", "q": "넓은 길이나 큰 문을 의미하며, 보통 중요한 장소나 건물의 입구에 위치한 크고 아름다운 문을 가리킵니다.", "options": ["광장", "극장", "뒷문", "정문"], "answer": 3, "explain": "광장 भनेको खुला चोक वा बजार हो, यो ढोका होइन। 극장 भनेको चलचित्र घर वा थिएटर हो, यो प्रवेशद्वार होइन। 뒷문 भनेको पछाडिको ढोका हो, यो मुख्य द्वार होइन। 정문 भनेको मुख्य प्रवेशद्वार हो, जसले ठूलो बाटो वा मुख्य ढोकालाई जनाउँछ र प्रश्नसँग मिल्छ। सही उत्तर ४ हो र यसको अर्थ मुख्य प्रवेशद्वार हो।"}, {"n": "64", "q": "나라의 교육과 관련된 정책을 만들고 학교 교육을 관리하는 기관입니다. 학생들의 학습 환경을 개선하고 교육 발전을 위해 일합니다.", "options": ["노동부", "교육부", "과학부", "관광부"], "answer": 1, "explain": "1. 노동부 भनेको श्रम मन्त्रालय हो। 2. 교육부 भनेको शिक्षा मन्त्रालय हो, जसले देशको शिक्षा नीति बनाउँछ र विद्यालय शिक्षाको व्यवस्थापन गर्छ त्यसैले यो सही उत्तर हो। 3. 과학부 भनेको विज्ञान मन्त्रालय हो। 4. 관광부 भनेको पर्यटन मन्त्रालय हो। सही उत्तर 2 नम्बरको 교육부 (शिक्षा मन्त्रालय) हो।"}, {"n": "65", "q": "일자리와 노동 문제를 다루는 기관으로, 근로자의 권익 보호와 고용 지원을 담당합니다. 일자리 창출과 근로 환경 개선을 위해 다양한 정책을 펼칩니다.", "options": ["위생부", "내무부", "고용노동부", "도시개발부"], "answer": 2, "explain": "1. 위생부 भनेको सरसफाइ मन्त्रालय हो। 2. 내무부 भनेको गृह मन्त्रालय हो। 3. 고용노동부 भनेको रोजगार तथा श्रम मन्त्रालय हो, जसले रोजगारी र श्रमका मुद्दा हेर्छ तथा श्रमिकको अधिकारको रक्षा गर्छ त्यसैले यो सही उत्तर हो। 4. 도시개발부 भनेको सहरी विकास मन्त्रालय हो। सही उत्तर 3 नम्बरको 고용노동부 (रोजगार तथा श्रम मन्त्रालय) हो।"}, {"n": "66", "q": "집 안에서 바닥을 평평하게 만들어 사람들이 걷거나 앉을 수 있게 한 부분입니다. 주로 나무로 만들어져 편안한 느낌을 줍니다.", "options": ["지붕", "천장", "마루", "합판"], "answer": 2, "explain": "1. 지붕 भनेको छानो हो। 2. 천장 भनेको घरको छानाको भित्री भाग (सिलिङ) हो। 3. 마루 भनेको घरको काठको फ्लोर वा पिँढी हो, जसलाई हिँड्न र बस्न मिल्ने गरी सम्याइएको हुन्छ त्यसैले यो सही उत्तर हो। 4. 합판 भनेको प्लेइवुड हो। सही उत्तर 3 नम्बरको 마루 (फ्लोर/पिँढी) हो।"}, {"n": "67", "q": "방 바닥을 따뜻하게 데우는 한국 전통 난방 방식으로 아궁이에서 불을 피워 바닥 아래로 열기를 보내 방 전체를 따뜻하게 합니다.", "options": ["한옥", "민박", "마당", "온돌"], "answer": 3, "explain": "1. 한옥 भनेको परम्परागत कोरियन घर हो। 2. 민박 भनेको होमस्टे हो। 3. 마당 भनेको आँगन हो। 4. 온돌 भनेको ओण्डोल हो, जुन कोरियन परम्परागत तातो बनाउने प्रणाली हो जसले आगो बालेर कोठा न्यानो पार्छ त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको 온돌 (ओण्डोल) हो।"}, {"n": "68", "q": "태양의 움직임을 기준으로 만든 달력으로, 우리가 일상에서 사용하는 일반적인 영어 달력입니다.", "options": ["음력", "양력", "일과", "소설"], "answer": 1, "explain": "1. 음력 भनेको चन्द्रमामा आधारित पात्रो (चन्द्र पात्रो) हो। 2. 양력 भनेको सूर्यको चालमा आधारित पात्रो (सौर्य पात्रो) हो, जसलाई हामी दैनिक जीवनमा प्रयोग गर्ने अंग्रेजी पात्रो भन्छौं त्यसैले यो सही उत्तर हो। 3. 일과 भनेको दैनिकी हो। 4. 소설 भनेको उपन्यास हो। सही उत्तर 2 नम्बरको 양력 (सौर्य पात्रो) हो।"}, {"n": "69", "q": "달의 움직임을 기준으로 만든 달력으로, 전통 명절이나 제사와 같은 행사에 주로 사용됩니다.", "options": ["음력", "양력", "일정", "약속"], "answer": 0, "explain": "1. 음력 भनेको चन्द्रमाको चालमा आधारित पात्रो हो, जुन परम्परागत चाडपर्व र पितृपूजा जस्ता कार्यक्रममा प्रयोग हुन्छ त्यसैले यो सही उत्तर हो। 2. 양력 भनेको सौर्य पात्रो हो। 3. 일정 भनेको तालिका हो। 4. 약속 भनेको बाचा हो। सही उत्तर 1 नम्बरको 음력 (चन्द्र पात्रो) हो।"}, {"n": "70", "q": "한국에서 생일 때 빠지지 않고 꼭 먹는 음식, 특히 산모가 아기를 낳은 후 이것을 먹습니다.", "options": ["불고기", "미역국", "케이크", "삼계탕"], "answer": 1, "explain": "1. 불고기 भनेको बुलगोकी (मासुको परिकार) हो। 2. 미역국 भनेको समुद्री लेउको झोल (मियाकगुक) हो, जुन कोरियनहरूले जन्मदिनमा र बच्चा जन्माएपछि आमाले खाने गर्छन् त्यसैले यो सही उत्तर हो। 3. 케이크 भनेको केक हो। 4. 삼계탕 भनेको सामगे탕 (कुखुराको सुप) हो। सही उत्तर 2 नम्बरको 미역국 (समुद्री लेउको झोल) हो।"}, {"n": "71", "q": "한국의 대표적인 명절로 음력 1월 1일에 한 해가 시작되는 것을 축하하면서 기념하는 날입니다. 가족들이 모여서 차례를 지내고 어른들께 세배를 합니다.", "options": ["단오", "폐백", "설날", "추석"], "answer": 2, "explain": "1. 단오 भनेको दानो पर्व हो। 2. 폐백 भनेको बिहेको एक परम्परागत विधि हो। 3. 설날 भनेको सोलाल (नयाँ वर्ष) हो, जुन चन्द्र पात्रो अनुसारको पुस/माघ १ गते मनाइन्छ र जसमा परिवार जम्मा भएर पुजा गर्छन् तथा आशीर्वाद लिन्छन् त्यसैले यो सही उत्तर हो। 4. 추석 भनेको छुसक पर्व हो। सही उत्तर 3 नम्बरको 설날 (सोलाल) हो।"}, {"n": "72", "q": "한국의 대표적인 명절로 '한가위'라고도 합니다. 아침에 성묘를 하고 차례를 지냅니다. 이날에는 갓 수확한 쌀로 쌀밥을 짓고 송편을 만들어 먹습니다.", "options": ["설날", "추석", "정월대보름", "크리스마스"], "answer": 1, "explain": "1. 설날 भनेको सोलाल हो। 2. 추석 भनेको छुसक हो, जसलाई 'हानगावी' पनि भनिन्छ र यसमा नयाँ चामलको भात र सोङप्योन खाइन्छ त्यसैले यो सही उत्तर हो। 3. 정월대보름 भनेको पहिलो पूर्णिमाको दिन हो। 4. 크리스마스 भनेको क्रिसमस हो। सही उत्तर 2 नम्बरको 추석 (छुसक) हो।"}, {"n": "73", "q": "어떤 사람이 세상에 태어난 것을 해마다 한 번씩 기념하거나 축하하는 날입니다.", "options": ["돌잔치", "생일", "결혼식", "제사"], "answer": 1, "explain": "1. 돌잔치 भनेको बच्चाको पहिलो जन्मदिनको उत्सव हो। 2. 생일 भनेको जन्मदिन हो, जसले कोही व्यक्ति संसारमा जन्मिएको दिनलाई हरेक वर्ष मनाउने वा उत्सव मनाउने दिनलाई जनाउँछ त्यसैले यो सही उत्तर हो। 3. 결혼식 भनेको विवाह समारोह हो। 4. 제사 भनेको पितृपूजा हो। सही उत्तर 2 नम्बरको 생일 (जन्मदिन) हो।"}, {"n": "74", "q": "직장이나 일터로 일을 하러 가는 것을 말합니다. 보통 아침에 일정한 시간에 회사나 근무지로 나가는 것을 뜻합니다.", "options": ["출근", "퇴근", "조퇴", "결근"], "answer": 0, "explain": "1. 출근 भनेको काममा जानु (प्रवेश गर्नु) हो, जसले बिहान निश्चित समयमा कम्पनी वा काम गर्ने ठाउँमा जानुलाई बुझाउँछ त्यसैले यो सही उत्तर हो। 2. 퇴근 भनेको कामबाट छुट्नु हो। 3. 조퇴 भनेको चाँडै कामबाट घर फर्किनु हो। 4. 결근 भनेको अनुपस्थित हुनु हो। सही उत्तर 1 नम्बरको 출근 (काममा जानु) हो।"}, {"n": "75", "q": "하루 일과를 마치고 직장에서 집으로 돌아가는 것을 말합니다. 보통 일 끝난 후에 일터에서 나오는 것을 뜻합니다.", "options": ["퇴근", "휴일", "취직", "출석"], "answer": 0, "explain": "1. 퇴근 भनेको कामबाट छुट्नु हो, जसले दिनभरको काम सकेर अफिसबाट घर फर्किनुलाई बुझाउँछ त्यसैले यो सही उत्तर हो। 2. 휴일 भनेको बिदाको दिन हो। 3. 취직 भनेको जागिर खानु हो। 4. 출석 भनेको हाजिरी हो। सही उत्तर 1 नम्बरको 퇴근 (कामबाट छुट्नु) हो।"}, {"n": "76", "q": "의무가 있어 전문적으로 하는 것이 아니라 일상 생활에서 즐기기 위하여 하는 여러 활동을 말할 수 있습니다.", "options": ["사회 활동", "직장 활동", "취미 활동", "봉사 활동"], "answer": 2, "explain": "사회 활동 भनेको सामाजिक गतिविधि हो, यो रमाइलोको लागि मात्र गर्ने होइन। 직장 활동 भनेको कार्यालयको काम हो, यो फुर्सदको समयमा गर्ने क्रियाकलाप होइन। 취미 활동 भनेको रुचि वा पारखी गतिविधि हो, जुन अनिवार्य नभई दैनिक जीवनमा रमाइलोको लागि गरिन्छ र प्रश्नसँग मिल्छ। 봉사 활동 भनेको स्वयंसेवा हो, यो फुर्सदमा गर्ने रुचि मात्र होइन। सही उत्तर ३ हो र यसको अर्थ रुचि वा पारखी क्रियाकलाप हो।"}, {"n": "77", "q": "3한 4온 현상이 나타나는 계절로, 눈이 내리고 기온 이 낮아 사람들이 따뜻한 옷을 입고 실내 활동을 많이 합니다.", "options": ["봄", "여름", "가을", "겨울"], "answer": 3, "explain": "봄 भनेको वसन्त ऋतु हो, यो हिउँ पर्ने मौसम होइन। 여름 भनेको गर्मी ऋतु हो, यो चिसो मौसम होइन। 가을 भनेको शरद ऋतु हो, यो जाडो ऋतु होइन। 겨울 भनेको जाडो ऋतु हो, जसमा हिउँ पर्छ र तापक्रम कम हुन्छ अनि मानिसहरू न्यानो कपडा लगाएर घरभित्र बढी बस्छन् र प्रश्नसँग मिल्छ। सही उत्तर ४ हो र यसको अर्थ जाडो ऋतु हो।"}, {"n": "78", "q": "날씨가 따뜻해지고 꽃이 피며, 새싹이 돋는 생명의 계절입니다. 겨울의 추위가 지나고 자연이 다시 깨어나는 시기입니다.", "options": ["가을", "봄", "겨울", "여름"], "answer": 1, "explain": "가을 भनेको पातहरू पहेँलो हुने र झर्ने ऋतु हो, यो यस विवरणसँग मिल्दैन। 봄 भनेको मौसम न्यानो हुने, फूलहरू फुल्ने र नयाँ पालुवा पलाउने वसन्त ऋतु हो, यो नै सही उत्तर हो। 겨울 भनेको धेरै चिसो हुने हिउँद ऋतु हो, यो यस विवरणसँग मिल्दैन। 여름 भनेको घाम चर्को लाग्ने र गर्मी हुने ग्रष्म ऋतु हो, यो यस विवरणसँग मिल्दैन। सही उत्तर दुई नम्बरको 봄 हो जसको अर्थ वसन्त ऋतु हुन्छ।"}, {"n": "79", "q": "햇볕이 강하고 가장 더운 계절로, 장마와 소나기가 자주 나타납니다. 사람들은 시원한 곳을 찾아 피서 를 즐깁니다.", "options": ["봄", "겨울", "가을", "여름"], "answer": 3, "explain": "봄 भनेको मौसम न्यानो हुने र फूल फुल्ने वसन्त ऋतु हो, यो यस विवरणसँग मिल्दैन। 겨울 भनेको चिसो हुने हिउँद ऋतु हो, यो यस विवरणसँग मिल्दैन। 가을 भनेको मौसम सफा र चिसो हुने शरद ऋतु हो, यो यस विवरणसँग मिल्दैन। 여름 भनेको घाम चर्को लाग्ने, अत्यधिक गर्मी हुने र वर्षा हुने ग्रष्म ऋतु हो, यो नै सही उत्तर हो। सही उत्तर चार नम्बरको 여름 हो जसको अर्थ ग्रष्म ऋतु हुन्छ।"}, {"n": "80", "q": "날씨가 선선해지고 나뭇잎이 붉게 물드는 계절입니다. 곡식과 과일이 익는 수확의 시기이기도 합니다.", "options": ["봄", "여름", "겨울", "가을"], "answer": 3, "explain": "봄 भनेको वसन्त ऋतु हो, यो यस विवरणसँग मिल्दैन। 여름 भनेको गर्मी हुने ग्रष्म ऋतु हो, यो यस विवरणसँग मिल्दैन। 겨울 भनेको चिसो मौसमको हिउँद ऋतु हो, यो यस विवरणसँग मिल्दैन। 가을 भनेको मौसम चिसो हुने, रूखका पातहरू राता हुने र बाली कटनी गरिने शरद ऋतु हो, यो नै सही उत्तर हो। सही उत्तर चार नम्बरको 가을 हो जसको अर्थ शरद ऋतु हुन्छ।"}, {"n": "81", "q": "여름 초에 비가 여러 날 동안 계속 내리는 시기입니다. 습도가 높고 흐린 날이 많아 불쾌지수가 올라가기도 합니다.", "options": ["소나기", "이슬비", "장마철", "겨울철"], "answer": 2, "explain": "१. 소나기 (झरी/मुसलधारे पानी) हो, यो उत्तर मिलेन। २. 이슬비 (सिमसिमे पानी) हो, यो उत्तर मिलेन। ३. 장마철 (लामो वर्षायाम) हो, यो गर्मीको सुरुमा धेरै दिनसम्म लगातार पानी पर्ने समय हो, त्यसैले यो सही उत्तर हो। ४. 겨울철 (हिउँद ऋतु) हो, यो उत्तर मिलेन। सही उत्तर ३ नम्बरको 장마철 हो जसको अर्थ वर्षायाम हो।"}, {"n": "82", "q": "기온이 매우 높고, 습도가 높아 더운 날씨가 지속되는 현상입니다. 이로 인해 몸이 피로하고 불쾌한 기 분이 들 수 있습니다.", "options": ["무더위", "장마철", "3한 4온", "성수기"], "answer": 0, "explain": "무더위 भनेको तापक्रम धेरै उच्च हुने र आर्द्रता बढेर अत्यधिक गर्मी महसुस हुने अवस्था हो, यो नै सही उत्तर हो। 장마철 भनेको लगातार पानी पर्ने वर्षायामको मौसम हो, यो यस विवरणसँग मिल्दैन। 삼한사온 भनेको कोरियामा जाडो मौसममा तीन दिन चिसो र चार दिन न्यानो हुने मौसमी क्रम हो, यो यस विवरणसँग मिल्दैन। 성수기 भनेको व्यापार वा पर्यटनको अत्यधिक व्यस्त र मुख्य मौसम हो, यो यस विवरणसँग मिल्दैन। सही उत्तर एक नम्बरको 무더위 हो जसको अर्थ अत्यधिक गर्मी हुन्छ। तेस्रो विकल्प '3한 4온' किताबमा छापिएजस्तै राखिएको छ — यो 삼한사온 को अङ्क-रूप हो।"}, {"n": "83", "q": "바다와 육지가 만나는 곳으로, 모래가 깔려 있고 바다를 가까이에서 즐길 수 있는 장소입니다. 여름철 에 많은 사람들이 휴식을 취하거나 물놀이를 즐깁 니다.", "options": ["호수", "해변", "산맥", "연못"], "answer": 1, "explain": "१. 호수 (ताल) हो, यो उत्तर मिलेन। २. 해변 (समुद्र किनार/समुद्र तट) हो, यो समुद्र र जमिन जोडिने ठाउँ जहाँ बालुवा फैलिएको हुन्छ र गर्मीमा मानिसहरू आराम गर्न जान्छन्, त्यसैले यो सही उत्तर हो। ३. 산맥 (पहाडी श्रृङ्खला) हो, यो उत्तर मिलेन। ४. 연못 (पोखरी) हो, यो उत्तर मिलेन। सही उत्तर २ नम्बरको 해변 हो जसको अर्थ समुद्र किनार हो।"}, {"n": "84", "q": "가을에 나뭇잎이 붉거나 노랗게 변하는 현상입니다. 기온이 떨어지면서 엽록소가 줄어들어 다양한 색을 띠게 되며, 가을의 대표적인 풍경으로 아름답습니다.", "options": ["산맥", "단풍", "야경", "전망"], "answer": 1, "explain": "१. 산맥 (पहाडी श्रृङ्खला) हो, यो उत्तर मिलेन। २. 단풍 (पात रातो वा पहेँलो हुने शरद ऋतुको दृश्य) हो, यो शरद ऋतुमा रुखका पातहरू राता वा पहेँलो हुने प्राकृतिक प्रक्रिया हो, त्यसैले यो सही उत्तर हो। ३. 야경 (रातको दृश्य) हो, यो उत्तर मिलेन। ४. 전망 (दृश्यावलोकन) हो, यो उत्तर मिलेन। सही उत्तर २ नम्बरको 단풍 हो जसको अर्थ पात पहेँलो वा रातो हुने शरद ऋतुको दृश्य हो।"}, {"n": "85", "q": "특정한 주제나 기념일을 기리기 위해 사람들이 모여 즐기는 행사입니다. 음악, 음식, 문화 등의 다양 한 활동을 통해 즐거운 분위기를 만듭니다.", "options": ["명절", "생일", "축제", "휴일"], "answer": 2, "explain": "१. 명절 (चाडपर्व) हो, यो उत्तर मिलेन। २. 생일 (जन्मदिन) हो, यो उत्तर मिलेन। ३. 축제 (महोत्सव/चाड) हो, यो कुनै विशेष विषय वा उत्सव मनाउन मानिसहरू जम्मा भएर रमाइलो गर्ने कार्यक्रम हो, त्यसैले यो सही उत्तर हो। ४. 휴일 (बिदाको दिन) हो, यो उत्तर मिलेन। सही उत्तर ३ नम्बरको 축제 हो जसको अर्थ महोत्सव हो।"}, {"n": "86", "q": "학교나 회사에서 참가자들이 다양한 스포츠 활동 을 통해 경쟁하는 행사입니다. 팀워크와 스포츠 정 신을 기르며, 학생이나 직원들이 즐겁게 참여하는 활동입니다.", "options": ["운동회", "동호회", "동문회", "금융회"], "answer": 0, "explain": "१. 운동회 (खेलकुद प्रतियोगिता) हो, यो स्कुल वा कम्पनीमा विभिन्न खेलकुद गतिविधिमार्फत प्रतिस्पर्धा गर्ने कार्यक्रम हो, त्यसैले यो सही उत्तर हो। २. 동호회 (सौखिन क्लब) हो, यो उत्तर मिलेन। ३. 동문회 (पूर्वविद्यार्थी मिलनकेन्द्र) हो, यो उत्तर मिलेन। ४. 금융회 (वित्तीय संस्था) हो, यो उत्तर मिलेन। सही उत्तर १ नम्बरको 운동회 हो जसको अर्थ खेलकुद प्रतियोगिता हो।"}, {"n": "87", "q": "특정한 시간과 장소에서의 공기의 온도를 말하며 이를 통해서 날씨의 변화를 알 수 있는 중요한 지표로, 일반적으로 섭씨(°C)나 화씨(°F)로 측정됩니다.", "options": ["기온", "환경", "난방", "냉방"], "answer": 0, "explain": "१. 기온 (तापक्रम) हो, यो निश्चित समय र स्थानको हावाको तापक्रम हो जसले मौसमको परिवर्तन बुझाउँछ, त्यसैले यो सही उत्तर हो। २. 환경 (वातावरण) हो, यो उत्तर मिलेन। ३. 난방 (तातो बनाउने व्यवस्था/हिटिङ) हो, यो उत्तर मिलेन। ४. 냉방 (चिसो बनाउने व्यवस्था/एन्कर्डिसनिङ) हो, यो उत्तर मिलेन। सही उत्तर १ नम्बरको 기온 हो जसको अर्थ तापक्रम हो।"}, {"n": "88", "q": "혈연이나 결혼으로 연결된 사람들로, 서로 돌보고 지원하는 관계입니다. 부모, 형제자매, 자녀 등 다양 한 구성원이 있을 수 있습니다.", "options": ["배우자", "친척", "호칭", "가족"], "answer": 3, "explain": "배우자 भनेको पति वा पत्नी भन्ने बुझाउने शब्द हो, यो यस विवरणसँग मिल्दैन। 친척 भनेको रक्तसम्बन्ध वा विवाहले जोडिएका अन्य नातेदारहरू हुन्, यो यस विवरणसँग मिल्दैन। 호칭 भनेको मानिसलाई सम्बोधन गर्ने पद वा नाम हो, यो यस विवरणसँग मिल्दैन। 가족 भनेको रगतको नाता वा विवाहले जोडिएर एकै ठाउँमा बसेर एकअर्कालाई सहयोग गर्ने परिवार हो, यो नै सही उत्तर हो। सही उत्तर चार नम्बरको 가족 हो जसको अर्थ परिवार हुन्छ।"}, {"n": "89", "q": "함께 시간을 보내며 마음을 나누는 가까운 사람입니다. 서로를 이해하고 도와주는 소중한 존재입니다.", "options": ["자매", "친구", "이웃", "남매"], "answer": 1, "explain": "१. 자매 (दिदीबहिनी) हो, यो उत्तर मिलेन। २. 친구 (साथी) हो, यो सँगै समय बिताउने र मन साटासाट गर्ने नजिकको व्यक्ति हो, त्यसैले यो सही उत्तर हो। ३. 이웃 (छिमेकी) हो, यो उत्तर मिलेन। ४. 남매 (दाजुबहिनी/भाइदिदी) हो, यो उत्तर मिलेन। सही उत्तर २ नम्बरको 친구 हो जसको अर्थ साथी हो।"}, {"n": "90", "q": "같은 부모에게서 태어난 남자 형제들을 말합니다. 서로 가까운 사이로, 함께 자라며 정을 나누는 가족 구성원입니다.", "options": ["형제", "자매", "남매", "모녀"], "answer": 0, "explain": "१. 형제 (दाजुभाइ) हो, यो एउटै आमाबाबुबाट जन्मिएका दाजुभाइहरूलाई बुझाउने शब्द हो, त्यसैले यो सही उत्तर हो। २. 자매 (दिदीबहिनी) हो, यो उत्तर मिलेन। ३. 남매 (दाजुबहिनी/भाइदिदी) हो, यो उत्तर मिलेन। ४. 모녀 (आमा र छोरी) हो, यो उत्तर मिलेन। सही उत्तर १ नम्बरको 형제 हो जसको अर्थ दाजुभाइ हो।"}, {"n": "91", "q": "같은 부모에게서 태어난 여자 형제들을 말합니다. 함께 자라며 정을 나누는 가까운 가족입니다.", "options": ["형제", "자매", "조카", "손자"], "answer": 1, "explain": "पहिलो विकल्प 형제 को अर्थ दाजुभाइ वा दाजुभाइ-दिदीबहिनी हो, तर यो प्रश्नले 'महिला दाजुभाइ (दिदीबहिनी)' लाई मात्र भनेको हुनाले यो पूर्ण मिल्दैन। दोस्रो विकल्प 자매 को अर्थ दिदीबहिनी हो र यो एउटै आमाबुवाबाट जन्मेका महिला दिदीबहिनीहरूलाई जनाउने शब्द भएकाले सही उत्तर हो। तेस्रो विकल्प 조카 को अर्थ भतिजा वा भतिजी हो। चौथो विकल्प 손자 को अर्थ नाति हो। तसर्थ, सही उत्तर 자매 हो जसको अर्थ दिदीबहिनी हुन्छ।"}, {"n": "92", "q": "같은 부모에게서 태어난 오빠와 여동생 또는 형과 누이의 관계를 말합니다. 서로 다른 성별의 형제자매를 이르는 말입니다.", "options": ["조부", "남매", "부모", "자매"], "answer": 1, "explain": "पहिलो विकल्प 조부 को अर्थ बाजे वा हजुरबुवा हो। दोस्रो विकल्प 남매 को अर्थ दाजु-बहिनी वा भाइ-दिदी हो जुन विभिन्न लिङ्गका दाजुभाइ-दिदीबहिनीलाई बुझाउने शब्द भएकाले सही उत्तर हो। तेस्रो विकल्प 부모 को अर्थ आमाबुवा हो। चौथो विकल्प 자매 को अर्थ दिदीबहिनी हो। तसर्थ, सही उत्तर 남매 हो जसको अर्थ दाजु-बहिनी (विभिन्न लिङ्गका सहोदर) हुन्छ।"}, {"n": "93", "q": "사람의 생각이나 행동에서 나타나는 고유한 성질입니다. 태도, 감정 표현, 대인 관계 방식 등에 영향을 줍니다.", "options": ["행위", "신장", "성격", "외모"], "answer": 2, "explain": "१. 행위 भनेको काम वा व्यवहार हो, त्यसैले यो विवरणसँग मिल्दैन।\n२. 신장 भनेको मानिसको उचाइ हो, त्यसैले यो विवरणसँग मिल्दैन।\n३. 성격 भनेको मानिसको स्वभाव हो, जसले सोच र व्यवहारलाई देखाउँछ, त्यसैले यो सही उत्तर हो।\n४. 외모 भनेको मानिसको बाहिरी रूप हो, त्यसैले यो विवरणसँग मिल्दैन।\nतसर्थ सही उत्तर ३ नम्बरको 성격 हो, जसको अर्थ स्वभाव हो।"}, {"n": "94", "q": "사람의 얼굴 생김새나 전체적인 겉모습을 말합니다. 첫인상이나 다른 사람에게 보이는 시각적인 특징에 해당합니다.", "options": ["체중", "신장", "외모", "태도"], "answer": 2, "explain": "पहिलो विकल्प 체중 को अर्थ तौल हो। दोस्रो विकल्प 신장 को अर्थ उचाइ हो। तेस्रो विकल्प 외모 को अर्थ बाह्य रूप वा मुहारको बनावट हो जुन मानिसको देखिने स्वरूप हो, त्यसैले यो सही उत्तर हो। चौथो विकल्प 태도 को अर्थ बानी वा व्यवहार हो। तसर्थ, सही उत्तर 외모 हो जसको अर्थ बाह्य रूप वा मुहारको बनावट हुन्छ।"}, {"n": "95", "q": "같은 취미를 가진 사람들이 취미 활동을 같이 하는 모임입니다.", "options": ["동호회", "운동회", "동문회", "금융회"], "answer": 0, "explain": "पहिलो विकल्प 동호회 को अर्थ रुचि वा सोख मिल्ने मानिसहरूको समूह (क्लब) हो, जसले सँगै सोखको काम गर्छन् र यो सही उत्तर हो। दोस्रो विकल्प 운동회 को अर्थ खेलकुद प्रतियोगिता हो। तेस्रो विकल्प 동문회 को अर्थ पूर्वविद्यार्थीहरूको मिलन केन्द्र वा संघ हो। चौथो विकल्प 금융회 को अर्थ वित्तीय संस्था हो। तसर्थ, सही उत्तर 동호회 हो जसको अर्थ रुचि मिल्ने साथीहरूको समूह हुन्छ।"}, {"n": "96", "q": "자신보다 나이가 많은 사람, 나이가 어려도 처음 만난 사람이나 별로 가깝지 않은 사람과 사용하는 말입니다.", "options": ["반말", "높임말", "외국어", "표준어"], "answer": 1, "explain": "१. 반말 भनेको आफूभन्दा साना वा नजिकका मानिससँग बोलिने ठाडो भाषा हो, त्यसैले यो विवरणसँग मिल्दैन।\n२. 높임말 भनेको आफूभन्दा ठूला वा पहिलो पटक भेटिएका मानिससँग बोलिने आदरार्थी भाषा हो, त्यसैले यो विवरणसँग मिल्छ।\n३. 외국어 भनेको विदेशी भाषा हो, त्यसैले यो विवरणसँग मिल्दैन।\n४. 표준어 भनेको मानक भाषा हो, त्यसैले यो विवरणसँग मिल्दैन।\nतसर्थ सही उत्तर २ नम्बरको 높임말 हो, जसको अर्थ आदरार्थी भाषा हो।"}, {"n": "97", "q": "자기보다 나이가 어리거나 회사에서 직위가 낮은 사람에게 낮추어 하는 말입니다.", "options": ["반말", "높임말", "사투리", "모국어"], "answer": 0, "explain": "१. 반말 भनेको आफूभन्दा साना वा तल्लो पदका मानिसलाई बोलिने ठाडो भाषा हो, त्यसैले यो विवरणसँग मिल्छ।\n२. 높임말 भनेको ठूला मानिसलाई प्रयोग गरिने आदरयुक्त भाषा हो, त्यसैले यो विवरणसँग मिल्दैन।\n३. 사투리 भनेको क्षेत्र अनुसार बोलिने स्थानीय भाषिका हो, त्यसैले यो विवरणसँग मिल्दैन।\n४. 모국어 भनेको मातृभाषा हो, त्यसैले यो विवरणसँग मिल्दैन।\nतसर्थ सही उत्तर १ नम्बरको 반말 हो, जसको अर्थ ठाडो भाषा हो।"}, {"n": "98", "q": "떠나는 사람을 기쁨 마음으로 보내는 뜻으로 같이 일하는 동료나 친구들이 모이는 자리입니다.", "options": ["야유회", "환영회", "환송회", "송년회"], "answer": 2, "explain": "१. 야유회 भनेको सहकर्मीहरूसँग घुम्न जाने पिकनिक हो, त्यसैले यो विवरणसँग मिल्दैन।\n२. 환영회 भनेको नयाँ मानिसलाई स्वागत गर्ने कार्यक्रम हो, त्यसैले यो विवरणसँग मिल्दैन।\n३. 환송회 भनेको छाडेर जाने साथी वा सहकर्मीलाई बिदाइ गर्ने कार्यक्रम हो, त्यसैले यो विवरणसँग मिल्छ।\n४. 송년회 भनेको वर्षको अन्त्यमा गरिने भोज हो, त्यसैले यो विवरणसँग मिल्दैन।\nतसर्थ सही उत्तर ३ नम्बरको 환송회 हो, जसको अर्थ बिदाइ भोज हो।"}, {"n": "99", "q": "밥에 여러 가지 나물, 고기, 고추장 등을 올리고 잘 섞어 먹는 한국 음식이에요. 다양한 재료가 어우러져 맛있고 영양가가 높습니다.", "options": ["김치", "비빔밥", "불고기", "삼계탕"], "answer": 1, "explain": "पहिलो विकल्प 김치 को अर्थ किम्ची हो। दोस्रो विकल्प 비빔밥 को अर्थ बिबिम्बाब हो जुन भातमा तरकारी, मासु र खोर्सानीको पेस्ट (कोचुजाङ) मिसाएर खाइने कोरियाली खाना हो, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 불고기 को अर्थ बुलगोगी हो। चौथो विकल्प 삼계탕 को अर्थ साम्येतं हो। तसर्थ, सही उत्तर 비빔밥 हो जसको अर्थ विभिन्न परिकार मिसाइएको भात हुन्छ।"}, {"n": "100", "q": "얇게 썬 고기를 간장, 설탕, 마늘 등으로 양념해 구워 먹는 한국 음식입니다. 보통 소고기나 돼지고기를 사용하며, 달콤하고 짭짤한 맛이 특징입니다.", "options": ["삼겹살", "삼계탕", "불고기", "제육볶음"], "answer": 2, "explain": "१. 삼겹살 भनेको बंगुरको पेटको मासु पोलेर खाने परिकार हो, त्यसैले यो विवरणसँग मिल्दैन।\n२. 삼계탕 भनेको कुखुराको मासुमा जडीबुटी हालेर बनाइने सुप हो, त्यसैले यो विवरणसँग मिल्दैन।\n३. 불고기 भनेको मसिनो गरी काटेको मासुमा भटमासको सस र चिनी हालेर पकाउने गुलियो-नुनिलो कोरियाली खाना हो, त्यसैले यो विवरणसँग मिल्छ।\n४. 제육볶음 भनेको पिरो लेदोमा भुटेको बंगुरको मासु हो, त्यसैले यो विवरणसँग मिल्दैन।\nतसर्थ सही उत्तर ३ नम्बरको 불고기 हो, जसको अर्थ मसिनो गरी काटेर पोलेको मासु हो।"}, {"n": "101", "q": "된장(된장 발효된 콩)을 넣고 끓인 국물 요리이고 보통 두부, 야채, 고기 등을 함께 넣어 맛을 내며, 구수하고 건강한 맛이 특징입니다.", "options": ["닭도리탕", "삼계탕", "된장찌개", "김치찌개"], "answer": 2, "explain": "पहिलो विकल्प 닭도리탕 को अर्थ डक्ताोरिताङ हो। दोस्रो विकल्प 삼계탕 को अर्थ साम्येतं हो। तेस्रो विकल्प 된장찌개 को अर्थ थेन्जाङ्찌गे हो जुन भटमासको पेस्ट (थेन्जाङ) हालेर बनाइने झोल परिकार हो र यसमा तोफु, तरकारी आदि मिसाइन्छ, त्यसैले यो सही उत्तर हो। चौथो विकल्प 김치찌개 को अर्थ किम्ची찌गे हो। तसर्थ, सही उत्तर 된장찌개 हो जसको अर्थ थेन्जाङ्찌गे (भटमासको पेस्टको सुप) हुन्छ।"}, {"n": "102", "q": "잘 익은 김치를 주 재료로 한 한국의 전통 찌개로 돼지고기나 두부, 야채 등을 넣고 끓여 먹는 매콤하고 국물이 많은 음식입니다.", "options": ["감자탕", "갈비탕", "된장찌개", "김치찌개"], "answer": 3, "explain": "पहिलो विकल्प 감자탕 को अर्थ कामजाथाङ हो। दोस्रो विकल्प 갈비탕 को अर्थ काल्भिथाङ हो। तेस्रो विकल्प 된장찌개 को अर्थ थेन्जाङ्찌गे हो। चौथो विकल्प 김치찌개 को अर्थ किम्ची찌गे हो जुन पाकेको किम्ची मुख्य सामग्री, तोफु र सुँगुरको मासु हालेर उमालेको पिरो र झोलयुक्त परिकार हो, त्यसैले यो सही उत्तर हो। तसर्थ, सही उत्तर 김치찌개 हो जसको अर्थ किम्ची찌गे हुन्छ।"}, {"n": "103", "q": "끓는 물에 면과 스프를 넣어 간단하게 만드는 즉석 국수이고 매운 맛이나 순한 맛 등 다양한 종류가 있어, 빠르고 맛있게 먹을 수 있는 음식입니다.", "options": ["라면", "만두", "잡채", "간장"], "answer": 0, "explain": "पहिलो विकल्प 라면 को अर्थ राम्युन (इन्स्ट्यान्ट चाउचाउ) हो जुन उम्लिएको पानीमा चाउचाउ र मसला हालेर सजिलै बनाइने र छिटो खान सकिने परिकार हो, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 만두 को अर्थ मोमो/मान्दु हो। तेस्रो विकल्प 잡채 को अर्थ चाप्चे हो। चौथो विकल्प 간장 को अर्थ सोया सस हो। तसर्थ, सही उत्तर 라면 हो जसको अर्थ राम्युन हुन्छ।"}, {"n": "104", "q": "배추 또는 무 등을 소금에 절여서 고춧가루, 파, 마늘, 생강 등의 양념을 버무린 뒤 발효시킨 음식입니다.", "options": ["잡채", "김밥", "만두", "김치"], "answer": 3, "explain": "पहिलो विकल्प 잡채 को अर्थ चाप्चे हो। दोस्रो विकल्प 김밥 को अर्थ किम्बाब हो। तेस्रो विकल्प 만두 को अर्थ मान्दु हो। चौथो विकल्प 김치 को अर्थ किम्ची हो जुन बन्दाकोबी वा मुलालाई नुनमा गलाएर खुर्सानीको धुलो, लसुन, अदुवा आदि मसला मिसाई किण्वन (फमेन्टेशन) गरेर बनाइएको परिकार हो, त्यसैले यो सही उत्तर हो। तसर्थ, सही उत्तर 김치 हो जसको अर्थ किम्ची हुन्छ।"}, {"n": "105", "q": "소금과 참기름으로 맛을 낸 밥을 시금치, 단무지, 당근, 달걀 등 속재료를 넣고 김으로 말아서 입의 크기로 썰어 낸 음식입니다.", "options": ["김밥", "만두", "김치", "잡채"], "answer": 0, "explain": "पहिलो विकल्प 김밥 को अर्थ किम्बाब हो जुन नुन र तिलको तेलले स्वाद सुधारेको भातमा पालक, मुलाको अचार (दानमुजी), गाजर, अण्डा आदि सामग्री राखेर समुद्री लेउ (किम) ले बेरेर मुखको आकारमा काटेको परिकार हो, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 만두 को अर्थ मान्दु हो। तेस्रो विकल्प 김치 को अर्थ किम्ची हो। चौथो विकल्प 잡채 को अर्थ चाप्चे हो। तसर्थ, सही उत्तर 김밥 हो जसको अर्थ किम्बाब हुन्छ।"}, {"n": "106", "q": "중국에서 유래한 한국의 인기 있는 면 요리예요. 고소한 짜장 소스에 면을 비벼 먹으며, 보통 돼지고기와 채소가 들어갑니다.", "options": ["라면", "돈가스", "자장면", "탕수육"], "answer": 2, "explain": "1. 라면 भनेको चाउचाउ हो, यो विवरणसँग मिल्दैन। 2. 돈가스 भनेको सुँगुरको मासुको कटलेट हो, यो सही उत्तर होइन। 3. 자장면 भनेको कालो सससँग मिसाएर खाने चिनियाँ शैलीको चाउचाउ हो, त्यसैले यो सही उत्तर हो। 4. 탕수육 भनेको गुलियो र अमिलो सस भएको सुँगुरको मासु हो, यो मिल्दैन। सही उत्तर 3 नम्बरको자장면 हो जसको अर्थ जाजाङम्योन (चाउचाउ) हो।"}, {"n": "107", "q": "물건을 사거나 서비스를 이용한 후, 지불한 금액과 내용을 적어 주는 문서입니다.", "options": ["청구서", "영수증", "자격증", "신분증"], "answer": 1, "explain": "1. 청구서 भनेको बिल वा भुक्तानीको माग गर्ने कागजात हो, यो विवरणसँग मिल्दैन। 2. 영수증 भनेको सामान किनेपछि रकम र विवरण लेखेर दिने रसिद हो, त्यसैले यो सही उत्तर हो। 3. 자격증 भनेको योग्यताको प्रमाणपत्र हो, यो मिल्दैन। 4. 신분증 भनेको परिचय पत्र हो, यो मिल्दैन। सही उत्तर 2 नम्बरको영수증 हो जसको अर्थ रसिद हो।"}, {"n": "108", "q": "밥과 함께 먹는 작은 양의 음식으로, 다양한 종류가 있고 김치, 나물, 찌개 등 여러 가지로 함께 먹으면서 밥을 맛있게 즐길 수 있습니다.", "options": ["음료", "반찬", "후식", "비채식"], "answer": 1, "explain": "음료 भनेको पेय पदार्थ हो, यो भातसँग खाइने मुख्य तरकारी होइन। 반찬 भनेको तरकारी वा परिकार हो, यो भातसँग किम्ची, साग, जिगे आदि मिलाएर खाइने भएकाले विवरणसँग मिल्छ। 후식 भनेको खाना खाएपछि खाइने डेजर्ट हो, यो भातसँग खाने कुरा होइन। 비채식 भनेको मांसाहारी भोजन हो, यसले भातसँग खाने परिकारलाई मात्र जनाउँदैन। त्यसैले सही उत्तर २ नम्बरको 반찬 हो, जसको अर्थ तरकारी वा परिकार हुन्छ।"}, {"n": "109", "q": "식당이나 매장에서 주문이나 결제를 할 수 있도록 설치된 무인 기계이며 사람 없이도 스스로 메뉴를 선택하고 계산할 수 있습니다.", "options": ["키오스크", "계산기", "식당표", "할인쿠폰"], "answer": 0, "explain": "1. 키오스크 भनेको अर्डर र भुक्तानी गर्न राखिएको स्वचालित मेशिन हो, त्यसैले यो सही उत्तर हो। 2. 계산기 भनेको क्याल्कुलेटर (हिसाब गर्ने यन्त्र) हो, यो मिल्दैन। 3. 식당표 भनेको रेस्टुरेन्टको तालिका वा मेनु हो, यो मिल्दैन। 4. 할인쿠폰 भनेको छुटकुपन हो, यो मिल्दैन। सही उत्तर 1 नम्बरको키오스크 हो जसको अर्थ किओस्क (स्वचालित मेशिन) हो।"}, {"n": "110", "q": "국가에서 공식적으로 발행한 종이 형태의 화폐로, 물건을 사거나 서비스를 이용할 때 사용하는 돈입니다.", "options": ["동전", "우표", "수표", "지폐"], "answer": 3, "explain": "1. 동전 भनेको सिक्का हो, यो मिल्दैन। 2. 우표 भनेको हुलाक टिकट हो, यो मिल्दैन। 3. 수표 भनेको चेक हो, यो मिल्दैन। 4. 지폐 भनेको कागजको नोट हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको지폐 हो जसको अर्थ कागजको नोट (कागजको पैसा) हो।"}, {"n": "111", "q": "금속으로 만든 화폐로, 주로 지폐보다 적은 금액을 나타내며 물건을 사거나 거스름돈으로 사용합니다.", "options": ["지폐", "우표", "수표", "동전"], "answer": 3, "explain": "1. 지폐 भनेको कागजको नोट हो, यो मिल्दैन। 2. 우표 भनेको हुलाक टिकट हो, यो मिल्दैन। 3. 수표 भनेको चेक हो, यो मिल्दैन। 4. 동전 भनेको धातुले बनेको सिक्का हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको동전 हो जसको अर्थ सिक्का हो।"}, {"n": "112", "q": "은행이나 카드 회사에서 발급하는 플라스틱 카드로, 물건을 살 때 현금 없이 결제하고 나중에 돈을 갚는 방식입니다.", "options": ["직불카드", "신용카드", "현금카드", "상품권"], "answer": 1, "explain": "1. 직불카드 भनेको डेबिट कार्ड हो, यो मिल्दैन। 2. 신용카드 भनेको क्रेडिट कार्ड हो जसले पछि पैसा तिर्ने गरी सामान किन्न मिल्छ, त्यसैले यो सही उत्तर हो। 3. 현금카드 भनेको क्यास कार्ड (नगद कार्ड) हो, यो मिल्दैन। 4. 상품권 भनेको उपहार भौचर हो, यो मिल्दैन। सही उत्तर 2 नम्बरको신용카드 हो जसको अर्थ क्रेडिट कार्ड हो।"}, {"n": "113", "q": "구입한 물품을 마음에 들지 않거나 다른 불편한 점이 있을 때 주어진 기간에 바꿀 수 있는 것을 말합니다.", "options": ["환불", "수출", "교환", "수입"], "answer": 2, "explain": "1. 환불 भनेको पैसा फिर्ता लिनु हो, यो मिल्दैन। 2. 수출 भनेको निर्यात हो, यो मिल्दैन। 3. 교환 भनेको किनेको सामान फेर्नु (साटासाट गर्नु) हो, त्यसैले यो सही उत्तर हो। 4. 수입 भनेको आयात हो, यो मिल्दैन। सही उत्तर 3 नम्बरको교환 हो जसको अर्थ साटासाट (एक्सचेन्ज) हो।"}, {"n": "114", "q": "구입한 물건을 판매자에게 돌려주고 지불한 돈의 전부 또는 일부를 되돌려 받는 것을 말합니다.", "options": ["교환", "환불", "반품", "손실"], "answer": 1, "explain": "1. 교환 भनेको सामान साट्नु हो, यो मिल्दैन। 2. 환불 भनेको पैसा फिर्ता लिनु हो, त्यसैले यो सही उत्तर हो। 3. 반품 भनेको सामान फिर्ता गर्नु हो तर यहाँ पैसा फिर्ता लिने कुरा गरिएको छ त्यसैले 환불 मिल्छ। 4. 손실 भनेको नोक्सान हो, यो मिल्दैन। सही उत्तर 2 नम्बरको환불 हो जसको अर्थ पैसा फिर्ता (रिफन्ड) हो।"}, {"n": "115", "q": "직원 없이 운영되는 가게로, 손님이 직접 물건을 고르고 계산까지 스스로 하는 곳으로 주로 키오스크나 자동결제 시스템을 이용해 물건을 살 수 있습니다.", "options": ["백화점", "수퍼마켓", "무인 판매점", "할인 행사"], "answer": 2, "explain": "1. 백화점 भनेको डिपार्टमेन्ट स्टोर हो, यो मिल्दैन। 2. 수퍼마켓 भनेको सुपरमार्केट हो, यो मिल्दैन। 3. 무인 판매점 भनेको कर्मचारी बिना चल्ने मानवविहीन पसल हो, त्यसैले यो सही उत्तर हो। 4. 할인 행사 भनेको छुटको कार्यक्रम हो, यो मिल्दैन। सही उत्तर 3 नम्बरको무인 판매점 हो जसको अर्थ मानवविहीन बिक्री केन्द्र (अनभेटेड स्टोर) हो।"}, {"n": "116", "q": "물건을 사거나 서비스를 이용한 뒤, 그에 대한 돈을 지불하는 것을 말하며 현금, 카드, 모바일 등 다양한 방법으로 결제할 수 있습니다.", "options": ["입금", "이체", "결제", "반품"], "answer": 2, "explain": "1. 입금 भनेको बैंकमा पैसा जम्मा गर्नु हो, यो मिल्दैन। 2. 이체 भनेको पैसा स्थानान्तरण गर्नु हो, यो मिल्दैन। 3. 결제 भनेको सामान वा सेवाको मूल्य भुक्तानी गर्नु हो, त्यसैले यो सही उत्तर हो। 4. 반품 भनेको सामान फिर्ता गर्नु हो, यो मिल्दैन। सही उत्तर 3 नम्बरको결제 हो जसको अर्थ भुक्तानी हो।"}, {"n": "117", "q": "재활용이나 음식물 쓰레기로 분류되지 않는 쓰레기로, 소각이나 매립이 필요한 쓰레기입니다.", "options": ["일반쓰레기", "재활용 쓰레기", "대형 쓰레기", "음식물 쓰레기"], "answer": 0, "explain": "1. 일반쓰레기 भनेको सामान्य फोहोर (जुन पुनर्चक्रण हुँदैन) हो, त्यसैले यो सही उत्तर हो। 2. 재활용 쓰레기 भनेको पुनर्चक्रण गर्ने फोहोर हो, यो मिल्दैन। 3. 대형 쓰레기 भनेको ठूला फोहोरहरू हुन्, यो मिल्दैन। 4. 음식물 쓰레기 भनेको खानाको फोहोर हो, यो मिल्दैन। सही उत्तर 1 नम्बरको일반쓰레기 हो जसको अर्थ सामान्य फोहोर हो।"}, {"n": "118", "q": "다시 사용할 수 있도록 분리하여 버리는 쓰레기로, 자원을 절약하고 환경을 보호하는 데 도움이 됩니다.", "options": ["일반쓰레기", "재활용 쓰레기", "대형 쓰레기", "음식물 쓰레기"], "answer": 1, "explain": "1. 일반쓰레기 भनेको सामान्य फोहोर हो, यो मिल्दैन। 2. 재활용 쓰레기 भनेको पुनर्चक्रण गर्न मिल्ने फोहोर हो, त्यसैले यो सही उत्तर हो। 3. 대형 쓰레기 भनेको ठूला फोहोरहरू हुन्, यो मिल्दैन। 4. 음식물 쓰레기 भनेको खानाको फोहोर हो, यो मिल्दैन। सही उत्तर 2 नम्बरको재활용 쓰레기 हो जसको अर्थ पुनर्चक्रण फोहोर हो।"}, {"n": "119", "q": "쓰레기나 재활용품 등을 모아 두는 용기로, 정해진 장소에 놓여 있어 사람들이 분리해서 버릴 수 있도록 도와줍니다.", "options": ["헌옷함", "청소함", "수거함", "공구함"], "answer": 2, "explain": "1. 헌옷함 भनेको पुराना लुगा राख्ने बक्स हो, यो मिल्दैन। 2. 청소함 भनेको सरसफाइको सामान राख्ने बक्स हो, यो मिल्दैन। 3. 수거함 भनेको फोहोर वा पुनर्चक्रण वस्तु सङ्कलन गर्ने भाँडो/बक्स हो, त्यसैले यो सही उत्तर हो। 4. 공구함 भनेको औजार राख्ने बक्स हो, यो मिल्दैन। सही उत्तर 3 नम्बरको수거함 हो जसको अर्थ सङ्कलन भाँडो (कलेक्सन बक्स) हो।"}, {"n": "120", "q": "옷이나 천의 주름을 펴고 매끄럽게 하기 위해 사용하는 가전제품으로 열을 이용해 옷의 주름을 없애는 데 사용돼요.", "options": ["밥솥", "냄비", "다리미", "냉장고"], "answer": 2, "explain": "1. 밥솥 भनेको भात पकाउने कुकर हो, यो मिल्दैन। 2. 냄비 भनेको पट्ट वा भाँडो हो, यो मिल्दैन। 3. 다리미 भनेको लुगाको सुरो (चाउरी) पन्छाउने इस्त्री हो, त्यसैले यो सही उत्तर हो। 4. 냉장고 भनेको फ्रिज हो, यो मिल्दैन। सही उत्तर 3 नम्बरको다리미 हो जसको अर्थ इस्त्री हो।"}, {"n": "121", "q": "철로 위를 달리는 대중교통 수단으로 전기를 사용하거나 디젤 엔진으로 움직이며, 정해진 노선을 따라 도시 간 이동이나 장거리 여행에 자주 이용됩니다.", "options": ["지하철", "택시", "버스", "기차"], "answer": 3, "explain": "पहिलो विकल्प 지하철 (भुमिगत रेल) हो, जुन शहरभित्र चल्छ। दोस्रो विकल्प 택시 (ट्याक्सी) हो, जुन सडकमा चल्ने व्यक्तिगत सवारी साधन हो। तेस्रो विकल्प 버스 (बस) हो, जुन सडकमा चल्छ तर प्रश्नमा रेलको ट्र्याकमा चल्ने भनिएको छ। चौथो विकल्प 기차 (रेलगाडी) हो, जुन रेलवे ट्र्याकमा गुड्छ र लामो दूरीको यात्रामा प्रयोग हुन्छ, त्यसैले यो सही उत्तर हो। सही उत्तर 기차 (रेलगाडी) हो।"}, {"n": "122", "q": "땅속에 설치된 철로를 따라 운행되는 도시형 대중교통수단입니다. 교통 혼잡을 피할 수 있어 빠르고 정시에 이동할 수 있습니다.", "options": ["고속열차", "지하철", "고속버스", "마을버스"], "answer": 1, "explain": "पहिलो विकल्प 고속열차 (तीव्र गतिका रेल) हो, जुन शहरबाहिर लामो दूरीका लागि हो। दोस्रो विकल्प 지하철 (भुमिगत रेल) हो, जुन जमिनमुनि बनेको रेलवे ट्र्याकमा चल्ने शहरी सार्वजनिक यातायात हो, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 고속버스 (द्रुत बस) हो, जुन सडकमा चल्छ। चौथो विकल्प 마을버스 (गाउँ/स्थानीय बस) हो, जुन सडकमा चल्छ। सही उत्तर 지하철 (भुमिगत रेल) हो।"}, {"n": "123", "q": "대개 표지판, 의자, 시간표 등이 설치되어 있고 어느 곳에 가기 위해 버스를 기다리기 편리한 장소입니다.", "options": ["지하철역", "버스 터미널", "기차역", "버스 정류장"], "answer": 3, "explain": "पहिलो विकल्प 지하철역 (मेट्रो स्टेशन) हो, जुन भुमिगत रेलका लागि हो। दोस्रो विकल्प 버스터미널 (बस टर्मिनल) हो, जुन ठूलो बसपार्क हो। तेस्रो विकल्प 기차역 (रेलवे स्टेशन) हो, जुन रेलका लागि हो। चौथो विकल्प 버스 정류장 (बस स्टप) हो, जहाँ बोर्ड, कुर्सी र समय तालिका राखिएको हुन्छ र बस पर्खन सजिलो हुन्छ, त्यसैले यो सही उत्तर हो। सही उत्तर 버스 정류장 (बस स्टप) हो।"}, {"n": "124", "q": "승객을 태우거나 내리게 하기 위해 정차하는 장소입니다. 표를 사는 곳, 대합실, 승강장 등이 갖추어져 있어 이용하는 사람들이 편리하게 이용할 수 있습니다.", "options": ["여객 터미널", "지하철역", "버스터미널", "버스 정류장"], "answer": 0, "explain": "पहिलो विकल्प 여객 터미널 (यात्रु टर्मिनल) हो, जहाँ टिकट काउन्टर, प्रतीक्षा कक्ष र प्लेटफर्महरू हुन्छन् र यात्रुहरू चढाउन वा ओराल्न रोकिन्छ, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 지하철역 (मेट्रो स्टेशन) हो, जुन ट्रेनका लागि हो। तेस्रो विकल्प 버스터미널 (बस टर्मिनल) हो, जुन बसका लागि मात्रै हुन्छ। चौथो विकल्प 버스 정류장 (बस स्टप) हो, जहाँ टिकट काउन्टर र प्रतीक्षा कक्ष हुँदैन। सही उत्तर 여객 터미널 (यात्रु टर्मिनल) हो।"}, {"n": "125", "q": "배가 정박하고 사람이나 화물을 싣고 내릴 수 있는 해안 지역입니다. 주로 무역, 어업, 여객 운송 등을 위한 중요한 교통 중심지 역할을 합니다.", "options": ["터미널", "공항", "기차역", "항구"], "answer": 3, "explain": "पहिलो विकल्प 터미널 (टर्मिनल) हो, जुन बस वा यातायातका लागि हो। दोस्रो विकल्प 공항 (विमानस्थल) हो, जुन जहाजका लागि हो। तेस्रो विकल्प 기차역 (रेलवे स्टेशन) हो, जुन रेलका लागि हो। चौथो विकल्प 항구 (बन्दरगाह) हो, जहाँ पानीजहाज रोकिएर मानिस वा सामान चढाइने र ओछ्याइने तटीय क्षेत्र हो, त्यसैले यो सही उत्तर हो। सही उत्तर 항구 (बन्दरगाह) हो।"}, {"n": "126", "q": "시속 200km 이상으로 달릴 수 있는 매우 빠른 열차입니다. 도시 간 이동 시간을 줄여주는 효율적인 교통수단입니다.", "options": ["지하철", "시내버스", "고속버스", "고속열차"], "answer": 3, "explain": "पहिलो विकल्प 지하철 (भुमिगत रेल) हो, जुन सामान्य गतिमा चल्छ। दोस्रो विकल्प 시내버스 (शहरभित्रको बस) हो, जुन सुस्त हुन्छ। तेस्रो विकल्प 고속버스 (द्रुत बस) हो, जुन सडकमा चल्छ। चौथो विकल्प 고속열차 (तिब्र गतिको रेल) हो, जुन प्रतिघण्टा २०० किलोमिटरभन्दा बढी गतिमा कुद्न सक्ने धेरै छिटो चल्ने रेल हो, त्यसैले यो सही उत्तर हो। सही उत्तर 고속열차 (तिब्र गतिको रेल) हो।"}, {"n": "127", "q": "두 팀이 공을 차서 상대 팀의 골대에 넣어 점수를 겨루는 스포츠입니다. 전 세계에서 가장 인기 있는 스포츠 중 하나입니다.", "options": ["농구", "골프", "축구", "탁구"], "answer": 2, "explain": "पहिलो विकल्प 농구 (बास्केटबल) हो, जुन हातले खेलिन्छ। दोस्रो विकल्प 골프 (गोल्फ) हो, जुन क्लबले बल हान्ने खेल हो। तेस्रो विकल्प 축구 (फुटबल) हो, जुन दुई टोलीले खुट्टाले बल प्रहार गरेर विपक्षीको गोलपोस्टमा छिराएर अंक जोड्ने खेल हो, त्यसैले यो सही उत्तर हो। चौथो विकल्प 탁구 (टेबल टेनिस) हो, जुन टेबलमा खेलिन्छ। सही उत्तर 축구 (फुटबल) हो।"}, {"n": "128", "q": "작은 공을 라켓으로 쳐서 네트를 넘기며 상대와 주고받는 실내 스포츠입니다. 빠른 반사신경과 정밀한 컨트롤이 중요한 경기입니다.", "options": ["농구", "골프", "탁구", "헬스"], "answer": 2, "explain": "पहिलो विकल्प 농구 (बास्केटबल) हो, जुन ठूलो बलले खेलिन्छ। दोस्रो विकल्प 골프 (गोल्फ) हो, जुन मैदानमा खेलिन्छ। तेस्रो विकल्प 탁구 (टेबल टेनिस) हो, जुन सानो बललाई र्याकेटले हानेर नेट पार गराई एकअर्कासँग खेल्ने इनडोर खेल हो, त्यसैले यो सही उत्तर हो। चौथो विकल्प 헬스 (जिम/स्वास्थ्य व्यायाम) हो, जुन फिटनेस खेल हो। सही उत्तर 탁구 (टेबल टेनिस) हो।"}, {"n": "129", "q": "두 팀이 공을 바구니에 넣어 점수를 겨루는 구기 스포츠입니다. 한 팀은 보통 5명으로 구성되며, 빠른 움직임과 팀워크가 중요합니다.", "options": ["축구", "농구", "배구", "스키"], "answer": 1, "explain": "पहिलो विकल्प 축구 (फुटबल) हो, जुन खुट्टाले खेलिन्छ। दोस्रो विकल्प 농구 (बास्केटबल) हो, जुन दुई टोलीले बल बास्केटमा हालेर अंक जोड्ने र प्रत्येक टोलीमा ५ जना हुने खेल हो, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 배구 (भलिबल) हो, जुन नेटको माथिबाट बल छिराउने खेल हो। चौथो विकल्प 스키 (स्की) हो, जुन हिउँमा खेल्ने खेल हो। सही उत्तर 농구 (बास्केटबल) हो।"}, {"n": "130", "q": "체력 증진과 건강 유지를 위한 운동을 의미합니다. 보통 체육관에서 근력 운동, 유산소 운동 등을 포함한 다양한 운동을 진행합니다.", "options": ["탁구", "헬스", "운동", "회식"], "answer": 1, "explain": "पहिलो विकल्प 탁구 (टेबल टेनिस) हो, जुन एक खेल मात्र हो। दोस्रो विकल्प 헬스 (जिम/स्वास्थ्य व्यायाम) हो, जुन शारीरिक शक्ति बढाउन र स्वास्थ्य कायम राख्न गरिने व्यायाम हो, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 운동 (व्यायाम/खेलकुद) हो, जुन धेरै व्यापक शब्द हो। चौथो विकल्प 회식 (सहकर्मीसँगको खाना/पार्टी) हो। सही उत्तर 헬스 (जिम/स्वास्थ्य व्यायाम) हो।"}, {"n": "131", "q": "운동이나 체육 활동을 할 수 있도록 마련된 넓은 공간입니다. 학교, 공원, 체육 시설 등에 있으며 축구, 달리기 등 다양한 운동이 가능합니다.", "options": ["운동장", "헬스장", "회의실", "교실"], "answer": 0, "explain": "पहिलो विकल्प 운동장 (खेल मैदान) हो, जुन खेलकुद वा शारीरिक गतिविधिको लागि तयार पारिएको फराकिलो ठाउँ हो, त्यसैले यो सही उत्तर हो। दोस्रो विकल्प 헬스장 (जिम हल) हो, जुन भित्री फिटनेस हल हो। तिस्रो विकल्प 회의실 (बैठक कक्ष) हो, जुन मिटिङका लागि हो। चौथो विकल्प 교실 (कक्षा कोठा) हो, जुन पढ्ने ठाउँ हो। सही उत्तर 운동장 (खेल मैदान) हो।"}, {"n": "132", "q": "다양한 운동 기구와 시설을 갖추고 있어 사람들이 체력 단련이나 건강 관리를 위해 이용하는 장소입니다. 러닝머신, 웨이트 기구, 샤워실 등이 갖춰져 있습니다.", "options": ["운동장", "헬스장", "축구장", "탁구장"], "answer": 1, "explain": "पहिलो विकल्प 운동장 (खेल मैदान) हो, जुन बाहिरी मैदान हो। दोस्रो विकल्प 헬스장 (जिम हल) हो, जहाँ विभिन्न व्यायाम उपकरण र सुविधाहरू हुन्छन् र मानिसहरूले शारीरिक व्यायामका लागि प्रयोग गर्छन्, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 축구장 (फुटबल मैदान) हो। चौथो विकल्प 탁구장 (टेबल टेनिस खेल्ने हल) हो। सही उत्तर 헬스장 (जिम हल) हो।"}, {"n": "133", "q": "신이나 힘에 대한 믿음을 통하여 인간 생활의 어려움을 해결하고 삶의 긍정적인 의미를 추구하는 문화 체계입니다.", "options": ["약속", "교인", "종교", "신자"], "answer": 2, "explain": "पहिलो विकल्प 약속 (प्रतिज्ञा/वचन) हो। दोस्रो विकल्प 교인 (चर्चको अनुयायी) हो। तेस्रो विकल्प 종교 (धर्म) हो, जुन देवता वा शक्तिको विश्वासमार्फत मानवीय जीवनका कठिनाइहरू समाधान गर्ने सांस्कृतिक प्रणाली हो, त्यसैले यो सही उत्तर हो। चौथो विकल्प 신자 (श्रद्धालु/भक्त) हो। सही उत्तर 종교 (धर्म) हो।"}, {"n": "134", "q": "일요일과 같이 국가나 사회에서 정하여진 휴일로 설날, 추석, 한글날, 삼일절 등이 이에 해당합니다.", "options": ["약정 휴일", "공휴일", "법정휴일", "주휴일"], "answer": 1, "explain": "पहिलो विकल्प 약정 휴일 (सम्झौता गरिएको बिदा) हो। दोस्रो विकल्प 공휴일 (सार्वजनिक बिदा) हो, जुन सरकार वा समाजले तोकेको बिदा हो जस्तै सोलनाल, छुसक, हान글 दिवस आदि, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 법정휴일 (कानुनी बिदा) हो। चौथो विकल्प 주휴일 (साप्ताहिक बिदा) हो। सही उत्तर 공휴일 (सार्वजनिक बिदा) हो।"}, {"n": "135", "q": "사람이 있거나 사물이 놓여 있는 장소를 말합니다. 기준이 되는 점이나 사물과의 관계로 표현됩니다.", "options": ["방향", "위치", "주소", "지역"], "answer": 1, "explain": "पहिलो विकल्प 방향 (दिशा) हो। दोस्रो विकल्प 위치 (स्थान/अवस्थिति) हो, जसले मानिस वा वस्तु रहेको ठाउँलाई बुझाउँछ र आधार बिन्दुसँगको सम्बन्धबाट व्यक्त गरिन्छ, त्यसैले यो सही उत्तर हो। तेस्रो विकल्प 주소 (ठेगाना) हो। चौथो विकल्प 지역 (क्षेत्र) हो। सही उत्तर 위치 (स्थान/अवस्थिति) हो।"}, {"n": "136", "q": "보행자가 도로를 안전하게 건널 수 있도록 표시 해 놓은 길입니다. 보통 흰색 줄무늬로 표시되어 있으며, 신호등이 함께 설치되어 있는 경우도 많습니다.", "options": ["원형교차로", "횡단보도", "사거리", "삼거리"], "answer": 1, "explain": "1. 원형교차로 भनेको गोलो आकारको चोक हो, यो पैदलयात्री बाटो पार गर्ने ठाउँ होइन। 2. 횡단보도 भनेको पैदलयात्रीहरूले सडक सुरक्षित रूपमा पार गर्नका लागि बनाइएको जेब्रा क्रसिङ हो, त्यसैले यो सही उत्तर हो। 3. 사거리 भनेको चारवटा बाटो मिल्ने चोक हो। 4. 삼거리 भनेको तीनवटा बाटो मिल्ने चोक हो। सही उत्तर 횡단보도 (जेब्रा क्रसिङ) हो।"}, {"n": "137", "q": "보행자가 차량 도로 위를 안전하게 건널 수 있도록 만든 다리입니다. 주로 도로가 복잡하거나 차량 통행이 많은 곳에 설치됩니다.", "options": ["육교", "지하", "마트", "길거리"], "answer": 0, "explain": "1. 육교 भनेको पैदलयात्रीहरूलाई सडक पार गर्न बनाइएको ओभरहेड ब्रिज (आकाशे पुल) हो, त्यसैले यो सही उत्तर हो। 2. 지하 भनेको भूमिगत भाग वा जमिनमुनि हो। 3. 마트 भनेको मार्ट वा पसल हो। 4. 길거리 भनेको सडकको किनार वा बाटो हो। सही उत्तर 육교 (आकाशे पुल) हो।"}, {"n": "138", "q": "건물의 가장 윗부분에 있는 평평한 지붕 공간입니다. 휴식, 건조, 정원 등 다양한 용도로 활용됩니다.", "options": ["옥상", "마루", "마트", "마당"], "answer": 0, "explain": "1. 옥상 भनेको भवनको सबैभन्दा माथिल्लो तलाको सम्याइएको कौसी वा छत हो, त्यसैले यो सही उत्तर हो। 2. 마루 भनेको काठको पिँढी वा घरभित्रको भुइँ हो। 3. 마트 भनेको मार्ट वा पसल हो। 4. 마당 भनेको घरको आँगन हो। सही उत्तर 옥상 (कौसी/छत) हो।"}, {"n": "139", "q": "네 갈래로 길이 만나는 도로의 교차 지점을 말합니다. 차량과 보행자의 이동이 많아 신호등이나 표지판이 설치되어 있는 경우가 많습니다.", "options": ["사거리", "삼거리", "우회전", "좌회전"], "answer": 0, "explain": "1. 사거리 भनेको चारवटा दिशा वा बाटो मिल्ने चौबाटो हो, त्यसैले यो सही उत्तर हो। 2. 삼거리 भनेको तीनवटा बाटो मिल्ने तीनबाटो हो। 3. 우회전 भनेको दायाँतर्फ मोड्नु हो। 4. 좌회전 भनेको बायाँतर्फ मोड्नु हो। सही उत्तर 사거리 (चौबाटो) हो।"}, {"n": "140", "q": "날씨나 상황에 맞게 입은 옷의 형태나 스타일을 말합니다. 계절, 장소, 목적에 따라 달라집니다.", "options": ["유행", "화장", "쇼핑", "옷차림"], "answer": 3, "explain": "1. 유행 भनेको फेसन वा चलन हो। 2. 화장 भनेको मेकअप वा श्रृंगार हो। 3. 쇼핑 भनेको किनमेल हो। 4. 옷차림 भनेको पहिरन वा लुगा लगाउने शैली हो, त्यसैले यो सही उत्तर हो।
