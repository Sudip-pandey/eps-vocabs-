 सही उत्तर 옷차림 (पहिरन शैली) हो।"}, {"n": "141", "q": "옷차림을 꾸미기 위해 착용하는 장식품을 말하며 귀걸이, 목걸이, 팔찌, 모자, 시계 등이 이에 해당합니다.", "options": ["보석류", "스타일", "액세서리", "옷차림"], "answer": 2, "explain": "1. 보석류 भनेको गरगहना वा बहुमूल्य धातुका वस्तुहरू हुन्। 2. 스타일 भनेको शैली हो। 3. 액세서리 भनेको पहिरनमा थपिने एक्सेसरीज वा गरगहनाहरू हुन्, त्यसैले यो सही उत्तर हो। 4. 옷차림 भनेको पहिरन शैली हो। सही उत्तर 액세서리 (एक्सेसरीज/गरगहना) हो।"}, {"n": "142", "q": "시력을 교정하거나 눈을 보호하기 위해 눈에 쓰는 도구입니다. 시력 교정용 외에도 선글라스나 패션용으로도 사용됩니다.", "options": ["모자", "안약", "안경", "시계"], "answer": 2, "explain": "1. 모자 भनेको टोपी हो। 2. 안약 भनेको आँखामा हाल्ने थोपा औषधि हो। 3. 안경 भनेको आँखामा लगाउने चस्मा हो, त्यसैले यो सही उत्तर हो। 4. 시계 भनेको घडी हो। सही उत्तर 안경 (चस्मा) हो।"}, {"n": "143", "q": "비나 눈이 오는 날에 신는 방수 기능이 있는 신발입니다. 주로 고무로 만들어지며 발과 다리를 젖지 않게 보호합니다.", "options": ["장화", "양말", "슬리퍼", "운동화"], "answer": 0, "explain": "1. 장화 भनेको पानी नछिर्ने रबरको जुत्ता वा गमबुट हो, त्यसैले यो सही उत्तर हो। 2. 양말 भनेको मोजा हो। 3. 슬리퍼 भनेको स्लिपर वा चप्पल हो। 4. 운동화 भनेको खेलकुद जुत्ता वा स्नीकर हो। सही उत्तर 장화 (गमबुट) हो।"}, {"n": "144", "q": "한국인의 고유한 의복, 특히 조선 시대에 입던 형식의 옷. 현재에는 평상복으로 입는 경우는 별로 없고, 주로 명절 때 입습니다.", "options": ["한복", "정복", "상복", "양복"], "answer": 0, "explain": "1. 한복 भनेको कोरियाको पारम्परिक पोशाक हो, त्यसैले यो सही उत्तर हो। 2. 정복 भनेको औपचारिक पोशाक वा युनिफर्म हो। 3. 상복 भनेको शोकको बेला लगाउने कपडा हो। 4. 양복 भनेको पाश्चात्य शैलीको सुट हो। सही उत्तर 한복 (कोरियाली पारम्परिक पोशाक) हो।"}, {"n": "145", "q": "한복의 윗옷으로, 전통적으로 남녀 모두 착용합니다. 짧은 길이에 앞을 여며 입는 형태이며, 깃과 고름이 특징입니다.", "options": ["치마", "바지", "원피스", "저고리"], "answer": 3, "explain": "치마 भनेको स्कर्ट वा जामा हो, यो हानबोकको तल्लो भागमा महिलाले लगाउने लुगा हो। 바지 भनेको प्यान्ट वा सुरुवाल हो, यो तल्लो भागमा लगाइने लुगा हो। 원피스 भनेको सिङ्गो फ्रक हो, यो कोरियाली परम्परागत माथिल्लो लुगा होइन। 저고리 भनेको हानबोकको माथिल्लो भागमा लगाइने चोली हो, यो छोटो लम्बाइको पुरुष र महिला दुवैले लगाउने लुगा भएकाले विवरणसँग मिल्छ। त्यसैले सही उत्तर ४ नम्बरको 저고리 हो, जसको अर्थ हानबोकको माथिल्लो चोली हुन्छ।"}, {"n": "146", "q": "사람이 살아가는 데 필요한 공간에서 거주하며 생활하는 것을 말합니다. 집, 아파트, 주택 등 다양한 형태가 있으며, 생활의 기본 조건 중 하나입니다.", "options": ["사무소", "대학교", "주소", "주거"], "answer": 3, "explain": "1. 사무소 भनेको कार्यालय हो। 2. 대학교 भनेको विश्वविद्यालय हो। 3. 주소 भनेको ठेगाना हो। 4. 주거 भनेको बसोबास गर्नु वा घरजम गरी बस्नु हो, त्यसैले यो सही उत्तर हो। सही उत्तर 주거 (बसोबास) हो।"}, {"n": "147", "q": "인간과 생물이 살아가는 자연적, 사회적 조건과 주변 상황을 말합니다. 공기, 물, 토양 같은 자연 요소뿐 아니라 생활공간, 사회적 분위기도 포함됩니다.", "options": ["생활", "환경", "토지", "지구"], "answer": 1, "explain": "1. 생활 भनेको दैनिक जीवन हो। 2. 환경 भनेको वातावरण हो, त्यसैले यो सही उत्तर हो। 3. 토지 भनेको जमिन वा जग्गा हो। 4. 지구 भनेको पृथ्वी हो। सही उत्तर 환경 (वातावरण) हो।"}, {"n": "148", "q": "한 건물 안에 여러 가구가 독립적으로 살 수 있도록 지은 빌딩형 공동 주택입니다.", "options": ["고시원", "기숙사", "원룸", "아파트"], "answer": 3, "explain": "1. 고시원 भनेको अति सानो कोठा भएको विद्यार्थी होस्टेल वा कोशिबन हो। 2. 기숙사 भनेको होस्टेल हो। 3. 원룸 भनेको एकै कोठामा भान्सासहितको अपार्टमेन्ट वा कोठा हो। 4. 아파트 भनेको एउटै भवनमा धेरै परिवारहरू स्वतन्त्र रूपमा बस्न मिल्ने अपार्टमेन्ट हो, त्यसैले यो सही उत्तर हो। सही उत्तर 아파트 (अपार्टमेन्ट) हो।"}, {"n": "149", "q": "여러 세대가 함께 거주할 수 있도록 지어진 소규모 공동주택입니다. 보통 4~5층 이하로 엘리베이터가 없는 경우가 많고, 아파트보다 비교적 저렴한 편입니다.", "options": ["주택", "기숙사", "원룸", "빌라"], "answer": 3, "explain": "1. 주택 भनेको छुट्टै घर वा आवास हो। 2. 기숙사 भनेको होस्टेल हो। 3. 원룸 भनेको एकै कोठा भएको डेरा हो। 4. 빌라 भनेको चार पाँच तलाभन्दा कम भएको सानो संयुक्त आवासीय भवन वा भिल्ला हो, त्यसैले यो सही उत्तर हो। सही उत्तर 빌라 (भिल्ला/संयुक्त आवासीय घर) हो।"}, {"n": "150", "q": "오피스와 호텔의 합성어로, 주거와 업무를 함께 할 수 있도록 지어진 건물입니다. 주로 원룸 형태이며, 1인 가구나 직장인들이 많이 이용합니다.", "options": ["아파트", "주택", "오피스텔", "고시원"], "answer": 2, "explain": "1. 아파트 भनेको अपार्टमेन्ट हो। 2. 주택 भनेको घर हो। 3. 오피스텔 भनेको अफिस र होटल मिलेर बनेको, बस्न र काम गर्न मिल्ने अफिसटेल भवन हो, त्यसैले यो सही उत्तर हो। 4. 고시원 भनेको कोशिबन हो। सही उत्तर 오피스텔 (अफिसटेल) हो।"}, {"n": "151", "q": "싸게 방을 얻어 생활할 수 있는 건물입니다. 화장실, 부엌 등을 공동으로 사용합니다.", "options": ["고시원", "기숙사", "원룸", "아파트"], "answer": 0, "explain": "१. 고시원 भनेको सस्तोमा कोठा लिएर बस्न सकिने र शौचालय तथा भान्सा साझा रूपमा प्रयोग गर्ने ठाउँ हो, त्यसैले यो सही उत्तर हो। २. 기숙사 भनेको विद्यार्थी वा कामदार बस्ने होस्टेल हो तर यो 고시원 जस्तो धेरै सस्तो र साझा कोठा केन्द्रित मात्र हुँदैन। ३. 원룸 भनेको एउटै कोठामा सबै कुरा भएको सिंगल रुम हो तर यसमा सबै सुविधा व्यक्तिगत हुन्छ। ४. 아파트 भनेको अपार्टमेन्ट हो जुन ठूलो आवासीय भवन हो। सही उत्तर 고시원 हो जसको अर्थ कोसि्वोन (सस्तो विद्यार्थी कोठा) हो।"}, {"n": "152", "q": "학교나 직장 등에서 학생이나 직원들이 거주할 수 있도록 제공하는 숙소입니다. 보통 공동생활을 하며, 규칙적인 관리와 생활이 이루어집니다.", "options": ["기숙사", "주택", "원룸", "고시원"], "answer": 0, "explain": "१. 기숙사 भनेको विद्यालय वा कम्पनी आदिमा विद्यार्थी वा कर्मचारीहरू बस्नका लागि प्रदान गरिएको आवास हो र यहाँ सामूहिक जीवन बिताइन्छ, त्यसैले यो सही उत्तर हो। २. 주택 भनेको सामान्य घर हो। ३. 원룸 भनेको एउटै कोठा भएको आवास हो। ४. 고시원 भनेको सस्तो अध्ययन गर्ने कोठा हो। सही उत्तर 기숙사 हो जसको अर्थ होस्टेल वा आवासगृह हो।"}, {"n": "153", "q": "하나의 큰 방에 침대, 주방, 욕실 등이 모두 갖추어진 소형 주거 공간입니다. 주로 1인 가구가 거주하며, 공간 효율성이 높아 작은 규모의 주택으로 인기가 많습니다.", "options": ["주택", "원룸", "아파트", "고시원"], "answer": 1, "explain": "१. 주택 भनेको सामान्य घर हो। २. 원룸 भनेको एउटै ठूलो कोठामा बेड, किचिन, बाथरुम आदि सबै कुरा भएको सानो आवास हो जहाँ मुख्यतया १ जना बस्छन्, त्यसैले यो सही उत्तर हो। ३. 아파트 भनेको अपार्टमेन्ट हो। ४. 고시원 भनेको सस्तो अध्ययन कोठा हो। सही उत्तर 원룸 हो जसको अर्थ वान रुम (एउटै कोठा भएको फ्ल्याट) हो।"}, {"n": "154", "q": "집이나 방을 빌릴 때 매달 일정한 금액을 지불하는 임대 방식입니다. 보통 보증금을 먼저 내고, 매달 정해진 금액을 집주인에게 냅니다.", "options": ["비용", "월세", "대출", "결제"], "answer": 1, "explain": "१. 비용 भनेको लागत वा खर्च हो। २. 월세 भनेको घर वा कोठा भाडामा लिँदा प्रत्येक महिना निश्चित रकम तिर्ने भाडा प्रणाली हो, त्यसैले यो सही उत्तर हो। ३. 대출 भनेको ऋण हो। ४. 결제 भनेको भुक्तानी गर्नु हो। सही उत्तर 월세 हो जसको अर्थ मासिक घरभाडा हो।"}, {"n": "155", "q": "집을 빌릴 때 큰 금액의 보증금을 한 번에 내고, 매달 월세를 내지 않고 거주하는 임대 방식입니다. 계약 기간이 끝나면 보증금을 전액 돌려받는 것이 특징입니다.", "options": ["비용", "집값", "용돈", "전세"], "answer": 3, "explain": "비용 भनेको खर्च हो, यो घर भाडामा लिने विशेष प्रणाली होइन। 집값 भनेको घरको मूल्य हो, यो घर किन्दा लाग्ने रकम भएकाले भाडा प्रणाली होइन। 용돈 भनेको खल्ती खर्च हो, यो घर भाडामा लिने तरिकासँग सम्बन्धित छैन। 전세 भनेको एकमुस्ट धरौटी भाडा प्रणाली हो, सम्झौता सकिएपछि धरौटी रकम फिर्ता पाइने भएकाले विवरणसँग मिल्छ। त्यसैले सही उत्तर ४ नम्बरको 전세 हो, जसको अर्थ एकमुस्ट धरौटी भाडा प्रणाली हुन्छ।"}, {"n": "156", "q": "집이나 방을 빌릴 때 임차인이 집주인에게 미리 맡기는 돈입니다. 계약이 끝난 후 문제가 없으면 전액 돌려받을 수 있습니다.", "options": ["수도비", "관리비", "환불금", "보증금"], "answer": 3, "explain": "수도비 भनेको खानेपानीको महसुल हो, यो अगाडि बुझाइने धरौटी रकम होइन। 관리비 भनेको व्यवस्थापन शुल्क हो, यो भवन रेखदेखका लागि तिरिने मासिक खर्च हो। 환불금 भनेको फिर्ता रकम हो, यो सामान फिर्ता गर्दा पाइने पैसा हो। 보증금 भनेको धरौटी रकम हो, यो घर वा कोठा भाडामा लिँदा घरधनीलाई अगाडि नै बुझाइने र पछि फिर्ता पाइने पैसा भएकाले विवरणसँग मिल्छ। त्यसैले सही उत्तर ४ नम्बरको 보증금 हो, जसको अर्थ धरौटी रकम हुन्छ।"}, {"n": "157", "q": "높은 곳에서 멀리 바라보는 아름다운 풍경을 말합니다. 산이나 건물 위에서 보는 경치가 이에 해당합니다.", "options": ["산맥", "고궁", "야경", "전망"], "answer": 3, "explain": "१. 산맥 भनेको पर्वतमाला हो। २. 고궁 भनेको पुरानो राजदरबार हो। ३. 야경 भनेको उच्च स्थानबाट टाढा हेर्दा देखिने सुन्दर रातको दृष्य (नाइट भ्यु) हो, त्यसैले यो सही उत्तर हो। ४. 전망 भनेको टाढाको दृश्य वा अवलोकन हो तर यो विशेष गरी रातको दृश्यसँग जोडिएको छैन। सही उत्तर 야경 हो जसको अर्थ रातको दृश्य हो।"}, {"n": "158", "q": "관광을 목적으로 사람들이 방문하는 장소입니다. 이러한 장소는 문화적, 자연적, 역사적 특색을 가진 지역으로, 여행자들에게 다양한 경험을 제공합니다.", "options": ["교육원", "전쟁지", "여행지", "놀이공원"], "answer": 2, "explain": "१. 교육원 भनेको शैक्षिक संस्था हो। २. 전쟁지 भनेको युद्ध क्षेत्र हो। ३. 여행지 भनेको मानिसहरू भ्रमणको उद्देश्यले भ्रमण गर्ने ठाउँ हो, त्यसैले यो सही उत्तर हो। ४. 놀이공원 भनेको मनोरञ्जन पार्क हो। सही उत्तर 여행지 हो जसको अर्थ भ्रमण गर्ने ठाउँ (गन्तव्य) हो।"}, {"n": "159", "q": "전기 장비를 전기 공급 장치에 연결하는 2개 또는 3개의 금속 핀이 있는 작은 플라스틱 물체입니다.", "options": ["스위치", "콘센트", "플러그", "손전등"], "answer": 2, "explain": "१. 스위치 भनेको बत्ती बाल्ने वा निभाउने स्विच हो। २. 콘센트 भनेको भित्तामा हुने सकेट हो। ३. 플러그 भनेको विद्युतीय उपकरणलाई करेन्टको स्रोतमा जोड्नको लागि २ वा ३ वटा धातुको पिन भएको सानो प्लाष्टिकको वस्तु हो, त्यसैले यो सही उत्तर हो। ४. 손전등 भनेको टर्चलाइट हो। सही उत्तर 플러그 हो जसको अर्थ बिजुलीको प्लग हो।"}, {"n": "160", "q": "한 사회의 역사적, 예술적, 과학적 가치가 있는 유물, 건축물, 전통 등을 포함한 물질적 및 비물질적 자산입니다.", "options": ["천연 자원", "산림 생물", "문화유산", "사유재산"], "answer": 2, "explain": "१. 천연 자원 भनेको प्राकृतिक स्रोत हो। २. 산림 생물 भनेको जङ्गली जीवजन्तु तथा वनस्पति हो। ३. 문화유산 भनेको कुनै समाजको ऐतिहासिक, कलात्मक र वैज्ञानिक मूल्य भएका पुरासम्पदा, वास्तुकला, परम्परा आदि समेटिएको सांस्कृतिक सम्पदा हो, त्यसैले यो सही उत्तर हो। ४. 사유재산 भनेको निजी सम्पत्ति हो। सही उत्तर 문화유산 हो जसको अर्थ सांस्कृतिक सम्पदा हो।"}, {"n": "161", "q": "여행 중이나 일정 기간 동안 머물기 위해 제공되는 거주지입니다. 호텔, 게스트하우스, 민박, 리조트 등 다양한 형태로 제공됩니다.", "options": ["숙소", "주택", "기숙사", "고시원"], "answer": 0, "explain": "१. 숙소 भनेको यात्राको समयमा वा निश्चित अवधिका लागि बस्न प्रदान गरिएको आवास हो, त्यसैले यो सही उत्तर हो। २. 주택 भनेको सामान्य घर हो। ३. 기숙사 भनेको होस्टेल हो। ४. 고시원 भनेको सस्तो अध्ययन कोठा हो। सही उत्तर 숙소 हो जसको अर्थ बस्ने ठाउँ वा आवास हो।"}, {"n": "162", "q": "공동 소유 형태로 운영되는 주거지로, 일반적으로 여러 명이 한 건물 내의 임대하여 사용하는 형태입니다. 시설과 서비스가 호텔과 비슷한 특징을 가집니다.", "options": ["콘도", "민박", "펜션", "모텔"], "answer": 0, "explain": "१. 콘도 भनेको कन्डोमिनियम हो जो साझा स्वामित्वको रूपमा सञ्चालन हुने र होटल जस्तै सेवा तथा सुविधा भएको आवास हो, त्यसैले यो सही उत्तर हो। २. 민박 भनेको होमस्टे हो। ३. 펜션 भनेको पेन्सन (रिसोर्ट शैलीको घर) हो। ४. 모텔 भनेको मोटेल हो। सही उत्तर 콘도 हो जसको अर्थ कन्डोमिनियम हो।"}, {"n": "163", "q": "주민이 자신의 집이나 별도로 마련된 공간을 여행객에게 제공하여 숙박을 하는 형태입니다. 보통 가정적인 분위기에서 저렴한 가격으로 숙박할 수 있으며, 주인과의 교류를 통해 현지 문화를 더 가까이 경험할 수 있습니다.", "options": ["호텔", "민박", "콘도", "펜션"], "answer": 1, "explain": "१. 호텔 भनेको होटल हो। २. 민박 भनेको स्थानीय बासिन्दाले आफ्नो घर वा छुट्टै ठाउँ पर्यटकलाई दिएर बस्ने व्यवस्था मिलाउने होमस्टे हो, त्यसैले यो सही उत्तर हो। ३. 콘도 भनेको कन्डोमिनियम हो। ४. 펜션 भनेको पेन्सन हो। सही उत्तर 민박 हो जसको अर्थ होमस्टे (민박) हो।"}, {"n": "164", "q": "자연 속에서 휴식을 취할 수 있도록 마련된 작은 규모의 숙소로, 보통 가족이나 소규모 그룹을 대상으로 제공됩니다. 주로 독립된 건물이나 별채 형태로 되어 있어 프라이빗한 분위기에서 편안한 시간을 보낼 수 있습니다.", "options": ["기숙사", "고시원", "펜션", "민박"], "answer": 2, "explain": "기숙사 भनेको आवासगृह वा होस्टेल हो, यो कम्पनी वा विद्यालयले उपलब्ध गराउने ठाउँ हो। 고시원 भनेको गोसीवोन हो, यो विद्यार्थी बस्ने सानो कोठा हो। 펜션 भनेको रिसोर्ट कटेज हो, यो प्रकृतिमा परिवार वा सानो समूहले आराम गर्न सक्ने स्वतन्त्र भवन भएकाले विवरणसँग मिल्छ। 민박 भनेको होमस्टे हो, यो साधारण घरमा भाडामा बस्ने ठाउँ हो। त्यसैले सही उत्तर ३ नम्बरको 펜션 हो, जसको अर्थ रिसोर्ट कटेज हुन्छ।"}, {"n": "165", "q": "물이 고여 있는 자연적인 낮은 지형으로, 산이나 평지에 형성됩니다. 이곳은 물놀이를 하거나 경치를 즐길 수 있는 멋진 장소입니다.", "options": ["강", "산", "호수", "바다"], "answer": 2, "explain": "१. 강 भनेको नदी हो। २. 산 भनेको पहाड हो। ३. 호수 भनेको पानी जमेको प्राकृतिक रूपमा रहेको सानो भू-भाग हो जुन पहाड वा समथर भूमिमा बन्छ र यहाँ पानीमा खेल्न वा दृश्यको आनन्द लिन सकिन्छ, त्यसैले यो सही उत्तर हो। ४. 바다 भनेको समुद्र हो। सही उत्तर 호수 हो जसको अर्थ ताल (ल्याक) हो।"}, {"n": "166", "q": "넓고 깊은 물이 있는 큰 곳입니다. 여러 나라를 나누는 경계가 되며, 물고기나 배를 이용한 여행에 중요한 역할을 합니다.", "options": ["온천", "호수", "야경", "바다"], "answer": 3, "explain": "온천 भनेको तातो पानी निस्कने ठाउँ हो, त्यसैले यो मिल्दैन। 호수 भनेको ताल हो, त्यसैले यो मिल्दैन। 야경 भनेको रात्रिको दृश्य हो, त्यसैले यो मिल्दैन। 바다 भनेको समुद्र हो जसले धेरै पानी ओगटेको छ र देशहरूलाई छुट्याउँछ, त्यसैले यो सही उत्तर हो। सही उत्तर विकल्प 4 हो जसको अर्थ समुद्र हुन्छ।"}, {"n": "167", "q": "바다나 호수에 둘러싸인 땅입니다. 크거나 작은 땅덩어리로, 사람이나 동식물이 살 수 있는 곳이기도 합니다.", "options": ["산", "강", "섬", "폭포"], "answer": 2, "explain": "산 भनेको पहाड हो, त्यसैले यो मिल्दैन। 강 भनेको नदी हो, त्यसैले यो मिल्दैन। 섬 भनेको चारैतिर पानीले घेरिएको टापु हो जहाँ मानिस र बोटबिरुवा बस्छन्, त्यसैले यो सही उत्तर हो। 폭포 भनेको झरना हो, त्यसैले यो मिल्दैन। सही उत्तर विकल्प 3 हो जसको अर्थ टापु हुन्छ।"}, {"n": "168", "q": "자연에서 나오는 따뜻한 물입니다. 주로 지구의 깊은 곳에서 데워져 땅속에서 나오는 물로, 사람들은 몸을 담그며 피로를 풀거나 건강을 챙기기 위해 이용합니다.", "options": ["온천", "폭포", "동굴", "호수"], "answer": 0, "explain": "온천 भनेको प्राकृतिक तातो पानी आउने ठाउँ हो जहाँ मानिसहरू थकाइ मार्न जान्छन्, त्यसैले यो सही उत्तर हो। 폭포 भनेको झरना हो, त्यसैले यो मिल्दैन। 동굴 भनेको गुफा हो, त्यसैले यो मिल्दैन। 호수 भनेको ताल हो, त्यसैले यो मिल्दैन। सही उत्तर विकल्प 1 हो जसको अर्थ तातो पानीको मुहान (ओन्चेन) हुन्छ।"}, {"n": "169", "q": "옛날 사람들의 생활이나 문화가 남아 있는 장소입니다. 오래된 건물이나 유물들이 있어, 역사적인 가치를 지니며 사람들이 그곳을 방문하여 배우고 경험할 수 있습니다.", "options": ["유적지", "민속촌", "교육원", "천연 자원"], "answer": 0, "explain": "유적지 भनेको ऐतिहासिक अवशेषहरू पाइने ठाउँ हो, त्यसैले यो सही उत्तर हो। 민속촌 भनेको लोकगाउँ हो, त्यसैले यो मिल्दैन। 교육원 भनेको शिक्षा केन्द्र हो, त्यसैले यो मिल्दैन। 천연 자원 भनेको प्राकृतिक स्रोत हो, त्यसैले यो मिल्दैन। सही उत्तर विकल्प 1 हो जसको अर्थ ऐतिहासिक स्थल हुन्छ।"}, {"n": "170", "q": "전통적인 생활 방식과 문화를 보여주는 마을입니다. 옛날 사람들의 집, 옷, 도구 등을 실제로 볼 수 있으며, 전통 놀이와 행사도 체험할 수 있는 곳입니다.", "options": ["문화유산", "여행지", "유적지", "민속촌"], "answer": 3, "explain": "문화유산 भनेको सांस्कृतिक सम्पदा हो, त्यसैले यो मिल्दैन। 여행지 भनेको भ्रमण गर्ने ठाउँ हो, त्यसैले यो मिल्दैन। 유적지 भनेको ऐतिहासिक स्थल हो, त्यसैले यो मिल्दैन। 민속촌 भनेको परम्परागत जीवनशैली र संस्कृति झल्काउने लोकगाउँ हो, त्यसैले यो सही उत्तर हो। सही उत्तर विकल्प 4 हो जसको अर्थ लोकगाउँ (मिनसोकछोन) हुन्छ।"}, {"n": "171", "q": "과거에 일어난 일들과 그 과정을 말합니다. 사람들의 사건, 변화, 발전을 기록하여 현재와 미래에 배울 수 있습니다.", "options": ["사회", "경제", "소설", "역사"], "answer": 3, "explain": "사회 भनेको समाज हो, त्यसैले यो मिल्दैन। 경제 भनेको अर्थतन्त्र हो, त्यसैले यो मिल्दैन। 소설 भनेको उपन्यास हो, त्यसैले यो मिल्दैन। 역사 भनेको इतिहास हो जुन विगतका घटना र विकाससँग सम्बन्धित हुन्छ, त्यसैले यो सही उत्तर हो। सही उत्तर विकल्प 4 हो जसको अर्थ इतिहास हुन्छ।"}, {"n": "172", "q": "산을 올라가며 자연을 즐기는 활동입니다. 사람들은 보통 산을 오르거나 하산하면서 운동을 하고, 산의 경치를 즐깁니다.", "options": ["여행", "등산", "방문", "만남"], "answer": 1, "explain": "'여행' भनेको भ्रमण हो, यो नयाँ ठाउँको यात्रा गर्ने काम हो त्यसैले विवरणसँग मिल्दैन। '등산' भनेको पहाड चढ्नु हो, यो डाँडा चढेर प्रकृतिको आनन्द लिने काम हो त्यसैले यो विवरणसँग मिल्छ। '방문' भनेको भेट्न जानु हो, यो कुनै ठाउँ वा मानिसलाई भेट्ने काम हो त्यसैले यो मिल्दैन। '만남' भनेको भेटघाट हो, यो मानिसहरू आपसमा भेट्ने कुरा हो त्यसैले यो मिल्दैन। त्यसैले सही उत्तर नम्बर २ को '등산' (पहाड चढ्नु) हो।"}, {"n": "173", "q": "왕이나 왕족이 살았던 큰 집입니다. 보통 많은 방과 정원이 있으며, 왕국의 중요한 행사나 정치적 결정이 이루어졌던 장소입니다.", "options": ["비원", "정원", "궁궐", "시청"], "answer": 2, "explain": "비원 भनेको गुप्तेश्वर वा गोप्य बगैंचा हो, त्यसैले यो मिल्दैन। 정원 भनेको बगैंचा हो, त्यसैले यो मिल्दैन। 궁궐 भनेको राजा वा राजपरिवार बस्ने राजदरबार हो, त्यसैले यो सही उत्तर हो। 시청 भनेको महानगरपालिका वा नगर कार्यालय हो, त्यसैले यो मिल्दैन। सही उत्तर विकल्प 3 हो जसको अर्थ राजदरबार (कुङ्ग्वोल) हुन्छ।"}, {"n": "174", "q": "사람이 지은 건물이나 구조물입니다. 집, 학교, 다리처럼 다양한 목적을 위해 만들어지며, 크기나 모양도 다양합니다.", "options": ["사무소", "민속촌", "건축물", "문화유산"], "answer": 2, "explain": "사무소 भनेको कार्यालय हो, त्यसैले यो मिल्दैन। 민속촌 भनेको लोकगाउँ हो, त्यसैले यो मिल्दैन। 건축물 भनेको वास्तुकला वा भवन/संरचना हो, त्यसैले यो सही उत्तर हो। 문화유산 भनेको सांस्कृतिक सम्पदा हो, त्यसैले यो मिल्दैन। सही उत्तर विकल्प 3 हो जसको अर्थ भवन वा संरचना हुन्छ।"}, {"n": "175", "q": "경주에 있는 유명한 절입니다. 신라 시대에 지어졌으며, 아름다운 건축과 오랜 역사를 가진 한국의 대표적인 문화유산입니다.", "options": ["불국사", "경복궁", "창덕궁", "석굴암"], "answer": 0, "explain": "불국사 भनेको ग्येोङ्जुमा रहेको प्रसिद्ध बौद्ध मन्दिर हो, त्यसैले यो सही उत्तर हो। 경복궁 भनेको सोलमा रहेको दरबार हो, त्यसैले यो मिल्दैन। 창덕궁 भनेको अर्को दरबार हो, त्यसैले यो मिल्दैन। 석굴암 भनेको गुफा मन्दिर हो, त्यसैले यो मिल्दैन। सही उत्तर विकल्प 1 हो जसको अर्थ पुलगुक्सा मन्दिर हुन्छ।"}, {"n": "176", "q": "경주의 산속에 있는 돌로 만든 절입니다. 신라 시대에 만들어졌으며, 안에는 아름다운 불상이 있어 세계적인 문화유산으로 유명합니다.", "options": ["불국사", "경복궁", "창덕궁", "석굴암"], "answer": 3, "explain": "'불국사' भनेको सिल्ला कालको प्रसिद्ध गुम्बा हो, तर यो ढुङ्गाको गुफा गुम्बा होइन त्यसैले मिल्दैन। '경복궁' भनेको जोसोन कालको राजदरबार हो, त्यसैले यो मिल्दैन। '창덕궁' भनेको जोसोन कालको अर्को राजदरबार हो, त्यसैले यो मिल्दैन। '석굴암' भनेको क्योङजुको पहाडमा रहेको ढुङ्गाको गुम्बा हो, जहाँ सुन्दर बुद्धको मूर्ति छ त्यसैले यो विवरणसँग मिल्छ। त्यसैले सही उत्तर नम्बर ४ को '석굴암' (सोकगुराम) हो।"}, {"n": "177", "q": "서울에 있는 조선 시대의 가장 큰 궁궐입니다. 왕이 살고 나라를 다스리던 곳으로, 지금은 많은 사람들이 방문하는 역사적인 장소입니다.", "options": ["도산서원", "경복궁", "창덕궁", "석굴암"], "answer": 1, "explain": "'도산서원' भनेको ऐतिहासिक अध्ययन केन्द्र हो, त्यसैले यो राजदरबार होइन। '경복궁' भनेको सोलमा रहेको जोसोन कालको सबैभन्दा ठूलो राजदरबार हो, त्यसैले यो विवरणसँग मिल्छ। '창덕궁' भनेको जोसोन कालको दरबार हो तर यो मुख्य ठूलो दरबार होइन, त्यसैले मिल्दैन। '석굴암' भनेको क्योङजुमा रहेको ढुङ्गाको गुम्बा हो, त्यसैले यो मिल्दैन। त्यसैले सही उत्तर नम्बर २ को '경복궁' (ग्योङबोकगुङ) हो।"}, {"n": "178", "q": "옛날부터 사람들 사이에 전해 내려오는 이야기입니다. 실제 일어난 일일 수도 있고, 상상에서 만들어졌을 수도 있으며, 보통 특별한 사람이나 장소, 신기한 일이 등장합니다.", "options": ["속담", "전설", "전쟁", "문화"], "answer": 1, "explain": "속담 भनेको उखान हो, त्यसैले यो मिल्दैन। 전설 भनेको जनश्रुति वा दन्त्यकथा/किंवदंती हो, त्यसैले यो सही उत्तर हो। 전쟁 भनेको युद्ध हो, त्यसैले यो मिल्दैन। 문화 भनेको संस्कृति हो, त्यसैले यो मिल्दैन। सही उत्तर विकल्प 2 हो जसको अर्थ दन्त्यकथा वा किंवदंती हुन्छ।"}, {"n": "179", "q": "경주의 불국사 안에 있는 아름다운 돌탑입니다. 신라 시대에 만들어졌으며, 섬세하고 조화로운 모습으로 한국의 대표적인 문화유산 중 하나입니다.", "options": ["창덕궁", "경복궁", "다보탑", "석굴암"], "answer": 2, "explain": "창덕궁 भनेको दरबार हो, त्यसैले यो मिल्दैन। 경복궁 भनेको दरबार हो, त्यसैले यो मिल्दैन। 다보탑 भनेको ग्येोङ्जुको पुलगुक्साभित्र रहेको प्रसिद्ध ढुङ्गाको प्यागोडा (ताप्) हो, त्यसैले यो सही उत्तर हो। 석굴암 भनेको गुफा मन्दिर हो, त्यसैले यो मिल्दैन। सही उत्तर विकल्प 3 हो जसको अर्थ ताबोतप (ढुङ्गाको स्तूप) हुन्छ।"}, {"n": "180", "q": "부처님의 모습을 돌이나 나무로 만든 상입니다. 절에 가면 볼 수 있으며, 사람들은 불상 앞에서 기도하거나 마음의 평화를 빕니다.", "options": ["사원", "동상", "불상", "불경"], "answer": 2, "explain": "사원 भनेको मन्दिर हो, त्यसैले यो मिल्दैन। 동상은 सालिक वा मूर्ति हो, त्यसैले यो मिल्दैन। 불상 भनेको बुद्धको मूर्ति (बुल्साङ) हो, त्यसैले यो सही उत्तर हो। 불경 भनेको बौद्ध ग्रन्थ हो, त्यसैले यो मिल्दैन। सही उत्तर विकल्प 3 हो जसको अर्थ बुद्धको मूर्ति हुन्छ।"}, {"n": "181", "q": "어떤 일을 잘 해내기 위한 방법이나 능력으로 물건을 만들거나 기계를 다루는 것도 여기에 들어갑니다.", "options": ["기술", "기회", "후회", "성공"], "answer": 0, "explain": "१. 기술 को अर्थ सीप वा प्रविधि हो, यो सही उत्तर हो किनभने यसले कुनै काम राम्रोसँग गर्न सक्ने क्षमतालाई बुझाउँछ। २. 기회 को अर्थ मौका हो, यो वर्णन अनुसार मिल्दैन। ३. 후회 को अर्थ पछुतावा हो, यो काम गर्ने क्षमतासँग सम्बन्धित छैन। ४. 성공 को अर्थ सफलता हो, यो काम राम्रोसँग गर्ने तरिका वा क्षमता होइन। सही उत्तर विकल्प १ (기술) हो जसको अर्थ सीप वा प्रविधि हुन्छ।"}, {"n": "182", "q": "여행을 떠나 다른 곳을 방문한 사람이며 주로 관광명소나 유명한 장소를 보고 즐기기 위해 떠납니다.", "options": ["관광객", "관중", "응원자", "손님"], "answer": 0, "explain": "१. 관광객 को अर्थ पर्यटक हो, यो सही उत्तर हो किनभने यसले घुम्न आएको मानिसलाई बुझाउँछ। २. 관중 को अर्थ दर्शक हो, यो खेल वा कार्यक्रम हेर्ने मानिसहरूको समूह हो। ३. 응원자 को अर्थ समर्थक वा चिअरर हो, यो घुम्न जाने मानिस होइन। ४. 손님 को अर्थ पाहुना वा ग्राहक हो, यो पर्यटनसँग मात्र सम्बन्धित छैन। सही उत्तर विकल्प १ (관광객) हो जसको अर्थ पर्यटक हुन्छ।"}, {"n": "183", "q": "조선 시대의 유학자 이황을 기리기 위해 세운 서원입니다. 경상북도 안동에 위치하며, 이곳은 이황 선생의 학문과 가르침을 배우기 위한 장소로 알려져 있습니다.", "options": ["도산서원", "수원화성", "창덕궁", "경복궁"], "answer": 0, "explain": "'도산서원' भनेको विद्वान इह्वाङको सम्झनामा बनाइएको अध्ययन केन्द्र हो, त्यसैले यो विवरणसँग मिल्छ। '수원화성' भनेको सुवोनमा रहेको ऐतिहासिक किल्ला हो, त्यसैले यो मिल्दैन। '창덕궁' भनेको जोसोन कालको राजदरबार हो, त्यसैले यो मिल्दैन। '경복궁' भनेको जोसोन कालको मुख्य राजदरबार हो, त्यसैले यो मिल्दैन। त्यसैले सही उत्तर नम्बर १ को '도산서원' (दोसानसोवोन) हो।"}, {"n": "184", "q": "공자의 가르침을 바탕으로 효, 예, 인을 중요시하며, 인간 관계에서 도덕적 규범과 예절을 중시하는 전통입니다. 가족 중심의 가치와 교육을 강조하여 사회의 질서와 조화를 유지하려고 했습니다.", "options": ["유교 문화", "서양 문화", "전통 문화", "동양 문화"], "answer": 0, "explain": "'유교 문화' भनेको कन्फ्युसियसको शिक्षामा आधारित संस्कृति हो, जसले नैतिकता र शिष्टाचारलाई महत्त्व दिन्छ त्यसैले यो विवरणसँग मिल्छ। '서양 문화' भनेको पश्चिमी संस्कृति हो, त्यसैले यो मिल्दैन। '전통 문화' भनेको परम्परागत संस्कृति हो, तर यो कुनै एउटा विशेष दर्शन मात्र होइन त्यसैले मिल्दैन। '동양 문화' भनेको पूर्वीय संस्कृति हो, जुन धेरै व्यापक विषय हो त्यसैले मिल्दैन। त्यसैले सही उत्तर नम्बर १ को '유교 문화' (कन्फ्युसियस संस्कृति) हो।"}, {"n": "185", "q": "자유 시간에 즐기는 활동이나 관심사입니다. 사람들이 스트레스를 풀거나 즐거움을 느끼기 위해 하는 일로, 예를 들면 운동, 독서, 그림 그리기 등이 있습니다.", "options": ["꿈", "취미", "지침", "근무"], "answer": 1, "explain": "१. 꿈 को अर्थ सपना हो, यो खाली समयमा गर्ने क्रियाकलाप होइन। २. 취미 को अर्थ शोख वा रुचि हो, यो सही उत्तर हो किनभने यसले खाली समयमा आनन्दको लागि गर्ने कामलाई बुझाउँछ। ३. 지침 को अर्थ निर्देशिका वा मार्गदर्शन हो, यो रुचि होइन। ४. 근무 को अर्थ काम वा ड्युटी हो, यो फुर्सदको समयको गतिविधि होइन। सही उत्तर विकल्प २ (취미) हो जसको अर्थ शोख हुन्छ।"}, {"n": "186", "q": "매운 양념에 떡과 어묵 등을 넣어 볶아 만든 한국 음식입니다. 길거리 음식으로 인기가 많고, 맵고 달콤한 맛이 특징입니다.", "options": ["비빔밥", "떡볶이", "떡국", "미역국"], "answer": 1, "explain": "1. 비빔밥 भनेको भातमा विभिन्न तरकारी मिसाएर खाइने कोरियाली खाना हो, त्यसैले यो भुटेको परिकार होइन। 2. 떡볶이 भनेको पिरो मसलामा पीठोको परिकार र माछाको केक भुटेर बनाइने खाना हो, त्यसैले यो विवरणसँग एकदम मिल्छ। 3. 떡국 भनेको पीठोको चक्का हालिएको झोल खाना हो, त्यसैले यो भुटेर बनाइने खाना होइन। 4. 미역국 भनेको समुद्री लेउको झोल हो, त्यसैले यो पिरो भुटेको खाना होइन। त्यसैले सही उत्तर २ नम्बर 떡볶이 हो।"}, {"n": "187", "q": "요리를 하다가 음식의 맛을 더 맛있게 하기 위해 넣는 재료로 소금, 간장, 고추장, 설탕 등을 말합니다.", "options": ["식초", "양념", "고추장", "마늘"], "answer": 1, "explain": "१. 식초 को अर्थ भिनेगर (सिरका) हो, यो एउटा मात्र मसला हो। २. 양념 को अर्थ मसला वा झोल हो, यो सही उत्तर हो किनभने यसले खाना मिठो बनाउन हालिने सबै सामग्रीहरूलाई जनाउँछ। ३. 고추장 को अर्थ गोछुजाङ (रातो खुर्सानीको पेस्ट) हो, यो एउटा विशेष मसला मात्र हो। ४. 마늘 को अर्थ लसुन हो, यो पनि एउटा मात्र खाद्य सामग्री हो। सही उत्तर विकल्प २ (양념) हो जसको अर्थ मसलाहरू हुन्छ।"}, {"n": "188", "q": "닭 한 마리에 찹쌀, 마늘, 인삼 등을 넣고 끓인 한국의 보양 음식입니다. 주로 몸을 건강하게 하기 위해 여름철에 많이 먹습니다.", "options": ["감자탕", "닭갈비", "닭도리탕", "삼계탕"], "answer": 3, "explain": "1. 감자탕 भनेको सुँगुरको हाड र आलुको झोल खाना हो, त्यसैले यो सिङ्गो कुखुरा हालेर बनाइने खाना होइन। 2. 닭갈비 भनेको कुखुराको मासु भुटेर बनाइने खाना हो, त्यसैले यो झोल खाना होइन। 3. 닭도리탕 भनेको कुखुराको पिरो झोल खाना हो, तर यसमा इन्साम हालेर गर्मीमा खाइदैन। 4. 삼계탕 भनेको सिङ्गो कुखुरामा चामल, लसुन र इन्साम हालेर उम्ल्याइने पौष्टिक खाना हो, त्यसैले यो विवरणसँग एकदम मिल्छ। त्यसैले सही उत्तर ४ नम्बर 삼계탕 हो।"}, {"n": "189", "q": "냉동 우유 또는 크림과 설탕으로 만든 매우 차갑고 달콤한 음식 주로 여름철 때 즐겨 먹습니다.", "options": ["초콜릿", "떡볶이", "아이스크림", "송편"], "answer": 2, "explain": "१. 초콜릿 को अर्थ चकलेट हो, यो दूध र बरफबाट बनेको होइन। २. 떡볶이 को अर्थ तोक्बोक्की हो, यो पिरो खाना हो। ३. 아이스크림 को अर्थ आइसक्रिम हो, यो सही उत्तर हो किनभने यो चिसो दूध वा क्रिम र चिनीबाट बनाइन्छ। ४. 송편 को अर्थ सोङ्प्येोन हो, यो चोसेक पर्वमा खाने पिठोको परिकार हो। सही उत्तर विकल्प ३ (아이스크림) हो जसको अर्थ आइसक्रिम हुन्छ।"}, {"n": "190", "q": "고기, 채소 등 다양한 재료를 밀가루 반죽에 싸서 찌거나 굽거나 튀긴 한국의 전통 음식입니다. 간 식이나 반찬, 국물 요리에 다양하게 활용됩니다.", "options": ["라면", "김치", "만두", "잡채"], "answer": 2, "explain": "१. 라면 को अर्थ राम्युन (चाउचाउ) हो, यो पिठोको खोलमा बेरेको डम्प्लिङ होइन। २. 김치 को अर्थ किम्छि हो, यो बन्दाकोबीको अचार हो। ३. 만두 को अर्थ मानदु हो, यो सही उत्तर हो किनभने यो पिठोको बाक्लो खोलमा मासु र तरकारी राखेर बनाइने परिकार हो। ४. 잡채 को अर्थ चाप्चे हो, यो सेलरोटी वा चाउमिन जस्तो तरकारी र चाउचाउ मिसाएको परिकार हो। सही उत्तर विकल्प ३ (만두) हो जसको अर्थ मानदु हुन्छ।"}, {"n": "191", "q": "전 세계의 컴퓨터와 네트워크를 서로 연결해 정보를 주고받을 수 있게 하는 통신망입니다.", "options": ["인터넷", "스마트폰", "웹사이트", "홈페이지"], "answer": 0, "explain": "१. 인터넷 को अर्थ इन्टरनेट हो, यो सही उत्तर हो किनभने यसले संसारभरका कम्प्युटरहरूलाई जोड्ने काम गर्छ। २. 스마트폰 को अर्थ स्मार्टफोन हो, यो एउटा उपकरण मात्र हो। ३. 웹사이트 को अर्थ वेबसाइट हो, यो इन्टरनेटभित्रको एउटा पाटो हो। ४. 홈페이지 को अर्थ होमपेज हो, यो पनि एउटा वेब पेज हो। सही उत्तर विकल्प १ (인터넷) हो जसको अर्थ इन्टरनेट हुन्छ।"}, {"n": "192", "q": "컴퓨터나 스마트폰을 이용하여 통신 회선으로 주고받는 서류나 글입니다.", "options": ["이메일", "웹사이트", "인터넷", "블로그"], "answer": 0, "explain": "१. 이메일 को अर्थ इमेल हो, यो सही उत्तर हो किनभने यसले कम्प्युटर वा फोनबाट पत्र वा लेखहरू आदानप्रदान गर्न सघाउँछ। २. 웹사이트 को अर्थ वेबसाइट हो, यो हेर्ने ठाउँ हो। ३. 인터넷 को अर्थ इन्टरनेट हो, यो सञ्जाल हो। ४. 블로그 को अर्थ ब्लग हो, यो व्यक्तिगत लेख्ने ठाउँ हो। सही उत्तर विकल्प १ (이메일) हो जसको अर्थ इमेल हुन्छ।"}, {"n": "193", "q": "사람들과 정보를 주고받으며 소통할 수 있는 사회 관계망 서비스입니다. 대표적으로 인스타그램, 페이스북, 트위터 등이 있습니다.", "options": ["애플리케이션", "에스엔에스", "와이파이", "인터넷"], "answer": 1, "explain": "1. 애플리케이션 भनेको कम्प्युटर वा मोबाइलको सफ्टवेयर प्रोग्राम हो, त्यसैले यो सामाजिक सञ्जाल मात्र होइन। 2. 에스엔에스 भनेको मानिसहरूसँग जानकारी साटासाट गर्ने सामाजिक सञ्जाल सेवा हो, त्यसैले यो विवरणसँग एकदम मिल्छ। 3. 와이파이 भनेको ताररहित इन्टरनेट प्रविधि हो, त्यसैले यो सामाजिक सञ्जाल होइन। 4. 인터넷 भनेको विश्वव्यापी कम्प्युटर सञ्जाल हो, तर फेसबुक वा इन्स्टाग्राम जस्ता सेवालाई 에스엔에스 भनिन्छ। त्यसैले सही उत्तर २ नम्बर 에스엔에스 हो।"}, {"n": "194", "q": "감정이나 표정을 그림이나 기호로 나타낸 것입니다. 메시지나 글에 감정을 표현할 때 자주 사용됩 니다.", "options": ["웹사이트", "이모티콘", "메세지", "채팅"], "answer": 1, "explain": "1. 웹사이트 भनेको इन्टरनेटको वेब पृष्ठ हो, त्यसैले यो भावना जनाउने चित्र होइन। 2. 이모티콘 भनेको भावना वा अनुहारको हाउभाउलाई चित्र वा चिन्हद्वारा देखाउने माध्यम हो, त्यसैले यो विवरणसँग एकदम मिल्छ। 3. 메세지 भनेको सन्देश वा खबर हो, त्यसैले यो भावना व्यक्त गर्ने चित्र होइन। 4. 채팅 भनेको इन्टरनेटमा गरिने कुराकानी हो, त्यसैले यो चित्र होइन। त्यसैले सही उत्तर २ नम्बर 이모티콘 हो।"}, {"n": "195", "q": "무선으로 인터넷에 연결할 수 있게 해 주는 기술입니다. 스마트폰, 노트북 등 여러 기기가 케이블 없이 인터넷을 사용할 수 있도록 도와줍니다.", "options": ["댓글", "메신저", "와이파이", "홈페이지"], "answer": 2, "explain": "१. 댓글 को अर्थ कमेन्ट (टिप्पणी) हो, यो इन्टरनेट चलाउने प्रविधि होइन। २. 메신저 को अर्थ मेसेन्जर हो, यो कुरा गर्ने एप हो। ३. 와이파이 को अर्थ वाइफाइ हो, यो सही उत्तर हो किनभने यसले तारबिना इन्टरनेटमा जोड्न मद्दत गर्छ। ४. 홈페이지 को अर्थ होमपेज हो, यो एउटा साइट हो। सही उत्तर विकल्प ३ (와이파이) हो जसको अर्थ वाइफाइ हुन्छ।"}, {"n": "196", "q": "병원이나 의원에서 의사가 환자의 건강 상태를 확인하고 병을 진단하거나 치료하는 과정입니다.", "options": ["수술", "상담", "통화", "진료"], "answer": 3, "explain": "१. 수술 भनेको शल्यक्रिया गर्नु हो, यो स्वास्थ्य अवस्था जाँच गर्ने प्रक्रिया होइन त्यसैले मिल्दैन। २. 상담 भनेको परामर्श वा सल्लाह लिनु हो, यो उपचार गर्ने प्रक्रिया होइन त्यसैले मिल्दैन। ३. 통화 भनेको फोनमा कुराकानी गर्नु हो, यो चिकित्सासँग सम्बन्धित छैन त्यसैले मिल्दैन। ४. 진료 भनेको अस्पताल वा क्लिनिकमा डाक्टरले बिरामीको स्वास्थ्य अवस्था जाँच गरेर रोगको निदान वा उपचार गर्नु हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको 진료 हो।"}, {"n": "197", "q": "질병이나 몸의 이상으로 나타나는 기침, 열, 통증 같은 여러 가지 신체적 또는 정신적인 변화입니다.", "options": ["부상", "약품", "치료", "증상"], "answer": 3, "explain": "१. 부상 भनेको चोटपटक लाग्नु हो, यो रोग वा शारीरिक परिवर्तन मात्र होइन त्यसैले मिल्दैन। २. 약품 भनेको औषधि हो, यो शारीरिक लक्षण होइन त्यसैले मिल्दैन। ३. 증상 भनेको रोग वा शरीरमा आएको गडबडीका कारण देखिने खोकी, ज्वरो, दु통जस्ता शारीरिक वा मानसिक परिवर्तनहरू हुन्, त्यसैले यो सही उत्तर हो। ४. 치료 भनेको उपचार गर्नु हो, यो रोगको लक्षण होइन त्यसैले मिल्दैन। सही उत्तर 3 नम्बरको 증상 हो।"}, {"n": "198", "q": "질병이나 상처를 치료하기 위해 의학적으로 몸의 일부를 절개하거나 조작하는 치료 방법입니다. 병원에서 전문 의사가 시행합니다.", "options": ["진료", "진단", "수술", "검진"], "answer": 2, "explain": "१. 진료 भनेको सामान्य जाँच र उपचार हो, यो शरीरको भाग काट्ने शल्यक्रिया होइन त्यसैले मिल्दैन। २. 진단 भनेको रोग पत्ता लगाउनु हो, यो शल्यक्रिया गर्ने विधि होइन त्यसैले मिल्दैन। ३. 수술 भनेको रोग वा चोटपटक उपचार गर्नका लागि चिकित्सकीय रूपमा शरीरको कुनै भाग काटेर वा जोडेर गरिने उपचार विधि हो, त्यसैले यो सही उत्तर हो। ४. 검진 भनेको स्वास्थ्य परीक्षण गर्नु हो, यो शल्यक्रिया होइन त्यसैले मिल्दैन। सही उत्तर 3 नम्बरको 수술 हो।"}, {"n": "199", "q": "의사가 환자에게 필요한 약의 종류와 복용 방법을 적어 약국에서 약을 살 수 있도록 해 주는 문서입니다.", "options": ["엑스레이", "진단서", "처방전", "보험증"], "answer": 2, "explain": "1. 엑스레이 भनेको शरीरको भित्री भागको फोटो खिच्ने प्रविधि हो, त्यसैले यो औषधि किन्ने कागज होइन। 2. 진단서 भनेको डाक्टरले रोगको विवरण लेख्ने पत्र हो, तर यसबाट औषधि पसलमा औषधि किन्न मिल्दैन। 3. 처방전 भनेको डाक्टरले औषधिको प्रकार र खाने तरिका लेखेर दिने पुर्जा हो, त्यसैले यो विवरणसँग एकदम मिल्छ। 4. 보험증 भनेको स्वास्थ्य बिमाको परिचयपत्र हो, त्यसैले यो औषधि किन्ने पुर्जा होइन। त्यसैले सही उत्तर ३ नम्बर 처방전 हो।"}, {"n": "200", "q": "사람이나 동물의 몸 전체를 의미하며, 뼈, 근육, 장기 등으로 구성되어 있습니다. 신체는 생명 활동을 유지하고, 외부 환경에 적응하는 역할을 합니다.", "options": ["신체", "체온", "신장", "체중"], "answer": 0, "explain": "१. 신체 भनेको मानिस वा जनावरको सम्पूर्ण शरीर हो, जुन हाड, मांशपेसी, अंगहरू आदि मिलेर बनेको हुन्छ, त्यसैले यो सही उत्तर हो। २. 체온 भनेको शरीरको तापक्रम हो, यो सम्पूर्ण शरीर होइन त्यसैले मिल्दैन। ३. 신장 भनेको उचाइ (वा मिर्गौला) हो, यो शरीरको सम्पूर्ण अंग होइन त्यसैले मिल्दैन। ४. 체중 भनेको शरीरको तौल हो, यो सम्पूर्ण शरीरको अर्थ होइन त्यसैले मिल्दैन। सही उत्तर 1 नम्बरको 신체 हो।"}, {"n": "201", "q": "지역 사회의 건강을 관리하고 증진하기 위해 공공 보건 서비스를 제공하는 기관입니다. 예방접종, 건강 상담, 검진 등 다양한 건강 관리 서비스를 제공합니다.", "options": ["보건소", "상담소", "아동의원", "정형외과"], "answer": 0, "explain": "१. 보건소 भनेको समुदायको स्वास्थ्य व्यवस्थापन र प्रवर्द्धनका लागि सार्वजनिक स्वास्थ्य सेवा प्रदान गर्ने संस्था हो, त्यसैले यो सही उत्तर हो। २. 상담소 भनेको परामर्श केन्द्र हो, यो सार्वजनिक स्वास्थ्य सेवा दिने संस्था होइन त्यसैले मिल्दैन। ३. 아동의원 भनेको बाल अस्पताल हो, यो सबैका लागि सार्वजनिक स्वास्थ्य सेवा दिने संस्था होइन त्यसैले मिल्दैन। ४. 정형외과 भनेको हाडजोर्नी अस्पताल हो, यो विशेष अस्पताल हो त्यसैले मिल्दैन। सही उत्तर 1 नम्बरको 보건소 हो।"}, {"n": "202", "q": "내적인 질병, 즉 내부 장기와 관련된 질환을 진단하고 치료하는 의학 분야입니다. 주로 소화기, 심장, 호흡기 등 다양한 문제를 다룹니다.", "options": ["치과", "내과", "안과", "소아과"], "answer": 1, "explain": "१. 치과 भनेको दाँतको अस्पताल हो, यो आन्तरिक अंगहरूको रोगको उपचार गर्ने विभाग होइन त्यसैले मिल्दैन। २. 내과 भनेको आन्तरिक रोगहरू जस्तै पेट, मुटु, फोक्सो आदिको जाँच र उपचार गर्ने चिकित्सा क्षेत्र हो, त्यसैले यो सही उत्तर हो। ३. 안과 भनेको आँखाको अस्पताल हो, यो आन्तरिक अंगको विभाग होइन त्यसैले मिल्दैन। ४. 소아과 भनेको बालरोग अस्पताल हो, यो आन्तरिक रोग विभाग होइन त्यसैले मिल्दैन। सही उत्तर 2 नम्बरको 내과 हो।"}, {"n": "203", "q": "이를 치료하거나 교정하는 의원이나 병원입니다.", "options": ["안과", "치과", "내과", "피부과"], "answer": 1, "explain": "१. 안과 भनेको आँखाको अस्पताल हो, यो दाँतको उपचार गर्ने ठाउँ होइन त्यसैले मिल्दैन। २. 치과 भनेको दाँतको उपचार वा मिलाउने (क्यो्रेक्ट गर्ने) अस्पताल वा क्लिनिक हो, त्यसैले यो सही उत्तर हो। ३. 내과 भनेको आन्तरिक रोगको अस्पताल हो, यो दाँतको अस्पताल होइन त्यसैले मिल्दैन। ४. 피부과 भनेको छालाको अस्पताल हो, यो दाँतको अस्पताल होइन त्यसैले मिल्दैन। सही उत्तर 2 नम्बरको 치과 हो।"}, {"n": "204", "q": "뼈, 관절, 근육이 아프거나 다쳤을 때 치료하는 병원입니다. 골절이나 관절염, 허리 아픔 등을 고치는 곳입니다.", "options": ["피부과", "산부인과", "성형외과", "정형외과"], "answer": 3, "explain": "१. 피부과 भनेको छालाको अस्पताल हो, यो हाडजोर्नीको उपचार गर्ने ठाउँ होइन त्यसैले मिल्दैन। २. 산부인과 भनेको प्रसूति तथा स्त्रीरोग अस्पताल हो, यो हाडजोर्नीको होइन त्यसैले मिल्दैन। ३. 성형외과 भनेको प्लास्टिक सर्जरी अस्पताल हो, यो हाडजोर्नी दुख्ने ठाउँ होइन त्यसैले मिल्दैन। ४. 정형외과 भनेको हाड, जोर्नी र मांशपेसी दुख्दा वा चोट लाग्दा उपचार गर्ने अस्पताल हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको 정형외과 हो।"}, {"n": "205", "q": "전통적인 한국 의학적인 방식을 이용해 치료하는 곳입니다. 주로 약초나 침, 뜸 등을 사용하여 몸의 균형을 맞추고 건강을 돌봅니다.", "options": ["의원", "안과", "치과", "한의원"], "answer": 3, "explain": "१. 의원 भनेको सामान्य क्लिनिक हो, यो परम्परागत कोरियाली चिकित्सा पद्धति मात्र होइन त्यसैले मिल्दैन। २. 안과 भनेको आँखाको अस्पताल हो, यो परम्परागत चिकित्सा होइन त्यसैले मिल्दैन। ३. 치과 भनेको दाँतको अस्पताल हो, यो परम्परागत चिकित्सा होइन त्यसैले मिल्दैन। ४. 한의원 भनेको परम्परागत कोरियाली चिकित्सा पद्धति प्रयोग गरेर उपचार गर्ने ठाउँ हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको 한의원 हो।"}, {"n": "206", "q": "얼굴이나 몸의 모양을 고치거나 바꾸는 치료를 하는 병원입니다. 다친 곳을 복원하거나 더 예쁘게 만들기 위해 수술하기도 합니다.", "options": ["내과", "피부과", "소아과", "성형외과"], "answer": 3, "explain": "१. 내과 भनेको आन्तरिक रोगको अस्पताल हो, यो शरीरको आकार बदल्ने ठाउँ होइन त्यसैले मिल्दैन। २. 피부과 भनेको छालाको अस्पताल हो, यो प्लास्टिक सर्जरी गर्ने ठाउँ होइन त्यसैले मिल्दैन। ३. 소아과 भनेको बालरोग अस्पताल हो, यो सर्जरी गर्ने ठाउँ होइन त्यसैले मिल्दैन। ४. 성형외과 भनेको अनुहार वा शरीरको आकार सच्याउने वा परिवर्तन गर्ने उपचार गर्ने अस्पताल हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको 성형외과 हो।"}, {"n": "207", "q": "귀, 코, 목이 아플 때 치료해 주는 병원으로 감기, 코막힘, 중이염 같은 병을 봅니다.", "options": ["청소년과", "정형외과", "이비인후과", "산부인과"], "answer": 2, "explain": "१. 청소년과 भनेको किशोरकिशोरी विभाग हो, यो कान, नाक, घाँटी हेर्ने अस्पताल होइन त्यसैले मिल्दैन। २. 정형외과 भनेको हाडजोर्नी अस्पताल हो, यो कान, नाक, घाँटी हेर्ने ठाउँ होइन त्यसैले मिल्दैन। ३. 이비인후과 भनेको कान, नाक र घाँटी दुख्दा रुघाखोकी, नाक बन्द हुने रोगको उपचार गर्ने अस्पताल हो, त्यसैले यो सही उत्तर हो। ४. 산부인과 भनेको प्रसूति तथा स्त्रीरोग अस्पताल हो, यो कान, नाक, घाँटीको अस्पताल होइन त्यसैले मिल्दैन। सही उत्तर 3 नम्बरको 이비인후과 हो।"}, {"n": "208", "q": "약을 사는 곳으로, 의사가 준 처방전을 가지고 가면 약을 받아 먹을 수 있습니다. 감기약이나 연고 같은 일반 약도 살 수 있습니다.", "options": ["진료소", "병원", "약국", "극장"], "answer": 2, "explain": "१. 진료소 भनेको स्वास्थ्य चौकी हो, यो औषधि किन्ने ठाउँ होइन त्यसैले मिल्दैन। २. 병원 भनेको अस्पताल हो, यो औषधि मात्र किन्न जाने ठाउँ होइन त्यसैले मिल्दैन। ३. 약국 भनेको औषधि किन्ने ठाउँ हो, जहाँ डाक्टरले दिएको पुर्जी देखाएर औषधि लिन सकिन्छ र साधारण औषधि पनि किन्न पाइन्छ, त्यसैले यो सही उत्तर हो। ४. 극장 भनेको सिनेमा हल हो, यो औषधिसँग सम्बन्धित छैन त्यसैले मिल्दैन। सही उत्तर 3 नम्बरको 약국 हो।"}, {"n": "209", "q": "가정에서 응급 조치나 병의 예방약으로 준비해 놓는 약품이며 처방전 없이 약국이나 편의점에서 쉽게 살 수 있습니다.", "options": ["비상약", "항생제", "멀미약", "아목시실린"], "answer": 0, "explain": "१. 비상약 भनेको आपत्कालीन औषधि हो, जुन घरमा आकस्मिक उपचार वा रोग रोकथामका लागि तयार गरि राखिन्छ र पुर्जी बिना नै फार्मेसी वा कन्भेनिएन्स स्टोरबाट सजिलै किन्न सकिन्छ, त्यसैले यो सही उत्तर हो। २. 항생제 भनेको एन्टिबायोटिक हो, यो पुर्जी बिना किन्न पाइँदैन त्यसैले मिल्दैन। ३. 멀미약 भनेको गाडी वा डुङ्गा लाग्दा खाने औषधि हो, यो आपत्कालीन औषधिको सामान्य वर्ग होइन त्यसैले मिल्दैन। ४. 아목시실린 भनेको एमोक्सिसिलिन (एन्टिबायोटिक) हो, यो पुर्जी बिना पाइँदैन त्यसैले मिल्दैन। सही उत्तर 1 नम्बरको 비상약 हो।"}, {"n": "210", "q": "몸이 아프거나 삔 곳에 붙이는 약입니다. 통증을 줄이고 붓기를 가라앉히는 데 도움을 줍니다.", "options": ["파스", "안약", "연고", "밴드"], "answer": 0, "explain": "१. 파스 भनेको शरीर दुखेको वा नसा तानिएको ठाउँमा टाँस्ने औषधि (पार्ष) हो, यसले दुखाइ कम गर्न र सुन्निएको घटाउन मद्दत गर्छ, त्यसैले यो सही उत्तर हो। २. 안약 भनेको आँखामा हाल्ने थोपा औषधि हो, यो शरीर दुखेको ठाउँमा टाँस्ने होइन त्यसैले मिल्दैन। ३. 연고 भनेको मलम हो, यो टाँस्ने पाटे औषधि होइन त्यसैले मिल्दैन। ४. 밴드 भनेको ब्यान्डेज वा प्लास्टर हो, यसले दुखाइ कम गर्ने औषधि भएको टाँस्ने साधन होइन त्यसैले मिल्दैन। सही उत्तर 1 नम्बरको 파스 हो।"}, {"n": "211", "q": "사람이나 동물의 병이나 상처에 생기는 해로운 세균을 죽이거나 예방하기 위하여 바르는 물질입니다.", "options": ["진통제", "소독약", "반창고", "소화제"], "answer": 1, "explain": "1. '진통제' भनेको दुखाइ कम गर्ने औषधि हो, तर यसले कीटाणु मार्दैन। 2. '소독약' भनेको कीटाणुनाशक औषधि हो, जसले घाउ वा चोटपटकमा हुने हानिकारक कीटाणुलाई मार्न र रोक्न मद्दत गर्छ, त्यसैले यो सही उत्तर हो। 3. '반창고' भनेको घाउमा टाँस्ने पट्टी हो, यो मलम वा औषधि होइन। 4. '소화제' भनेको खाना पचाउने औषधि हो, घाउमा लगाउने औषधि होइन। तसर्थ सही उत्तर २ नम्बरको '소독약' (कीटाणुनाशक औषधि) हो।"}, {"n": "212", "q": "상처나 부스럼 따위에 감는 소독한 헝겊입니다. 신축성 있고 바람이 잘 통하는 면포, 거즈 따위로 만듭니다.", "options": ["반창고", "붕대", "영양제", "파스"], "answer": 1, "explain": "१. 반창고 भनेको ब्यान्डएज वा प्लास्टर हो, त्यसैले यो मिल्दैन। २. 붕대 भनेको घाउमा बेर्ने ब्यान्डेज वा पट्टि हो, त्यसैले यो सही उत्तर हो। ३. 영양제 भनेको भिटामिन तथा पौष्टिक तत्व हो, त्यसैले यो मिल्दैन। ४. 파스 भनेको दुखाइ कम गर्ने टाँस्ने प्याच हो, त्यसैले यो मिल्दैन। सही उत्तर 붕대 हो।"}, {"n": "213", "q": "몸이나 상처가 아플 때 치료의 효과는 없고 통증을 느끼지 못하게 하는 약입니다.", "options": ["해열제", "영양제", "소화제", "진통제"], "answer": 3, "explain": "१. 해열제 भनेको ज्वरो, घटाउने औषधि हो, त्यसैले यो मिल्दैन। २. 영양제 भनेको पौष्टिक औषधि हो, त्यसैले यो मिल्दैन। ३. 소화제 भनेको पाचनसम्बन्धी औषधि हो, त्यसैले यो मिल्दैन। ४. 진통제 भनेको दुखाइ कम गर्ने औषधि हो, त्यसैले यो सही उत्तर हो। सही उत्तर 진통제 हो।"}, {"n": "214", "q": "우리 몸에 필요한 비타민이나 영양소를 보충해 주는 건강 보조 식품입니다. 피로할 때나 영양이 부족할 때 먹습니다.", "options": ["항생제", "영양제", "지사제", "진통제"], "answer": 1, "explain": "१. 항생제 भनेको एन्टिबायोटिक हो, त्यसैले यो मिल्दैन। २. 영양제 भनेको शरीरलाई चाहिने भिटामिन र पौष्टिक तत्व दिने स्वास्थ्य पूरक खाद्यपदार्थ हो, त्यसैले यो सही उत्तर हो। ३. 지사제 भनेको पखाला रोक्ने औषधि हो, त्यसैले यो मिल्दैन। ४. 진통제 भनेको दुखाइ कम गर्ने औषधि हो, त्यसैले यो मिल्दैन। सही उत्तर 영양제 हो।"}, {"n": "215", "q": "약을 전문적으로 알고, 약을 조제하거나 올바르게 먹는 방법을 알려주는 사람입니다. 주로 약국에서 일합니다.", "options": ["의사", "약사", "간호사", "보호자"], "answer": 1, "explain": "१. 의사 भनेको डाक्टर हो, त्यसैले यो मिल्दैन। २. 약사 भनेको औषधि पसलमा बसेर औषधि बनाउने र खाने तरिका सिकाउने फार्मासिस्ट (फार्मासिस्ट/औषधि व्यवसायी) हो, त्यसैले यो सही उत्तर हो। ३. 간호사 भनेको नर्स हो, त्यसैले यो मिल्दैन। ४. 보호자 भनेको बिरामीको रेखदेख गर्ने संरक्षक हो, त्यसैले यो मिल्दैन। सही उत्तर 약사 हो।"}, {"n": "216", "q": "우체국으로 보내는 모든 종류의 물건이나 편지를 말합니다. 예를 들어, 편지, 소포, 카드 등이 우편물에 포함됩니다.", "options": ["준비물", "수하물", "우편물", "방해물"], "answer": 2, "explain": "१. 준비물 भनेको तयारी गर्ने सामग्री हो, त्यसैले यो मिल्दैन। २. 수하물 भनेको लगेज वा सामान हो, त्यसैले यो मिल्दैन। ३. 우편물 भनेको चिठीपत्र वा हुलाकबाट पठाउने वस्तु हो, त्यसैले यो सही उत्तर हो। ४. 방해물 भनेको बाधा पुर्‍याउने वस्तु हो, त्यसैले यो मिल्दैन। सही उत्तर 우편물 हो।"}, {"n": "217", "q": "물건을 집이나 회사로 배달해 주는 서비스입니다. 주문한 상품이나 소포를 빠르게 집으로 받아 볼 수 있습니다.", "options": ["이체", "EMS", "택배", "환불"], "answer": 2, "explain": "१. 이체 भनेको बैंक खाताबाट पैसा स्थानान्तरण गर्नु हो, त्यसैले यो मिल्दैन। २. EMS भनेको अन्तर्राष्ट्रिय द्रुत हुलाक सेवा हो, त्यसैले यो मिल्दैन। ३. 택배 भनेको घर वा कम्पनीमा सामान पुर्‍याइदिने कुरियर सेवा हो, त्यसैले यो सही उत्तर हो। ४. 환불 भनेको पैसा फिर्ता गर्नु हो, त्यसैले यो मिल्दैन। सही उत्तर 택배 हो।"}, {"n": "218", "q": "오늘 보낸 우편물을 다음 날 바로 받아볼 수 있는 빠른 우편 서비스입니다. 급하게 보내야 할 때 사용합니다.", "options": ["일반 소포", "항공 우편", "익일 특급", "선박 우편"], "answer": 2, "explain": "१. 일반 소포 भनेको सामान्य पार्सल हो, त्यसैले यो मिल्दैन। २. 항공 우편 भनेको हवाइ हुलाक हो, त्यसैले यो मिल्दैन। ३. 익일 특급 भनेको भोलिपल्टै प्राप्त हुने गरी पठाइने द्रुत हुलाक सेवा हो, त्यसैले यो सही उत्तर हो। ४. 선박 우편 भनेको पानीजहाजबाट पठाइने हुलाक हो, त्यसैले यो मिल्दैन। सही उत्तर 익일 특급 हो।"}, {"n": "219", "q": "국제적으로 긴급한 문서나 물품을 신속하게 배송하는 우편 서비스입니다. 빠른 배송과 함께 배송 추적 기능도 제공됩니다.", "options": ["국제 특급", "익일 우편", "국내 소포", "일반 우편"], "answer": 0, "explain": "1. '국제 특급' (이에엠에스) भनेको अन्तर्राष्ट्रिय द्रुत हुलाक सेवा हो, जसले कागजात वा सामान छिटो पठाउँछ र ट्र्याकिङ पनि दिन्छ, त्यसैले यो सही उत्तर हो। 2. '익일 우편' भनेको भोलिपल्ट पुग्ने हुलाक सेवा हो, यो अन्तर्राष्ट्रिय सेवा होइन। 3. '국내 소포' भनेको देशभित्र पठाउने पार्सल सेवा हो, अन्तर्राष्ट्रिय सेवा होइन। 4. '일반 우편' भनेको साधारण हुलाक सेवा हो, जुन छिटो हुँदैन। तसर्थ सही उत्तर १ नम्बरको '국제 특급' (अन्तर्राष्ट्रिय द्रुत सेवा) हो।"}, {"n": "220", "q": "비행기를 이용해 사람이나 화물을 한 장소에서 다른 장소로 운송하는 서비스입니다. 빠른 이동이 가능해 국내외 여행과 물류에 널리 사용됩니다.", "options": ["항공편", "교통편", "선편", "왕복"], "answer": 0, "explain": "१. 항공편 भनेको हवाइमार्ग वा उडान सेवा हो, त्यसैले यो सही उत्तर हो। २. 교통편 भनेको यातायातको साधन वा माध्यम हो, त्यसैले यो मिल्दैन। ३. 선편 भनेको जलमार्ग वा पानीजहाज सेवा हो, त्यसैले यो मिल्दैन। ४. 왕복 भनेको जानु र आउनु (दोहोरो यात्रा) हो, त्यसैले यो मिल्दैन। सही उत्तर 항공편 हो।"}, {"n": "221", "q": "전기, 수도, 가스, 전화 등 공공기관이나 공기업에 정기적으로 내는 요금입니다. 생활에 필요한 기본 서비스 이용에 대한 대가입니다.", "options": ["임금", "벌금", "보험금", "공과금"], "answer": 3, "explain": "१. 임금 भनेको ज्याला वा तलब हो, त्यसैले यो मिल्दैन। २. 벌금 भनेको जरिवाना हो, त्यसैले यो मिल्दैन। ३. 보험금 भनेको दाबी भुक्तानी रकम वा बिमा रकम हो, त्यसैले यो मिल्दैन। ४. 공과금 भनेको बिजुली, पानी, ग्यास जस्ता सार्वजनिक शुल्कहरू हुन्, त्यसैले यो सही उत्तर हो। सही उत्तर 공과금 हो।"}, {"n": "222", "q": "은행에서 개인이나 기업이 금융 거래를 할 수 있도록 만든 책자나 카드입니다. 입금, 출금, 송금 등의 기록이 기록되어 있으며, 계좌와 연결되어 사용됩니다.", "options": ["도장", "서명", "창구", "통장"], "answer": 3, "explain": "१. 도장 भनेको सहीछाप वा ल्याछाप लगाउने छाप हो, त्यसैले यो मिल्दैन। २. 서명 भनेको हस्ताक्षर हो, त्यसैले यो मिल्दैन। ३. 창구 भनेको बैंकको काउन्टर हो, त्यसैले यो मिल्दैन। ४. 통장 भनेको बैंक पासबुक हो, त्यसैले यो सही उत्तर हो। सही उत्तर 통장 हो।"}, {"n": "223", "q": "통장의 입출금 내역과 잔액 따위를 확인하기 위하여, 창구나 자동화 기기를 통해 기록을 정리하는 일입니다.", "options": ["잔액 조회", "계좌 이체", "통장 정리", "인터넷뱅킹"], "answer": 2, "explain": "१. 잔액 조회 भनेको मौज्दात रकम हेर्नु हो, त्यसैले यो मिल्दैन। २. 계좌 이체 भनेको खाताबाट पैसा स्थानान्तरण गर्नु हो, त्यसैले यो मिल्दैन। ३. 통장 정리 भनेको पासबुक अपडेट वा स्टेटमेन्ट प्रिन्ट गर्नु हो, त्यसैले यो सही उत्तर हो। ४. 인터넷뱅킹 भनेको अनलाइन बैंकिङ हो, त्यसैले यो मिल्दैन। सही उत्तर 통장 정리 हो।"}, {"n": "224", "q": "개인이나 단체의 신분을 증명하거나 공식 문서에 사용하기 위해 이름 등을 새긴 도구입니다. 서명 대신 사용되며, 계약서나 신청서 등에 찍어 법적 효력을 가집니다.", "options": ["창구", "카드", "도장", "서명"], "answer": 2, "explain": "१. 창구 भनेको काउन्टर हो, त्यसैले यो मिल्दैन। २. 카드 भनेको कार्ड हो, त्यसैले यो मिल्दैन। ३. 도장 भनेको कागजातमा आधिकारिकताका लागि प्रयोग गरिने सहीछाप (सील/स्टाम्प) हो, त्यसैले यो सही उत्तर हो। ४. 서명 भनेको हस्ताक्षर हो, त्यसैले यो मिल्दैन। सही उत्तर 도장 हो।"}, {"n": "225", "q": "순서를 정하기 위해 사용하는 표로, 번호를 부여해 차례대로 처리할 수 있게 도와줍니다. 병원, 은행, 관공서 등에서 대기 순서를 관리할 때 주로 사용됩니다.", "options": ["번호표", "신청서", "예금주", "영수증"], "answer": 0, "explain": "१. 번호표 भनेको पालो लिनका लागि दिइने नम्बर पर्ची (टोकन) हो, त्यसैले यो सही उत्तर हो। २. 신청서 भनेको निवेदन फारम हो, त्यसैले यो मिल्दैन। ३. 예금주 भनेको खातावाला हो, त्यसैले यो मिल्दैन। ४. 영수증 भनेको बिल वा रसिद हो, त्यसैले यो मिल्दैन। सही उत्तर 번호표 हो।"}, {"n": "226", "q": "개인의 신원을 증명하기 위해 발급되는 공식 문서입니다. 주민등록증, 운전면허증, 여권 등이 이에 해당하며, 본인 확인이 필요한 상황에서 사용됩니다.", "options": ["신청서", "신분증", "이력서", "보험증"], "answer": 1, "explain": "1. 신청서 भनेको आवेदन फारम हो, जुन यस विवरणसँग मिल्दैन। 2. 신분증 भनेको परिचय पत्र हो, जुन व्यक्तिको पहिचान प्रमाणित गर्न जारी गरिने आधिकारिक कागजात हो र यसले विवरणसँग ठ्याक्कै मेल खान्छ। 3. 이력서 भनेको बायोडाटा वा व्यक्तिगत विवरण हो, जुन यस विवरणसँग मिल्दैन। 4. 보험증 भनेको बीमा कार्ड हो, जुन यस विवरणसँग मिल्दैन। सही उत्तर 2 (신분증, परिचय पत्र) हो।"}, {"n": "227", "q": "은행 계좌에서 현금을 인출하거나 잔액 조회, 송금 등의 업무를 할 수 있는 자동화된 기계입니다. 카드나 비밀번호를 이용해 24시간 이용할 수 있어 편리합니다.", "options": ["자동 판매기", "현금 인출기", "계좌 이체", "통"], "answer": 1, "explain": "1. 자동 판매기 भनेको भेंडिङ मेसिन (स्वचालित बिक्री गर्ने मेशिन) हो, जुन यस विवरणसँग मिल्दैन। 2. 현금 인출기 भनेको नगद झिक्ने मेशिन (एटिएम) हो, जसले बैंक खाताबाट नगद झिक्ने, ब्यालेन्स जाँच गर्ने जस्ता काम गर्छ र विवरणसँग ठ्याक्कै मेल खान्छ। 3. 계좌 이체 भनेको खाता स्थानान्तरण हो, जुन यस विवरणसँग मिल्दैन। 4. 통 भनेको भाँडो वा पिँडौं हो, जुन यस विवरणसँग मिल्दैन। सही उत्तर 1 (현금 인출기, नगद झिक्ने मेशिन) हो।"}, {"n": "228", "q": "한 나라의 돈을 다른 나라의 돈으로 바꾸는 과정입니다. 주로 해외 여행이나 국제 거래 시 필요하며, 은행이나 환전소에서 할 수 있습니다.", "options": ["환전", "입금", "출금", "송금"], "answer": 0, "explain": "1. 환전 भनेको मुद्रा सटही (पैसा साट्ने काम) हो, जसले एक देशको पैसा अर्को देशको पैसामा साट्ने प्रक्रिया बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। 2. 입금 भनेको जम्मा गर्ने काम हो, जुन यस विवरणसँग मिल्दैन। 3. 출금 भनेको पैसा झिक्ने काम हो, जुन यस विवरणसँग मिल्दैन। 4. 송금 भनेको रेमिट्यान्स वा पैसा पठाउने काम हो, जुन यस विवरणसँग मिल्दैन। सही उत्तर 0 (환전, मुद्रा सटही) हो।"}, {"n": "229", "q": "외국인 근로자들이 한국에서 일하며 겪는 어려움을 상담하고 지원하는 기관입니다. 체류, 생활, 법률 문제 등에 대한 정보와 모국어로 도움을 제공합니다.", "options": ["고용노동부", "외국인력상담센터", "다문화센터", "근로복지센터"], "answer": 1, "explain": "1. 고용노동부 भनेको श्रम तथा रोजगार मन्त्रालय हो, जुन यस विवरणसँग मिल्दैन। 2. 외국인력상담센터 भनेको विदेशी कामदार परामर्श केन्द्र हो, जसले वैदेशिक कामदारहरूको समस्या समाधान र सहयोग गर्छ र विवरणसँग ठ्याक्कै मेल खान्छ। 3. 다문화센터 भनेको बहुसांस्कृतिक केन्द्र हो, जुन यस विवरणसँग मिल्दैन। 4. 근로복지센터 भनेको श्रमिक कल्याण केन्द्र हो, जुन यस विवरणसँग मिल्दैन। सही उत्तर 1 (외국인력상담센터, विदेशी कामदार परामर्श केन्द्र) हो।"}, {"n": "230", "q": "어떤 사실이나 주장이 사실임을 입증할 수 있는 자료나 정보입니다. 예를 들어, 사건이 일어난 시간, 장소, 사람 등을 증명할 수 있는 물건 등이 이에 해당합니다.", "options": ["가해자", "피해자", "증인", "증거"], "answer": 3, "explain": "1. '가해자' भनेको अरूलाई हानि पुऱ्याउने मानिस हो, त्यसैले यो होइन। 2. '피해자' भनेको हानि वा चोट भोगेको पीडित मानिस हो, त्यसैले यो होइन। 3. '증인' भनेको घटना देख्ने साक्षी मानिस हो, त्यसैले यो होइन। 4. '증거' भनेको कुनै तथ्य वा घटना सत्य हो भनेर प्रमाणित गर्ने प्रमाण वा सामग्री हो, त्यसैले यो सही उत्तर हो। तसर्थ सही उत्तर ४ नम्बरको '증거' (प्रमाण) हो। यो प्रश्नका विकल्पहरू किताबमा छापिएका छैनन्, शिक्षकले दिनुभएको हो।"}, {"n": "231", "q": "공장이나 사무실 같은 물리적인 공간으로, 사람들이 일정한 작업이나 업무를 수행하는 장소를 말합니다.", "options": ["작업대", "작업장", "작업 관리", "작업 순서"], "answer": 1, "explain": "1. 작업대 भनेको काम गर्ने टेबल हो, जुन यस विवरणसँग मिल्दैन। 2. 작업장 भनेको कार्यस्थल वा काम गर्ने ठाउँ हो, जसले मानिसहरूले निश्चित काम गर्ने भौतिक ठाउँलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। 3. 작업 관리 भनेको कामको व्यवस्थापन हो, जुन यस विवरणसँग मिल्दैन। 4. 작업 순서 भनेको कामको क्रम हो, जुन यस विवरणसँग मिल्दैन। सही उत्तर 1 (작업장, कार्यस्थल) हो।"}, {"n": "232", "q": "작업을 할 때 나무나 금속 조각과 같은 물건을 단단히 고정시켜 도구를 사용할 수 있는 테이블입니다.", "options": ["작업대", "서랍장", "손수레", "옷장"], "answer": 0, "explain": "1. 작업대 भनेको काम गर्ने टेबल (वर्कबेञ्च) हो, जसले काठ वा धातुका टुक्राहरूलाई कच्याककुचुक नगरी कडासँग अड्याएर औजार प्रयोग गर्न मिल्ने टेबल बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। 2. 서랍장 भनेको दराज हो, जुन यस विवरणसँग मिल्दैन। 3. 손수레 भनेको हाते ठेला हो, जुन यस विवरणसँग मिल्दैन। 4. 옷장 भनेको कपडा राख्ने दराज हो, जुन यस विवरणसँग मिल्दैन। सही उत्तर 0 (작업대, काम गर्ने टेबल) हो।"}, {"n": "233", "q": "물건이나 자재 등을 보관하기 위한 공간 또는 건물을 말하며 상품, 식료품, 기계 부품 등을 보관합니다.", "options": ["창고", "복도", "기숙사", "관리소"], "answer": 0, "explain": "1. '창고' भनेको सामान, खाद्यान्न वा पार्टपुर्जा भण्डार गर्ने गोदाम हो, त्यसैले यो विवरणसँग मिल्छ र सही उत्तर हो। 2. '복도' भनेको हिँड्ने बाटो वा बरण्डा हो, सामान राख्ने ठाउँ होइन। 3. '기숙사' भनेको कामदारहरू बस्ने होस्टेल हो, सामान भण्डार गर्ने ठाउँ होइन। 4. '관리소' भनेको भवन वा क्षेत्रको हेरचाह गर्ने कार्यालय हो, सामान राख्ने गोदाम होइन। तसर्थ सही उत्तर १ नम्बरको '창고' (गोदाम) हो।"}, {"n": "234", "q": "어떤 일이나 업무를 맡아 책임지고 수행하는 사람을 말합니다. 고객 상담을 맡은 직원이나 창고 관리 책임자 등 이에 해당합니다.", "options": ["공장장", "담당자", "과장", "반장"], "answer": 1, "explain": "1. 공장장 भनेको कारखाना प्रमुख हो, जुन यस विवरणसँग मिल्दैन। 2. 담당자 भनेको जिम्मेवार व्यक्ति वा सम्पर्क व्यक्ति हो, जसले कुनै कामको जिम्मेवारी लिएर त्यसलाई पूरा गर्ने व्यक्तिलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। 3. 과장 भनेको विभाग प्रमुख (कावा) हो, जुन यस विवरणसँग मिल्दैन। 4. 반장 भनेको बान्जाङ (समूह नेता) हो, जुन यस विवरणसँग मिल्दैन। सही उत्तर 1 (담당자, जिम्मेवार व्यक्ति) हो।"}, {"n": "235", "q": "물체나 공간이 얼마나 따뜻하거나 차가운지를 나타내는 물리적인 양입니다. 섭씨(°C)나 화씨(°F) 단위로 측정하며, 열의 세기와 관련이 있습니다.", "options": ["날씨", "계절", "온도", "환경"], "answer": 2, "explain": "1. 날씨 भनेको मौसम हो, जुन यस विवरणसँग मिल्दैन। 2. 계절 भनेको ऋतु हो, जुन यस विवरणसँग मिल्दैन। 3. 온도 भनेको तापक्रम हो, जसले बस्तु वा ठाउँ कति तातो वा चिसो छ भन्ने भौतिक मात्रालाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। 4. 환경 भनेको वातावरण हो, जुन यस विवरणसँग मिल्दैन। सही उत्तर 2 (온도, तापक्रम) हो।"}, {"n": "236", "q": "한 나라나 지역의 경제에서 각 산업(농업, 제조업, 서비스업 등)이 차지하는 비중과 이들 사이의 상호 관계를 나타내는 개념입니다.", "options": ["산업 개발", "산업 경제", "산업 관리", "산업 구조"], "answer": 3, "explain": "1. 산업 개발 भनेको उद्योग विकास हो, जुन यस विवरणसँग मिल्दैन। 2. 산업 경제 भनेको औद्योगिक अर्थतन्त्र हो, जुन यस विवरणसँग मिल्दैन। 3. 산업 관리 भनेको उद्योग व्यवस्थापन हो, जुन यस विवरणसँग मिल्दैन। 4. 산업 구조 भनेको औद्योगिक संरचना हो, जसले देशको अर्थतन्त्रमा विभिन्न उद्योगहरूको हिस्सा र सम्बन्धलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। सही उत्तर 3 (산업 구조, औद्योगिक संरचना) हो। किताबमा दोस्रो विकल्प '산업 계제' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '산업 경제' हो।"}, {"n": "237", "q": "전 세계가 정치, 경제, 사회, 문화 등 여러 측면에서 서로 밀접하게 연결되고 영향을 주고받는 현상을 말합니다.", "options": ["글로벌화", "산업화", "도시화", "온난화"], "answer": 0, "explain": "1. 글로벌화 भनेको विश्वव्यापीकरण (ग्लोबललाइजेसन) हो, जसले संसारभरका देशहरू राजनीति, अर्थतन्त्र र संस्कृतिमा जोडिने प्रक्रियालाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। 2. 산업화 भनेको औद्योगिकीकरण हो, जुन यस विवरणसँग मिल्दैन। 3. 도시화 भनेको सहरीकरण हो, जुन यस विवरणसँग मिल्दैन। 4. 온난화 भनेको तापक्रम वृद्धि (ग्लोबल वार्मिङ) हो, जुन यस विवरणसँग मिल्दैन। सही उत्तर 0 (글로벌화, विश्वव्यापीकरण) हो।"}, {"n": "238", "q": "제품을 보호하기 위해 충격이나 진동을 흡수하고 분산시키는 역할을 하는 포장 재료입니다.", "options": ["라벨", "밀봉", "완충재", "테이프"], "answer": 2, "explain": "1. '라벨' भनेको सामानको विवरण लेखिएको लेबल हो, धक्का सोस्ने सामग्री होइन। 2. '밀봉' भनेको बाकस वा पोका हावा नछिर्ने गरी बन्द गर्ने काम हो, सामग्री होइन। 3. '완충재' भनेको सामान फुट्न वा बिग्रन नदिन धक्का र कम्पन सोस्ने प्याकिङ सामग्री हो, त्यसैले यो सही उत्तर हो। 4. '테이프' भनेको बाकस टाँस्न प्रयोग गरिने टेप हो, धक्का सोस्ने सामग्री होइन। तसर्थ सही उत्तर ३ नम्बरको '완충재' (धक्का सोस्ने सामग्री) हो।"}, {"n": "239", "q": "금속 제품이 녹슬지 않도록 포장 처리가 된 종이로, 금속을 포장할 때 사용하는 특수 포장재입니다.", "options": ["완충재", "방청지", "절단기", "용접봉"], "answer": 1, "explain": "1. 완충재 भनेको बफर सामग्री हो, जुन यस विवरणसँग मिल्दैन। 2. 방청지 भनेको खिया प्रतिरोधी कागज हो, जसले धातुका उत्पादनहरूमा खिया लाग्न नदिन प्रयोग गरिने विशेष प्याकेजिङ कागजलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। 3. 절단기 भनेको काट्ने मेशिन हो, जुन यस विवरणसँग मिल्दैन। 4. 용접봉 भनेको वेल्डिङ रड हो, जुन यस विवरणसँग मिल्दैन। सही उत्तर 1 (방청지, खिया प्रतिरोधी कागज) हो।"}, {"n": "240", "q": "물품을 쌓아 올리고 지게차나 핸드리프트로 쉽게 운반할 수 있도록 만든 바닥용 받침대입니다. 물류 창고나 공장에서 상품을 운반할 때 사용되며, 나무, 플라스틱, 금속 등의 재질이 있습니다.", "options": ["대차", "일륜차", "트렉터", "파렛트"], "answer": 3, "explain": "1. 대차 भनेको ट्रली हो, जुन यस विवरणसँग मिल्दैन। 2. 일륜차 भनेको एक चक्के ठेला (व्हीलबारो) हो, जुन यस विवरणसँग मिल्दैन। 3. 트렉터 भनेको ट्र्याक्टर हो, जुन यस विवरणसँग मिल्दैन। 4. 파렛트 भनेको प्यालेट (सामान राख्ने काठ वा प्लास्टिकको प्लेटर) हो, जसले सामानहरू थुपार्न र फोर्कलिफ्टले सजिलै ओसार्न मद्दत गर्ने भुईँको आधारलाई बुझाउँछ र विवरणसँग ठ्याक्कै मेल खान्छ। सही उत्तर 3 (파렛트, प्यालेट) हो।"}, {"n": "241", "q": "앞부분에 포크형의 두 개 철판이 나와 있어 이것을 상하로 움직여 짐을 운반하거나 하역합니다.", "options": ["크레인", "콤바인", "화물차", "지게차"], "answer": 3, "explain": "1. 크레인 भनेको ठूला र भारी सामानहरू माथि उचालेर टाढा लैजाने क्रेन हो, त्यसैले यो मिल्दैन। 2. 콤바인 भनेको धान वा गहुँ काट्ने र थ्रेसिंग गर्ने कृषि मेसिन हो, त्यसैले यो मिल्दैन। 3. 화물차 भनेको सामान बोक्ने ट्रक हो, त्यसैले यो मिल्दैन। 4. 지게차 भनेको अगाडि फोर्क जस्तो फलामको प्लेट भएको र त्यसलाई माथि तल सार्दै सामान बोक्ने वा अनलोड गर्ने फोर्कलिफ्ट हो, त्यसैले यो सही उत्तर हो। सही उत्तर 지게차 हो जसको अर्थ फोर्कलिफ्ट हो।"}, {"n": "242", "q": "파렛트에 적재된 물품을 사람이 직접 밀거나 당겨서 운반할 수 있도록 만든 수동 운반 장비입니다. 지게차 없이 좁은 공간에서 물건을 옮길 때 주로 사용됩니다.", "options": ["핸드 파렛트", "핸드 카트", "일륜차", "손수레"], "answer": 0, "explain": "1. 핸드 파렛트 भनेको प्यालेटमा राखिएका सामानहरू मानिसले आफैँ ठेलेर वा तानेर लैजान सक्ने गरी बनाएको ह्यान्ड प्यालेट ट्रक हो, त्यसैले यो सही उत्तर हो। 2. 핸드 카트 भनेको सामान्य हातले गुडाउने कार्ट हो, त्यसैले यो मिल्दैन। 3. 일륜차 भनेको एक पाङ्ग्रे ठेलागाडी हो, त्यसैले यो मिल्दैन। 4. 손수레 भनेको हातले गुडाउने ठेलागाडी हो, त्यसैले यो मिल्दैन। सही उत्तर 핸드 파렛트 हो जसको अर्थ ह्यान्ड प्यालेट हो।"}, {"n": "243", "q": "물건을 싣고 이동시키기 위한 바퀴 달린 운반 장비로, 주로 공장, 창고, 물류 현장에서 사용됩니다. 무거운 짐을 실어 나를 때 사용하는 평평한 판 위에 바퀴가 달린 운반 수레입니다.", "options": ["대차", "트렉터", "파렛트", "지게차"], "answer": 0, "explain": "1. 대차 भनेको सामान बोकेर लैजान पाङ्ग्रा भएको समथल प्लेट वा ट्रली हो, त्यसैले यो सही उत्तर हो। 2. 트렉터 भनेको ट्र्याक्टर हो, त्यसैले यो मिल्दैन। 3. 파렛트 भनेको सामान राख्ने प्यालेट हो, त्यसैले यो मिल्दैन। 4. 지게차 भनेको फोर्कलिफ्ट हो, त्यसैले यो मिल्दैन। सही उत्तर 대차 हो जसको अर्थ ट्रली वा प्ल्याटफर्म ट्रक हो।"}, {"n": "244", "q": "다른 나라로부터 상품이나 기술 따위를 국내로 사들이는 절차를 말합니다.", "options": ["수출", "무역", "수입", "소득"], "answer": 2, "explain": "1. 수출 भनेको विदेशमा सामान पठाउनु वा निर्यात गर्नु हो, त्यसैले यो मिल्दैन। 2. 무역 भनेको दुई देशबीच सामान किनबेच गर्नु वा व्यापार गर्नु हो, त्यसैले यो मिल्दैन। 3. 수입 भनेको विदेशबाट सामान वा प्रविधि देश भित्र भित्र्याउनु वा आयात गर्नु हो, त्यसैले यो सही उत्तर हो। 4. 소득 भनेको आम्दानी हो, त्यसैले यो मिल्दैन। सही उत्तर 수입 हो जसको अर्थ आयात हो।"}, {"n": "245", "q": "자연에서 인간의 노력 없이 얻을 수 있는 자원으로, 산업과 생활에 활용되는 물, 공기, 석유, 석탄, 산림, 광물 같은 자원입니다.", "options": ["수자원", "문화유산", "천연자원", "산림 재산"], "answer": 2, "explain": "1. 수자원 भनेको पानीका स्रोतहरू हुन्, त्यसैले यो मिल्दैन। 2. 문화유산 भनेको सांस्कृतिक सम्पदा हो, त्यसैले यो मिल्दैन। 3. 천연자원 भनेको प्रकृतिबाट मानिसको प्रयास बिना प्राप्त हुने पानी, हावा, खनिज जस्ता प्राकृतिक स्रोतहरू हुन्, त्यसैले यो सही उत्तर हो। 4. 산림 재산 भनेको वनसम्बन्धी सम्पत्ति हो, त्यसैले यो मिल्दैन। सही उत्तर 천연자원 हो जसको अर्थ प्राकृतिक स्रोत हो।"}, {"n": "246", "q": "국가 간에 상품이나 서비스를 사고파는 경제 활동을 말합니다. 예를 들어 한국이 외국에 자동차를 수출하고, 밀이나 석유를 수입하는 것입니다.", "options": ["소득", "무역", "임금", "재산"], "answer": 1, "explain": "1. 소득 भनेको आम्दानी हो, त्यसैले यो मिल्दैन। 2. 무역 भनेको देशहरूबीच सामान वा सेवाहरूको किनबेच गर्ने आर्थिक गतिविधि वा व्यापार हो, त्यसैले यो सही उत्तर हो। 3. 임금 भनेको ज्याला वा तलब हो, त्यसैले यो मिल्दैन। 4. 재산 भनेको सम्पत्ति हो, त्यसैले यो मिल्दैन। सही उत्तर 무역 हो जसको अर्थ व्यापार हो।"}, {"n": "247", "q": "한 나라가 자국의 상품이나 서비스를 다른 나라에 보내어 판매하는 경제 활동입니다.", "options": ["비용", "수입", "수출", "세금"], "answer": 2, "explain": "1. 비용 भनेको खर्च हो, त्यसैले यो मिल्दैन। 2. 수입 भनेको आयात हो, त्यसैले यो मिल्दैन। 3. 수출 भनेको आफ्नो देशको सामान वा सेवा अर्को देशमा पठाएर बिक्री गर्ने आर्थिक गतिविधि वा निर्यात हो, त्यसैले यो सही उत्तर हो। 4. 세금 भनेको कर हो, त्यसैले यो मिल्दैन। सही उत्तर 수출 हो जसको अर्थ निर्यात हो।"}, {"n": "248", "q": "지하에서 뽑아낸 정제되지 않은 천연 상태의 기름으로, 석유 제품의 원료가 됩니다. 휘발유, 경유, 플라스틱 등을 만드는 데 사용됩니다.", "options": ["원유", "재료", "장비", "전기"], "answer": 0, "explain": "1. 원유 भनेको जमिनमुनिबाट निकालिएको प्रशोधन नगरिएको प्राकृतिक तेल वा कच्चा तेल हो, त्यसैले यो सही उत्तर हो। 2. 재료 भनेको सामग्री हो, त्यसैले यो मिल्दैन। 3. 장비 भनेको उपकरण हो, त्यसैले यो मिल्दैन। 4. 전기 भनेको बिजुली हो, त्यसैले यो मिल्दैन। सही उत्तर 원유 हो जसको अर्थ कच्चा तेल हो।"}, {"n": "249", "q": "기계, 장비, 차량 등에서 부품이나 장치를 설치하거나 부착하는 과정을 의미합니다. 이 과정은 부품이 원활히 작동하도록 연결하거나 고정하는 중요한 작업입니다.", "options": ["작동", "관리", "재고", "장착"], "answer": 3, "explain": "1. 작동 भनेको मेसिन चल्नु वा सञ्चालन हुनु हो, त्यसैले यो मिल्दैन। 2. 관리 भनेको व्यवस्थापन वा रेखदेख गर्नु हो, त्यसैले यो मिल्दैन। 3. 재고 भनेको बाँकी सामान वा स्टक हो, त्यसैले यो मिल्दैन। 4. 장착 भनेको मेसिन वा सवारी साधनमा पार्टपुर्जा वा यन्त्र जडान गर्नु वा फिट गर्नु हो, त्यसैले यो सही उत्तर हो। सही उत्तर 장착 हो जसको अर्थ जडान गर्नु वा फिट गर्नु हो।"}, {"n": "250", "q": "어떤 기계나 구조물을 분해하거나 분리하는 과정을 말합니다. 이는 부품을 하나씩 나누거나, 원래의 형태에서 분해하는 작업을 포함합니다.", "options": ["용접", "절단", "해체", "회전"], "answer": 2, "explain": "1. '용접' भनेको वेल्डिङ गर्ने काम हो, त्यसैले यो मेसिन वा संरचना फुकाल्नेसँग मिल्दैन। 2. '절단' भनेको सामान काट्ने काम हो, त्यसैले यो विवरणसँग मेल खाँदैन। 3. '해체' भनेको खोलकल गर्ने वा विघटन गर्ने काम हो, जसले विवरणमा भनिए झैँ मेसिन वा संरचनाका भागहरू छुट्याउने कामलाई बुझाउँछ। 4. '회전' भनेको घुम्ने वा घुमाउने कार्य हो, त्यसैले यो खोलकल गर्नेसँग मिल्दैन। त्यसैले सही उत्तर 3 नम्बरको '해체' (विघटन वा खोलकल) हो।"}, {"n": "251", "q": "본래 있어야 할 물질과 다른 물질이 섞여 있는 상태를 말합니다. 주로 원하지 않거나 불필요한 물질을 지칭합니다.", "options": ["재질", "수물질", "이물질", "화학물질"], "answer": 2, "explain": "1. '재질' भनेको सामानको किसिम वा गुण हो, त्यसैले यो बाहिरबाट मिसिने नचाहिने वस्तु होइन। 2. '수물질' भनेको पानीजन्य वा असम्बन्धित शब्द हो, त्यसैले यो विवरणसँग मिल्दैन। 3. '이물질' भनेको नचाहिने बाहिरी पदार्थ हो, जसले सक्कली वस्तुमा अर्कै नचाहिने चीज मिसिएको अवस्थालाई बुझाउँछ। 4. '화학물질' भनेको रासायनिक पदार्थ हो, त्यसैले यो नचाहिने तत्त्व मिसिएको विवरणसँग मिल्दैन। त्यसैले सही उत्तर 3 नम्बरको '이물질' (बाहिरी नचाहिने पदार्थ) हो। दोस्रो विकल्प '수물질' किताबमा छापिएजस्तै राखिएको छ।"}, {"n": "252", "q": "실내의 탁한 공기를 밖으로 내보내고 신선한 공기를 들여오는 기계 장치입니다. 욕실, 주방, 공장 등에서 공기 순환과 환기를 위해 사용됩니다.", "options": ["환풍기", "선풍기", "에어컨", "온돌"], "answer": 0, "explain": "1. 환풍기 भनेको कोठाको फोहोर हावा बाहिर फालेर ताजा हावा भित्र ल्याउने भेन्टिलेटर वा एक्जस्ट फ्यान हो, त्यसैले यो सही उत्तर हो। 2. 선풍기 भनेको पङ्खा (बिजुलीको पंखा) हो, त्यसैले यो मिल्दैन। 3. 에어컨 भनेको एयर कन्डिसनर हो, त्यसैले यो मिल्दैन। 4. 온돌 भनेको कोरियाली तातो भुइँ प्रणाली हो, त्यसैले यो मिल्दैन। सही उत्तर 환풍기 हो जसको अर्थ भेन्टिलेटर वा एक्जस्ट फ्यान हो।"}, {"n": "253", "q": "회전하는 절삭공구에 가공물을 이송하여 원하는 형상으로 가공하는 공작 기계로 특히 가공물을 절단하고 깎을 때 사용합니다.", "options": ["선반 기계", "밀링 기계", "용접 기계", "프레스 기계"], "answer": 1, "explain": "1. 선반 기계 भनेको लेथ मेसिन हो जसले धातु वा काठलाई घुमाएर काट्छ, त्यसैले यो मिल्दैन। 2. 밀링 기계 भनेको घुम्ने कटरको माध्यमबाट वर्कपिसलाई काटेर, कुँदेर वा सेप दिने मिलिङ मेसिन हो, त्यसैले यो सही उत्तर हो। 3. 용접 기계 भनेको वेल्डिङ मेसिन हो, त्यसैले यो मिल्दैन। 4. 프레스 기계 भनेको प्रेस मेसिन हो, त्यसैले यो मिल्दैन। सही उत्तर 밀링 기계 हो जसको अर्थ मिलिङ मेसिन हो।"}, {"n": "254", "q": "금속, 나무, 돌 따위를 회전시켜서 갈거나 파내거나 도려내는 데 쓰는 공작 기계입니다.", "options": ["밀링 기계", "밴딩 기계", "선반 기계", "용접 기계"], "answer": 2, "explain": "1. 밀링 기계 भनेको मिलिङ मेसिन हो, त्यसैले यो मिल्दैन। 2. 밴딩 기계 भनेको बेन्डिङ मेसिन हो, त्यसैले यो मिल्दैन। 3. 선반 기계 भनेको धातु, काठ वा ढुङ्गालाई घुमाएर छिलेर, खोपेर वा काटेर आकार निकाल्ने लेथ मेसिन हो, त्यसैले यो सही उत्तर हो। 4. 용접 기계 भनेको वेल्डिङ मेसिन हो, त्यसैले यो मिल्दैन। सही उत्तर 선반 기계 हो जसको अर्थ लेथ मेसिन हो।"}, {"n": "255", "q": "두 개 이상의 금속 물체나 재료를 열로 녹여서 접합시키는 기계입니다.", "options": ["밀링 기계", "용접 기계", "선반 기계", "프레스 기계"], "answer": 1, "explain": "1. 밀링 기계 भनेको मिलिङ मेसिन हो, त्यसैले यो मिल्दैन। 2. 용접 기계 भनेको दुई वा दुईभन्दा बढी धातुका वस्तु वा सामग्रीहरूलाई तापको सहायताले पगालेर जोड्ने वेल्डिङ मेसिन हो, त्यसैले यो सही उत्तर हो। 3. 선반 기계 भनेको लेथ मेसिन हो, त्यसैले यो मिल्दैन। 4. 프레스 기계 भनेको प्रेस मेसिन हो, त्यसैले यो मिल्दैन। सही उत्तर 용접 기계 हो जसको अर्थ वेल्डिङ मेसिन हो।"}, {"n": "256", "q": "붙이는 작업을 할 때 아주 뜨거운 불꽃이 튈 수 있어서 다치지 않도록 조심해서 일해야 하는 기계입니다.", "options": ["선반기계", "프레스기계", "밀링기계", "전기용접기"], "answer": 3, "explain": "१. 선반기계 भनेको धातुलाई घुमाएर काट्ने मेसिन हो, त्यसैले यो मिल्दैन। २. 프레스기계 भनेको धातुमा दबाब दिने मेसिन हो, त्यसैले यो मिल्दैन। ३. 밀링기계 भनेको मिलिङ गर्ने मेसिन हो, त्यसैले यो मिल्दैन। ४. 전기용접기 भनेको बिजुलीको आगोले धातु जोड्ने मेसिन हो जसमा आगोको फुल्लिङ उड्न सक्छ, त्यसैले यो सही उत्तर हो। सही उत्तर भनेको ४ नम्बरको 전기용접기 (विद्युतीय वेल्डिङ मेसिन) हो।"}, {"n": "257", "q": "금속이나 기타 재료에 큰 압력을 가해 절단, 성형, 구멍 뚫기 등의 작업을 수행하는 산업용 기계입니다.", "options": ["선반기계", "프레스기계", "밀링기계", "전기용접기"], "answer": 1, "explain": "१. 프레스기계 भनेको धातु वा अन्य सामग्रीमा ठूलो दबाब दिएर काट्ने, आकार दिने वा प्वाल पार्ने काम गर्ने औद्योगिक मेसिन हो, त्यसैले यो सही उत्तर हो। २. 선반기계 भनेको लाथ मेसिन हो, त्यसैले यो मिल्दैन। ३. 밀링기계 भनेको मिलिङ मेसिन हो, त्यसैले यो मिल्दैन। ४. 전기용접기 भनेको विद्युतीय वेल्डिङ गर्ने मेसिन हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको २ नम्बरको 프레스기계 (प्र्रेस मेसिन) हो।"}, {"n": "258", "q": "금속, 목재, 플라스틱 등의 재료에 구멍을 뚫기 위해 사용하는 기계입니다. 제조업이나 건설 현장에서 정확한 위치에 구멍을 뚫을 때 사용됩니다.", "options": ["에어컴프레서", "드릴링머신", "절단기", "전동커터기"], "answer": 1, "explain": "१. 에어컴프레서 भनेको हावा कम्प्रेस गर्ने मेसिन हो, त्यसैले यो मिल्दैन। २. 드릴링머신 भनेको धातु, काठ वा प्लास्टिक जस्ता सामग्रीहरूमा प्वाल पार्न प्रयोग गरिने मेसिन हो, त्यसैले यो सही उत्तर हो। ३. 절단기 भनेको काट्ने मेसिन हो, त्यसैले यो मिल्दैन। ४. 전동커터기 भनेको विद्युतीय कटर हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको २ नम्बरको 드릴링머신 (ड्रिलिङ मेशिन) हो।"}, {"n": "259", "q": "전기를 동력으로 사용하여 금속, 나무, 플라스틱 등의 재료를 빠르고 정밀하게 절단하는 전동 공구입니다.", "options": ["가전제품", "에어컴프레서", "전동커터기", "전기용접기"], "answer": 2, "explain": "१. 가전제품 भनेको घरायसी विद्युतीय उपकरण हो, त्यसैले यो मिल्दैन। २. 에어컴프레서 भनेको हावा कम्प्रेस गर्ने मेसिन हो, त्यसैले यो मिल्दैन। ३. 전동커터기 भनेको बिजुली प्रयोग गरेर धातु, काठ र प्लास्टिकलाई छिटो र सटिक रूपमा काट्ने विद्युतीय औजार हो, त्यसैले यो सही उत्तर हो। ४. 전기용접기 भनेको वेल्डिङ गर्ने मेसिन हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको ३ नम्बरको 전동커터기 (विद्युतीय कटर) हो।"}, {"n": "260", "q": "일상생활이나 작업 현장에서 사용하고 더 이상 필요하지 않게 된 물질을 말합니다.", "options": ["재활용품", "일회용품", "독성물질", "폐기물"], "answer": 3, "explain": "१. 재활용품 भनेको पुन: प्रयोग गर्ने वस्तु हो, त्यसैले यो मिल्दैन। २. 일회용품 भनेको एक पटक प्रयोग गर्ने वस्तु हो, त्यसैले यो मिल्दैन। ३. 독성물질 भनेको विषालु पदार्थ हो, त्यसैले यो मिल्दैन। ४. 폐기물 भनेको दैनिक जीवन वा काम गर्ने ठाउँमा प्रयोग भएर अब थप आवश्यक नभएको पदार्थ वा फोहरलाई जनाउँछ, त्यसैले यो सही उत्तर हो। सही उत्तर भनेको ४ नम्बरको 폐기물 (फारिएको वस्तु/फोहर) हो। किताबमा तेस्रो विकल्प '독석물질' छापिएको छ; यो छपाइ त्रुटि हो, सही शब्द '독성물질' हो।"}, {"n": "261", "q": "상품이나 서비스를 구매하여 사용하는 사람을 말합니다. 예를 들어 마트에서 물건을 사는 사람이나, 인터넷에서 서비스를 이용하는 사람 모두 이에 해당합니다.", "options": ["학생", "참가자", "소비자", "청년자"], "answer": 2, "explain": "१. 학생 भनेको विद्यार्थी हो, त्यसैले यो मिल्दैन। २. 참가자 भनेको सहभागी हो, त्यसैले यो मिल्दैन। ३. 소비자 भनेको सामान वा सेवा खरिद गरेर प्रयोग गर्ने व्यक्ति हो, त्यसैले यो सही उत्तर हो। ४. 청년자 भनेको युवा भन्ने अर्थ नभएको गलत शब्द हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको ३ नम्बरको 소비자 (उपभोक्ता) हो। चौथो विकल्प '청년자' किताबमा छापिएजस्तै राखिएको छ।"}, {"n": "262", "q": "인터넷을 통해 다양한 사물이 서로 연결되어 정보를 주고받을 수 있는 기술입니다. 이를 통해 집, 자동차, 전자 기기 등을 스마트하게 관리할 수 있습니다.", "options": ["사물인터넷", "인터넷쇼핑", "인터넷 전화", "인터넷 광고"], "answer": 0, "explain": "1. '사물인터넷' भनेको वस्तुहरूको इन्टरनेट प्रविधि हो, जसले सामानहरू आपसमा जोडिएर जानकारी आदानप्रदान गर्न र उपकरणहरूलाई स्मार्ट तरिकाले सञ्चालन गर्न मद्दत गर्छ। 2. '인터넷쇼핑' भनेको इन्टरनेटबाट सामान किन्ने काम हो, त्यसैले यो उपकरणहरू जोड्ने प्रविधिसँग मिल्दैन। 3. '인터넷 전화' भनेको इन्टरनेट फोन हो, त्यसैले यो सम्पूर्ण सामान व्यवस्थापन गर्ने प्रविधिसँग मिल्दैन। 4. '인터넷 광고' भनेको इन्टरनेट विज्ञापन हो, त्यसैले यो विवरणसँग मेल खाँदैन। त्यसैले सही उत्तर 1 नम्बरको '사물인터넷' (वस्तुहरूको इन्टरनेट प्रविधि) हो।"}, {"n": "263", "q": "개인의 취향이나 필요에 따라 특별히 맞춤 제작된 제품이나 서비스를 뜻합니다. 특히 가구나 가전제품은 사용자가 원하는 색상, 기능, 디자인 등을 선택해 자신만의 스타일로 구성할 수 있습니다.", "options": ["비스보크", "전자제품", "키오스크", "무인점"], "answer": 0, "explain": "१. 비스보크 भनेको व्यक्तिको रुचि वा आवश्यकता अनुसार विशेष रूपमा बनाइएको उत्पादन वा सेवा हो, त्यसैले यो सही उत्तर हो। २. 전자제품 भनेको इलेक्ट्रोनिक्स सामान हो, त्यसैले यो मिल्दैन। ३. 키오스크 भनेको किओस्क (स्वयंसेवा मेसिन) हो, त्यसैले यो मिल्दैन। ४. 무인점 भनेको मानिस नभएको पसल हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको १ नम्बरको 비스보크 (बेस्पोक / कस्टम-मेड) हो।"}, {"n": "264", "q": "여러 개의 부품이나 요소를 정해진 순서와 방식에 따라 결합하여 하나의 완성된 구조물이나 제품으로 만드는 과정입니다.", "options": ["조립", "접합", "용접", "계량, 재다"], "answer": 0, "explain": "१. 조립 भनेको धेरै वटा पार्टपुर्जा वा तत्वहरूलाई तोकिएको क्रम र तरिका अनुसार जोडेर एउटा पूर्ण संरचना वा उत्पादन बनाउने प्रक्रिया हो, त्यसैले यो सही उत्तर हो। २. 접합 भनेको जोड्ने काम हो, त्यसैले यो मिल्दैन। ३. 용접 भनेको वेल्डिङ गर्ने काम हो, त्यसैले यो मिल्दैन। ४. 계량, 재다 भनेको नाप्ने काम हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको १ नम्बरको 조립 (जडान / असेंबली) हो। चौथो विकल्प '계량, 재다' किताबमा छापिएजस्तै राखिएको छ।"}, {"n": "265", "q": "철선을 끊거나 구부릴 때 사용하는 두 개의 손잡이가 있는 작은 수공구입니다.", "options": ["망치", "스페너", "펜치", "바이스"], "answer": 2, "explain": "१. 망치 भनेको हथौडा हो, त्यसैले यो मिल्दैन। २. 스페너 भनेको स्प्यानर हो, त्यसैले यो मिल्दैन। ३. 펜치 भनेको फलामको तार काट्न वा बांग्याउन प्रयोग गरिने दुई वटा ह्यान्डल भएको सानो हाते औजार हो, त्यसैले यो सही उत्तर हो। ४. 바이스 भनेको भाइस (पकड्ने औजार) हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको ३ नम्बरको 펜치 (पिनर / प्लायर्स) हो।"}, {"n": "266", "q": "전선이나 작은 부품을 자를 때 사용하는 절단용 수공구로 손잡이가 달린 집게 형태에 있습니다.", "options": ["망치", "니퍼", "펜치", "바이스"], "answer": 1, "explain": "१. 망치 भनेको हथौडा हो, त्यसैले यो मिल्दैन। २. 니퍼 भनेको तार वा साना पार्टपुर्जा काट्न प्रयोग गरिने काट्ने हाते औजार हो जुन ह्यान्डल भएको चिम्टीको आकारमा हुन्छ, त्यसैले यो सही उत्तर हो। ३. 펜치 भनेको पिनर हो, त्यसैले यो मिल्दैन। ४. 바이스 भनेको भाइस हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको २ नम्बरको 니퍼 (निप्पर) हो।"}, {"n": "267", "q": "너트와 볼트를 잡고 조이거나 풀 때 사용하는 특수 모양의 끝이 있는 금속 공구입니다.", "options": ["스패너", "니퍼", "바이스", "펜치"], "answer": 0, "explain": "१. 스패너 भनेको नट र बोल्टलाई समातेर कस्न वा खोल्न प्रयोग गरिने विशेष आकारको मुख भएको धातुको औजार हो, त्यसैले यो सही उत्तर हो। २. 니퍼 भनेको निप्पर हो, त्यसैले यो मिल्दैन। ३. 바이스 भनेको भाइस हो, त्यसैले यो मिल्दैन। ४. 펜치 भनेको पिनर हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको १ नम्बरको 스패너 (स्प्यानर) हो।"}, {"n": "268", "q": "금속이나 전선을 잡아서 구부리거나 펼 때 사용하는 수공구입니다. 보통 집게처럼 생기며, 전기 작업이나 정비 작업에 자주 쓰입니다.", "options": ["바이스", "나사못", "멍키렌치", "플라이어"], "answer": 3, "explain": "१. 바이스 भनेको भाइस हो, त्यसैले यो मिल्दैन। २. 나사못 भनेको स्क्रू हो, त्यसैले यो मिल्दैन। ३. 멍키렌치 भनेको मङ्की रेन्च हो, त्यसैले यो मिल्दैन। ४. 플라이어 भनेको धातु वा तारलाई समातेर बांग्याउन वा फैलाउन प्रयोग गरिने हाते औजार हो, त्यसैले यो सही उत्तर हो। सही उत्तर भनेको ४ नम्बरको 플라이어 (प्लायर्स) हो।"}, {"n": "269", "q": "너트나 볼트 크기에 맞게 입 크기를 조절할 수 있는 렌치입니다. 다양한 크기의 부품을 하나의 도구로 조일 수 있어 매우 실용적입니다.", "options": ["바이스", "토크 렌치", "멍키렌치", "플라이어"], "answer": 2, "explain": "१. 바이스 भनेको भाइस हो, त्यसैले यो मिल्दैन। २. 토크 렌치 भनेको टर्क रेन्च हो, त्यसैले यो मिल्दैन। ३. 멍키렌치 भनेको नट वा बोल्टको साइज अनुसार मुखको आकार समायोजन गर्न सकिने रेन्च हो, त्यसैले यो सही उत्तर हो। ४. 플라이어 भनेको प्लायर्स हो, त्यसैले यो मिल्दैन। सही उत्तर भनेको ३ नम्बरको 멍키렌치 (मङ्की रेन्च / एड्जस्टेबल रेन्च) हो।"}, {"n": "270", "q": "볼트나 너트를 정해진 힘으로 조일 때 사용하는 공구입니다. 길쭉한 손잡이에 눈금이나 디지털 표시가 있으며, 설정한 토크에 도달하면 '딸깍' 소리가 납니다.", "options": ["용접봉", "나사못", "유각 렌치", "토크 렌치"], "answer": 3, "explain": "१. 용접봉 भनेको वेल्डिंग रड हो, त्यसैले यो मिल्दैन। २. 나사못 भनेको स्क्रू हो, त्यसैले यो मिल्दैन। ३. 유각 렌치 भनेको हेक्स रेन्च हो, त्यसैले यो मिल्दैन। ४. 토크 렌치 भनेको बोल्ट वा नटलाई तोकिएको शक्ति (बल) ले कस्न प्रयोग गरिने औजार हो, त्यसैले यो सही उत्तर हो। सही उत्तर भनेको ४ नम्बरको 토크 렌치 (टर्क रेन्च) हो।"}, {"n": "271", "q": "볼트나 나사를 돌릴 때 사용하는 L 자 모양의 공구입니다. 작고 간단한 구조로 기계 조립이나 가구 조립에 자주 쓰입니다.", "options": ["전기 드릴", "판금 가위", "유각 렌치", "파이프 렌치"], "answer": 2, "explain": "1. '전기 드릴' भनेको बिजुलीबाट चल्ने प्वाल पार्ने औजार हो, त्यसैले यो एल-आकारको औजार होइन। 2. '판금 가위' भनेको पाता काट्ने कैँची हो, त्यसैले यो नट-बोल्ट घुमाउने औजार होइन। 3. '유각 렌치' भनेको एल-आकारको हेक्स रेन्च हो, जुन नट वा स्क्रू घुमाउन र फर्निचर वा मेसिन जोड्न प्रयोग गरिन्छ। 4. '파이프 렌치' भनेको पाइप समात्ने र घुमाउने रेन्च हो, त्यसैले यो एल-आकारको सानो औजार होइन। त्यसैले सही उत्तर 3 नम्बरको '유각 렌치' (हेक्स रेन्च) हो।"}, {"n": "272", "q": "점이 없는 나사 모양의 금속 물체로 너트를 사용하여 물건을 고정 시킵니다.", "options": ["볼트", "줄", "비트", "못"], "answer": 0, "explain": "१. 볼트 भनेको टाउकोमा बिन्दु नभएको र नटसँग प्रयोग हुने धातुको वस्तु हो, त्यसैले यो सही उत्तर हो। २. 줄 भनेको फाइल (घोट्ने औजार) हो, त्यसैले यो मिल्दैन। ३. 비트 भनेको ड्रिलको बिट हो, त्यसैले यो मिल्दैन। ४. 못 भनेको किला हो, त्यसैले यो मिल्दैन। सही उत्तर 1 नम्बरको 볼트 हो जसको अर्थ बोल्ट हो।"}, {"n": "273", "q": "머리에는 드라이버로 돌릴 수 있도록 홈이 나 있는 못입니다. 보통 목재나 얇은 금속류 등을 접합시킬 때 사용합니다.", "options": ["용접봉", "나사못", "절곡기", "바이스"], "answer": 1, "explain": "१. 용접봉 भनेको वेल्डिंग रड हो, त्यसैले यो मिल्दैन। २. 나사못 भनेको स्क्रू नट (स्लाट भएको काठ वा धातुमा कस्ने किला) हो, त्यसैले यो सही उत्तर हो। ३. 절곡기 भनेको पाता वा पाना झुकाउने मेसिन हो, त्यसैले यो मिल्दैन। ४. 바이스 भनेको भाइस (पकड्ने औजार) हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 나사못 हो जसको अर्थ स्क्रू हो।"}, {"n": "274", "q": "볼트와 함께 사용되어 부품을 단단히 고정하는 데 쓰입니다. 보통 금속으로 된 육각형 모양이며, 내부에 나사산이 있습니다.", "options": ["토치", "너트", "볼트", "리머"], "answer": 1, "explain": "१. 토치 भनेको टर्च (वेल्डिंग वा तताउने औजार) हो, त्यसैले यो मिल्दैन। २. 너트 भनेको बोल्टसँग प्रयोग हुने छकुने भाग भएको नट हो, त्यसैले यो सही उत्तर हो। ३. 볼트 भनेको बोल्ट हो, त्यसैले यो मिल्दैन। ४. 리머 भनेको प्वाल सफा गर्ने वा बढाउने औजार रीमर हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 너트 हो जसको अर्थ नट हो।"}, {"n": "275", "q": "나사를 조이거나 풀 때 사용하는 수공구입니다. 끝의 모양은 평평하고 마이너스 기호처럼 생기며, 손잡이가 달려 있습니다.", "options": ["일자 드라이버", "십자 드라이버", "금긋기 바늘", "전자 저울"], "answer": 0, "explain": "१. 일자 드라이버 भनेको माइनस (-) चिन्ह जस्तो चप्टो मुख भएको स्क्रू ड्राइभर हो, त्यसैले यो सही उत्तर हो। २. 십자 드라이버 भनेको प्लस (+) चिन्ह जस्तो मुख भएको स्क्रू ड्राइभर हो, त्यसैले यो मिल्दैन। ३. 금긋기 바늘 भनेको रेखा कोर्ने सुई हो, त्यसैले यो मिल्दैन। ४. 전자 저울 भनेको इलेक्ट्रोनिक तराजु हो, त्यसैले यो मिल्दैन। सही उत्तर 1 नम्बरको 일자 드라이버 हो जसको अर्थ फ्ल्याट स्क्रू ड्राइभर हो।"}, {"n": "276", "q": "나사를 조이거나 풀 때 사용하는 공구입니다. 끝이 +자 형태이며, 손잡이가 달린 막대 모양입니다.", "options": ["일자 드라이버", "십자 드라이버", "배식대", "방청지"], "answer": 1, "explain": "१. 일자 드라이버 भनेको माइनस मुख भएको स्क्रू ड्राइभर हो, त्यसैले यो मिल्दैन। २. 십자 드라이버 भनेको प्लस (+) आकारको मुख भएको स्क्रू ड्राइभर हो, त्यसैले यो सही उत्तर हो। ३. 배식대 भनेको खाना वितरण गर्ने टेबल हो, त्यसैले यो मिल्दैन। ४. 방청지 भनेको खिया लाग्नबाट बचाउने कागज हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 십자 드라이버 हो जसको अर्थ फिलिप्स स्क्रू ड्राइभर हो।"}, {"n": "277", "q": "회전하는 부품이 매끄럽게 움직이도록 도와주는 부품입니다. 보통 둥근 링 안에 작은 강철 볼이 들어 있는 원형 모양입니다.", "options": ["바이스", "베어링", "수준기", "플라이어"], "answer": 1, "explain": "१. 바이스 भनेको च्याप्प समात्ने भाइस औजार हो, त्यसैले यो मिल्दैन। २. 베어링 भनेको घुम्ने भागहरू सहजै चल्न मद्दत गर्ने बियरिङ हो, त्यसैले यो सही उत्तर हो। ३. 수준기 भनेको स्पिरिट लेभल (तेर्सो जाँच्ने औजार) हो, त्यसैले यो मिल्दैन। ४. 플라이어 भनेको प्लायर्स हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 베어링 हो जसको अर्थ बियरिङ हो।"}, {"n": "278", "q": "회전력을 전달하거나 속도와 방향을 조절할 때 사용하는 부품입니다. 테두리에 톱니가 있는 둥근 모양입니다.", "options": ["줄", "톱", "기어", "축"], "answer": 2, "explain": "१. 줄 भनेको फाइल (घोट्ने औजार) हो, त्यसैले यो मिल्दैन। २. 톱 भनेको आरा हो, त्यसैले यो मिल्दैन। ३. 기어 भनेको दाँत भएको गोलो आकारको गिअर हो जसले शक्ति र गति सार्छ, त्यसैले यो सही उत्तर हो। ४. 축 भनेको अक्ष (साफ्ट) हो, त्यसैले यो मिल्दैन। सही उत्तर 3 नम्बरको 기어 हो जसको अर्थ गिअर हो।"}, {"n": "279", "q": "충격을 줄이거나 힘을 저장하는 데 쓰는 나선 모양으로 감긴 탄성 있는 금속입니다.", "options": ["접시 저울", "일자 드라이버", "코일 스프링", "유각 렌치"], "answer": 2, "explain": "1. '접시 저울' भनेको थाल भएको तराजु हो, त्यसैले यो लचकदार घुमाउरो धातु होइन। 2. '일자 드라이버' भनेको माइनस पेचकस हो, त्यसैले यो धक्का सोस्ने स्प्रिङ होइन। 3. '코일 스프링' भनेको घुमाउरो बेरिएको स्प्रिङ हो, जसले धक्का कम गर्न र शक्ति सञ्चय गर्न काम गर्छ। 4. '유각 렌치' भनेको एल-आकारको रेन्च हो, त्यसैले यो स्प्रिङसँग मिल्दैन। त्यसैले सही उत्तर 3 नम्बरको '코일 스프링' (घुमाउरो स्प्रिङ) हो।"}, {"n": "280", "q": "기계 부품을 안전하고 쉽게 빼낼 때 사용하는 도구로, 유압의 힘을 이용해 베어링이나 기어 등을 분해합니다. 세 개의 갈고리와 손잡이 레버가 달려 있어 작동이 간편합니다.", "options": ["기어", "너트", "볼트", "풀러"], "answer": 3, "explain": "१. 기어 भनेको गिअर हो, त्यसैले यो मिल्दैन। २. 너트 भनेको नट हो, त्यसैले यो मिल्दैन। ३. 볼트 भनेको बोल्ट हो, त्यसैले यो मिल्दैन। ४. 풀러 भनेको बियरिङ वा गिअर सजिलै झिक्ने पुलर औजार हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको 풀러 हो जसको अर्थ पुलर हो।"}, {"n": "281", "q": "바닥이나 물건이 평평한지 또는 곧은지 보는 도구입니다. 안에 있는 작은 물방울이 가운데에 오면 수평이나 수직이 맞습니다.", "options": ["바이스", "베어링", "나사못", "수준기"], "answer": 3, "explain": "१. 바이스 भनेको भाइस हो, त्यसैले यो मिल्दैन। २. 베어링 भनेको बियरिङ हो, त्यसैले यो मिल्दैन। ३. 나사못 भनेको स्क्रू हो, त्यसैले यो मिल्दैन। ४. 수준기 भनेको सतह मिलेको नमिलेको जाँच्ने स्पिरिट लेभल हो, त्यसैले यो सही उत्तर हो। सही उत्तर 4 नम्बरको 수준기 हो जसको अर्थ स्पिरिट लेभल हो।"}, {"n": "282", "q": "쇠붙이(철)를 끌어당기는 도구입니다. 이것을 가까이 대면 못이나 클립 같은 쇠가 붙습니다.", "options": ["펜치", "망치", "자석", "자재"], "answer": 2, "explain": "१. 펜치 भनेको चिम्टा वा प्लायर्स हो, त्यसैले यो मिल्दैन। २. 망치 भनेको हथौडा हो, त्यसैले यो मिल्दैन। ३. 자석 भनेको फलाम तान्ने चुम्बक हो, त्यसैले यो सही उत्तर हो। ४. 자재 भनेको निर्माण सामग्री हो, त्यसैले यो मिल्दैन। सही उत्तर 3 नम्बरको 자석 हो जसको अर्थ म्याग्नेट (चुम्बक) हो।"}, {"n": "283", "q": "물체가 돌 때 중심이 되는 선이나 막대입니다. 바퀴나 선풍기처럼 도는 물건은 이것을 중심으로 돕니다.", "options": ["축", "줄", "톱", "칼"], "answer": 0, "explain": "१. 축 भनेको कुनै वस्तु घुम्दा केन्द्र हुने अक्ष वा साफ्ट हो, त्यसैले यो सही उत्तर हो। २. 줄 भनेको फाइल हो, त्यसैले यो मिल्दैन। ३. 톱 भनेको आरा हो, त्यसैले यो मिल्दैन। ४. 칼 भनेको चक्कु हो, त्यसैले यो मिल्दैन। सही उत्तर 1 नम्बरको 축 हो जसको अर्थ साफ्ट वा अक्ष हो।"}, {"n": "284", "q": "환경을 덜 오염시키는 자동차로 보통 전기차, 수소차, 하 이브리드차가 있습니다. 매연이 적거나 없어서 공기를 깨끗하게 합니다.", "options": ["친환경 자동차", "친환경 에너지", "친환경 건물", "친환경 농업"], "answer": 0, "explain": "१. 친환경 자동차 भनेको वातावरणमैत्री गाडी (विद्युतीय वा हाइड्रोजन गाडी) हो, त्यसैले यो सही उत्तर हो। २. 친환경 에너지 भनेको वातावरणमैत्री ऊर्जा हो, त्यसैले यो मिल्दैन। ३. 친환경 건물 भनेको वातावरणमैत्री भवन हो, त्यसैले यो मिल्दैन। ४. 친환경 농업 भनेको वातावरणमैत्री कृषि हो, त्यसैले यो मिल्दैन। सही उत्तर 1 नम्बरको 친환경 자동차 हो जसको अर्थ वातावरणमैत्री गाडी हो।"}, {"n": "285", "q": "쇠, 철 따위를 자르거나, 깎거나, 모양을 바꾸는 일을 의미하며 이렇게 해서 기계 부품이나 물건을 만듭니다.", "options": ["금속 염색", "금속 가공", "금속 판매", "금속 채굴"], "answer": 1, "explain": "१. 금속 염색 भनेको धातु रङ्गाउने काम हो, त्यसैले यो मिल्दैन। २. 금속 가공 भनेको धातुलाई काटेर, कुटेर वा आकार दिएर वस्तु बनाउने मेटल प्रोसेसिङ (धातु प्रशोधन) हो, त्यसैले यो सही उत्तर हो। ३. 금속 판매 भनेको धातु बिक्री गर्ने काम हो, त्यसैले यो मिल्दैन। ४. 금속 채굴 भनेको धातु खानीबाट निकाल्ने काम हो, त्यसैले यो मिल्दैन। सही उत्तर 2 नम्बरको 금속 가공 हो जसको अर्थ धातु प्रशोधन हो।"}, {"n": "286", "q": "무언가를 두드리거나 박을 때 쓰는 도구로 보통 손잡이가 있고, 끝에 무거운 쇠 부분이 있습니다.", "options": ["펜치", "드릴", "망치", "볼트"], "answer": 2, "explain": "पहिलो विकल्पको अर्थ 펜치 (पेन्च) हो, यो तार काट्न वा समात्न प्रयोग गरिन्छ तर यसमा हत्था र भारी फलामको भाग हुँदैन त्यसैले यो मिल्दैन। दोस्रो विकल्पको अर्थ 드릴 (ड्रिल) हो, यो प्वाल पार्ने औजार हो त्यसैले यो मिल्दैन। तेस्रो विकल्पको अर्थ 망치 (हथौडा) हो, यो कुनै वस्तु ठोक्न वा गाड्न प्रयोग गरिने हत्था भएको र छेउमा भारी फलामको भाग भएको औजार हो त्यसैले यो सही उत्तर हो। चौथो विकल्पको अर्थ 볼트 (बोल्ट) हो, यो कस्ने वस्तु हो त्यसैले यो मिल्दैन। अन्त्यमा, सही उत्तर 망치 हो जसको अर्थ हथौडा हुन्छ।"}, {"n": "287", "q": "금속이나 나무 등을 갈아서 모양을 다듬는 도구인데 작고 거친 날이 있어서 표면을 매끄럽게 만들거나 깎을 때 씁니다.", "options": ["칼", "축", "줄", "톱"], "answer": 2, "explain": "1. 칼 भनेको चाकु हो, यसले काट्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। 2. 축 भनेको धुरी हो, यसले घुम्ने भागलाई अड्याउँछ त्यसैले यो विवरणसँग मिल्दैन। 3. 줄 भनेको रेती हो, यसले धातु वा काठलाई घसेर चिल्लो बनाउने वा आकार मिलाउने औजार भएकाले यो विवरणसँग एकदम मिल्छ। 4. 톱 भनेको करौँती हो, यसले काठ वा धातु काट्ने काम गर्छ त्यसैले यो विवरणसँग मिल्दैन। त्यसैले सही उत्तर 3 नम्बरको 줄 हो, जसको अर्थ रेती हुन्छ।"}, {"n": "288", "q": "돌이나 쇠를 깎거나 깨뜨릴 때 쓰는 뾰족한 쇠 도구입니다. 보통 망치로 정을 쳐서 금속이나 돌을 자르거나 구멍을 낼 때 사용해요.", "options": ["축", "톱", "못", "정"], "answer": 3, "explain": "पहिलो विकल्पको अर्थ 축 (अक्स) हो, यो मिल्दैन। दोस्रो विकल्पको अर्थ 톱 (आरा) हो, यो काठ काट्ने औजार हो त्यसैले यो मिल्दैन। तेस्रो विकल्पको अर्थ 못 (किला) हो, यो ठोक्ने वस्तु हो त्यसैले यो मिल्दैन। चौथो विकल्पको अर्थ 정 (छिनो) हो, यो ढुङ्गा वा फलाम काट्न वा फुटाउन प्रयोग हुने तिखो फलामको औजार हो जसलाई हथौडाले हानेर प्रयोग गरिन्छ त्यसैले यो सही उत्तर हो। अन्त्यमा, सही उत्तर 정 हो जसको अर्थ छिनो हुन्छ।"}, {"n": "289", "q": "구멍을 넓히거나 매끄럽게 다듬는 도구로 보통 기계 부품에 뚫린 구멍을 정확한 크기와 모양으로 정리할 때 사용합니다.", "options": ["쇠톱", "너트", "니퍼", "리머"], "answer": 3, "explain": "पहिलो विकल्पको अर्थ 쇠톱 (ह्याकस’) हो, यो फलाम काट्ने आरा हो त्यसैले यो मिल्दैन। दोस्रो विकल्पको अर्थ 너트 (नट) हो, यो बोल्टसँग कस्ने वस्तु हो त्यसैले यो मिल्दैन। तेस्रो विकल्पको अर्थ 니퍼 (निप्पर) हो, यो तार काट्ने चिम्टाजस्तो औजार हो त्यसैले यो मिल्दैन। चौथो विकल्पको अर्थ 리머 (रीमर) हो, यो प्वाललाई फराकिलो वा चिल्लो पार्न मेसिनको भागमा प्रयोग गरिने औजार हो त्यसैले यो सही उत्तर हो। अन्त्यमा, सही उत्तर 리머 हो जसको अर्थ रीमर हुन्छ।"}, {"n": "290", "q": "함께 움직일 수 있는 두 개의 금속 블록이 있는 공구, 작업이 완료되는 동안 물건을 단단히 고정할 때 사용됩니다.", "options": ["바이스", "망치", "쇠지래", "괭이"], "answer": 0, "explain": "पहिलो विकल्पको अर्थ 바이스 (भाइस) हो, यो सँगै चल्न सक्ने दुईवटा फलामको ब्लक हुने र काम गर्ने बेला वस्तुलाई दह्रोसँग च्यापेर राख्ने औजार हो त्यसैले यो सही उत्तर हो। दोस्रो विकल्पको अर्थ 망치 (हथौडा) हो, यो ठोक्ने औजार हो त्यसैले यो मिल्दैन। तेस्रो विकल्पको अर्थ 쇠지래 (फलामको लिभर) हो, यो उचाल्ने वा भत्काउने औजार हो त्यसैले यो मिल्दैन। चौथो विकल्पको अर्थ 괭이 (कुटो) हो, यो खन्ने कृषियन्त्र हो त्यसैले यो मिल्दैन। अन्त्यमा, सही उत्तर 바이스 हो जसको अर्थ भाइस हुन्छ। तेस्रो विकल्प '쇠지래' किताबमा छापिएजस्तै राखिएको छ।"}, {"n": "291", "q": "두꺼운 금속판을 자를 때 사용하는 특수한 가위입니다. 강한 날카로운 칼날로 금속을 정확하게 자를 수 있습니다.", "options": ["용접봉", "유각 렌치", "전기 절단기", "판금 가위"], "answer": 3, "explain": "पहिलो विकल्पको अर्थ 용접봉 (वेल्डिंग रड) हो, यो वेल्डिंग गर्दा प्रयोग हुने छड हो त्यसैले यो मिल्दैन। दोस्रो विकल्पको अर्थ 유각 렌치 (हेक्स रेन्च) हो, यो बोल्ट कस्ने औजार हो त्यसैले यो मिल्दैन। तेस्रो विकल्पको अर्थ 전기 절단기 (विद्युतीय काट्ने मेसिन) हो, यो समग्रमा काट्ने मेसिन हो त्यसैले यो मिल्दैन। चौथो विकल्पको अर्थ 판금 가위 (पाना काट्ने काइँची/मेटल शियर) हो, यो बाक्लो फलामको पट्टा वा पाना काट्न प्रयोग हुने धारिलो विशेष किसिमको काइँची हो त्यसैले यो सही उत्तर हो। अन्त्यमा, सही उत्तर 판금 가위 हो जसको अर्थ पाना काट्ने काइँची हुन्छ।"}, {"n": "292", "q": "나무나 금속 재료를 일정한 사이즈나 두께의 조각으로 자르는 장치입니다.", "options": ["밴딩기", "절단기", "용접기", "정수기"], "answer": 1, "explain": "पहिलो विकल्पको अर्थ 밴딩기 (बेन्डिङ मेसिन) हो, यो बेन्ड गर्ने मेसिन हो त्यसैले यो मिल्दैन। दोस्रो विकल्पको अर्थ 절단기 (कटर/काट्ने मेसिन) हो, यो काठ वा धातुका सामाग्रीलाई निश्चित साइज वा मोटाइको टुक्रामा काट्ने मेसिन वा उपकरण हो त्यसैले यो सही उत्तर हो। तेस्रो विकल्पको अर्थ 용접기 (वेल्डिंग मेसिन) हो, यो जोड्ने मेसिन हो त्यसैले यो मिल्दैन। चौथो विकल्पको अर्थ 정수기 (पानी शुद्ध पार्ने मेसिन) हो, यो पिउने पानी सफा गर्ने मेसिन हो त्यसैले यो मिल्दैन। अन्त्यमा, सही उत्तर 절단기 हो जसको अर्थ काट्ने मेसिन हुन्छ।"}, {"n": "293", "q": "집이나 사무실에서 빗자루를 사용하여 먼지나 쓰레기를 쓸어 담는 도구입니다.", "options": ["먼지털이", "쓰레받기", "청소함", "공구함"], "answer": 1, "explain": "पहिलो विकल्पको अर्थ 먼지털이 (धुलो टार्ने कुचो) हो, यो धुलो टार्ने साधन हो त्यसैले यो मिल्दैन। दोस्रो विकल्पको अर्थ 쓰레받기 (डस्टबिन/फोहोर उठ्ने सूप) हो, यो घर वा कार्यालयमा कुचो प्रयोग गरेर धुलो वा फोहोर बटुलि राख्ने वा उठाउने औजार हो त्यसैले यो सही उत्तर हो। तेस्रो विकल्पको अर्थ 청소함 (सरसफाइ बाकस) हो, यो सरसफाइका सामान राख्ने ठाउँ हो त्यसैले यो मिल्दैन। चौथो विकल्पको अर्थ 공구함 (औजार बाकस) हो, यो औजार राख्ने बक्स हो त्यसैले यो मिल्दैन। अन्त्यमा, सही उत्तर 쓰레받기 हो जसको अर्थ फोहोर उठ्ने सूप हुन्छ।"}, {"n": "294", "q": "화재 발생시 손으로 들고 가서 불을 끌 수 있는 이동식 도구입니다. 대개 복도나 작업장 벽에 둡니다.", "options": ["구급함", "공구함", "소화기", "소화전"], "answer": 2, "explain": "पहिलो विकल्पको अर्थ 구급함 (औषधि बाकस) हो, यो प्राथमिक उपचारको बक्स हो त्यसैले यो मिल्दैन। दोस्रो विकल्पको अर्थ 공구함 (औजार बाकस) हो, यो औजार राख्ने बक्स हो त्यसैले यो मिल्दैन। तेस्रो विकल्पको अर्थ 소화기 (अग्नििनवारक यन्त्र) हो, यो आगलागी हुँदा हातले समातेर आगो निभाउन लैजान सकिने र करिडोर वा कार्यक्षेत्रको भित्तामा राखिने मोबाइल उपकरण हो त्यसैले यो सही उत्तर हो। चौथो विकल्पको अर्थ 소화전 (फायर हाइड्रन्ट) हो, यो भित्तामा जडान गरिएको पानी आउने धारा हो त्यसैले यो मिल्दैन। अन्त्यमा, सही उत्तर 소화기 हो जसको अर्थ अग्निनवारक यन्त्र हुन्छ।"}, {"n": "295", "q": "기계나 장비의 작동 상태를 바꾸거나 맞추는 장치입니다. 예를 들어, 용접에서는 전류나 압력을 알맞게 설정하는 데 사용됩니다.", "options": ["세탁기", "계산기", "조절기", "소화기"], "answer": 2, "explain": "पहिलो विकल्पको अर्थ 세탁기 (वाशिङ मेसिन) हो, यो लुगा धुने मेसिन हो त्यसैले यो मिल्दैन। दोस्रो विकल्पको अर्थ 계산기 (क्यालकुलेटर) हो, यो हिसाब गर्ने यन्त्र हो त्यसैले यो मिल्दैन। तेस्रो विकल्पको अर्थ 조절기 (कन्ट्रोलर/नियन्त्रक) हो, यो मेसिन वा उपकरणको सञ्चालन अवस्था परिवर्तन वा मिलाउने यन्त्र हो जसले करेन्ट वा चाप मिलाउन मद्दत गर्छ त्यसैले यो सही उत्तर हो। चौथो विकल्पको अर्थ 소화기 (अग्निनवारक यन्त्र) हो, यो आगो निभाउने यन्त्र हो त्यसैले यो मिल्दैन। अन्त्यमा, सही उत्तर 조절기 हो जसको अर्थ नियन्त्रक हुन्छ।"}, {"n": "296", "q": "금속, 돌, 나무 등의 재료를 갈거나 자르는 데 사용하는 전동 공구입니다. 주로 표면을 매끄럽게 하거나 불필요한 부분을 제거할 때 쓰입니다.", "options": ["절단기", "그라인더", "용접기", "밴딩기"], "answer": 1, "explain": "पहिलो विकल्पको अर्थ 절단기 (कटर) हो, यो काट्ने मेसिन हो त्यसैले यो मिल्दैन। दोस्रो विकल्पको अर्थ 그라인더 (ग्राइन्डर) हो, यो धातु, ढुङ्गा, काठ आदि सामाग्री घोट्न वा काट्न प्रयोग हुने तथा सतह चिल्लो पार्न वा अनावश्यक भाग हटाउन प्रयोग हुने विद्युतीय औजार हो त्यसैले यो सही उत्तर हो। तेस्रो विकल्पको अर्थ 용접기 (वेल्डिंग मेसिन) हो, यो जोड्ने मेसिन हो त्यसैले यो मिल्दैन। चौथो विकल्पको अर्थ 밴딩기 (बेन्डिङ मेसिन) हो, यो बेन्ड गर्ने मेसिन हो त्यसैले यो मिल्दैन। अन्त्यमा, सही उत्तर 그라인더 हो जसको अर्थ ग्राइन्डर हुन्छ।"}, {"n": "297", "q": "품질에 문제가 있어 정상적으로 사용할 수 없는 제품을 생산되는 것을 말합니다.", "options": ["원재료", "불량품", "식료품", "생필품"], "answer": 1, "explain": "1. 원재료 भनेको काँचो पदार्थ हो, यो सामान बनाउन प्रयोग गरिने सामग्री हो त्यसैले यो विवरणसँग मिल्दैन। 2. 불량품 भनेको खराब सामान हो, गुणस्तरमा समस्या भएर प्रयोग गर्न नसकिने उत्पादन भएकाले यो विवरणसँग एकदम मिल्छ। 3. 식료품 भनेको खाद्यान्न सामग्री हो, यो खानेकुरा हो त्यसैले यो विवरणसँग मिल्दैन। 4. 생필품 भनेको दैनिक उपभोग्य वस्तु हो, त्यसैले यो विवरणसँग मिल्दैन। त्यसैले सही उत्तर 2 नम्बरको 불량품 हो, जसको अर्थ खराब सामान हुन्छ।"}, {"n": "298", "q": "제품이나 물건을 만들기 위해 처음에 사용하는 가공되지 않은 기본 재료입니다.", "options": ["원재료", "수준기", "참기름", "밀가루"], "answer": 0, "explain": "1. 원재료 भनेको काँचो पदार्थ हो, यो सामान वा वस्तु बनाउन प्रयोग गरिने आधारभूत सामग्री भएकाले यो विवरणसँग एकदम मिल्छ। 2. 수준기 भनेको सतह तेर्सो छ कि छैन नाप्ने औजार हो, त्यसैले यो विवरणसँग मिल्दैन। 3. 참기름 भनेको तिलको तेल हो, यो खानेकुरा पकाउन प्रयोग गरिने तेल हो त्यसैले यो विवरणसँग मिल्दैन। 4. 밀가루 भनेको गहुँको पिठो हो, यो एउटा खानेकुरा बनाउने सामग्री हो त्यसैले यो विवरणसँग मिल्दैन। त्यसैले सही उत्तर 1 नम्बरको 원재료 हो, जसको अर्थ काँचो पदार्थ हुन्छ।"}, {"n": "299", "q": "제품을 만들 때 기능을 더하거나 성질을 개선하기 위해 소량 넣는 물질입니다.", "options": ["불량품", "용접봉", "첨가제", "고추장"], "answer": 2, "explain": "1. 불량품 भनेको खराब सामान हो, बिग्रेको उत्पादनलाई बुझाउने भएकाले यो विवरणसँग मिल्दैन। 2. 용접봉 भनेको वेल्डिङ रड हो, धातु जोड्न प्रयोग गरिने भएकाले यो विवरणसँग मिल्दैन। 3. 첨가제 भनेको थपिने पदार्थ हो, वस्तुको गुणस्तर वा कार्य सुधार्न थोरै मिसाइने पदार्थ भएकाले यो विवरणसँग एकदम मिल्छ। 4. 고추장 भनेको खुर्सानीको पेस्ट हो, यो खानेकुरामा हालिने कोरियाली लेदो हो त्यसैले यो विवरणसँग मिल्दैन। त्यसैले सही उत्तर 3 नम्बरको 첨가제 हो, जसको अर्थ थपिने पदार्थ हुन्छ।"}, {"n": "300", "q": "두 가지 이상의 재료를 고르게 섞는 데 사용하는 기계나 장치입니다. 예를 들어, 원재료와 첨가제를 섞어 균일한 혼합물을 만들 때 사용됩니다.", "options": ["청소기", "계산기", "용접기", "혼합기"], "answer": 3, "explain": "पहिलो विकल्पको अर्थ 청소기 (भ्याकुम क्लिनर) हो, यो सरसफाइ गर्ने मेसिन हो त्यसैले यो मिल्दैन। दोस्रो विकल्पको अर्थ 계산기 (क्यालकुलेटर) हो, यो हिसाब गर्ने यन्त्र हो त्यसैले यो मिल्दैन। तेस्रो विकल्पको अर्थ 용접기 (वेल्डिंग मेसिन) हो, यो वेल्डिंग गर्ने मेसिन हो त्यसैले यो मिल्दैन। चौथो विकल्पको अर्थ 혼합기 (मिक्सर/मिश्रण गर्ने मेसिन) हो, यो दुई वा बढी सामाग्रीलाई एकनासले मिसाउन प्रयोग गरिने मेसिन वा उपकरण हो जस्तै कच्चा पदार्थ र एडिटीभ मिसाएर एक
