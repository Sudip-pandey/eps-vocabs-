<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<title>EPS-TOPIK Vocabulary Quiz — 520 Questions</title>
<style>
  :root {
    --primary: #a78bfa;
    --primary-dark: #c4b5fd;
    --primary-soft: rgba(124,58,237,.22);
    --accent: #6366f1;
    --accent-soft: rgba(99,102,241,.18);
    --green: #34d399;
    --green-bg: rgba(16,185,129,.16);
    --red: #fb7185;
    --red-bg: rgba(244,63,94,.14);
    --bg: #0b0b16;
    --card: #171725;
    --text: #f2f1fa;
    --muted: #9d9db4;
    --border: rgba(255,255,255,.09);
    --shadow: 0 2px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans KR", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(700px 340px at 50% -5%, rgba(99,102,241,.14), transparent 60%); background-attachment: fixed; color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); color: #d6c9ff; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,.12); margin-bottom: 14px; transition: all .15s; }
  .back-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  header { background: #312e81; color: #fff; padding: 20px 16px 16px; position: relative; border-bottom: 1px solid rgba(255,255,255,.1); box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.4rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  header p { opacity: .92; font-size: .9rem; margin-top: 4px; }
  .progress-wrap { margin-top: 14px; background: rgba(0,0,0,.35); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .progress-bar { height: 100%; background: #a5b4fc; width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(165,180,252,.6); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { position: relative; background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; background: #6366f1; border-radius: 0 0 6px 6px; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: rgba(167,139,250,.55); }
  .q-card.answered::after { content: "✓"; position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: #059669; color: #fff; font-weight: 800; font-size: .95rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .q-num { display: inline-block; font-size: .92rem; font-weight: 800; color: #fff; background: #4f46e5; padding: 7px 18px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(79,70,229,.4); }
  .q-text { font-size: 1.16rem; white-space: pre-line; margin: 14px 0 18px; line-height: 1.85; font-weight: 500; color: #f2f1fa; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 16px 18px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid rgba(255,255,255,.09); border-radius: 14px; margin-bottom: 0; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #1e1e30; color: #f2f1fa; }
  .options label:hover { border-color: #8b5cf6; background: #232338; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,.3); }
  .options label::before { content: ""; flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid #7c7ca0; background: transparent; transition: all .15s; }
  .options label.selected { background: var(--accent-soft); border-color: #a78bfa; box-shadow: 0 4px 18px rgba(99,102,241,.4); }
  .options label.selected::before { border-color: #a78bfa; background: #a78bfa; box-shadow: inset 0 0 0 4px #1e1e30; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #a5b4fc; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }
  .pager .page-info { font-weight: 700; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .btn-primary { background: #4f46e5; color: #fff; box-shadow: 0 4px 18px rgba(79,70,229,.4); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 8px 24px rgba(79,70,229,.45); }
  .btn-primary:disabled { background: #2a2a3d; color: #77778e; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: rgba(255,255,255,.06); color: #d6c9ff; border: 2px solid rgba(255,255,255,.12); }
  .btn-ghost:hover { border-color: #8b5cf6; background: rgba(124,58,237,.2); }
  .submit-bar { position: sticky; bottom: 0; background: rgba(11,11,22,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 24px rgba(0,0,0,.5); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }
  /* Results */
  .score-card { background: #1e1b3a; border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; line-height: 1.05; color: #a5b4fc; }
  .score-card .pct { font-size: 1.15rem; color: #c9c6e0; margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: #e6e4f5; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: #4f46e5; color: #fff; border-color: transparent; box-shadow: 0 2px 12px rgba(79,70,229,.35); }
  .review-card { background: #1a1a2c; border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: #059669; }
  .verdict.no { background: #e11d48; }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; background: #1e1e30; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #12101f; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; color: #d9d7ea; }
  .explain b { color: #d6c9ff; }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; }
  .explain-stem { background: rgba(99,102,241,.18); border-left: 4px solid #a78bfa; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; color: #f2f1fa; }
  .exp-line { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.07); line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: #34d399; }
  .exp-mark.no { color: #fb7185; }
  .exp-note { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.4); border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; color: #fde9c8; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }

</style>
</head>
<body>
<header>
  <div class="header-inner">
    
    <h1>EPS-TOPIK 문제은행 Quiz</h1>
    <p>520 questions &bull; EPS-TOPIK Vocabulary &mdash; choose the word matching the description &bull; Answers are AI-generated (the book has no answer key) &mdash; check with a teacher &bull; Explanations in Nepali</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">0 / 520 answered</div>
    <div class="autosave-note">Progress will be auto-saved.</div>
  </div>
</header>

<main id="quizView">
  <div id="questionList"></div>
  <div class="pager">
    <button class="btn-ghost" id="prevBtn">&larr; Previous</button>
    <span class="page-info" id="pageInfo"></span>
    <button class="btn-ghost" id="nextBtn">Next &rarr;</button>
  </div>
</main>

<div class="submit-bar" id="submitBar">
  <div class="inner">
    <span class="hint" id="submitHint">Answer all 520, then submit.</span>
    <div style="display:flex; gap:8px; flex:none;">
      <button class="btn-ghost" id="clearBtn" style="padding:11px 16px;">Clear all</button>
      <button class="btn-primary" id="submitBtn">Submit Quiz</button>
    </div>
  </div>
</div>

<main id="resultView" class="hidden">
  <div class="score-card">
    <div class="big" id="scoreBig"></div>
    <div class="pct" id="scorePct"></div>
    <div class="msg" id="scoreMsg"></div>
    <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-primary" id="retryBtn">Try Again</button>
      <button class="btn-ghost" id="reviewTopBtn">Back to top</button>
    </div>
  </div>
  <div class="filters">
    <button class="btn-ghost active" data-filter="all">All questions</button>
    <button class="btn-ghost" data-filter="wrong">Wrong only</button>
    <button class="btn-ghost" data-filter="correct">Correct only</button>
  </div>
  <div id="reviewList"></div>
</main>

ाछा समात्ने र बिक्री गरेर जीवन चलाउने व्यक्तिलाई यसले बुझाउँछ।\n① 어부 भनेको माछा मार्ने मानिस हो, जसले समुद्र वा नदीमा माछा समातेर जीविकोपार्जन गर्छ र प्रश्नसँग मिल्छ। ✓\n② 목수 भनेको सिकर्मी हो, यो माछा मार्ने व्यक्ति होइन। ✗\n③ 선수 भनेको खेलाडी हो, यो माछा मार्ने पेसा होइन। ✗\n④ 주부 भनेको गृहणी हो, यो माछा मार्ने कामसँग सम्बन्धित छैन। ✗"}, {"n": "19", "q": "금속을 녹여서 이어 붙이는 작업을 하는 사람을 의미합니다. 주로 건설 현장이나 공장에서 금속 구조물을 만들거나 수리하는 역할을 합니다.", "options": ["경찰관", "소방관", "용접공", "벽돌공"], "answer": 2, "explain": "प्रश्नको अर्थ: फलाम वा धातुका टुक्राहरूलाई पगालेर जोड्ने र बनाउने काम गर्ने व्यक्तिलाई यसले जनाउँछ।\n① 경찰관 को अर्थ प्रहरी हो, यो धातु जोड्ने काम गर्ने मानिससँग मिल्दैन त्यसैले यो मिलेन। ✗\n② 소방관 को अर्थ दमकलकर्मी हो, यो वेल्डिङ गर्ने कामसँग सम्बन्धित छैन त्यसैले यो मिलेन। ✗\n③ 용접공 को अर्थ वेल्डर वा डकर्मी (धातु जोड्ने काम गर्ने मिस्त्री) हो, जसले धातु पगालेर जोड्ने काम गर्छ ✓\n④ 벽돌공 को अर्थ इँटा लगाउने कामदार हो, यो धातुको काम गर्ने मानिस होइन त्यसैले यो मिलेन। ✗"}, {"n": "20", "q": "특정 스포츠나 경기에서 전문적으로 활동하는 사람을 의미합니다. 주로 팀이나 개인의 일원으로 경기에 참가하며, 뛰어난 실력을 가진 사람을 가리킵니다.", "options": ["의사", "선수", "가수", "어부"], "answer": 1, "explain": "प्रश्नको अर्थ: खेलकुद प्रतियोगितामा भाग लिएर आफ्नो सीप देखाउने मानिसलाई यसले बुझाउँछ।\n① 의사 को अर्थ डाक्टर हो, यो खेलकुद क्षेत्रको व्यक्तिसँग मिल्दैन त्यसैले यो मिलेन। ✗\n② 선수 को अर्थ खेलाडी हो, जसले खेलकुदमा पेशेवर रूपमा भाग लिन्छ ✓\n③ 가수 को अर्थ गायक हो, यो खेलकुद क्षेत्रसँग सम्बन्धित छैन त्यसैले यो मिलेन। ✗\n④ 어부 को अर्थ माछा मार्ने मानिस हो, यो खेलाडीसँग मिल्दैन त्यसैले यो मिलेन। ✗"}, {"n": "21", "q": "뉴스나 정보를 수집하고, 이를 작성하여 대중에게 전달하는 일을 하는 사람으로 신문, 방송, 인터넷 등 다양한 매체를 통해 사건, 사고, 사회적 이슈 등을 보도합니다.", "options": ["어부", "기자", "목수", "교사"], "answer": 1, "explain": "प्रश्नको अर्थ: यस विवरणले समाचार र घटनाहरूको जानकारी सङ्कलन गरेर पत्रपत्रिका वा टेलिभिजनमार्फत मानिसहरूसम्म पुर्‍याउने काम गर्ने व्यक्तिको बारेमा बताएको छ। यो सञ्चार क्षेत्रमा काम गर्ने पेसा हो।\n① 어부 को अर्थ माछा मार्ने मानिस हो, यो समाचार संकलन गर्ने व्यक्तिसँग मिल्दैन त्यसैले यो मिलेन। ✗\n② 기자 को अर्थ पत्रकार हो, जसले समाचार र सूचना संकलन गरेर जनतालाई जानकारी दिन्छ ✓\n③ 목수 को अर्थ काठको काम गर्ने मानिस हो, यो पत्रकार होइन त्यसैले यो मिलेन। ✗\n④ 교사 को अर्थ शिक्षक हो, यो समाचार माध्यमसँग सम्बन्धित छैन त्यसैले यो मिलेन। ✗"}, {"n": "22", "q": "보통 사람이 속한 나라를 의미하며 어떤 국가의 시민권을 가진 상태를 가리킵니다.", "options": ["신분증", "명칭", "성명", "국적"], "answer": 3, "explain": "प्रश्नको अर्थ: यसले कुनै व्यक्ति कुन देशको नागरिक हो भन्ने पहिचान वा कानुनी अधिकारलाई बुझाउँछ। यो मानिस कुन राष्ट्रसँग सम्बन्धित छ भन्ने कुरा हो।\n① 신분증 भनेको परिचय पत्र हो, यो देशको नागरिकताको अवस्था होइन। ✗\n② 명칭 भनेको नाम वा शीर्षक हो, यो नागरिकतासँग सम्बन्धित छैन। ✗\n③ 성명 भनेको पूरा नाम हो, यो नागरिकताको स्थिति होइन। ✗\n④ 국적 भनेको राष्ट्रियता हो, जसले व्यक्ति कुन देशको नागरिक हो भन्ने जनाउँछ र प्रश्नसँग मिल्छ। ✓"}, {"n": "23", "q": "대화나 행동을 하는 동안 함께 있는 사람을 의미합니다. 보통 대화나 논쟁, 경기 등에서 자신과 반대되는 사람을 가리킬 때 사용됩니다.", "options": ["친척", "도우미", "상대방", "룸메이트"], "answer": 2, "explain": "प्रश्नको अर्थ: यस विवरणले कुराकानी गर्दा, खेल खेल्दा वा काम गर्दा आफ्नो अगाडि हुने वा प्रतिस्पर्धा गर्ने मानिसलाई बुझाउँछ। यो आफूसँग दोहोरो संवाद गर्ने व्यक्ति हो।\n① 친척 को अर्थ नातेदार वा आफन्त हो, यो कुराकानी वा खेलमा विरोधी पक्षसँग मिल्दैन त्यसैले यो मिलेन। ✗\n② 도우미 को अर्थ सहयोगी हो, यो विपक्षी व्यक्ति होइन त्यसैले यो मिलेन। ✗\n③ 상대방 को अर्थ विपक्षी वा अर्को पक्ष (साथमा रहेको वा प्रतिस्पर्धा गर्ने व्यक्ति) हो ✓\n④ 룸메이트 को अर्थ कोठा साथी हो, यो कुराकानी वा खेलमा विपरीत पक्षमा हुने मानिस होइन त्यसैले यो मिलेन। ✗"}, {"n": "24", "q": "두 사람이 손을 맞잡고 가볍게 흔드는 동작으로, 인사나 감사, 축하, 등의 의미로 서로의 감정을 표현하는 방식입니다.", "options": ["악수", "약속", "감사", "방문"], "answer": 0, "explain": "प्रश्नको अर्थ: यसले दुई जना मानिसले आपसमा हात मिलाएर नमस्कार वा बधाई दिने व्यवहारलाई बुझाउँछ। यो शिष्टाचार र सम्मान व्यक्त गर्ने एउटा तरिका हो।\n① 악수 को अर्थ हात मिलाउने काम (शेक ह्यान्ड) हो, जहाँ दुई जनाले हात समातेर नमस्कार, धन्यवाद वा बधाई प्रकट गर्छन् ✓\n② 약속 को अर्थ वाचा वा प्रतिज्ञा हो, यो हात मिलाउने कार्यसँग मिल्दैन त्यसैले यो मिलेन। ✗\n③ 감사 को अर्थ धन्यवाद हो, यो हात जोड्ने वा मिलाउने शारीरिक क्रिया होइन त्यसैले यो मिलेन। ✗\n④ 방문 को अर्थ भ्रमण वा ढोका हो, यो अभिवादन गर्ने तरिका होइन त्यसैले यो मिलेन। ✗"}, {"n": "25", "q": "일상생활에서 자주 사용하는 물건들로, 청소 도구, 주방 용품, 세면도구, 가전제품 등이 생활을 편리하게 해주는 다양한 제품을 말합니다.", "options": ["생활용품", "생활규칙", "화장품", "생산품"], "answer": 0, "explain": "प्रश्नको अर्थ: यस विवरणले मानिसहरूलाई दिनहुँ घरमा सरसफाइ, भान्सा र व्यक्तिगत कामका लागि चाहिने आवश्यक सामानहरूलाई बुझाउँछ। यी सामानले दैनिक जीवन सहज बनाउँछन्।\n① 생활용품 भनेको दैनिक प्रयोगका सामानहरू हुन्, जसले जीवनलाई सजिलो बनाउँछ र प्रश्नसँग मिल्छ। ✓\n② 생활규칙 भनेको जीवनका नियमहरू हुन्, यो वस्तु होइन। ✗\n③ 화장품 भनेको सौन्दर्य प्रसाधन हो, यो सबै प्रकारका दैनिक सामान होइन। ✗\n④ 생산품 भनेको उत्पादन गरिएका वस्तुहरू हुन्, यो दैनिक प्रयोगका घरायसी सामान मात्र होइन। ✗"}, {"n": "26", "q": "사람들이 업무를 보기 위해 모여 일하는 공간을 말합니다. 주로 문서 작업, 회의, 관리 등의 일을 수행하는 장소입니다.", "options": ["대강당", "사무실", "교실", "공장"], "answer": 1, "explain": "प्रश्नको अर्थ: यसले मानिसहरू कागजी काम, बैठक र प्रशासनिक काम गर्न एकसाथ भेला हुने ठाउँलाई बुझाउँछ। यो काम गर्ने एउटा कोठा वा ठाउँ हो।\n① 대강당 को अर्थ ठूलो हल हो, यो मानिसहरू अफिसको काम गर्ने सानो ठाउँ होइन त्यसैले यो मिलेन। ✗\n② 사무실 को अर्थ कार्यालय वा अफिस हो, जहाँ मानिसहरू काम गर्न, मिटिङ गर्न र कागजी काम गर्न जम्मा हुन्छन् ✓\n③ 교실 को अर्थ कक्षा कोठा हो, यो विद्यार्थी पढ्ने ठाउँ हो त्यसैले अफिसको काम गर्ने ठाउँसँग मिल्दैन। ✗\n④ 공장 को अर्थ कारखाना हो, यो प्रशासनिक काम गर्ने अफिस होइन त्यसैले यो मिलेन। ✗"}, {"n": "27", "q": "종이, 천, 머리카락 같은 재료를 자르기 위해 사용되는 장치로, 가운데에 결합된 날카로운 두 개의 날과 손가락을 넣을 구멍이 있는 두 개의 손잡이로 구성됩니다.", "options": ["톱", "가위", "칼", "드릴"], "answer": 1, "explain": "प्रश्नको अर्थ: यस विवरणले कागज, कपडा वा कपाल काट्न प्रयोग गरिने दुईवटा धारिला पात र समात्ने प्वाल भएको औजारको बारेमा बताएको छ। यो काट्ने काममा उपयोगी हुन्छ।\n① 톱 को अर्थ करन्ती (आरी) हो, यो कपडा वा कागज काट्ने औजार होइन त्यसैले यो मिलेन। ✗\n② 가위 को अर्थ कैंची हो, जसको बीचमा धारिला दुई वटा ब्लेड र औंला छिराउने प्वाल हुन्छ जसले कागज, कपडा आदि काट्न मद्दत गर्छ ✓\n③ 칼 को अर्थ चक्कु हो, यसमा औंला छिराउने प्वाल हुँदैन त्यसैले यो मिलेन। ✗\n④ 드릴 को अर्थ प्वाल पार्ने मेसिन हो, यो काट्ने कैंची होइन त्यसैले यो मिलेन। ✗"}, {"n": "28", "q": "물체를 자르거나 깎기 위해 사용하는 보통 얇고 납작한 날을 가지고 있는 도구로, 용도에 따라 모양이 다양합니다.", "options": ["가위", "낫", "톱", "칼"], "answer": 3, "explain": "प्रश्नको अर्थ: यसले वस्तुहरू काट्न वा ताछ्न प्रयोग गरिने छोटो र धारिलो औजारलाई बुझाउँछ। भान्सा वा अन्य काममा यसको प्रयोग धेरै हुन्छ।\n① 가위 भनेको कैंची हो, यो पातलो र चेप्टो धार भएको टुक्रा काट्ने साधन भए पनि मुख्यतया कागज वा कपडा काट्न प्रयोग हुन्छ। ✗\n② 낫 भनेको हँसिया हो, यो घाँस काट्न प्रयोग हुन्छ। ✗\n③ 톱 भनेको आरा हो, यो काठ काट्न प्रयोग हुन्छ। ✗\n④ 칼 भनेको चक्कु हो, यो वस्तुहरू काट्न वा छाँटकाँट गर्न प्रयोग हुने पातलो र चेप्टो धार भएको साधन हो र प्रश्नसँग मिल्छ। ✓"}, {"n": "29", "q": "날짜, 요일, 월, 연도 등의 정보를 한눈에 볼 수 있게 만든 것으로 보통 종이나 전자 화면에 표 형태로 구성되어 있으며, 벽걸이형이나, 탁상용으로 사용할 수 있습니다.", "options": ["시계", "안경", "달력", "계산기"], "answer": 2, "explain": "प्रश्नको अर्थ: यस विवरणले वर्ष, महिना, गते र बारहरू स्पष्टसँग देख्न सकिने तालिकालाई बुझाउँछ। यसलाई भित्तामा झुन्ड्याउन वा टेबलमा राख्न सकिन्छ।\n① 시계 को अर्थ घडी हो, यो मिति र बार हेर्ने तालिका होइन त्यसैले यो मिलेन। ✗\n② 안경 को अर्थ चस्मा हो, यो पात्रो होइन त्यसैले यो मिलेन। ✗\n③ 달력 को अर्थ पात्रो (क्यालेन्डर) हो, जसबाट मिति, बार, महिना र वर्ष सजिलै हेर्न सकिन्छ र यो भित्ता वा टेबलमा राख्ने गरिन्छ ✓\n④ 계산기 को अर्थ क्याल्कुलेटर हो, यो गणितीय हिसाब गर्ने उपकरण हो त्यसैले यो मिलेन। ✗"}, {"n": "30", "q": "데이터를 처리하고 저장하는 전자 기기로, 정보를 입력하고 처리하여 결과를 출력하는 역할을 합니다.", "options": ["컴퓨터", "전화기", "라디오", "현미경"], "answer": 0, "explain": "प्रश्नको अर्थ: यसले तथ्याङ्क सङ्कलन गर्न, हिसाब गर्न र आवश्यक जानकारी सुरक्षित राख्न प्रयोग गरिने विद्युतीय उपकरणलाई बुझाउँछ।\n① 컴퓨터 भनेको कम्प्युटर हो, जसले डेटा प्रशोधन र भण्डारण गर्छ तथा जानकारी प्रशोधन गरेर नतिजा दिन्छ र प्रश्नसँग मिल्छ। ✓\n② 전화기 भनेको फोन हो, यो मुख्यतया कुराकानी गर्ने यन्त्र हो। ✗\n③ 라디오 भनेको रेडियो हो, यो अडियो सुन्ने मात्र यन्त्र हो। ✗\n④ 현미경 भनेको सूक्ष्मदर्शी हो, यो सानो वस्तु ठूलो देखाउने यन्त्र हो। ✗"}, {"n": "31", "q": "숫자와 수학적인 연산을 빠르고 정확하게 수행하는 전자 기기로 간단한 계산부터 복잡한 계산까지 처리할 수 있습니다.", "options": ["계산기", "수준기", "정수기", "세탁기"], "answer": 0, "explain": "प्रश्नको अर्थ: यसले अङ्कहरूको जोड, घटाउ र गणितीय हिसाब छिटो र सही तरिकाले गर्न सहयोग गर्ने सानो उपकरणलाई बुझाउँछ।\n① 계산기 भनेको क्याल्कुलेटर हो, जसले गणितीय गणना छिटो र सही, सरलदेखि जटिलसम्म गर्न सक्छ ✓\n② 수준기 भनेको लेभल गर्ने औजार हो, यो गणितीय गणना गर्ने इलेक्ट्रोनिक मेसिन होइन। ✗\n③ 정수기 भनेको पानी शुद्ध गर्ने वाटर प्युरिफायर हो, यो गणना गर्ने मेसिन होइन। ✗\n④ 세탁기 भनेको लुगा धुने मेसिन हो, यसले गणनाको काम गर्दैन। ✗"}, {"n": "32", "q": "주로 청소나 개인 위생을 위한 종이 제품으로, 부드럽고 흡수력이 뛰어난 특성이 있습니다.", "options": ["원사", "비닐", "봉지", "휴지"], "answer": 3, "explain": "प्रश्नको अर्थ: यस विवरणले सरसफाइ गर्न वा हात-मुख पुछ्न प्रयोग गरिने नरम र पानी सोस्ने कागजको सामानलाई बुझाउँछ।\n① 원사 भनेको धागो हो, यो सरसफाइ वा व्यक्तिगत सरसफाइका लागि प्रयोग हुने कागजको उत्पादन होइन। ✗\n② 비닐 भनेको प्लास्टिक वा भिनिल हो, यो कागजको उत्पादन होइन। ✗\n③ 봉지 भनेको झोला हो, यो पनि कागजको उत्पादन होइन। ✗\n④ 휴지 भनेको टिस्यु पेपर वा ट्वाइलेट पेपर हो, जुन सरसफाइका लागि प्रयोग हुने नरम र पानी सोस्ने कागजको उत्पादन हो ✓"}, {"n": "33", "q": "국제 여행을 위해 개인의 신원을 증명하는 공식 문서입니다. 보통 사진, 이름, 생년월일, 발급 국가 등이 기재되어 있으며, 출입국 관리 시 필요한 중요한 서류입니다.", "options": ["학생증", "사원증", "이력서", "여권"], "answer": 3, "explain": "प्रश्नको अर्थ: यसले विदेश भ्रमण गर्दा वा अर्को देश जाँदा आफ्नो परिचय र नागरिकता प्रमाणित गर्ने सरकारी कागजातलाई बुझाउँछ।\n① 학생증 भनेको विद्यार्थी परिचय पत्र हो, यो अन्तर्राष्ट्रिय यात्राको लागि होइन। ✗\n② 사원증 भनेको कम्पनीको परिचय पत्र हो, यो राहदानी होइन। ✗\n③ 이력서 भनेको बायोडाटा वा जागिरको आवेदन फारम हो, यो यात्राको कागजात होइन। ✗\n④ 여권 भनेको राहदानी हो, जसले अन्तर्राष्ट्रिय यात्राको लागि व्यक्तिको पहिचान प्रमाणित गर्छ र प्रश्नसँग मिल्छ। ✓"}, {"n": "34", "q": "돈, 카드, 신분증 등을 보관하는 작은 가방 모양의 액세서리로 보통 가죽이나 천으로 만들어집니다.", "options": ["서랍", "지갑", "배낭", "주머니"], "answer": 1, "explain": "प्रश्नको अर्थ: यस विवरणले पैसा, परिचयपत्र र कार्डहरू सुरक्षित रूपमा खल्तीमा बोकेर हिँड्न प्रयोग गरिने सानो सामानलाई बुझाउँछ।\n① 서랍 भनेको दराज हो, यो बोक्ने झोला आकारको वस्तु होइन। ✗\n② 지갑 भनेको पर्स हो, जसले पैसा, कार्ड र परिचय पत्र राख्छ र छाला वा कपडाबाट बनेको हुन्छ र प्रश्नसँग मिल्छ। ✓\n③ 배낭 भनेको पिठ्युँमा बोक्ने झोला हो, यो पैसा राख्ने सानो पर्स होइन। ✗\n④ 주머니 भनेको खल्ती हो, यो छुट्टै बनाइएको झोला होइन। ✗"}, {"n": "35", "q": "잠금을 열거나 잠그는 데 사용하는 도구로, 특정 잠금 장치에 맞게 디자인된 금속 재질의 작은 물건입니다. 보통 집, 자동차, 자물쇠 등을 여는 데 사용됩니다.", "options": ["창문", "열쇠", "부품", "지갑"], "answer": 1, "explain": "प्रश्नको अर्थ: यसले घरको ढोका, गाडी वा ताला खोल्न र बन्द गर्न प्रयोग गरिने सानो धातुको औजारलाई बुझाउँछ।\n① 창문 भनेको झ्याल हो, यो ताला खोल्ने औजार होइन। ✗\n② 열쇠 भनेको साँचो हो, यो ताला खोल्न वा बन्द गर्न प्रयोग गरिने धातुबाट बनेको सानो वस्तु हो ✓\n③ 부품 भनेको पार्टपुर्जा हो, यो साँचो होइन। ✗\n④ 지갑 भनेको वालेट हो, यो ताला खोल्ने औजार होइन। ✗"}, {"n": "36", "q": "피부를 보호하거나 미용을 위해 사용하는 제품들로, 로션, 크림, 세럼, 메이크업 제품 등 다양한 종류가 있습니다.", "options": ["의약품", "생산품", "화장품", "음료품"], "answer": 2, "explain": "प्रश्नको अर्थ: यस विवरणले छालाको सुरक्षा गर्न र अनुहार वा शरीरलाई राम्रो बनाउन प्रयोग गरिने लोसन र क्रिम जस्ता वस्तुहरूलाई बुझाउँछ।\n① 의약품 भनेको औषधि हो, यो छालाको हेरचाह वा सौन्दर्यको लागि प्रयोग हुने प्रसाधन सामग्री होइन। ✗\n② 생산품 भनेको उत्पादित वस्तु हो, यो सामान्य शब्द हो। ✗\n③ 화장품 भनेको सौन्दर्य प्रसाधन वा कस्मेटिक्स हो, जुन छालाको सुरक्षा वा सौन्दर्यको लागि प्रयोग गरिन्छ र लोसन, क्रिम, सेरम, मेकअपका सामानहरू यसभित्र पर्छन् ✓\n④ 음료품 भनेको पेय पदार्थ हो, यो छालामा लगाउने सौन्दर्य प्रसाधन होइन। ✗"}, {"n": "37", "q": "우리가 보려고 하는 것을 보여주는 유리이고 주로 얼굴을 보고 화장하거나 옷을 확인할 때 사용합니다. 모양은 평평하거나 조금 둥글 수 있습니다.", "options": ["거울", "옷장", "창문", "세숫대"], "answer": 0, "explain": "प्रश्नको अर्थ: यसले मानिसहरूले आफ्नो अनुहार हेर्न, कपाल कोर्न वा कपडा मिलाउन प्रयोग गर्ने टल्किने काँचलाई बुझाउँछ।\n१. 거울 भनेको ऐना हो, यो हामीले हेर्न चाहेको कुरा देखाउने सिसा हो र अनुहार हेरेर मेकअप गर्दा वा लुगा ठिक छ छैन भनेर हेर्दा प्रयोग गरिन्छ त्यसैले यो सही उत्तर हो। २. 옷장 भनेको दल्चा वा कपडा राख्ने दराज हो, यो ऐना होइन। ३. 창문 भनेको झ्याल हो, यो अनुहार हेर्ने ऐना होइन। ४. 세숫대야 भनेको मुख धुने वा भाँडाकुडा धुने बाटा हो, यो ऐना होइन। सही उत्तर 거울 हो जुन ऐना हो।"}, {"n": "38", "q": "사람이 잠을 잘 때 머리나 목을 편안하게 받쳐 주기 위해 사용하는 물건입니다. 부드러운 재료로 만들어져 있어 몸의 긴장을 풀어 주고 편안한 잠을 도와줍니다.", "options": ["베개", "이불", "담요", "매트리스"], "answer": 0, "explain": "प्रश्नको अर्थ: यस विवरणले सुत्ने बेलामा टाउको वा गर्दनमुनि राखिने नरम सामानलाई बुझाउँछ। यसले आरामसँग सुत्न मद्दत गर्छ।\n① 베개 भनेको सिरानी हो, यो सुत्दा टाउको वा घाँटीलाई आरामसँग अड्याउन प्रयोग गरिने वस्तु हो ✓\n② 이불 भनेको बख्खु वा लुगा ओढ्ने कम्बल/सजाइ हो, यो टाउकोमा राख्ने सिरानी होइन। ✗\n③ 담요 भनेको ब्ल्याङ्केट वा कम्बल हो, यो ओढ्ने कुरा हो। ✗\n④ 매트리스 भनेको म्याट्रेस वाद्दा हो, यो सुत्ने ओछ्यानमा ओछ्याउने हो सिरानी होइन। ✗"}, {"n": "39", "q": "잠을 잘 때 몸을 덮어 따뜻하게 보호해 주는 천으로 만든 물건입니다. 추위로부터 몸을 지켜 주고 편안한 잠을 도와줍니다.", "options": ["베개", "홑이불", "카펫", "이불"], "answer": 3, "explain": "प्रश्नको अर्थ: यसले सुत्दा चिसोबाट बच्न र शरीरलाई न्यानो पार्न माथिबाट ओढ्ने कपडाको सामानलाई बुझाउँछ।\n१. 베개 भनेको सिरानी हो, यो शरीर ढाक्ने ओढ्ने वस्तु होइन। २. 홑이불 भनेको पातलो कभर वा च्यादर हो, यो विशेष गरी शरीर ओढ्ने मुख्य न्यानो कपडाको रूपमा भन्दा पनि फराकिलो अर्थमा 이불 प्रयोग हुन्छ। ३. 카펫 भनेको कार्पेट हो, यो भुइँमा ओछ्याउने कुरा हो। ४. 이불 भनेको कम्बल वा ओढ्ने कपडा हो, जसले सुत्दा शरीर छोपेर न्यानो राख्न मद्दत गर्छ त्यसैले यो सही उत्तर हो। सही उत्तर 이불 हो जुन ओढ्ने कम्बल हो।"}, {"n": "40", "q": "머리카락을 가지런히 정리하거나 엉킨 머리를 풀 때 사용하는 도구입니다. 주로 손잡이가 달려 있고 여러 개의 가느다란 이가 나란히 붙어 있습니다.", "options": ["가위", "칼", "빗", "톱"], "answer": 2, "explain": "प्रश्नको अर्थ: यस विवरणले जेलिएको कपाल सुल्झाउन र कपाललाई सफासँग मिलाउन प्रयोग गरिने काँढा भएको औजारलाई बुझाउँछ।\n① 가위 भनेको कैची हो, यो कपाल कोर्ने औजार होइन। ✗\n② 칼 भनेको चक्कु हो, यो कपाल कोर्ने साधन होइन। ✗\n③ 빗 भनेको काइयो हो, जसले कपाल मिलाउन वा अल्झिएको कपाल फुकाउन प्रयोग गरिन्छ र यसमा ह्यान्डल र सानो दाँतहरू लाइनमा बसेका हुन्छन् ✓\n④ 톱 भनेको आरा हो, यो काठ काट्ने औजार हो कपाल कोर्ने होइन। ✗"}, {"n": "41", "q": "사람들이 일상생활에 필요한 식품, 생필품, 의류 등을 한 곳에서 편리하게 살 수 있도록 모아 놓은 큰 가게나 상점을 말합니다.", "options": ["옷가게", "마트", "서점", "편의점"], "answer": 1, "explain": "प्रश्नको अर्थ: मानिसहरूले दैनिक जीवनमा चाहिने खाना, सामान र कपडाहरू एकै ठाउँबाट सजिलै किन्न सक्ने ठूलो पसललाई यसले जनाउँछ।\n① 옷가게 भनेको कपडा पसल हो, यहाँ सबै प्रकारका दैनिक उपभोग्य वस्तु पाइँदैन केवल कपडा पाइन्छ। ✗\n② 마트 भनेको मार्ट वा सुपरमार्केट हो, जहाँ मानिसहरूलाई दैनिक जीवनमा आवश्यक पर्ने खाद्य पदार्थ, दैनिक उपभोग्य वस्तु, कपडा आदि एकै ठाउँमा सजिलै किन्न पाइने ठूलो पसल हो ✓\n③ 서점 भनेको पुस्तक पसल हो, यहाँ किताब मात्र पाइन्छ। ✗\n④ 편의점 भनेको कन्भिनियन्स स्टोर हो, यो मार्टभन्दा सानो हुन्छ र चौबीसै घण्टा खुल्छ। ✗"}, {"n": "42", "q": "사람들이 먹기 위해 구입하는 재료나 음식입니다. 주로 쌀, 채소, 과일, 고기, 생선, 우유처럼 일상생활에 꼭 필요한 먹거리를 말합니다.", "options": ["식료품", "음료품", "의약품", "의류품"], "answer": 0, "explain": "प्रश्नको अर्थ: मानिसहरूले खानका लागि किन्ने चामल, तरकारी, फलफूल र माछामासु जस्ता दैनिक आवश्यक खानेकुराहरूलाई यसले बुझाउँछ।\n① 식료품 भनेको खाद्यान्न वा खाद्य सामग्री हो, जसमा चामल, तरकारी, फलफूल, मासु, माछा, दूध जस्ता दैनिक जीवनमा नभई नहुने खानेकुरा पर्छन् ✓\n② 음료품 भनेको पेय पदार्थ हो, यो खानेकुरा र खाद्यान्न सबैलाई जनाउने शब्द होइन। ✗\n③ 의약품 भनेको औषधि हो, यो खाद्य सामग्री होइन। ✗\n④ 의류품 भनेको कपडाजन्य वस्तु हो, यो खानेकुरा होइन। ✗"}, {"n": "43", "q": "전단지는 상품, 행사, 가게 등을 알리기 위해 사람들에게 나눠 주는 작은 종이입니다.", "options": ["메뉴판", "전단지", "잡지", "신문"], "answer": 1, "explain": "प्रश्नको अर्थ: सामान, कार्यक्रम वा पसलको जानकारी मानिसहरूलाई दिनका लागि बाँडिने सानो कागजको पातलो पर्चालाई यसले बुझाउँछ।\n① 메뉴판 भनेको मेनु कार्ड हो, यो पसलको विज्ञापन गर्ने पर्चा होइन। ✗\n② 전단지 भनेको विज्ञापन गर्ने पर्चा वा पम्प्लेट हो, जुन सामान, कार्यक्रम, पसल आदिको बारेमा जानकारी दिन मानिसहरूलाई बाँडिन्छ ✓\n③ 잡지 भनेको म्यागजिन वा पत्रिका हो, यो विज्ञापन पर्चा होइन। ✗\n④ 신문 भनेको समाचारपत्र हो, यो पर्चा होइन। ✗"}, {"n": "44", "q": "사용하던 물건을 다른 사람에게 사고파는 것으로 저렴한 가격에 거래합니다.", "options": ["직거래", "중고 거래", "주말 특가", "할인 행사"], "answer": 1, "explain": "प्रश्नको अर्थ: आफूले प्रयोग गरिसकेको सामान अरू मानिससँग सस्तो मूल्यमा किनबेच गर्ने कार्यलाई यसले बुझाउँछ।\n① 직거래 भनेको सिधा कारोबार हो, यो प्रयोग गरिसकेको सामान किनबेच गर्ने कुरा मात्र होइन। ✗\n② 중고 거래 भनेको सेकेन्ड ह्यान्ड कारोबार वा पुरानो सामानको किनबेच हो, जसमा प्रयोग गरिरहेको सामान अरूलाई सस्तो मूल्यमा किनबेच गरिन्छ ✓\n③ 주말 특가 भनेको सप्ताहन्तको विशेष छुट मूल्य हो। ✗\n④ 할인 행사 भनेको छुट दिने कार्यक्रम हो। ✗"}, {"n": "45", "q": "집에서 사용하는 전기 기계로, 생활을 편리하게 도와주는 물건입니다. 예를 들면, 냉장고, 세탁기, 전자레인지 등이 있습니다.", "options": ["의류품", "전기장치", "가전제품", "기계장치"], "answer": 2, "explain": "प्रश्नको अर्थ: घरमा बिजुलीबाट चलिने र दैनिक कामलाई सजिलो बनाउन मद्दत गर्ने उपकरणहरूलाई यसले बुझाउँछ।\n① 의류품 भनेको कपडाजन्य वस्तु हो, यो विद्युतीय मेसिन होइन। ✗\n② 전기장치 भनेको विद्युतीय उपकरण वा डिभाइस हो, तर घरमा प्रयोग हुने घरायसी मेसिनहरूलाई जनाउने शब्द होइन। ✗\n③ 가전제품 भनेको घरायसी विद्युतीय उपकरण वा होम अप्लायन्सेस हो, जस्तै फ्रिज, वासिङ मेसिन, माइक्रोवेभ आदि जसले जीवनलाई सहज बनाउँछ ✓\n④ 기계장치 भनेको मेशिनरी उपकरण हो, यो सामान्य घरायसी सामानका लागि प्रयोग हुँदैन। ✗"}, {"n": "46", "q": "실내 온도를 시원하게 하거나 따뜻하게 조절해주는 전자제품입니다. 더운 여름이나 추운 겨울에 쾌적한 환경을 만들어 줍니다.", "options": ["세탁기", "건조기", "정수기", "에어컨"], "answer": 3, "explain": "प्रश्नको अर्थ: कोठाको तापक्रमलाई चिसो वा न्यानो बनाएर आरामदायी वातावरण बनाउने विद्युतीय सामानलाई यसले जनाउँछ।\n① 세탁기 भनेको लुगा धुने मेसिन हो ✗\n② 건조기 भनेको लुगा सुकाउने मेसिन हो ✗\n③ 정수기 भनेको पानी शुद्ध पार्ने मेसिन हो ✗\n④ 에어컨 भनेको कोठाको तापक्रम चिसो वा तातो बनाउने वातानुकूलित यन्त्र हो ✓"}, {"n": "47", "q": "전기를 이용해 다양한 기능을 수행하는 기계나 기구를 말합니다.", "options": ["전자제품", "의약품", "가전제품", "기계장치"], "answer": 0, "explain": "प्रश्नको अर्थ: बिजुलीको प्रयोग गरेर धेरै प्रकारका कामहरू गर्ने विद्युतीय सामान वा उपकरणलाई यसले बुझाउँछ।\n① 전자제품 भनेको बिजुलीबाट चल्ने विभिन्न कार्य गर्ने विद्युतीय उत्पादन हो, प्रश्नले घरमा प्रयोग हुने भन्ने कुनै सीमा नतोकेकाले यही सामान्य अर्थ मिल्छ ✓\n② 의약품 भनेको औषधिजन्य सामग्री हो ✗\n③ 가전제품 भनेको घरमा प्रयोग हुने घरायसी विद्युतीय उपकरण मात्र हो, प्रश्नमा घरायसी प्रयोगको कुनै उल्लेख छैन ✗\n④ 기계장치 भनेको मेसिनरी यन्त्र हो, बिजुलीबाट चल्ने विद्युतीय उत्पादन भन्ने अर्थसँग मिल्दैन ✗\nशिक्षकको उत्तर-पत्र: ① 전자제품 — मेरो उत्तर: ① 전자제품 (सच्याइएको)। प्रश्नमा 'घरमा' भन्ने छैन — सामान्य विवरण ('전기를 이용해 다양한 기능') ले इलेक्ट्रोनिक उत्पादन (전자제품) बुझाउँछ; 가전제품 त घरमा प्रयोग हुने उपकरण मात्र हो। मेरो पहिलेको उत्तर ③ गलत थियो, ① मा सच्याइएको छ।"}, {"n": "48", "q": "사람이 잠을 자거나 쉴 때 사용하는 가구입니다. 매트리스와 프레임으로 이루어져 있어 편안하게 누울 수 있습니다.", "options": ["옷장", "책상", "의자", "침대"], "answer": 3, "explain": "प्रश्नको अर्थ: मानिसहरू सुत्न वा आराम गर्न प्रयोग गर्ने र सहजसँग तेर्सिन सकिने फर्निचरलाई यसले जनाउँछ।\n① 옷장 भनेको कपडा राख्ने दराज हो ✗\n② 책상 भनेको पढ्ने वा लेख्ने टेबल हो ✗\n③ 의자 भनेको बस्ने कुर्सी हो ✗\n④ 침대 भनेको सुत्ने वा आराम गर्ने बेड (खाट) हो ✓"}, {"n": "49", "q": "옷이나 천 등을 물과 세제를 이용해 자동으로 빨아주는 가전제품입니다. 사용자가 세탁, 헹굼, 탈수 과정을 쉽게 할 수 있도록 도와줍니다.", "options": ["옷걸이", "옷장", "냉장고", "세탁기"], "answer": 3, "explain": "प्रश्नको अर्थ: पानी र साबुनको प्रयोग गरेर लुगाहरू आफैँ धुन मद्दत गर्ने विद्युतीय उपकरणलाई यसले बुझाउँछ।\n① 옷걸이 भनेको कपडा झुन्ड्याउने ह्यागर हो ✗\n② 옷장 भनेको कपडा राख्ने दराज हो ✗\n③ 냉장고 भनेको खाना तथा पेयपदार्थ चिसो बनाउने फ्रिज हो ✗\n④ 세탁기 भनेको पानी र डिटर्जेन्ट प्रयोग गरेर स्वचालित रूपमा लुगा धुने वाशिङ मेसिन हो ✓"}, {"n": "50", "q": "음식이나 음료를 차갑게 보관하여 신선함을 오래 유지할 수 있는 제품입니다.", "options": ["세탁기", "냉장고", "식탁", "전자레인지"], "answer": 1, "explain": "प्रश्नको अर्थ: खानेकुरा र पेय पदार्थलाई चिसो बनाएर लामो समयसम्म ताजा राख्ने सामानलाई यसले बुझाउँछ।\n① 세탁기 भनेको लुगा धुने मेसिन हो ✗\n② 냉장고 भनेको खाना वा पेयपदार्थलाई चिसोमा राखेर ताजा राखिराख्ने फ्रिज हो ✓\n③ 식탁 भनेको खाना खाने टेबल हो ✗\n④ 전자레인지 भनेको खाना तताउने माइक्रोवेभ ओभन हो ✗"}, {"n": "51", "q": "먼지나 쓰레기를 빨아들여 집 안이나 사무실 등을 깨끗하게 청소할 수 있도록 도와주는 기계입니다.", "options": ["계산기", "청소기", "냉장고", "사진기"], "answer": 1, "explain": "प्रश्नको अर्थ: धूलो र फोहोर तानेर घर वा कार्यालय सफा गर्न मद्दत गर्ने मेसिनलाई यसले बुझाउँछ।\n① 계산기 भनेको क्याल्कुलेटर हो ✗\n② 청소기 भनेको धुलो वा फोहोर तानेर कोठा सफा गर्ने भ्याकुम क्लिनर हो ✓\n③ 냉장고 भनेको फ्रिज हो ✗\n④ 사진기 भनेको क्यामेरा हो ✗"}, {"n": "52", "q": "상품을 생산하거나 서비스를 제공하여 이익을 얻는 조직입니다. 경영진과 직원들이 효율적으로 자원을 관리하여 지속 가능한 성장을 추구합니다.", "options": ["공장", "학교", "회사", "은행"], "answer": 2, "explain": "प्रश्नको अर्थ: सामान उत्पादन गरेर वा सेवा दिएर नाफा कमाउन काम गर्ने मानिसहरूको संस्था वा कार्यालयलाई यसले जनाउँछ।\n① 공장 भनेको कारखाना हो, त्यसैले यो पूर्ण मिल्दैन। ✗\n② 학교 भनेको विद्यालय हो ✗\n③ 회사 भनेको सामान उत्पादन गरेर वा सेवा दिएर नाफा कमाउने संस्था (कम्पनी) हो ✓\n④ 은행 भनेको बैंक हो ✗"}, {"n": "53", "q": "음식을 제공하는 장소로, 고객에게 다양한 메뉴를 제공하여 식사를 제공합니다. 보통 음료와 함께 식사를 즐길 수 있는 공간이 마련되어 있습니다.", "options": ["부엌", "밥집", "식당", "커피숍"], "answer": 2, "explain": "प्रश्नको अर्थ: मानिसहरू गएर पैसा तिरेर विभिन्न खानेकुरा र खाना खान सक्ने ठाउँलाई यसले जनाउँछ।\n① 부엌 भनेको घरभित्रको भान्साकोठा हो ✗\n② 밥집 भनेको सामान्य भात खाने पसल हो। ✗\n③ 식당 भनेको ग्राहकलाई विभिन्न प्रकारका परिकार र खाना उपलब्ध गराउने रेस्टुरेन्ट हो ✓\n④ 커피숍 भनेको कफी पसल हो ✗"}, {"n": "54", "q": "돈을 맡기고 빌릴 수 있는 곳으로, 사람들 또는 회사에 금융 서비스를 제공합니다. 예금, 대출, 송금 등의 서비스를 통해 돈을 관리합니다.", "options": ["식당", "학원", "은행", "환전소"], "answer": 2, "explain": "प्रश्नको अर्थ: पैसा जम्मा गर्न, ऋण लिन र अरूलाई पैसा पठाउन सकिने वित्तीय संस्था वा ठाउँलाई यसले बुझाउँछ।\n① 식당 भनेको रेस्टुरेन्ट हो, यो पैसा जम्मा गर्ने ठाउँ होइन। ✗\n② 학원 भनेको ट्युसन सेन्टर वा कोचिङ इन्स्टिच्युट हो, यो बैंक होइन। ✗\n③ 은행 भनेको बैंक हो, जहाँ पैसा जम्मा गर्न र ऋण लिन सकिन्छ र वित्तीय सेवाहरू प्रदान गर्छ र प्रश्नसँग मिल्छ। ✓\n④ 환전소 भनेको मुद्रा सटही काउन्टर हो, यो पूर्ण बैंक सेवा दिने ठाउँ होइन। ✗"}, {"n": "55", "q": "집이나 식당에서 식사를 하거나 음식을 올려놓기 위해 사용하는 탁자를 말합니다.", "options": ["책상", "식탁", "책장", "옷장"], "answer": 1, "explain": "प्रश्नको अर्थ: घर वा खाने ठाउँमा खाना राखेर बस्न र खानका लागि प्रयोग गरिने टेबललाई यसले जनाउँछ।\n① 책상 भनेको पढ्ने टेबल हो ✗\n② 식탁 भनेको घर वा रेस्टुरेन्टमा खाना खान वा खाना राख्न प्रयोग गरिने डाइनिङ टेबल हो ✓\n③ 책장 भनेको किताब राख्ने दराज हो ✗\n④ 옷장 भनेको कपडा राख्ने दराज हो ✗"}, {"n": "56", "q": "은행에 예금해 둔 돈을 은행 창구를 거치지 않고 통장이나 카드를 사용하여 찾을 수 있는 장치입니다.", "options": ["카드 단말기", "카드 충전기", "커피 자판기", "현금 인출기"], "answer": 3, "explain": "प्रश्नको अर्थ: खातामा भएको पैसा काउन्टरमा नगई कार्ड वा पासबुक प्रयोग गरेर निकाल्न सकिने मेसिनलाई यसले बुझाउँछ।\n① 카드 단말기 भनेको कार्ड स्वाइप गर्ने मेसिन हो ✗\n② 카드 충전기 भनेको कार्डमा पैसा थप्ने मेसिन हो ✗\n③ 커피 자판기 भनेको कफी आउने मेसिन हो ✗\n④ 현금 인출기 भनेको बैंकको काउन्टर नगई पासबुक वा कार्ड प्रयोग गरेर पैसा निकाल्ने एटीएम मेसिन हो ✓"}, {"n": "57", "q": "일상 생활에 필요한 물건을 24시간 또는 긴 시간 동안 쉽게 구입할 수 있는 가게로 주로 음료, 스낵, 생필품 등을 판매합니다.", "options": ["마트", "매점", "백화점", "편의점"], "answer": 3, "explain": "प्रश्नको अर्थ: चौबीसै घण्टा वा लामो समयसम्म खुला रहेर दैनिक चाहिने सानातिना सामान किन्न सकिने पसललाई यसले जनाउँछ।\n① 마트 भनेको ठूलो मार्ट हो। ✗\n② 매점 भनेको क्यान्टिन हो। ✗\n③ 백화점 भनेको डिपार्टमेन्ट स्टोर हो। ✗\n④ 편의점 भनेको २४ घण्टै वा लामो समयसम्म खुल्ने, दैनिक उपभोग्य वस्तुहरू सहजै किन्न पाइने सुविधा स्टोर (कन्भेनिएन्स स्टोर) हो ✓"}, {"n": "58", "q": "사람들이 다양한 상품을 사고파는 곳으로, 보통 노점이나 작은 가게들이 모여 있고 신선한 식료품, 의류, 생활용품 등을 손쉽게 구입할 수 있는 상업 공간입니다.", "options": ["옷가게", "시장", "쇼핑몰", "수퍼마켓"], "answer": 1, "explain": "प्रश्नको अर्थ: धेरै साना पसलहरू एकै ठाउँमा भएर तरकारी, कपडा र अरू सामान किनबेच गरिने ठाउँलाई यसले बुझाउँछ।\n① 옷가게 भनेको कपडा पसल हो, त्यसैले यो पूर्ण मिल्दैन। ✗\n② 시장 भनेको विभिन्न किसिमका सामान किनबेच गर्ने बजार (खुला वा पारम्परिक बजार) हो ✓\n③ 쇼핑몰 भनेको सपिङ मल हो। ✗\n④ 수퍼마켓 भनेको सुपरमार्केट हो। ✗"}, {"n": "59", "q": "머리카락을 자르거나 스타일링, 염색 등을 제공하는 곳으로 고객의 헤어와 뷰티에 관련된 다양한 미용 서비스를 제공합니다.", "options": ["미용실", "교육원", "이발소", "미용샵"], "answer": 0, "explain": "प्रश्नको अर्थ: कपाल काट्न, रंगाउन र कपालको बनावट सजाउनका लागि जाने ठाउँलाई यसले बुझाउँछ।\n① 미용실 भनेको कपाल काट्ने, स्टाइल गर्ने र रङ्ग्याउने ब्युटी पार्लर (सैलुन) हो ✓\n② 교육원 भनेको शिक्षा दिने केन्द्र हो ✗\n③ 이발소 भनेको परम्परागत पुरुषको कपाल काट्ने नापित पसल हो। ✗\n④ 미용샵 भनेको ब्युटी सप हो (तर सामान्यतया मि용실 प्रयोग हुन्छ)। ✗"}, {"n": "60", "q": "질병이나 부상을 치료하고 건강을 돌보는 곳으로, 의사와 간호사들이 환자를 돌보고 진료, 검사, 수술 등의 의료 서비스를 제공합니다.", "options": ["병원", "약국", "은행", "극장"], "answer": 0, "explain": "प्रश्नको अर्थ: बिरामी वा चोट लागेका मानिसहरूको डाक्टर र नर्सले उपचार गर्ने ठाउँलाई यसले बुझाउँछ।\n① 병원 भनेको रोग वा चोटपटकको उपचार गर्ने, डाक्टर र नर्सहरूले बिरामीको हेरचाह गर्ने अस्पताल हो ✓\n② 약국 भनेको औषधि पसल हो ✗\n③ 은행 भनेको बैंक हो ✗\n④ 극장 भनेको सिनेमा हल हो ✗"}, {"n": "61", "q": "편지나 소포를 보내고 받는 곳으로, 우편 서비스를 제공합니다. 또한, 금융 서비스와 같은 다양한 서비스를 제공하기도 합니다.", "options": ["우체국", "은행", "병원", "학교"], "answer": 0, "explain": "प्रश्नको अर्थ: यो चिठी र पार्सल पठाउने तथा प्राप्त गर्ने ठाउँ हो। यहाँ हुलाक सेवाका साथै पैसा कारोबार सम्बन्धी काम पनि गरिन्छ।\n① 우체국 भनेको हुलाक कार्यालय हो, जहाँ चिठी वा पार्सल पठाउने र प्राप्त गर्ने काम गरिन्छ र प्रश्नसँग मिल्छ। ✓\n② 은행 भनेको बैंक हो, यो हुलाक सेवा दिने ठाउँ होइन। ✗\n③ 병원 भनेको अस्पताल हो, यो हुलाक कार्यालय होइन। ✗\n④ 학교 भनेको विद्यालय हो, यो चिठी पठाउने ठाउँ होइन। ✗"}, {"n": "62", "q": "학생이나 직장인들이 생활할 수 있는 숙소로, 학교나 직장 근처에 위치해 있고 주로 공동 생활 공간과 개인 공간이 나누어져 있습니다.", "options": ["교육원", "대학교", "기숙사", "휴게실"], "answer": 2, "explain": "प्रश्नको अर्थ: यो विद्यार्थी वा कामदारहरू बस्ने आवासीय ठाउँ हो। यो विद्यालय वा कार्यस्थल नजिक हुन्छ र यहाँ साझा तथा व्यक्तिगत ठाउँहरू छुट्याइएको हुन्छ।\n① 교육원 भनेको तालिम केन्द्र हो, यो बस्ने होस्टेल होइन। ✗\n② 대학교 भनेको विश्वविद्यालय हो, यो विद्यार्थी वा कामदार बस्ने आवास होइन। ✗\n③ 기숙사 भनेको होस्टेल हो, जहाँ विद्यार्थी वा कामदारहरू बस्छन् र साझा तथा व्यक्तिगत ठाउँहरू छुट्टाइएको हुन्छ र प्रश्नसँग मिल्छ। ✓\n④ 휴게실 भनेको विश्राम कक्ष हो, यो सुत्ने बासस्थान होइन। ✗"}, {"n": "63", "q": "넓은 길이나 큰 문을 의미하며, 보통 중요한 장소나 건물의 입구에 위치한 크고 아름다운 문을 가리킵니다.", "options": ["광장", "극장", "뒷문", "정문"], "answer": 3, "explain": "प्रश्नको अर्थ: यसले कुनै मुख्य वा महत्त्वपूर्ण भवनको अगाडि रहेको ठूलो र सुन्दर ढोकालाई जनाउँछ। यो भवनभित्र पस्ने प्रमुख प्रवेशद्वार हो।\n① 광장 भनेको खुला चोक वा बजार हो, यो ढोका होइन। ✗\n② 극장 भनेको चलचित्र घर वा थिएटर हो, यो प्रवेशद्वार होइन। ✗\n③ 뒷문 भनेको पछाडिको ढोका हो, यो मुख्य द्वार होइन। ✗\n④ 정문 भनेको मुख्य प्रवेशद्वार हो, जसले ठूलो बाटो वा मुख्य ढोकालाई जनाउँछ र प्रश्नसँग मिल्छ। ✓"}, {"n": "64", "q": "나라의 교육과 관련된 정책을 만들고 학교 교육을 관리하는 기관입니다. 학생들의 학습 환경을 개선하고 교육 발전을 위해 일합니다.", "options": ["노동부", "교육부", "과학부", "관광부"], "answer": 1, "explain": "प्रश्नको अर्थ: यो देशको पठनपाठन र विद्यालय शिक्षा सम्बन्धी नीति नियम बनाउने सरकारी निकाय हो। यसले विद्यार्थीहरूको सिकाइ वातावरण सुधार्ने काम गर्छ।\n① 노동부 भनेको श्रम मन्त्रालय हो। ✗\n② 교육부 भनेको शिक्षा मन्त्रालय हो, जसले देशको शिक्षा नीति बनाउँछ र विद्यालय शिक्षाको व्यवस्थापन गर्छ ✓\n③ 과학부 भनेको विज्ञान मन्त्रालय हो। ✗\n④ 관광부 भनेको पर्यटन मन्त्रालय हो। ✗"}, {"n": "65", "q": "일자리와 노동 문제를 다루는 기관으로, 근로자의 권익 보호와 고용 지원을 담당합니다. 일자리 창출과 근로 환경 개선을 위해 다양한 정책을 펼칩니다.", "options": ["위생부", "내무부", "고용노동부", "도시개발부"], "answer": 2, "explain": "प्रश्नको अर्थ: यो रोजगार र श्रमिकका समस्याहरूसँग सम्बन्धित काम गर्ने सरकारी कार्यालय हो। यसले कामदारहरूको अधिकार रक्षा र रोजगारीको व्यवस्था गर्छ।\n① 위생부 भनेको सरसफाइ मन्त्रालय हो। ✗\n② 내무부 भनेको गृह मन्त्रालय हो। ✗\n③ 고용노동부 भनेको रोजगार तथा श्रम मन्त्रालय हो, जसले रोजगारी र श्रमका मुद्दा हेर्छ तथा श्रमिकको अधिकारको रक्षा गर्छ ✓\n④ 도시개발부 भनेको सहरी विकास मन्त्रालय हो। ✗"}, {"n": "66", "q": "집 안에서 바닥을 평평하게 만들어 사람들이 걷거나 앉을 수 있게 한 부분입니다. 주로 나무로 만들어져 편안한 느낌을 줍니다.", "options": ["지붕", "천장", "마루", "합판"], "answer": 2, "explain": "प्रश्नको अर्थ: यो घरभित्र मानिसहरू हिँड्न वा बस्नका लागि काठबाट समतल बनाइएको भुइँको भाग हो। यसले बसाइलाई आरामदायी बनाउँछ।\n① 지붕 भनेको छानो हो। ✗\n② 천장 भनेको घरको छानाको भित्री भाग (सिलिङ) हो। ✗\n③ 마루 भनेको घरको काठको फ्लोर वा पिँढी हो, जसलाई हिँड्न र बस्न मिल्ने गरी सम्याइएको हुन्छ ✓\n④ 합판 भनेको प्लेइवुड हो। ✗"}, {"n": "67", "q": "방 바닥을 따뜻하게 데우는 한국 전통 난방 방식으로 아궁이에서 불을 피워 바닥 아래로 열기를 보내 방 전체를 따뜻하게 합니다.", "options": ["한옥", "민박", "마당", "온돌"], "answer": 3, "explain": "प्रश्नको अर्थ: यो कोरियाको परम्परागत कोठा न्यानो पार्ने प्रविधि हो। भुइँमुनि आगोको राप पठाएर पूरै कोठा न्यानो बनाइन्छ।\n① 한옥 भनेको परम्परागत कोरियन घर हो। ✗\n② 민박 भनेको होमस्टे हो। ✗\n③ 마당 भनेको आँगन हो। ✗\n④ 온돌 भनेको ओण्डोल हो, जुन कोरियन परम्परागत तातो बनाउने प्रणाली हो जसले आगो बालेर कोठा न्यानो पार्छ ✓"}, {"n": "68", "q": "태양의 움직임을 기준으로 만든 달력으로, 우리가 일상에서 사용하는 일반적인 영어 달력입니다.", "options": ["음력", "양력", "일과", "소설"], "answer": 1, "explain": "प्रश्नको अर्थ: यो सूर्यको गतिमा आधारित भएर बनाइएको पात्रो हो। हामीले दैनिक जीवनमा प्रयोग गर्ने सामान्य क्यालेन्डर यही हो।\n① 음력 भनेको चन्द्रमामा आधारित पात्रो (चन्द्र पात्रो) हो। ✗\n② 양력 भनेको सूर्यको चालमा आधारित पात्रो (सौर्य पात्रो) हो, जसलाई हामी दैनिक जीवनमा प्रयोग गर्ने अंग्रेजी पात्रो भन्छौं ✓\n③ 일과 भनेको दैनिकी हो। ✗\n④ 소설 भनेको उपन्यास हो। ✗"}, {"n": "69", "q": "달의 움직임을 기준으로 만든 달력으로, 전통 명절이나 제사와 같은 행사에 주로 사용됩니다.", "options": ["음력", "양력", "일정", "약속"], "answer": 0, "explain": "प्रश्नको अर्थ: यो चन्द्रमाको गतिमा आधारित भएर बनाइएको पात्रो हो। यो परम्परागत चाडपर्व वा विशेष पूजाआजाको मिति तय गर्न प्रयोग गरिन्छ।\n① 음력 भनेको चन्द्रमाको चालमा आधारित पात्रो हो, जुन परम्परागत चाडपर्व र पितृपूजा जस्ता कार्यक्रममा प्रयोग हुन्छ ✓\n② 양력 भनेको सौर्य पात्रो हो। ✗\n③ 일정 भनेको तालिका हो। ✗\n④ 약속 भनेको बाचा हो। ✗"}, {"n": "70", "q": "한국에서 생일 때 빠지지 않고 꼭 먹는 음식, 특히 산모가 아기를 낳은 후 이것을 먹습니다.", "options": ["불고기", "미역국", "케이크", "삼계탕"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कोरियामा जन्मदिनमा अनिवार्य रूपमा खाइने विशेष परिकार हो। विशेष गरी सुत्केरी महिलाले बच्चा जन्माएपछि यो खाने गर्छन्।\n① 불고기 भनेको बुलगोकी (मासुको परिकार) हो। ✗\n② 미역국 भनेको समुद्री लेउको झोल (मियाकगुक) हो, जुन कोरियनहरूले जन्मदिनमा र बच्चा जन्माएपछि आमाले खाने गर्छन् ✓\n③ 케이크 भनेको केक हो। ✗\n④ 삼계탕 भनेको सामगे탕 (कुखुराको सुप) हो। ✗"}, {"n": "71", "q": "한국의 대표적인 명절로 음력 1월 1일에 한 해가 시작되는 것을 축하하면서 기념하는 날입니다. 가족들이 모여서 차례를 지내고 어른들께 세배를 합니다.", "options": ["단오", "폐백", "설날", "추석"], "answer": 2, "explain": "प्रश्नको अर्थ: यो नयाँ वर्षको पहिलो दिन मनाइने कोरियाको ठूलो चाड हो। यस दिन परिवारका मानिसहरू भेला भएर मान्यजनलाई ढोग्छन् र आशिर्वाद लिन्छन्।\n① 단오 भनेको दानो पर्व हो। ✗\n② 폐백 भनेको बिहेको एक परम्परागत विधि हो। ✗\n③ 설날 भनेको सोलाल (नयाँ वर्ष) हो, जुन चन्द्र पात्रो अनुसारको पुस/माघ १ गते मनाइन्छ र जसमा परिवार जम्मा भएर पुजा गर्छन् तथा आशीर्वाद लिन्छन् ✓\n④ 추석 भनेको छुसक पर्व हो। ✗"}, {"n": "72", "q": "한국의 대표적인 명절로 '한가위'라고도 합니다. 아침에 성묘를 하고 차례를 지냅니다. 이날에는 갓 수확한 쌀로 쌀밥을 짓고 송편을 만들어 먹습니다.", "options": ["설날", "추석", "정월대보름", "크리스마스"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कोरियाको मुख्य बाली भित्र्याउने समयमा मनाइने अर्को ठूलो चाड हो। यस दिन नयाँ चामलको भात र विशेष प्रकारको पिठोको मीठो परिकार बनाएर खाइन्छ।\n① 설날 भनेको सोलाल हो। ✗\n② 추석 भनेको छुसक हो, जसलाई 'हानगावी' पनि भनिन्छ र यसमा नयाँ चामलको भात र सोङप्योन खाइन्छ ✓\n③ 정월대보름 भनेको पहिलो पूर्णिमाको दिन हो। ✗\n④ 크리스마스 भनेको क्रिसमस हो। ✗"}, {"n": "73", "q": "어떤 사람이 세상에 태어난 것을 해마다 한 번씩 기념하거나 축하하는 날입니다.", "options": ["돌잔치", "생일", "결혼식", "제사"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कुनै व्यक्ति जन्मिएको दिनको सम्झनामा हरेक वर्ष एक पटक मनाइने विशेष खुसीको दिन हो।\n① 돌잔치 भनेको बच्चाको पहिलो जन्मदिनको उत्सव हो। ✗\n② 생일 भनेको जन्मदिन हो, जसले कोही व्यक्ति संसारमा जन्मिएको दिनलाई हरेक वर्ष मनाउने वा उत्सव मनाउने दिनलाई जनाउँछ ✓\n③ 결혼식 भनेको विवाह समारोह हो। ✗\n④ 제사 भनेको पितृपूजा हो। ✗"}, {"n": "74", "q": "직장이나 일터로 일을 하러 가는 것을 말합니다. 보통 아침에 일정한 시간에 회사나 근무지로 나가는 것을 뜻합니다.", "options": ["출근", "퇴근", "조퇴", "결근"], "answer": 0, "explain": "प्रश्नको अर्थ: यसले काम गर्नका लागि बिहान तोकिएको समयमा कार्यालय वा कार्यस्थलतिर जानुलाई जनाउँछ।\n① 출근 भनेको काममा जानु (प्रवेश गर्नु) हो, जसले बिहान निश्चित समयमा कम्पनी वा काम गर्ने ठाउँमा जानुलाई बुझाउँछ ✓\n② 퇴근 भनेको कामबाट छुट्नु हो। ✗\n③ 조퇴 भनेको चाँडै कामबाट घर फर्किनु हो। ✗\n④ 결근 भनेको अनुपस्थित हुनु हो। ✗"}, {"n": "75", "q": "하루 일과를 마치고 직장에서 집으로 돌아가는 것을 말합니다. 보통 일 끝난 후에 일터에서 나오는 것을 뜻합니다.", "options": ["퇴근", "휴일", "취직", "출석"], "answer": 0, "explain": "प्रश्नको अर्थ: यसले दिनभरिको काम सकेर कार्यस्थलबाट घर फर्कनुलाई जनाउँछ।\n① 퇴근 भनेको कामबाट छुट्नु हो, जसले दिनभरको काम सकेर अफिसबाट घर फर्किनुलाई बुझाउँछ ✓\n② 휴일 भनेको बिदाको दिन हो। ✗\n③ 취직 भनेको जागिर खानु हो। ✗\n④ 출석 भनेको हाजिरी हो। ✗"}, {"n": "76", "q": "의무가 있어 전문적으로 하는 것이 아니라 일상 생활에서 즐기기 위하여 하는 여러 활동을 말할 수 있습니다.", "options": ["사회 활동", "직장 활동", "취미 활동", "봉사 활동"], "answer": 2, "explain": "प्रश्नको अर्थ: यो अनिवार्य काम वा पेशा नभई खाली समयमा आनन्द र मनोरञ्जनका लागि गरिने क्रियाकलाप हो।\n① 사회 활동 भनेको सामाजिक गतिविधि हो, यो रमाइलोको लागि मात्र गर्ने होइन। ✗\n② 직장 활동 भनेको कार्यालयको काम हो, यो फुर्सदको समयमा गर्ने क्रियाकलाप होइन। ✗\n③ 취미 활동 भनेको रुचि वा पारखी गतिविधि हो, जुन अनिवार्य नभई दैनिक जीवनमा रमाइलोको लागि गरिन्छ र प्रश्नसँग मिल्छ। ✓\n④ 봉사 활동 भनेको स्वयंसेवा हो, यो फुर्सदमा गर्ने रुचि मात्र होइन। ✗"}, {"n": "77", "q": "3한 4온 현상이 나타나는 계절로, 눈이 내리고 기온 이 낮아 사람들이 따뜻한 옷을 입고 실내 활동을 많이 합니다.", "options": ["봄", "여름", "가을", "겨울"], "answer": 3, "explain": "प्रश्नको अर्थ: यो हिउँ पर्ने र अत्याधिक जाडो हुने मौसम हो। यस समयमा मानिसहरू न्यानो लुगा लगाएर धेरैजसो घरभित्रै बस्छन्।\n① 봄 भनेको वसन्त ऋतु हो, यो हिउँ पर्ने मौसम होइन। ✗\n② 여름 भनेको गर्मी ऋतु हो, यो चिसो मौसम होइन। ✗\n③ 가을 भनेको शरद ऋतु हो, यो जाडो ऋतु होइन। ✗\n④ 겨울 भनेको जाडो ऋतु हो, जसमा हिउँ पर्छ र तापक्रम कम हुन्छ अनि मानिसहरू न्यानो कपडा लगाएर घरभित्र बढी बस्छन् र प्रश्नसँग मिल्छ। ✓"}, {"n": "78", "q": "날씨가 따뜻해지고 꽃이 피며, 새싹이 돋는 생명의 계절입니다. 겨울의 추위가 지나고 자연이 다시 깨어나는 시기입니다.", "options": ["가을", "봄", "겨울", "여름"], "answer": 1, "explain": "प्रश्नको अर्थ: यो जाडो सकिएपछि मौसम न्यानो हुने, फूलहरू फुल्ने र पालुवा पलाउने हरियाली ऋतु हो।\n① 가을 भनेको पातहरू पहेँलो हुने र झर्ने ऋतु हो, यो यस विवरणसँग मिल्दैन। ✗\n② 봄 भनेको मौसम न्यानो हुने, फूलहरू फुल्ने र नयाँ पालुवा पलाउने वसन्त ऋतु हो, यो नै सही उत्तर हो। ✓\n③ 겨울 भनेको धेरै चिसो हुने हिउँद ऋतु हो, यो यस विवरणसँग मिल्दैन। ✗\n④ 여름 भनेको घाम चर्को लाग्ने र गर्मी हुने ग्रष्म ऋतु हो, यो यस विवरणसँग मिल्दैन। ✗"}, {"n": "79", "q": "햇볕이 강하고 가장 더운 계절로, 장마와 소나기가 자주 나타납니다. 사람들은 시원한 곳을 찾아 피서 를 즐깁니다.", "options": ["봄", "겨울", "가을", "여름"], "answer": 3, "explain": "प्रश्नको अर्थ: यो वर्षको सबैभन्दा गर्मी हुने र धेरै पानी पर्ने समय हो। मानिसहरू शीतलता खोज्दै पौडी खेल्न वा घुम्न जान्छन्।\n① 봄 भनेको मौसम न्यानो हुने र फूल फुल्ने वसन्त ऋतु हो, यो यस विवरणसँग मिल्दैन। ✗\n② 겨울 भनेको चिसो हुने हिउँद ऋतु हो, यो यस विवरणसँग मिल्दैन। ✗\n③ 가을 भनेको मौसम सफा र चिसो हुने शरद ऋतु हो, यो यस विवरणसँग मिल्दैन। ✗\n④ 여름 भनेको घाम चर्को लाग्ने, अत्यधिक गर्मी हुने र वर्षा हुने ग्रष्म ऋतु हो, यो नै सही उत्तर हो। ✓"}, {"n": "80", "q": "날씨가 선선해지고 나뭇잎이 붉게 물드는 계절입니다. 곡식과 과일이 익는 수확의 시기이기도 합니다.", "options": ["봄", "여름", "겨울", "가을"], "answer": 3, "explain": "प्रश्नको अर्थ: यो मौसम शीतल हुने, रूखका पातहरू पहेंला-राता हुने र फलफूल तथा अन्नबाली भित्र्याइने समय हो।\n① 봄 भनेको वसन्त ऋतु हो, यो यस विवरणसँग मिल्दैन। ✗\n② 여름 भनेको गर्मी हुने ग्रष्म ऋतु हो, यो यस विवरणसँग मिल्दैन। ✗\n③ 겨울 भनेको चिसो मौसमको हिउँद ऋतु हो, यो यस विवरणसँग मिल्दैन। ✗\n④ 가을 भनेको मौसम चिसो हुने, रूखका पातहरू राता हुने र बाली कटनी गरिने शरद ऋतु हो, यो नै सही उत्तर हो। ✓"}, {"n": "81", "q": "여름 초에 비가 여러 날 동안 계속 내리는 시기입니다. 습도가 높고 흐린 날이 많아 불쾌지수가 올라가기도 합니다.", "options": ["소나기", "이슬비", "장마철", "겨울철"], "answer": 2, "explain": "प्रश्नको अर्थ: यो ग्रीष्म ऋतुको सुरुमा धेरै दिनसम्म लगातार वर्षा हुने समय हो। यस बेला ओस बढी हुने र आकाश बादलले ढाक्ने गर्छ।\n① 소나기 (झरी/मुसलधारे पानी) हो, यो उत्तर मिलेन। ✗\n② 이슬비 (सिमसिमे पानी) हो, यो उत्तर मिलेन। ✗\n③ 장마철 (लामो वर्षायाम) हो, यो गर्मीको सुरुमा धेरै दिनसम्म लगातार पानी पर्ने समय हो ✓\n④ 겨울철 (हिउँद ऋतु) हो, यो उत्तर मिलेन। ✗"}, {"n": "82", "q": "기온이 매우 높고, 습도가 높아 더운 날씨가 지속되는 현상입니다. 이로 인해 몸이 피로하고 불쾌한 기 분이 들 수 있습니다.", "options": ["무더위", "장마철", "3한 4온", "성수기"], "answer": 0, "explain": "प्रश्नको अर्थ: यो तापक्रम धेरै उच्च हुने र गर्मी मौसम लामो समयसम्म रहने अवस्था हो। यसले शरीरलाई थकित बनाउन सक्छ।\n무더위 भनेको तापक्रम धेरै उच्च हुने र आर्द्रता बढेर अत्यधिक गर्मी महसुस हुने अवस्था हो, यो नै सही उत्तर हो। 장마철 भनेको लगातार पानी पर्ने वर्षायामको मौसम हो, यो यस विवरणसँग मिल्दैन। 삼한사온 भनेको कोरियामा जाडो मौसममा तीन दिन चिसो र चार दिन न्यानो हुने मौसमी क्रम हो, यो यस विवरणसँग मिल्दैन। 성수기 भनेको व्यापार वा पर्यटनको अत्यधिक व्यस्त र मुख्य मौसम हो, यो यस विवरणसँग मिल्दैन। सही उत्तर एक नम्बरको 무더위 हो जसको अर्थ अत्यधिक गर्मी हुन्छ। तेस्रो विकल्प '3한 4온' किताबमा छापिएजस्तै राखिएको छ — यो 삼한사온 को अङ्क-रूप हो।"}, {"n": "83", "q": "바다와 육지가 만나는 곳으로, 모래가 깔려 있고 바다를 가까이에서 즐길 수 있는 장소입니다. 여름철 에 많은 사람들이 휴식을 취하거나 물놀이를 즐깁 니다.", "options": ["호수", "해변", "산맥", "연못"], "answer": 1, "explain": "प्रश्नको अर्थ: यो समुद्र र जमिन जोडिन 매 (दाजुबहिनी/भाइदिदी) हो, यो उत्तर मिलेन। ✗\n④ 모녀 (आमा र छोरी) हो, यो उत्तर मिलेन। ✗"}, {"n": "91", "q": "같은 부모에게서 태어난 여자 형제들을 말합니다. 함께 자라며 정을 나누는 가까운 가족입니다.", "options": ["형제", "자매", "조카", "손자"], "answer": 1, "explain": "प्रश्नको अर्थ: यो एउटै आमाबुवाबाट जन्मिएका दिदीबहिनीहरूलाई जनाउने शब्द हो। उनीहरू सँगै हुर्कन्छन् र मिलेर बस्छन्।\n① 형제 को अर्थ दाजुभाइ वा दाजुभाइ-दिदीबहिनी हो, तर यो प्रश्नले 'महिला दाजुभाइ (दिदीबहिनी)' लाई मात्र भनेको हुनाले यो पूर्ण मिल्दैन। ✗\n② 자매 को अर्थ दिदीबहिनी हो र यो एउटै आमाबुवाबाट जन्मेका महिला दिदीबहिनीहरूलाई जनाउने शब्द भएकाले सही उत्तर हो। ✓\n③ 조카 को अर्थ भतिजा वा भतिजी हो। ✗\n④ 손자 को अर्थ नाति हो। ✗"}, {"n": "92", "q": "같은 부모에게서 태어난 오빠와 여동생 또는 형과 누이의 관계를 말합니다. 서로 다른 성별의 형제자매를 이르는 말입니다.", "options": ["조부", "남매", "부모", "자매"], "answer": 1, "explain": "प्रश्नको अर्थ: यो एउटै आमाबुवाबाट जन्मिएका दाजुभाइ र दिदीबहिनीको आपसी सम्बन्धलाई बुझाउने शब्द हो। यसमा विभिन्न लिङ्गका सहोदरहरू पर्छन्।\n① 조부 को अर्थ बाजे वा हजुरबुवा हो। ✗\n② 남매 को अर्थ दाजु-बहिनी वा भाइ-दिदी हो जुन विभिन्न लिङ्गका दाजुभाइ-दिदीबहिनीलाई बुझाउने शब्द भएकाले सही उत्तर हो। ✓\n③ 부모 को अर्थ आमाबुवा हो। ✗\n④ 자매 को अर्थ दिदीबहिनी हो। ✗"}, {"n": "93", "q": "사람의 생각이나 행동에서 나타나는 고유한 성질입니다. 태도, 감정 표현, 대인 관계 방식 등에 영향을 줍니다.", "options": ["행위", "신장", "성격", "외모"], "answer": 2, "explain": "प्रश्नको अर्थ: यो मानिसको सोचाइ र व्यवहारमा झल्किने विशेष गुण हो। यसले मानिसको स्वभाव र अरूसँगको व्यवहारलाई प्रभाव पार्छ।\n① 행위 भनेको काम वा व्यवहार हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 신장 भनेको मानिसको उचाइ हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 성격 भनेको मानिसको स्वभाव हो, जसले सोच र व्यवहारलाई देखाउँछ ✓\n④ 외모 भनेको मानिसको बाहिरी रूप हो, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "94", "q": "사람의 얼굴 생김새나 전체적인 겉모습을 말합니다. 첫인상이나 다른 사람에게 보이는 시각적인 특징에 해당합니다.", "options": ["체중", "신장", "외모", "태도"], "answer": 2, "explain": "प्रश्नको अर्थ: यो मानिसको मुहारको बनावट र बाहिरी रूप हो। यसले अरूलाई पहिलो नजरमा कस्तो देखिन्छ भन्ने कुरा जनाउँछ।\n① 체중 को अर्थ तौल हो। ✗\n② 신장 को अर्थ उचाइ हो। ✗\n③ 외모 को अर्थ बाह्य रूप वा मुहारको बनावट हो जुन मानिसको देखिने स्वरूप हो ✓\n④ 태도 को अर्थ बानी वा व्यवहार हो। ✗"}, {"n": "95", "q": "같은 취미를 가진 사람들이 취미 활동을 같이 하는 모임입니다.", "options": ["동호회", "운동회", "동문회", "금융회"], "answer": 0, "explain": "प्रश्नको अर्थ: यो एउटै रुचि भएका मानिसहरू मिलेर विभिन्न क्रियाकलाप गर्न बनाइएको समूह हो।\n① 동호회 को अर्थ रुचि वा सोख मिल्ने मानिसहरूको समूह (क्लब) हो, जसले सँगै सोखको काम गर्छन् र यो सही उत्तर हो। ✓\n② 운동회 को अर्थ खेलकुद प्रतियोगिता हो। ✗\n③ 동문회 को अर्थ पूर्वविद्यार्थीहरूको मिलन केन्द्र वा संघ हो। ✗\n④ 금융회 को अर्थ वित्तीय संस्था हो। ✗"}, {"n": "96", "q": "자신보다 나이가 많은 사람, 나이가 어려도 처음 만난 사람이나 별로 가깝지 않은 사람과 사용하는 말입니다.", "options": ["반말", "높임말", "외국어", "표준어"], "answer": 1, "explain": "प्रश्नको अर्थ: यो आफूभन्दा ठूला मानिस वा पहिलोपटक भेटेका अपरिचित मानिससँग बोल्दा प्रयोग गरिने आदरार्थी भाषा हो।\n① 반말 भनेको आफूभन्दा साना वा नजिकका मानिससँग बोलिने ठाडो भाषा हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 높임말 भनेको आफूभन्दा ठूला वा पहिलो पटक भेटिएका मानिससँग बोलिने आदरार्थी भाषा हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n③ 외국어 भनेको विदेशी भाषा हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 표준어 भनेको मानक भाषा हो, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "97", "q": "자기보다 나이가 어리거나 회사에서 직위가 낮은 사람에게 낮추어 하는 말입니다.", "options": ["반말", "높임말", "사투리", "모국어"], "answer": 0, "explain": "प्रश्नको अर्थ: यो आफूभन्दा साना वा पदमा तलका मानिससँग बोल्दा प्रयोग गरिने साधारण भाषा हो।\n① 반말 भनेको आफूभन्दा साना वा तल्लो पदका मानिसलाई बोलिने ठाडो भाषा हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n② 높임말 भनेको ठूला मानिसलाई प्रयोग गरिने आदरयुक्त भाषा हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 사투리 भनेको क्षेत्र अनुसार बोलिने स्थानीय भाषिका हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n④ 모국어 भनेको मातृभाषा हो, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "98", "q": "떠나는 사람을 기쁨 마음으로 보내는 뜻으로 같이 일하는 동료나 친구들이 모이는 자리입니다.", "options": ["야유회", "환영회", "환송회", "송년회"], "answer": 2, "explain": "प्रश्नको अर्थ: यो सँगै काम गरेका साथी वा सहकर्मीहरू टाढिन लाग्दा खुसीसाथ बिदाइ गर्न जम्मा हुने कार्यक्रम हो।\n① 야유회 भनेको सहकर्मीहरूसँग घुम्न जाने पिकनिक हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 환영회 भनेको नयाँ मानिसलाई स्वागत गर्ने कार्यक्रम हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 환송회 भनेको छाडेर जाने साथी वा सहकर्मीलाई बिदाइ गर्ने कार्यक्रम हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n④ 송년회 भनेको वर्षको अन्त्यमा गरिने भोज हो, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "99", "q": "밥에 여러 가지 나물, 고기, 고추장 등을 올리고 잘 섞어 먹는 한국 음식이에요. 다양한 재료가 어우러져 맛있고 영양가가 높습니다.", "options": ["김치", "비빔밥", "불고기", "삼계탕"], "answer": 1, "explain": "प्रश्नको अर्थ: यो भातमा विभिन्न तरकारी, मासु र पिरो मसला मिसाएर खाइने कोरियन खाना हो। यसमा धेरै प्रकारका पौष्टिक तत्व हुन्छन्।\n① 김치 को अर्थ किम्ची हो। ✗\n② 비빔밥 को अर्थ बिबिम्बाब हो जुन भातमा तरकारी, मासु र खोर्सानीको पेस्ट (कोचुजाङ) मिसाएर खाइने कोरियाली खाना हो ✓\n③ 불고기 को अर्थ बुलगोगी हो। ✗\n④ 삼계탕 को अर्थ साम्येतं हो। ✗"}, {"n": "100", "q": "얇게 썬 고기를 간장, 설탕, 마늘 등으로 양념해 구워 먹는 한국 음식입니다. 보통 소고기나 돼지고기를 사용하며, 달콤하고 짭짤한 맛이 특징입니다.", "options": ["삼겹살", "삼계탕", "불고기", "제육볶음"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पातलो गरी काटिएको मासुलाई विभिन्न मसलाले मोलेर पोलेर खाइने कोरियन खाना हो। यसको स्वाद गुलियो र नुनिलो किसिमको हुन्छ।\n① 삼겹살 भनेको बंगुरको पेटको मासु पोलेर खाने परिकार हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n② 삼계탕 भनेको कुखुराको मासुमा जडीबुटी हालेर बनाइने सुप हो, त्यसैले यो विवरणसँग मिल्दैन। ✗\n③ 불고기 भनेको मसिनो गरी काटेको मासुमा भटमासको सस र चिनी हालेर पकाउने गुलियो-नुनिलो कोरियाली खाना हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n④ 제육볶음 भनेको पिरो लेदोमा भुटेको बंगुरको मासु हो, त्यसैले यो विवरणसँग मिल्दैन। ✗"}, {"n": "101", "q": "된장(된장 발효된 콩)을 넣고 끓인 국물 요리이고 보통 두부, 야채, 고기 등을 함께 넣어 맛을 내며, 구수하고 건강한 맛이 특징입니다.", "options": ["닭도리탕", "삼계탕", "된장찌개", "김치찌개"], "answer": 2, "explain": "प्रश्नको अर्थ: भिजाइएको वा किण्वन गरिएको सोयाबिन मिसाएर बनाइने एक प्रकारको झोलिलो खाना हो। यसमा सामान्यतया तरकारी र मासु मिसाइन्छ।\n① 닭도리탕 को अर्थ डक्ताोरिताङ हो। ✗\n② 삼계탕 को अर्थ साम्येतं हो। ✗\n③ 된장찌개 को अर्थ थेन्जाङ्찌गे हो जुन भटमासको पेस्ट (थेन्जाङ) हालेर बनाइने झोल परिकार हो र यसमा तोफु, तरकारी आदि मिसाइन्छ ✓\n④ 김치찌개 को अर्थ किम्ची찌गे हो। ✗"}, {"n": "102", "q": "잘 익은 김치를 주 재료로 한 한국의 전통 찌개로 돼지고기나 두부, 야채 등을 넣고 끓여 먹는 매콤하고 국물이 많은 음식입니다.", "options": ["감자탕", "갈비탕", "된장찌개", "김치찌개"], "answer": 3, "explain": "प्रश्नको अर्थ: राम्रोसँग पाकेको किम्चिलाई मुख्य सामग्रीको रूपमा प्रयोग गरेर बनाइने एक प्रकारको कोरियाली परम्परागत झोलिलो परिकार हो। यसमा सुँगुरको मासु वा तोफु हालेर पकाइन्छ।\n① 감자탕 को अर्थ कामजाथाङ हो। ✗\n② 갈비탕 को अर्थ काल्भिथाङ हो। ✗\n③ 된장찌개 को अर्थ थेन्जाङ्찌गे हो। ✗\n④ 김치찌개 को अर्थ किम्ची찌गे हो जुन पाकेको किम्ची मुख्य सामग्री, तोफु र सुँगुरको मासु हालेर उमालेको पिरो र झोलयुक्त परिकार हो ✓"}, {"n": "103", "q": "끓는 물에 면과 스프를 넣어 간단하게 만드는 즉석 국수이고 매운 맛이나 순한 맛 등 다양한 종류가 있어, 빠르고 맛있게 먹을 수 있는 음식입니다.", "options": ["라면", "만두", "잡채", "간장"], "answer": 0, "explain": "प्रश्नको अर्थ: उम्लिएको पानीमा चाउचाउ र मसला हालेर छिटो बनाइने तत्काल खान मिल्ने परिकार हो। यो छिटो र स्वादिलो तरिकाले खान सकिन्छ।\n① 라면 को अर्थ राम्युन (इन्स्ट्यान्ट चाउचाउ) हो जुन उम्लिएको पानीमा चाउचाउ र मसला हालेर सजिलै बनाइने र छिटो खान सकिने परिकार हो ✓\n② 만두 को अर्थ मोमो/मान्दु हो। ✗\n③ 잡채 को अर्थ चाप्चे हो। ✗\n④ 간장 को अर्थ सोया सस हो। ✗"}, {"n": "104", "q": "배추 또는 무 등을 소금에 절여서 고춧가루, 파, 마늘, 생강 등의 양념을 버무린 뒤 발효시킨 음식입니다.", "options": ["잡채", "김밥", "만두", "김치"], "answer": 3, "explain": "प्रश्नको अर्थ: बन्दाकोबी वा मुलालाई नुनमा मोलेर खुर्सानीको धुलो, लसुन र अदुवा आदि मसला मिसाएर बनाइएको किण्वित परिकार हो।\n① 잡채 को अर्थ चाप्चे हो। ✗\n② 김밥 को अर्थ किम्बाब हो। ✗\n③ 만두 को अर्थ मान्दु हो। ✗\n④ 김치 को अर्थ किम्ची हो जुन बन्दाकोबी वा मुलालाई नुनमा गलाएर खुर्सानीको धुलो, लसुन, अदुवा आदि मसला मिसाई किण्वन (फमेन्टेशन) गरेर बनाइएको परिकार हो ✓"}, {"n": "105", "q": "소금과 참기름으로 맛을 낸 밥을 시금치, 단무지, 당근, 달걀 등 속재료를 넣고 김으로 말아서 입의 크기로 썰어 낸 음식입니다.", "options": ["김밥", "만두", "김치", "잡채"], "answer": 0, "explain": "प्रश्नको अर्थ: नुन र तिलको तेलले स्वादिलो बनाइएको भातमा विभिन्न तरकारीहरू राखेर बङ्साराले बेरी काटिने खानेकुरा हो।\n① 김밥 को अर्थ किम्बाब हो जुन नुन र तिलको तेलले स्वाद सुधारेको भातमा पालक, मुलाको अचार (दानमुजी), गाजर, अण्डा आदि सामग्री राखेर समुद्री लेउ (किम) ले बेरेर मुखको आकारमा काटेको परिकार हो ✓\n② 만두 को अर्थ मान्दु हो। ✗\n③ 김치 को अर्थ किम्ची हो। ✗\n④ 잡채 को अर्थ चाप्चे हो। ✗"}, {"n": "106", "q": "중국에서 유래한 한국의 인기 있는 면 요리예요. 고소한 짜장 소스에 면을 비벼 먹으며, 보통 돼지고기와 채소가 들어갑니다.", "options": ["라면", "돈가스", "자장면", "탕수육"], "answer": 2, "explain": "प्रश्नको अर्थ: चीनबाट आएको कोरियामा धेरै रुचाइने चाउचाउको परिकार हो। यसमा कालो सससँग चाउचाउ मिसाएर खाइन्छ।\n① 라면 भनेको चाउचाउ हो, यो विवरणसँग मिल्दैन। ✗\n② 돈가스 भनेको सुँगुरको मासुको कटलेट हो, यो सही उत्तर होइन। ✗\n③ 자장면 भनेको कालो सससँग मिसाएर खाने चिनियाँ शैलीको चाउचाउ हो ✓\n④ 탕수육 भनेको गुलियो र अमिलो सस भएको सुँगुरको मासु हो, यो मिल्दैन। ✗"}, {"n": "107", "q": "물건을 사거나 서비스를 이용한 후, 지불한 금액과 내용을 적어 주는 문서입니다.", "options": ["청구서", "영수증", "자격증", "신분증"], "answer": 1, "explain": "प्रश्नको अर्थ: सामान किनेपछि वा सेवा लिएपछि तिरेको रकम र विवरण लेखेर दिइने कागजात हो।\n① 청구서 भनेको बिल वा भुक्तानीको माग गर्ने कागजात हो, यो विवरणसँग मिल्दैन। ✗\n② 영수증 भनेको सामान किनेपछि रकम र विवरण लेखेर दिने रसिद हो ✓\n③ 자격증 भनेको योग्यताको प्रमाणपत्र हो, यो मिल्दैन। ✗\n④ 신분증 भनेको परिचय पत्र हो, यो मिल्दैन। ✗"}, {"n": "108", "q": "밥과 함께 먹는 작은 양의 음식으로, 다양한 종류가 있고 김치, 나물, 찌개 등 여러 가지로 함께 먹으면서 밥을 맛있게 즐길 수 있습니다.", "options": ["음료", "반찬", "후식", "비채식"], "answer": 1, "explain": "प्रश्नको अर्थ: भातसँग खाने सानो मात्राको परिकार हो, जुन विभिन्न किसिमका हुन्छन् र भातसँगै खाएर आनन्द लिन सकिन्छ।\n① 음료 भनेको पेय पदार्थ हो, यो भातसँग खाइने मुख्य तरकारी होइन। ✗\n② 반찬 भनेको तरकारी वा परिकार हो, यो भातसँग किम्ची, साग, जिगे आदि मिलाएर खाइने भएकाले विवरणसँग मिल्छ। ✓\n③ 후식 भनेको खाना खाएपछि खाइने डेजर्ट हो, यो भातसँग खाने कुरा होइन। ✗\n④ 비채식 भनेको मांसाहारी भोजन हो, यसले भातसँग खाने परिकारलाई मात्र जनाउँदैन। ✗"}, {"n": "109", "q": "식당이나 매장에서 주문이나 결제를 할 수 있도록 설치된 무인 기계이며 사람 없이도 스스로 메뉴를 선택하고 계산할 수 있습니다.", "options": ["키오스크", "계산기", "식당표", "할인쿠폰"], "answer": 0, "explain": "प्रश्नको अर्थ: रेस्टुरेन्ट वा पसलमा आफैँले अर्डर गर्न वा पैसा तिर्न राखिएको मेसिन हो, जसमा मानिसबिना नै परिकार छनौट गर्न सकिन्छ।\n① 키오스크 भनेको अर्डर र भुक्तानी गर्न राखिएको स्वचालित मेशिन हो ✓\n② 계산기 भनेको क्याल्कुलेटर (हिसाब गर्ने यन्त्र) हो, यो मिल्दैन। ✗\n③ 식당표 भनेको रेस्टुरेन्टको तालिका वा मेनु हो, यो मिल्दैन। ✗\n④ 할인쿠폰 भनेको छुटकुपन हो, यो मिल्दैन। ✗\nशिक्षकको उत्तर-पत्र: ④ 할인쿠폰 — मेरो उत्तर: ① 키오스크। रेस्टुरेन्ट/पसलमा अर्डर र भुक्तानी गर्ने मानवरहित मेसिन भनेको कियोस्क (키오스크) हो; छुट कुपन (할인쿠폰) सँग कुनै सम्बन्ध छैन। नोट: तालिकाको ④ दोस्रो 110 (지폐) सँग मिल्छ।"}, {"n": "110", "q": "국가에서 공식적으로 발행한 종이 형태의 화폐로, 물건을 사거나 서비스를 이용할 때 사용하는 돈입니다.", "options": ["동전", "우표", "수표", "지폐"], "answer": 3, "explain": "प्रश्नको अर्थ: सरकारले आधिकारिक रूपमा निकालेको कागजको रूपमा रहेको नोट हो, जुन सामान किन्दा प्रयोग गरिन्छ।\n① 동전 भनेको सिक्का हो, यो मिल्दैन। ✗\n② 우표 भनेको हुलाक टिकट हो, यो मिल्दैन। ✗\n③ 수표 भनेको चेक हो, यो मिल्दैन। ✗\n④ 지폐 भनेको कागजको नोट हो ✓"}, {"n": "111", "q": "금속으로 만든 화폐로, 주로 지폐보다 적은 금액을 나타내며 물건을 사거나 거스름돈으로 사용합니다.", "options": ["지폐", "우표", "수표", "동전"], "answer": 3, "explain": "प्रश्नको अर्थ: धातुबाट बनाइएको पैसा हो, जुन सामान्यतया नोटभन्दा सानो रकमका लागि प्रयोग गरिन्छ।\n① 지폐 भनेको कागजको नोट हो, यो मिल्दैन। ✗\n② 우표 भनेको हुलाक टिकट हो, यो मिल्दैन। ✗\n③ 수표 भनेको चेक हो, यो मिल्दैन। ✗\n④ 동전 भनेको धातुले बनेको सिक्का हो ✓"}, {"n": "112", "q": "은행이나 카드 회사에서 발급하는 플라스틱 카드로, 물건을 살 때 현금 없이 결제하고 나중에 돈을 갚는 방식입니다.", "options": ["직불카드", "신용카드", "현금카드", "상품권"], "answer": 1, "explain": "प्रश्नको अर्थ: बैंक वा कार्ड कम्पनीले दिने प्लास्टिकको कार्ड हो, जसबाट नगदबिना नै सामान किन्न सकिन्छ।\n① 직불카드 भनेको डेबिट कार्ड हो, यो मिल्दैन। ✗\n② 신용카드 भनेको क्रेडिट कार्ड हो जसले पछि पैसा तिर्ने गरी सामान किन्न मिल्छ ✓\n③ 현금카드 भनेको क्यास कार्ड (नगद कार्ड) हो, यो मिल्दैन। ✗\n④ 상품권 भनेको उपहार भौचर हो, यो मिल्दैन। ✗"}, {"n": "113", "q": "구입한 물품을 마음에 들지 않거나 다른 불편한 점이 있을 때 주어진 기간에 바꿀 수 있는 것을 말합니다.", "options": ["환불", "수출", "교환", "수입"], "answer": 2, "explain": "प्रश्नको अर्थ: किनेको सामान मन नपरेमा वा समस्या भएमा तोकिएको समयभित्र अर्को सामानसँग फेर्न सकिने कुरालाई बुझाउँछ।\n① 환불 भनेको पैसा फिर्ता लिनु हो, यो मिल्दैन। ✗\n② 수출 भनेको निर्यात हो, यो मिल्दैन। ✗\n③ 교환 भनेको किनेको सामान फेर्नु (साटासाट गर्नु) हो ✓\n④ 수입 भनेको आयात हो, यो मिल्दैन। ✗"}, {"n": "114", "q": "구입한 물건을 판매자에게 돌려주고 지불한 돈의 전부 또는 일부를 되돌려 받는 것을 말합니다.", "options": ["교환", "환불", "반품", "손실"], "answer": 1, "explain": "प्रश्नको अर्थ: किनेको सामान बिक्रेतालाई फिर्ता गरेर तिरेको पैसा पुरा वा आंशिक रूपमा फिर्ता लिने कामलाई बुझाउँछ।\n① 교환 भनेको सामान साट्नु हो, यो मिल्दैन। ✗\n② 환불 भनेको पैसा फिर्ता लिनु हो ✓\n③ 반품 भनेको सामान फिर्ता गर्नु हो तर यहाँ पैसा फिर्ता लिने कुरा गरिएको छ त्यसैले 환불 मिल्छ। ✗\n④ 손실 भनेको नोक्सान हो, यो मिल्दैन। ✗"}, {"n": "115", "q": "직원 없이 운영되는 가게로, 손님이 직접 물건을 고르고 계산까지 스스로 하는 곳으로 주로 키오스크나 자동결제 시스템을 이용해 물건을 살 수 있습니다.", "options": ["백화점", "수퍼마켓", "무인 판매점", "할인 행사"], "answer": 2, "explain": "प्रश्नको अर्थ: यो पसलमा काम गर्ने मानिस हुँदैन र ग्राहकले आफैँ सामान छिनेर दाम तिर्छन्।\n① 백화점 भनेको डिपार्टमेन्ट स्टोर हो, यो मिल्दैन। ✗\n② 수퍼마켓 भनेको सुपरमार्केट हो, यो मिल्दैन। ✗\n③ 무인 판매점 भनेको कर्मचारी बिना चल्ने मानवविहीन पसल हो ✓\n④ 할인 행사 भनेको छुटको कार्यक्रम हो, यो मिल्दैन। ✗"}, {"n": "116", "q": "물건을 사거나 서비스를 이용한 뒤, 그에 대한 돈을 지불하는 것을 말하며 현금, 카드, 모바일 등 다양한 방법으로 결제할 수 있습니다.", "options": ["입금", "이체", "결제", "반품"], "answer": 2, "explain": "प्रश्नको अर्थ: सामान किनेपछि वा सेवा लिएपछि त्यसबापतको पैसा तिर्ने काम हो, जुन विभिन्न तरिकाले गर्न सकिन्छ।\n① 입금 भनेको बैंकमा पैसा जम्मा गर्नु हो, यो मिल्दैन। ✗\n② 이체 भनेको पैसा स्थानान्तरण गर्नु हो, यो मिल्दैन। ✗\n③ 결제 भनेको सामान वा सेवाको मूल्य भुक्तानी गर्नु हो ✓\n④ 반품 भनेको सामान फिर्ता गर्नु हो, यो मिल्दैन। ✗"}, {"n": "117", "q": "재활용이나 음식물 쓰레기로 분류되지 않는 쓰레기로, 소각이나 매립이 필요한 쓰레기입니다.", "options": ["일반쓰레기", "재활용 쓰레기", "대형 쓰레기", "음식물 쓰레기"], "answer": 0, "explain": "प्रश्नको अर्थ: पुनःप्रयोग वा फोहोरको रूपमा वर्गीकरण नहुने, जलाउन वा गाड्नुपर्ने फोहोर हो।\n① 일반쓰레기 भनेको सामान्य फोहोर (जुन पुनर्चक्रण हुँदैन) हो ✓\n② 재활용 쓰레기 भनेको पुनर्चक्रण गर्ने फोहोर हो, यो मिल्दैन। ✗\n③ 대형 쓰레기 भनेको ठूला फोहोरहरू हुन्, यो मिल्दैन। ✗\n④ 음식물 쓰레기 भनेको खानाको फोहोर हो, यो मिल्दैन। ✗"}, {"n": "118", "q": "다시 사용할 수 있도록 분리하여 버리는 쓰레기로, 자원을 절약하고 환경을 보호하는 데 도움이 됩니다.", "options": ["일반쓰레기", "재활용 쓰레기", "대형 쓰레기", "음식물 쓰레기"], "answer": 1, "explain": "प्रश्नको अर्थ: फेरि प्रयोग गर्न मिल्ने गरी छुट्याएर फालिने फोहोर हो, जसले वातावरण संरक्षण गर्न मद्दत गर्दछ।\n① 일반쓰레기 भनेको सामान्य फोहोर हो, यो मिल्दैन। ✗\n② 재활용 쓰레기 भनेको पुनर्चक्रण गर्न मिल्ने फोहोर हो ✓\n③ 대형 쓰레기 भनेको ठूला फोहोरहरू हुन्, यो मिल्दैन। ✗\n④ 음식물 쓰레기 भनेको खानाको फोहोर हो, यो मिल्दैन। ✗"}, {"n": "119", "q": "쓰레기나 재활용품 등을 모아 두는 용기로, 정해진 장소에 놓여 있어 사람들이 분리해서 버릴 수 있도록 도와줍니다.", "options": ["헌옷함", "청소함", "수거함", "공구함"], "answer": 2, "explain": "प्रश्नको अर्थ: फोहोर वा पुनःप्रयोग गर्ने वस्तुहरू जम्मा गर्ने भाँडो हो, जो तोकिएको ठाउँमा राखिएको हुन्छ।\n① 헌옷함 भनेको पुराना लुगा राख्ने बक्स हो, यो मिल्दैन। ✗\n② 청소함 भनेको सरसफाइको सामान राख्ने बक्स हो, यो मिल्दैन। ✗\n③ 수거함 भनेको फोहोर वा पुनर्चक्रण वस्तु सङ्कलन गर्ने भाँडो/बक्स हो ✓\n④ 공구함 भनेको औजार राख्ने बक्स हो, यो मिल्दैन। ✗"}, {"n": "120", "q": "옷이나 천의 주름을 펴고 매끄럽게 하기 위해 사용하는 가전제품으로 열을 이용해 옷의 주름을 없애는 데 사용돼요.", "options": ["밥솥", "냄비", "다리미", "냉장고"], "answer": 2, "explain": "प्रश्नको अर्थ: यो लुगाको चाउरी परेको भाग सीधा बनाउन तातो प्रयोग गर्ने घरेलु उपकरण हो।\n① 밥솥 भनेको भात पकाउने कुकर हो, यो मिल्दैन। ✗\n② 냄비 भनेको पट्ट वा भाँडो हो, यो मिल्दैन। ✗\n③ 다리미 भनेको लुगाको सुरो (चाउरी) पन्छाउने इस्त्री हो ✓\n④ 냉장고 भनेको फ्रिज हो, यो मिल्दैन। ✗"}, {"n": "121", "q": "철로 위를 달리는 대중교통 수단으로 전기를 사용하거나 디젤 엔진으로 움직이며, 정해진 노선을 따라 도시 간 이동이나 장거리 여행에 자주 이용됩니다.", "options": ["지하철", "택시", "버스", "기차"], "answer": 3, "explain": "प्रश्नको अर्थ: यो लामो दूरीको यात्रा गर्न र सहरहरू बीच आवतजावत गर्न प्रयोग हुने सार्वजनिक यातायात साधन हो।\n① 지하철 (भुमिगत रेल) हो, जुन शहरभित्र चल्छ। ✗\n② 택시 (ट्याक्सी) हो, जुन सडकमा चल्ने व्यक्तिगत सवारी साधन हो। ✗\n③ 버스 (बस) हो, जुन सडकमा चल्छ तर प्रश्नमा रेलको ट्र्याकमा चल्ने भनिएको छ। ✗\n④ 기차 (रेलगाडी) हो, जुन रेलवे ट्र्याकमा गुड्छ र लामो दूरीको यात्रामा प्रयोग हुन्छ ✓"}, {"n": "122", "q": "땅속에 설치된 철로를 따라 운행되는 도시형 대중교통수단입니다. 교통 혼잡을 피할 수 있어 빠르고 정시에 이동할 수 있습니다.", "options": ["고속열차", "지하철", "고속버스", "마을버스"], "answer": 1, "explain": "प्रश्नको अर्थ: यो जमिन मुनि बनेको रेलमार्गमा कुद्ने र छिटो यात्रा गर्न सहयोग गर्ने सहरको यातायात साधन हो।\n① 고속열차 (तीव्र गतिका रेल) हो, जुन शहरबाहिर लामो दूरीका लागि हो। ✗\n② 지하철 (भुमिगत रेल) हो, जुन जमिनमुनि बनेको रेलवे ट्र्याकमा चल्ने शहरी सार्वजनिक यातायात हो ✓\n③ 고속버스 (द्रुत बस) हो, जुन सडकमा चल्छ। ✗\n④ 마을버스 (गाउँ/स्थानीय बस) हो, जुन सडकमा चल्छ। ✗"}, {"n": "123", "q": "대개 표지판, 의자, 시간표 등이 설치되어 있고 어느 곳에 가기 위해 버스를 기다리기 편리한 장소입니다.", "options": ["지하철역", "버스 터미널", "기차역", "버스 정류장"], "answer": 3, "explain": "प्रश्नको अर्थ: यो सडकमा मानिसहरू गाडी कुर्दै बस्ने र समय तालिका राखिएको सुरक्षित ठाउँ हो।\nपहिलो विकल्प 지하철역 (मेट्रो स्टेशन) हो, जुन भुमिगत रेलका लागि हो। दोस्रो विकल्प 버스터미널 (बस टर्मिनल) हो, जुन ठूलो बसपार्क हो। तेस्रो विकल्प 기차역 (रेलवे स्टेशन) हो, जुन रेलका लागि हो। चौथो विकल्प 버스 정류장 (बस स्टप) हो, जहाँ बोर्ड, कुर्सी र समय तालिका राखिएको हुन्छ र बस पर्खन सजिलो हुन्छ, त्यसैले यो सही उत्तर हो। सही उत्तर 버스 정류장 (बस स्टप) हो।"}, {"n": "124", "q": "승객을 태우거나 내리게 하기 위해 정차하는 장소입니다. 표를 사는 곳, 대합실, 승강장 등이 갖추어져 있어 이용하는 사람들이 편리하게 이용할 수 있습니다.", "options": ["여객 터미널", "지하철역", "버스터미널", "버스 정류장"], "answer": 0, "explain": "प्रश्नको अर्थ: यहाँबाट मानिसहरूले टिकट काटेर गाडी चढेर टाढा-टाढा यात्रा गर्छन्।\n① 여객 터미널 (यात्रु टर्मिनल) हो, जहाँ टिकट काउन्टर, प्रतीक्षा कक्ष र प्लेटफर्महरू हुन्छन् र यात्रुहरू चढाउन वा ओराल्न रोकिन्छ ✓\n② 지하철역 (मेट्रो स्टेशन) हो, जुन ट्रेनका लागि हो। ✗\n③ 버스터미널 (बस टर्मिनल) हो, जुन बसका लागि मात्रै हुन्छ। ✗\n④ 버스 정류장 (बस स्टप) हो, जहाँ टिकट काउन्टर र प्रतीक्षा कक्ष हुँदैन। ✗\nशिक्षकको उत्तर-पत्र: ② 지하철역 — मेरो उत्तर: ① 여객 터미널। प्रश्नमा टिकट किन्ने ठाउँ, प्रतीक्षालय, प्लेटफर्म छ — सामान्य यात्री टर्मिनल हो; 지하철역 त सबवे मात्र हो, धेरै साँघुरो छ।"}, {"n": "125", "q": "배가 정박하고 사람이나 화물을 싣고 내릴 수 있는 해안 지역입니다. 주로 무역, 어업, 여객 운송 등을 위한 중요한 교통 중심지 역할을 합니다.", "options": ["터미널", "공항", "기차역", "항구"], "answer": 3, "explain": "प्रश्नको अर्थ: यो पानी जहाजहरू आएर बस्ने र सामान तथा मानिसहरू ओसार्ने ठाउँ हो।\n① 터미널 (टर्मिनल) हो, जुन बस वा यातायातका लागि हो। ✗\n② 공항 (विमानस्थल) हो, जुन जहाजका लागि हो। ✗\n③ 기차역 (रेलवे स्टेशन) हो, जुन रेलका लागि हो। ✗\n④ 항구 (बन्दरगाह) हो, जहाँ पानीजहाज रोकिएर मानिस वा सामान चढाइने र ओछ्याइने तटीय क्षेत्र हो ✓"}, {"n": "126", "q": "시속 200km 이상으로 달릴 수 있는 매우 빠른 열차입니다. 도시 간 이동 시간을 줄여주는 효율적인 교통수단입니다.", "options": ["지하철", "시내버스", "고속버스", "고속열차"], "answer": 3, "explain": "प्रश्नको अर्थ: यो धेरै तीव्र गतिमा कुद्ने र लामो यात्रा छोटो बनाउने साधन हो।\n① 지하철 (भुमिगत रेल) हो, जुन सामान्य गतिमा चल्छ। ✗\n② 시내버스 (शहरभित्रको बस) हो, जुन सुस्त हुन्छ। ✗\n③ 고속버스 (द्रुत बस) हो, जुन सडकमा चल्छ। ✗\n④ 고속열차 (तिब्र गतिको रेल) हो, जुन प्रतिघण्टा २०० किलोमिटरभन्दा बढी गतिमा कुद्न सक्ने धेरै छिटो चल्ने रेल हो ✓"}, {"n": "127", "q": "두 팀이 공을 차서 상대 팀의 골대에 넣어 점수를 겨루는 스포츠입니다. 전 세계에서 가장 인기 있는 스포츠 중 하나입니다.", "options": ["농구", "골프", "축구", "탁구"], "answer": 2, "explain": "प्रश्नको अर्थ: यो दुई टोलीले खुट्टाले बल प्रहार गरेर गोल गर्ने संसारभर प्रसिद्ध खेल हो।\n① 농구 (बास्केटबल) हो, जुन हातले खेलिन्छ। ✗\n② 골프 (गोल्फ) हो, जुन क्लबले बल हान्ने खेल हो। ✗\n③ 축구 (फुटबल) हो, जुन दुई टोलीले खुट्टाले बल प्रहार गरेर विपक्षीको गोलपोस्टमा छिराएर अंक जोड्ने खेल हो ✓\n④ 탁구 (टेबल टेनिस) हो, जुन टेबलमा खेलिन्छ। ✗"}, {"n": "128", "q": "작은 공을 라켓으로 쳐서 네트를 넘기며 상대와 주고받는 실내 스포츠입니다. 빠른 반사신경과 정밀한 컨트롤이 중요한 경기입니다.", "options": ["농구", "골프", "탁구", "헬스"], "answer": 2, "explain": "प्रश्नको अर्थ: यो सानो बल र ब्याट प्रयोग गरेर टेबलमा खेलिने भित्री खेल हो।\n① 농구 (बास्केटबल) हो, जुन ठूलो बलले खेलिन्छ। ✗\n② 골프 (गोल्फ) हो, जुन मैदानमा खेलिन्छ। ✗\n③ 탁구 (टेबल टेनिस) हो, जुन सानो बललाई र्याकेटले हानेर नेट पार गराई एकअर्कासँग खेल्ने इनडोर खेल हो ✓\n④ 헬스 (जिम/स्वास्थ्य व्यायाम) हो, जुन फिटनेस खेल हो। ✗"}, {"n": "129", "q": "두 팀이 공을 바구니에 넣어 점수를 겨루는 구기 스포츠입니다. 한 팀은 보통 5명으로 구성되며, 빠른 움직임과 팀워크가 중요합니다.", "options": ["축구", "농구", "배구", "스키"], "answer": 1, "explain": "प्रश्नको अर्थ: यो हातले बल टोकरीमा खसालेर खेलिने समूहगत खेल हो।\n① 축구 (फुटबल) हो, जुन खुट्टाले खेलिन्छ। ✗\n② 농구 (बास्केटबल) हो, जुन दुई टोलीले बल बास्केटमा हालेर अंक जोड्ने र प्रत्येक टोलीमा ५ जना हुने खेल हो ✓\n③ 배구 (भलिबल) हो, जुन नेटको माथिबाट बल छिराउने खेल हो। ✗\n④ 스키 (स्की) हो, जुन हिउँमा खेल्ने खेल हो। ✗"}, {"n": "130", "q": "체력 증진과 건강 유지를 위한 운동을 의미합니다. 보통 체육관에서 근력 운동, 유산소 운동 등을 포함한 다양한 운동을 진행합니다.", "options": ["탁구", "헬스", "운동", "회식"], "answer": 1, "explain": "प्रश्नको अर्थ: यो शरीरलाई स्वस्थ र बलियो बनाउन गरिने शारीरिक कसरत हो।\n① 탁구 (टेबल टेनिस) हो, जुन एक खेल मात्र हो। ✗\n② 헬스 (जिम/स्वास्थ्य व्यायाम) हो, जुन शारीरिक शक्ति बढाउन र स्वास्थ्य कायम राख्न गरिने व्यायाम हो ✓\n③ 운동 (व्यायाम/खेलकुद) हो, जुन धेरै व्यापक शब्द हो। ✗\n④ 회식 (सहकर्मीसँगको खाना/पार्टी) हो। ✗"}, {"n": "131", "q": "운동이나 체육 활동을 할 수 있도록 마련된 넓은 공간입니다. 학교, 공원, 체육 시설 등에 있으며 축구, 달리기 등 다양한 운동이 가능합니다.", "options": ["운동장", "헬스장", "회의실", "교실"], "answer": 0, "explain": "प्रश्नको अर्थ: यो खेलकुद खेल्नका लागि बनाइएको खुला र फराकिलो चौर हो।\n① 운동장 (खेल मैदान) हो, जुन खेलकुद वा शारीरिक गतिविधिको लागि तयार पारिएको फराकिलो ठाउँ हो ✓\n② 헬스장 (जिम हल) हो, जुन भित्री फिटनेस हल हो। ✗\n③ 회의실 (बैठक कक्ष) हो, जुन मिटिङका लागि हो। ✗\n④ 교실 (कक्षा कोठा) हो, जुन पढ्ने ठाउँ हो। ✗"}, {"n": "132", "q": "다양한 운동 기구와 시설을 갖추고 있어 사람들이 체력 단련이나 건강 관리를 위해 이용하는 장소입니다. 러닝머신, 웨이트 기구, 샤워실 등이 갖춰져 있습니다.", "options": ["운동장", "헬스장", "축구장", "탁구장"], "answer": 1, "explain": "प्रश्नको अर्थ: यो मानिसहरू गएर शरीरलाई तन्दुरुस्त बनाउने व्यायाम गर्ने ठाउँ हो।\n① 운동장 (खेल मैदान) हो, जुन बाहिरी मैदान हो। ✗\n② 헬스장 (जिम हल) हो, जहाँ विभिन्न व्यायाम उपकरण र सुविधाहरू हुन्छन् र मानिसहरूले शारीरिक व्यायामका लागि प्रयोग गर्छन् ✓\n③ 축구장 (फुटबल मैदान) हो। ✗\n④ 탁구장 (टेबल टेनिस खेल्ने हल) हो। ✗"}, {"n": "133", "q": "신이나 힘에 대한 믿음을 통하여 인간 생활의 어려움을 해결하고 삶의 긍정적인 의미를 추구하는 문화 체계입니다.", "options": ["약속", "교인", "종교", "신자"], "answer": 2, "explain": "प्रश्नको अर्थ: यो मानिसले आस्था राख्ने र जीवनको अर्थ खोज्ने विश्वासको प्रणाली हो।\n① 약속 (प्रतिज्ञा/वचन) हो। ✗\n② 교인 (चर्चको अनुयायी) हो। ✗\n③ 종교 (धर्म) हो, जुन देवता वा शक्तिको विश्वासमार्फत मानवीय जीवनका कठिनाइहरू समाधान गर्ने सांस्कृतिक प्रणाली हो ✓\n④ 신자 (श्रद्धालु/भक्त) हो। ✗"}, {"n": "134", "q": "일요일과 같이 국가나 사회에서 정하여진 휴일로 설날, 추석, 한글날, 삼일절 등이 이에 해당합니다.", "options": ["약정 휴일", "공휴일", "법정휴일", "주휴일"], "answer": 1, "explain": "प्रश्नको अर्थ: यो देश वा समाजले आधिकारिक रूपमा सबैलाई बिदा दिने दिन हो।\n① 약정 휴일 (सम्झौता गरिएको बिदा) हो। ✗\n② 공휴일 (सार्वजनिक बिदा) हो, जुन सरकार वा समाजले तोकेको बिदा हो जस्तै सोलनाल, छुसक, हान글 दिवस आदि ✓\n③ 법정휴일 (कानुनी बिदा) हो। ✗\n④ 주휴일 (साप्ताहिक बिदा) हो। ✗"}, {"n": "135", "q": "사람이 있거나 사물이 놓여 있는 장소를 말합니다. 기준이 되는 점이나 사물과의 관계로 표현됩니다.", "options": ["방향", "위치", "주소", "지역"], "answer": 1, "explain": "प्रश्नको अर्थ: यो कुनै पनि वस्तु वा मानिस रहेको निश्चित ठाउँ वा स्थान हो।\n① 방향 (दिशा) हो। ✗\n② 위치 (स्थान/अवस्थिति) हो, जसले मानिस वा वस्तु रहेको ठाउँलाई बुझाउँछ र आधार बिन्दुसँगको सम्बन्धबाट व्यक्त गरिन्छ ✓\n③ 주소 (ठेगाना) हो। ✗\n④ 지역 (क्षेत्र) हो। ✗"}, {"n": "136", "q": "보행자가 도로를 안전하게 건널 수 있도록 표시 해 놓은 길입니다. 보통 흰색 줄무늬로 표시되어 있으며, 신호등이 함께 설치되어 있는 경우도 많습니다.", "options": ["원형교차로", "횡단보도", "사거리", "삼거리"], "answer": 1, "explain": "प्रश्नको अर्थ: यो पैदल यात्रीहरूले सडक पार गर्न पाइने सुरक्षित गोरेटो बाटो हो।\n① 원형교차로 भनेको गोलो आकारको चोक हो, यो पैदलयात्री बाटो पार गर्ने ठाउँ होइन। ✗\n② 횡단보도 भनेको पैदलयात्रीहरूले सडक सुरक्षित रूपमा पार गर्नका लागि बनाइएको जेब्रा क्रसिङ हो ✓\n③ 사거리 भनेको चारवटा बाटो मिल्ने चोक हो। ✗\n④ 삼거리 भनेको तीनवटा बाटो मिल्ने चोक हो। ✗"}, {"n": "137", "q": "보행자가 차량 도로 위를 안전하게 건널 수 있도록 만든 다리입니다. 주로 도로가 복잡하거나 차량 통행이 많은 곳에 설치됩니다.", "options": ["육교", "지하", "마트", "길거리"], "answer": 0, "explain": "प्रश्नको अर्थ: यो मानिसहरूलाई सडक पार गराउन माथिबाट बनाइएको पुल हो।\n① 육교 भनेको पैदलयात्रीहरूलाई सडक पार गर्न बनाइएको ओभरहेड ब्रिज (आकाशे पुल) हो ✓\n② 지하 भनेको भूमिगत भाग वा जमिनमुनि हो। ✗\n③ 마트 भनेको मार्ट वा पसल हो। ✗\n④ 길거리 भनेको सडकको किनार वा बाटो हो। ✗"}, {"n": "138", "q": "건물의 가장 윗부분에 있는 평평한 지붕 공간입니다. 휴식, 건조, 정원 등 다양한 용도로 활용됩니다.", "options": ["옥상", "마루", "마트", "마당"], "answer": 0, "explain": "प्रश्नको अर्थ: यो घरको सबैभन्दा माथिल्लो तलामा रहेको खुला भाग हो।\n① 옥상 भनेको भवनको सबैभन्दा माथिल्लो तलाको सम्याइएको कौसी वा छत हो ✓\n② 마루 भनेको काठको पिँढी वा घरभित्रको भुइँ हो। ✗\n③ 마트 भनेको मार्ट वा पसल हो। ✗\n④ 마당 भनेको घरको आँगन हो। ✗"}, {"n": "139", "q": "네 갈래로 길이 만나는 도로의 교차 지점을 말합니다. 차량과 보행자의 이동이 많아 신호등이나 표지판이 설치되어 있는 경우가 많습니다.", "options": ["사거리", "삼거리", "우회전", "좌회전"], "answer": 0, "explain": "प्रश्नको अर्थ: यो प्रश्नले चारवटा बाटो जोडिने ठाउँलाई बुझाउँछ जहाँ गाडी र मानिसहरू धेरै आवतजावत गर्छन्।\n① 사거리 भनेको चारवटा दिशा वा बाटो मिल्ने चौबाटो हो ✓\n② 삼거리 भनेको तीनवटा बाटो मिल्ने तीनबाटो हो। ✗\n③ 우회전 भनेको दायाँतर्फ मोड्नु हो। ✗\n④ 좌회전 भनेको बायाँतर्फ मोड्नु हो। ✗"}, {"n": "140", "q": "날씨나 상황에 맞게 입은 옷의 형태나 스타일을 말합니다. 계절, 장소, 목적에 따라 달라집니다.", "options": ["유행", "화장", "쇼핑", "옷차림"], "answer": 3, "explain": "प्रश्नको अर्थ: यो मौसम र अवस्था अनुसार लगाउने पहिरनको तरिका हो।\n① 유행 भनेको फेसन वा चलन हो। ✗\n② 화장 भनेको मेकअप वा श्रृंगार हो। ✗\n③ 쇼핑 भनेको किनमेल हो। ✗\n④ 옷차림 भनेको पहिरन वा लुगा लगाउने शैली हो ✓"}, {"n": "141", "q": "옷차림을 꾸미기 위해 착용하는 장식품을 말하며 귀걸이, 목걸이, 팔찌, 모자, 시계 등이 이에 해당합니다.", "options": ["보석류", "스타일", "액세서리", "옷차림"], "answer": 2, "explain": "प्रश्नको अर्थ: शरीरलाई सजाउन प्रयोग गरिने विभिन्न गहना र पहिरनका अतिरिक्त वस्तुहरूलाई बुझाउँछ।\n① 보석류 भनेको गरगहना वा बहुमूल्य धातुका वस्तुहरू हुन्। ✗\n② 스타일 भनेको शैली हो। ✗\n③ 액세서리 भनेको पहिरनमा थपिने एक्सेसरीज वा गरगहनाहरू हुन् ✓\n④ 옷차림 भनेको पहिरन शैली हो। ✗"}, {"n": "142", "q": "시력을 교정하거나 눈을 보호하기 위해 눈에 쓰는 도구입니다. 시력 교정용 외에도 선글라스나 패션용으로도 사용됩니다.", "options": ["모자", "안약", "안경", "시계"], "answer": 2, "explain": "प्रश्नको अर्थ: आँखाको दृष्टि सुधार्न वा जोगाउन अनुहारमा लगाइने विशेष वस्तु हो।\n① 모자 भनेको टोपी हो। ✗\n② 안약 भनेको आँखामा हाल्ने थोपा औषधि हो। ✗\n③ 안경 भनेको आँखामा लगाउने चस्मा हो ✓\n④ 시계 भनेको घडी हो। ✗"}, {"n": "143", "q": "비나 눈이 오는 날에 신는 방수 기능이 있는 신발입니다. 주로 고무로 만들어지며 발과 다리를 젖지 않게 보호합니다.", "options": ["장화", "양말", "슬리퍼", "운동화"], "answer": 0, "explain": "प्रश्नको अर्थ: पानी वा हिउँ पर्ने दिनमा खुट्टा रुभ्नबाट बचाउन लगाइने जुत्ता हो।\n① 장화 भनेको पानी नछिर्ने रबरको जुत्ता वा गमबुट हो ✓\n② 양말 भनेको मोजा हो। ✗\n③ 슬리퍼 भनेको स्लिपर वा चप्पल हो। ✗\n④ 운동화 भनेको खेलकुद जुत्ता वा स्नीकर हो। ✗"}, {"n": "144", "q": "한국인의 고유한 의복, 특히 조선
