<style>
  :root {

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans KR", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(700px 340px at 85% -5%, rgba(124,58,237,.28), transparent 60%), radial-gradient(560px 300px at -5% 8%, rgba(219,39,119,.2), transparent 60%), radial-gradient(500px 400px at 50% 110%, rgba(34,211,238,.08), transparent 60%); background-attachment: fixed; color: var(--text); line-height: 1.6; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); color: #d6c9ff; font-weight: 800; font-size: .92rem; padding: 9px 18px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,.12); margin-bottom: 14px; transition: all .15s; }
  .back-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  header { background: var(--grad); color: #fff; padding: 20px 16px 16px; position: relative; box-shadow: 0 4px 24px rgba(0,0,0,.5); overflow: hidden; }
  header::before { content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.22), transparent 65%); top: -160px; right: -60px; pointer-events: none; }
  header::after { content: ""; position: absolute; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 65%); bottom: -140px; left: -40px; pointer-events: none; }
  .header-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 { font-size: 1.4rem; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  header p { opacity: .92; font-size: .9rem; margin-top: 4px; }
  .progress-wrap { margin-top: 14px; background: rgba(0,0,0,.35); border-radius: 999px; height: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #fde68a, #f472b6, #22d3ee); width: 0%; transition: width .3s; border-radius: 999px; box-shadow: 0 0 12px rgba(244,114,182,.7); }
  .progress-text { font-size: .85rem; font-weight: 700; margin-top: 8px; opacity: .97; }
  .autosave-note { font-size: .78rem; margin-top: 3px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 90px; }
  .q-card { background: linear-gradient(180deg, #1d1d30, #171725); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 18px; box-shadow: var(--shadow); transition: box-shadow .2s; }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.answered { border-color: rgba(167,139,250,.55); }
  .q-num { display: inline-block; font-size: .78rem; font-weight: 800; color: #fff; background: var(--grad); padding: 4px 14px; border-radius: 999px; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(219,39,119,.45); }
  .q-text { font-size: 1.12rem; white-space: pre-line; margin: 10px 0 16px; line-height: 1.85; font-weight: 500; color: #f2f1fa; }
  .options label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 2px solid rgba(255,255,255,.09); border-radius: 14px; margin-bottom: 9px; cursor: pointer; transition: all .15s; font-size: 1.04rem; font-weight: 500; background: #1e1e30; color: #f2f1fa; }
  .options label:hover { border-color: #8b5cf6; background: #232338; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(124,58,237,.3); }
  .options label::before { content: ""; flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; border: 2px solid #6b6b8a; background: transparent; transition: all .15s; }
  .options label.selected { background: var(--grad-soft); border-color: #a78bfa; box-shadow: 0 4px 18px rgba(124,58,237,.4); }
  .options label.selected::before { border-color: #a78bfa; background: #a78bfa; box-shadow: inset 0 0 0 4px #1e1e30; }

  .ul { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: #f472b6; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0 20px; flex-wrap: wrap; }

  .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 4px 18px rgba(219,39,119,.45); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 8px 24px rgba(219,39,119,.5); }
  .btn-primary:disabled { background: #2a2a3d; color: #77778e; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: rgba(255,255,255,.06); color: #d6c9ff; border: 2px solid rgba(255,255,255,.12); }
  .btn-ghost:hover { border-color: #8b5cf6; background: rgba(124,58,237,.2); }
  .submit-bar { position: sticky; bottom: 0; background: rgba(11,11,22,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 -4px 24px rgba(0,0,0,.5); }
  .submit-bar .inner { max-width: 760px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .submit-bar .hint { color: var(--muted); font-size: .9rem; }

  .score-card { background: linear-gradient(135deg, #1e1b3a, #2a1230); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 34px 20px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow-lg); }
  .score-card .big { font-size: 3rem; font-weight: 800; line-height: 1.05; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .score-card .pct { font-size: 1.15rem; color: #c9c6e0; margin-top: 6px; font-weight: 700; }
  .score-card .msg { margin-top: 10px; font-size: 1rem; color: #e6e4f5; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { padding: 9px 18px; }
  .filters button.active { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 2px 12px rgba(219,39,119,.4); }
  .review-card { background: linear-gradient(180deg, #1d1d30, #171725); border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .review-card.correct { border-left: 5px solid #10b981; }
  .review-card.wrong { border-left: 5px solid #f43f5e; }
  .verdict { display: inline-block; font-weight: 800; font-size: .9rem; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; }
  .verdict.ok { background: linear-gradient(135deg, #059669, #34d399); }
  .verdict.no { background: linear-gradient(135deg, #e11d48, #fb7185); }
  .review-card .ans-line { margin: 4px 0; }
  .review-card .ans-line b { font-weight: 700; }
  .review-card .ans-line .mine-wrong { color: var(--red); }
  .review-card .ans-line .right { color: var(--green); }
  .rev-opts { margin: 10px 0 4px; }
  .rev-opt { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; margin-bottom: 6px; font-size: .98rem; line-height: 1.6; background: #1e1e30; }
  .rev-opt-correct { background: var(--green-bg); border-color: #10b981; }
  .rev-opt-mine-wrong { background: var(--red-bg); border-color: #f43f5e; }
  .rev-opt .rev-text { flex: 1; }
  .rev-opt .badge { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge-correct { background: #059669; color: #fff; }
  .badge-mine { background: #059669; color: #fff; }
  .badge-mine-wrong { background: #e11d48; color: #fff; }
  .rev-no-answer { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
  .explain { background: #12101f; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: .97rem; color: #d9d7ea; }
  .explain b { color: #d6c9ff; }
  .explain-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; }
  .explain-stem { background: linear-gradient(135deg, rgba(124,58,237,.25), rgba(219,39,119,.18)); border-left: 4px solid #a78bfa; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; color: #f2f1fa; }
  .exp-line { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.07); line-height: 1.75; border-radius: 8px; }
  .exp-line:first-of-type { border-top: none; }
  .exp-line.exp-ok { background: var(--green-bg); border-top: none; }
  .exp-mark { font-weight: 800; margin-left: 4px; }
  .exp-mark.ok { color: #34d399; }
  .exp-mark.no { color: #fb7185; }
  .exp-note { background: linear-gradient(135deg, rgba(245,158,11,.16), rgba(245,158,11,.08)); border: 1px solid rgba(245,158,11,.4); border-left: 4px solid #f59e0b; border-radius: 10px; padding: 12px 14px; margin-top: 12px; line-height: 1.75; color: #fde9c8; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.1rem; }
    .q-text { font-size: 1.05rem; }
    .submit-bar .hint { display: none; }
    .score-card .big { font-size: 2.4rem; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 12px 10px; }
    .back-btn { padding: 6px 12px; font-size: .82rem; margin-bottom: 8px; }
    header h1 { font-size: 1.08rem; line-height: 1.25; }
    header p { font-size: .75rem; line-height: 1.35; }
    .progress-wrap { margin-top: 8px; height: 6px; }
    .progress-text { font-size: .74rem; margin-top: 5px; }
    .autosave-note { font-size: .68rem; margin-top: 2px; }
    main { padding: 16px 12px 80px; }
    .q-card { padding: 18px; border-radius: 16px; }
    .options label { padding: 11px 12px; font-size: 1rem; }
  }
  @media (min-width: 640px) {
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .options label { margin-bottom: 0; }
  }

</style>

</main>

<script>
const QUESTIONS = [{"n": "151", "q": "싸게 방을 얻어 생활할 수 있는 건물입니다. 화장실, 부엌 등을 공동으로 사용합니다.", "options": ["고시원", "기숙사", "원룸", "아파트"], "answer": 0, "explain": "① 고시원 भनेको सस्तोमा कोठा लिएर बस्न सकिने र शौचालय तथा भान्सा साझा रूपमा प्रयोग गर्ने ठाउँ हो ✓\n② 기숙사 भनेको विद्यार्थी वा कामदार बस्ने होस्टेल हो तर यो 고시원 जस्तो धेरै सस्तो र साझा कोठा केन्द्रित मात्र हुँदैन। ✗\n③ 원룸 भनेको एउटै कोठामा सबै कुरा भएको सिंगल रुम हो तर यसमा सबै सुविधा व्यक्तिगत हुन्छ। ✗\n④ 아파트 भनेको अपार्टमेन्ट हो जुन ठूलो आवासीय भवन हो। ✗"}, {"n": "152", "q": "학교나 직장 등에서 학생이나 직원들이 거주할 수 있도록 제공하는 숙소입니다. 보통 공동생활을 하며, 규칙적인 관리와 생활이 이루어집니다.", "options": ["기숙사", "주택", "원룸", "고시원"], "answer": 0, "explain": "① 기숙사 भनेको विद्यालय वा कम्पनी आदिमा विद्यार्थी वा कर्मचारीहरू बस्नका लागि प्रदान गरिएको आवास हो र यहाँ सामूहिक जीवन बिताइन्छ ✓\n② 주택 भनेको सामान्य घर हो। ✗\n③ 원룸 भनेको एउटै कोठा भएको आवास हो। ✗\n④ 고시원 भनेको सस्तो अध्ययन गर्ने कोठा हो। ✗"}, {"n": "153", "q": "하나의 큰 방에 침대, 주방, 욕실 등이 모두 갖추어진 소형 주거 공간입니다. 주로 1인 가구가 거주하며, 공간 효율성이 높아 작은 규모의 주택으로 인기가 많습니다.", "options": ["주택", "원룸", "아파트", "고시원"], "answer": 1, "explain": "① 주택 भनेको सामान्य घर हो। ✗\n② 원룸 भनेको एउटै ठूलो कोठामा बेड, किचिन, बाथरुम आदि सबै कुरा भएको सानो आवास हो जहाँ मुख्यतया १ जना बस्छन् ✓\n③ 아파트 भनेको अपार्टमेन्ट हो। ✗\n④ 고시원 भनेको सस्तो अध्ययन कोठा हो। ✗"}, {"n": "154", "q": "집이나 방을 빌릴 때 매달 일정한 금액을 지불하는 임대 방식입니다. 보통 보증금을 먼저 내고, 매달 정해진 금액을 집주인에게 냅니다.", "options": ["비용", "월세", "대출", "결제"], "answer": 1, "explain": "① 비용 भनेको लागत वा खर्च हो। ✗\n② 월세 भनेको घर वा कोठा भाडामा लिँदा प्रत्येक महिना निश्चित रकम तिर्ने भाडा प्रणाली हो ✓\n③ 대출 भनेको ऋण हो। ✗\n④ 결제 भनेको भुक्तानी गर्नु हो। ✗"}, {"n": "155", "q": "집을 빌릴 때 큰 금액의 보증금을 한 번에 내고, 매달 월세를 내지 않고 거주하는 임대 방식입니다. 계약 기간이 끝나면 보증금을 전액 돌려받는 것이 특징입니다.", "options": ["비용", "집값", "용돈", "전세"], "answer": 3, "explain": "① 비용 भनेको खर्च हो, यो घर भाडामा लिने विशेष प्रणाली होइन। ✗\n② 집값 भनेको घरको मूल्य हो, यो घर किन्दा लाग्ने रकम भएकाले भाडा प्रणाली होइन। ✗\n③ 용돈 भनेको खल्ती खर्च हो, यो घर भाडामा लिने तरिकासँग सम्बन्धित छैन। ✗\n④ 전세 भनेको एकमुस्ट धरौटी भाडा प्रणाली हो, सम्झौता सकिएपछि धरौटी रकम फिर्ता पाइने भएकाले विवरणसँग मिल्छ। ✓"}, {"n": "156", "q": "집이나 방을 빌릴 때 임차인이 집주인에게 미리 맡기는 돈입니다. 계약이 끝난 후 문제가 없으면 전액 돌려받을 수 있습니다.", "options": ["수도비", "관리비", "환불금", "보증금"], "answer": 3, "explain": "① 수도비 भनेको खानेपानीको महसुल हो, यो अगाडि बुझाइने धरौटी रकम होइन। ✗\n② 관리비 भनेको व्यवस्थापन शुल्क हो, यो भवन रेखदेखका लागि तिरिने मासिक खर्च हो। ✗\n③ 환불금 भनेको फिर्ता रकम हो, यो सामान फिर्ता गर्दा पाइने पैसा हो। ✗\n④ 보증금 भनेको धरौटी रकम हो, यो घर वा कोठा भाडामा लिँदा घरधनीलाई अगाडि नै बुझाइने र पछि फिर्ता पाइने पैसा भएकाले विवरणसँग मिल्छ। ✓"}, {"n": "157", "q": "높은 곳에서 멀리 바라보는 아름다운 풍경을 말합니다. 산이나 건물 위에서 보는 경치가 이에 해당합니다.", "options": ["산맥", "고궁", "야경", "전망"], "answer": 3, "explain": "① 산맥 भनेको पर्वतमाला हो। ✗\n② 고궁 भनेको पुरानो राजदरबार हो। ✗\n③ 야경 भनेको उच्च स्थानबाट टाढा हेर्दा देखिने सुन्दर रातको दृष्य (नाइट भ्यु) हो ✗\n④ 전망 भनेको टाढाको दृश्य वा अवलोकन हो तर यो विशेष गरी रातको दृश्यसँग जोडिएको छैन। ✓"}, {"n": "158", "q": "관광을 목적으로 사람들이 방문하는 장소입니다. 이러한 장소는 문화적, 자연적, 역사적 특색을 가진 지역으로, 여행자들에게 다양한 경험을 제공합니다.", "options": ["교육원", "전쟁지", "여행지", "놀이공원"], "answer": 2, "explain": "① 교육원 भनेको शैक्षिक संस्था हो। ✗\n② 전쟁지 भनेको युद्ध क्षेत्र हो। ✗\n③ 여행지 भनेको मानिसहरू भ्रमणको उद्देश्यले भ्रमण गर्ने ठाउँ हो ✓\n④ 놀이공원 भनेको मनोरञ्जन पार्क हो। ✗"}, {"n": "159", "q": "전기 장비를 전기 공급 장치에 연결하는 2개 또는 3개의 금속 핀이 있는 작은 플라스틱 물체입니다.", "options": ["스위치", "콘센트", "플러그", "손전등"], "answer": 2, "explain": "① 스위치 भनेको बत्ती बाल्ने वा निभाउने स्विच हो। ✗\n② 콘센트 भनेको भित्तामा हुने सकेट हो। ✗\n③ 플러그 भनेको विद्युतीय उपकरणलाई करेन्टको स्रोतमा जोड्नको लागि २ वा ३ वटा धातुको पिन भएको सानो प्लाष्टिकको वस्तु हो ✓\n④ 손전등 भनेको टर्चलाइट हो। ✗"}, {"n": "160", "q": "한 사회의 역사적, 예술적, 과학적 가치가 있는 유물, 건축물, 전통 등을 포함한 물질적 및 비물질적 자산입니다.", "options": ["천연 자원", "산림 생물", "문화유산", "사유재산"], "answer": 2, "explain": "① 천연 자원 भनेको प्राकृतिक स्रोत हो। ✗\n② 산림 생물 भनेको जङ्गली जीवजन्तु तथा वनस्पति हो। ✗\n③ 문화유산 भनेको कुनै समाजको ऐतिहासिक, कलात्मक र वैज्ञानिक मूल्य भएका पुरासम्पदा, वास्तुकला, परम्परा आदि समेटिएको सांस्कृतिक सम्पदा हो ✓\n④ 사유재산 भनेको निजी सम्पत्ति हो। ✗"}, {"n": "161", "q": "여행 중이나 일정 기간 동안 머물기 위해 제공되는 거주지입니다. 호텔, 게스트하우스, 민박, 리조트 등 다양한 형태로 제공됩니다.", "options": ["숙소", "주택", "기숙사", "고시원"], "answer": 0, "explain": "① 숙소 भनेको यात्राको समयमा वा निश्चित अवधिका लागि बस्न प्रदान गरिएको आवास हो ✓\n② 주택 भनेको सामान्य घर हो। ✗\n③ 기숙사 भनेको होस्टेल हो। ✗\n④ 고시원 भनेको सस्तो अध्ययन कोठा हो। ✗"}, {"n": "162", "q": "공동 소유 형태로 운영되는 주거지로, 일반적으로 여러 명이 한 건물 내의 임대하여 사용하는 형태입니다. 시설과 서비스가 호텔과 비슷한 특징을 가집니다.", "options": ["콘도", "민박", "펜션", "모텔"], "answer": 0, "explain": "① 콘도 भनेको कन्डोमिनियम हो जो साझा स्वामित्वको रूपमा सञ्चालन हुने र होटल जस्तै सेवा तथा सुविधा भएको आवास हो ✓\n② 민박 भनेको होमस्टे हो। ✗\n③ 펜션 भनेको पेन्सन (रिसोर्ट शैलीको घर) हो। ✗\n④ 모텔 भनेको मोटेल हो। ✗"}, {"n": "163", "q": "주민이 자신의 집이나 별도로 마련된 공간을 여행객에게 제공하여 숙박을 하는 형태입니다. 보통 가정적인 분위기에서 저렴한 가격으로 숙박할 수 있으며, 주인과의 교류를 통해 현지 문화를 더 가까이 경험할 수 있습니다.", "options": ["호텔", "민박", "콘도", "펜션"], "answer": 1, "explain": "① 호텔 भनेको होटल हो। ✗\n② 민박 भनेको स्थानीय बासिन्दाले आफ्नो घर वा छुट्टै ठाउँ पर्यटकलाई दिएर बस्ने व्यवस्था मिलाउने होमस्टे हो ✓\n③ 콘도 भनेको कन्डोमिनियम हो। ✗\n④ 펜션 भनेको पेन्सन हो। ✗"}, {"n": "164", "q": "자연 속에서 휴식을 취할 수 있도록 마련된 작은 규모의 숙소로, 보통 가족이나 소규모 그룹을 대상으로 제공됩니다. 주로 독립된 건물이나 별채 형태로 되어 있어 프라이빗한 분위기에서 편안한 시간을 보낼 수 있습니다.", "options": ["기숙사", "고시원", "펜션", "민박"], "answer": 2, "explain": "① 기숙사 भनेको आवासगृह वा होस्टेल हो, यो कम्पनी वा विद्यालयले उपलब्ध गराउने ठाउँ हो। ✗\n② 고시원 भनेको गोसीवोन हो, यो विद्यार्थी बस्ने सानो कोठा हो। ✗\n③ 펜션 भनेको रिसोर्ट कटेज हो, यो प्रकृतिमा परिवार वा सानो समूहले आराम गर्न सक्ने स्वतन्त्र भवन भएकाले विवरणसँग मिल्छ। ✓\n④ 민박 भनेको होमस्टे हो, यो साधारण घरमा भाडामा बस्ने ठाउँ हो। ✗"}, {"n": "165", "q": "물이 고여 있는 자연적인 낮은 지형으로, 산이나 평지에 형성됩니다. 이곳은 물놀이를 하거나 경치를 즐길 수 있는 멋진 장소입니다.", "options": ["강", "산", "호수", "바다"], "answer": 2, "explain": "① 강 भनेको नदी हो। ✗\n② 산 भनेको पहाड हो। ✗\n③ 호수 भनेको पानी जमेको प्राकृतिक रूपमा रहेको सानो भू-भाग हो जुन पहाड वा समथर भूमिमा बन्छ र यहाँ पानीमा खेल्न वा दृश्यको आनन्द लिन सकिन्छ ✓\n④ 바다 भनेको समुद्र हो। ✗"}, {"n": "166", "q": "넓고 깊은 물이 있는 큰 곳입니다. 여러 나라를 나누는 경계가 되며, 물고기나 배를 이용한 여행에 중요한 역할을 합니다.", "options": ["온천", "호수", "야경", "바다"], "answer": 3, "explain": "① 온천 भनेको तातो पानी निस्कने ठाउँ हो ✗\n② 호수 भनेको ताल हो ✗\n③ 야경 भनेको रात्रिको दृश्य हो ✗\n④ 바다 भनेको समुद्र हो जसले धेरै पानी ओगटेको छ र देशहरूलाई छुट्याउँछ ✓"}, {"n": "167", "q": "바다나 호수에 둘러싸인 땅입니다. 크거나 작은 땅덩어리로, 사람이나 동식물이 살 수 있는 곳이기도 합니다.", "options": ["산", "강", "섬", "폭포"], "answer": 2, "explain": "① 산 भनेको पहाड हो ✗\n② 강 भनेको नदी हो ✗\n③ 섬 भनेको चारैतिर पानीले घेरिएको टापु हो जहाँ मानिस र बोटबिरुवा बस्छन् ✓\n④ 폭포 भनेको झरना हो ✗"}, {"n": "168", "q": "자연에서 나오는 따뜻한 물입니다. 주로 지구의 깊은 곳에서 데워져 땅속에서 나오는 물로, 사람들은 몸을 담그며 피로를 풀거나 건강을 챙기기 위해 이용합니다.", "options": ["온천", "폭포", "동굴", "호수"], "answer": 0, "explain": "① 온천 भनेको प्राकृतिक तातो पानी आउने ठाउँ हो जहाँ मानिसहरू थकाइ मार्न जान्छन् ✓\n② 폭포 भनेको झरना हो ✗\n③ 동굴 भनेको गुफा हो ✗\n④ 호수 भनेको ताल हो ✗"}, {"n": "169", "q": "옛날 사람들의 생활이나 문화가 남아 있는 장소입니다. 오래된 건물이나 유물들이 있어, 역사적인 가치를 지니며 사람들이 그곳을 방문하여 배우고 경험할 수 있습니다.", "options": ["유적지", "민속촌", "교육원", "천연 자원"], "answer": 0, "explain": "① 유적지 भनेको ऐतिहासिक अवशेषहरू पाइने ठाउँ हो ✓\n② 민속촌 भनेको लोकगाउँ हो ✗\n③ 교육원 भनेको शिक्षा केन्द्र हो ✗\n④ 천연 자원 भनेको प्राकृतिक स्रोत हो ✗"}, {"n": "170", "q": "전통적인 생활 방식과 문화를 보여주는 마을입니다. 옛날 사람들의 집, 옷, 도구 등을 실제로 볼 수 있으며, 전통 놀이와 행사도 체험할 수 있는 곳입니다.", "options": ["문화유산", "여행지", "유적지", "민속촌"], "answer": 3, "explain": "① 문화유산 भनेको सांस्कृतिक सम्पदा हो ✗\n② 여행지 भनेको भ्रमण गर्ने ठाउँ हो ✗\n③ 유적지 भनेको ऐतिहासिक स्थल हो ✗\n④ 민속촌 भनेको परम्परागत जीवनशैली र संस्कृति झल्काउने लोकगाउँ हो ✓"}, {"n": "171", "q": "과거에 일어난 일들과 그 과정을 말합니다. 사람들의 사건, 변화, 발전을 기록하여 현재와 미래에 배울 수 있습니다.", "options": ["사회", "경제", "소설", "역사"], "answer": 3, "explain": "① 사회 भनेको समाज हो ✗\n② 경제 भनेको अर्थतन्त्र हो ✗\n③ 소설 भनेको उपन्यास हो ✗\n④ 역사 भनेको इतिहास हो जुन विगतका घटना र विकाससँग सम्बन्धित हुन्छ ✓"}, {"n": "172", "q": "산을 올라가며 자연을 즐기는 활동입니다. 사람들은 보통 산을 오르거나 하산하면서 운동을 하고, 산의 경치를 즐깁니다.", "options": ["여행", "등산", "방문", "만남"], "answer": 1, "explain": "① 여행 भनेको भ्रमण हो, यो नयाँ ठाउँको यात्रा गर्ने काम हो त्यसैले विवरणसँग मिल्दैन। ✗\n② 등산 भनेको पहाड चढ्नु हो, यो डाँडा चढेर प्रकृतिको आनन्द लिने काम हो त्यसैले यो विवरणसँग मिल्छ। ✓\n③ 방문 भनेको भेट्न जानु हो, यो कुनै ठाउँ वा मानिसलाई भेट्ने काम हो ✗\n④ 만남 भनेको भेटघाट हो, यो मानिसहरू आपसमा भेट्ने कुरा हो ✗"}, {"n": "173", "q": "왕이나 왕족이 살았던 큰 집입니다. 보통 많은 방과 정원이 있으며, 왕국의 중요한 행사나 정치적 결정이 이루어졌던 장소입니다.", "options": ["비원", "정원", "궁궐", "시청"], "answer": 2, "explain": "① 비원 भनेको गुप्तेश्वर वा गोप्य बगैंचा हो ✗\n② 정원 भनेको बगैंचा हो ✗\n③ 궁궐 भनेको राजा वा राजपरिवार बस्ने राजदरबार हो ✓\n④ 시청 भनेको महानगरपालिका वा नगर कार्यालय हो ✗"}, {"n": "174", "q": "사람이 지은 건물이나 구조물입니다. 집, 학교, 다리처럼 다양한 목적을 위해 만들어지며, 크기나 모양도 다양합니다.", "options": ["사무소", "민속촌", "건축물", "문화유산"], "answer": 2, "explain": "① 사무소 भनेको कार्यालय हो ✗\n② 민속촌 भनेको लोकगाउँ हो ✗\n③ 건축물 भनेको वास्तुकला वा भवन/संरचना हो ✓\n④ 문화유산 भनेको सांस्कृतिक सम्पदा हो ✗"}, {"n": "175", "q": "경주에 있는 유명한 절입니다. 신라 시대에 지어졌으며, 아름다운 건축과 오랜 역사를 가진 한국의 대표적인 문화유산입니다.", "options": ["불국사", "경복궁", "창덕궁", "석굴암"], "answer": 0, "explain": "① 불국사 भनेको ग्येोङ्जुमा रहेको प्रसिद्ध बौद्ध मन्दिर हो ✓\n② 경복궁 भनेको सोलमा रहेको दरबार हो ✗\n③ 창덕궁 भनेको अर्को दरबार हो ✗\n④ 석굴암 भनेको गुफा मन्दिर हो ✗"}, {"n": "176", "q": "경주의 산속에 있는 돌로 만든 절입니다. 신라 시대에 만들어졌으며, 안에는 아름다운 불상이 있어 세계적인 문화유산으로 유명합니다.", "options": ["불국사", "경복궁", "창덕궁", "석굴암"], "answer": 3, "explain": "① 불국사 भनेको सिल्ला कालको प्रसिद्ध गुम्बा हो, तर यो ढुङ्गाको गुफा गुम्बा होइन त्यसैले मिल्दैन। ✗\n② 경복궁 भनेको जोसोन कालको राजदरबार हो ✗\n③ 창덕궁 भनेको जोसोन कालको अर्को राजदरबार हो ✗\n④ 석굴암 भनेको क्योङजुको पहाडमा रहेको ढुङ्गाको गुम्बा हो, जहाँ सुन्दर बुद्धको मूर्ति छ त्यसैले यो विवरणसँग मिल्छ। ✓"}, {"n": "177", "q": "서울에 있는 조선 시대의 가장 큰 궁궐입니다. 왕이 살고 나라를 다스리던 곳으로, 지금은 많은 사람들이 방문하는 역사적인 장소입니다.", "options": ["도산서원", "경복궁", "창덕궁", "석굴암"], "answer": 1, "explain": "① 도산서원 भनेको ऐतिहासिक अध्ययन केन्द्र हो, त्यसैले यो राजदरबार होइन। ✗\n② 경복궁 भनेको सोलमा रहेको जोसोन कालको सबैभन्दा ठूलो राजदरबार हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n③ 창덕궁 भनेको जोसोन कालको दरबार हो तर यो मुख्य ठूलो दरबार होइन, त्यसैले मिल्दैन। ✗\n④ 석굴암 भनेको क्योङजुमा रहेको ढुङ्गाको गुम्बा हो ✗"}, {"n": "178", "q": "옛날부터 사람들 사이에 전해 내려오는 이야기입니다. 실제 일어난 일일 수도 있고, 상상에서 만들어졌을 수도 있으며, 보통 특별한 사람이나 장소, 신기한 일이 등장합니다.", "options": ["속담", "전설", "전쟁", "문화"], "answer": 1, "explain": "① 속담 भनेको उखान हो ✗\n② 전설 भनेको जनश्रुति वा दन्त्यकथा/किंवदंती हो ✓\n③ 전쟁 भनेको युद्ध हो ✗\n④ 문화 भनेको संस्कृति हो ✗"}, {"n": "179", "q": "경주의 불국사 안에 있는 아름다운 돌탑입니다. 신라 시대에 만들어졌으며, 섬세하고 조화로운 모습으로 한국의 대표적인 문화유산 중 하나입니다.", "options": ["창덕궁", "경복궁", "다보탑", "석굴암"], "answer": 2, "explain": "① 창덕궁 भनेको दरबार हो ✗\n② 경복궁 भनेको दरबार हो ✗\n③ 다보탑 भनेको ग्येोङ्जुको पुलगुक्साभित्र रहेको प्रसिद्ध ढुङ्गाको प्यागोडा (ताप्) हो ✓\n④ 석굴암 भनेको गुफा मन्दिर हो ✗"}, {"n": "180", "q": "부처님의 모습을 돌이나 나무로 만든 상입니다. 절에 가면 볼 수 있으며, 사람들은 불상 앞에서 기도하거나 마음의 평화를 빕니다.", "options": ["사원", "동상", "불상", "불경"], "answer": 2, "explain": "① 사원 भनेको मन्दिर हो ✗\n② 동상은 सालिक वा मूर्ति हो ✗\n③ 불상 भनेको बुद्धको मूर्ति (बुल्साङ) हो ✓\n④ 불경 भनेको बौद्ध ग्रन्थ हो ✗"}, {"n": "181", "q": "어떤 일을 잘 해내기 위한 방법이나 능력으로 물건을 만들거나 기계를 다루는 것도 여기에 들어갑니다.", "options": ["기술", "기회", "후회", "성공"], "answer": 0, "explain": "① 기술 को अर्थ सीप वा प्रविधि हो, यो सही उत्तर हो किनभने यसले कुनै काम राम्रोसँग गर्न सक्ने क्षमतालाई बुझाउँछ। ✓\n② 기회 को अर्थ मौका हो, यो वर्णन अनुसार मिल्दैन। ✗\n③ 후회 को अर्थ पछुतावा हो, यो काम गर्ने क्षमतासँग सम्बन्धित छैन। ✗\n④ 성공 को अर्थ सफलता हो, यो काम राम्रोसँग गर्ने तरिका वा क्षमता होइन। ✗"}, {"n": "182", "q": "여행을 떠나 다른 곳을 방문한 사람이며 주로 관광명소나 유명한 장소를 보고 즐기기 위해 떠납니다.", "options": ["관광객", "관중", "응원자", "손님"], "answer": 0, "explain": "① 관광객 को अर्थ पर्यटक हो, यो सही उत्तर हो किनभने यसले घुम्न आएको मानिसलाई बुझाउँछ। ✓\n② 관중 को अर्थ दर्शक हो, यो खेल वा कार्यक्रम हेर्ने मानिसहरूको समूह हो। ✗\n③ 응원자 को अर्थ समर्थक वा चिअरर हो, यो घुम्न जाने मानिस होइन। ✗\n④ 손님 को अर्थ पाहुना वा ग्राहक हो, यो पर्यटनसँग मात्र सम्बन्धित छैन। ✗"}, {"n": "183", "q": "조선 시대의 유학자 이황을 기리기 위해 세운 서원입니다. 경상북도 안동에 위치하며, 이곳은 이황 선생의 학문과 가르침을 배우기 위한 장소로 알려져 있습니다.", "options": ["도산서원", "수원화성", "창덕궁", "경복궁"], "answer": 0, "explain": "① 도산서원 भनेको विद्वान इह्वाङको सम्झनामा बनाइएको अध्ययन केन्द्र हो, त्यसैले यो विवरणसँग मिल्छ। ✓\n② 수원화성 भनेको सुवोनमा रहेको ऐतिहासिक किल्ला हो ✗\n③ 창덕궁 भनेको जोसोन कालको राजदरबार हो ✗\n④ 경복궁 भनेको जोसोन कालको मुख्य राजदरबार हो ✗"}, {"n": "184", "q": "공자의 가르침을 바탕으로 효, 예, 인을 중요시하며, 인간 관계에서 도덕적 규범과 예절을 중시하는 전통입니다. 가족 중심의 가치와 교육을 강조하여 사회의 질서와 조화를 유지하려고 했습니다.", "options": ["유교 문화", "서양 문화", "전통 문화", "동양 문화"], "answer": 0, "explain": "① 유교 문화 भनेको कन्फ्युसियसको शिक्षामा आधारित संस्कृति हो, जसले नैतिकता र शिष्टाचारलाई महत्त्व दिन्छ त्यसैले यो विवरणसँग मिल्छ। ✓\n② 서양 문화 भनेको पश्चिमी संस्कृति हो ✗\n③ 전통 문화 भनेको परम्परागत संस्कृति हो, तर यो कुनै एउटा विशेष दर्शन मात्र होइन त्यसैले मिल्दैन। ✗\n④ 동양 문화 भनेको पूर्वीय संस्कृति हो, जुन धेरै व्यापक विषय हो त्यसैले मिल्दैन। ✗"}, {"n": "185", "q": "자유 시간에 즐기는 활동이나 관심사입니다. 사람들이 스트레스를 풀거나 즐거움을 느끼기 위해 하는 일로, 예를 들면 운동, 독서, 그림 그리기 등이 있습니다.", "options": ["꿈", "취미", "지침", "근무"], "answer": 1, "explain": "① 꿈 को अर्थ सपना हो, यो खाली समयमा गर्ने क्रियाकलाप होइन। ✗\n② 취미 को अर्थ शोख वा रुचि हो, यो सही उत्तर हो किनभने यसले खाली समयमा आनन्दको लागि गर्ने कामलाई बुझाउँछ। ✓\n③ 지침 को अर्थ निर्देशिका वा मार्गदर्शन हो, यो रुचि होइन। ✗\n④ 근무 को अर्थ काम वा ड्युटी हो, यो फुर्सदको समयको गतिविधि होइन। ✗"}, {"n": "186", "q": "매운 양념에 떡과 어묵 등을 넣어 볶아 만든 한국 음식입니다. 길거리 음식으로 인기가 많고, 맵고 달콤한 맛이 특징입니다.", "options": ["비빔밥", "떡볶이", "떡국", "미역국"], "answer": 1, "explain": "① 비빔밥 भनेको भातमा विभिन्न तरकारी मिसाएर खाइने कोरियाली खाना हो, त्यसैले यो भुटेको परिकार होइन। ✗\n② 떡볶이 भनेको पिरो मसलामा पीठोको परिकार र माछाको केक भुटेर बनाइने खाना हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ✓\n③ 떡국 भनेको पीठोको चक्का हालिएको झोल खाना हो, त्यसैले यो भुटेर बनाइने खाना होइन। ✗\n④ 미역국 भनेको समुद्री लेउको झोल हो, त्यसैले यो पिरो भुटेको खाना होइन। ✗"}, {"n": "187", "q": "요리를 하다가 음식의 맛을 더 맛있게 하기 위해 넣는 재료로 소금, 간장, 고추장, 설탕 등을 말합니다.", "options": ["식초", "양념", "고추장", "마늘"], "answer": 1, "explain": "① 식초 को अर्थ भिनेगर (सिरका) हो, यो एउटा मात्र मसला हो। ✗\n② 양념 को अर्थ मसला वा झोल हो, यो सही उत्तर हो किनभने यसले खाना मिठो बनाउन हालिने सबै सामग्रीहरूलाई जनाउँछ। ✓\n③ 고추장 को अर्थ गोछुजाङ (रातो खुर्सानीको पेस्ट) हो, यो एउटा विशेष मसला मात्र हो। ✗\n④ 마늘 को अर्थ लसुन हो, यो पनि एउटा मात्र खाद्य सामग्री हो। ✗"}, {"n": "188", "q": "닭 한 마리에 찹쌀, 마늘, 인삼 등을 넣고 끓인 한국의 보양 음식입니다. 주로 몸을 건강하게 하기 위해 여름철에 많이 먹습니다.", "options": ["감자탕", "닭갈비", "닭도리탕", "삼계탕"], "answer": 3, "explain": "① 감자탕 भनेको सुँगुरको हाड र आलुको झोल खाना हो, त्यसैले यो सिङ्गो कुखुरा हालेर बनाइने खाना होइन। ✗\n② 닭갈비 भनेको कुखुराको मासु भुटेर बनाइने खाना हो, त्यसैले यो झोल खाना होइन। ✗\n③ 닭도리탕 भनेको कुखुराको पिरो झोल खाना हो, तर यसमा इन्साम हालेर गर्मीमा खाइदैन। ✗\n④ 삼계탕 भनेको सिङ्गो कुखुरामा चामल, लसुन र इन्साम हालेर उम्ल्याइने पौष्टिक खाना हो, त्यसैले यो विवरणसँग एकदम मिल्छ। ✓"}, {"n": "189", "q": "냉동 우유 또는 크림과 설탕으로 만든 매우 차갑고 달콤한 음식 주로 여름철 때 즐겨 먹습니다.", "options": ["초콜릿", "떡볶이", "아이스크림", "송편"], "answer": 2, "explain": "① 초콜릿 को अर्थ चकलेट हो, यो दूध र बरफबाट बनेको होइन। ✗\n② 떡볶이 को अर्थ तोक्बोक्की हो, यो पिरो खाना हो। ✗\n③ 아이스크림 को अर्थ आइसक्रिम हो, यो सही उत्तर हो किनभने यो चिसो दूध वा क्रिम र चिनीबाट बनाइन्छ। ✓\n④ 송편 को अर्थ सोङ्प्येोन हो, यो चोसेक पर्वमा खाने पिठोको परिकार हो। ✗"}, {"n": "190", "q": "고기, 채소 등 다양한 재료를 밀가루 반죽에 싸서 찌거나 굽거나 튀긴 한국의 전통 음식입니다. 간 식이나 반찬, 국물 요리에 다양하게 활용됩니다.", "options": ["라면", "김치", "만두", "잡채"], "answer": 2, "explain": "① 라면 को अर्थ राम्युन (चाउचाउ) हो, यो पिठोको खोलमा बेरेको डम्प्लिङ होइन। ✗\n② 김치 को अर्थ किम्छि हो, यो बन्दाकोबीको अचार हो। ✗\n③ 만두 को अर्थ मानदु हो, यो सही उत्तर हो किनभने यो पिठोको बाक्लो खोलमा मासु र तरकारी राखेर बनाइने परिकार हो। ✓\n④ 잡채 को अर्थ चाप्चे हो, यो सेलरोटी वा चाउमिन जस्तो तरकारी र चाउचाउ मिसाएको परिकार हो। ✗"}, {"n": "191", "q": "전 세계의 컴퓨터와 네트워크를 서로 연결해 정보를 주고받을 수 있게 하는 통신망입니다.", "options": ["인터넷", "스마트폰", "웹사 const PER_PAGE = 20;
const TOTAL = QUESTIONS.length;
const SET_ID = 'eps-vocab-set-04';
const answers = {}; // question index -> chosen option index
let page = 0;
let submitted = false;
let reviewFilter = 'all';

// --- progress auto-save (localStorage) ---
// Saved per set (key includes SET_ID), so each set file keeps its own
// progress. Wrapped in try/catch: if the browser blocks storage, the quiz
// still works, it just won't remember progress.
const STORE_KEY = 'eps-quiz-' + SET_ID;
function storeAvailable() {
  try { localStorage.setItem('__eps_test__', '1'); localStorage.removeItem('__eps_test__'); return true; }
  catch (e) { return false; }
}
const storeOK = storeAvailable();
function saveProgress() {
  if (!storeOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: answers, page: page })); } catch (e) {}
}
function loadProgress() {
  if (!storeOK) return;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.answers) {
      Object.keys(data.answers).forEach(k => { answers[k] = data.answers[k]; });
      if (typeof data.page === 'number' && data.page >= 0 && data.page < Math.ceil(TOTAL / PER_PAGE)) page = data.page;
    }
  } catch (e) {}
}
function clearProgress() {
  if (storeOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
}
loadProgress();

const $ = (id) => document.getElementById(id);
const circled = ['①','②','③','④'];

function updateProgress() {
  const done = Object.keys(answers).length;
  $('progressBar').style.width = (done / TOTAL * 100) + '%';
  $('progressText').textContent = done + ' / ' + TOTAL + ' answered';
  $('submitHint').textContent = done === TOTAL ? 'All answered — ready to submit!' : (TOTAL - done) + ' unanswered (counted wrong on submit).';
}

// Renders "① <option text>" into `el`, wrapping the FIRST occurrence of
// the underlined substring (if any) in <span class="ul"> so it gets a real
// CSS underline — never a combining mark (U+0332 renders as tofu boxes on
// some devices). Uses text nodes only, never innerHTML, so option text is
// never parsed as markup. Questions without an "underlined" field (e.g.
// the 600-question quiz) render plain text exactly as before.
function renderOptionText(el, prefix, opt, under) {
  el.appendChild(document.createTextNode(prefix + ' '));
  const u = under || '';
  const idx = u ? opt.indexOf(u) : -1;
  if (idx < 0) {
    el.appendChild(document.createTextNode(opt));
    return;
  }
  if (idx > 0) el.appendChild(document.createTextNode(opt.slice(0, idx)));
  const span = document.createElement('span');
  span.className = 'ul';
  span.appendChild(document.createTextNode(u));
  el.appendChild(span);
  if (idx + u.length < opt.length) {
    el.appendChild(document.createTextNode(opt.slice(idx + u.length)));
  }
}

function renderPage() {
  const list = $('questionList');
  list.innerHTML = '';
  const start = page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, TOTAL);
  for (let i = start; i < end; i++) {
    const q = QUESTIONS[i];
    const card = document.createElement('div');
    card.className = 'q-card' + (answers[i] !== undefined ? ' answered' : '');
    card.innerHTML =
      '<div class="q-num">Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="options"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const opts = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      if (answers[i] === oi) label.classList.add('selected');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.checked = answers[i] === oi;
      input.addEventListener('change', () => {
        answers[i] = oi;
        card.classList.add('answered');
        card.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
        saveProgress();
      });
      const span = document.createElement('span');
      renderOptionText(span, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      label.appendChild(input);
      label.appendChild(span);
      opts.appendChild(label);
    });
    list.appendChild(card);
  }
  $('pageInfo').textContent = 'Page ' + (page + 1) + ' of ' + Math.ceil(TOTAL / PER_PAGE) + '  (Q' + QUESTIONS[start].n + '–Q' + QUESTIONS[end - 1].n + ')';
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = end >= TOTAL;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const unanswered = TOTAL - Object.keys(answers).length;
  if (unanswered > 0 && !confirm(unanswered + ' question(s) still unanswered — they will count as wrong. Submit anyway?')) return;
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.answer) score++; });
  const pct = Math.round(score / TOTAL * 100);
  $('scoreBig').textContent = score + ' / ' + TOTAL;
  $('scorePct').textContent = pct + '% correct';
  $('scoreMsg').textContent =
    pct >= 90 ? 'Excellent! EPS-TOPIK ready. 🎉' :
    pct >= 70 ? 'Very good! Keep polishing the weak ones.' :
    pct >= 50 ? 'Good start — review the wrong ones below and try again.' :
    'Keep practicing — the explanations below will help.';
  $('quizView').classList.add('hidden');
  $('submitBar').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Renders the explanation as a structured list: the explanation string is
// lines separated by "\n" — first line is the question's own meaning
// ("प्रश्नको अर्थ: ..."), then one line per option ("① <word> ... ✓/✗").
// Lines render as separate rows; the ✓ line gets a green tint and the ✓/✗
// marker is coloured. Explanations without line breaks (fallback prose)
// render as a single paragraph, exactly as before. Uses text nodes only,
// never innerHTML, so explanation text is never parsed as markup.
function renderExplain(box, explain) {
  const lines = (explain || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length <= 1) {
    const b = document.createElement('b');
    b.textContent = 'किन? ';
    box.appendChild(b);
    const s = document.createElement('span');
    s.textContent = explain;
    box.appendChild(s);
    return;
  }
  const label = document.createElement('div');
  label.className = 'explain-label';
  label.textContent = 'व्याख्या';
  box.appendChild(label);
  lines.forEach((ln, li) => {
    const d = document.createElement('div');
    if (li === 0 && ln.indexOf('प्रश्नको अर्थ') === 0) {
      d.className = 'explain-stem';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    if (ln.indexOf('शिक्षकको उत्तर-पत्र:') === 0) {
      d.className = 'exp-note';
      d.textContent = ln;
      box.appendChild(d);
      return;
    }
    const mark = ln.endsWith('✓') ? '✓' : (ln.endsWith('✗') ? '✗' : '');
    const body = mark ? ln.slice(0, -1).trim() : ln;
    d.className = 'exp-line' + (mark === '✓' ? ' exp-ok' : '');
    d.appendChild(document.createTextNode(body + (mark ? ' ' : '')));
    if (mark) {
      const m = document.createElement('span');
      m.className = 'exp-mark ' + (mark === '✓' ? 'ok' : 'no');
      m.textContent = mark;
      d.appendChild(m);
    }
    box.appendChild(d);
  });
}

function renderReview() {
  const list = $('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const mine = answers[i];
    const ok = mine === q.answer;
    if (reviewFilter === 'wrong' && ok) return;
    if (reviewFilter === 'correct' && !ok) return;
    const card = document.createElement('div');
    card.className = 'review-card ' + (ok ? 'correct' : 'wrong');
    card.innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Correct' : '✗ Wrong') + ' — Question ' + q.n + '</div>' +
      '<div class="q-text"></div>' +
      '<div class="rev-opts"></div>' +
      '<div class="explain"></div>';
    card.querySelector('.q-text').textContent = q.q;
    const optsBox = card.querySelector('.rev-opts');
    if (mine === undefined) {
      const note = document.createElement('div');
      note.className = 'rev-no-answer';
      note.textContent = 'उत्तर दिएनौ';
      optsBox.appendChild(note);
    }
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div');
      row.className = 'rev-opt';
      if (oi === q.answer) row.classList.add('rev-opt-correct');
      if (mine !== undefined && oi === mine && mine !== q.answer) row.classList.add('rev-opt-mine-wrong');
      const text = document.createElement('span');
      text.className = 'rev-text';
      renderOptionText(text, circled[oi], opt, (q.underlined && q.underlined[oi]) || '');
      row.appendChild(text);
      if (oi === q.answer) {
        const b = document.createElement('span');
        b.className = 'badge badge-correct';
        b.textContent = '✓ सही उत्तर';
        row.appendChild(b);
      }
      if (mine !== undefined && oi === mine) {
        const b = document.createElement('span');
        b.className = 'badge ' + (mine === q.answer ? 'badge-mine' : 'badge-mine-wrong');
        b.textContent = '→ तिम्रो उत्तर';
        row.appendChild(b);
      }
      optsBox.appendChild(row);
    });
    renderExplain(card.querySelector('.explain'), q.explain);
    list.appendChild(card);
  });
  if (!list.children.length) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No questions in this filter.</p>';
  }
}

$('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderPage(); saveProgress(); } });
$('nextBtn').addEventListener('click', () => { if ((page + 1) * PER_PAGE < TOTAL) { page++; renderPage(); saveProgress(); } });
$('submitBtn').addEventListener('click', submitQuiz);
$('clearBtn').addEventListener('click', () => {
  if (!confirm('Sabai answers clear garne? Saved progress pani delete hunchha.')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  page = 0;
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('retryBtn').addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  clearProgress();
  submitted = false; page = 0; reviewFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  $('submitBar').classList.remove('hidden');
  renderPage(); updateProgress();
  window.scrollTo({ top: 0 });
});
$('reviewTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
document.querySelectorAll('.filters button').forEach(b => {
  b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    renderReview();
  });
});

renderPage();
updateProgress();
</script>
</body>
</html>
